# Race configuration, owned by the user. Read by tools/race_launch.py, tools/race_progress.py
# and tools/compute_broker.py.

start_tag = "race-start"
deadline = "2026-11-26T18:00:00Z"   # full nine-team race only (tools/race_launch.py); the pilots have no deadline, only a budget
repo = "https://github.com/knoel99/milady-2027.git"

[budget]
api_usd = 200                 # per provider, enforced by a spending cap in the provider's console
cpu_hours = 400               # vCPU-hours per team through the compute broker (16 vCPU x 25 h)
max_job_hours = 2             # per broker job (AGENTS.md rule 3)

[machines]
# Scaleway instance types; check prices on the Scaleway pricing page before the launch.
team_vm = "POP2-4C-16G"       # one per team for the whole week: the agent and quick runs
job_vm = "POP2-HC-16C-32G"    # broker jobs
zone = "fr-par-2"

[main_session]
# Tier and reasoning level of each team's main session.
tier = "frontier"
reasoning = "high"
max_turns = 300               # per harness invocation; the launcher loops until the deadline

# team name = section of agents/providers.toml, and the provider key variable it needs.
[teams]
claude = "ANTHROPIC_API_KEY"
openai = "OPENAI_API_KEY"
google = "GEMINI_API_KEY"
xai = "XAI_API_KEY"
mistral = "MISTRAL_API_KEY"
zhipu = "ZAI_API_KEY"
moonshot = "MOONSHOT_API_KEY"
deepseek = "DEEPSEEK_API_KEY"
alibaba = "DASHSCOPE_API_KEY"

# API prices in USD per million tokens, for tools/usage_report.py (Anthropic's model table,
# read on 2026-11-12). Cache writes cost cache_write_5m_x / cache_write_1h_x times the input price
# (Anthropic's standard multipliers, to re-check on the pricing page); fast mode is counted 2x.
[pricing.claude-fable-5-2]
input = 8.0
output = 40.0
cache_read = 0.20
cache_write_5m_x = 1.25
cache_write_1h_x = 2.0

[pricing.claude-opus-5-5]
input = 4.0
output = 20.0
cache_read = 0.20
cache_write_5m_x = 1.25
cache_write_1h_x = 2.0

[pricing.claude-sonnet-5-5]
input = 2.0
output = 10.0
cache_read = 0.10
cache_write_5m_x = 1.25
cache_write_1h_x = 2.0

[pricing.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_write_5m_x = 1.25
cache_write_1h_x = 2.0

# GPU jobs of the pilot, run on RunPod by tools/runpod_job.py (catalog read on 2026-11-12).
[gpu]
repo = "https://github.com/knoel99/milady-2027.git"
image = "runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404"   # RunPod official template runpod-torch-v280, CUDA 12.8.1
min_cuda = "12.8"                                          # Blackwell needs CUDA 12.8 or later
fallback = ["NVIDIA RTX PRO 4500 Blackwell", "NVIDIA GeForce RTX 5090", "NVIDIA GeForce RTX 4090",
            "NVIDIA RTX A6000", "NVIDIA A40", "NVIDIA L40S", "NVIDIA RTX PRO 6000 Blackwell Server Edition",
            "NVIDIA A100-SXM4-80GB"]                       # tried in order: a LOW stock read can still refuse a create
clouds = ["SECURE", "COMMUNITY"]                           # the whole list on Secure Cloud, then on Community Cloud
fp64 = "NVIDIA H100 80GB HBM3"                             # float64 validation only, pass it with --gpu
data_centers = ["EU-CZ-1", "EU-NL-1", "EU-RO-1", "EU-SE-1", "EUR-IS-1", "EUR-NO-1"]   # preferred, not required
disk_gb = 40
max_job_hours = 2
outputs = ["experiments/results", "site/experiments/figures"]
budget_usd = 140                                           # of the 150 USD prepaid credit: 10 USD margin for storage and rounding
approval_fraction = 1.0                                    # owner approval needed past this share of the budget (1.0: none)
credit_usd = 150                                           # prepaid RunPod credit, shared by every pilot on the account
credit_margin_usd = 5                                      # a job must leave this much of the credit (billing lags)
max_parallel = 4                                           # GPU jobs at once (all sessions on the account); run them in the background

# When the encadrant and the jury step in (tools/review_due.py): events and elapsed time, no weeks.
[reviews]
start = "2026-11-12T16:45:00Z"                              # start of the Claude pilot; MILADY_START overrides
encadrant_watch = ["experiments/results", "research/hypotheses.json", "src/milady/sim", "experiments"]
encadrant_max_gap_hours = 6                                 # a review at least this often while work goes on
jury_fractions = [0.25, 0.5, 0.75, 0.95]                    # of the GPU budget spent ([gpu] budget_usd or MILADY_GPU_BUDGET_USD)
jury_watch = ["research/race-report.md", "site/report", "site/thesis", "site/teams"]

[publish]
# Where a team publishes its data and model files when it cannot create a GitHub release (race/GOAL.md).
# Empty until the owner chooses one (for example a Hugging Face organisation, with its token in each team's env).
storage = ""
