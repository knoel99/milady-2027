# Tier 2 campaign (PhD): kinematic dynamo of the ABC flow (A = B = C = 1), sweep over Rm.
#
# Induction equation only, u prescribed (ABC, kf = 1, 2π box): Rm = 1/η (E3 convention).
# Landmarks measured by experiments/e3_abc.py at 32³: λ < 0 for Rm < 8.87, dynamo window
# 8.87 < Rm < 17.6 (λ max ≈ 0.008 near Rm = 12), λ < 0 up to 26.8, then λ > 0 beyond.
# Since the problem is linear, B is renormalised (‖B‖ = 1 at each output); the true amplitude
# is the log_b_rms diagnostic and the fitted growth rate is recorded in the catalogue
# (growth_rate_fit diagnostic, simulation notes). Output: dominant eigenmodes B(x; Rm).
#
# Cost: measured on CPU (2 threads, shared machine) ≈ 0.03 s per step and per trajectory at 64³ in
# kinematic mode (≈ 1/3 to 1/2 of the dynamic mode, see src/milady/sim/mhd3d.py, BENCHMARK_NOTES); the effective
# step is set by the CFL condition (≈ 0.01 at 64³). On GPU, first measure
#   python -m milady.sim.mhd3d bench --n 64 --mode kinematic --device cuda
# then adjust resources.time (Slurm template) accordingly.
#
# Run:       make sweep CONFIG=infra/configs/palier2_abc3d.yaml                         (VM, Docker)
#            python -m milady.sweep infra/configs/palier2_abc3d.yaml --scheduler slurm   (cluster)
name: palier2_abc3d
description: >-
  Kinematic ABC 1:1:1 dynamo at 64³: Rm from 4 to 40 (step 1), 2 random magnetic seeds per Rm,
  20 snapshots of the renormalised magnetic field after 150 time units of transient.
code: mhd3d_torch
grid:
  N: 64
  domain: 2pi
fixed:
  mode: kinematic
  flow: abc
  abc_A: 1.0
  abc_B: 1.0
  abc_C: 1.0
  kf: 1
  U_ref: 1.0
  b0_amp: 1.0
sweep:
  Rm: {start: 4, stop: 40, step: 1}    # 37 simulations
runtime:
  dt: 0.02                # maximum step; automatically reduced by the CFL condition
  cfl: 1.0
  t_burn: 150.0           # transient: the subdominant modes decay (λ ~ 1e-2 near the thresholds)
  t_keep: 100.0
  every: 5.0              # 20 snapshots
  diag_every: 0.5         # time series (ln‖B‖, helicities...) for fitting λ
  n_traj: 2
  device: auto
  dtype: float32
  checkpoint_every_s: 900
  checkpoint_to_storage: false   # true on a preemptible instance: checkpoint also in S3
resources:
  gpus: 1
  cpus: 8
  time: "02:00:00"
  mem: null
  max_parallel: 16
output:
  format: mff
  uri: ${MILADY_STORAGE_URI}
  fields: [velocity, magnetic_field]   # u is constant in kinematic mode: remove "velocity" to save ~50%
  spectral: false
  dataset_name: milady_palier2_abc3d
