# Tier 2 training (PhD): conditional flow matching of 3D MHD fields (u, B) under hard constraints.
#
# Data: campaign stage2_tg3d (forced Taylor–Green MHD, Re × Pm), MFF files recorded in the catalogue.
# Representation: vector potentials A_u, A_B in Coulomb gauge, Fourier coefficients |m| ≤ kmax
# (Craya–Herring basis, per-mode normalisation); decoding u = ∇×A_u, B = ∇×A_B: ∇·u = ∇·B = 0 exactly.
# Conditioning: log Re, log Pm (normalised over the training range).
#
# Run (from the repository root):
#   make train CONFIG=infra/configs/train_fm3d.yaml [NGPUS=4]              GPU VM (torchrun, one process per GPU)
#   sbatch infra/slurm/train.sbatch infra/configs/train_fm3d.yaml           Slurm cluster (multi-node possible)
#   python -m milady.train.fm3d --config infra/configs/train_fm3d.yaml --files data/store/…/fields.h5   (portable)
#   make eval  CONFIG=infra/configs/train_fm3d.yaml [MODEL=<uuid>]          evaluation (otherwise the latest model "name")
# Fine-tuning with the stationarity loss (variant V5 of E2, in 3D), from a trained model:
#   python -m milady.train.fm3d --config infra/configs/train_fm3d.yaml --init-from <…/final.pt> \
#       --set stationarity.enabled=true stationarity.anchor=1.0 stationarity.beta_warmup=500 train.iters=2000 train.lr=1e-4 train.warmup=0
# Any key can be overridden on the command line: --set train.batch_size=32 model.architecture=transformer
#
# Orders of magnitude (kmax = 8: 1054 modes × 8 channels = 8432 dimensions; MLP 1024 × 6 ≈ 48 M parameters, counted on the built model):
# time per iteration on GPU not measured (no GPU on the development machine): measure it with a short
# training run (`--set train.iters=200`); the stationarity loss adds ≈ 2 × steps
# network evaluations on n_cond × n_per samples per iteration where it is active.

name: fm3d_tg3d
description: >-
  Conditional flow matching (Re, Pm) of 3D Taylor–Green (u, B) fields at 64³, Fourier vector potentials
  truncated at |m| ≤ 8, exact B → −B symmetry.

data:
  # Source: catalogue dataset ("name" or "name:version"), overridden by --dataset or --files.
  dataset: milady_stage2_tg3d
  version: null                    # null: latest version
  # If it does not exist yet, it is created from the finished simulations of this campaign
  # ("fields" files); the listed points go to validation / test, the others to training.
  campaign: stage2_tg3d
  auto_dataset:
    val:
      - {Re: 100, Pm: 1.0}
    test:
      - {Re: 50, Pm: 2.0}
  files: []                        # explicit list of URIs (file://, s3://, .zarr): takes precedence over dataset
  fields: [velocity, magnetic_field]
  kmax: 8                          # truncation radius (integer indices); grid >= 2 kmax + 1 points
  conditioning:
    - {name: Re, transform: log}
    - {name: Pm, transform: log}
  t_min: null                      # discard the transient (simulated time), e.g. 110.0
  stride: 1                        # one snapshot out of every "stride"
  max_snapshots_per_file: null
  read_chunk: 8                    # snapshots read at a time (bounded memory)
  cache_dir: ${MILADY_CACHE_DIR:-/tmp/milady-cache}   # local copies of s3:// files
  on_device: true                  # latents on the GPU (≈ 34 KB per snapshot at kmax = 8)

model:
  architecture: mlp                # mlp | transformer
  symmetry_b_sign: true            # equivariant symmetrisation A_B → −A_B (generated law invariant under B → −B)
  mlp:
    width: 1024
    depth: 6
    expansion: 2
    emb_dim: 256
    n_freq: 16
    dropout: 0.0
  transformer:                     # lightweight transformer (DiT) on tokens of neighbouring modes in |m|
    d_model: 192
    depth: 6
    heads: 6
    mlp_ratio: 4
    modes_per_token: 4
    emb_dim: 256
    n_freq: 16
    dropout: 0.0

train:
  iters: null                      # null: epochs × (batches per epoch)
  epochs: 200
  batch_size: 64                   # per process (effective batch = batch_size × number of GPUs)
  lr: 3.0e-4
  lr_min: 1.0e-5                   # cosine decay after the warmup
  warmup: 500
  weight_decay: 0.0
  grad_clip: 1.0
  ema: 0.999                       # exponential moving average of the weights (used at sampling)
  precision: auto                  # auto: bf16 on GPUs that support it, fp32 otherwise; bf16 | fp32
  seed: 0
  log_every: 50
  val_every: 500
  ckpt_every: 1000                 # last.pt (local or S3); automatic resume on restart (--run-name, Slurm)
  augment_b_sign: false            # random flip of B (useless if symmetry_b_sign)
  t_sampling: uniform              # uniform | logit_normal
  device: auto                     # auto | cuda | cpu
  num_threads: null
  init_from: null                  # initialisation checkpoint (fine-tuning)
  resume: auto                     # auto | never | <path or URI>
  workdir: ${MILADY_RUN_DIR:-data/runs}   # local log when checkpoints go to S3

stationarity:
  # Stationarity loss in law: E[injection − ν⟨|ω|²⟩ − η⟨|j|²⟩] = 0 at any condition (drawn in
  # cond_range, normalised range [0, 1] = training range), unbiased estimator using two half-batches.
  enabled: false
  beta: 10.0
  start_iter: 0
  every: 1                         # one iteration out of every "every"
  n_cond: 4                        # conditions per iteration
  n_per: 16                        # samples per condition (even)
  steps: 8                         # differentiable Heun steps
  balance: total                   # total | kinetic | magnetic
  injection: forcing               # forcing (⟨f·u⟩, ABC/TG forcing of the dataset) | param (value of a parameter) | none
  injection_param: eps             # for injection: param (random forcing of power eps)
  growth_rate: 0.0                 # magnetic balance: λ (number or parameter name) in P − η⟨j²⟩ = λ⟨B²⟩
  cond_range: [0.0, 1.0]           # [-0.1, 1.1] to impose the law slightly beyond the range as well
  # Safeguards (experiment E1: from a biased model, the loss alone diverged for one seed out of two):
  anchor: 0.0                      # anchoring to the starting weights (init_from): anchor × mean of (θ − θ₀)²
  beta_warmup: 0                   # linear ramp-up of beta over this number of active iterations

sampling:
  steps: 50                        # Heun steps at sampling

checkpoint:
  uri: null                        # null: MILADY_MODELS_URI (s3://milady-models in the compose), otherwise
                                   # {MILADY_STORAGE_URI}/_models; layout {uri}/{name}/{run}/last.pt, final.pt

mlflow:
  experiment: milady-fm3d          # used if MLFLOW_TRACKING_URI is set
  log_checkpoint: false            # also copy final.pt into the MLflow artifacts

catalog:
  enabled: true                    # model, task and evaluations in the catalogue (MILADY_DB_URL)
  url: null
  required: false                  # true: a catalogue failure stops the training

eval:
  after_train: true                # quick evaluation at the end of training, recorded in the catalogue
  points: []                       # []: points of the training, validation and test files
  max_points: 12
  n_samples: 64
  seed: 0
  steps: 50
  grid: null                       # null: even grid >= 3 kmax + 1 (products without aliasing)
  batch_size: 16
  n_ref: 128                       # at most this many reference snapshots per point
  reference_dataset: null          # null: training dataset (all splits, matched by parameters)
  reference_split: null
