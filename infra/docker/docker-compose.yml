# MilaDy service stack: PostgreSQL catalogue, S3 object storage (MinIO), MLflow tracking,
# compute containers (CPU or GPU) and Jupyter (optional).
#
# Usage (from the repository root; the Makefile does all of this):
#   cp infra/docker/.env.example infra/docker/.env   # then change the passwords
#                                                    # (bootstrap_vm.sh does it automatically)
#   docker compose -f infra/docker/docker-compose.yml --env-file infra/docker/.env up -d --wait
#   docker compose -f infra/docker/docker-compose.yml --env-file infra/docker/.env run --rm worker bash
#
# Profiles:
#   (none)   db, s3, s3-init, mlflow — started by `make up`;
#   cpu      worker      : image milady:cpu (infra/docker/Dockerfile);
#   gpu      worker-gpu  : image milady:gpu (infra/docker/Dockerfile.gpu) + NVIDIA GPU reservation;
#   jupyter  jupyter     : JupyterLab on port 8888 (bound to 127.0.0.1: go through an SSH tunnel).
#
# Security: all ports are bound to ${BIND_ADDR} (127.0.0.1 by default). On a cloud VM,
# access them through an SSH tunnel (see infra/README.md); do not open 5432/9000/5000 to the Internet.
#
# Building the images: `make image` / `make image-gpu` / `make image-mlflow` (same image names
# as below; only this route accepts MILADY_BUILD_CACERT, a corporate TLS proxy
# certificate); otherwise compose builds the missing images on the first `up`/`run`.
#
# Note on the MinIO image: MinIO Inc. no longer publishes Docker images of the community edition
# (minio/minio and quay.io/minio/minio can no longer be pulled). By default we use the
# community fork pgsty/minio (same AGPLv3 binary, same commands), replaceable with
# MINIO_IMAGE / MC_IMAGE in .env, or with a provider S3 bucket (MILADY_S3_ENDPOINT).

name: ${COMPOSE_PROJECT_NAME:-milady}

# ---------------------------------------------------------------------------------------------
# Reused blocks (YAML anchors)
# ---------------------------------------------------------------------------------------------
x-milady-env: &milady-env
  # Catalogue (SQLAlchemy + psycopg 3).
  MILADY_DB_URL: postgresql+psycopg://${POSTGRES_USER:-milady}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-milady}
  # Object storage: local MinIO by default, or provider bucket (AWS, Scaleway, OVHcloud).
  MILADY_STORAGE_URI: ${MILADY_STORAGE_URI:-s3://milady-data}
  MILADY_MODELS_URI: ${MILADY_MODELS_URI:-s3://milady-models}
  MILADY_S3_ENDPOINT: ${MILADY_S3_ENDPOINT:-http://s3:9000}
  # File storage keys: those of a provider bucket if MILADY_S3_ACCESS_KEY is set
  # (.env, §2.5 of infra/README.md), otherwise the MinIO application account. The provider keys are
  # thus never handed to MinIO (s3-init creates its account with S3_ACCESS_KEY / S3_SECRET_KEY).
  AWS_ACCESS_KEY_ID: ${MILADY_S3_ACCESS_KEY:-${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}}
  AWS_SECRET_ACCESS_KEY: ${MILADY_S3_SECRET_KEY:-${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  # Training tracking.
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-milady}
  # Miscellaneous.
  MILADY_ROOT: /opt/milady
  MILADY_HOST: ${MILADY_HOST:-docker}
  # Commit of the mounted repository (computed by the Makefile on the host: .git is not always mounted).
  MILADY_GIT_COMMIT: ${GIT_COMMIT:-}

x-milady-build-args: &milady-build-args
  MILADY_UID: ${MILADY_UID:-1000}
  MILADY_GID: ${MILADY_GID:-1000}
  GIT_COMMIT: ${GIT_COMMIT:-}

x-milady-worker: &milady-worker
  environment: *milady-env
  working_dir: /opt/milady
  # The repository is mounted on /opt/milady (editable install): the code, the configurations and
  # the host's data/ folder are visible without rebuilding the image.
  volumes:
    - ../..:/opt/milady
  shm_size: "2gb"
  depends_on:
    db:
      condition: service_healthy
    s3-init:
      condition: service_completed_successfully
    mlflow:
      condition: service_healthy
  command: ["sleep", "infinity"]

services:
  # -------------------------------------------------------------------------------------------
  # Catalogue: PostgreSQL 16 ("milady" and "mlflow" databases, created by infra/db/init.sql).
  # -------------------------------------------------------------------------------------------
  db:
    image: ${POSTGRES_IMAGE:-postgres:16.14-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milady}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-milady}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts run only once (fresh volume), in alphabetical order: init.sql (milady and
      # mlflow databases) then schema.sql (catalogue tables) if present.
      - ../db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DB_PORT:-5432}:5432"
    # TCP connection (127.0.0.1): only possible once the initialisation scripts have finished,
    # and the query checks that the mlflow database exists.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" && psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d mlflow -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # -------------------------------------------------------------------------------------------
  # S3-compatible object storage (MinIO). API: 9000; web console: 9001.
  # -------------------------------------------------------------------------------------------
  s3:
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ROOT_USER:-milady-admin}
      MINIO_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?set S3_ROOT_PASSWORD in .env}
    volumes:
      - s3data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${S3_PORT:-9000}:9000"
      - "${BIND_ADDR:-127.0.0.1}:${S3_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # One-off task (idempotent): buckets milady-data, milady-models, mlflow, and an application
  # access account (S3_ACCESS_KEY / S3_SECRET_KEY, readwrite policy) distinct from the root account.
  s3-init:
    image: ${MC_IMAGE:-pgsty/mc:RELEASE.2026-10-18T00-00-00Z}
    depends_on:
      s3:
        condition: service_healthy
    environment:
      S3_ROOT_USER: ${S3_ROOT_USER:-milady-admin}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:?set S3_ROOT_PASSWORD in .env}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://s3:9000 "$${S3_ROOT_USER}" "$${S3_ROOT_PASSWORD}"
        for bucket in milady-data milady-models mlflow; do
          mc mb --ignore-existing "local/$${bucket}"
        done
        # Versioning of the checkpoints (protection against accidental overwriting).
        mc version enable local/milady-models
        mc admin user add local "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mc admin policy attach local readwrite --user "$${S3_ACCESS_KEY}" 2>/dev/null \
          || echo "readwrite policy already attached to $${S3_ACCESS_KEY}"
        mc ls local
        echo "s3-init: buckets and application account ready."
    restart: "no"

  # -------------------------------------------------------------------------------------------
  # Training tracking: MLflow (metadata in PostgreSQL/mlflow, artifacts in s3://mlflow,
  # served by the server: clients do not need the S3 keys to log).
  # -------------------------------------------------------------------------------------------
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: milady-mlflow:3.17.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://s3:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      # Database URI (with password) passed through the environment (the --backend-store-uri option of
      # `mlflow server`) rather than as an argument: invisible in the host's process list (ps).
      # Explicit driver: SQLAlchemy 2.1 now maps "postgresql://" to psycopg 3.
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-milady}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mlflow
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=2
      - --artifacts-destination=${MLFLOW_ARTIFACTS_DESTINATION:-s3://mlflow}
      - --serve-artifacts
      # Accepted Host headers (MLflow 3 DNS rebinding protection): service name in the
      # compose network + local access / SSH tunnel.
      - --allowed-hosts=${MLFLOW_ALLOWED_HOSTS:-mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 20s

  # -------------------------------------------------------------------------------------------
  # Compute containers (simulations, training, evaluation). Started on demand:
  #   docker compose ... run --rm worker python -m milady.sweep infra/configs/palier2_abc3d.yaml
  # -------------------------------------------------------------------------------------------
  worker:
    <<: *milady-worker
    profiles: ["cpu"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: *milady-build-args
    image: ${MILADY_IMAGE:-milady}:cpu

  worker-gpu:
    <<: *milady-worker
    profiles: ["gpu"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gpu
      args: *milady-build-args
    image: ${MILADY_IMAGE:-milady}:gpu
    # Shared memory for NCCL / multi-process DataLoader.
    shm_size: "16gb"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # -------------------------------------------------------------------------------------------
  # JupyterLab (optional): make jupyter, then SSH tunnel to port 8888.
  # -------------------------------------------------------------------------------------------
  jupyter:
    <<: *milady-worker
    profiles: ["jupyter"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args:
        <<: *milady-build-args
        WITH_JUPYTER: "1"
    image: ${MILADY_IMAGE:-milady}:cpu-jupyter
    restart: unless-stopped
    # Token read by Jupyter Server from the JUPYTER_TOKEN variable (not as an argument: invisible in ps).
    environment:
      <<: *milady-env
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?set JUPYTER_TOKEN in .env}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${JUPYTER_PORT:-8888}:8888"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.root_dir=/opt/milady
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/api', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 10s

volumes:
  pgdata:
  s3data:
