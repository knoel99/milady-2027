#cloud-config
# User data ("user-data") to create a ready-to-use MilaDy VM from the console
# of a cloud provider (Scaleway, OVHcloud, AWS, GCP, Azure, Lambda, RunPod...: "cloud-init" field,
# "user data" or "startup script"). Equivalent of:
#   git clone $MILADY_REPO_URL && cd milady-2027 && sudo infra/deploy/bootstrap_vm.sh
#
# BEFORE PASTING: adapt the variables of the /etc/milady/bootstrap.env file below.
#   MILADY_REPO_URL        repository URL (public HTTPS, or private repository: see infra/README.md —
#                          deploy key, or rather use deploy_remote.sh from the laptop)
#   MILADY_BRANCH          branch or tag to deploy
#   MILADY_USER            user owning the repository (ubuntu on most Ubuntu images)
#   MILADY_BOOTSTRAP_ARGS  bootstrap_vm.sh options (--cpu, --no-smoke)
#
# Installation progress (5 to 20 min depending on bandwidth and GPU):
#   ssh ubuntu@IP 'sudo tail -f /var/log/milady-bootstrap.log'
#   cloud-init status --wait
# No secret here: the passwords are generated on the VM (infra/docker/.env).

write_files:
  - path: /etc/milady/bootstrap.env
    permissions: "0644"
    content: |
      MILADY_REPO_URL=https://github.com/knoel99/milady-2027.git
      MILADY_BRANCH=main
      MILADY_USER=ubuntu
      MILADY_BOOTSTRAP_ARGS=
  - path: /usr/local/sbin/milady-cloud-init.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      # Clone (or update) the repository then run bootstrap_vm.sh; idempotent.
      set -euo pipefail
      # shellcheck disable=SC1091
      . /etc/milady/bootstrap.env
      if ! id "${MILADY_USER}" >/dev/null 2>&1; then
          useradd --create-home --shell /bin/bash --groups sudo "${MILADY_USER}"
      fi
      home="$(getent passwd "${MILADY_USER}" | cut -d: -f6)"
      dir="${home}/milady-2027"
      if [[ -d "${dir}/.git" ]]; then
          sudo -u "${MILADY_USER}" git -C "${dir}" fetch --tags origin
          sudo -u "${MILADY_USER}" git -C "${dir}" checkout "${MILADY_BRANCH}"
          sudo -u "${MILADY_USER}" git -C "${dir}" pull --ff-only || true
      else
          sudo -u "${MILADY_USER}" git clone --branch "${MILADY_BRANCH}" "${MILADY_REPO_URL}" "${dir}"
      fi
      cd "${dir}"
      # shellcheck disable=SC2086
      SUDO_USER="${MILADY_USER}" infra/deploy/bootstrap_vm.sh ${MILADY_BOOTSTRAP_ARGS}

package_update: true
packages:
  - git
  - make
  - curl
  - ca-certificates

runcmd:
  - [bash, -c, "set -o pipefail; /usr/local/sbin/milady-cloud-init.sh 2>&1 | tee -a /var/log/milady-bootstrap.log"]

final_message: "MilaDy: cloud-init finished after $UPTIME s — log: /var/log/milady-bootstrap.log"
