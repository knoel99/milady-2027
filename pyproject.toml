# Python package "milady": MFF data format, catalogue, storage, 3D MHD solver,
# training (constrained flow matching) and evaluation.
#
# Development install (portable):   make setup
# Docker image:                     infra/docker/Dockerfile (CPU) and Dockerfile.gpu
#
# The exact versions (reproducible lock) are in infra/env/requirements.txt (CPU)
# and infra/env/requirements-gpu.txt (CUDA); here we only give lower bounds.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "milady"
version = "0.1.0"
description = "MilaDy 2027: conditional generative models under physical constraints for parametric MHD fields (MFF format, catalogue, solver, training)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "MilaDy 2027" }]
keywords = ["MHD", "dynamo", "flow matching", "HDF5", "The Well", "HPC"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Base dependencies: everything needed to simulate, write/read the format,
# fill the catalogue (SQLite or PostgreSQL), train and evaluate on CPU.
# torch comes from the PyPI index (CUDA) or from the PyTorch CPU index: see infra/env/.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
    "zarr>=3.0",
    "numcodecs>=0.13",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "fsspec>=2024.6",
    "jsonschema>=4.20",
    "torch>=2.4",
    "mlflow-skinny>=3.0",
    # MLflow SQLite backend on clusters without Internet (MLflow 3 rejects "file" storage).
    "alembic>=1.13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# S3 object storage (MinIO, AWS S3, Scaleway, OVHcloud) via fsspec.
s3 = ["s3fs>=2024.6", "boto3>=1.34"]
# GPU tools (memory/utilization monitoring). CUDA torch is installed via requirements-gpu.txt
# or the pytorch/pytorch image: an extra cannot choose the package index.
gpu = ["nvidia-ml-py>=12.535"]
# Development and tests.
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
# Optional Jupyter service of the docker-compose ("jupyter" profile).
jupyter = ["jupyterlab>=4.2"]

[project.urls]
Homepage = "https://knoel99.github.io/milady-2027/"
Repository = "https://github.com/knoel99/milady-2027"

[tool.setuptools.packages.find]
where = ["src"]
include = ["milady*"]

[tool.setuptools.package-data]
milady = ["**/*.json", "**/*.yaml", "**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: long tests (disabled by default with -m 'not slow')",
    "postgres: requires a PostgreSQL server (MILADY_DB_URL)",
    "s3: requires S3 storage (MILADY_S3_ENDPOINT)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
