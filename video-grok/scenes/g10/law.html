<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>g10.law</title>
    <link rel="stylesheet" href="../../components/stage.css" />
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import { mount } from "../../engine/runtime.js";

      const params = new URLSearchParams(location.search);
      const scene = params.get("document")
        ? await (await fetch(params.get("document"))).json()
        : (await import("./law.json", { with: { type: "json" } })).default;
      mount(scene, document.querySelector("#stage"));
    </script>
  </body>
</html>
