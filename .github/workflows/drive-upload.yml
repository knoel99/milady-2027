# Envoie les films rendus vers Google Drive.
#
# Les films (≈ 550 Mo) dépassent la limite de 100 Mo par fichier de GitHub : ils sont poussés en morceaux
# (`<film>.mp4.part-aa`, `-ab`, …) dans `transfer/` sur une branche temporaire (`video-transfer` par défaut).
# Cette action réassemble chaque film, vérifie sa somme SHA-256 (`<film>.mp4.sha256`) et l'envoie sur Drive
# par un envoi « resumable » de l'API Drive v3. Ensuite, supprimer la branche de transfert.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   GDRIVE_CLIENT_ID, GDRIVE_CLIENT_SECRET  identifiants OAuth « Desktop app » d'un projet Google Cloud
#   GDRIVE_REFRESH_TOKEN                     jeton de rafraîchissement obtenu avec le périmètre drive.file
#   GDRIVE_FOLDER_ID (facultatif)            dossier Drive de destination (sinon la racine « Mon Drive »)
name: drive-upload

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branche qui porte transfer/"
        default: video-transfer
        required: true

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          sparse-checkout: transfer
      - name: Réassembler et vérifier
        run: |
          set -euo pipefail
          cd transfer
          for sum in *.mp4.sha256; do
            f="${sum%.sha256}"
            cat "$f".part-* > "$f"
            rm "$f".part-*
            sha256sum -c "$sum"
          done
          ls -la
      - name: Envoyer sur Google Drive
        env:
          CID: ${{ secrets.GDRIVE_CLIENT_ID }}
          CSECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RTOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          FOLDER: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          tok=$(curl -sS --fail https://oauth2.googleapis.com/token \
            -d client_id="$CID" -d client_secret="$CSECRET" \
            -d refresh_token="$RTOKEN" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$tok"
          cd transfer
          for f in *.mp4; do
            if [ -n "${FOLDER:-}" ]; then
              meta=$(jq -nc --arg n "$f" --arg p "$FOLDER" '{name:$n, parents:[$p]}')
            else
              meta=$(jq -nc --arg n "$f" '{name:$n}')
            fi
            size=$(stat -c %s "$f")
            loc=$(curl -sS --fail -D - -o /dev/null -X POST \
              "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable" \
              -H "Authorization: Bearer $tok" -H "Content-Type: application/json; charset=UTF-8" \
              -H "X-Upload-Content-Type: video/mp4" -H "X-Upload-Content-Length: $size" \
              -d "$meta" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
            curl -sS --fail -X PUT "$loc" -H "Content-Type: video/mp4" --upload-file "$f" \
              | jq '{id, name}'
            echo "envoyé : $f ($size octets)"
          done
