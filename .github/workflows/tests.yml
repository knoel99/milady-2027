# Tests and lint of the milady package (src/milady, tests/).
#
# Installs the pinned CPU lock (infra/env/requirements.txt), as `make setup` does, then runs the
# fast tests (`make test`: pytest -m "not slow") and ruff with the rules of pyproject.toml.
# Also checks that the generated agent files match agents/roles/ (tools/sync_agents.py --check).
# The site is built separately by pages.yml.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/env/requirements.txt

      - name: Agent files in sync with agents/roles
        run: python tools/sync_agents.py --check

      - name: Install the pinned dependencies
        run: |
          python -m pip install -r infra/env/requirements.txt
          python -m pip install --no-deps -e .
          python -m pip install pytest==9.2.0 ruff==0.17.4

      - name: Lint
        run: python -m ruff check src tests

      - name: Tests
        run: python -m pytest -m "not slow"
