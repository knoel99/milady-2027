<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="160mm" height="64mm" viewBox="0 0 453.543 181.417" data-name="null-panel"><defs/><rect x="0" y="0" width="453.5433070866142" height="181.4173228346457" fill="#fff" data-role="background"/><g id="root"><g transform="translate(5.669291338582678 5.669291338582678)" data-panel="a"><text x="0" y="7.6" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="bold" fill="#1a1a1a" text-anchor="start" data-role="panel"><tspan x="0">a</tspan></text><text x="8" y="22" font-family="Arial, Helvetica, sans-serif" font-size="7" font-weight="700" fill="#1a1a1a" text-anchor="start" data-role="label"><tspan x="8">One periodic cell</tspan></text><rect x="8" y="32" width="28" height="28" fill="#f7f7f4" stroke="#2b2b2b" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="46" r="1.4" fill="#D55E00" stroke="none"/><text x="44" y="40" font-family="Arial, Helvetica, sans-serif" font-size="6" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label"><tspan x="44">Trilinear interpolant on the cell.</tspan></text><text x="44" y="52" font-family="Arial, Helvetica, sans-serif" font-size="6" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label"><tspan x="44">Eliminate one coordinate. Resultant of the other two.</tspan></text><text x="44" y="64" font-family="Arial, Helvetica, sans-serif" font-size="6" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label"><tspan x="44">A root on the upper face belongs to the next cell.</tspan></text><text x="44" y="76" font-family="Arial, Helvetica, sans-serif" font-size="6" font-weight="normal" fill="#1a1a1a" text-anchor="start" data-role="label"><tspan x="44">Keep the root only if the interpolant is about zero.</tspan></text></g></g></svg>