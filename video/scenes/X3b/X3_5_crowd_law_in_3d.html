<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X3.5 Bet: the crowd law in 3D</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X3b.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X3b_kit.js"></script>
<style>
  .kit-seat-col { gap: 12px !important; }
</style>
</head><body><div id="stage"></div>
<script>
/* X3.5 Bet: the crowd law in 3D (L5, NIGHT, PENDING: CONJECTURE low). The three-lane race of 08.5 as empty seats for
   the 3D generator; the 2D race (data/e2_eval.json, V5 vs control, test values) as grey READY ghosts; Kit.seat
   'lamps' for data/fm3d_stationarity.json under the lanes. No number of the missing result. */
Scene.define({
  duration: 41, register: 'night',
  cues: { recall: 0.8, race: 6.0, bet: 14.8, why: 23.8, ask: 31.0 },
  data: { seat: { url: 'data/fm3d_stationarity.json', optional: true }, ev: 'data/e2_eval.json' },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, EV = ctx.data.ev, res = ctx.variant === 'result';
    window.__EVENTS__ = [{ t: +(ctx.at('bet') + 0.3).toFixed(3), id: 'pop', gain_db: -24 }];
    const MT = P.module_tag; K.lowerThird(ctx, { kind: 'chapter', l1: MT.l1, l2: MT.l2, at: -0.2, out: Math.min(MT.hold, ctx.at('race') - 0.3) });
    K.rail(ctx, { from: 'L5', to: 'L5', at: -0.2, hold: 2.6 });
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'low', at: -0.3 });
    // banner
    const svg = K.svgLayer(ctx, 12), bn = K.s('g', {}, svg);
    [[0, 0], [8, -8]].forEach(([dx, dy]) => K.s('rect', { x: 130 + dx, y: 110 + dy, width: 44, height: 54, rx: 4, fill: K.c('bg'), stroke: K.c('metric'), 'stroke-width': 3 }, bn));
    
    XK.timed(ctx, bn, 'recall-0.15', null);
    XK.lab(ctx, P.banner.text, 200, 112, { color: 'metric', at: 'recall' }); XK.lab(ctx, '· ' + P.banner.box_label, 760, 112, { at: 'recall+0.2' });
    // lanes (compact: y 236 / 316 / 416), tracks x 580–1180
    const TX = [560, 1080], ly = [222, 296, 368], AB = P.axis_budget, AS = P.axis_spread, lg = (v) => TX[0] + (TX[1] - TX[0]) * (Math.log10(v) - Math.log10(AB.min)) / (Math.log10(AB.max) - Math.log10(AB.min)), ln = (v) => TX[0] + (TX[1] - TX[0]) * (v - AS.min) / (AS.max - AS.min);
    const lanes = K.s('g', {}, svg);
    P.lanes.forEach((L, k) => { K.s('line', { x1: TX[0], x2: TX[1], y1: ly[k], y2: ly[k], stroke: K.c('muted'), 'stroke-width': 2 }, lanes); XK.lab(ctx, L.label, 110, ly[k] - 34, { w: 420, cls: 'small right',  at: XK.at(ctx, 'race', 0.1 * k - 0.15) }); });
    AB.ticks.forEach((v, i) => { K.s('line', { x1: lg(v), x2: lg(v), y1: ly[1], y2: ly[1] + 8, stroke: K.c('muted'), 'stroke-width': 2 }, lanes); K.s('text', { x: lg(v), y: ly[1] + 38, 'text-anchor': 'middle', class: 'kt-tick' }, lanes, AB.tick_labels[i]); });
    K.s('line', { x1: lg(AB.bar), x2: lg(AB.bar), y1: ly[0] - 30, y2: ly[1] + 10, stroke: K.c('metric'), 'stroke-width': 3, 'stroke-dasharray': '8 6' }, lanes);
    K.s('rect', { x: ln(AS.band[0]), y: ly[2] - 18, width: ln(AS.band[1]) - ln(AS.band[0]), height: 36, fill: K.rgba(K.c('chalk'), 0.1), stroke: K.c('chalk'), 'stroke-dasharray': '6 5' }, lanes);
    AS.ticks.forEach((v) => { K.s('line', { x1: ln(v), x2: ln(v), y1: ly[2], y2: ly[2] + 8, stroke: K.c('muted'), 'stroke-width': 2 }, lanes); if (v >= 1) K.s('text', { x: ln(v), y: ly[2] + 38, 'text-anchor': 'middle', class: 'kt-tick' }, lanes, K.fmt(v, 2)); });
    XK.timed(ctx, lanes, 'race-0.15', null);
    XK.lab(ctx, AB.bar_label, lg(AB.bar) - 10, ly[0] + 8, { anchor: 'r', cls: 'small', color: 'metric', at: 'race+0.4' });
    XK.lab(ctx, `${AB.title} · ${AS.title} (lane 3)`, TX[1] + 20, ly[0] - 40, { cls: 'small', color: 'muted', w: 560, at: 'race+0.4', out: 'bet-0.15' });
    // 2D ghosts from data (V5 vs control, test means)
    const g = (path) => XK.get(EV, path.split(' ')[0].replace(/^ev\./, '')), b2 = g(P.ghost_2d.read.budget), c2 = g(P.ghost_2d.read.control), s2 = g(P.ghost_2d.read.spread), sc2 = g(P.ghost_2d.read.spread_control);
    const tg = [XK.frac(ctx, 'race', 0.45, 2.5), XK.frac(ctx, 'race', 0.75, 4), XK.frac(ctx, 'race', 0.98, 5.4)];
    const gh = [[lg(b2), ly[0], `2D: ${K.fmt(100 * b2, 2)} %`], [lg(c2), ly[1], `2D: ${K.fmt(100 * c2, 2)} %`], [ln(s2), ly[2], `2D: ${K.fmt(s2, 2)}`]]; const gx = [0, 0, TX[1] + 4 - ln(s2)];
    gh.forEach(([x, y, l], k) => { const c = K.s('circle', { cx: x, cy: y, r: 10, fill: 'none', stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '3 3' }, svg); XK.timed(ctx, c, tg[k], null, { raw: true, dim: ['bet-0.15', 0.3] });
      XK.lab(ctx, l, x + 16 + gx[k], k === 0 ? y + 12 : k === 2 ? y - 18 : y - 46, { cls: 'small', color: 'muted', at: tg[k] + 0.1, raw: true, dim: ['bet-0.15', 0.3] }); });
    const ct = K.s('line', { x1: ln(sc2), x2: ln(sc2), y1: ly[2] - 14, y2: ly[2] + 14, stroke: K.c('muted'), 'stroke-width': 3 }, svg); XK.timed(ctx, ct, tg[2], null, { raw: true, dim: ['bet-0.15', 0.3] });
    K.chip(ctx, { text: P.ghost_2d.chip, kind: 'plain', x: 120, y: 790, at: XK.at(ctx, 'race', 1.0), out: 'bet-0.3' });
    // seat (lamps) under the lanes
    const SE = P.seat, fr = { x: 216, y: 500, w: 800, h: 250 };
    K.seat(ctx, { type: 'lamps', variant: ctx.variant, data: ctx.data.seat, tag: SE.tag, frame: fr, lamps: SE.lamps,
      bet: SE.bet, confidence: SE.confidence, criterion: SE.criterion, source: SE.source, ask: SE.ask,
      cues: res ? { frame: 'recall', bet: 'recall', criterion: 'data', ask: 'caveat', data: 'data' } : { frame: 'bet-0.15', bet: 'bet', criterion: 'bet+1.5', ask: 'ask', data: 'bet' } });
    XK.lab(ctx, SE.lampsTitle, 120, 776, { w: 940, cls: 'mono', at: res ? 'recall' : 'bet', out: res ? undefined : 'ask-0.2' });
    if (!res) XK.lab(ctx, 'saturated runs only: the flag of 10.5 decides which points count', 120, 790, { cls: 'small', color: 'muted', at: 'ask-0.15' });
    K.formulaLayer(ctx);
  },
});
</script></body></html>
