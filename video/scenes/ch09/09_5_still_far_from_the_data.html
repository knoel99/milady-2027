<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>09.5 Still far from the data</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch09.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>

</head><body><div id="stage"></div>
<script>
/* 09.5 Still far from the data (L4, NIGHT, MEASURED). Two log-scale bar panels read against their noise floors:
   E1 distribution distance at the test values (3 machines, optimistic floor, about x 2) and E2 spectrum error
   (7 variants, honest floor of the training values, about x 6; optimistic test floor faint). Then the seed counts
   and the interpolation-only rulers. Values from data/e1_eval.json, data/e2_eval.json, data/ch09_rice.json
   (factors), data/e1_finegrid.json (Γ train/test). */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { floor: 0.4, dials: 3.4, sheet: 9.6, seeds: 17.6, between: 23.0 },
  data: { e1: 'data/e1_eval.json', e2: 'data/e2_eval.json', rice: 'data/ch09_rice.json', grid: 'data/e1_finegrid.json' },
  params: {
    panel_e1: { x0: 120, x1: 760, y0: 220, y1: 560, axis: { log: true, min: 0.001, max: 0.03 } },
    panel_e2: { x0: 860, x1: 1800, y0: 220, y1: 560, axis: { log: true, min: 0.001, max: 0.5 } },
    names_e1: { A_reference: 'plain', B_augmentation: 'augmentation', C_equivariant: 'built-in mirror' },
    names_e2: { V0_libre: 'free', V1_penalite: 'penalty', V2_proj_finale: 'final projection', V3_flot_projete: 'projected flow', V4_potentiels: 'hill maps', V5_temoin: 'control run', V5_potentiels_stat: 'hill maps + crowd loss' },
    seed_row_y: 650, ruler_y: 722,
  },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, E1 = ctx.data.e1, E2 = ctx.data.e2, R = ctx.data.rice, U = UK;
    const svg = K.svgLayer(ctx, 12), grey = K.c('muted'), amb = K.c('metric');
    let nclip = 0;
    const grow = (g, at, dur) => { const cid = 'c95' + (++nclip), cp = K.s('clipPath', { id: cid }, svg), r = K.s('rect', { x: 0, y: 0, height: 1080, width: 0 }, cp); g.setAttribute('clip-path', `url(#${cid})`);
      const a = typeof at === 'number' ? at : ctx.at(at); ctx.add({ render(t) { r.setAttribute('width', (2000 * S.seg(t, a, a + (dur || 0.8), S.ease.inOutSine)).toFixed(1)); g.style.display = t >= a ? '' : 'none'; } }); };
    const panel = (Pn, names, vals, floors, at, title, nameW, rowH) => {
      const bx0 = Pn.x0 + nameW, bx1 = Pn.x1 - 20, A = Pn.axis; rowH = Math.min(rowH, (Pn.y1 - Pn.y0 - 40) / names.length);
      const lx = (v) => bx0 + (bx1 - bx0) * (Math.log10(v) - Math.log10(A.min)) / (Math.log10(A.max) - Math.log10(A.min));
      const tl = U.label(ctx, { text: title, x: Pn.x0, y: Pn.y0 - 98, size: 28, at: 'floor+0.6' });
      K.chip(ctx, { text: 'GENERATED', kind: 'generated', x: Pn.x0 + K.box(tl.el, ctx).w + 20, y: Pn.y0 - 100, anchor: 'tl', at: 'floor+0.6' });
      const g = K.s('g', {}, svg), ax = K.s('g', {}, svg), ends = [];
      K.s('line', { x1: bx0, x2: bx1, y1: Pn.y1, y2: Pn.y1, stroke: grey, 'stroke-width': 2 }, ax);
      for (let e = Math.ceil(Math.log10(A.min)); e <= Math.floor(Math.log10(A.max)); e++) { const v = 10 ** e; K.s('line', { x1: lx(v), x2: lx(v), y1: Pn.y1, y2: Pn.y1 + 10, stroke: grey, 'stroke-width': 2 }, ax); K.s('text', { x: lx(v), y: Pn.y1 + 44, 'text-anchor': 'middle', class: 'kt-tick' }, ax, K.pow10(v)); }
      U.fade(ctx, ax, { at });
      names.forEach((n, i) => { const y = Pn.y0 + 30 + rowH * i;
        U.label(ctx, { text: n, x: bx0 - 16, y: y + rowH * 0.5 - 20, anchor: 'r', size: 28, at: ctx.at(at) + 0.1 * i });
        K.s('rect', { x: bx0, y: y + rowH * 0.18, width: lx(vals[i]) - bx0, height: rowH * 0.5, rx: 3, fill: amb }, g); ends.push([lx(vals[i]), y + rowH * 0.43]); });
      grow(g, at, 1.2);
      floors.forEach((f) => { const l = K.s('line', { x1: lx(f.v), x2: lx(f.v), y1: Pn.y0 + 10, y2: Pn.y1, stroke: grey, 'stroke-width': 3, 'stroke-dasharray': f.dotted ? '3 8' : '12 9', opacity: f.dotted ? 0.6 : 1 }, svg); U.fade(ctx, l, { at: f.at || at });
        U.label(ctx, { text: f.label, x: lx(f.v) + (f.right ? 10 : -10), y: f.y, anchor: f.right ? 'l' : 'r', size: 28, cls: 'dim halo', maxW: f.maxW, at: f.at || at }); });
      return { lx, ends };
    };
    // ---- the floor line splits into two (floor beat) ----
    const fl = K.s('line', { x1: 120, x2: 1800, y1: 400, y2: 400, stroke: grey, 'stroke-width': 3, 'stroke-dasharray': '12 9' }, svg); U.fade(ctx, fl, { at: -0.3, out: 'dials-0.3' });
    U.label(ctx, { text: 'noise floor', x: 960, y: 350, anchor: 'c', size: 36, color: 'muted', at: -0.3, out: 'dials-0.3' });
    // ---- E1 ----
    const k1 = Object.keys(P.names_e1), v1 = k1.map((k) => E1.variants[k].mean.test.energie), f1 = E1.noise_floor.n_gen.energie;
    const p1 = panel(P.panel_e1, k1.map((k) => P.names_e1[k]), v1, [{ v: f1, label: 'noise floor (optimistic)', y: P.panel_e1.y0 - 36, right: true }], 'dials-0.15', 'three dials (E1) · distribution distance', 230, 100);
    const b1 = p1.ends[v1.indexOf(Math.min(...v1))], pen = K.svgLayer(ctx, 30);
    const ar1 = K.s('path', { d: `M${b1[0]},${b1[1] + 34} L${p1.lx(f1)},${b1[1] + 34}`, stroke: K.c('chalk'), 'stroke-width': 3.5, fill: 'none', 'marker-end': '' }, pen); U.fade(ctx, ar1, { at: 'dials+1.6' });
    U.label(ctx, { text: `× ${Math.round(R.factors.e1_best_over_floor)}`, x: b1[0] + 20, y: b1[1] - 22, anchor: 'l', size: 36, color: 'chalk', at: 'dials+1.6' });
    // REVIEW: the '3 numbers' glyph is dropped (no room under the panel; the narration says it)
    // ---- E2 ----
    const k2 = ['V0_libre', 'V1_penalite', 'V2_proj_finale', 'V3_flot_projete', 'V4_potentiels', 'V5_temoin', 'V5_potentiels_stat'],   // the report's order (R:1039)
      v2 = k2.map((k) => E2.variants[k].mean.test.err_spectre_log10);
    const ref = E2.variants.reference_sous_echantillon.mean, fH = ref.train.err_spectre_log10, fO = ref.test.err_spectre_log10;
    const p2 = panel(P.panel_e2, k2.map((k) => P.names_e2[k]), v2, [
      { v: fH, label: 'noise floor (honest: independent simulation)', y: P.panel_e2.y0 - 50, right: true, maxW: 360 },
      { v: fO, label: 'optimistic floor at the test values', y: P.panel_e2.y0 - 36, right: false, dotted: true }], 'sheet-0.15', 'flat sheet (E2) · spectrum error (log10)', 330, 52);
    const b2 = p2.ends[v2.indexOf(Math.min(...v2))];
    const ar2 = K.s('path', { d: `M${b2[0]},${b2[1] - 2} L${p2.lx(fH)},${b2[1] - 2}`, stroke: K.c('chalk'), 'stroke-width': 3.5, fill: 'none' }, pen); U.fade(ctx, ar2, { at: 'sheet+1.8' });
    U.label(ctx, { text: `× ${Math.round(R.factors.e2_best_over_honest_floor)}`, x: b2[0] + 20, y: b2[1] - 24, anchor: 'l', size: 36, color: 'chalk', cls: 'halo', at: 'sheet+1.8' });
    // ---- seeds ----
    const n1 = Object.keys(E1.training.C_equivariant).length, sy = P.seed_row_y;
    const sg = K.s('g', {}, svg);
    for (let i = 0; i < 3; i++) K.s('circle', { cx: 140 + 30 * i, cy: sy + 18, r: 9, fill: i < n1 ? K.c('chalk') : 'none', stroke: K.c('chalk'), 'stroke-width': 2.5 }, sg);
    K.s('circle', { cx: 880, cy: sy + 18, r: 9, fill: K.c('chalk'), stroke: K.c('chalk'), 'stroke-width': 2.5 }, sg);
    U.fade(ctx, sg, { at: 'seeds-0.15' });
    U.label(ctx, { text: U.onscreen(ctx, '2 seeds', '2 seeds (3 planned)'), x: 230, y: sy, size: 28, at: 'seeds-0.15' });
    U.label(ctx, { text: U.onscreen(ctx, '1 seed', '1 seed'), x: 906, y: sy, size: 28, at: 'seeds+0.2' });
    K.chip(ctx, { text: 'PhD plan: at least 3 seeds', kind: 'plain', x: 1060, y: sy, at: 'seeds+0.8' });
    // ---- rulers: test values between trained values ----
    const ry = P.ruler_y, rg = K.s('g', {}, svg), cfg = ctx.data.grid.config;
    const ruler = (x0, x1, tr, te, f) => { K.s('line', { x1: x0, x2: x1, y1: ry, y2: ry, stroke: K.c('param'), 'stroke-width': 3 }, rg);
      const lo = Math.min(...tr), hi = Math.max(...tr), X = (v) => x0 + (x1 - x0) * (f(v) - f(lo)) / (f(hi) - f(lo));
      tr.forEach((v) => K.s('circle', { cx: X(v), cy: ry, r: 7, fill: K.c('param') }, rg)); te.forEach((v) => K.s('circle', { cx: X(v), cy: ry, r: 7, fill: K.c('bg'), stroke: K.c('param'), 'stroke-width': 2.5 }, rg)); };
    ruler(140, 740, cfg.G_train, cfg.G_test, (v) => v);
    ruler(880, 1320, E2.config.eta_train, E2.config.eta_test, Math.log);
    U.fade(ctx, rg, { at: 'between-0.15' });
    U.label(ctx, { text: 'Γ', x: 110, y: ry - 20, anchor: 'r', size: 32, color: 'param', at: 'between-0.15' });
    U.label(ctx, { text: 'η', x: 850, y: ry - 20, anchor: 'r', size: 32, color: 'param', at: 'between-0.15' });
    K.chip(ctx, { text: 'interpolation only · nothing tested beyond', kind: 'plain', x: 120, y: 776, at: 'between+0.4' });
    K.chip(ctx, { text: 'CPU only · small perceptrons', kind: 'plain', x: 120, y: 830, at: 'sheet+0.6' });
    K.badge(ctx, { kind: 'MEASURED', at: -0.3 });
    K.formulaLayer(ctx, { label: 'Formula · R:734', items: U.formulaItems(ctx) });
  },
});
</script></body></html>
