<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X5.5 The bill</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X5b.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X5b_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X5.5 The bill (L5, BLUEPRINT, PENDING: CONJECTURE low). The plan's GPU budget as one stacked bar (hours transcribed
   from the thesis table into the entry: planned values, not results; the reserve computed here as reserve_frac × the
   sum), the tier-2 breakdown, the published anchor (PCDM, entry), an empty measured bar; then Kit.seat 'gauge' for
   data/x5_compute_bill.json. T3 ink change NIGHT → BLUEPRINT in the lead-in. */
Scene.define({
  duration: 41, register: 'blueprint',
  cues: { bill: 1.6, tier2: 7.4, anchor: 9.6, none: 15.6, bet: 18.4, why: 22.6, ask: 26.4 },
  data: { seat: { url: 'data/x5_compute_bill.json', optional: true } },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, PL = P.plan, AN = P.anchor, res = ctx.variant === 'result';
    XK.inkChange(ctx, 0.05, 1.2, 540, 'night');
    window.__EVENTS__ = [{ t: +(ctx.at('bet') + 0.3).toFixed(3), id: 'pop', gain_db: -24 }];
    const MT = P.module_tag; K.lowerThird(ctx, { kind: 'chapter', l1: MT.l1, l2: MT.l2, at: MT.at, out: Math.min(MT.at + MT.hold, ctx.at('bill') - 0.1) });
    K.rail(ctx, { from: 'L5', to: 'L5', at: 0.3, hold: 2.6 });
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'low', at: -0.3 });
    const sum = PL.tiers.reduce((a, t) => a + t.hours, 0), reserve = PL.reserve_frac * sum, total = sum + reserve;
    const X0 = 160, X1 = 1100, Y = 250, H = 80, sc = (X1 - X0) / total, svg = K.svgLayer(ctx, 12);
    let x = X0; const segs = [];
    PL.tiers.forEach((t, k) => { const w = Math.max(10, t.hours * sc), g = K.s('g', {}, svg), lx = X0 + 160 * k, ly = Y + H + 26 + 40 * (k % 2);
      K.s('rect', { x, y: Y, width: w - 4, height: H, fill: K.rgba(K.c('fg'), 0.12), stroke: K.c('fg-2'), 'stroke-width': 2, 'stroke-dasharray': '8 6' }, g);
      K.s('line', { x1: x + (w - 4) / 2, y1: Y + H + 2, x2: lx + 20, y2: ly - 4, stroke: K.c('muted'), 'stroke-width': 2 }, g);
      XK.timed(ctx, g, XK.at(ctx, 'bill', 0.25 * k - 0.15), null);
      XK.lab(ctx, `tier ${t.tier} · ${t.label}`, lx, ly, { cls: 'small', at: XK.at(ctx, 'bill', 0.25 * k) });
      segs.push({ g, x, w, t }); x += w; });
    const rg = K.s('g', {}, svg); K.s('rect', { x, y: Y, width: reserve * sc, height: H, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2, 'stroke-dasharray': '8 6' }, rg);
    for (let xx = x + 6; xx < x + reserve * sc - 6; xx += 14) K.s('line', { x1: xx, y1: Y + H - 4, x2: xx + 12, y2: Y + 4, stroke: K.c('muted'), 'stroke-width': 2 }, rg);
    XK.timed(ctx, rg, XK.at(ctx, 'bill', 0.25 * 5 - 0.15), null);
    K.s('line', { x1: x + reserve * sc / 2, y1: Y + H + 2, x2: X0 + 820, y2: Y + H + 62, stroke: K.c('muted'), 'stroke-width': 2 }, rg);
    XK.lab(ctx, PL.reserve_label, X0 + 800, Y + H + 66, { cls: 'small', at: XK.at(ctx, 'bill', 1.3) });
    XK.lab(ctx, PL.total_label, X0, 110, { cls: 'big', at: 'bill+1.5', out: 'ask+0.2' });
    K.chip(ctx, { text: 'A100-class GPU hours · estimates (T:957)', kind: 'plain', x: X0, y: 176, at: 'bill+1.6', out: 'tier2-0.15' });
    // tier-2 breakdown and the anchor
    const s2 = segs.find((s) => s.t.tier === 2);
    XK.lab(ctx, PL.tiers[2].detail, X0, 450, { w: 940, at: 'tier2-0.15', out: 'none-0.15' });
    K.pen(ctx, { kind: 'box', box: { x: s2.x, y: Y, w: s2.w - 4, h: H }, pad: 6, at: 'tier2', out: 'bet-0.15' });
    const ag = K.s('g', {}, svg); K.s('rect', { x: X0, y: 560, width: AN.hours * sc, height: 40, fill: K.c('fg-2') }, ag); XK.timed(ctx, ag, 'anchor-0.15', 'bet-0.15');
    XK.lab(ctx, `${AN.label} · ${AN.tag}`, X0 + AN.hours * sc + 16, 562, { cls: 'small', at: 'anchor', out: 'bet-0.15' });
    XK.lab(ctx, AN.detail, X0, 616, { cls: 'small', color: 'muted', w: 940, at: 'anchor+0.3', out: 'bet-0.15' });
    XK.lab(ctx, AN.leaders[0], X0, 690, { cls: 'small', color: 'muted', at: 'anchor+0.6', out: 'bet-0.15' });
    // measured bar
    const mg = K.s('g', {}, svg); K.s('rect', { x: X0, y: 450, width: X1 - X0, height: 50, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '10 8' }, mg); XK.timed(ctx, mg, 'none-0.15', 'bet-0.15');
    XK.lab(ctx, 'measured: no GPU hour yet', X0 + 20, 456, { at: 'none', out: 'bet-0.15' });
    K.chip(ctx, { text: P.measured_now, kind: 'plain', x: X0, y: 516, at: 'none+0.3', out: 'bet-0.15' });
    // the seat
    const SE = P.seat, fr = { x: 400, y: 540, w: 560, h: 240 };
    K.seat(ctx, { type: 'gauge', variant: ctx.variant, data: ctx.data.seat, tag: SE.tag, frame: fr, gauge: SE.gauge, bet: SE.bet, confidence: SE.confidence, criterion: SE.criterion, source: SE.source, ask: SE.ask,
      cues: res ? { frame: 'bill', bet: 'bill', criterion: 'data', ask: 'sims', data: 'data' } : { frame: 'bet-0.15', bet: 'bet', criterion: 'bet+1.5', ask: 'ask+1.0', data: 'bet' } });
    // CPU side bar (outside the GPU bill)
    const cg = K.s('g', {}, svg); K.s('rect', { x: 1124, y: Y, width: 40, height: H, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2 }, cg); XK.timed(ctx, cg, 'ask-0.15', null);
    XK.lab(ctx, P.cpu.label, X0, 176, { w: 940, cls: 'small', color: 'muted', at: 'ask' });
    XK.lab(ctx, P.config_gpus, X0, 120, { cls: 'small', color: 'muted', at: 'ask+0.4' });
    const fl = ((ctx.script.onscreen && ctx.script.onscreen.formulas) || []).map((f) => ({ tex: f.tex, at: f.cue, out: f.cue === 'bet' ? 'ask-0.3' : undefined }));
    if (fl.length) K.formulaLayer(ctx, { items: fl });
    ctx.x55 = { tot: ctx.at('ask') };
  },
});
</script></body></html>
