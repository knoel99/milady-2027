<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Kit gallery</title>
<!-- Gallery of every kit component (QA page, not a film scene). 16 plates of 8 s each:
     plate k is on screen during [8k, 8k + 8). Stills: tools in CONTRACT.md §7 (out/gallery/). -->
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<style>
  .plate { position: absolute; inset: 0; }
  .plate-title { position: absolute; left: 96px; top: 40px; z-index: 70; color: var(--muted); }
  .badge-col { position: absolute; right: 96px; top: 260px; display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
  .badge-col .kit-badge { position: relative; right: auto; top: auto; }
  .chip-col { position: absolute; left: 160px; top: 160px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
  .chip-col .kit-chip { position: relative !important; left: auto !important; top: auto !important; transform: none !important; }
  .fixture { color: #EB6834; border-color: #EB6834; }
</style></head>
<body><div id="stage"></div>
<script>
const PL = 8, NPL = 16;
// ?plate=K starts the gallery at plate K (preview one plate, or capture it alone for a throughput check)
const FIRST = Math.max(1, Math.min(NPL, +(new URLSearchParams(location.search).get('plate') || 1)));
const P0 = (k) => PL * (k - FIRST);      // plate k starts at 8 (k - FIRST) s
Scene.define({
  duration: PL * (NPL - FIRST + 1),
  register: 'night',
  cues: { q_why: P0(2) + 2.9, q_unblocks: P0(2) + 5.0, eq_lhs: P0(4) + 0.8, eq_adv: P0(4) + 1.8, eq_diff: P0(4) + 3.0 },
  // data/*.json are not part of the engine (content of the old film): optional, the plates that need them
  // show a "no data" chip instead when the files are absent
  data: Object.fromEntries(Object.entries({ rate: 'data/e1_finegrid.json', ev: 'data/e1_eval.json', e3: 'data/e3_growth.json', e2: 'data/e2_maps.json',
          s09: 'data/e1_samples_0.9.json', plan: 'data/fig_plan_these.json' }).map(([k, url]) => [k, { url, optional: true }])),
  setup(ctx) {
    const K = Kit, D = ctx.data, st = ctx.stage;
    const plates = [];
    const plate = (k, name) => { const p = K.el('div', { class: 'plate' }, st); p.dataset.k = k; K.el('div', { class: 'plate-title mono' }, p, K.upper(`Gallery · ${String(k).padStart(2, '0')} · ${name}`)); plates.push(p); return p; };
    ctx.plates = plates;
    const noData = (k, p, file, y = 540) => K.chip(ctx, { text: `no data: ${file} (not in the engine)`, kind: 'plain', x: 960, y, anchor: 'c', at: P0(k) + 0.2, parent: p });

    // 1. chapter card (T4) with staircase (M7) and rail (M8)
    let p = plate(1, 'chapter card T4');
    K.chapterCard(ctx, { num: '04', title: 'Chaos and the shoebox of photographs', level: 'L2', levelFrom: 'L1', tier: 0, pending: [3, 4], at: P0(1) + 0.3, parent: p });

    // 2. question card
    p = plate(2, 'question card');
    K.questionCard(ctx, { n: 4, chapter: 'ch04', category: 'runs', ask: 'the supervisors', at: P0(2) + 0.3, whyAt: 'q_why', unblocksAt: 'q_unblocks', parent: p,
      question: 'Which *Γ values* and how many trajectories make the crossing rate trustworthy near the threshold?',
      why: 'Near the threshold the rate is born steeply: few crossings, wide error bars, and the model lags there.',
      unblocks: 'The tier-0 campaign: the Γ grid, the number of seeds and the length of each run.' });

    // 3. HUD: badges, chips, rail, corner needle, formula layer
    p = plate(3, 'badges · chips · rail · formula layer');
    const bc = K.el('div', { class: 'badge-col' }, p);
    [['MEASURED', null, 'E1 · 2 seeds'], ['PROVED', null, 'Prop. 4'], ['CONJECTURE', 'medium', null], ['PLANNED', null, 'PhD plan'], ['CONTEXT', null, 'Gissinger 2012'], ['SCHEMATIC', null, null]]
      .forEach(([kind, confidence, note], i) => K.badge(ctx, { kind, confidence, note, at: P0(3) + 0.2 + 0.15 * i, parent: bc }));
    const cc = K.el('div', { class: 'chip-col' }, p);
    [['simulated', ''], ['generated', 'generated'], ['schematic', 'schematic'], ['measured', 'measured'], ['illustration, not to time scale', 'plain']]
      .forEach(([text, kind], i) => K.chip(ctx, { text, kind, at: P0(3) + 0.4 + 0.15 * i, parent: cc }));
    K.rail(ctx, { from: 'L2', to: 'L3', at: P0(3) + 0.3, hold: 7, parent: p });
    K.needle(ctx, { corner: true, flips: [P0(3) + 3.0], at: P0(3) + 0.2, out: P0(3) + 7.6, parent: p });
    K.formulaLayer(ctx, { label: 'Formula · Rice (R:514)', at: P0(3) + 1.0, out: P0(3) + 7.6, parent: p, items: [
      { tex: 'r_0 = \\tfrac{1}{2}\\,\\mathbb{E}\\big[\\,|\\dot D|\\;\\big|\\;D=0\\big]\\;p_D(0)', at: P0(3) + 1.0, out: P0(3) + 4.2 },
      { tex: '\\dot D = -0.1\\,D + V Q', at: P0(3) + 4.5 } ] });

    // 4. equation builder + the four lower-thirds (one at a time)
    p = plate(4, 'equation builder · lower-thirds');
    K.equation(ctx, { parent: p, x: 960, y: 250, size: 84, ghost: P0(4) + 0.3,
      tex: '\\term{lhs}{\\frac{\\partial \\B}{\\partial t}}\\term{eq}{\\;=\\;}\\term{adv}{\\nabla\\times(\\U\\times\\B)}\\term{plus}{\\;+\\;}\\term{diff}{\\etaP\\,\\nabla^{2}\\B}',
      reveal: [['lhs', 'eq_lhs'], [['eq', 'adv'], 'eq_adv'], [['plus', 'diff'], 'eq_diff']],
      labels: [{ id: 'adv', text: 'carried and stretched by the flow', color: 'u', at: 'eq_adv+0.4' }, { id: 'diff', text: 'diffusion', color: 'param', at: 'eq_diff+0.4' }],
      focus: [{ ids: ['adv'], at: P0(4) + 5.2, out: P0(4) + 7.0 }] });
    K.lowerThird(ctx, { kind: 'chapter', l1: 'Level 2 · chapter 3', l2: 'The equation, the windows, and the question', color: 'param', at: P0(4) + 0.4, hold: 1.4, parent: p });
    if (D.rate) K.lowerThird(ctx, { kind: 'source', data: D.rate, at: P0(4) + 2.4, hold: 1.4, parent: p });
    else K.lowerThird(ctx, { kind: 'source', l1: 'Source', l2: 'no data file (fixture text)', at: P0(4) + 2.4, hold: 1.4, parent: p });
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: 'Gissinger 2012 · Kac 1943; Rice 1944–1945', at: P0(4) + 4.4, hold: 1.4, parent: p });
    K.lowerThird(ctx, { kind: 'stamp', l1: 'Regenerable · status pending', l2: 'Re-rendered when palier2_abc3d arrives', at: P0(4) + 6.4, hold: 1.2, parent: p });

    // 5. plot helper: curves, dots, band, log axis, error bars, floor line, legend
    p = plate(5, 'plot helper (E1 data)');
    K.badge(ctx, { kind: 'MEASURED', note: 'E1', at: P0(5) + 0.2, parent: p });
    if (D.rate && D.ev) {
    const R = D.rate;
    const P1 = K.plot(ctx, { parent: p, box: { x0: 250, x1: 900, y0: 220, y1: 620 }, at: P0(5) + 0.2,
      x: { label: 'Γ, control parameter', min: 0.8, max: 1.0, ticks: [0.8, 0.85, 0.9, 0.95, 1.0], param: true },
      y: { label: 'crossings of D per unit time', min: 0, max: 0.018, ticks: [0, 0.005, 0.01, 0.015] } });
    P1.band({ x: [R.threshold.last_zero, R.threshold.first_nonzero], kind: 'window', at: P0(5) + 0.4 });
    P1.fromData(R, { at: P0(5) + 0.8, gen: P0(5) + 2.4, only: [R.series[0].name, R.series[2].name], legendX: 280, legendY: 244 });
    const ev = D.ev.variants, tg = ev.A_reference.per_gamma.test.Gamma;
    const P2 = K.plot(ctx, { parent: p, box: { x0: 1200, x1: 1760, y0: 220, y1: 620 }, at: P0(5) + 0.4,
      x: { label: 'Γ (test values)', min: 0.8, max: 1.0, ticks: [0.8, 0.9, 1.0], param: true },
      y: { label: 'distribution distance (log)', min: 1e-4, max: 1, log: true } });
    P2.hline({ y: D.ev.noise_floor.n_gen.energie, kind: 'floor', label: 'noise floor', at: P0(5) + 1.0 });
    for (const [v, f, kind] of [['A_reference', 'model', 'generated'], ['C_equivariant', 'metric', 'generated']]) {
      const pg = ev[v].per_gamma.test, lo = pg.energie.map((m, i) => Math.max(1e-4, m - pg.energie_spread[i])), hi = pg.energie.map((m, i) => m + pg.energie_spread[i]);
      P2.curve({ x: tg, y: pg.energie, field: f, kind, at: P0(5) + 1.4 }); P2.errorbars({ x: tg, lo, hi, field: f, at: P0(5) + 3.0 }); P2.dots({ x: tg, y: pg.energie, filled: tg.map(() => false), field: f, at: P0(5) + 1.4 });
    }
    P2.legend([{ label: 'A · reference', field: 'model', kind: 'generated' }, { label: 'C · equivariant', field: 'metric', kind: 'generated' }], { at: P0(5) + 1.4, x: 1230, y: 244 });
    K.lowerThird(ctx, { kind: 'source', data: D.rate, at: P0(5) + 3.2, hold: 4, parent: p });
    } else noData(5, p, 'data/e1_finegrid.json, data/e1_eval.json');

    // 6. empty seat: curve (pending), E3 32³ ghost
    p = plate(6, 'empty seat · curve · pending');
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'high', at: P0(6) + 0.2, parent: p });
    const E3 = D.e3;
    K.seat(ctx, { type: 'curve', variant: 'pending', tag: 'palier2_abc3d', at: P0(6) + 0.3, parent: p,
      x: { label: 'Rm, magnetic Reynolds number', min: 4, max: 40, ticks: [4, 10, 20, 30, 40], param: true },
      y: { label: 's, growth rate', min: -0.02, max: 0.015, ticks: [-0.02, -0.01, 0, 0.01] }, zero: true,
      band: { x: [17, 18], label: 'decisive' }, ghost: E3 ? { x: E3.x.values, y: E3.series[0].y, label: 'E3 at 32³ (measured)', legendX: 230, legendY: 796 } : undefined,
      bet: 'The two dynamo windows of E3 persist at 64³.', confidence: 'high',
      criterion: 's(17) > 0 > s(18), with the last-quarter fit agreeing in sign.', source: 'R:1112 · D17',
      ask: 'Add Rm = 17.25, 17.5 and 17.75 to the 64³ sweep?' });

    // 7. empty seat: lamp panel (pending)
    p = plate(7, 'empty seat · lamp panel · pending');
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'medium', at: P0(7) + 0.2, parent: p });
    K.seat(ctx, { type: 'lamps', variant: 'pending', tag: 'fm3d evaluation', at: P0(7) + 0.3, parent: p, frame: { x: 236, y: 220, w: 880, h: 480 }, lampsTitle: 'tier-2 criteria of the PhD plan',
      lamps: [{ id: 'a', label: '(a) divergence', rule: 'relative divergence < 10⁻¹²' }, { id: 'b', label: '(b) spectra, training points', rule: '< 0.1 decade per band' },
              { id: 'c', label: '(c) Rm_c at a Pm without data', rule: 'within 10 % (full tier only)' }],
      bet: 'Spectra at the training points within a tenth of a decade.', confidence: 'medium',
      criterion: 'Log-spectrum error below 0.1 decade per band, up to half the cutoff.', source: 'T:917',
      ask: 'Are 12 runs × 40 snapshots enough to judge it?' });

    // 8. empty seat: gauge, RESULT variant fed by an in-page test fixture (never a result)
    p = plate(8, 'seat · gauge · result');
    const fixture = { meta: { stamp: 'TEST FIXTURE · synthetic · not a result', source: 'scenes/_gallery/gallery.html' }, value: 0.142, verdict: 'inconclusive',
      verdict_text: 'Fixture only: shows how a verdict computed by the converter is displayed.' };
    K.seat(ctx, { type: 'gauge', variant: 'result', data: fixture, tag: 'fixture', at: P0(8) + 0.3, parent: p, field: 'metric',
      gauge: { label: 'log-spectrum error (decades per band)', min: 0, max: 0.3, band: [0, 0.1], ticks: [0, 0.1, 0.2, 0.3] },
      bet: 'Spectra within a tenth of a decade.', confidence: 'medium', criterion: 'Below 0.1 decade per band.', source: 'T:917' });
    K.chip(ctx, { text: 'test fixture · not a result', kind: 'fixture', x: 1824, y: 40, anchor: 'tr', at: P0(8) + 0.2, parent: p });

    // 9. empty seat: map (pending)
    p = plate(9, 'empty seat · map · pending');
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'low', at: P0(9) + 0.2, parent: p });
    K.seat(ctx, { type: 'map', variant: 'pending', tag: 'palier1_mhd2d', at: P0(9) + 0.3, parent: p,
      map: { xLabel: 'x', yLabel: 'y', kind: 'b', title: 'current density j, generated' },
      bet: 'Generated fields have as many X-points as the simulated ones.', confidence: 'low',
      criterion: 'Distribution of X-point counts, generated against reference.', source: 'T:872-876',
      ask: 'Which X-point detector do the supervisors trust?' });

    // 10. scalar maps with the key colour map (E2 data)
    p = plate(10, 'field maps (E2 data)');
    K.badge(ctx, { kind: 'MEASURED', note: 'E2', at: P0(10) + 0.2, parent: p });
    const E2 = D.e2, f32 = Scene.f32;
    if (!E2) noData(10, p, 'data/e2_maps.json');
    else [['ref', 'omega', 'u', 'vorticity ω · simulated', false], ['ref', 'j', 'b', 'current {sym}j{/} · simulated', false], ['V4_potentials', 'j', 'b', 'current {sym}j{/} · generated (V4)', true]]
      .forEach(([v, fld, kind, label, gen], i) => {
        const vv = v === 'V4_potentials' ? 'V4_potentiels' : v;
        K.fieldMap(ctx, { grid: f32(E2.variants[vv].samples[0][fld]), x: 150 + i * 560, y: 190, w: 500, h: 500, kind, vmax: E2.vmax[fld], label, generated: gen, at: P0(10) + 0.3 + 0.4 * i, parent: p });
      });
    K.chip(ctx, { text: 'display interpolation (spectral) · native grid 32²', kind: 'plain', x: 150, y: 760, at: P0(10) + 1.4, parent: p });

    // 11. canvas field helpers: arrows + tracers in a cellular flow, field lines of a dipole
    p = plate(11, 'field lines · arrows · tracers');
    K.badge(ctx, { kind: 'SCHEMATIC', at: P0(11) + 0.2, parent: p });
    const bx = { x: 150, y: 190, w: 800, h: 560 }, kx = Math.PI * 2 / bx.w, ky = Math.PI / bx.h;
    const F = (x, y) => [180 * Math.sin(kx * (x - bx.x)) * Math.cos(ky * (y - bx.y)), -180 * (kx / ky) * Math.cos(kx * (x - bx.x)) * Math.sin(ky * (y - bx.y)) * (ky / kx)];
    K.arrows(ctx, { F, box: bx, nx: 12, ny: 8, color: 'u', at: P0(11) + 0.3, parent: p });
    K.tracers(ctx, { F, box: bx, n: 500, trail: 10, color: 'u', alpha: 0.5, at: P0(11) + 0.8, out: P0(12), parent: p });
    const cx = 1430, cy = 470, dip = (x, y) => { const X = x - cx, Y = y - cy, r2 = X * X + Y * Y + 1e-6, r5 = Math.pow(r2, 2.5); return [3 * X * Y / r5, (2 * Y * Y - X * X) / r5]; };
    const seeds = []; for (let a = -1.25; a <= 1.25; a += 0.25) seeds.push([cx + 26 * Math.sin(a), cy - 26 * Math.cos(a)], [cx + 26 * Math.sin(a), cy + 26 * Math.cos(a)]);
    K.fieldLines(ctx, { F: dip, seeds, h: 3, n: 600, box: { x: 1010, y: 190, w: 820, h: 600 }, color: 'b', width: 3, at: P0(11) + 0.5, dur: 2, parent: p });

    // 12. motifs: needle (M1), knob (M2), polarity strip, staircase (M7)
    p = plate(12, 'M1 needle · M2 knob · polarity strip · M7 staircase');
    K.needle(ctx, { x: 380, y: 430, size: 380, flips: [P0(12) + 1.5, P0(12) + 4.5], at: P0(12) + 0.2, parent: p });
    K.chip(ctx, { text: 'illustration, not to time scale', kind: 'plain', x: 380, y: 680, anchor: 'c', at: P0(12) + 0.4, parent: p });
    K.knob(ctx, { x: 930, y: 400, r: 120, min: 0.8, max: 1.0, window: [0.865, 1.0], label: 'Γ', keys: [{ at: P0(12), v: 0.8 }, { at: P0(12) + 1.0, v: 0.93, dur: 1.4 }], at: P0(12) + 0.2, parent: p });
    const G = D.plan && D.plan.data.gissinger;
    if (!G) noData(12, p, 'data/fig_plan_these.json', 330);
    else K.barcode(ctx, { box: { x: 1180, y: 300, w: 600, h: 60 }, series: { t: G.t, D: G.D }, label: 'polarity of D (model, Γ = 0.9)', at: P0(12) + 0.6, dur: 2.5, parent: p });
    K.staircase(ctx, { x: 1120, y: 470, w: 660, h: 210, lit: 2, pending: [3, 4], at: P0(12) + 1.0, parent: p });

    // 13. two inks (M3)
    p = plate(13, 'M3 two inks');
    K.badge(ctx, { kind: 'SCHEMATIC', at: P0(13) + 0.2, parent: p });
    K.twoInks(ctx, { box: { x: 240, y: 190, w: 1440, h: 600 }, cells: [4, 2], amp: 200, at: P0(13) + 0.2, run: P0(13) + 1.2, out: P0(14), parent: p });

    // 14. cloud (M4) on E1 snapshots, histogram (M5) and the spike
    p = plate(14, 'M4 violet cloud (E1 model C) · M5 amber histogram');
    if (!D.s09) noData(14, p, 'data/e1_samples_0.9.json');
    else {
    const S9 = D.s09.variants, xc = f32(S9.C_equivariant.x), qd = new Float32Array(2 * S9.C_equivariant.n);
    for (let i = 0; i < S9.C_equivariant.n; i++) { qd[2 * i] = xc[3 * i]; qd[2 * i + 1] = xc[3 * i + 1]; }
    K.cloud(ctx, { box: { x: 150, y: 200, w: 640, h: 560 }, range: { x: [-3, 3], y: [-3, 3] }, targets: [{ pts: qd, at: P0(14) + 0.8, dur: 3 }], strings: 120, n: 3000, at: P0(14) + 0.2, out: P0(15), parent: p });
    K.chip(ctx, { text: 'Q, D · generated · Γ = 0.9', kind: 'generated', x: 150, y: 790, at: P0(14) + 0.5, parent: p });
    K.histogram(ctx, { box: { x: 1000, y: 250, w: 760, h: 440 }, values: S9.ref.dEdt, ref: S9.ref.dEdt, range: [-1.5, 1.5], bins: 41, label: 'dE/dt over the crowd (reference, then projected)',
      xLabel: 'dE/dt per snapshot', morph: { values: S9.E_projection_C.dEdt, at: P0(14) + 4.0, dur: 1.6 }, at: P0(14) + 0.6, refAt: P0(14) + 3.6, parent: p });
    }

    // 15. projector (M6), pen (M9), mirror (M10) plane and point
    p = plate(15, 'M6 projector · M9 pen · M10 mirror');
    K.projector(ctx, { x: 470, y: 560, scale: 0.75, at: P0(15) + 0.2, drop: P0(15) + 1.2, field: 'b', gauge: { label: '∇·B', value: 1.7e-17 }, parent: p });
    K.mirror(ctx, { mode: 'plane', x: 1060, y: 500, h: 340, at: P0(15) + 0.3, reflect: P0(15) + 1.5, showS: false, parent: p });
    K.mirror(ctx, { mode: 'point', x: 1580, y: 480, h: 300, at: P0(15) + 0.5, reflect: P0(15) + 2.2, parent: p });
    const word = K.el('div', { class: 'lead' }, p, 'Enforce each law where it is true.'); word.style.cssText += ';position:absolute;left:160px;top:150px';
    const last = K.el('span', {}, null, ''); void last;
    K.pen(ctx, { kind: 'underline', target: word, at: P0(15) + 2.4, parent: p });
    K.pen(ctx, { kind: 'arrow', from: [880, 190], to: [1010, 290], at: P0(15) + 3.0, parent: p });

    // 16. empty seat: curve, RESULT variant, fed by a fixture that re-uses the E3 32³ data (layout test only)
    p = plate(16, 'seat · curve · result');
    if (!D.e3) noData(16, p, 'data/e3_growth.json');
    else {
    const fx = { meta: { stamp: 'TEST FIXTURE · E3 data, result layout', source: D.e3.meta.source, sha256: D.e3.meta.sha256 }, verdict: 'inconclusive',
      verdict_text: 'Fixture only: the E3 32³ points drawn where the 64³ result will go.', x: D.e3.x,
      series: [{ name: 's, whole run', kind: 'simulated', field: 'b', y: D.e3.series[0].y }, { name: 's, last quarter', kind: 'simulated', field: 'fg', y: D.e3.series[1].y, points: false }] };
    K.seat(ctx, { type: 'curve', variant: 'result', data: fx, tag: 'fixture', at: P0(16) + 0.3, parent: p, legendX: 230, legendY: 796, legendRow: true,
      x: { label: 'Rm, magnetic Reynolds number', min: 4, max: 40, ticks: [4, 10, 20, 30, 40], param: true },
      y: { label: 's, growth rate', min: -0.02, max: 0.015, ticks: [-0.02, -0.01, 0, 0.01] }, zero: true, band: { x: [17, 18], label: 'decisive' },
      bet: 'The two dynamo windows of E3 persist at 64³.', confidence: 'high', criterion: 's(17) > 0 > s(18), both fits agreeing in sign.', source: 'R:1112 · D17' });
    }
    K.chip(ctx, { text: 'test fixture · not a result', kind: 'fixture', x: 1824, y: 40, anchor: 'tr', at: P0(16) + 0.2, parent: p });
    // plates before ?plate=K are never shown: drop their components from the render loop
    const dead = plates.filter((q) => +q.dataset.k < FIRST);
    ctx.layers = ctx.layers.filter((c) => { const el = c.root || c.canvas || c.col || c.path || c.g; return !el || !dead.some((q) => q.contains(el)); });
  },
  render(t, ctx) {
    const k = Math.min(NPL, FIRST + Math.floor(t / PL));
    ctx.plates.forEach((p) => { p.style.display = +p.dataset.k === k ? '' : 'none'; });
  },
});
</script></body></html>
