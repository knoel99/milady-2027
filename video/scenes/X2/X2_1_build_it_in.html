<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X2.1 Proposition 1: build it in</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X2.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="X2_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X2.1 Proposition 1 (L4, PAPER, PROVED). Opens the module with the T3 ink change (NIGHT → PAPER). A picture of the
   proposition, no data: a violet latent cloud (seeded), the decoder card, the plane ker A inside "all fields"; every
   arrow from the decoder lands on the plane, whatever shape the cloud takes. Then the two decoders of the report:
   hill maps in 2D (u = ∇⊥ψ), a vector potential in 3D (B = ∇ × A, gauge fixed). */
Scene.define({
  duration: 36, register: 'paper',
  cues: { aside: 2.2, scope: 5.0, first: 8.2, decoder: 10.4, whatever: 15.0, proof: 20.5, work: 22.3 },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, st = ctx.stage, P = ctx.params;
    const IC = P.ink_change || { t0: 0.2, t1: 1.6, pen_y: 540 };
    XK.inkChange(ctx, IC.t0, IC.t1, IC.pen_y);
    window.__EVENTS__ = [{ t: IC.t0, id: 'whoosh', gain_db: -20 }, { t: +(ctx.at('whatever') + 2.5).toFixed(3), id: 'pop', gain_db: -24 }];
    K.rail(ctx, { from: 'L4', to: 'L4', at: 0.3, hold: 3 });
    const TG = P.tag || { l1: 'EXTENSION X2 · LEVEL 4 · AN ASIDE', l2: 'The proofs behind the pictures', at: 0.6, hold: 5 };
    K.lowerThird(ctx, { kind: 'chapter', l1: TG.l1, l2: TG.l2, at: TG.at, out: Math.min(TG.at + TG.hold, ctx.at('decoder-0.6')) });
    XK.strip(ctx, P.strip, { at: 'aside-0.15', activeAt: 'first-0.15' });
    K.chip(ctx, { text: 'elementary statements, several classical · R:104-116', kind: 'plain', x: 160, y: 196, at: 'scope-0.15', out: ctx.at('first-0.5') });
    XK.title(ctx, 'Proposition 1 · linear laws, built in', 'first-0.15');
    K.badge(ctx, { kind: 'PROVED', note: 'Prop. 1 · trivial by design', at: -0.3 });
    // ---- the picture ----
    const svg = K.svgLayer(ctx, 12), pic = K.s('g', {}, svg);
    const CL = P.cloud, rng = S.rng(CL.seed || 'x2-latent'), N = CL.n, G = [];
    for (let i = 0; i < N; i++) G.push(XK.gauss(rng));
    const Phi = (x) => 0.5 * (1 + Math.tanh(0.8 * x));
    const shapes = [
      (g) => [g[0] * 0.42, g[1] * 0.42],
      (g) => [Math.sign(g[0]) * 0.55 + g[0] * 0.16, g[1] * 0.3],
      (g) => { const a = Math.PI * (0.1 + 0.8 * Phi(g[0])), r = 0.8 + 0.08 * g[1]; return [Math.cos(a) * r, 0.45 - Math.sin(a) * r]; },
      (g) => [0.25 * g[0] + 0.12 * g[0] * g[0] - 0.3, 0.2 * g[1] + 0.25 * g[0]],
    ];
    const dots = G.map(() => K.s('circle', { r: 4, fill: K.c('model') }, pic));
    const DY = -12, DB0 = P.decoder_box, DB = { x0: DB0.x0, x1: DB0.x1, y0: DB0.y0 + DY, y1: DB0.y1 + DY }, PL = P.plane.corners.map((p) => [p[0], p[1] + DY]), AB = P.plane.ambient_box.map((v, i) => (i % 2 ? v + DY : v)); CL.cy0 = CL.cy + DY;
    K.s('rect', { x: AB[0], y: AB[1], width: AB[2] - AB[0], height: AB[3] - AB[1], fill: 'none', stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '10 8', rx: 8 }, pic);
    K.s('path', { d: 'M' + PL.map((p) => p.join(',')).join('L') + 'Z', fill: K.rgba(K.c('panel'), 0.6), stroke: K.c('fg-2'), 'stroke-width': 3 }, pic);
    K.s('rect', { x: DB.x0, y: DB.y0, width: DB.x1 - DB.x0, height: DB.y1 - DB.y0, rx: 8, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 3 }, pic);
    [0, 1, 2].forEach((k) => K.s('path', { d: `M${DB.x0 + 50 - 8 * k},${DB.y1 - 26} C${DB.x0 + 80},${DB.y1 - 70 - 14 * k} ${DB.x1 - 80},${DB.y1 - 70 - 14 * k} ${DB.x1 - 50 + 8 * k},${DB.y1 - 26}`, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2 }, pic));
    const plab = [
      XK.lab(ctx, '{model}latent codes z{/}', CL.cx, AB[1] - 40, { anchor: 'c' }),
      XK.lab(ctx, 'decoder', (DB.x0 + DB.x1) / 2, DB.y0 + 14, { anchor: 'c', cls: 'big' }),
      XK.lab(ctx, 'all fields', AB[0] + 14, AB[1] + 8, { cls: 'mono' }),
      XK.lab(ctx, 'ker A · zero divergence', PL[2][0], PL[2][1] - 46, { anchor: 'r' }),
    ];
    plab.push(XK.lab(ctx, 'every output lands on the plane', (DB.x0 + DB.x1) / 2, DB.y1 + 16, { anchor: 'c' }));
    const tPic = ctx.at('decoder-0.15'), tWork = ctx.at('work-0.15'), tW = ctx.at('whatever-0.15');
    // arrows: from the decoder's right edge to points ON the plane (bilinear coordinates of the parallelogram)
    const A = PL[0], B = PL[1], D = PL[3], onPlane = (u, v) => [A[0] + u * (B[0] - A[0]) + v * (D[0] - A[0]), A[1] + u * (B[1] - A[1]) + v * (D[1] - A[1])];
    const NA = P.arrows.n, arr = [];
    for (let k = 0; k < NA; k++) {
      const i = Math.floor(k * N / NA);
      arr.push({ i, y0: DB.y0 + 20 + (DB.y1 - DB.y0 - 40) * (k + 0.5) / NA, l: K.s('line', { stroke: K.c('fg-2'), 'stroke-width': 2 }, pic), d: K.s('circle', { r: 6, fill: K.c('model') }, pic) });
    }
    const posAt = (t, g) => {
      const m = CL.morph_dur || 3.5, per = m / 3, s = Math.max(0, Math.min(3, (t - tW) / per));
      const k = Math.min(2, Math.floor(s)), f = S.ease.inOutCubic(Math.min(1, s - k)), a = shapes[k](g), b = shapes[Math.min(3, k + 1)](g);
      return t < tW ? a : [XK.lerp(a[0], b[0], f), XK.lerp(a[1], b[1], f)];
    };
    const chk = K.pen(ctx, { kind: 'check', box: { x: 1600, y: 600, w: 60, h: 50 }, at: 'whatever+2.5', out: 'work-0.15' });
    void chk;
    K.chip(ctx, { text: 'any latent law · well or badly trained', kind: 'generated', x: 120, y: 712, at: 'whatever-0.15', out: 'proof-0.3', z: 45 });
    // ---- hero, proof ----
    const H = P.hero;
    K.equation(ctx, { tex: H.tex, x: H.x, y: H.y, size: H.size, reveal: H.reveal, out: 'work-0.15' });
    K.equation(ctx, { tex: P.proof.tex, x: P.proof.x, y: P.proof.y + 12, size: P.proof.size, at: 'proof-0.15', reveal: [], out: 'work-0.15' });
    K.chip(ctx, { text: "'trivial; all the interest lies in the decoder' · R:335", kind: 'plain', maxWidth: 860, x: 120, y: 742, at: 'proof-0.15', out: 'work-0.15' });
    // ---- the last beat: two decoders ----
    const PN = P.panels, w2 = K.svgLayer(ctx, 13), g2 = K.s('g', {}, w2);
    const L0 = PN.left, R0 = PN.right, y0 = PN.y0 + 60, y1 = PN.y1 - 20;
    K.s('rect', { x: L0[0], y: PN.y0 - 30, width: L0[1] - L0[0], height: PN.y1 - PN.y0, rx: 10, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 2 }, g2);
    K.s('rect', { x: R0[0], y: PN.y0 - 30, width: R0[1] - R0[0] + 60, height: PN.y1 - PN.y0, rx: 10, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 2 }, g2);
    // hill map: sum of three seeded bumps, contour rings, blue arrows tangent to the rings
    const hr = S.rng('x2-hill'), cx = (L0[0] + L0[1]) / 2 - 110, cy = (y0 + y1) / 2 + 10;
    for (let k = 1; k <= 4; k++) K.s('ellipse', { cx: cx + 6 * k * (hr() - 0.5), cy: cy + 4 * k * (hr() - 0.5), rx: 34 * k, ry: 24 * k, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2 }, g2);
    K.s('ellipse', { cx: cx + 190, cy: cy - 50, rx: 50, ry: 36, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2 }, g2);
    for (let k = 0; k < 14; k++) {
      const ring = 1 + (k % 4), a = 2 * Math.PI * k / 14 + ring, x = cx + 34 * ring * Math.cos(a), y = cy + 24 * ring * Math.sin(a);
      const tx = -34 * ring * Math.sin(a), ty = 24 * ring * Math.cos(a), n = Math.hypot(tx, ty), ux = 22 * tx / n, uy = 22 * ty / n;
      K.s('path', { d: `M${x - ux},${y - uy} L${x + ux},${y + uy} M${x + ux - 8 * ux / 22 - 5 * uy / 22},${y + uy - 8 * uy / 22 + 5 * ux / 22} L${x + ux},${y + uy} L${x + ux - 8 * ux / 22 + 5 * uy / 22},${y + uy - 8 * uy / 22 - 5 * ux / 22}`,
        fill: 'none', stroke: K.c('u'), 'stroke-width': 3, 'stroke-linecap': 'round' }, g2);
    }
    // wire cube, grey A arrows, vermillion B loops curling round them
    const qx = R0[0] + 130, qy = (y0 + y1) / 2 - 10, s2 = 70, o3 = 34;
    const cube = `M${qx - s2},${qy - s2 + o3}h${2 * s2}v${2 * s2}h${-2 * s2}z M${qx - s2 + o3},${qy - s2}h${2 * s2}v${2 * s2}h${-2 * s2}z M${qx - s2},${qy - s2 + o3}l${o3},${-o3} M${qx + s2},${qy - s2 + o3}l${o3},${-o3} M${qx + s2},${qy + s2 + o3}l${o3},${-o3} M${qx - s2},${qy + s2 + o3}l${o3},${-o3}`;
    K.s('path', { d: cube, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2 }, g2);
    [-50, 20, 90].forEach((dx, k) => {
      const ax = qx + dx - 10, ay = qy + 20 - 25 * k;
      K.s('path', { d: `M${ax - 40},${ay} L${ax + 40},${ay} M${ax + 30},${ay - 8} L${ax + 40},${ay} L${ax + 30},${ay + 8}`, fill: 'none', stroke: K.c('matter'), 'stroke-width': 3 }, g2);
      K.s('ellipse', { cx: ax, cy: ay, rx: 16, ry: 34, fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, g2);
    });
    const tl = [
      XK.lab(ctx, '2D · hill map', L0[0] + 20, PN.y0 - 20, { cls: 'mono' }), XK.lab(ctx, '3D · vector potential', R0[0] + 20, PN.y0 - 20, { cls: 'mono' }),
      XK.tex(ctx, '\\U = \\nabla^\\perp\\psi', L0[1] - 30, y1 - 100, { size: 44, anchor: 'c' }),
      XK.tex(ctx, '\\B = \\nabla\\times\\mathbf{A}', R0[0] + 252, PN.y0 + 70, { size: 44 }),
      XK.lab(ctx, 'gauge fixed: $\\nabla\\cdot\\mathbf{A} = 0$', R0[0] + 244, PN.y0 + 160, { cls: 'tag' }),
    ];
    tl[2].style.transform = 'translateX(-100%)'; tl[2].style.left = (L0[1] - 24) + 'px';
    tl.forEach((e, k) => XK.timed(ctx, e, ctx.at('work-0.15') + 0.4 + 0.15 * k, null));
    XK.timed(ctx, g2, 'work-0.15', null, { din: 0.8, dy: 30 });
    g2.style.transformOrigin = '960px 590px';
    K.chip(ctx, { text: 'walls: Remark 3.5 · extension X6', kind: 'plain', x: 120, y: 760, at: 'work+1.0' });
    K.formulaLayer(ctx);
    ctx.x21 = { pic, dots, G, posAt, arr, onPlane, plab, tPic, tWork, CL, DB, PN };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.x21;
    const pin = S.seg(t, c.tPic, c.tPic + 0.8, S.ease.outCubic), dim = 1 - 0.7 * S.seg(t, c.tWork, c.tWork + 0.8, S.ease.inOutSine);
    const gone = S.seg(t, c.tWork, c.tWork + 0.6, S.ease.linear);
    c.pic.style.opacity = (pin * dim * (1 - gone)).toFixed(3); c.pic.style.display = pin > 0 && gone < 1 ? '' : 'none';
    c.plab.forEach((e) => { e.style.opacity = (pin * dim * (1 - gone)).toFixed(3); e.style.display = pin > 0 && gone < 1 ? '' : 'none'; });
    const R = c.CL.r / 0.9, breathe = 1 + 0.01 * Math.sin(2 * Math.PI * t / 3);
    const pos = c.G.map((g) => c.posAt(t, g));
    c.dots.forEach((d, i) => { d.setAttribute('cx', (c.CL.cx + R * pos[i][0] * breathe).toFixed(1)); d.setAttribute('cy', (c.CL.cy0 + R * pos[i][1] * breathe).toFixed(1)); });
    const xr = c.DB.x1;
    c.arr.forEach((a, k) => {
      const p = S.seg(t, c.tPic + 0.8 + 0.025 * k, c.tPic + 1.4 + 0.025 * k, S.ease.outCubic), q = pos[a.i];
      const u = 0.08 + 0.84 * (0.5 + 0.5 * Math.tanh(1.6 * q[0])), v = 0.08 + 0.84 * (0.5 + 0.5 * Math.tanh(-1.6 * q[1]));
      const e = c.onPlane(u, v), x = xr + (e[0] - xr) * p, y = a.y0 + (e[1] - a.y0) * p;
      a.l.setAttribute('x1', xr); a.l.setAttribute('y1', a.y0.toFixed(1)); a.l.setAttribute('x2', x.toFixed(1)); a.l.setAttribute('y2', y.toFixed(1));
      a.d.setAttribute('cx', x.toFixed(1)); a.d.setAttribute('cy', y.toFixed(1)); a.l.style.opacity = a.d.style.opacity = p.toFixed(3);
    });
  },
});
</script></body></html>
