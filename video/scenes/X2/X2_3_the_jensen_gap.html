<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X2.3 Proposition 3: the Jensen gap</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X2.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="X2_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X2.3 Proposition 3, the Jensen gap (L4, PAPER, PROVED). The report's own counterexample drawn as a picture (no data):
   data at x = −1 and +1, the ideal path through x_t = 0 is flat (its guess is the average, 0); a linear law keeps the
   average lawful; on a circle the average falls inside (the Jensen gap). The moved path is SCHEMATIC. */
Scene.define({
  duration: 43, register: 'paper',
  cues: { guess: 0.4, average: 6.2, linear: 10.2, notexact: 17.4, curved: 21.4, gap: 27.2 },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, L = P.left, R = P.right;
    window.__EVENTS__ = [{ t: +(ctx.at('linear') + 1.5).toFixed(3), id: 'pop', gain_db: -24 }];
    XK.strip(ctx, P.strip, { at: -0.4, activeAt: -0.4 });
    K.badge(ctx, { kind: 'PROVED', note: 'Prop. 3 · gap known: Bastek et al. 2025', at: -0.3 });
    XK.title(ctx, 'Proposition 3 · penalties and the Jensen gap', 'guess-0.15');
    const svg = K.svgLayer(ctx, 12), ink = K.c('fg-2'), vio = K.c('model'), grey = K.c('matter');
    // LEFT: t horizontal (0 → 1), x vertical
    const B = L.box, ty = L.t_axis_y, sc = L.x_scale_px, X0 = B[0] + 60, X1 = B[2] - 80;
    const px = (t) => X0 + (X1 - X0) * t, py = (x) => ty - sc * x;
    const lg = K.s('g', {}, svg);
    K.s('line', { x1: X0, x2: X1 + 30, y1: ty, y2: ty, stroke: K.c('muted'), 'stroke-width': 2 }, lg);
    K.s('line', { x1: X0, x2: X0, y1: py(1.25), y2: py(-1.25), stroke: K.c('muted'), 'stroke-width': 2 }, lg);
    K.s('text', { x: (X0 + X1) / 2, y: B[3] + 6, 'text-anchor': 'middle', class: 'kt-axis' }, lg, 't · transport time');
    L.data_x.forEach((x) => { K.s('circle', { cx: px(1), cy: py(x), r: 9, fill: grey }, lg); K.s('text', { x: px(1) + 22, y: py(x) + 10, class: 'kt-label' }, lg, x > 0 ? '+1' : '−1'); });
    K.s('line', { x1: px(0), x2: px(L.t_star), y1: py(0), y2: py(0), stroke: vio, 'stroke-width': 5 }, lg);
    K.s('circle', { cx: px(L.t_star), cy: py(0), r: 9, fill: vio }, lg); K.s('circle', { cx: px(L.t_star), cy: py(0), r: 16, fill: 'none', stroke: vio, 'stroke-width': 2.5 }, lg);
    XK.timed(ctx, lg, -0.3, null);
    const ray = K.s('path', { d: `M${px(L.t_star)},${py(0)} L${px(1)},${py(0)}`, stroke: vio, 'stroke-width': 4, 'stroke-dasharray': '14 10', fill: 'none' }, svg);
    XK.timed(ctx, ray, 'guess+0.3', null);
    const hollow = K.s('circle', { cx: px(1), cy: py(0), r: 11, fill: K.c('bg'), stroke: vio, 'stroke-width': 4 }, svg);
    XK.timed(ctx, hollow, 'guess+0.6', null);
    XK.lab(ctx, 'the guess: $\\hat{x}_1$', px(1) + 30, py(0) - 22, { at: 'guess+0.6', color: 'model' });
    const strs = K.s('g', {}, svg);
    L.data_x.forEach((x) => { K.s('line', { x1: px(L.t_star), y1: py(0), x2: px(1), y2: py(x), stroke: grey, 'stroke-width': 2.5, 'stroke-dasharray': '6 6' }, strs);
      K.s('text', { x: px(0.78), y: py(x * 0.6) + (x > 0 ? -12 : 34), 'text-anchor': 'middle', class: 'kt-label' }, strs, '½'); });
    XK.timed(ctx, strs, 'average-0.15', null);
    XK.lab(ctx, 'an average of possible endings', px(0.02), py(1.25) - 46, { at: 'average', out: 'curved-0.2' });
    XK.lab(ctx, 'x² = 1 ✓', px(1) - 20, py(1) - 50, { anchor: 'r', at: 'curved+0.4', cls: 'small' });
    XK.lab(ctx, 'x² = 0 ✗', px(1) - 20, py(0) + 18, { anchor: 'r', at: 'curved+0.6', cls: 'small' });
    // moved path (SCHEMATIC): ideal ghost at 25 %, bent outward toward +1
    const MP = L.moved_path, gx = MP.x_t, ghost = [], moved = [];
    for (let i = 0; i <= 40; i++) { const t = i / 40; const xi = gx * t / MP.at_t * (t < MP.at_t ? 1 : 1) ; ghost.push([px(t), py(Math.min(MP.guess_ideal, t <= MP.at_t ? xi : gx + (MP.guess_ideal - gx) * (t - MP.at_t) / (1 - MP.at_t)))]);
      moved.push([px(t), py(t <= MP.at_t ? xi : gx + (0.92 - gx) * Math.pow((t - MP.at_t) / (1 - MP.at_t), 0.8))]); }
    const pth = (a) => 'M' + a.map((p) => p.map((v) => v.toFixed(1)).join(',')).join('L');
    const gh = K.s('path', { d: pth(ghost), fill: 'none', stroke: vio, 'stroke-width': 4, opacity: 0.25 }, svg);
    const mv = K.s('path', { d: pth(moved), fill: 'none', stroke: vio, 'stroke-width': 4, 'stroke-dasharray': '16 11' }, svg);
    XK.timed(ctx, gh, 'gap-0.15', null); XK.drawOn(ctx, mv, 'gap+0.3', 1.0);
    XK.lab(ctx, 'optimum moved', px(0.25), py(0.92) - 30, { at: 'gap+1.0', color: 'model' });
    K.chip(ctx, { text: 'SCHEMATIC moved path', kind: 'schematic', x: B[0] + 20, y: 376, at: 'gap+0.5' });
    // RIGHT: straight line → circle
    const RB = R.box, ln = R.line, ci = { cx: R.circle.cx, cy: R.circle.cy - 70, r: R.circle.r - 40 };
    const lineP = (f) => [XK.lerp(ln.from[0], ln.to[0], f), XK.lerp(ln.from[1], ln.to[1], f)];
    const circP = (deg) => [ci.cx + ci.r * Math.cos(deg * Math.PI / 180), ci.cy - ci.r * Math.sin(deg * Math.PI / 180)];
    const shape = K.s('path', { fill: 'none', stroke: ink, 'stroke-width': 4 }, svg);
    const dd = [0, 1, 2].map(() => K.s('circle', { r: 10, fill: grey }, svg));
    const avg = K.s('circle', { r: 12, fill: K.c('bg'), stroke: vio, 'stroke-width': 4 }, svg);
    const hatch = K.s('g', {}, svg);
    const avgC = [ci.cx, ci.cy - ci.r * Math.sin(35 * Math.PI / 180)], arcTop = [ci.cx, ci.cy - ci.r];
    for (let k = 0; k < 7; k++) { const y = avgC[1] - 12 - k * ((avgC[1] - 12 - arcTop[1]) / 7); K.s('line', { x1: ci.cx - 14, x2: ci.cx + 14, y1: y + 8, y2: y - 8, stroke: K.c('chalk'), 'stroke-width': 2, opacity: 0.6 }, hatch); }
    XK.timed(ctx, hatch, 'curved+1.2', null);
    XK.lab(ctx, 'Jensen gap', ci.cx + 40, avgC[1] - 90, { at: 'curved+1.3' });
    XK.lab(ctx, 'linear law: A x = 0', RB[0] + 20, RB[1] - 10, { at: 'linear-0.15', out: 'curved-0.15' });
    XK.lab(ctx, 'penalty = 0 at the optimum', ln.to[0], ln.to[1] + 160, { anchor: 'r', at: 'linear+1.0', out: 'curved-0.15' });
    XK.lab(ctx, "soft: the flat sheet's penalty stayed approximate (08.2)", 120, 790, { cls: 'small tag', at: 'notexact-0.15', out: 'curved-0.15' });
    XK.lab(ctx, 'curved law: |x|² = 1', RB[0] + 20, RB[1] - 10, { at: 'curved+0.6' });
    K.pen(ctx, { kind: 'check', box: { x: ln.to[0] - 340, y: ln.to[1] + 60, w: 50, h: 44 }, at: 'linear+1.5', out: 'curved-0.15' });
    K.pen(ctx, { kind: 'arrow', from: [avgC[0] - 60, avgC[1] + 10], to: [arcTop[0] - 14, arcTop[1] + 14], bend: 0.3, at: 'gap+0.2' });
    // heroes (T6 morph)
    const HL = P.hero_linear, HC = P.hero_curved;
    const E1 = K.equation(ctx, { tex: HL.tex, x: HL.x, y: 286, size: HL.size, at: 'linear-0.15' });
    const E2 = K.equation(ctx, { tex: HC.tex, x: HC.x, y: 286, size: HC.size, reveal: HC.reveal });
    K.morph(ctx, { from: E1, to: E2, at: 'curved-0.15', dur: 1.0 });
    K.chip(ctx, { text: 'Jensen gap known: Bastek, Sun & Kochmann 2025 · R:181', kind: 'plain', x: 120, y: 790, at: 'gap+0.8', out: '_speech_end-1.7' });
    K.chip(ctx, { text: 'the crowd loss acts on samples, not on this guess · T:513', kind: 'plain', x: 120, y: 790, at: '_speech_end-1.5' });
    K.formulaLayer(ctx);
    ctx.x23 = { shape, dd, avg, lineP, circP, ln, tL: ctx.at('linear-0.15'), tC: ctx.at('curved-0.15') };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.x23;
    const a = S.seg(t, c.tL, c.tL + 0.6, S.ease.outCubic), m = S.seg(t, c.tC, c.tC + 1.2, S.ease.inOutCubic);
    // the line bends into the circle's top arc: sample both shapes and blend
    const N = 48, pts = [];
    for (let i = 0; i <= N; i++) { const f = i / N, A = c.lineP(f), B = c.circP(-30 + 240 * f); pts.push([XK.lerp(A[0], B[0], m), XK.lerp(A[1], B[1], m)]); }
    c.shape.setAttribute('d', 'M' + pts.map((p) => p.map((v) => v.toFixed(1)).join(',')).join('L')); c.shape.style.opacity = a;
    const dl = c.ln.data_on_line, angs = [35, 145, 90];
    const ps = dl.map((f, k) => { const A = c.lineP(f), B = c.circP(angs[k]); return [XK.lerp(A[0], B[0], m), XK.lerp(A[1], B[1], m)]; });
    c.dd.forEach((d, k) => { d.setAttribute('cx', ps[k][0].toFixed(1)); d.setAttribute('cy', ps[k][1].toFixed(1)); d.style.opacity = (k === 2 ? a * (1 - m) : a); });
    const av = m > 0 ? [(ps[0][0] + ps[1][0]) / 2, (ps[0][1] + ps[1][1]) / 2] : [(ps[0][0] + ps[1][0] + ps[2][0]) / 3, (ps[0][1] + ps[1][1] + ps[2][1]) / 3];
    const pin = S.seg(t, c.tL + 0.5, c.tL + 1.1, S.ease.outCubic);
    c.avg.setAttribute('cx', av[0].toFixed(1)); c.avg.setAttribute('cy', (av[1] - 60 * (1 - pin)).toFixed(1)); c.avg.style.opacity = pin;
  },
});
</script></body></html>
