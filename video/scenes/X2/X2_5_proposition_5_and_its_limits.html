<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X2.5 Proposition 5 and its limits</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X2.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="X2_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X2.5 Proposition 5 and its limits (L4, PAPER, PROVED). The 8,000 reference snapshots at Γ = 0.9
   (data/e1_samples_0.9.json) as a grey glow in the (Q, D) plane; their dE/dt histogram (computed by the extractor from
   the model's equations); the glow runs for a moment (RK4 in setup, coefficients from data/e1_finegrid.json config):
   each dot moves, the crowd stays. Then the limits: the fixed point N₊ (closed formula) and a SCHEMATIC loop pass
   every test; the fit to data stays in the loss. */
Scene.define({
  duration: 41, register: 'paper',
  cues: { rate: 0.4, zero: 5.6, proof: 13.4, same: 16.0, fixed: 21.0, loop: 27.4, fit: 29.4 },
  data: { samples: 'data/e1_samples_0.9.json', e1: 'data/e1_finegrid.json' },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, SM = ctx.data.samples, cfg = ctx.data.e1.config, G = SM.gamma, mu = cfg.mu, nu = cfg.nu;
    window.__EVENTS__ = [{ t: +(ctx.at('fit') + 0.8).toFixed(3), id: 'pop', gain_db: -24 }];
    XK.strip(ctx, P.strip, { at: -0.4, activeAt: -0.4 });
    K.badge(ctx, { kind: 'PROVED', note: 'Prop. 5 · Remark 3.11 · classical: Echeverría 1982', at: -0.3 });
    XK.title(ctx, 'Proposition 5 · crowd laws, and their limits', 'rate-0.15');
    const PL = P.plane, B = PL.box, cx = (B[0] + B[2]) / 2, cy = (B[1] + B[3]) / 2, sc = (B[3] - B[1]) / (PL.d_range[1] - PL.d_range[0]);
    const X = (q) => cx + sc * q, Y = (d) => cy - sc * d;
    const ax = K.svgLayer(ctx, 10), ag = K.s('g', {}, ax);
    K.s('line', { x1: X(-3.2), x2: X(3.2), y1: cy, y2: cy, stroke: K.c('muted'), 'stroke-width': 2 }, ag);
    K.s('line', { x1: cx, x2: cx, y1: Y(3.2), y2: Y(-3.2), stroke: K.c('muted'), 'stroke-width': 2 }, ag);
    K.s('text', { x: X(3.2) + 8, y: cy + 10, class: 'kt-axis' }, ag, 'Q').style.fill = K.c('b');
    K.s('text', { x: cx + 12, y: Y(3.2) + 8, class: 'kt-axis' }, ag, 'D').style.fill = K.c('b');
    K.chip(ctx, { text: `SIMULATED · Γ = ${G} · ${SM.variants.ref.n.toLocaleString('en-US')} reference snapshots`, kind: '', x: B[0] - 80, y: B[3] + 14, at: -0.3, out: 'loop-0.3' });
    // the run: every snapshot advanced by RK4 (fixed step), positions stored per step
    const XS = S.f32(SM.variants[PL.variant].x), N = SM.variants[PL.variant].n, RU = P.run, NS = Math.round(RU.run_dt / RU.dt);
    const F = (s) => [mu * s[0] - s[2] * s[1], -nu * s[1] + s[2] * s[0], G - s[2] + s[0] * s[1]];
    const pos = new Float32Array(N * (NS + 1) * 2);
    for (let i = 0; i < N; i++) {
      let s = [XS[3 * i], XS[3 * i + 1], XS[3 * i + 2]];
      for (let k = 0; k <= NS; k++) {
        pos[2 * (i * (NS + 1) + k)] = s[0]; pos[2 * (i * (NS + 1) + k) + 1] = s[1];
        const h = RU.dt, a = F(s), b = F(s.map((v, j) => v + h / 2 * a[j])), c = F(s.map((v, j) => v + h / 2 * b[j])), d = F(s.map((v, j) => v + h * c[j]));
        s = s.map((v, j) => v + h / 6 * (a[j] + 2 * b[j] + 2 * c[j] + d[j]));
      }
    }
    const CV = K.canvasLayer(ctx, 6, { x: B[0], y: B[1], w: B[2] - B[0], h: B[3] - B[1] }, null, { reset: true });
    // the ringed snapshot and its velocity arrow (from the three equations)
    const pk = PL.pick, sp = [XS[3 * pk], XS[3 * pk + 1], XS[3 * pk + 2]], fv = F(sp);
    const ov = K.svgLayer(ctx, 14), ring = K.s('circle', { r: 14, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3 }, ov);
    const fn = Math.hypot(fv[0], fv[1]), ux = fv[0] / fn, uy = fv[1] / fn, L0 = 70;
    const arrow = K.s('path', { fill: 'none', stroke: K.c('chalk'), 'stroke-width': 4, 'stroke-linecap': 'round',
      d: `M${X(sp[0])},${Y(sp[1])} l${L0 * ux},${-L0 * uy} M${X(sp[0]) + L0 * ux - 14 * ux + 8 * uy},${Y(sp[1]) - L0 * uy + 14 * uy + 8 * ux} L${X(sp[0]) + L0 * ux},${Y(sp[1]) - L0 * uy} L${X(sp[0]) + L0 * ux - 14 * ux - 8 * uy},${Y(sp[1]) - L0 * uy + 14 * uy - 8 * ux}` }, ov);
    XK.timed(ctx, arrow, 'rate+0.4', 'proof-0.15');
    const trail = K.s('path', { fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3 }, ov);
    XK.lab(ctx, '$\\mathcal{L}\\varphi$: rate of change of $\\varphi$, from the equations · $\\mathcal{L}$, the generator', B[0] - 80, 264, { at: 'rate+0.6', out: 'zero-0.2', cls: 'small' });
    XK.lab(ctx, 'each moves · the crowd stays', B[0] - 60, B[3] - 60, { at: 'proof+0.6', out: 'fixed-0.15' });
    // histogram of dE/dt (amber) and its mean
    const HB = P.hist, hb = { x: HB.box[0], y: HB.box[1] + 40, w: HB.box[2] - HB.box[0], h: 180 };
    const sd = SM.variants.ref.std_dEdt, HR = [-3 * sd, 3 * sd];   // range from the data's spread (CONTRACT 13.2), not the entry's ±2
    K.histogram(ctx, { box: hb, values: SM.variants.ref.dEdt, range: HR, bins: HB.bins, edges: true, at: 'zero-0.15', out: 'fixed-0.15' });
    const dE = S.f32(SM.variants.ref.dEdt); let mean = 0; for (let i = 0; i < dE.length; i++) mean += dE[i]; mean /= dE.length;
    const mx = hb.x + hb.w * (mean - HR[0]) / (HR[1] - HR[0]);
    const ml = K.s('line', { x1: mx, x2: mx, y1: hb.y - 10, y2: hb.y + hb.h, stroke: K.c('metric'), 'stroke-width': 4 }, ov);
    XK.timed(ctx, ml, 'zero+0.4', 'fixed-0.15');
    XK.lab(ctx, 'average = 0', mx - 14, hb.y - 6, { anchor: 'r', at: 'zero+0.5', out: 'fixed-0.15', color: 'metric' });
    XK.lab(ctx, '$\\varphi = E$: the energy budget', hb.x + hb.w, hb.y + 20, { anchor: 'r', at: 'zero+0.8', out: 'fixed-0.15', cls: 'small' });
    K.equation(ctx, { tex: P.hero.tex, x: P.hero.x, y: 270, size: 48, at: 'zero-0.15', reveal: [], out: 'fixed-0.15' });
    // tiles: nine enforced (amber), ten controls (grey)
    const T = P.tiles, tw = 58, tgap = 6;
    const row = (names, y, amber, t0) => names.map((nm, k) => { const e = K.el('div', { class: 'x2-tile', html: nm.replace(/([²³])/g, '<span>$1</span>') }, ctx.stage);
      Object.assign(e.style, { left: (hb.x + k * (tw + tgap)) + 'px', top: y + 'px', width: tw + 'px', borderColor: amber ? K.c('metric') : K.c('muted'), color: amber ? K.c('metric') : K.c('muted') });
      XK.timed(ctx, e, ctx.at(t0) + 0.04 * k, 'same-0.15', { dy: 10 }); return e; });
    row(T.enforced, 592, true, T.at); row(T.control, 678, false, T.at);
    XK.lab(ctx, 'enforced in E1: degree ≤ 2', hb.x, 554, { cls: 'small', at: T.at, out: 'same-0.15' });
    XK.lab(ctx, 'control: degree 3, never enforced', hb.x, 640, { cls: 'small', at: ctx.at(T.at) + 0.3, out: 'same-0.15' });
    K.chip(ctx, { text: 'E1: 9 enforced (models D, F) · 10 as control · R:434, R:727', kind: 'plain', maxWidth: 880, x: 120, y: 800, at: ctx.at(T.at) + 0.6, out: 'same-0.15' });
    // proof lines
    const PLs = P.proof_lines.map((L, k) => K.equation(ctx, { tex: L.tex, x: 900, y: 570 + 90 * k, size: 30, anchor: 'left', at: ctx.at(L.at) - 0.15, reveal: [], out: 'fixed-0.15' }));
    K.pen(ctx, { kind: 'box', target: PLs[1].root, pad: 8, at: 'same+1.8', out: 'fixed-0.15' });
    // fixed point N₊ (closed formula, root with D > 0)
    const Vf = -Math.sqrt(mu * nu), Qa = Math.sqrt(nu + G * Math.sqrt(nu / mu)), Qf = -Qa, Df = -Qf * Math.sqrt(mu / nu);
    const fp = K.s('circle', { cx: X(Qf), cy: Y(Df), r: 9, fill: K.c('fg') }, ov); XK.timed(ctx, fp, 'fixed-0.15', null);
    void Vf;
    XK.lab(ctx, 'unstable fixed point: nothing moves', X(Qf) + 24, Y(Df) - 56, { at: 'fixed+0.2', cls: 'small halo' });
    const LP = P.loop, th = LP.tilt_deg * Math.PI / 180, lpt = (a) => [Qf + LP.rx * Math.cos(a) * Math.cos(th) - LP.ry * Math.sin(a) * Math.sin(th), Df + LP.rx * Math.cos(a) * Math.sin(th) + LP.ry * Math.sin(a) * Math.cos(th)];
    let ld = ''; for (let i = 0; i <= 60; i++) { const p = lpt(2 * Math.PI * i / 60); ld += (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1); }
    const loop = K.s('path', { d: ld, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, ov); XK.timed(ctx, loop, 'loop-0.15', null);
    const ldot = K.s('circle', { r: 7, fill: K.c('fg') }, ov); XK.timed(ctx, ldot, 'loop-0.15', null);
    K.chip(ctx, { text: 'SCHEMATIC loop · unstable periodic orbits exist at this setting · P4:1541', kind: 'schematic', maxWidth: 800, x: 120, y: 776, at: 'loop-0.15', out: 'fit+0.6' });
    // the three lamp cards
    const LA = P.lamps, cw = 250, chh = 230, xs = [960, 1235, 1510], cy0 = 330;
    const cards = K.svgLayer(ctx, 13);
    LA.cards.forEach((nm, k) => {
      const g = K.s('g', {}, cards), x0 = xs[k];
      K.s('rect', { x: x0, y: cy0, width: cw, height: chh, rx: 8, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 2 }, g);
      const ix = x0 + cw / 2, iy = cy0 + 130;
      if (k === 0) { const r = S.rng('mini'); for (let i = 0; i < 160; i++) { const j = Math.floor(r() * N); K.s('circle', { cx: ix + 22 * XS[3 * j], cy: iy - 22 * XS[3 * j + 1], r: 2, fill: K.c('matter') }, g); } }
      if (k === 1) K.s('circle', { cx: ix, cy: iy, r: 8, fill: K.c('fg') }, g);
      if (k === 2) K.s('ellipse', { cx: ix, cy: iy, rx: 50, ry: 30, transform: `rotate(-30 ${ix} ${iy})`, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, g);
      XK.timed(ctx, g, ctx.at('fixed-0.15') + LA.stagger * k, null);
      XK.lab(ctx, nm, ix, cy0 + 10, { anchor: 'c', cls: 'small', w: cw - 24, at: ctx.at('fixed-0.15') + LA.stagger * k });
      XK.lamp(ctx, x0 + 16, cy0 + chh + 16, '$\\mathbb{E}[\\mathcal{L}\\varphi] = 0$ ✓', k === 2 ? 'loop+0.3' : ctx.at('fixed+0.6') + LA.stagger * k, { show: ctx.at('fixed-0.15') + LA.stagger * k });
      if (k) K.pen(ctx, { kind: 'cross', box: { x: x0 + 40, y: cy0 + 90, w: cw - 80, h: chh - 120 }, at: ctx.at('fit-0.15') + 0.3 * (k - 1) });
    });
    XK.lab(ctx, 'passes, but not the physics', 1235 + cw / 2, cy0 - 50, { anchor: 'c', at: 'fit+0.5' });
    XK.tex(ctx, P.fit.tex, 960, 660, { size: 40, at: 'fit+0.2' });
    K.pen(ctx, { kind: 'underline', box: { x: 960, y: 662, w: 70, h: 44 }, offset: 14, at: 'fit+0.6' });
    XK.lab(ctx, P.fit.tag, 1190, 666, { at: 'fit+0.7' });
    K.chip(ctx, { text: 'necessity: classical (Echeverría 1982) · R:110', kind: 'plain', x: 120, y: 740, at: 'fit+1.0' });
    K.chip(ctx, { text: 'physical measure: zero-noise selection proved only under Axiom A (Young 2002) · R:570', kind: 'plain', maxWidth: 900, x: 120, y: 790, at: 'fit+1.2' });
    K.formulaLayer(ctx);
    ctx.x25 = { CV, pos, N, NS, X, Y, B, ring, trail, pk, tP: ctx.at('proof-0.15'), dur: P.run.run_dt / 0.5, tF: ctx.at('fixed-0.15'), ldot, lpt, tL: ctx.at('loop-0.15'), per: LP.period_s, tR: ctx.at('rate-0.15') };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.x25, g = c.CV.g;
    // the run: physical time advances run_dt over a stretch of screen time, then holds
    const f = S.seg(t, c.tP, c.tP + 3.0, S.ease.inOutSine) * c.NS, k0 = Math.min(c.NS - 1, Math.floor(f)), w = f - k0;
    const dim = 1 - 0.7 * S.seg(t, c.tF, c.tF + 0.6, S.ease.linear);
    g.clearRect(0, 0, c.CV.w, c.CV.h); g.fillStyle = Scene.col('matter'); g.globalAlpha = 0.55 * dim;
    const at = (i, k) => 2 * (i * (c.NS + 1) + k);
    for (let i = 0; i < c.N; i++) { const a = at(i, k0), q = c.pos[a] + w * (c.pos[a + 2] - c.pos[a]), d = c.pos[a + 1] + w * (c.pos[a + 3] - c.pos[a + 1]);
      g.fillRect(c.X(q) - c.B[0] - 1, c.Y(d) - c.B[1] - 1, 2, 2); }
    g.globalAlpha = 1;
    const a = at(c.pk, k0), q = c.pos[a] + w * (c.pos[a + 2] - c.pos[a]), d = c.pos[a + 1] + w * (c.pos[a + 3] - c.pos[a + 1]);
    c.ring.setAttribute('cx', c.X(q).toFixed(1)); c.ring.setAttribute('cy', c.Y(d).toFixed(1));
    const ro = S.seg(t, c.tR, c.tR + 0.3, S.ease.linear) * (1 - S.seg(t, c.tF, c.tF + 0.4, S.ease.linear)); c.ring.style.opacity = ro;
    let td = ''; for (let k = 0; k <= k0; k++) { const b = at(c.pk, k); td += (k ? 'L' : 'M') + c.X(c.pos[b]).toFixed(1) + ',' + c.Y(c.pos[b + 1]).toFixed(1); }
    td += 'L' + c.X(q).toFixed(1) + ',' + c.Y(d).toFixed(1); c.trail.setAttribute('d', f > 0 ? td : ''); c.trail.style.opacity = ro;
    const p = c.lpt(2 * Math.PI * Math.max(0, t - c.tL) / c.per); c.ldot.setAttribute('cx', c.X(p[0]).toFixed(1)); c.ldot.setAttribute('cy', c.Y(p[1]).toFixed(1));
  },
});
</script></body></html>
