<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ch01.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch01.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch01_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* ch01.Q (question card Q2, no claim, no badge). Everything on the card from the script's "question". Behind it at
   12 %: the two growth curves of 01.3 (fast, and slow just past the threshold), schematic, drifting. */
Scene.define({
  duration: 9.4,
  register: 'night',
  cues: { q: 0.5 },
  params: { bg_opacity: 0.12 },
  setup(ctx) {
    const K = Kit, svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: ctx.params.bg_opacity }, svg);
    [[1.3, 6], [1.06, 4]].forEach(([r, w]) => { let d = ''; for (let i = 0; i <= 100; i++) { const k = 14 * i / 100, e = 40 * Math.pow(r, k), y = e / Math.pow(1 + Math.pow(e / 700, 4), 0.25); d += `${i ? 'L' : 'M'}${(80 + 1760 * i / 100).toFixed(1)},${(860 - y).toFixed(1)}`; }
      K.s('path', { d, fill: 'none', stroke: K.c('b'), 'stroke-width': w }, bg); });
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'ch01', category: 'runs', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-8 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
