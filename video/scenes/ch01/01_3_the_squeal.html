<script>
/* 01.3 The squeal (L1, NIGHT, CONTEXT, SCHEMATIC). Shot 1: bicycle dynamo with its built-in magnet; the Earth makes
   its own. Shot 2: microphone-speaker loop, green gain knob (M2): a sound ring shrinks per lap below the window,
   grows and saturates past it. Shot 3: self-exciting disc; PREDICT; below threshold each turn's bar shrinks
   (params.turn_ratio_below), past it it grows (turn_ratio_fast) into an exponential curve; a slow curve just past
   the threshold (turn_ratio_slow); the fast curve bends into a plateau (the field brakes the disc). Ratios are
   illustrative (params.note): no number on screen. */
Scene.define({
  duration: 55,
  register: 'night',
  cues: { bike: 0.4, own: 4.6, mic: 9.6, whisper: 12.8, past: 15.0, disc: 19.6, loop: 23.0, predict: 26.0, nothing: 34.5, grows: 36.5, slow: 41.7, plateau: 44.0 },
  params: { schematic: true, mic_ratio_below: 0.8, mic_ratio_above: 1.25, disc_speeds_below: [0.55, 0.7, 0.85], turn_ratio_below: 0.85, turn_ratio_slow: 1.06, turn_ratio_fast: 1.3, turns: 14, saturation: 'logistic' },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C1.labOf(ctx, s, s);
    const T = {}; ['bike', 'own', 'mic', 'whisper', 'past', 'disc', 'loop', 'predict', 'nothing', 'grows', 'slow', 'plateau'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    const grey = K.c('fg-2'), lw = { fill: 'none', stroke: grey, 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    // ================= shot 1: the bicycle =================
    const s1 = K.svgLayer(ctx, 12), g1 = K.s('g', {}, s1), bike = K.s('g', {}, g1);
    const TX = 400, TY = 470, TR = 210;
    K.s('circle', { cx: TX, cy: TY, r: TR, ...lw, 'stroke-width': 14, stroke: K.c('matter') }, bike);
    const spokes = K.s('g', {}, bike); for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; K.s('line', { x1: TX, y1: TY, x2: TX + (TR - 8) * Math.cos(a), y2: TY + (TR - 8) * Math.sin(a), stroke: K.c('matter'), 'stroke-width': 2 }, spokes); }
    K.s('circle', { cx: TX, cy: TY, r: 16, fill: K.c('matter') }, bike);
    const da = -0.78, DX = TX + (TR + 34) * Math.cos(da), DY = TY + (TR + 34) * Math.sin(da);   // bottle dynamo on the tyre
    const dyn = K.s('g', { transform: `translate(${DX} ${DY}) rotate(${(da * 180 / Math.PI + 90).toFixed(1)})` }, bike);
    K.s('rect', { x: -26, y: -120, width: 52, height: 110, rx: 14, ...lw }, dyn); const roller = K.s('g', {}, dyn);
    K.s('circle', { cx: 0, cy: 0, r: 20, ...lw }, roller); K.s('line', { x1: -20, y1: 0, x2: 20, y2: 0, ...lw, 'stroke-width': 3 }, roller);
    const wire = K.s('path', { d: `M${DX + 60},${DY - 80} C${DX + 80},${DY - 200} ${TX - 60},${80} ${TX - 160},${150}`, ...lw, 'stroke-width': 2.5 }, bike);
    const lampF = K.s('circle', { cx: TX - 190, cy: 170, r: 36, fill: K.c('fg'), opacity: 0 }, bike); K.s('circle', { cx: TX - 190, cy: 170, r: 36, ...lw }, bike);
    void wire;
    // cutaway of the dynamo body: a coil turning around a fixed magnet
    const cut = K.s('g', { transform: 'translate(1010 430)' }, g1);
    K.s('rect', { x: -200, y: -170, width: 400, height: 340, rx: 24, ...lw, 'stroke-dasharray': '10 8' }, cut);
    K.s('rect', { x: -70, y: -34, width: 140, height: 68, fill: K.c('matter'), stroke: grey, 'stroke-width': 2 }, cut);
    const fl = K.s('g', {}, cut); [50, 80].forEach((r) => { K.s('path', { d: `M70,-8 C${70 + r},${-r} ${-70 - r},${-r} -70,-8`, fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, fl); K.s('path', { d: `M70,8 C${70 + r},${r} ${-70 - r},${r} -70,8`, fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, fl); });
    const coil = [0, 1, 2, 3].map((i) => K.s('ellipse', { cx: -60 + 40 * i, cy: 0, rx: 16, ry: 120, ...lw, 'stroke-width': 3 }, cut));
    const lMot = C1.label(st, lab('motion → electricity'), TX, 60, 'big center');
    const lMag = C1.label(st, lab('built-in magnet'), 1010, 640, 'big center');
    K.pen(ctx, { kind: 'circle', box: { x: 930, y: 386, w: 160, h: 88 }, at: 'own', dur: 0.5, out: 'mic-0.4', seed: 'mag' });
    const earth = K.s('g', {}, g1); const Ei = C1.earth(earth, { x: 1580, y: 430, r: 120 });
    const lOwn = C1.label(st, lab('makes its own'), 1580, 580, 'big center');
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: C1.refL2(C1.chipOf(ctx, /bicycle/, 'REFERENCE · bicycle generator with a permanent magnet · Chiu 2004, US patent 6,703,716')), at: 'bike+0.3', hold: 4 });
    // ================= shot 2: the squeal =================
    const s2 = K.svgLayer(ctx, 12), g2 = K.s('g', {}, s2);
    const LX0 = 560, LX1 = 1360, LY0 = 230, LY1 = 520;
    const loopP = K.s('path', { d: `M${LX0 + 60},${LY0} H${LX1 - 60} Q${LX1},${LY0} ${LX1},${LY0 + 60} V${LY1 - 60} Q${LX1},${LY1} ${LX1 - 60},${LY1} H${LX0 + 60} Q${LX0},${LY1} ${LX0},${LY1 - 60} V${LY0 + 60} Q${LX0},${LY0} ${LX0 + 60},${LY0} Z`, ...lw, 'stroke-width': 3, 'stroke-dasharray': '2 10' }, g2);
    const loopLen = loopP.getTotalLength();
    const amp = K.s('g', { transform: `translate(960 ${LY0})` }, g2); K.s('rect', { x: -70, y: -40, width: 140, height: 80, rx: 8, fill: K.c('panel'), ...lw }, amp); K.s('path', { d: 'M-24,-22 L26,0 L-24,22 Z', ...lw }, amp);
    const mic = K.s('g', { transform: `translate(${LX0} 375)` }, g2); K.s('rect', { x: -30, y: -70, width: 60, height: 100, rx: 30, fill: K.c('panel'), ...lw }, mic); K.s('line', { x1: 0, y1: 30, x2: 0, y2: 80, ...lw }, mic);
    const spk = K.s('g', { transform: `translate(${LX1} 375)` }, g2); K.s('path', { d: 'M-20,-30 H10 L50,-70 V70 L10,30 H-20 Z', fill: K.c('panel'), ...lw }, spk);
    const ring = K.s('circle', { r: 20, fill: 'none', stroke: grey, 'stroke-width': 4 }, g2);
    const meter = K.s('g', { transform: 'translate(1520 520)' }, g2); K.s('rect', { x: -20, y: -290, width: 40, height: 290, ...lw, 'stroke-width': 3 }, meter);
    const mfill = K.s('rect', { x: -14, y: 0, width: 28, height: 0, fill: grey }, meter);
    const lMic = C1.label(st, lab('microphone'), LX0, 470, 'center'), lSpk = C1.label(st, lab('speaker'), LX1, 470, 'center');
    const k2 = K.knob(ctx, { x: 960, y: 650, r: 56, min: 0, max: 1, window: [0.62, 0.7], label: lab('gain'), showValue: false, labelDy: 120, at: 'mic-0.15', out: 'disc-0.3',
      keys: [{ at: 'mic-0.15', v: 0.15 }, { at: 'mic+1.8', v: 0.4, dur: 1.2 }, { at: 'whisper+1.2', v: 0.55, dur: 1.0 }, { at: 'past-0.15', v: 0.8, dur: 1.2 }] });
    void k2;
    K.chip(ctx, { text: C1.refL2(C1.chipOf(ctx, /feedback/, 'REFERENCE · acoustic feedback · van Waterschoot & Moonen 2010')), kind: 'plain', x: 960, y: 570, anchor: 'c', at: 'mic+0.4', out: 'disc-0.3' });
    // ring laps: below (whisper) shrink, above (past) grow then saturate; lap time 0.9 s
    const lap = 0.9, rMax = 70, r0 = 22;
    const ringAt = (t) => {
      if (t >= T.past + 0.2) { const k = (t - T.past - 0.2) / lap, r = Math.min(rMax, r0 * Math.pow(P.mic_ratio_above, k)); return { s: k % 1, r: r + (r >= rMax ? 2.5 * Math.sin(37 * t) : 0), on: true }; }
      if (t >= T.whisper) { const k = (t - T.whisper) / lap, r = r0 * Math.pow(P.mic_ratio_below, k); return { s: k % 1, r, on: k < 3 }; }
      return { on: false };
    };
    // ================= shot 3: the disc =================
    const s3 = K.svgLayer(ctx, 12), g3 = K.s('g', {}, s3);
    const AX = 420, AY = 330;
    K.s('line', { x1: AX, y1: AY - 120, x2: AX, y2: AY + 260, stroke: K.c('matter'), 'stroke-width': 10 }, g3);
    K.s('ellipse', { cx: AX, cy: AY, rx: 190, ry: 62, fill: K.c('matter-dark'), stroke: grey, 'stroke-width': 3 }, g3);
    const marks = K.s('g', {}, g3), markEls = [0, 1, 2, 3, 4, 5].map(() => K.s('line', { x1: AX, y1: AY, x2: AX, y2: AY, stroke: K.c('matter'), 'stroke-width': 3 }, marks));
    const wireD = `M${AX + 190},${AY} H${AX + 300} V${AY + 190} H${AX + 60} ` + [0, 1, 2, 3].map((i) => `C${AX + 60},${AY + 200 + 18 * i} ${AX - 60},${AY + 200 + 18 * i} ${AX - 60},${AY + 190 + 18 * i + 9} C${AX - 60},${AY + 180 + 18 * i + 18} ${AX + 60},${AY + 180 + 18 * i + 18} ${AX + 60},${AY + 190 + 18 * (i + 1)}`).join(' ') + ` H${AX + 16}`;
    const wireP = K.s('path', { d: wireD, ...lw, 'stroke-width': 3.5 }, g3); const wireLen = wireP.getTotalLength();
    const curArrows = [0, 1, 2, 3, 4, 5].map(() => K.s('path', { d: 'M-10,-9 L8,0 L-10,9', fill: 'none', stroke: K.c('b'), 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g3));
    const fArrow = K.s('path', { d: `M${AX},${AY + 270} V${AY + 110} M${AX - 16},${AY + 132} L${AX},${AY + 110} L${AX + 16},${AY + 132}`, fill: 'none', stroke: K.c('b'), 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g3);
    const fLen = fArrow.getTotalLength(); fArrow.style.strokeDasharray = `${fLen} ${fLen + 10}`;
    const brake = K.s('rect', { x: AX + 200, y: AY - 50, width: 26, height: 70, rx: 4, fill: K.c('matter'), stroke: grey, 'stroke-width': 2 }, g3);
    const lCur = C1.label(st, lab('current'), AX + 318, AY + 70), lFld = C1.label(st, lab('field'), AX - 150, AY + 150);
    const lDisc = C1.label(st, lab('copper disc'), AX, AY - 190, 'center'), lCoil = C1.label(st, lab('coil'), AX - 190, AY + 222);
    const lBrake = C1.label(st, lab('the field brakes the disc'), AX + 240, AY - 110);
    K.pen(ctx, { kind: 'arrow', from: [AX + 330, AY + 130], to: [AX - 120, AY + 175], bend: 0.3, at: 'loop+0.9', dur: 0.6, out: 'predict-0.3', seed: 'loopar' });
    K.knob(ctx, { x: 860, y: 620, r: 50, min: 0, max: 1.2, window: [0.88, 0.95], label: lab('speed'), showValue: false, labelDy: 30, at: 'disc-0.15',
      keys: [{ at: 'disc-0.15', v: 0.3 }, { at: 'predict', v: 0.4, dur: 1.5 }, ...P.disc_speeds_below.map((v, i) => ({ at: `nothing+${(0.3 + 1.1 * i).toFixed(2)}`, v, dur: 0.5 })),
        { at: 'grows-0.15', v: 1.1, dur: 0.8 }, { at: 'slow-0.15', v: 0.93, dur: 0.8 }, { at: 'plateau+0.4', v: 0.9, dur: 1.0 }] });
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: C1.refL2(C1.chipOf(ctx, /disc/, 'REFERENCE · self-exciting disc · Bullard 1955 · P3 exercise 2')), at: 'disc+0.3', hold: 4 });
    const opts = [lab('A · bit by bit'), lab('B · nothing until some speed')];
    K.predictCard(ctx, { x: 900, y: 96, w: 860, anchor: 'l', question: lab('Does the field grow bit by bit, or not at all until some speed?'), options: opts, at: 'predict-0.15', answerAt: 'nothing-0.15', pick: 1, out: 'grows-0.5' });
    // bars and curves (SVG), region x 980-1700, baseline y 640
    const s4 = K.svgLayer(ctx, 13), g4 = K.s('g', {}, s4), BX0 = 1000, BX1 = 1700, BY = 640, BH = 430, b0 = 34, dx = (BX1 - BX0) / P.turns;
    K.s('line', { x1: BX0 - 10, x2: BX1, y1: BY, y2: BY, stroke: K.c('muted'), 'stroke-width': 2 }, g4);
    const bars = Array.from({ length: P.turns }, () => K.s('rect', { width: dx * 0.62, fill: K.c('b') }, g4));
    K.s('rect', { x: BX0 - 20, y: BY - BH - 20, width: BX1 - BX0 + 40, height: BH + 30 }, K.s('clipPath', { id: 'c1clip' }, K.s('defs', {}, s4))); const cg = K.s('g', { 'clip-path': 'url(#c1clip)' }, g4);
    const cFast = K.s('path', { fill: 'none', stroke: K.c('b'), 'stroke-width': 5, 'stroke-linecap': 'round' }, cg), cSlow = K.s('path', { fill: 'none', stroke: K.c('b'), 'stroke-width': 4, 'stroke-linecap': 'round' }, cg);
    const lTurn = C1.label(st, lab('each turn: B × (gain / loss)'), 1000, 150, 'big');
    const lExp = C1.label(st, lab('B grows like $e^{st}$'), 1000, 150, 'big');
    const sChip = K.chip(ctx, { text: lab('s = growth rate'), kind: 'plain', caps: false, x: 1000, y: 214, at: 'grows+2.6', out: 'slow-0.3' });
    void sChip;
    const lSlow = C1.label(st, lab('just past the threshold: slow'), 1000, 660, 'big');
    K.chip(ctx, { text: 'SCHEMATIC', kind: 'schematic', x: BX1, y: 156, anchor: 'tr', at: 'grows+0.2' });
    K.formulaLayer(ctx, { label: 'Formula · P3 exercise 2' });
    const Bs = 0.72 * BH, satF = (e) => e / Math.pow(1 + Math.pow(e / Bs, 4), 0.25);   // params.saturation: smooth cap (exponential, then flat)
    const fastY = (k, sat) => { const e = b0 * Math.pow(P.turn_ratio_fast, k); return e + (satF(e) - e) * sat; };
    const slowY = (k) => b0 * Math.pow(P.turn_ratio_slow, k);
    // sound: detents with the knob steps
    window.__EVENTS__ = [T.mic + 1.8, T.past, ...P.disc_speeds_below.map((v, i) => T.nothing + 0.15 + 0.3 + 1.1 * i), T.grows].map((t) => ({ t: +t.toFixed(3), id: 'detent', gain_db: -24 }));
    ctx.c1 = { bike, T, g1, spokes, roller, lampF, coil, fl, lMot, lMag, earth, lOwn, g2, loopP, loopLen, ring, ringAt, mfill, lMic, lSpk, g3, marks, wireP, wireLen, curArrows, fArrow, fLen, brake, lCur, lFld, lDisc, lCoil, lBrake,
      markEls, g4, bars, cFast, cSlow, lTurn, lExp, lSlow, fastY, slowY, BX0, BY, BH, dx, b0, AX, AY, TX, TY, Ei };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, P = ctx.params, c = ctx.c1, T = c.T, fade = C1.fadeEl;
    const sat0 = (tt) => S.seg(tt, T.plateau, T.plateau + 1.4, S.ease.inOutCubic);
    // ---- shot 1
    const o1 = S.seg(t, -0.4, T.bike + 0.3, S.ease.linear) * (1 - S.seg(t, T.mic - 0.4, T.mic + 0.1, S.ease.linear));
    K.show(c.g1, o1 > 0); c.g1.style.opacity = o1.toFixed(3);
    const slide = S.seg(t, T.own + 0.2, T.own + 1.4, S.ease.inOutCubic);
    c.spokes.setAttribute('transform', `rotate(${(70 * t).toFixed(2)} ${c.TX} ${c.TY})`); c.roller.setAttribute('transform', `rotate(${(-560 * t).toFixed(1)})`);
    c.lampF.setAttribute('opacity', (0.9 * S.seg(t, T.bike + 0.8, T.bike + 1.6, S.ease.linear)).toFixed(3));
    c.coil.forEach((e, i) => e.setAttribute('rx', (4 + 16 * Math.abs(Math.cos(2.4 * t + i * 0.5))).toFixed(2)));
    fade(c.lMot, t, T.bike + 0.2, T.own + 0.2); fade(c.lMag, t, T.own + 0.4, T.mic - 0.4);
    fade(c.lOwn, t, T.own + 1.0, T.mic - 0.4);
    c.earth.style.opacity = S.seg(t, T.own + 0.8, T.own + 1.3, S.ease.linear).toFixed(3);
    // the bicycle (tyre, dynamo, lamp) slides left and fades to 20 %: everything of g1 except the cutaway and the Earth
    c.bike.setAttribute('transform', `translate(${(-160 * slide).toFixed(1)} 0)`); c.bike.style.opacity = (1 - 0.8 * slide).toFixed(3);
    // ---- shot 2
    const o2 = S.seg(t, T.mic, T.mic + 0.5, S.ease.linear) * (1 - S.seg(t, T.disc - 0.3, T.disc + 0.2, S.ease.linear));
    K.show(c.g2, o2 > 0); c.g2.style.opacity = o2.toFixed(3); [c.lMic, c.lSpk].forEach((e) => fade(e, t, T.mic + 0.2, T.disc - 0.3));
    const R = c.ringAt(t);
    if (R.on && o2 > 0) { const p = c.loopP.getPointAtLength(R.s * c.loopLen); c.ring.setAttribute('cx', p.x.toFixed(1)); c.ring.setAttribute('cy', p.y.toFixed(1)); c.ring.setAttribute('r', Math.max(0.5, R.r).toFixed(2)); c.ring.style.opacity = 1; }
    else c.ring.style.opacity = 0;
    const lvl = t > T.past + 0.2 ? Math.min(1, 0.12 * Math.pow(P.mic_ratio_above, (t - T.past - 0.2) / 0.9)) : 0.08 * (1 - S.seg(t, T.whisper, T.whisper + 2.7, S.ease.linear)) * (t > T.whisper ? 1 : 0);
    const mh = 280 * lvl * (lvl >= 1 ? 1 - 0.03 * Math.abs(Math.sin(23 * t)) : 1); c.mfill.setAttribute('y', (-mh).toFixed(1)); c.mfill.setAttribute('height', mh.toFixed(1));
    // ---- shot 3
    const o3 = S.seg(t, T.disc, T.disc + 0.5, S.ease.linear);
    K.show(c.g3, o3 > 0); c.g3.style.opacity = o3.toFixed(3);
    [c.lDisc, c.lCoil].forEach((e) => fade(e, t, T.disc + 0.3, T.predict - 0.3));
    fade(c.lCur, t, T.loop + 0.3, T.predict - 0.3); fade(c.lFld, t, T.loop + 0.6, T.predict - 0.3);
    // current chevrons travel along the wire from 'loop'; speed follows the disc
    const on = S.seg(t, T.loop, T.loop + 0.3, S.ease.linear);
    c.curArrows.forEach((a, i) => { const s = ((0.35 * (t - T.loop) + i / 6) % 1 + 1) % 1, L = c.wireLen, p = c.wireP.getPointAtLength(s * L), q = c.wireP.getPointAtLength(Math.min(L, s * L + 2));
      a.setAttribute('transform', `translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${(Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI).toFixed(1)})`); a.style.opacity = (on * (1 - S.seg(t, T.predict - 0.3, T.predict, S.ease.linear))).toFixed(3); });
    c.fArrow.style.strokeDashoffset = (c.fLen * (1 - S.seg(t, T.loop + 0.3, T.loop + 1.0, S.ease.outCubic))).toFixed(1);
    c.fArrow.style.opacity = (t >= T.loop + 0.3 ? 1 : 0) * (1 - S.seg(t, T.predict - 0.3, T.predict, S.ease.linear));
    // the disc's radial marks turn (sped up past the threshold)
    const om = 1.6 * t + 3 * Math.max(0, t - T.grows) * (1 - sat0(t));
    c.markEls.forEach((m, i) => { const a = om + i * Math.PI / 3; m.setAttribute('x2', (c.AX + 180 * Math.cos(a)).toFixed(1)); m.setAttribute('y2', (c.AY + 58 * Math.sin(a)).toFixed(1)); });
    K.show(c.g4, t >= T.nothing);
    c.brake.style.opacity = S.seg(t, T.plateau, T.plateau + 0.3, S.ease.linear).toFixed(3); fade(c.lBrake, t, T.plateau + 0.4);
    // ---- bars and curves
    const BX0 = c.BX0, BY = c.BY, dx = c.dx;
    let bars = 0, ratio = 1, prog = 0;
    for (let i = 0; i < 3; i++) { const a = T.nothing + 0.3 + 1.1 * i; if (t >= a && t < a + 1.1) { bars = 1; ratio = P.turn_ratio_below; prog = (t - a) / 0.9; } }
    const gb = t >= T.grows + 0.6 ? S.seg(t, T.grows + 0.6, T.grows + 2.4, S.ease.linear) : -1;
    c.bars.forEach((b, k) => {
      let h = 0, o = 0;
      if (bars) { h = c.b0 * Math.pow(ratio, k); o = k < 8 && k / 8 <= prog ? 1 - S.seg(prog, 0.85, 1, S.ease.linear) : 0; }
      if (gb >= 0 && k < 6) { h = c.b0 * Math.pow(P.turn_ratio_fast, k); o = (k / 6 <= gb ? 1 : 0) * (1 - S.seg(t, T.grows + 2.6, T.grows + 3.0, S.ease.linear)); }
      b.setAttribute('x', (BX0 + k * dx + dx * 0.19).toFixed(1)); b.setAttribute('y', (BY - h).toFixed(1)); b.setAttribute('height', h.toFixed(1)); b.style.opacity = o.toFixed(3);
    });
    const sat = S.seg(t, T.plateau, T.plateau + 1.4, S.ease.inOutCubic);
    const path = (fy, upTo) => { let d = ''; const n = 120; for (let i = 0; i <= n; i++) { const k = upTo * i / n; d += `${i ? 'L' : 'M'}${(BX0 + dx * (k + 0.5)).toFixed(1)},${(BY - fy(k)).toFixed(1)}`; } return d; };
    const pf = S.seg(t, T.grows + 2.4, T.grows + 3.8, S.ease.inOutSine);

    const ps = S.seg(t, T.slow, T.slow + 1.2, S.ease.inOutSine);
    if (ps > 0) { c.cSlow.setAttribute('d', path(c.slowY, Math.max(0.01, (P.turns - 1) * ps))); c.cSlow.style.opacity = 1; } else c.cSlow.style.opacity = 0;
    fade(c.lTurn, t, T.grows + 0.6, T.grows + 2.3); fade(c.lExp, t, T.grows + 2.6);
    fade(c.lSlow, t, T.slow + 0.6);
  },
});
