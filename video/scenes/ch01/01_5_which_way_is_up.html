<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>01.5 Which way is up?</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch01.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch01_kit.js"></script>
<style>
  .c1-pc { position: absolute; left: 160px; top: 110px; width: 1000px; box-sizing: border-box; padding: 22px 32px 26px; background: var(--panel); border: 2px solid var(--fg-2); border-radius: 12px; z-index: 58; transform-origin: 50% 0; }
  .c1-pc .k { font-family: "JetBrains Mono"; font-size: 28px; letter-spacing: .14em; color: var(--chalk); }
  .c1-pc .q { margin-top: 8px; font-family: "Inter Display"; font-weight: 600; font-size: 44px; color: var(--fg); }
  .c1-pc .row { margin-top: 18px; display: flex; gap: 24px; }
  .c1-pc .btn { padding: 8px 26px 10px; border: 2px solid var(--muted); border-radius: 8px; font-size: 32px; color: var(--fg-2); }
  .c1-pc .btn.lit { border-color: var(--fg); color: var(--fg); background: var(--grid); }
</style>
</head><body><div id="stage"></div>
<script>
/* 01.5 Which way is up? (L1, NIGHT, PROVED · B -> -B invariance). A flat Earth with its dipole field; PREDICT
   (north / south) held by the script; every arrowhead reverses and the shade swaps (same equations); both answers
   light; a mirror plane with the twin (--b-neg); the seed's sign is kept as it grows; the needle flips between them. */
Scene.define({
  duration: 25,
  register: 'night',
  cues: { prefer: 0.4, reverse: 6.9, neither: 10.6, history: 14.8, forbid: 20.0 },
  params: { badge_note: 'B → −B invariance · P3:239' },
  setup(ctx) {
    const K = Kit, S = Scene, st = ctx.stage, lab = (s) => C1.labOf(ctx, s, s);
    const svg = K.svgLayer(ctx, 10);
    const mkEarth = (neg) => { const g = K.s('g', {}, svg); K.s('circle', { r: 150, fill: K.c('matter-dark'), stroke: K.c('matter'), 'stroke-width': 3 }, g); return g; };
    const eA = mkEarth(false), eB = mkEarth(true);
    const lines = C1.dipoleLines(0, 0, [210, 290, 380, 480], 0, 152);
    const L = K.canvasLayer(ctx, 8, { x: 0, y: 0, w: 1920, h: 880 }, null, { reset: true });
    // PREDICT card (own: both answers light on 'neither')
    const pc = K.el('div', { class: 'c1-pc' }, st);
    K.el('div', { class: 'k' }, pc, 'PREDICT'); K.el('div', { class: 'q' }, pc, lab('Which way should the field prefer to point?'));
    const row = K.el('div', { class: 'row' }, pc), bN = K.el('div', { class: 'btn' }, row, lab('north')), bS = K.el('div', { class: 'btn' }, row, lab('south'));
    // mirror plane (M10, metaphor), own drawing (Kit.mirror carries its own arrows and S label)
    const mg = K.s('g', { transform: 'translate(960 400)' }, svg); K.s('line', { x1: 0, y1: -300, x2: 0, y2: 300, stroke: K.c('fg'), 'stroke-width': 4 }, mg);
    for (let y = -290; y < 300; y += 26) K.s('line', { x1: 0, y1: y, x2: 16, y2: y + 16, stroke: K.c('muted'), 'stroke-width': 2 }, mg);
    const lSame = C1.label(st, lab('same equations'), 960, 830, 'big center');
    K.pen(ctx, { kind: 'check', box: { x: 1160, y: 822, w: 40, h: 40 }, at: 'reverse+1.2', out: 'neither-0.2', dur: 0.35, seed: 'same' });
    const lMir = C1.label(st, lab('B → −B: same equations'), 960, 56, 'big center'), lTw = C1.label(st, lab('mirror twins'), 960, 718, 'big center');
    // growth curves under each twin (the seed's sign is kept)
    const gc = K.s('g', {}, svg), mkC = (x0, sgn, col) => { let d = ''; for (let i = 0; i <= 60; i++) { const u = i / 60, v = 0.04 * Math.exp(3.2 * u); d += `${i ? 'L' : 'M'}${(x0 + 260 * u).toFixed(1)},${(640 - sgn * 90 * v / 0.98).toFixed(1)}`; }
      const p = K.s('path', { d, fill: 'none', stroke: K.c(col), 'stroke-width': 5, 'stroke-linecap': 'round' }, gc); const l = p.getTotalLength(); p.style.strokeDasharray = `${l} ${l + 10}`; return { p, l }; };
    const cA = mkC(400, 1, 'b'), cB = mkC(1300, -1, 'b-neg');
    K.s('line', { x1: 380, x2: 680, y1: 640, y2: 640, stroke: K.c('muted'), 'stroke-width': 2 }, gc); K.s('line', { x1: 1280, x2: 1580, y1: 640, y2: 640, stroke: K.c('muted'), 'stroke-width': 2 }, gc);
    const lSp = C1.label(st, lab('+ seed'), 290, 600), lSm = C1.label(st, lab('− seed'), 1170, 640);
    const N = K.needle(ctx, { x: 960, y: 400, size: 240, flips: ['forbid+0.5'], at: 'forbid-0.15', dur: 1.0 });
    void N;
    K.chip(ctx, { text: 'SCHEMATIC', kind: 'schematic', x: 96, y: 124, at: 'neither+0.6' });
    K.badge(ctx, { kind: 'PROVED', note: ctx.params.badge_note, at: -0.3 });
    K.formulaLayer(ctx, { label: 'Formula · P3:239' });
    const T = {}; ['prefer', 'reverse', 'neither', 'history', 'forbid'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    ctx.c1 = { T, eA, eB, lines, L, pc, bN, bS, mg, lSame, lMir, lTw, gc, cA, cB, lSp, lSm };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c1, T = c.T, fade = C1.fadeEl, g = c.L.g;
    // layout: centred Earth (y 600 -> 440), then two twins after 'neither'
    const sp = S.seg(t, T.neither + 0.4, T.neither + 1.8, S.ease.inOutCubic);
    const sc = 1 - 0.38 * sp, ax = 960 - 470 * sp, ay = 470 - 70 * sp, bx = 960 + 470 * sp;
    c.eA.setAttribute('transform', `translate(${ax} ${ay}) scale(${sc.toFixed(4)})`);
    c.eB.setAttribute('transform', `translate(${bx} ${ay}) scale(${sc.toFixed(4)})`); c.eB.style.opacity = sp.toFixed(3);
    c.eA.style.opacity = S.seg(t, -0.4, -0.1, S.ease.linear).toFixed(3);
    // reverse: shade b -> b-neg (1.0 s), hold 1 s, back (0.6 s); arrowheads swing with it
    const rv = S.seg(t, T.reverse, T.reverse + 1.0, S.ease.inOutCubic) * (1 - S.seg(t, T.reverse + 2.0, T.reverse + 2.6, S.ease.inOutCubic));
    const br = 1 + 0.01 * Math.sin(2 * Math.PI * t / 3.4);
    const draw = (x, y, s, neg, emph) => { g.save(); g.translate(x, y); g.scale(s * br, s * br);
      K.drawLines(g, c.lines, { color: neg ? 'b-neg' : 'b', width: (emph ? 3 : 1.6) / s, alpha: 1, progress: S.seg(t, -0.4, 0.6, S.ease.inOutSine) });
      C1.heads(g, c.lines, { fr: [0.5], color: neg ? 'b-neg' : 'b', dir: neg ? -1 : 1, size: 16 / s, progress: S.seg(t, -0.4, 0.6, S.ease.inOutSine) }); g.restore(); };
    g.clearRect(0, 0, 1920, 880);
    const fl = S.seg(t, T.forbid + 0.5, T.forbid + 1.5, S.ease.inOutCubic);
    draw(ax, ay, sc, rv > 0.5, fl < 0.5);
    if (sp > 0) { g.globalAlpha = sp; draw(bx, ay, sc, true, fl >= 0.5); g.globalAlpha = 1; }
    // PREDICT card: in on 'prefer', shrinks to the top on 'reverse', both answers light on 'neither', leaves
    const pin = S.seg(t, T.prefer, T.prefer + 0.4, S.ease.outCubic), shr = S.seg(t, T.reverse, T.reverse + 0.6, S.ease.inOutCubic), out = S.seg(t, T.neither + 0.9, T.neither + 1.4, S.ease.inOutCubic);
    c.pc.style.opacity = (pin * (1 - 0.4 * shr) * (1 - out)).toFixed(3); K.show(c.pc, pin > 0 && out < 1);
    c.pc.style.transform = `translateY(${(20 * (1 - pin) - 0 * shr - 120 * out).toFixed(1)}px)`;   // no scale: the card text stays >= 28 px
    [c.bN, c.bS].forEach((b) => b.classList.toggle('lit', t >= T.neither));
    fade(c.lSame, t, T.reverse + 1.0, T.neither - 0.2);
    c.mg.style.opacity = S.seg(t, T.neither + 0.6, T.neither + 1.4, S.ease.linear).toFixed(3);
    c.mg.setAttribute('transform', `translate(960 ${(400 + 300 * (1 - S.seg(t, T.neither + 0.6, T.neither + 1.4, S.ease.outCubic))).toFixed(1)}) scale(1 ${S.seg(t, T.neither + 0.6, T.neither + 1.4, S.ease.outCubic).toFixed(3)})`);
    fade(c.lMir, t, T.neither + 1.4); fade(c.lTw, t, T.neither + 1.6);
    // growth from the seeds
    c.gc.style.opacity = S.seg(t, T.history, T.history + 0.3, S.ease.linear).toFixed(3);
    [c.cA, c.cB].forEach((q, i) => { q.p.style.strokeDashoffset = (q.l * (1 - S.seg(t, T.history + 0.4 + 0.5 * i, T.history + 1.8 + 0.5 * i, S.ease.inOutSine))).toFixed(1); });
    fade(c.lSp, t, T.history + 0.3); fade(c.lSm, t, T.history + 0.8);
  },
});
</script></body></html>
