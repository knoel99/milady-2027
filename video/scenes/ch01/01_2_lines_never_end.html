<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>01.2 Lines never end</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch01.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch01_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 01.2 Lines never end (L0, NIGHT, CONTEXT). A bar magnet and its field lines, traced in setup from a magnetic-
   charge model of the bar (sheets of charge on the end faces outside, straight S -> N inside), every line closed or
   leaving the frame. Cut; two magnets; a ghost lone pole crossed out; iron filings; a box at three rests with
   'in' / 'out' counts computed from the drawn lines (they agree: a warning if they ever differ). */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { bar: 0.4, cut: 3.4, two: 5.0, never: 8.0, lines: 11.6, box: 15.3, count: 17.0, keep: 19.0 },
  params: { bar: { w: 420, h: 90, n_dipoles: 8, north: 'right' }, seeds: 14, filings: 1500, box_rests: ['empty space', 'the gap between the halves', 'the north end of the right half'],
    cx: 960, cy: 470, split: 160, box: { w: 300, h: 220 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, B = P.bar, CX = P.cx, CY = P.cy;
    const FR = { x0: 0, x1: 1920, y0: 0, y1: 880 };
    // magnets as {x0 (S face), x1 (N face), yc, h}
    const one = [{ x0: CX - B.w / 2, x1: CX + B.w / 2, yc: CY, h: B.h }];
    const two = [{ x0: CX - B.w / 2 - P.split, x1: CX - P.split, yc: CY, h: B.h }, { x0: CX + P.split, x1: CX + B.w / 2 + P.split, yc: CY, h: B.h }];
    const NQ = Math.max(4, B.n_dipoles);
    const Hf = (mags) => { const ch = []; for (const m of mags) for (let i = 0; i < NQ; i++) { const y = m.yc - m.h / 2 + m.h * (i + 0.5) / NQ; ch.push([m.x1, y, 1], [m.x0, y, -1]); }
      return (x, y) => { let hx = 0, hy = 0; for (const [qx, qy, q] of ch) { const dx = x - qx, dy = y - qy, r2 = dx * dx + dy * dy + 4, r3 = r2 * Math.sqrt(r2); hx += q * dx / r3; hy += q * dy / r3; } return [hx, hy]; }; };
    const inside = (m, x, y) => x >= m.x0 && x <= m.x1 && Math.abs(y - m.yc) <= m.h / 2;
    const traceSet = (mags) => {
      const H = Hf(mags), lines = [];
      const trace = (x, y, sgn, start) => {
        const pts = []; const h = 3;
        for (let i = 0; i < 2600; i++) {
          const v = H(x, y), n = Math.hypot(v[0], v[1]) || 1e-9; x += sgn * h * v[0] / n; y += sgn * h * v[1] / n;
          const m = mags.find((mm) => inside(mm, x, y));
          if (m) { // through the magnet, straight, to the other face (S -> N along the field)
            const xe = sgn > 0 ? m.x1 : m.x0; pts.push([x, y]);
            for (let k = 1; k <= 12; k++) pts.push([x + (xe - x) * k / 12, y]);
            x = xe + sgn * 1.5; }
          pts.push([x, y]);
          if (x < FR.x0 - 40 || x > FR.x1 + 40 || y < FR.y0 - 40 || y > FR.y1 + 40) return { pts, closed: false };
          if (start && i > 60 && Math.hypot(x - start[0], y - start[1]) < 4) { pts.push(start.slice()); return { pts, closed: true }; }
        }
        return { pts, closed: false };
      };
      for (const m of mags) for (let i = 0; i < P.seeds; i++) {
        const y = m.yc - m.h / 2 + m.h * (i + 0.5) / P.seeds, s = [m.x1 + 1.5, y];
        const f = trace(s[0], s[1], 1, s);
        if (f.closed) { lines.push([s, ...f.pts]); continue; }
        const b = trace(m.x1 - 1.5, y, -1, null);   // backward: through the magnet to its S face, then out
        lines.push([...b.pts.reverse(), [m.x1 - 1.5, y], s, ...f.pts]);
      }
      return lines;
    };
    const L1 = traceSet(one), L2 = traceSet(two);
    // filings (around the two halves)
    const H2 = Hf(two), rf = S.rng('filings'), fil = [];
    while (fil.length < P.filings) { const x = 140 + 1640 * rf(), y = 90 + 760 * rf(); if (two.some((m) => x > m.x0 - 14 && x < m.x1 + 14 && Math.abs(y - m.yc) < m.h / 2 + 14)) continue;
      const v = H2(x, y), n = Math.hypot(v[0], v[1]) || 1; fil.push([x, y, v[0] / n, v[1] / n]); }
    // magnets (SVG)
    const svg = K.svgLayer(ctx, 14), mg = K.s('g', { 'data-qa': 'over-ok' }, svg);   // QA: S/N letters sit on the opaque magnet body
    const half = (dx0, dx1, lL, lR) => { const g = K.s('g', {}, mg); K.s('rect', { x: dx0, y: CY - B.h / 2, width: dx1 - dx0, height: B.h, fill: K.c('matter'), stroke: K.c('fg-2'), 'stroke-width': 2 }, g);
      const a = K.s('text', { x: dx0 + 22, y: CY + 14, class: 'kt-label' }, g, lL), b2 = K.s('text', { x: dx1 - 22, y: CY + 14, 'text-anchor': 'end', class: 'kt-label' }, g, lR);
      [a, b2].forEach((e) => { e.style.fill = K.c('bg'); e.style.font = '700 40px Inter'; }); return { g, a, b2 }; };
    const hL = half(CX - B.w / 2, CX, 'S', 'N'), hR = half(CX, CX + B.w / 2, 'S', 'N');
    // lone pole ghost
    const gp = K.s('g', { transform: 'translate(1560 190)' }, svg);
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; K.s('line', { x1: 14 * Math.cos(a), y1: 14 * Math.sin(a), x2: 70 * Math.cos(a), y2: 70 * Math.sin(a), stroke: K.c('fg-2'), 'stroke-width': 3 }, gp); }
    K.s('circle', { r: 12, fill: K.c('fg-2') }, gp); const na = K.s('text', { x: 96, y: 10, class: 'kt-label', 'data-qa': 'over-ok' }, gp, C1.labOf(ctx, 'N alone', 'N alone')); na.style.paintOrder = 'stroke'; na.style.stroke = K.c('bg'); na.style.strokeWidth = '8px';
    K.pen(ctx, { kind: 'cross', box: { x: 1490, y: 120, w: 140, h: 140 }, at: 'never+0.6', out: 'lines-0.3', dur: 0.4, seed: 'lone' });
    const pch = K.chip(ctx, { text: C1.refL2(C1.chipOf(ctx, /pole/, 'REFERENCE · no isolated magnetic pole ever observed · P1 §3.3')), kind: 'plain', maxWidth: 520, x: 1560, y: 290, anchor: 'c', at: 'never+0.3', out: 'lines-0.3' });
    pch.root.style.textShadow = 'var(--halo, 0 0 3px var(--bg), 0 0 6px var(--bg), 0 0 10px var(--bg))'; pch.root.setAttribute('data-qa', 'over-ok');   // haloed text over the field lines
    K.pen(ctx, { kind: 'underline', from: null, box: { x: CX - 6, y: CY - B.h / 2 - 40, w: 12, h: B.h + 60 }, at: 'cut-0.15', dur: 0.3, out: 'cut+0.6', seed: 'cutline', offset: -B.h - 60 });
    const cutLine = K.s('line', { x1: CX, x2: CX, y1: CY - B.h / 2 - 30, y2: CY + B.h / 2 + 30, stroke: K.c('chalk'), 'stroke-width': 4.5, 'stroke-dasharray': '10 8', 'stroke-linecap': 'round' }, svg);
    // labels
    const lNever = C1.label(st, C1.labOf(ctx, 'field lines never start or stop', 'field lines never start or stop'), 960, 96, 'big center');
    // box + counts
    const bw = P.box.w, bh = P.box.h, rests = [[430, 230], [CX, CY], [two[1].x1, CY]];
    const boxEl = K.s('rect', { width: bw, height: bh, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 4, 'stroke-dasharray': '14 10', rx: 4 }, svg);
    const tick = K.s('path', { d: 'M-16,0 L-6,10 L14,-12', fill: 'none', stroke: K.c('chalk'), 'stroke-width': 4.5, 'stroke-linecap': 'round' }, svg);
    const counts = rests.map(([x, y]) => { let nin = 0, nout = 0; const ins = (p) => Math.abs(p[0] - x) < bw / 2 && Math.abs(p[1] - y) < bh / 2;
      for (const Lp of L2) for (let i = 1; i < Lp.length; i++) { const a = ins(Lp[i - 1]), b = ins(Lp[i]); if (!a && b) nin++; if (a && !b) nout++; } return [nin, nout]; });
    counts.forEach(([a, b], i) => { if (a !== b) S.warn(`01.2: box rest ${i} counts ${a} in, ${b} out (a line ends inside the frame)`); });
    const cIn = K.el('div', { class: 'c1-count tnum c1-halo', 'data-qa': 'over-ok' }, st), cOut = K.el('div', { class: 'c1-count tnum c1-halo', 'data-qa': 'over-ok' }, st);
    const lEq = C1.label(st, C1.labOf(ctx, 'lines in = lines out', 'lines in = lines out'), 960, 96, 'big center');
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: C1.refL2(C1.chipOf(ctx, /Illinois/, 'REFERENCE · Univ. of Illinois Physics Van 2008 · cutting a magnet')), at: 'two-0.15', hold: 4 });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    // WORKAROUND (kit issue 4: Kit.fitFormula split this item after '= ' and the two lines touched): same statement, a \quad before the words
    const fi = ((ctx.script.onscreen && ctx.script.onscreen.formulas) || []).map((f) => ({ tex: f.tex.replace('\\ \\text{ for every', '\\quad\\text{for every'), at: f.cue }));
    K.formulaLayer(ctx, { label: 'Formula · P1 Proposition 3.8', items: fi });
    const Lc = K.canvasLayer(ctx, 8, { x: 0, y: 0, w: 1920, h: 880 }, null, { reset: true });
    const T = { bar: ctx.at('bar-0.15'), cut: ctx.at('cut-0.15'), two: ctx.at('two-0.15'), never: ctx.at('never-0.15'), lines: ctx.at('lines-0.15'), box: ctx.at('box-0.15'), count: ctx.at('count-0.15'), keep: ctx.at('keep-0.15') };
    // box path: drawn on 'box', then moves to the three rests over ~5 s (0.8 s moves, ~1 s rests), ending after 'count'
    const t1 = Math.max(T.box + 1.2, T.count - 0.9);   // arrives at rest 2 just before 'count'
    T.rest = [T.box, t1, Math.max(t1 + 1.8, T.count + 1.2)];
    ctx.c1 = { L1, L2, fil, Lc, hL, hR, cutLine, lNever, gp, boxEl, tick, rests, counts, cIn, cOut, lEq, T, bw, bh, split: P.split };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c1, T = c.T, g = c.Lc.g;
    // halves slide apart on 'cut'
    const sp = c.split * S.seg(t, T.cut + 0.3, T.cut + 1.3, S.ease.inOutCubic);
    c.hL.g.setAttribute('transform', `translate(${-sp} 0)`); c.hR.g.setAttribute('transform', `translate(${sp} 0)`);
    const pn = S.seg(t, T.two, T.two + 0.25, S.ease.linear);   // new letters at the cut faces
    c.hL.b2.style.opacity = pn; c.hR.a.style.opacity = pn;
    [c.hL.g, c.hR.g].forEach((e) => { e.style.opacity = S.seg(t, -0.4, T.bar + 0.3, S.ease.linear).toFixed(3); });
    c.cutLine.style.opacity = (S.seg(t, T.cut, T.cut + 0.3, S.ease.linear) * (1 - S.seg(t, T.cut + 0.6, T.cut + 0.9, S.ease.linear))).toFixed(3);
    // lines: set 1 drawn on at 'bar', fades at 'cut'; set 2 on 'two'; filings swap on 'lines'
    g.clearRect(0, 0, 1920, 880);
    const p1 = S.seg(t, T.bar, T.bar + 1.2, S.ease.inOutSine) * (1 - S.seg(t, T.cut + 0.2, T.cut + 0.6, S.ease.linear));
    const fl = S.seg(t, T.lines, T.lines + 0.4, S.ease.linear) * (1 - S.seg(t, T.lines + 1.5, T.lines + 2.3, S.ease.linear));
    const p2 = S.seg(t, T.two, T.two + 0.8, S.ease.linear) * (1 - fl);
    if (p1 > 0) { K.drawLines(g, c.L1, { color: 'b', width: 2.6, alpha: 0.9, progress: S.seg(t, T.bar, T.bar + 1.2, S.ease.inOutSine) }); g.globalAlpha = p1 * 0.9; C1.heads(g, c.L1, { fr: [0.3, 0.7], size: 13 }); g.globalAlpha = 1; if (p1 < 1 && t > T.cut) { g.globalCompositeOperation = 'destination-out'; g.fillStyle = `rgba(0,0,0,${1 - p1})`; g.fillRect(0, 0, 1920, 880); g.globalCompositeOperation = 'source-over'; } }
    if (p2 > 0) { g.globalAlpha = p2; K.drawLines(g, c.L2, { color: 'b', width: 2.6, alpha: 0.9 * p2 }); g.globalAlpha = 0.9 * p2; C1.heads(g, c.L2, { fr: [0.3, 0.7], size: 13 }); g.globalAlpha = 1; }
    if (fl > 0) { g.strokeStyle = K.c('b'); g.lineWidth = 2.5; g.globalAlpha = fl; g.beginPath(); for (const [x, y, ux, uy] of c.fil) { g.moveTo(x - 7 * ux, y - 7 * uy); g.lineTo(x + 7 * ux, y + 7 * uy); } g.stroke(); g.globalAlpha = 1; }
    // lone pole ghost
    c.gp.style.opacity = (0.35 * S.seg(t, T.never, T.never + 0.3, S.ease.linear) * (1 - S.seg(t, T.lines - 0.3, T.lines, S.ease.linear))).toFixed(3);
    C1.fadeEl(c.lNever, t, T.lines + 0.3, T.box - 0.3);
    // the box: moves between rests (0.8 s), counts at each rest from 'count'
    const R = c.rests; let bx = R[0][0], by = R[0][1];
    for (let i = 1; i < 3; i++) { const p = S.seg(t, T.rest[i] - 0.8, T.rest[i], S.ease.inOutCubic); bx += (R[i][0] - bx) * p; by += (R[i][1] - by) * p; }
    const bo = S.seg(t, T.box, T.box + 0.4, S.ease.linear) * (1 - 0.5 * S.seg(t, T.keep + 0.6, T.keep + 1.2, S.ease.linear));
    c.boxEl.setAttribute('x', (bx - c.bw / 2).toFixed(1)); c.boxEl.setAttribute('y', (by - c.bh / 2).toFixed(1)); c.boxEl.style.opacity = bo.toFixed(3);
    c.tick.setAttribute('transform', `translate(${(bx + c.bw / 2 + 4).toFixed(1)} ${(by - c.bh / 2 - 4).toFixed(1)})`); c.tick.style.opacity = (S.seg(t, T.keep, T.keep + 0.3, S.ease.linear) * bo).toFixed(3);
    let k = -1; for (let i = 0; i < 3; i++) if (t >= T.rest[i] + (i ? 0 : 0.6) && (i === 2 || t < T.rest[i + 1] - 0.8)) k = i;
    const showC = t >= T.count - 0.15 && k >= 0;
    [c.cIn, c.cOut].forEach((e, j) => { K.show(e, showC); if (!showC) return; e.textContent = `${j ? 'out' : 'in'}  ${c.counts[k][j]}`;
      e.style.left = (bx - c.bw / 2 + 150 * j) + 'px'; e.style.top = (by - c.bh / 2 - 60) + 'px'; e.style.opacity = (bo).toFixed(3); });
    C1.fadeEl(c.lEq, t, T.count + 0.3);
  },
});
</script></body></html>
