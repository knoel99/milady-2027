<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>01.6 Checkpoint: the big picture</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch01.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch01_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 01.6 Checkpoint (L1, NIGHT, no badge): recap with motifs only. The rail climbs L0 -> L1; three tiles keyed to the
   words of 'recap' (moving iron, a loop with a threshold, no favourite direction); the disc tile loses its wire
   (no wires in liquid iron); the tiles go to the top and a blue flow line carries a vermillion thread (two inks
   teaser), with a chalk question mark. */
Scene.define({
  duration: 13,
  register: 'night',
  cues: { recap: 0.6, wires: 5.2, next: 8.4 },
  params: { rail: { from: 'L0', to: 'L1' } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C1.labOf(ctx, s, s);
    K.rail(ctx, { from: P.rail.from, to: P.rail.to, at: 0.3, hold: 3 });
    const lLev = C1.label(st, lab('Level 0 → Level 1'), 120, 840, 'mono');
    const grp = K.el('div', { class: 'c1-grp' }, st); grp.style.zIndex = 12;
    const svg = K.svgLayer(ctx, 12, grp), TW = 460, TH = 300, TY = 230, TX = [200, 730, 1260];
    const tiles = TX.map((x) => { const g = K.s('g', {}, svg); K.s('rect', { x, y: TY, width: TW, height: TH, rx: 16, fill: K.c('panel'), stroke: K.c('muted'), 'stroke-width': 3 }, g); return g; });
    // tile 1: core with field lines
    const c1 = TX[0] + TW / 2, cy = TY + TH / 2;
    C1.dipoleLines(c1, cy, [90, 130, 180], 0, 60, 90).forEach((Lp) => K.s('path', { d: 'M' + Lp.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' L'), fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, tiles[0]));
    C1.earth(tiles[0], { x: c1, y: cy, r: 60 });
    // tile 2: green knob + growing staircase
    const kg = K.s('g', {}, tiles[1]); const kx = TX[1] + 110, kr = 54;
    K.s('circle', { cx: kx, cy, r: kr, fill: K.c('panel'), stroke: K.c('matter'), 'stroke-width': 4 }, kg);
    K.s('path', { d: `M${kx + kr + 14},${cy - 10} A${kr + 14},${kr + 14} 0 0 1 ${kx + kr + 4},${cy + 30}`, fill: 'none', stroke: K.rgba(K.c('param'), 0.4), 'stroke-width': 16 }, kg);
    const kp = K.s('line', { x1: kx, y1: cy, x2: kx, y2: cy - kr + 10, stroke: K.c('param'), 'stroke-width': 8, 'stroke-linecap': 'round' }, kg);
    const bars = [0, 1, 2, 3, 4, 5].map((i) => { const h = 16 * Math.pow(1.35, i); return K.s('rect', { x: TX[1] + 220 + 34 * i, y: TY + TH - 40 - h, width: 22, height: h, fill: K.c('b') }, tiles[1]); });
    // tile 3: twins and a needle
    const t3 = TX[2] + TW / 2;
    [[-130, 'b', 1], [130, 'b-neg', -1]].forEach(([dx, col]) => { const x = t3 + dx; C1.dipoleLines(x, cy, [60, 85], 0, 34, 60).forEach((Lp) => K.s('path', { d: 'M' + Lp.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' L'), fill: 'none', stroke: K.c(col), 'stroke-width': 3 }, tiles[2])); K.s('circle', { cx: x, cy, r: 32, fill: K.c('matter-dark'), stroke: K.c('matter'), 'stroke-width': 2 }, tiles[2]); });
    K.s('line', { x1: t3, x2: t3, y1: TY + 30, y2: TY + TH - 30, stroke: K.c('fg'), 'stroke-width': 3 }, tiles[2]);
    const nd = K.s('g', { transform: `translate(${t3} ${cy})` }, tiles[2]); K.s('path', { d: 'M0,-40 L7,0 L-7,0 Z', fill: K.c('b') }, nd); K.s('path', { d: 'M0,40 L7,0 L-7,0 Z', fill: K.c('matter') }, nd);
    const tl = [lab('moving iron'), lab('a loop with a threshold'), lab('no favourite direction')].map((s, i) => C1.label(st, s, TX[i] + TW / 2, TY + TH + 20, 'big center'));
    // the disc tile over the middle tile; its wire is erased
    const dt = K.s('g', {}, svg); K.s('rect', { x: TX[1], y: TY, width: TW, height: TH, rx: 16, fill: K.c('panel'), stroke: K.c('muted'), 'stroke-width': 3 }, dt);
    const dx0 = TX[1] + 160;
    const disc = K.s('ellipse', { cx: dx0, cy: cy - 30, rx: 110, ry: 36, fill: K.c('matter-dark'), stroke: K.c('fg-2'), 'stroke-width': 3 }, dt);
    const wireD = `M${dx0 + 110},${cy - 30} H${dx0 + 230} V${cy + 80} H${dx0 + 20}`;
    const wire = K.s('path', { d: wireD, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 4 }, dt); const wl = wire.getTotalLength(); wire.style.strokeDasharray = `${wl} ${wl + 10}`;
    const blob = K.s('path', { d: `M${dx0 - 120},${cy} C${dx0 - 120},${cy - 90} ${dx0 + 60},${cy - 110} ${dx0 + 160},${cy - 50} C${dx0 + 260},${cy + 10} ${dx0 + 170},${cy + 100} ${dx0 + 40},${cy + 90} C${dx0 - 60},${cy + 84} ${dx0 - 120},${cy + 60} ${dx0 - 120},${cy} Z`, fill: K.c('matter'), stroke: K.c('fg-2'), 'stroke-width': 3 }, dt);
    const lWire = C1.label(st, lab('no wires in liquid iron'), 960, 620, 'big center');
    // teaser: blue flow line carrying a vermillion thread
    const ts = K.svgLayer(ctx, 13), tg = K.s('g', {}, ts);
    let fd = ''; for (let i = 0; i <= 200; i++) { const u = i / 200, x = 300 + 1320 * u, y = 560 + 110 * Math.sin(2 * Math.PI * 1.3 * u) * Math.sin(Math.PI * u); fd += `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`; }
    const flow = K.s('path', { d: fd, fill: 'none', stroke: K.c('u'), 'stroke-width': 6, 'stroke-linecap': 'round' }, tg); const fLen = flow.getTotalLength(); flow.style.strokeDasharray = `${fLen} ${fLen + 10}`;
    const thr = K.s('path', { d: fd, fill: 'none', stroke: K.c('b'), 'stroke-width': 3, transform: 'translate(0 -14)' }, tg); thr.style.strokeDasharray = `${fLen} ${fLen + 10}`;
    const qm = K.s('text', { x: 1700, y: 520, 'text-anchor': 'middle', class: 'kt-big' }, ts, '?'); qm.style.fill = K.c('chalk');
    const lNext = C1.label(st, lab('What motion can do this? How fast?'), 960, 720, 'big center');
    // words of 'recap': tiles keyed to the sentence's start/end
    const sen = (ctx.script.sentences || []).find((s) => s.cue === 'recap');
    const a = ctx.at('recap-0.15'), e = sen ? sen.end : a + 3.5;
    const T = { tile: [a, a + 0.33 * (e - a), a + 0.62 * (e - a)], wires: ctx.at('wires-0.15'), next: ctx.at('next-0.15') };
    ctx.c1 = { T, grp, tiles, tl, kg, kp, bars, nd, dt, wire, wl, blob, disc, lWire, tg, flow, thr, fLen, qm, lNext, lLev };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c1, T = c.T, fade = C1.fadeEl;
    fade(c.lLev, t, 0.3, 3.3);
    c.tiles.forEach((g, i) => { const p = S.seg(t, T.tile[i], T.tile[i] + 0.5, S.ease.outCubic); g.style.opacity = p.toFixed(3); g.setAttribute('transform', `translate(${(-60 * (1 - p)).toFixed(1)} 0)`); });
    // the frame is never empty: the first tile's outline is there from frame 0 (dim)
    if (t < T.tile[0]) c.tiles[0].style.opacity = 0.25;
    c.tl.forEach((l, i) => fade(l, t, T.tile[i] + 0.2, T.next));
    c.kp.setAttribute('transform', `rotate(${(-60 + 140 * S.seg(t, T.tile[1], T.tile[1] + 1.2, S.ease.inOutCubic)).toFixed(1)} ${c.kp.getAttribute('x1')} ${c.kp.getAttribute('y1')})`);
    c.bars.forEach((b, i) => { b.style.opacity = t >= T.tile[1] + 0.4 + 0.15 * i ? 1 : 0; });
    c.nd.setAttribute('transform', `translate(${c.nd.transform.baseVal[0].matrix.e} ${c.nd.transform.baseVal[0].matrix.f}) rotate(${(180 * S.spring((t - T.tile[2] - 0.5) / 1.0, 0.03)).toFixed(2)})`);
    // disc tile over the middle one, the wire erased, the tile becomes a blob of liquid metal
    const dIn = S.seg(t, T.wires, T.wires + 0.5, S.ease.outCubic);
    c.dt.style.opacity = dIn * (1 - S.seg(t, T.next, T.next + 0.4, S.ease.linear)); K.show(c.dt, dIn > 0);
    c.dt.setAttribute('transform', `translate(0 ${(30 * (1 - dIn)).toFixed(1)})`);
    const er = S.seg(t, T.wires + 0.9, T.wires + 1.6, S.ease.inOutSine);
    c.wire.style.strokeDashoffset = (-c.wl * er).toFixed(1);
    const bl = S.seg(t, T.wires + 1.6, T.wires + 2.2, S.ease.linear); c.blob.style.opacity = bl; c.disc.style.opacity = 1 - bl;
    fade(c.lWire, t, T.wires + 1.6, T.next);
    // next: tiles shrink to the top edge; the two-inks teaser; question mark
    const up = S.seg(t, T.next, T.next + 1.0, S.ease.inOutCubic), s = 1 - 0.55 * up;
    c.grp.style.transform = `translate(${(960 * (1 - s)).toFixed(1)}px, ${(-33 * up).toFixed(1)}px) scale(${s.toFixed(4)})`;
    c.grp.style.transformOrigin = '0 0';
    c.kg.style.opacity = (1 - 0.6 * S.seg(t, T.next + 0.4, T.next + 0.8, S.ease.linear)).toFixed(3);
    const fp = S.seg(t, T.next + 0.5, T.next + 2.5, S.ease.inOutSine);
    c.flow.style.strokeDashoffset = (c.fLen * (1 - fp)).toFixed(1); c.thr.style.strokeDashoffset = (c.fLen * (1 - S.seg(t, T.next + 0.9, T.next + 2.9, S.ease.inOutSine))).toFixed(1);
    c.tg.style.opacity = t >= T.next + 0.5 ? 1 : 0;
    c.tg.setAttribute('transform', `translate(0 ${(6 * Math.sin(2 * Math.PI * t / 2.6)).toFixed(2)})`);
    c.qm.style.opacity = S.seg(t, T.next + 1.4, T.next + 1.8, S.ease.linear); fade(c.lNext, t, T.next + 1.0);
  },
});
</script></body></html>
