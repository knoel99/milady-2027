<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA1.5 A few dials</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA1.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="map.js"></script>
<script src="chSOA1_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* SOA1.5 A few dials (L2, NIGHT, CONTEXT). The shared map; lane 5 lit; a grey tank collapses into three small dials;
   R1958 with two coupled discs and a field arrow that flips; R2008 (silent), R2012 with three dials D, Q, V
   wiggling (params.dial_wiggle: deterministic schematic noise, D changes sign twice; SCHEMATIC); on 'four' the
   DATA-DRIVEN lane unfolds, D2016, the arrow to R2026 (dotted tie to S2026B, same paper), four dials D Q V U. */
Scene.define({
  duration: 24,
  register: 'night',
  cues: { dials: 0.4, discs: 3.2, three: 7.0, four: 13.0 },
  params: { present: [], add: [], dial_wiggle: { seed: 2012 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C2.labOf(ctx, s, s);
    const map = SOA.map(ctx, { scene: 'SOA1.5', present: P.present, add: P.add, lit: [['reduced', 'dials-0.15']], dataLane: { at: 'four-0.15' }, activeFor: { R2008: 2.0 },
      flips: { R1958: ['discs+1.4'] }, arrows: [{ from: 'D2016', to: 'R2026', at: 'four+0.3' }, { from: 'R2026', to: 'S2026B', at: 'four+1.5', dashed: true }] });
    const svg = K.svgLayer(ctx, 14), ly = map.laneY('reduced');
    // tank -> dials
    const tank = K.s('g', { transform: `translate(600 ${ly})` }, svg); K.s('rect', { x: -60, y: -40, width: 120, height: 80, rx: 12, fill: K.c('matter-dark'), stroke: K.c('matter'), 'stroke-width': 3 }, tank);
    const mkDial = (x, name, col) => { const g = K.s('g', { transform: `translate(${x} ${ly - 6})` }, svg); K.s('circle', { r: 24, fill: K.c('panel'), stroke: K.c('chalk'), 'stroke-width': 3 }, g);
      const n = K.s('line', { x1: 0, y1: 0, x2: 0, y2: -18, stroke: K.c(col), 'stroke-width': 4, 'stroke-linecap': 'round' }, g); const tl = K.s('text', { x: 0, y: 60, 'text-anchor': 'middle', class: 'kt-label' }, g, name); return { g, n, tl }; };
    const d3 = [mkDial(530, lab('D'), 'b'), mkDial(600, lab('Q'), 'chalk'), mkDial(670, lab('V'), 'chalk')];
    const d4 = [mkDial(500, lab('D'), 'b'), mkDial(570, lab('Q'), 'chalk'), mkDial(640, lab('V'), 'chalk'), mkDial(710, lab('U'), 'chalk')];
    // two coupled discs (copper-grey, matter), field arrow that flips
    const dg = K.s('g', { transform: `translate(790 ${ly + 6})` }, svg);
    [-36, 36].forEach((x) => K.s('ellipse', { cx: x, cy: 10, rx: 30, ry: 10, fill: K.c('matter'), stroke: K.c('fg-2'), 'stroke-width': 2 }, dg));
    K.s('path', { d: 'M-36,10 C-36,34 36,34 36,10', fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2 }, dg);
    const fa = K.s('g', { transform: 'translate(0 -22)' }, dg); K.s('path', { d: 'M-26,0 H20 M10,-9 L24,0 L10,9', fill: 'none', stroke: K.c('b'), 'stroke-width': 4, 'stroke-linecap': 'round' }, fa);
    const sen = (ctx.script.sentences || []).find((s) => s.cue === 'three'); const tEnd3 = sen ? sen.end : ctx.at('three') + 4;
    K.chip(ctx, { text: 'SCHEMATIC', kind: 'schematic', x: 600, y: ly - 54, anchor: 'b', at: 'three+0.2', out: tEnd3 });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    // deterministic wiggle: sums of sines with seeded phases; D gets an offset sign pattern (two sign changes)
    const r = S.rng('wig' + P.dial_wiggle.seed), ph = Array.from({ length: 12 }, () => 6.283 * r());
    const T = { dials: ctx.at('dials-0.15'), discs: ctx.at('discs-0.15'), three: ctx.at('three-0.15'), four: ctx.at('four-0.15'), tEnd3 };
    ctx.s1 = { T, tank, d3, d4, dg, fa, ph };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.s1, T = c.T;
    const col = S.seg(t, T.dials, T.dials + 0.8, S.ease.inOutCubic);
    c.tank.style.opacity = (1 - col) * S.seg(t, T.dials - 0.3, T.dials, S.ease.linear); c.tank.setAttribute('transform', c.tank.getAttribute('transform').replace(/ scale\(.*\)/, '') + ` scale(${(1 - 0.6 * col).toFixed(3)})`);
    const o3 = S.seg(t, T.dials + 0.5, T.dials + 0.9, S.ease.linear) * (1 - S.seg(t, T.tEnd3 + 0.2, T.tEnd3 + 0.5, S.ease.linear));
    const u = Math.max(0, t - T.three), dSign = (u < 1.2 ? 1 : u < 2.6 ? -1 : 1);
    c.d3.forEach((d, i) => { d.g.style.opacity = o3.toFixed(3); d.tl.style.opacity = S.seg(t, T.three, T.three + 0.3, S.ease.linear);
      let a = 25 * Math.sin(1.7 * t + c.ph[i]) + 12 * Math.sin(3.1 * t + c.ph[i + 3]);
      if (i === 0) a = t >= T.three ? dSign * (60 + 15 * Math.sin(2.3 * t + c.ph[6])) : a;
      d.n.setAttribute('transform', `rotate(${a.toFixed(1)})`); });
    const o4 = S.seg(t, T.four + 1.4, T.four + 1.8, S.ease.linear);
    c.d4.forEach((d, i) => { d.g.style.opacity = o4.toFixed(3); d.n.setAttribute('transform', `rotate(${(30 * Math.sin(1.3 * t + c.ph[i + 6]) + 10 * Math.sin(2.9 * t + c.ph[i])).toFixed(1)})`); });
    const od = S.seg(t, T.discs + 0.1, T.discs + 0.4, S.ease.linear) * (1 - S.seg(t, T.discs + 3.0, T.discs + 3.3, S.ease.linear)); c.dg.style.opacity = od.toFixed(3);
    c.fa.setAttribute('transform', `translate(0 -22) rotate(${(180 * S.spring((t - T.discs - 1.55) / 0.8, 0.03)).toFixed(1)})`);
  },
});
</script></body></html>
