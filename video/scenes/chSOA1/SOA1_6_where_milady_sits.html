<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA1.6 Where MilaDy sits</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA1.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="map.js"></script>
<script src="chSOA1_kit.js"></script>
<style>
  .s1-mil { position: absolute; right: 290px; top: 190px; max-width: 560px; box-sizing: border-box; padding: 8px 16px 10px; background: var(--panel); border-left: 4px solid var(--chalk); z-index: 34; white-space: nowrap; }
  .s1-mil .a { font: 600 28px Inter; color: var(--fg); } .s1-mil .b { font: 500 28px Inter; color: var(--fg-2); } .s1-mil .c { font: 500 28px "JetBrains Mono"; color: var(--muted); white-space: normal; }
</style>
</head><body><div id="stage"></div>
<script>
/* SOA1.6 Where MilaDy sits (L2, NIGHT, CONTEXT + PLANNED). The whole map; the MilaDy bracket over lanes 3-5 from
   2026 to 2030 with its callout (params.milady, placed over the empty right side of the dimmed lanes 1-2); the two
   2026 diamonds pulse; S2026C (silent) with its arrow to DRESDYN; the data lane pulses and D2022 lands with its
   chip; the PLANNED violet internship dot and thesis ring (a breathing violet cloud inside, params.cloud) with
   dashed leaders to lanes 4 and 5; on 'race' every lane flashes, the map dims and the caption with the stretch and
   smudge icons hands off to 03.1. */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { milady: 0.4, thin: 7.2, bet: 15.6, race: 23.2 },
  params: { present: [], add: [] },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C2.labOf(ctx, s, s);
    const M = P.milady || { bracket: { from_year: 2026, to_year: 2030, lanes: ['lab', 'sim', 'reduced'] }, line1: '', line2: '', subtitle: '' };
    const map = SOA.map(ctx, { scene: 'SOA1.6', present: P.present, add: P.add, dataLane: true, activeFor: { S2026C: 3.0, INTERN: 0.6 },
      lit: [['lab', 'milady-0.15', 'race-0.15'], ['sim', 'milady-0.15', 'race-0.15'], ['reduced', 'milady-0.15', 'race-0.15']], dim: [[['earth', 'theory'], 'milady-0.15', undefined, 0.5]],
      arrows: [{ from: 'S2026C', to: 'LDRES', at: 'milady+2.0' }] });
    const svg = K.svgLayer(ctx, 15), D = window.SOA_MAP.map;
    const lan = M.bracket.lanes.map((id) => D.lanes.find((L) => L.id === id)), y0 = Math.min(...lan.map((L) => L.y0)), y1 = Math.max(...lan.map((L) => L.y1));
    const bx0 = map.xOf(M.bracket.from_year), bx1 = map.xOf(M.bracket.to_year);
    const band = K.s('rect', { x: bx0, y: y0, width: bx1 - bx0, height: y1 - y0, fill: K.rgba(K.c('fg'), 0.06) }, svg);
    const br = K.s('path', { d: `M${bx0 + 14},${y0 + 4} H${bx0} V${y1 - 4} H${bx0 + 14}`, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 4 }, svg); const bl = br.getTotalLength(); br.style.strokeDasharray = `${bl} ${bl + 10}`;
    const mil = K.el('div', { class: 's1-mil' }, st); K.el('div', { class: 'a' }, mil, M.line1); K.el('div', { class: 'b' }, mil, M.subtitle); K.el('div', { class: 'c' }, mil, M.line2);
    const lead = K.s('path', { d: `M${1920 - 290},${270} C${bx0 - 10},${290} ${bx0 - 6},${y0 - 20} ${bx0},${y0 + 4}`, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 2, 'stroke-dasharray': '5 6' }, svg);
    // D2022 chip; PLANNED chip under the badge
    const d22 = map.pins.D2022;
    K.chip(ctx, { text: P.gwirtz_chip || lab(/FIVE REVERSALS/), kind: 'schematic', x: 1640, y: 826, anchor: 'tr', at: 'thin+0.4', out: 'thin+3.4' });
    K.chip(ctx, { text: 'PLANNED', kind: 'schematic', x: 1824, y: 110, anchor: 'tr', at: 'bet-0.15' });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    // thesis ring spanning 2027-2030 in the data lane, violet cloud, leaders to lanes 4 and 5
    const dl = D.lanes.find((L) => L.id === 'data'), dy = (dl.y0 + dl.y1) / 2, tx0 = map.xOf(2027), tx1 = map.xOf(2030);
    const ring = K.s('ellipse', { cx: (tx0 + tx1) / 2, cy: dy, rx: (tx1 - tx0) / 2 + 8, ry: 28, fill: 'none', stroke: K.c('model'), 'stroke-width': 3, 'stroke-dasharray': '7 6' }, svg);
    const cl = P.cloud || { points: 40, seed: 2027, radius_px: 26 }, rr = S.rng('cloud' + cl.seed);
    const pts = Array.from({ length: cl.points }, () => { const a = 6.283 * rr(), r = cl.radius_px * Math.sqrt(rr()); return [Math.cos(a) * r * 1.6, Math.sin(a) * r * 0.8, 6.283 * rr()]; });
    const cg = K.s('g', { transform: `translate(${(tx0 + tx1) / 2} ${dy})` }, svg), dots = pts.map(() => K.s('circle', { r: 2.6, fill: K.c('model') }, cg));
    const leads = (P.thesis_leaders || ['sim', 'reduced']).map((id, i) => { const L = D.lanes.find((q) => q.id === id), x = (tx0 + tx1) / 2 + (i ? 20 : -20);
      return K.s('path', { d: `M${x},${dy - 28} V${(L.y0 + L.y1) / 2 + 20}`, fill: 'none', stroke: K.c('model'), 'stroke-width': 2.5, 'stroke-dasharray': '6 6' }, svg); });
    // race: dim overlay, caption and the two icons
    const dim = K.el('div', {}, st); Object.assign(dim.style, { position: 'absolute', left: 0, top: 0, width: '1920px', height: '880px', background: 'var(--bg)', zIndex: 38, opacity: 0 });
    const ic = K.svgLayer(ctx, 40); const rgp = K.s('g', {}, ic);
    const i1 = K.s('g', { transform: 'translate(560 680)' }, rgp), i2 = K.s('g', { transform: 'translate(1360 680)' }, rgp);
    const thread = K.s('path', { d: 'M-80,0 C-30,-30 30,30 80,0', fill: 'none', stroke: K.c('b'), 'stroke-width': 5, 'stroke-linecap': 'round' }, i1);
    K.s('path', { d: 'M-80,0 C-30,-30 30,30 80,0', fill: 'none', stroke: K.c('matter'), 'stroke-width': 30, 'stroke-linecap': 'round', opacity: 0.45 }, i2);
    const blurT = K.s('path', { d: 'M-80,0 C-30,-30 30,30 80,0', fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, i2);
    const cap = C2.label(st, P.race_caption || lab(/one race/), 960, 650, 'big center'); cap.style.zIndex = 41; cap.style.fontSize = '32px';
    const flashes = Object.values(map.lanes).map((E) => E.lab);
    const T = { mil: ctx.at('milady-0.15'), thin: ctx.at('thin-0.15'), bet: ctx.at('bet-0.15'), race: ctx.at('race-0.15') };
    ctx.s1 = { T, map, band, br, bl, mil, lead, ring, cg, dots, pts, leads, dim, rgp, thread, blurT, cap, flashes, dlEl: map.lanes.data };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.s1, T = c.T, fade = C2.fadeEl;
    const pb = S.seg(t, T.mil, T.mil + 0.7, S.ease.inOutSine); c.br.style.strokeDashoffset = (c.bl * (1 - pb)).toFixed(1); c.br.style.opacity = t >= T.mil ? 1 : 0;
    c.band.style.opacity = S.seg(t, T.mil + 0.5, T.mil + 1.0, S.ease.linear).toFixed(3);
    fade(c.mil, t, T.mil + 0.6); c.lead.style.opacity = S.seg(t, T.mil + 0.8, T.mil + 1.1, S.ease.linear).toFixed(3);
    ['S2026B', 'R2026'].forEach((id) => { const q = c.map.pins[id]; if (!q) return; const p = Math.sin(Math.PI * S.seg(t, T.mil + 0.9, T.mil + 1.3, S.ease.inOutSine)); q.gl.setAttribute('transform', `scale(${(1 + 0.15 * p).toFixed(3)})`); });
    // data lane pulse on 'thin'
    const dp = Math.sin(Math.PI * S.seg(t, T.thin, T.thin + 0.8, S.ease.inOutSine)); [c.dlEl.top, c.dlEl.bot].forEach((e) => { if (e) e.setAttribute('stroke', dp > 0.05 ? K.c('fg-2') : K.c('grid')); });
    // thesis ring, cloud, leaders
    const ro = S.seg(t, T.bet + 0.6, T.bet + 1.0, S.ease.linear); c.ring.style.opacity = ro.toFixed(3); c.cg.style.opacity = ro.toFixed(3);
    c.dots.forEach((d, i) => { const [x, y, ph] = c.pts[i], b = 1 + 0.12 * Math.sin(1.4 * t + ph); d.setAttribute('cx', (x * b).toFixed(1)); d.setAttribute('cy', (y * b).toFixed(1)); });
    c.leads.forEach((l, i) => { l.style.opacity = S.seg(t, T.bet + 1.2 + 0.3 * i, T.bet + 1.6 + 0.3 * i, S.ease.linear).toFixed(3); });
    // race: lanes flash left to right (labels), then the map dims; caption and icons
    c.flashes.forEach((e, i) => { const a = T.race + 0.12 * i, f = Math.sin(Math.PI * S.seg(t, a, a + 0.3, S.ease.linear)); if (f > 0) { e.style.color = 'var(--fg)'; } });
    const dm = S.seg(t, T.race + 0.9, T.race + 1.4, S.ease.linear); c.dim.style.opacity = (0.6 * dm).toFixed(3);
    const ci = S.seg(t, T.race + 1.2, T.race + 1.6, S.ease.linear); c.rgp.style.opacity = ci.toFixed(3); fade(c.cap, t, T.race + 1.3);
    c.thread.setAttribute('transform', `scale(${(1 + 0.25 * S.seg(t, T.race + 1.4, T.race + 3.4, S.ease.inOutSine)).toFixed(3)} 1)`);
    c.blurT.setAttribute('stroke-width', (3 + 5 * S.seg(t, T.race + 1.4, T.race + 3.4, S.ease.inOutSine)).toFixed(2));
  },
});
</script></body></html>
