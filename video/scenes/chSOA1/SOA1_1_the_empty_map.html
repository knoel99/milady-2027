<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA1.1 The empty map</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA1.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="map.js"></script>
<script src="chSOA1_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* SOA1.1 The empty map (L1, NIGHT, CONTEXT). Chapter card; the three 02.4 cards as thumbnails; the shared map
   (map.js) draws on; lane 1 lit; pins E1906, E1963 (the 00.3 seafloor strip shrinks into it), E1968 with a schematic
   chance strip (params.chance_strip: Poisson flips whose rate rises left to right, fixed seed). */
Scene.define({
  duration: 21,
  register: 'night',
  cues: { hunt: 3.4, map: 7.0, record: 8.6, stripes: 12.4, chance: 14.6 },
  params: { chapter: { num: '02+', title: 'A century of dynamo hunting', level: 'L1', levelFrom: 'L1' }, cards_02_4: ['RIGA', 'KARLSRUHE', 'VKS'],
    seafloor: { window_Ma: [0, 5], normal_Ma: [] }, chance_strip: { seed: 1968, length_px: 520, rate_left: 0.15, rate_right: 1.0 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, ch = P.chapter;
    const title = (ctx.script.onscreen && ctx.script.onscreen.title) || ch.title;
    K.chapterCard(ctx, { num: ch.num, title, level: ch.level, levelFrom: ch.levelFrom, at: -0.3, out: 'hunt-0.4', railHold: 3 });
    K.badge(ctx, { kind: 'CONTEXT', at: 'hunt-0.15' });
    // thumbnails of the 02.4 cards
    const thumbs = P.cards_02_4.map((nm, i) => { const e = K.el('div', {}, st, nm); Object.assign(e.style, { position: 'absolute', left: (560 + i * 290) + 'px', top: '470px', width: '250px', height: '140px', boxSizing: 'border-box',
      border: '3px solid var(--fg-2)', borderRadius: '12px', background: 'var(--panel)', padding: '16px 18px', font: '700 36px "Inter Display"', color: 'var(--fg)', zIndex: 20 }); return e; });
    const map = SOA.map(ctx, { scene: 'SOA1.1', at: 'map-0.15', add: [{ id: 'E1906', cue: 'record' }, { id: 'E1963', cue: 'stripes+0.8' }, { id: 'E1968', cue: 'chance' }],
      lit: [['earth', 'record-0.15']] });
    // the seafloor strip (as in 00.3) shrinks into pin E1963
    const sv = K.svgLayer(ctx, 13), sg = K.s('g', {}, sv), [w0, w1] = P.seafloor.window_Ma;
    const Nm = P.seafloor.normal_Ma.map(([a, b]) => [Math.max(w0, a), Math.min(w1, b)]).filter(([a, b]) => b > a).sort((p, q) => p[0] - q[0]);
    const runs = []; let x = w0; for (const [a, b] of Nm) { if (a > x) runs.push([x, a, -1]); runs.push([a, b, 1]); x = b; } if (x < w1) runs.push([x, w1, -1]);
    const SX = 720, SW = 360, SY = 190, SH = 44, xs = (m) => SX + SW - SW * (m - w0) / (w1 - w0);
    runs.forEach(([a, b, s]) => K.s('rect', { x: xs(b), y: SY, width: Math.max(2, xs(a) - xs(b)), height: SH, fill: K.c(s > 0 ? 'b' : 'b-neg') }, sg));
    // the chance strip (schematic): Poisson process, rate rising left to right (seeded)
    const C = P.chance_strip, r = S.rng('chance' + C.seed), cx0 = 1000, cy = 300, flipsX = []; let pos = 0;
    while (pos < C.length_px) { const f = pos / C.length_px, rate = (C.rate_left + (C.rate_right - C.rate_left) * f) / 20; pos += -Math.log(Math.max(1e-9, r())) / rate; if (pos < C.length_px) flipsX.push(pos); }
    const cg = K.s('g', {}, sv); let prev = 0, sgn = 1; [...flipsX, C.length_px].forEach((fx) => { K.s('rect', { x: cx0 + prev, y: cy, width: Math.max(2, fx - prev), height: 18, fill: K.c(sgn > 0 ? 'b' : 'b-neg') }, cg); prev = fx; sgn = -sgn; });
    const ccp = K.s('rect', { x: cx0, y: cy - 4, width: 0, height: 26 }, K.s('clipPath', { id: 'chclip' }, K.s('defs', {}, sv))); cg.setAttribute('clip-path', 'url(#chclip)');
    const sen = (ctx.script.sentences || []).find((s) => s.cue === 'chance');
    const chEnd = sen ? sen.end : ctx.at('chance') + 3.5;
    const sch = K.chip(ctx, { text: 'SCHEMATIC', kind: 'schematic', x: cx0 + C.length_px + 16, y: cy - 12, at: 'chance+0.6', out: chEnd + 0.3 }); void sch;
    const E63 = map.pins.E1963;
    window.__EVENTS__ = [];
    ctx.s1 = { thumbs, sg, SX, SW, SY, SH, E63, cg, ccp, C, chEnd, T: { hunt: ctx.at('hunt-0.15'), map: ctx.at('map-0.15'), st: ctx.at('stripes-0.15'), ch: ctx.at('chance-0.15') } };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.s1, T = c.T;
    c.thumbs.forEach((e, i) => { const p = S.seg(t, T.hunt + 0.1 * i, T.hunt + 0.1 * i + 0.4, S.ease.outCubic), out = S.seg(t, T.map, T.map + 0.8, S.ease.inOutCubic);
      e.style.opacity = (p * (i === 2 ? 1 : 0.6) * (1 - out)).toFixed(3); e.style.transform = `translateX(${(260 * out).toFixed(1)}px)`; K.show(e, p > 0 && out < 1); });
    // seafloor strip: fades in on 'stripes', then shrinks into pin E1963 over 0.8 s
    const pi = S.seg(t, T.st, T.st + 0.3, S.ease.linear), sh = S.seg(t, T.st + 0.9, T.st + 1.7, S.ease.inOutCubic);
    const tx = c.E63.x, ty = c.E63.y, s = 1 - 0.97 * sh;
    c.sg.setAttribute('transform', `translate(${((c.SX + c.SW / 2) * (1 - sh) + tx * sh - (c.SX + c.SW / 2) * s).toFixed(1)} ${((c.SY + c.SH / 2) * (1 - sh) + ty * sh - (c.SY + c.SH / 2) * s).toFixed(1)}) scale(${s.toFixed(4)})`);
    c.sg.style.opacity = (pi * (1 - S.seg(t, T.st + 1.5, T.st + 1.7, S.ease.linear))).toFixed(3);
    // chance strip: draws on in 2 s, fades at the end of the sentence
    c.ccp.setAttribute('width', (c.C.length_px * S.seg(t, T.ch + 0.4, T.ch + 2.4, S.ease.linear)).toFixed(1));
    c.cg.style.opacity = (1 - S.seg(t, c.chEnd + 0.3, c.chEnd + 0.8, S.ease.linear)).toFixed(3);
  },
});
</script></body></html>
