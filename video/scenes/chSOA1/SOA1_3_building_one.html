<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA1.3 Building one</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA1.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="map.js"></script>
<script src="chSOA1_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* SOA1.3 Building one (L1, NIGHT, CONTEXT). The shared map; lane 3 lit; L1963 with a grey two-cylinder pictogram and
   the arrow from T1958; the RIGA / KARLSRUHE / VKS thumbnails of 02.4 shrink into their pins while the 1970s arrow
   stubs complete; the VKS flip glyph turns over at 'vks' + params.vks_flip_offset_s; DRESDYN lands as a dashed
   ring in the future stub with the chip 'planned'. No date or status for DRESDYN. */
Scene.define({
  duration: 20,
  register: 'night',
  cues: { build: 0.4, cylinders: 2.4, sodium: 6.4, vks: 11.4 },
  params: { present: ['E1906', 'E1963', 'E1968', 'T1919', 'T1933', 'T1958', 'T1966', 'T1972', 'T1973'],
    add: [{ id: 'L1963', cue: 'cylinders' }, { id: 'L1999R', cue: 'sodium' }, { id: 'L1999K', cue: 'sodium+1.4' }, { id: 'L2006', cue: 'vks' }, { id: 'LDRES', cue: 'vks+4.2' }],
    vks_flip_offset_s: 1.6, cards_from_02_4: { L1999R: 'RIGA', L1999K: 'KARLSRUHE', L2006: 'VKS' } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C2.labOf(ctx, s, s);
    const map = SOA.map(ctx, { scene: 'SOA1.3', present: P.present, add: P.add, lit: [['lab', 'build-0.15']],
      flips: { L2006: ['vks+' + P.vks_flip_offset_s] },
      arrows: [{ from: 'T1958', to: 'L1963', at: 'cylinders+0.3' }, { from: 'T1973', to: 'L1999R', at: -0.4, dur: 0.01, frac: 0.5, complete: 'sodium+0.4' }, { from: 'T1972', to: 'L1999K', at: -0.4, dur: 0.01, frac: 0.5, complete: 'sodium+1.8' }] });
    const svg = K.svgLayer(ctx, 14);
    // two spinning iron cylinders in a grey block (beside L1963 for 2.5 s)
    const cy = K.s('g', { transform: `translate(${map.pins.L1963.x - 120} 460)` }, svg);
    K.s('rect', { x: -70, y: -40, width: 140, height: 80, rx: 8, fill: K.c('matter-dark'), stroke: K.c('matter'), 'stroke-width': 2 }, cy);
    [-30, 30].forEach((x) => { K.s('ellipse', { cx: x, cy: 0, rx: 18, ry: 26, fill: K.c('matter'), stroke: K.c('fg-2'), 'stroke-width': 2 }, cy); K.s('path', { d: `M${x - 14},-32 A16,8 0 0 1 ${x + 14},-32`, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2.5 }, cy); });
    // thumbnails shrinking into their pins
    const th = Object.entries(P.cards_from_02_4).map(([id, nm]) => { const e = K.el('div', { 'data-qa': 'ignore' }, st, nm); /* QA: the thumbnail shrinks into its pin (transient small text) */ Object.assign(e.style, { position: 'absolute', left: '1560px', top: '600px', width: '250px', height: '140px', boxSizing: 'border-box', border: '3px solid var(--fg-2)', borderRadius: '12px', background: 'var(--panel)', padding: '16px 18px', font: '700 36px "Inter Display"', color: 'var(--fg)', zIndex: 34, transformOrigin: '0 0' });
      const ad = P.add.find((a) => a.id === id); return { e, q: map.pins[id], t: ctx.at(ad.cue) - 0.95 }; });
    const ld = map.pins.LDRES;
    K.chip(ctx, { text: lab('planned'), kind: 'schematic', x: ld.x, y: ld.y + 26, anchor: 'tl', at: 'vks+4.3' });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    ctx.s1 = { cy, th, tc: ctx.at('cylinders-0.15') };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.s1;
    c.cy.style.opacity = (S.seg(t, c.tc, c.tc + 0.3, S.ease.linear) * (1 - S.seg(t, c.tc + 2.5, c.tc + 2.9, S.ease.linear))).toFixed(3);
    c.th.forEach((x) => { const pin = S.seg(t, x.t, x.t + 0.3, S.ease.outCubic), sh = S.seg(t, x.t + 0.2, x.t + 1.0, S.ease.inOutCubic);
      const s = 1 - 0.95 * sh, X = 1560 + (x.q.x - 1560) * sh - 125 * s * sh, Y = 600 + (x.q.y - 600) * sh - 70 * s * sh;
      x.e.style.transform = `translate(${(X - 1560 + 200 * (1 - pin)).toFixed(1)}px, ${(Y - 600).toFixed(1)}px) scale(${s.toFixed(4)})`;
      x.e.style.opacity = (pin * (1 - S.seg(t, x.t + 0.8, x.t + 1.0, S.ease.linear))).toFixed(3); K.show(x.e, pin > 0 && t < x.t + 1.0); });
  },
});
</script></body></html>
