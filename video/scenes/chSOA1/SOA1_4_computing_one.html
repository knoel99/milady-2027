<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA1.4 Computing one</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA1.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="map.js"></script>
<script src="chSOA1_kit.js"></script>
<style>
  .s1-roster { position: absolute; left: 470px; top: 184px; max-width: 970px; box-sizing: border-box; padding: 6px 18px 8px; background: var(--panel); border: 2px solid var(--fg-2); border-radius: 10px; z-index: 34; }
  .s1-roster .tt { font: 500 28px "JetBrains Mono"; letter-spacing: .04em; color: var(--muted); white-space: nowrap; }
  .s1-roster .rw { font: 500 28px Inter; line-height: 1.2; color: var(--fg); white-space: nowrap; }
  .s1-roster .ch { display: inline-block; margin-top: 8px; padding: 2px 10px; border: 2px solid var(--muted); border-radius: 6px; font: 500 28px "JetBrains Mono"; color: var(--muted); white-space: nowrap; }
</style>
</head><body><div id="stage"></div>
<script>
/* SOA1.4 Computing one (L2, NIGHT, CONTEXT). Rail L1 -> L2; lane 4 lit, lanes 1-2 dimmed under the roster of papers
   co-signed by the supervisors (params.roster, text only, rows typed on their cues); pins of params.add; a
   Taylor-Green pictogram, a log Pm dial (params.pm_dial), the arrow from VKS (lab) to S2016, the 2026 flip paper
   with 'conducting surroundings' (chip IN THE RUNS EXPLORED), the Bousquet lower-third and the Re gauge
   (params.re_gauge: the reference run against VKS sodium). */
Scene.define({
  duration: 40,
  register: 'night',
  cues: { computers: 0.4, turbulent: 1.8, geodynamo: 5.0, rings: 8.4, swirl: 11.8, lowpm: 15.8, vkssim: 20.8, flipsim: 25.4, reference: 30.6 },
  params: { present: [], add: [] },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C2.labOf(ctx, s, s);
    if (P.rail) K.rail(ctx, { from: P.rail.from, to: P.rail.to, at: P.rail.at, hold: 3 });
    const map = SOA.map(ctx, { scene: 'SOA1.4', present: P.present, add: P.add, lit: [['sim', 'computers-0.15']], dim: [[['earth', 'theory'], 'computers-0.15', undefined, 0.35], [['reduced'], 'reference-0.15', undefined, 0.35]],
      flips: { S1995: ['geodynamo+1.2'], S2026B: ['flipsim+1.0'] }, activeFor: { S2016: 0.6 }, arrows: [{ from: 'L2006', to: 'S2016', at: 'vkssim' }] });
    // roster
    const R = P.roster || { title: '', rows: [] };
    const ro = K.el('div', { class: 's1-roster' }, st); K.el('div', { class: 'tt' }, ro, R.title);
    const rows = R.rows.map((r) => { const e = K.el('div', { class: 'rw', html: (r.glyph === 'ring' ? '○ ' : '◆ ') + K.esc(r.text).replace(/\bPm\b/, '<span class="k-param">Pm</span>') }, ro); return { e, t: ctx.at(r.cue) - 0.15 }; });
    const chips = P.chips || {};
    const chI = K.chip(ctx, { text: chips.independent || 'INDEPENDENT SUMMARY · NOT REVIEWED BY THE PEOPLE NAMED', kind: 'schematic', maxWidth: 580, x: 1200, y: 646, at: 'rings' });   // lane 5 is empty in this scene
    K.fit(ro, 970, 222, 28, ctx);
    // legend (right of the dimmed lanes)
    const lg1 = C2.label(st, lab(/^○/), 110, 790, ''), lg2 = C2.label(st, lab(/^◆/), 110, 834, '');
    // pictograms (lane 5, before the gauge): Taylor-Green eddies; log Pm dial
    const svg = K.svgLayer(ctx, 14);
    const tg = K.s('g', { transform: 'translate(600 684)' }, svg); K.s('rect', { x: -80, y: -40, width: 160, height: 80, rx: 8, fill: K.c('panel') }, tg);
    const eA = K.s('g', { transform: 'translate(-34 0)' }, tg), eB = K.s('g', { transform: 'translate(34 0)' }, tg);
    [eA, eB].forEach((e) => K.s('path', { d: 'M22,0 A22,22 0 1 1 0,-22 M0,-22 L-8,-30 M0,-22 L-8,-14', fill: 'none', stroke: K.c('u'), 'stroke-width': 3.5, 'stroke-linecap': 'round' }, e));
    const pd = P.pm_dial || { log10_from: 0, log10_to: -2, labels: ['Pm 1', 'Pm 0.01'] };
    const dg = K.s('g', { transform: 'translate(820 690)' }, svg); K.s('circle', { r: 34, fill: K.c('panel'), stroke: K.c('matter'), 'stroke-width': 3 }, dg);
    K.s('path', { d: 'M-34,0 A34,34 0 0 1 34,0', fill: 'none', stroke: K.c('param'), 'stroke-width': 4 }, dg);
    const dn = K.s('line', { x1: 0, y1: 0, x2: 0, y2: -28, stroke: K.c('param'), 'stroke-width': 5, 'stroke-linecap': 'round' }, dg);
    const dl1 = K.s('text', { x: 42, y: -8, class: 'kt-tick' }, dg, pd.labels[0]), dl2 = K.s('text', { x: -42, y: -8, 'text-anchor': 'end', class: 'kt-tick' }, dg, pd.labels[1]);
    [dl1, dl2].forEach((e) => { e.style.fill = K.c('param'); });
    // conducting surroundings (lane 1-2 right side, empty)
    const cs = K.s('g', { transform: 'translate(1495 236)' }, svg); K.s('rect', { x: -78, y: -36, width: 156, height: 72, rx: 20, fill: 'none', stroke: K.c('matter'), 'stroke-width': 8 }, cs);
    K.s('rect', { x: -62, y: -22, width: 124, height: 44, rx: 10, fill: K.c('matter-dark'), stroke: K.c('fg-2'), 'stroke-width': 2 }, cs);
    const lCs = C2.label(st, lab('conducting surroundings'), 1495, 282, 'center');
    const chE = K.chip(ctx, { text: chips.explored || 'IN THE RUNS EXPLORED', kind: 'schematic', maxWidth: 300, x: 1495, y: 372, anchor: 'c', at: 'flipsim+0.6' }); void chE;
    // Re gauge (log) under lane 4
    const rg = P.re_gauge || { log10_min: 3, log10_max: 7, sim: { value: 1594, label: '' }, vks: { from: 1e6, to: 5e6, label: '' } };
    const GX0 = 520, GX1 = 960, GY = 676, gx = (v) => GX0 + (GX1 - GX0) * (Math.log10(v) - rg.log10_min) / (rg.log10_max - rg.log10_min);
    const gg = K.s('g', {}, svg); K.s('rect', { x: GX0 - 20, y: GY - 58, width: GX1 - GX0 + 40, height: 146, rx: 8, fill: K.c('panel') }, gg);
    K.s('rect', { x: gx(rg.sim.value), y: GY - 8, width: gx(rg.vks.from) - gx(rg.sim.value), height: 16, fill: K.rgba(K.c('param'), 0.12) }, gg);
    K.s('line', { x1: GX0, x2: GX1, y1: GY, y2: GY, stroke: K.c('param'), 'stroke-width': 2 }, gg);
    for (let e = rg.log10_min; e <= rg.log10_max; e += 2) { K.s('line', { x1: gx(10 ** e), x2: gx(10 ** e), y1: GY, y2: GY + 10, stroke: K.c('muted'), 'stroke-width': 2 }, gg); K.s('text', { x: gx(10 ** e), y: GY + 40, 'text-anchor': 'middle', class: 'kt-tick' }, gg, K.pow10(10 ** e)); }
    K.s('rect', { x: gx(rg.vks.from), y: GY - 12, width: gx(rg.vks.to) - gx(rg.vks.from), height: 24, fill: K.c('param') }, gg);
    K.s('line', { x1: gx(rg.sim.value), x2: gx(rg.sim.value), y1: GY - 16, y2: GY + 16, stroke: K.c('param'), 'stroke-width': 5 }, gg);
    const gl1 = K.s('text', { x: gx(rg.sim.value), y: GY - 24, 'text-anchor': 'middle', class: 'kt-tick' }, gg, rg.sim.label), gl2 = K.s('text', { x: gx(rg.vks.to), y: GY + 74, 'text-anchor': 'end', class: 'kt-tick' }, gg, rg.vks.label);   // under the band (the run's label is above)
    [gl1, gl2].forEach((e) => { e.style.fill = K.c('param'); });
    (P.lower_thirds || []).forEach((L) => K.lowerThird(ctx, { kind: L.kind, l1: L.l1, l2: L.l2, at: L.at, hold: L.hold }));
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    K.formulaLayer(ctx);
    const T = {}; ['computers', 'rings', 'swirl', 'lowpm', 'flipsim', 'reference'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    const L0 = (P.lower_thirds || [])[0]; const ltIn = L0 ? ctx.at(L0.at) : 1e9, ltOut = L0 ? ltIn + (L0.hold || 5) + 0.6 : 1e9;
    const rb = K.box(ro, ctx), hitR = (b) => b && b.x < rb.x + rb.w && rb.x < b.x + b.w && b.y < rb.y + rb.h && rb.y < b.y + b.h;
    const under = Object.values(map.pins).filter((q) => ((q.p.lane === 'earth' || q.p.lane === 'theory') && q.x > 440 && q.x < 1460) || hitR(q.nbox));
    ctx.s1 = { chI, under, ltIn, ltOut, T, ro, rows, lg1, lg2, tg, eA, eB, dg, dn, pd, cs, lCs, gg };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.s1, T = c.T, fade = C2.fadeEl;
    fade(c.ro, t, T.rings); c.rows.forEach((r) => { const p = S.seg(t, r.t, r.t + 0.5, S.ease.linear); r.e.style.clipPath = `inset(0 ${(100 - 100 * p).toFixed(1)}% 0 0)`; r.e.style.opacity = p > 0 ? 1 : 0; });
    fade(c.lg1, t, T.rings + 0.3, c.ltIn - 0.3); fade(c.lg2, t, c.ltOut + 0.4); if (t >= c.ltOut + 0.4) fade(c.lg1, t, c.ltOut + 0.4);
    const to = S.seg(t, T.swirl + 0.2, T.swirl + 0.5, S.ease.linear) * (1 - S.seg(t, T.swirl + 2.7, T.swirl + 3.0, S.ease.linear)); c.tg.style.opacity = to.toFixed(3);
    c.eA.setAttribute('transform', `translate(-34 0) rotate(${(120 * t).toFixed(1)})`); c.eB.setAttribute('transform', `translate(34 0) rotate(${(-120 * t).toFixed(1)})`);
    const dO = S.seg(t, T.lowpm + 0.2, T.lowpm + 0.5, S.ease.linear) * (1 - S.seg(t, T.lowpm + 3.2, T.lowpm + 3.5, S.ease.linear)); c.dg.style.opacity = dO.toFixed(3);
    const dp = S.seg(t, T.lowpm + 0.6, T.lowpm + 2.0, S.ease.inOutCubic); c.dn.setAttribute('transform', `rotate(${(90 - 180 * dp).toFixed(1)})`);
    const co = S.seg(t, T.flipsim + 0.4, T.flipsim + 0.8, S.ease.linear); c.cs.style.opacity = co.toFixed(3); fade(c.lCs, t, T.flipsim + 0.5);
    // the roster box covers the dimmed lanes 1-2: their pins under it go (the box is opaque)
    if (t >= T.rings) c.under.forEach((q) => { const k = S.seg(t, T.rings, T.rings + 0.3, S.ease.linear); q.yl.style.opacity = (+q.yl.style.opacity * (1 - k)).toFixed(3); q.pg.style.opacity = (+q.pg.style.opacity * (1 - k)).toFixed(3); if (q.nbox) q.nbox.el.style.opacity = (1 - k).toFixed(3); });
    
    c.gg.style.opacity = S.seg(t, T.reference, T.reference + 0.4, S.ease.linear).toFixed(3);
  },
});
</script></body></html>
