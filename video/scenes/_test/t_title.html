<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Test: title card</title>
<link rel="stylesheet" href="/runtime/theme.css">
<script src="/runtime/scene.js"></script>
<style>
  #kick { position: absolute; left: 160px; top: 300px; color: var(--muted); }
  #head { position: absolute; left: 152px; top: 340px; width: 1500px; }
  #needle { position: absolute; left: 1380px; top: 560px; width: 260px; height: 260px; }
  #dbg { position: absolute; left: 48px; bottom: 200px; color: var(--muted); font-size: 18px; }
</style></head>
<body><div id="stage">
  <div id="kick" class="mono"></div>
  <div id="head" class="title-xl"></div>
  <svg id="needle" viewBox="-130 -130 260 260">
    <circle r="118" fill="none" stroke="#2A3441" stroke-width="4"/>
    <g id="arm"><path d="M0,-100 L14,0 L-14,0 Z" fill="var(--b)"/><path d="M0,100 L14,0 L-14,0 Z" fill="#C7D0DA"/></g>
    <circle r="9" fill="#F2F4F7"/>
  </svg>
  <div id="dbg" class="mono" data-qa="ignore"></div>
</div>
<script>
/* Pipeline test scene (not part of the film): title words on cue 'title', needle flip on cue 'flip'. */
Scene.define({
  duration: 8,
  cues: { title: 0.5 },
  setup(ctx) {
    const E = window.__ENTRY__ || {};
    document.getElementById('kick').textContent = ctx.params.kicker || 'TEST';
    document.getElementById('head').textContent = ctx.params.heading || 'Test';
    if (E.register === 'PAPER') document.getElementById('stage').dataset.register = 'paper';
    document.getElementById('dbg').textContent = [E.status, E.variant, E.level, E.badge && E.badge.kind].filter(Boolean).join(' · ');
    ctx.flip = ctx.cue('flip', null);
  },
  render(t, ctx) {
    const p = Scene.seg(t, ctx.cue('title', 0.5) - 0.3, ctx.cue('title', 0.5) + 0.5);
    for (const id of ['kick', 'head']) { const el = document.getElementById(id); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 24}px)`; }
    const n = document.getElementById('needle');
    n.style.opacity = ctx.flip == null ? 0 : Scene.seg(t, 0.2, 0.8);
    const a = ctx.flip == null ? 0 : 180 * Scene.seg(t, ctx.flip, ctx.flip + 0.9, Scene.ease.inOutCubic) + 8 * Math.sin(6 * t) * Math.exp(-Math.max(0, t - ctx.flip - 0.9));
    document.getElementById('arm').setAttribute('transform', `rotate(${a})`);
  },
});
</script></body></html>
