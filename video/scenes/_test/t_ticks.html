<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Test: crossing ticks</title>
<link rel="stylesheet" href="/runtime/theme.css">
<script src="/runtime/scene.js"></script>
</head>
<body><div id="stage"><canvas id="c"></canvas></div>
<script>
/* Pipeline test scene: a dipole signal D(t) drawn left to right; every zero crossing is exported as a
   sound event (window.__EVENTS__, scene time) and flashed on screen. */
const D = (x) => Math.sin(1.7 * x) + 0.6 * Math.sin(3.1 * x + 1) + 0.25 * Math.sin(7.3 * x);
Scene.define({
  duration: 8,
  cues: { signal: 0.5, count: 4 },
  setup(ctx) {
    ctx.g = Scene.hidpi(document.getElementById('c'));
    ctx.t0 = ctx.cue('signal', 0.5); ctx.speed = 1.2;          // signal time per second of film
    ctx.cross = [];
    let prev = D(0);
    for (let x = 0.002; x < (ctx.duration - ctx.t0) * ctx.speed; x += 0.002) { const v = D(x); if ((v > 0) !== (prev > 0)) ctx.cross.push(x); prev = v; }
    window.__EVENTS__ = ctx.cross.map((x) => ({ t: +(ctx.t0 + x / ctx.speed).toFixed(3), id: 'tick', pan: -0.4 + 0.8 * x / 10 }));
  },
  render(t, ctx) {
    const g = ctx.g, C = Scene.C, X0 = 160, X1 = 1760, Y = 520, A = 200;
    const reg = (window.__ENTRY__ || {}).register === 'PAPER';
    g.fillStyle = reg ? '#F4F1EA' : C.bg; g.fillRect(0, 0, 1920, 1080);
    g.strokeStyle = reg ? '#9AA6B2' : '#2A3441'; g.lineWidth = 2; g.beginPath(); g.moveTo(X0, Y); g.lineTo(X1, Y); g.stroke();
    const xmax = Math.max(0, (t - ctx.t0) * ctx.speed), span = (ctx.duration - ctx.t0) * ctx.speed;
    g.strokeStyle = C.b; g.lineWidth = 4; g.beginPath();
    for (let x = 0; x <= xmax; x += 0.01) { const px = X0 + (X1 - X0) * x / span, py = Y - A * D(x) / 1.8; x ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.stroke();
    for (const x of ctx.cross) if (x <= xmax) { const px = X0 + (X1 - X0) * x / span, age = (xmax - x) / ctx.speed;
      g.fillStyle = C.metric; g.globalAlpha = Math.max(0.35, 1 - age); g.beginPath(); g.arc(px, Y, 12, 0, 2 * Math.PI); g.fill(); g.globalAlpha = 1; }
    g.fillStyle = C.metric; g.font = '600 44px Inter';
    g.fillText(`crossings: ${ctx.cross.filter((x) => x <= xmax).length}`, X0, 220);
  },
});
</script></body></html>
