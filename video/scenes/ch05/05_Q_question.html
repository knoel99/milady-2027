<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ch05.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch05.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch05_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* ch05.Q Question for the supervisors (framing). The card fills the frame; behind it, faint, the schematic D(t)
   trace of 05.4 with its two far levels ±a and a chalk question mark on the upper level. */
Scene.define({
  duration: 9.2,
  register: 'night',
  cues: { q: 0.5 },
  params: { backdrop: { opacity: 0.1, level_a: 0.6 },
    trace: { box: { x0: 200, x1: 1640, y0: 240, y1: 640 }, zero_y: 440, amp_px: 170, seed: 'ch05-trace',
      knots: [[0.0, 0.85], [0.22, 0.8], [0.3, 0.55], [0.345, -0.32], [0.39, 0.5], [0.5, 0.86], [0.64, 0.8], [0.72, -0.1], [0.78, -0.82], [1.0, -0.86]], wiggle: 0.04 } },
  setup(ctx) {
    const K = Kit, P = ctx.params, TR = P.trace, B = TR.box;
    const svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: P.backdrop.opacity }, svg); svg.setAttribute('data-qa', 'ignore');   // a 10 % backdrop under the card
    const tr = C5.trace(TR), X = (f) => B.x0 + f * (B.x1 - B.x0), Y = (d) => TR.zero_y - d * TR.amp_px;
    K.s('polyline', { points: tr.map((p) => `${X(p.f).toFixed(1)},${Y(p.D).toFixed(1)}`).join(' '), fill: 'none', stroke: K.c('b'), 'stroke-width': 6 }, bg);
    [P.backdrop.level_a, -P.backdrop.level_a].forEach((v) => K.s('line', { x1: B.x0, x2: B.x1, y1: Y(v), y2: Y(v), stroke: K.c('chalk'), 'stroke-width': 4, 'stroke-dasharray': '14 10' }, bg));
    K.s('text', { x: B.x1 + 40, y: Y(P.backdrop.level_a) + 22, 'font-family': 'Inter Display', 'font-weight': 700, 'font-size': 80, fill: K.c('chalk') }, bg, '?');
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'ch05', category: 'framing', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-6 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
