<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>05.4 Crossings are not reversals</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch05.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch05_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 05.4 Crossings are not reversals (L3, NIGHT, PROVED: what Proposition 8 counts). A drawn D(t) trace (schematic,
   no data): an excursion across zero and back adds two crossings and no reversal; a reversal adds one; the PhD plan
   isolates reversals by counting crossings of a far level −a on the other side. */
Scene.define({
  duration: 16,
  register: 'night',
  cues: { caution: 0.5, excursion: 3.6, level: 8.0 },
  params: { trace: { box: { x0: 200, x1: 1640, y0: 180, y1: 580 }, zero_y: 380, amp_px: 170, seed: 'ch05-trace',
    knots: [[0.0, 0.85], [0.22, 0.8], [0.3, 0.55], [0.345, -0.32], [0.39, 0.5], [0.5, 0.86], [0.64, 0.8], [0.72, -0.1], [0.78, -0.82], [1.0, -0.86]], wiggle: 0.04 }, level_a: 0.6 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, TR = P.trace, B = TR.box;
    const T = { cau: ctx.at('caution-0.15'), exc: ctx.at('excursion-0.15'), lev: ctx.at('level-0.15') };
    const tr = C5.trace(TR), X = (f) => B.x0 + f * (B.x1 - B.x0), Y = (d) => TR.zero_y - d * TR.amp_px;
    // progress of the pen along the trace (piecewise linear, so a crossing's time is exact)
    const keys = [[T.cau, 0], [T.cau + 1.2, 0.28], [T.exc, 0.28], [T.exc + 1.6, 0.45], [T.exc + 3.4, 1.0]];
    const prog = (t) => { if (t <= keys[0][0]) return 0; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) return keys[i - 1][1] + (keys[i][1] - keys[i - 1][1]) * (t - keys[i - 1][0]) / Math.max(1e-6, keys[i][0] - keys[i - 1][0]); return 1; };
    const tOf = (f) => { for (let i = 1; i < keys.length; i++) if (f <= keys[i][1] && keys[i][1] > keys[i - 1][1]) return keys[i - 1][0] + (f - keys[i - 1][1]) / (keys[i][1] - keys[i - 1][1]) * (keys[i][0] - keys[i - 1][0]); return keys[keys.length - 1][0]; };
    const svg = K.svgLayer(ctx, 12);
    K.s('line', { x1: B.x0, x2: B.x1, y1: TR.zero_y, y2: TR.zero_y, stroke: K.c('fg-2'), 'stroke-width': 2.5, 'stroke-dasharray': '10 9' }, svg);
    const lZero = C5.lab(ctx, 'D = 0', B.x0 - 16, TR.zero_y - 20, 'right'); lZero.innerHTML = '<span class="k-b">D</span> = 0';
    // the trace in two shades by sign, revealed by a clip
    const defs = K.s('defs', {}, svg), clip = K.s('rect', { x: B.x0 - 10, y: B.y0 - 40, height: B.y1 - B.y0 + 80, width: 0 }, K.s('clipPath', { id: 'c54' }, defs));
    const tg = K.s('g', { 'clip-path': 'url(#c54)' }, svg);
    let run = [], sgn = tr[0].D >= 0;
    const flush = () => { if (run.length > 1) K.s('polyline', { points: run.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' '), fill: 'none', stroke: K.c(sgn ? 'b' : 'b-neg'), 'stroke-width': 5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, tg); };
    for (let j = 0; j < tr.length; j++) {
      const s = tr[j].D >= 0, p = [X(tr[j].f), Y(tr[j].D)];
      if (s !== sgn) { const a = tr[j - 1], f0 = a.f + (tr[j].f - a.f) * a.D / (a.D - tr[j].D), pz = [X(f0), TR.zero_y]; run.push(pz); flush(); run = [pz]; sgn = s; }
      run.push(p);
    }
    flush();
    const cr = C5.crossings(tr);
    if (cr.length !== 3) S.warn(`05.4: the drawn trace has ${cr.length} zero crossings (expected 3: two at the excursion, one at the reversal)`);
    const ticks = cr.map((c) => ({ f: c.f, t: tOf(c.f), e: K.s('line', { x1: X(c.f), x2: X(c.f), y1: TR.zero_y - 20, y2: TR.zero_y + 20, stroke: K.c('chalk'), 'stroke-width': 5, 'stroke-linecap': 'round' }, svg) }));
    window.__EVENTS__ = ticks.map((k) => ({ t: +k.t.toFixed(3), id: 'tick', gain_db: -20 }));
    K.needle(ctx, { corner: true, flips: ticks.map((k) => k.t), at: -0.3 });
    // labels
    const exc = tr.filter((p) => p.f > 0.3 && p.f < 0.4).reduce((a, b) => (b.D < a.D ? b : a));
    const lExc = C5.lab(ctx, 'excursion · 2 crossings · no reversal', X(exc.f), Y(-P.level_a) + 18, 'big center halo');
    const lRev = C5.lab(ctx, 'reversal · 1 crossing', 760, Y(-P.level_a) + 76, 'big center halo');
    // far levels ±a
    const a = P.level_a, lev = [a, -a].map((v) => K.s('line', { x1: B.x0, x2: B.x1, y1: Y(v), y2: Y(v), stroke: K.c('chalk'), 'stroke-width': 3, 'stroke-dasharray': '14 10' }, svg));
    const lA = [C5.lab(ctx, '+a', B.x0 - 16, Y(a) - 22, 'big right'), C5.lab(ctx, '−a', B.x0 - 16, Y(-a) - 22, 'big right')];
    const ca = C5.crossings(tr, -a).find((c) => c.f > 0.6);
    const dot = K.s('circle', { cx: ca ? X(ca.f) : 0, cy: Y(-a), r: 11, fill: K.c('chalk') }, svg);
    const lFar = C5.lab(ctx, 'a reversal crosses the far level', 760, Y(-P.level_a) + 76, 'big center halo');
    C5.lab(ctx, 'crossings, not reversals', 120, 96, 'head');
    K.chip(ctx, { text: 'SCHEMATIC · drawn trace, no data', kind: 'schematic', x: B.x0, y: B.y1 + 50, anchor: 'tl', at: -0.3 });
    K.badge(ctx, { kind: 'PROVED', note: 'Proposition 8 · what it counts', at: -0.3 });
    // WORKAROUND (script formula too long for one item of the layer even at 28 px): the same tex split at its second
    // \qquad into two items shown together (stack)
    const f0 = ((ctx.script.onscreen && ctx.script.onscreen.formulas) || [])[0];
    if (f0) { const parts = f0.tex.split('\\qquad'), cut = parts.length > 2 ? 2 : 1;
      K.formulaLayer(ctx, { label: 'Formula · R:528 · T, Prop. 2.30', stack: true, items: [parts.slice(0, cut).join('\\qquad')].concat(parts.slice(cut).join('\\qquad').split(';\\ r_a:').map((x, i) => (i ? 'r_a:' + x : x + ';'))).flatMap((x) => { const k = x.indexOf(',\\ \\text{equal'); return k < 0 ? [x] : [x.slice(0, k) + ',', x.slice(k + 3)]; }).map((tex, i) => ({ tex, at: f0.cue + (i ? '+' + (0.1 * i).toFixed(1) : '-0.15') })) }); }
    else K.formulaLayer(ctx, { label: 'Formula · R:528 · T, Prop. 2.30' });
    ctx.c = { T, prog, clip, B, ticks, lExc, lRev, lev, lA, dot, lFar, ca, tOf };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.c, T = c.T, B = c.B;
    c.clip.setAttribute('width', ((B.x1 - B.x0 + 20) * c.prog(t) + 10).toFixed(1));
    const grey = S.seg(t, T.lev + 0.3, T.lev + 0.8, S.ease.linear);
    c.ticks.forEach((k, i) => { const on = S.seg(t, k.t, k.t + 0.15, S.ease.linear); k.e.setAttribute('opacity', (on * (i < 2 ? 1 - 0.6 * grey : 1)).toFixed(3)); });
    C5.fade(c.lExc, t, c.ticks[1] ? c.ticks[1].t + 0.1 : T.exc + 1.6);
    if (t > T.lev) c.lExc.style.opacity = (1 - 0.6 * grey).toFixed(3);
    C5.fade(c.lRev, t, c.ticks[2] ? c.ticks[2].t + 0.1 : T.exc + 3.2, T.lev);
    c.lev.forEach((e) => { e.setAttribute('opacity', S.seg(t, T.lev, T.lev + 0.4, S.ease.linear).toFixed(3)); e.setAttribute('stroke-dashoffset', (-(t * 8) % 24).toFixed(1)); });
    c.lA.forEach((e) => C5.fade(e, t, T.lev + 0.2));
    c.dot.setAttribute('opacity', S.seg(t, T.lev + 0.8, T.lev + 1.0, S.ease.linear).toFixed(3));
    C5.fade(c.lFar, t, T.lev + 1.0);
  },
});
</script></body></html>
