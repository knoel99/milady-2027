<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>05.5 Photographs on demand</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch05.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch05_kit.js"></script>
<style>
  .eqc { position: absolute; z-index: 30; box-sizing: border-box; padding: 10px 18px; background: var(--panel); border: 2px solid var(--matter); border-radius: 10px; }
  .eqc .katex { font-size: 36px; }
  .qm { position: absolute; z-index: 30; font-family: "Inter Display"; font-weight: 700; font-size: 48px; color: var(--chalk); transform: translate(-50%, -50%); }
</style>
</head><body><div id="stage"></div>
<script>
/* 05.5 Photographs on demand (L3, NIGHT, bridge and checkpoint, no badge). Recap with motifs: the Rice strip shrinks
   into a shoebox beside the equations; the green knob axis of 03.6 with its few simulated settings; between the dots
   no shoebox; ends on the open question (the answer is ch06). Schematic: no number on screen. */
Scene.define({
  duration: 20,
  register: 'night',
  cues: { need: 0.6, dots: 6.0, gaps: 9.0, how: 11.3 },
  params: { axis: { x0: 200, x1: 1700, y: 640, label: 'knob settings' }, dots: [0.12, 0.34, 0.41, 0.83], box_w: 120, box_h: 70, rail: { from: 'L2', to: 'L3', hold: 3 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, A = P.axis;
    const T = { need: ctx.at('need-0.15'), dots: ctx.at('dots-0.15'), gaps: ctx.at('gaps-0.15'), how: ctx.at('how-0.15') };
    K.rail(ctx, { from: P.rail.from, to: P.rail.to, at: 'need-0.3', hold: P.rail.hold });
    C5.lab(ctx, 'Level 2 → Level 3', 120, 72, 'mono');
    const svg = K.svgLayer(ctx, 12);
    // the Rice strip of 05.2 (recap glyph: chalk strip, sparse vermillion points, the short amber bar)
    const stripG = K.s('g', {}, svg), rng = S.rng('ch05-recap');
    K.s('rect', { x: 820, y: 150, width: 280, height: 300, fill: K.c('fg'), opacity: 0.08 }, stripG);
    [820, 1100].forEach((x) => K.s('line', { x1: x, x2: x, y1: 150, y2: 450, stroke: K.c('chalk'), 'stroke-width': 3, 'stroke-dasharray': '10 9' }, stripG));
    K.s('line', { x1: 700, x2: 1220, y1: 450, y2: 450, stroke: K.c('b'), 'stroke-width': 3 }, stripG);
    for (let i = 0; i < 26; i++) { const x = 830 + rng() * 260, y = 445 - Math.pow(rng(), 1.6) * 200; K.s('rect', { x: x - 3, y: y - 3, width: 6, height: 6, fill: K.c(x < 960 ? 'b-neg' : 'b') }, stripG); }
    K.s('rect', { x: 860, y: 120, width: 200, height: 14, fill: K.c('metric') }, stripG);
    // the shoebox + equation card it shrinks into
    const bx = 860, by = 330;
    const boxG = K.s('g', {}, svg); C5.closedBox(boxG, 0, 0, P.box_w, P.box_h);   // (the first dot is far from the others: full size)
    const eq = K.el('div', { class: 'eqc', html: K.tex('\\dot{\\cq{Q}},\\ \\dot{\\cb{D}},\\ \\dot{\\cu{V}} = F(\\cq{Q}, \\cb{D}, \\cu{V})', false) }, st);
    eq.style.left = '1000px'; eq.style.top = '296px';
    const lRice = C5.lab(ctx, 'Rice: snapshots + equations', 960, 410, 'big center');
    // the green knob axis with its uneven dots, closed boxes above them
    const xs = P.dots.map((f) => A.x0 + f * (A.x1 - A.x0));
    const axG = K.s('g', {}, svg);
    K.s('line', { x1: A.x0, x2: A.x1, y1: A.y, y2: A.y, stroke: K.c('param'), 'stroke-width': 4 }, axG);
    xs.forEach((x) => K.s('circle', { cx: x, cy: A.y, r: 12, fill: K.c('param') }, axG));
    const lAxis = C5.lab(ctx, A.label, (A.x0 + A.x1) / 2, A.y + 28, 'big center'); lAxis.style.color = K.c('param');
    const bw = (i) => Math.min(P.box_w, ...[xs[i] - (xs[i - 1] ?? -1e9), (xs[i + 1] ?? 1e9) - xs[i]].map((d) => d - 34));   // neighbours close together get narrower boxes
    const boxes = xs.slice(1).map((x, k) => { const g = K.s('g', {}, svg), w = bw(k + 1), h = P.box_h * w / P.box_w; C5.closedBox(g, x, A.y - 18 - h / 2, w, h); return g; });
    // gaps wide enough for an empty outline
    const gaps = [];
    for (let i = 0; i + 1 < xs.length; i++) if (xs[i + 1] - xs[i] > P.box_w + 60) gaps.push({ x: (xs[i] + xs[i + 1]) / 2, w: xs[i + 1] - xs[i] });
    const widest = gaps.reduce((a, b) => (b.w > a.w ? b : a), gaps[0]);
    const empties = gaps.map((g) => { const e = K.s('g', {}, svg); C5.closedBox(e, 0, 0, P.box_w, P.box_h, { dashed: true, stroke: 'fg-2' }); const q = K.el('div', { class: 'qm' }, st, '?'); q.style.left = g.x + 'px'; q.style.top = (A.y - 22 - P.box_h / 2) + 'px'; return { e, q, g }; });
    const lGaps = C5.lab(ctx, 'between the dots: no snapshots', 960, 748, 'big center');
    K.pen(ctx, { kind: 'circle', box: { x: widest.x - P.box_w / 2 - 20, y: A.y - 22 - P.box_h - 40, w: P.box_w + 60, h: P.box_h + 70 }, pad: 12, at: 'how+0.2', dur: 0.6, seed: 'how55' });
    const lHow = C5.lab(ctx, 'snapshots at a setting nobody simulated?', Math.min(widest.x, 1824 - 460), A.y - 230, 'lead center');
    ctx.c = { T, stripG, boxG, bx, by, eq, lRice, axG, lAxis, boxes, xs, empties, lGaps, lHow, widest, A };
  },
  render(t, ctx) {
    const S = Scene, P = ctx.params, c = ctx.c, T = c.T, A = c.A, ease = S.ease.inOutCubic;
    const sh = S.seg(t, T.need, T.need + 1.2, ease);
    c.stripG.setAttribute('transform', `translate(${((c.bx - 960) * sh).toFixed(1)} ${((c.by - 300) * sh).toFixed(1)}) translate(960 300) scale(${(1 - 0.88 * sh).toFixed(3)}) translate(-960 -300)`);
    c.stripG.setAttribute('opacity', (1 - S.seg(t, T.need + 0.8, T.need + 1.2, S.ease.linear)).toFixed(3));
    // box: appears where the strip vanished, then drops onto the first dot
    const drop = S.seg(t, T.dots + 0.2, T.dots + 0.9, ease);
    const x = c.bx + (c.xs[0] - c.bx) * drop, y = c.by + (A.y - 22 - P.box_h / 2 - c.by) * drop;
    c.boxG.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    C5.fadeS(c.boxG, t, T.need + 0.9);
    C5.fade(c.eq, t, T.need + 1.0); C5.fade(c.lRice, t, T.need + 1.2, T.gaps);
    C5.fadeS(c.axG, t, T.dots, Infinity, 0.3); C5.fade(c.lAxis, t, T.dots + 0.2);
    const dim = 1 - 0.4 * S.seg(t, T.gaps, T.gaps + 0.4, S.ease.linear);
    c.boxes.forEach((b, i) => C5.fadeS(b, t, T.dots + 0.5 + 0.25 * i, Infinity, 0.2, dim));
    c.empties.forEach((e, i) => {
      const a = T.gaps + 0.2 + 0.3 * i, br = e.g === c.widest ? 1 + 0.01 * (1 - Math.cos(2 * Math.PI * Math.max(0, t - T.how) / 2.4)) : 1;
      e.e.setAttribute('transform', `translate(${e.g.x} ${A.y - 22 - P.box_h / 2}) scale(${br.toFixed(4)})`);
      C5.fadeS(e.e, t, a); C5.fade(e.q, t, a + 0.2);
    });
    C5.fade(c.lGaps, t, T.gaps + 0.5);
    C5.fade(c.lHow, t, T.how + 0.4);
  },
});
</script></body></html>
