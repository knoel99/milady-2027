<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>05.3 Check against the truth</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch05.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch05_kit.js"></script>
<style>
  .promise { position: absolute; z-index: 30; box-sizing: border-box; border: 2px solid var(--fg-2); border-radius: 14px; background: var(--panel); padding: 16px 20px; font-size: 32px; line-height: 1.2; color: var(--fg); }
  .defl { position: absolute; z-index: 30; left: 240px; top: 96px; font-size: 32px; color: var(--fg-2); white-space: nowrap; display: flex; align-items: center; gap: 12px; }
  .sw { display: inline-block; width: 34px; height: 22px; border-radius: 3px; }
</style>
</head><body><div id="stage"></div>
<script>
/* 05.3 Check against the truth (L3, NIGHT, MEASURED: E1 fine grid, 41 Γ). Counted crossings (long simulations) and
   Rice on the true snapshots, shuffled, plus the equations; the gap shaded and divided by the area under the counted
   curve = the cumulative error, 4 % near the threshold and 6 % above (data/ch05_rice.json check, R:883). */
Scene.define({
  duration: 35,
  register: 'night',
  cues: { truth: 0.5, count: 2.2, rice: 6.5, overlap: 10.4, shade: 12.2, numbers: 17.2, honest: 20.0 },
  data: { e1: 'data/e1_finegrid.json', rice: 'data/ch05_rice.json' },
  params: { plot: { box: { x0: 240, x1: 1440, y0: 200, y1: 620 }, x: { label: 'Γ, control parameter', min: 0.8, max: 1.0, ticks: [0.8, 0.85, 0.9, 0.95, 1.0], param: true },
    y: { label: 'crossings per 1,000 time units', min: 0, max: 13, ticks: [0, 4, 8, 12], scale: 1000 } },
    series: { count: 'simulation (counted crossings)', rice: 'Rice, reference snapshots' },
    promise_card: { x0: 1530, x1: 1810, y0: 230, y1: 430, text: 'say {metric}how often{/} the field flips' }, shade_alpha: { between: 0.35, under: 0.1 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, E1 = ctx.data.e1, CK = ctx.data.rice.check, PP = P.plot;
    const T = {}; for (const k of ['truth', 'count', 'rice', 'overlap', 'shade', 'numbers', 'honest']) T[k] = ctx.at(k + '-0.15');
    const ser = (n) => { const s = E1.series.find((q) => q.name === n); if (!s) throw new Error('05.3: series missing: ' + n); return s; };
    const xs = E1.x.values, yc = ser(P.series.count).y.map((v) => v * PP.y.scale), yr = ser(P.series.rice).y.map((v) => v * PP.y.scale);
    const Pl = K.plot(ctx, { box: PP.box, x: PP.x, y: { label: PP.y.label, min: PP.y.min, max: PP.y.max, ticks: PP.y.ticks }, at: 'truth-0.15' });
    const cC = Pl.curve({ x: xs, y: yc, field: 'b', width: 5, at: 'count-0.15', dur: 2.5 });
    const cR = Pl.curve({ x: xs, y: yr, field: 'metric', width: 3, at: 'rice-0.15', dur: 2.5 });
    const svg = K.svgLayer(ctx, 11), b = PP.box;
    // shading: between the curves (amber) and under the counted curve (vermillion, hatched); revealed left → right
    const pts = (ys) => xs.map((x, i) => [Pl.sx(x), Pl.sy(ys[i])]);
    const pc = pts(yc), pr = pts(yr);
    const defs = K.s('defs', {}, svg);
    const clipB = K.s('rect', { x: b.x0, y: b.y0 - 10, height: b.y1 - b.y0 + 20, width: 0 }, K.s('clipPath', { id: 'c53b' }, defs));
    const clipU = K.s('rect', { x: b.x0, y: b.y0 - 10, height: b.y1 - b.y0 + 20, width: 0 }, K.s('clipPath', { id: 'c53u' }, defs));
    const hatch = K.s('pattern', { id: 'h53', width: 14, height: 14, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
    K.s('line', { x1: 0, y1: 0, x2: 0, y2: 14, stroke: K.c('b'), 'stroke-width': 3, opacity: 0.5 }, hatch);
    const ptsStr = (a) => a.map((p) => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
    const under = K.s('g', { 'clip-path': 'url(#c53u)' }, svg);
    const pu = ptsStr(pc) + ` ${b.x1},${b.y1} ${b.x0},${b.y1}`;
    K.s('polygon', { points: pu, fill: K.c('b'), opacity: P.shade_alpha.under }, under); K.s('polygon', { points: pu, fill: 'url(#h53)' }, under);
    const between = K.s('polygon', { points: ptsStr(pc) + ' ' + ptsStr(pr.slice().reverse()), fill: K.c('metric'), opacity: P.shade_alpha.between, 'clip-path': 'url(#c53b)' }, svg);
    // labels with swatches (upper left of the plot, where both rates are still zero)
    const lC = C5.lab(ctx, '', b.x0 + 100, b.y0 + 20, 'halo'); lC.innerHTML = '<span class="sw" style="background:var(--b);height:6px;vertical-align:middle"></span>&nbsp; counted in time · simulation';
    const lR = C5.lab(ctx, '', b.x0 + 100, b.y0 + 72, 'halo'); lR.innerHTML = '<span class="sw" style="background:var(--metric);height:5px;vertical-align:middle"></span>&nbsp; Rice · true snapshots, shuffled, + equations';
    const icons = K.s('g', {}, svg);
    const clk = C5.clock(icons, b.x0 + 60, b.y0 + 40, 18), clk2 = C5.clock(icons, b.x0 + 60, b.y0 + 92, 18);
    K.pen(ctx, { kind: 'cross', box: { x: b.x0 + 38, y: b.y0 + 70, w: 44, h: 44 }, at: 'rice+0.5', dur: 0.35, width: 3.5, seed: 'clk53' });
    const boxIcon = C5.closedBox(icons, b.x0 + 60, b.y0 + 150, 64, 32);
    // overlap: the pen around the rise just above the threshold
    const xr0 = Pl.sx(CK.ranges[0].gamma_min), xr1 = Pl.sx(CK.ranges[1].gamma_min + 0.02);
    K.pen(ctx, { kind: 'circle', box: { x: xr0 - 10, y: Pl.sy(PP.y.max * 0.45), w: xr1 - xr0 + 20, h: Pl.sy(0) - Pl.sy(PP.y.max * 0.45) }, pad: 6, at: 'overlap+0.3', out: 'shade', dur: 0.6, seed: 'ov53' });
    // definition label
    const defl = K.el('div', { class: 'defl' }, st);
    defl.innerHTML = '<span class="k-metric">cumulative error</span> = <span class="sw" style="background:var(--metric);opacity:.6"></span> shaded area ÷ <span class="sw" style="background:var(--b);opacity:.35"></span> area under the counted curve';
    // brackets of the two ranges
    const brG = K.s('g', {}, svg), brLab = [];
    CK.ranges.forEach((r, i) => {
      const x0 = Pl.sx(r.gamma_min), x1 = Pl.sx(r.gamma_max), y = i === 0 ? b.y0 + 236 : b.y0 - 4;
      const g = K.s('g', {}, brG);
      K.s('path', { d: `M${x0},${y + 16} V${y} H${x1} V${y + 16}`, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3.5, 'stroke-linecap': 'round' }, g);
      const l = C5.lab(ctx, `${r.percent}% · ${r.label}`, (x0 + x1) / 2, y - 50, 'big center halo');
      brLab.push({ g, l });
    });
    if (CK.ranges[0].label !== 'near the threshold' || CK.ranges[1].label !== 'above') S.warn('05.3: range labels changed in data');
    K.chip(ctx, { text: `three chaotic dials · strip width fixed at h = ${K.fmt(CK.h)}`, kind: 'plain', x: b.x0, y: 750, at: 'honest', caps: false, maxWidth: 700 });
    // promise card 3 of 03.7, at the end of the 'honest' sentence
    const hs = (ctx.script.sentences || []).find((s) => s.cue === 'honest'), tP = hs ? hs.end - 0.4 : ctx.at('honest+3');
    const pcd = P.promise_card, card = K.el('div', { class: 'promise' }, st);
    card.style.left = pcd.x0 + 'px'; card.style.top = pcd.y0 + 'px'; card.style.width = (pcd.x1 - pcd.x0) + 'px'; card.style.height = (pcd.y1 - pcd.y0) + 'px';
    const csvg = K.s('svg', { width: 280, height: 200, viewBox: '0 0 280 200', style: 'position:absolute;left:0;top:0;overflow:visible' }, card);
    K.s('rect', { x: 206, y: 138, width: 50, height: 50, rx: 6, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, csvg);
    const ndl = K.s('g', { transform: 'translate(40 166)' }, csvg);
    K.s('circle', { r: 22, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, ndl);
    K.s('path', { d: 'M0,-17 L5,0 L0,17 L-5,0 Z', fill: K.c('fg') }, ndl);
    const ct = K.el('div', { html: K.markup(pcd.text) }, card); ct.style.width = '236px';
    K.pen(ctx, { kind: 'check', box: { x: pcd.x0 + 210, y: pcd.y0 + 136, w: 44, h: 44 }, at: tP + 0.5, dur: 0.4, seed: 'tick53', width: 5 });
    K.chip(ctx, { text: 'first tick · true snapshots', kind: 'plain', x: pcd.x1, y: pcd.y1 + 20, anchor: 'tr', at: tP + 0.8, caps: false, maxWidth: 280 });
    K.badge(ctx, { kind: 'MEASURED', note: 'E1 · fine grid · 41 Γ', at: -0.3 });
    K.lowerThird(ctx, { kind: 'source', data: E1, at: 'count+0.5', hold: 4 });
    K.formulaLayer(ctx, { label: 'Formula · R:883' });
    ctx.c = { T, cC, cR, clipB, clipU, b, lC, lR, clk, clk2, boxIcon, defl, brLab, card, tP };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.c, T = c.T, b = c.b;
    C5.fade(c.lC, t, T.count + 0.8); C5.fadeS(c.clk, t, T.count + 0.8);
    C5.fade(c.lR, t, T.rice + 0.3); C5.fadeS(c.clk2, t, T.rice + 0.3);
    const sh = Math.sin(Math.PI * 6 * S.seg(t, T.rice, T.rice + 0.5, S.ease.linear)) * 4;
    c.boxIcon.setAttribute('transform', `translate(${sh.toFixed(2)} 0)`); C5.fadeS(c.boxIcon, t, T.rice - 0.1, T.overlap);
    const pulse = 1 - 0.4 * Math.sin(Math.PI * S.seg(t, T.overlap, T.overlap + 0.6, S.ease.linear));
    c.cC.path.style.opacity = pulse; c.cR.path.style.opacity = pulse;
    c.clipB.setAttribute('width', ((b.x1 - b.x0) * S.seg(t, T.shade, T.shade + 1.2, S.ease.inOutSine)).toFixed(1));
    c.clipU.setAttribute('width', ((b.x1 - b.x0) * S.seg(t, T.shade + 1.3, T.shade + 2.3, S.ease.inOutSine)).toFixed(1));
    C5.fade(c.defl, t, T.shade + 0.4);
    c.brLab.forEach((q, i) => { const a = T.numbers + 0.2 + i * 0.9; C5.fadeS(q.g, t, a); C5.fade(q.l, t, a + 0.1); });
    C5.fade(c.card, t, c.tP);
    c.card.style.transform = `translateX(${(40 * (1 - S.ease.outCubic(S.seg(t, c.tP, c.tP + 0.4)))).toFixed(1)}px)`;
  },
});
</script></body></html>
