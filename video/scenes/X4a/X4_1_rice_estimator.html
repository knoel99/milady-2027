<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X4.1 Rice, the estimator</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X4a.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X4a_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X4.1 Rice, the estimator (L4, NIGHT, PROVED: Prop. 8 / Prop. 2.31). Synthetic Gaussian snapshots (illustration, true
   rate known, no data numbers printed): the window estimate of 30 seeded shoeboxes against h (precomputed on a 60-point
   log grid), wide = bias, narrow = variance. Then E1's real shoebox at Γ = 0.93 (data/e1_samples_0.93.json; strip
   membership and counts from data/ch05_rice.json), the cosine's thin ring, and the caveats for chaos. */
Scene.define({
  duration: 43, register: 'night',
  cues: { aside: 0.6, wide: 2.8, narrow: 7.2, e1: 11.4, why: 15.8, cosine: 18.6, chaos: 27.4 },
  data: { e1: 'data/e1_samples_0.93.json', rice: 'data/ch05_rice.json' },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, L = P.left, R = P.right, SL = P.slider, GA = P.gauss, RS = ctx.data.rice.strip;
    window.__EVENTS__ = [{ t: +(ctx.at('e1') + 0.4).toFixed(3), id: 'pop', gain_db: -24 }];
    K.rail(ctx, { from: 'L4', to: 'L4', at: -0.2, hold: 3 });
    K.lowerThird(ctx, { kind: 'chapter', l1: P.tag.l1, l2: P.tag.l2, at: -0.2, out: ctx.at('aside') - 0.1 });
    K.badge(ctx, { kind: 'PROVED', note: 'Prop. 8 (report) · Prop. 2.31 (PhD plan) · E1 window h = 0.2', at: -0.3 });
    XK.title(ctx, "Rice's formula, as an estimator", 'aside-0.15', { y: P.title_y - 20, out: 'e1-0.3' });
    const T = { a: ctx.at('aside-0.15'), w: ctx.at('wide-0.15'), n: ctx.at('narrow-0.15'), e: ctx.at('e1-0.15'), y: ctx.at('why-0.15'), c: ctx.at('cosine-0.15'), ch: ctx.at('chaos-0.15') };
    // ---- synthetic boxes: estimates on a log grid of h ----
    const NG = 60, hg = []; for (let k = 0; k < NG; k++) hg.push(Math.exp(Math.log(R.h_axis[0]) + (Math.log(R.h_axis[1]) - Math.log(R.h_axis[0])) * k / (NG - 1)));
    const rng = S.rng(GA.seed), truth = GA.sigma_dot / (Math.PI * GA.sigma), est = [];
    for (let b = 0; b < GA.boxes; b++) {
      const pts = []; for (let i = 0; i < GA.N_per_box; i++) { const g = XK.gauss(rng); pts.push([Math.abs(GA.sigma * g[0]), Math.abs(GA.sigma_dot * g[1])]); }
      pts.sort((a, c) => a[0] - c[0]); const row = []; let j = 0, s = 0;
      for (let k = 0; k < NG; k++) { while (j < pts.length && pts[j][0] < hg[k]) { s += pts[j][1]; j++; } row.push(s / (2 * hg[k] * GA.N_per_box) / truth); }
      est.push(row);
    }
    const cl = []; for (let i = 0; i < GA.N_cloud; i++) { const g = XK.gauss(rng); cl.push([GA.sigma * g[0], Math.abs(GA.sigma_dot * g[1])]); }
    // E1 shoebox
    const XS = S.f32(ctx.data.e1.variants[P.e1_strip.variant].x), NE = ctx.data.e1.variants.ref.n, e1p = [];
    for (let i = 0; i < NE; i++) { const q = XS[3 * i], d = XS[3 * i + 1], v = XS[3 * i + 2]; e1p.push([d, Math.abs(-RS.coef_D * d + v * q)]); }
    // cosine ring
    const CO = P.cosine, cr = S.rng(CO.seed), ring = []; for (let i = 0; i < CO.n_phases; i++) { const ph = 2 * Math.PI * cr(); ring.push([Math.cos(ph), Math.abs(Math.sin(ph))]); }
    const rr = ring.slice().sort((a, c) => Math.abs(a[0]) - Math.abs(c[0])), ringEst = []; { let j = 0, s = 0; for (let k = 0; k < NG; k++) { while (j < rr.length && Math.abs(rr[j][0]) < hg[k]) { s += rr[j][1]; j++; } ringEst.push(s / (2 * hg[k] * CO.n_phases) / (1 / Math.PI)); } }
    // ---- left panel ----
    const X = (d) => L.x0 + (L.x1 - L.x0) * (d - L.D_range[0]) / (L.D_range[1] - L.D_range[0]), Y = (s) => L.y1 - (L.y1 - L.y0) * Math.min(1, s / L.speed_range[1]);
    const svg = K.svgLayer(ctx, 12), lp = K.s('g', {}, svg);
    K.s('line', { x1: L.x0, x2: L.x1, y1: L.y1, y2: L.y1, stroke: K.c('muted'), 'stroke-width': 2 }, lp);
    K.s('line', { x1: X(0), x2: X(0), y1: L.y1, y2: L.y0, stroke: K.c('muted'), 'stroke-width': 2 }, lp);
    K.s('text', { x: L.x1 + 10, y: L.y1 + 10, class: 'kt-axis' }, lp, 'D').style.fill = K.c('b');
    K.s('text', { x: X(0) + 12, y: L.y0 + 34, class: 'kt-axis' }, lp, '|Ḋ| · speed');
    XK.timed(ctx, lp, 'aside-0.15', 'cosine-0.15');
    const stripR = K.s('rect', { y: L.y0, height: L.y1 - L.y0, fill: K.rgba(K.c('chalk'), 0.1), stroke: K.c('chalk'), 'stroke-width': 2, 'stroke-dasharray': '8 6' }, svg);
    const CV = K.canvasLayer(ctx, 6, { x: L.x0, y: L.y0, w: L.x1 - L.x0, h: L.y1 - L.y0 }, null, { reset: true });
    const sl = K.s('g', {}, svg); K.s('line', { x1: SL.x0, x2: SL.x1, y1: SL.y, y2: SL.y, stroke: K.c('matter'), 'stroke-width': 6, 'stroke-linecap': 'round' }, sl);
    const thumb = K.s('circle', { cy: SL.y, r: 14, fill: K.c('chalk') }, sl); XK.timed(ctx, sl, 'aside-0.15', 'cosine-0.15');
    XK.lab(ctx, 'strip half-width h', SL.x0, SL.y + 22, { cls: 'small', at: 'aside', out: 'cosine-0.15' });
    XK.lab(ctx, 'strip · |D| < h', X(0) + 20, L.y0 + 90, { cls: 'small halo', at: 'aside', out: 'e1-0.15', z: 32 });
    K.chip(ctx, { text: 'illustration · synthetic Gaussian snapshots, true rate known · no data', kind: 'schematic', maxWidth: 740, x: L.x0, y: 750, at: 'aside', out: 'narrow+0.4' });
    // ---- right panel ----
    const PL = K.plot(ctx, { box: { x0: R.x0, x1: R.x1, y0: R.y0, y1: R.y1 }, at: 'aside-0.15', out: 'chaos-0.15',
      x: { label: 'h (units of σ)', min: R.h_axis[0], max: R.h_axis[1], log: true, ticks: R.h_ticks }, y: { label: 'estimate ÷ true rate', min: R.ratio_axis[0], max: R.ratio_axis[1], ticks: R.ratio_ticks } });
    PL.hline({ y: 1, kind: 'ref', field: 'chalk', label: 'true rate', at: 'aside' });
    const RC = K.canvasLayer(ctx, 7, { x: R.x0, y: R.y0 - 10, w: R.x1 - R.x0, h: R.y1 - R.y0 + 20 }, null, { reset: true });
    XK.lab(ctx, 'wide: bias ∝ h²', PL.sx(1.0) - 40, PL.sy(0.62), { anchor: 'r', color: 'metric', at: 'wide+1.0', out: 'e1-0.15' });
    XK.lab(ctx, 'narrow: variance ∝ 1/(N h)', PL.sx(0.03) + 20, PL.sy(1.5) - 10, { color: 'metric', at: 'narrow+1.0', out: 'e1-0.15' });
    XK.lab(ctx, `${GA.boxes} shoeboxes of N snapshots`, R.x0 + 20, R.y1 - 48, { cls: 'small', at: 'aside+0.4', out: 'wide-0.15' });
    XK.lab(ctx, 'error bars assume independent snapshots: generated ones are, one simulation\'s are not · T:691', 120, 780, { w: 900, cls: 'small', color: 'muted', at: 'narrow+0.6', out: 'e1-0.15' });
    // e1 labels
    XK.lab(ctx, `the three-dial experiment · Γ = ${RS.gamma}`, L.x0, L.y0 - 60, { at: 'e1', out: 'cosine-0.15' });
    XK.lab(ctx, `h = ${RS.h}`, X(RS.h) + 10, L.y0 + 90, { cls: 'small halo', at: 'e1+0.2', out: 'why-0.15', z: 32 });
    K.chip(ctx, { text: `in the strip: ${RS.n_in_strip} of ${RS.n_total.toLocaleString('en-US')} snapshots`, kind: '', x: L.x0 + 380, y: 680, at: 'e1+0.3', out: 'cosine-0.15' });
    K.lowerThird(ctx, { kind: 'source', data: ctx.data.e1, at: 'e1+0.5', hold: 4 });
    XK.lab(ctx, 'h → 0 ?', X(0), L.y0 + 130, { anchor: 'c', cls: 'big halo', at: 'why+0.6', out: 'cosine-0.15', z: 32 });
    // ---- cosine card ----
    const TB = CO.trace_box, RB = CO.ring_box, cg = K.s('g', {}, svg);
    let tp = '', ticks = []; const NP = 600, per = CO.periods;
    for (let i = 0; i <= NP; i++) { const u = i / NP, x = TB.x0 + (TB.x1 - TB.x0) * u, y = (TB.y0 + TB.y1) / 2 - 60 * Math.cos(2 * Math.PI * per * u); tp += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1); }
    for (let k = 0; k < 2 * per; k++) ticks.push((k + 0.5) / (2 * per));
    K.s('line', { x1: TB.x0, x2: TB.x1, y1: (TB.y0 + TB.y1) / 2, y2: (TB.y0 + TB.y1) / 2, stroke: K.c('muted'), 'stroke-width': 2 }, cg);
    const trace = K.s('path', { d: tp, fill: 'none', stroke: K.c('b'), 'stroke-width': 4 }, cg); XK.drawOn(ctx, trace, 'cosine', 2.5, 'chaos-0.15');
    const tickEls = ticks.map((u) => K.s('line', { x1: TB.x0 + (TB.x1 - TB.x0) * u, x2: TB.x0 + (TB.x1 - TB.x0) * u, y1: (TB.y0 + TB.y1) / 2 - 14, y2: (TB.y0 + TB.y1) / 2 + 14, stroke: K.c('chalk'), 'stroke-width': 4 }, cg));
    const tc = ctx.at('cosine'); window.__EVENTS__.push(...ticks.map((u) => ({ t: +(tc + 2.5 * u).toFixed(3), id: 'tick', gain_db: P.sfx_ticks.gain_db })));
    XK.timed(ctx, cg, 'cosine-0.15', 'chaos-0.15');
    XK.lab(ctx, 'D = cos(ωt + φ)', TB.x0, TB.y0 - 40, { at: 'cosine', out: 'chaos-0.15' });
    XK.lab(ctx, 'two crossings per period', TB.x1, TB.y0 - 40, { anchor: 'r', cls: 'small', at: 'cosine+1.5', out: 'chaos-0.15' });
    XK.lab(ctx, 'snapshots on a thin ring: no smooth density', RB.x0, RB.y1 + 10, { cls: 'small', at: 'cosine+1.0', out: 'chaos-0.15' });
    const ringC = K.canvasLayer(ctx, 6, { x: RB.x0, y: RB.y0, w: RB.x1 - RB.x0, h: RB.y1 - RB.y0 }, null, { reset: true });
    const ringCurve = PL.curve({ x: hg, y: ringEst.map((v) => Math.max(R.ratio_axis[0], Math.min(R.ratio_axis[1], v))), field: 'chalk', at: 'cosine+0.8', dur: 1.6 });
    void ringCurve;
    K.pen(ctx, { kind: 'check', box: { x: PL.sx(hg[0]) + 6, y: PL.sy(1) - 64, w: 40, h: 36 }, at: 'cosine+2.6', out: 'chaos-0.15' });
    XK.lab(ctx, 'the formula: two per period', PL.sx(hg[0]) + 60, PL.sy(1) - 80, { cls: 'small', at: 'cosine+2.8', out: 'chaos-0.15' });
    // ---- chaos caveats ----
    XK.card(ctx, R.x0, R.y0, R.x1 - R.x0, 150, { body: 'deterministic chaos: smooth density not guaranteed → {metric}the answer depends on h{/}', at: 'chaos-0.15' });
    XK.card(ctx, R.x0, R.y0 + 180, R.x1 - R.x0, 100, { body: 'needs the equations: they give the speedometer', at: 'chaos+0.4' });
    const c2 = XK.card(ctx, R.x0, R.y0 + 300, R.x1 - R.x0, 100, { body: 'tested on a 3-variable deterministic system only', at: 'chaos+0.8' });
    K.pen(ctx, { kind: 'underline', box: { x: R.x0 + 20, y: R.y0 + 300, w: 680, h: 100 }, offset: 8, at: 'chaos+1.6' });
    void c2;
    XK.lab(ctx, 'only test so far: three deterministic dials', R.x0, R.y0 + 420, { at: 'chaos+1.2' });
    K.formulaLayer(ctx, { label: 'Formula · R:510-528 · T, Prop. 2.31' });
    ctx.x41 = { T, hg, est, cl, e1p, ring, X, Y, CV, RC, PL, L, SL, R, stripR, thumb, RS, ringC, RB, tickEls, ticks, tc };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.x41, T = c.T, SL = c.SL;
    // h(t)
    let h = SL.h_rest;
    if (t >= T.w) h = Math.exp(XK.lerp(Math.log(SL.h_rest), Math.log(SL.h_wide), S.seg(t, T.w, T.w + SL.sweep_dur, S.ease.inOutSine)));
    if (t >= T.n) h = Math.exp(XK.lerp(Math.log(SL.h_wide), Math.log(SL.h_narrow), S.seg(t, T.n, T.n + SL.sweep_dur, S.ease.inOutSine)));
    if (t >= T.e) h = XK.lerp(SL.h_narrow, c.RS.h, S.seg(t, T.e, T.e + 0.8, S.ease.inOutSine));
    if (t >= T.y) h = c.RS.h * (1 - S.seg(t, T.y, T.y + 0.8, S.ease.inOutSine));
    const hx = (v) => Math.max(0, Math.min(1, (Math.log(Math.max(v, 1e-4)) - Math.log(0.01)) / (Math.log(2) - Math.log(0.01))));
    c.thumb.setAttribute('cx', XK.lerp(SL.x0, SL.x1, hx(h)).toFixed(1));
    const x0 = c.X(-h), x1 = c.X(h); c.stripR.setAttribute('x', x0.toFixed(1)); c.stripR.setAttribute('width', Math.max(2, x1 - x0).toFixed(1));
    const vis = S.seg(t, T.a, T.a + 0.4, S.ease.linear) * (1 - S.seg(t, T.c, T.c + 0.4, S.ease.linear)) + S.seg(t, T.ch, T.ch + 0.6, S.ease.linear);
    c.stripR.style.opacity = Math.min(1, vis) * (t >= T.ch ? 0 : 1);
    // cloud: synthetic, then E1 (crossfade), dim outside the strip while narrow
    const g = c.CV.g; g.clearRect(0, 0, c.CV.w, c.CV.h);
    const pe = S.seg(t, T.e, T.e + 1.2, S.ease.inOutSine), nar = S.seg(t, T.n + 0.6, T.n + 1.2, S.ease.linear) * (1 - pe);
    const outC = 1 - S.seg(t, T.c, T.c + 0.6, S.ease.linear) + S.seg(t, T.ch, T.ch + 0.6, S.ease.linear);
    if (Math.min(1, outC) * vis > 0) {
      const a0 = Math.min(1, outC) * Math.min(1, vis);
      if (pe < 1) { g.fillStyle = K.c('chalk'); for (const p of c.cl) { const inn = Math.abs(p[0]) < h; g.globalAlpha = 0.5 * a0 * (1 - pe) * (inn ? 1 : 1 - 0.7 * nar); g.fillRect(c.X(p[0]) - c.L.x0 - 1.5, c.Y(p[1]) - c.L.y0 - 1.5, 3, 3); } }
      if (pe > 0) { for (const p of c.e1p) { const inn = Math.abs(p[0]) < h; g.fillStyle = p[0] >= 0 ? K.c('b') : K.c('b-neg'); g.globalAlpha = a0 * pe * (inn ? 1 : 0.45); g.fillRect(c.X(p[0]) - c.L.x0 - 1.5, c.Y(p[1]) - c.L.y0 - 1.5, inn ? 5 : 3, inn ? 5 : 3); } }
    }
    // right panel: tick column at h and the envelope over visited h
    const r = c.RC.g; r.clearRect(0, 0, c.RC.w, c.RC.h);
    const pr = (1 - 0.7 * S.seg(t, T.e, T.e + 0.6, S.ease.linear)) * (1 - S.seg(t, T.c, T.c + 0.4, S.ease.linear));
    if (t >= T.a && t < T.c + 0.4) {
      const lo = t >= T.n ? Math.min(h, c.SL.h_rest) : c.SL.h_rest, hi = t >= T.w ? (t >= T.n ? c.SL.h_wide : Math.max(h, c.SL.h_rest)) : c.SL.h_rest;
      const ox = c.R.x0, oy = c.R.y0 - 10, cy = (v) => c.PL.sy(Math.max(c.R.ratio_axis[0], Math.min(c.R.ratio_axis[1], v))) - oy;
      r.globalAlpha = 0.18 * pr; r.fillStyle = K.c('metric'); r.beginPath();
      const ks = c.hg.map((v, k) => k).filter((k) => c.hg[k] >= lo * 0.999 && c.hg[k] <= hi * 1.001);
      if (ks.length > 1) { ks.forEach((k, i) => { const v = Math.min(...c.est.map((e) => e[k])); i ? r.lineTo(c.PL.sx(c.hg[k]) - ox, cy(v)) : r.moveTo(c.PL.sx(c.hg[k]) - ox, cy(v)); });
        ks.slice().reverse().forEach((k) => r.lineTo(c.PL.sx(c.hg[k]) - ox, cy(Math.max(...c.est.map((e) => e[k]))))); r.closePath(); r.fill(); }
      // column at h (interpolated on the grid)
      const lh = Math.log(Math.max(h, c.hg[0])), kf = (lh - Math.log(c.hg[0])) / (Math.log(c.hg[c.hg.length - 1]) - Math.log(c.hg[0])) * (c.hg.length - 1), k0 = Math.max(0, Math.min(c.hg.length - 2, Math.floor(kf))), w = Math.min(1, Math.max(0, kf - k0));
      r.globalAlpha = pr; r.strokeStyle = K.c('metric'); r.lineWidth = 3; const xx = c.PL.sx(Math.max(h, c.hg[0])) - ox;
      r.beginPath(); c.est.forEach((e) => { const v = e[k0] + w * (e[k0 + 1] - e[k0]), y = cy(v); r.moveTo(xx - 10, y); r.lineTo(xx + 10, y); }); r.stroke();
    }
    // ring
    const q = c.ringC.g; q.clearRect(0, 0, c.ringC.w, c.ringC.h);
    const pin = S.seg(t, T.c + 0.6, T.c + 1.4, S.ease.linear) * (1 - S.seg(t, T.ch, T.ch + 0.4, S.ease.linear));
    if (pin > 0) { q.globalAlpha = 0.6 * pin; for (const p of c.ring) { q.fillStyle = p[0] >= 0 ? K.c('b') : K.c('b-neg'); q.fillRect((p[0] + 1.2) / 2.4 * c.ringC.w - 1, c.ringC.h - p[1] * (c.ringC.h - 20) - 10, 2.5, 2.5); }
      q.globalAlpha = 0.15 * pin; q.fillStyle = K.c('chalk'); q.fillRect(c.ringC.w / 2 - 14, 0, 28, c.ringC.h); }
    c.tickEls.forEach((e, k) => { e.style.opacity = S.seg(t, c.tc + 2.5 * c.ticks[k] - 0.05, c.tc + 2.5 * c.ticks[k] + 0.1, S.ease.linear); });
  },
});
</script></body></html>
