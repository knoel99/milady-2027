<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X4.2 A bound from thresholds</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X4a.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X4a_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X4.2 A bound from thresholds (L4→L5, NIGHT, PENDING: CONJECTURE medium). Top band: a SCHEMATIC D(t) trace (spline
   through the entry's knots): a reversal crosses −a, a wobble crosses +a and comes back; then the conjecture's
   pictogram (SCHEMATIC). Bottom: Kit.seat 'curve' for data/x4_rice_levels.json with two READY anchors: the folded
   |D| histogram of the 8,000 reference snapshots at Γ = 0.9 and the counted zero-crossing rate at Γ = 0.9
   (e1_finegrid). No number of the missing result. */
Scene.define({
  duration: 46, register: 'night',
  cues: { level: 0.6, cap: 8.0, loose: 13.6, plateau: 16.0, bet: 23.4, why: 33.0, ask: 37.0 },
  data: { seat: { url: 'data/x4_rice_levels.json', optional: true }, snaps: 'data/e1_samples_0.9.json', fine: 'data/e1_finegrid.json' },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, TR = P.trace, SE = P.seat, res = ctx.variant === 'result';
    window.__EVENTS__ = [{ t: +(ctx.at('cap') + 0.3).toFixed(3), id: 'pop', gain_db: -24 }];
    K.rail(ctx, { from: 'L4', to: 'L5', at: -0.2, hold: 3 });
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'medium', at: -0.3 });
    // ---- top band: schematic trace ----
    const B = { x0: TR.box.x0, x1: TR.box.x1, y0: 110, y1: 290 }, zy = 200, amp = 70;
    const kn = TR.knots, rng = S.rng(TR.seed), N = 400, pts = [];
    const spl = (u) => { let k = 0; while (k < kn.length - 2 && kn[k + 1][0] < u) k++; const [u0, v0] = kn[k], [u1, v1] = kn[k + 1], w = (u - u0) / (u1 - u0), s = w * w * (3 - 2 * w); return v0 + (v1 - v0) * s; };
    for (let i = 0; i <= N; i++) { const u = i / N; pts.push([B.x0 + (B.x1 - B.x0) * u, zy - amp * (spl(u) + TR.wiggle * (rng() - 0.5) * 2)]); }
    const svg = K.svgLayer(ctx, 12), tg = K.s('g', {}, svg);
    const ya = zy - amp * TR.level_a, yb = zy + amp * TR.level_a;
    [[ya, '+a'], [zy, 'D = 0'], [yb, '−a']].forEach(([y, l], k) => { K.s('line', { x1: B.x0, x2: B.x1, y1: y, y2: y, stroke: k === 1 ? K.c('muted') : K.c('chalk'), 'stroke-width': 2, 'stroke-dasharray': k === 1 ? 'none' : '8 6' }, tg);
      K.s('text', { x: B.x1 + 12, y: y + 10, class: 'kt-tick' }, tg, l); });
    let dp = '', dn = ''; pts.forEach((p, i) => { const pos = p[1] <= zy; const seg = (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1); dp += seg; void pos; });
    const tr = K.s('path', { d: dp, fill: 'none', stroke: K.c('b'), 'stroke-width': 4 }, tg); void dn;
    XK.drawOn(ctx, tr, 'level-0.15', 1.6);
    // reversal: first crossing of −a; wobble: crossings of +a before the reversal
    let ir = pts.findIndex((p) => p[1] > yb), wob = []; for (let i = 1; i < ir; i++) if ((pts[i - 1][1] - ya) * (pts[i][1] - ya) < 0) wob.push(i);
    const rv = K.s('circle', { cx: pts[ir][0], cy: yb, r: 9, fill: K.c('chalk') }, tg); XK.timed(ctx, rv, 'level+1.4', null);
    XK.timed(ctx, tg, -0.3, 'plateau-0.15');
    XK.lab(ctx, 'a reversal: from above a to below −a', pts[ir][0] - 20, yb + 8, { anchor: 'r', cls: 'small', at: 'level+1.6', out: 'plateau-0.15' });
    const wi = wob.slice(0, 2); const wg = K.s('g', {}, svg); wi.forEach((i) => K.s('circle', { cx: pts[i][0], cy: ya, r: 8, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3 }, wg));
    XK.timed(ctx, wg, 'loose-0.15', 'plateau-0.15');
    if (wi.length) { const xm = (pts[wi[0]][0] + pts[wi[wi.length - 1]][0]) / 2;
      K.pen(ctx, { kind: 'circle', box: { x: xm - 50, y: ya - 30, w: 100, h: 60 }, at: 'loose', out: 'plateau-0.15' });
      XK.lab(ctx, 'wobble: crosses a, no reversal', xm - 40, zy + 6, { cls: 'small halo', at: 'loose+0.3', out: 'plateau-0.15' }); }
    K.chip(ctx, { text: 'SCHEMATIC · drawn trace, no data', kind: 'schematic', x: 1216, y: 130, at: 'level', out: 'plateau-0.15' });
    // pictogram (schematic): r_a against a, a plateau above the floor r
    const pg = K.s('g', {}, svg), PX = (u) => B.x0 + 60 + (B.x1 - B.x0 - 120) * u, PY = (v) => B.y1 - 10 - (B.y1 - B.y0 - 20) * v;
    let pd = ''; for (let i = 0; i <= 100; i++) { const u = i / 100, v = 0.25 + 0.7 * Math.exp(-u / 0.08) + 0.5 * Math.pow(Math.max(0, u - 0.7) / 0.3, 2); pd += (i ? 'L' : 'M') + PX(u).toFixed(1) + ',' + PY(v).toFixed(1); }
    K.s('rect', { x: PX(0.3), y: PY(0.25 * 1.3 + 0.03), width: PX(0.65) - PX(0.3), height: PY(0.19) - PY(0.25 * 1.3 + 0.03), fill: K.rgba(K.c('chalk'), 0.1), stroke: K.c('chalk'), 'stroke-dasharray': '8 6' }, pg);
    K.s('line', { x1: PX(0), x2: PX(1), y1: PY(0.2), y2: PY(0.2), stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '10 8' }, pg);
    K.s('path', { d: pd, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 4 }, pg);
    K.s('text', { x: PX(1) + 10, y: PY(0.2) + 10, class: 'kt-label' }, pg, 'r');
    XK.timed(ctx, pg, 'plateau-0.15', null, { din: 0.8 });
    XK.lab(ctx, 'plateau (Conjecture 2.33)', PX(0.3), PY(0.25 * 1.3 + 0.03) - 44, { cls: 'small', at: 'plateau+0.4' });
    XK.lab(ctx, 'within 30 % of r', PX(0.66) + 14, PY(0.36) - 8, { cls: 'small', at: 'plateau+0.6' });
    K.chip(ctx, { text: "SCHEMATIC · the conjecture's picture, no data", kind: 'schematic', maxWidth: 600, x: 1216, y: 130, at: 'plateau', out: 'bet-0.3' });
    // ---- the seat ----
    const SB = SE.box, fr = { x: 260, y: 380, w: SB.x1 - 260, h: 300 };
    const fine = ctx.data.fine, gi = fine.x.values.findIndex((g) => Math.abs(g - P.gamma) < 1e-9), r0 = fine.series[0].y[gi];
    const seat = K.seat(ctx, { type: 'curve', variant: ctx.variant, data: ctx.data.seat, tag: SE.tag, frame: fr, at: 'cap-0.15',
      x: SE.x, y: SE.y, band: res ? { y: [ctx.data.seat.floor ? ctx.data.seat.floor.r : 0, ctx.data.seat.floor ? 1.3 * ctx.data.seat.floor.r : 0] } : undefined,
      bet: SE.bet, confidence: SE.confidence, criterion: SE.criterion, source: SE.source, ask: SE.ask,
      cues: res ? { frame: 'data-0.15', data: 'data-0.15', bet: 'bet', criterion: 'verdict', ask: 'verdict' } : { frame: 'cap-0.15', bet: 'bet-0.15', criterion: 'bet+1.5', ask: 'ask-0.15', data: 'cap' } });
    void seat;
    // READY anchors: folded |D| histogram (silhouette) and the counted rate at a = 0
    const XS = S.f32(ctx.data.snaps.variants.ref.x), nS = ctx.data.snaps.variants.ref.n, nb = 40, hist = new Float64Array(nb);
    for (let i = 0; i < nS; i++) { const a = Math.abs(XS[3 * i + 1]), k = Math.floor(a / 2.5 * nb); if (k < nb) hist[k]++; }
    const hm = Math.max(...hist), px0 = fr.x, pw = fr.w, py1 = fr.y + fr.h - 60, ag = K.s('g', {}, svg);
    for (let k = 0; k < nb; k++) { const hh = 80 * hist[k] / hm; K.s('rect', { x: px0 + pw * k / nb, y: py1 - hh, width: pw / nb - 2, height: hh, fill: K.rgba(K.c('muted'), 0.3) }, ag); }
    const ly = (v) => fr.y + 40 + (py1 - fr.y - 40) * (Math.log10(SE.y.max) - Math.log10(v)) / (Math.log10(SE.y.max) - Math.log10(SE.y.min));
    K.s('circle', { cx: px0, cy: ly(r0), r: 10, fill: K.c('muted') }, ag);
    XK.timed(ctx, ag, res ? 'data-0.15' : 'cap', null);
    XK.lab(ctx, `where snapshots sit · |D| at Γ = ${P.gamma}`, px0 + pw - 310, py1 - 76, { w: 300, cls: 'small', color: 'muted', at: res ? 'data' : 'cap+0.3' });
    XK.lab(ctx, 'a = 0: every zero crossing, counted', px0 + 22, ly(r0) + 8, { cls: 'small', at: res ? 'data' : 'cap+0.5' });
    if (!res) {
      XK.lab(ctx, '{metric}r_a{/} · crossings of the level a, either way (Rice: snapshots + equations)', px0 + 40, fr.y + 50, { cls: 'small', w: 620, at: 'cap+0.9', out: 'plateau-0.15' });
      XK.lab(ctx, '≥ r · reversals per unit time', px0 + 40, fr.y + 124, { cls: 'small', at: 'cap+1.3', out: 'plateau-0.15' });
      K.lowerThird(ctx, { kind: 'source', data: ctx.data.snaps, at: 'cap+0.8', hold: 4 });
      XK.lab(ctx, ctx.script.onscreen && ctx.script.onscreen.chips ? ctx.script.onscreen.chips[1] : '', 120, 806, { w: 920, cls: 'small', color: 'muted', at: 'bet' });
    }
    K.formulaLayer(ctx);
  },
});
</script></body></html>
