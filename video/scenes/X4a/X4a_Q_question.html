<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X4a.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X4a.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X4a_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X4a.Q question card (no claim, no badge). Text from the script's "question"; behind it at 10 %, a schematic texture of
   amber bars (a comb then a decaying tail, no data). */
Scene.define({
  duration: 9, register: 'night',
  cues: { q: 0.5 },
  params: { backdrop: { opacity: 0.1 } },
  setup(ctx) {
    const K = Kit, P = ctx.params;
    window.__EVENTS__ = [{ t: +Math.max(0, ctx.at('q') - 0.2).toFixed(3), id: 'chime', gain_db: -22 }];
    const svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: P.backdrop.opacity }, svg);
    for (let k = 0; k < 40; k++) { const h = 600 * Math.exp(-k / 12) * (k < 10 ? (k % 3 === 1 ? 1 : 0.55) : 1) + 20; K.s('rect', { x: 200 + k * 38, y: 900 - h, width: 32, height: h, fill: K.c('metric') }, bg); }
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'X4a', category: 'runs', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-6 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
