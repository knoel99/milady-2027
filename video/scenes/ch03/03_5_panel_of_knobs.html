<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>03.5 A panel of knobs</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch03.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch03_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 03.5 A panel of knobs (L2, NIGHT, CONTEXT). One green knob splits into five (params.knobs, words only), each lit
   on its cue with a small grey pictogram (iron disc, unequal impellers with a flipping strip, precessing cylinder);
   on 'wall' the row moves up, a wall-condition switch flips at params.wall_switch.flip_at and the threshold marker on
   a green Rm axis slides right by threshold_shift.to / threshold_shift.from (no numbers on the main layer). */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { panel: 0.4, stir: 3.4, iron: 7.0, asym: 10.0, prec: 13.6, wall: 18.0 },
  params: { knobs: [], wall_switch: { label: 'wall condition', from: 'simplified', to: 'vacuum', flip_at: 'wall+1.8' }, threshold_shift: { from: 90, to: 130 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C3.labOf(ctx, s, s);
    const T = {}; ['panel', 'stir', 'iron', 'asym', 'prec', 'wall'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    const KN = P.knobs.length ? P.knobs : [{ name: 'Re', gloss: 'stirring', cue: 'stir' }, { name: 'Rm', gloss: 'stretch vs smudge', cue: 'stir' }, { name: 'iron', gloss: 'disc material', cue: 'iron' }, { name: 'asymmetry', gloss: 'unequal disc speeds', cue: 'asym' }, { name: 'precession', gloss: "the tank's axis turns", cue: 'prec' }];
    const row = K.el('div', { class: 'c3-grp' }, st); row.style.zIndex = 14;
    const XS = KN.map((_, i) => 960 + (i - 2) * 330), KY = 470;
    const knobs = KN.map((k, i) => ({ k, t: ctx.at(k.cue) - 0.15, knob: K.knob(ctx, { x: XS[i], y: KY, r: 62, min: 0, max: 1, showValue: false, ticks: 8, parent: row, keys: [{ at: -0.4, v: 0.3 }, { at: k.cue + '-0.15', v: 0.55, dur: 0.9 }] }),
      lab: (() => { const e = K.el('div', { class: 'c3-label center', html: `<div style="color:var(--fg);font-size:32px">${K.esc(k.name)}</div><div style="font-size:28px">${K.esc(k.gloss)}</div>` }, row); e.style.left = XS[i] + 'px'; e.style.top = (KY + 110) + 'px'; return e; })() }));
    // pictograms above the knobs (iron, asym, prec)
    const svg = K.svgLayer(ctx, 15, row), pic = {};
    const ix = XS[2], ax = XS[3], px = XS[4], PY = KY - 150;
    pic.iron = K.s('g', { transform: `translate(${ix} ${PY})` }, svg); const disc = K.s('ellipse', { rx: 60, ry: 18, fill: K.c('fg-2'), stroke: K.c('matter'), 'stroke-width': 2 }, pic.iron);
    pic.asym = K.s('g', { transform: `translate(${ax} ${PY})` }, svg); const imp = [-40, 40].map((dx) => { const g = K.s('g', { transform: `translate(${dx} 0)` }, pic.asym); K.s('circle', { r: 22, fill: 'none', stroke: K.c('matter'), 'stroke-width': 3 }, g); const b = K.s('line', { x1: -20, y1: 0, x2: 20, y2: 0, stroke: K.c('fg-2'), 'stroke-width': 4 }, g); return b; });
    const strip = K.s('g', {}, pic.asym); const sa = K.s('rect', { x: -60, y: 36, width: 70, height: 12, fill: K.c('b') }, strip), sb = K.s('rect', { x: 10, y: 36, width: 50, height: 12, fill: K.c('b-neg') }, strip);
    pic.prec = K.s('g', { transform: `translate(${px} ${PY})` }, svg); const cyl = K.s('g', {}, pic.prec); K.s('rect', { x: -50, y: -26, width: 100, height: 52, rx: 12, fill: 'none', stroke: K.c('matter'), 'stroke-width': 3, 'stroke-dasharray': '7 6' }, cyl);
    K.s('line', { x1: -70, x2: 70, y1: 0, y2: 0, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '5 6' }, cyl);
    // wall: switch + Rm axis with the threshold marker
    const ws = P.wall_switch, sh = P.threshold_shift, wg = K.s('g', {}, K.svgLayer(ctx, 15));
    const sw = K.s('g', { transform: 'translate(300 640)' }, wg); K.s('rect', { x: -50, y: -20, width: 100, height: 40, rx: 20, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 3 }, sw);
    const knobS = K.s('circle', { r: 15, fill: K.c('fg') }, sw);
    const lWs = C3.label(st, lab(ws.label), 300, 560, 'center'), lF = C3.label(st, lab(ws.from), 300 - 70, 676, 'right'), lT = C3.label(st, lab(ws.to), 300 + 70, 676, '');
    [lF, lT].forEach((e) => { e.style.fontSize = '28px'; });
    const AX0 = 600, AX1 = 1600, AY = 640;
    K.s('line', { x1: AX0, x2: AX1, y1: AY, y2: AY, stroke: K.c('param'), 'stroke-width': 3 }, wg);
    const lRm = C3.label(st, lab('Rm'), AX1 + 16, AY - 22, ''); lRm.style.color = 'var(--param)';
    const m0 = AX0 + 0.35 * (AX1 - AX0), m1 = AX0 + 0.35 * (AX1 - AX0) * (sh.to / sh.from);
    const reg = K.s('rect', { y: AY - 26, height: 12, fill: K.c('b') }, wg)   /* full --b: a dimmed --b would read as --b-neg */, mk = K.s('line', { y1: AY - 50, y2: AY + 14, stroke: K.c('param'), 'stroke-width': 5 }, wg);
    const lDyn = C3.label(st, lab('dynamo'), 0, AY - 92, ''); lDyn.style.color = 'var(--b)';
    const lBc = C3.label(st, lab(/boundary condition/), (AX0 + AX1) / 2, AY + 40, 'center');
    const fT = ctx.at(ws.flip_at);
    const LT = { l2: C3.refL2(C3.chipOf(ctx, /Nore/, 'REFERENCE · simulations · Nore et al. 2018')) };
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: LT.l2.replace(/^simulations · /, '').replace(/\s*\(.*\)/, '') + ' · VKS simulations', at: 'wall+0.5', hold: 4.5 });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    // WORKAROUND (kit issue 2): the statement does not fit two lines at 28 px: two parts, split at its arrow
    const F = ((ctx.script.onscreen && ctx.script.onscreen.formulas) || [])[0], items = [];
    if (F) { const i = F.tex.indexOf('\\;\\to\\;'); if (i > 0) { items.push({ tex: F.tex.slice(0, i) + '\\;\\to', at: F.cue }); items.push({ tex: '\\to\\;' + F.tex.slice(i + 9), at: F.cue + '+3.0' }); } else items.push({ tex: F.tex, at: F.cue }); }
    K.formulaLayer(ctx, { label: 'Formula · R:143', items });
    window.__EVENTS__ = [{ t: +fT.toFixed(3), id: 'detent', gain_db: -20 }];
    ctx.c3 = { T, row, knobs, pic, disc, imp, sa, sb, cyl, wg, knobS, lWs, lF, lT, lRm, reg, mk, m0, m1, AX1, lDyn, lBc, fT };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c3, T = c.T, fade = C3.fadeEl;
    // split from one knob (centre) into five
    const sp = S.seg(t, T.panel, T.panel + 1.4, S.ease.inOutCubic), up = S.seg(t, T.wall, T.wall + 1.0, S.ease.inOutCubic);
    c.knobs.forEach((q, i) => { const dx = (960 - (960 + (i - 2) * 330)) * (1 - sp); const lit = t >= q.t ? 1 : 0.4;
      q.knob.root.style.transform = `translateX(${dx.toFixed(1)}px)`; q.knob.root.style.opacity = ((i === 1 ? 1 : sp) * lit).toFixed(3);
      q.lab.style.opacity = (S.seg(t, T.panel + 1.1, T.panel + 1.4, S.ease.linear) * lit).toFixed(3); q.lab.style.marginLeft = dx.toFixed(1) + 'px'; });
    c.row.style.transform = `translateY(${(-230 * up).toFixed(1)}px)`;
    // pictograms (fade at 'wall')
    const po = (a) => S.seg(t, a, a + 0.3, S.ease.linear) * (1 - S.seg(t, T.wall, T.wall + 0.4, S.ease.linear));
    c.pic.iron.style.opacity = po(T.iron); c.disc.setAttribute('fill', t >= T.iron + 0.8 ? K.c('matter-dark') : K.c('fg-2'));
    c.pic.asym.style.opacity = po(T.asym); c.imp[0].setAttribute('transform', `rotate(${(200 * t).toFixed(1)})`); c.imp[1].setAttribute('transform', `rotate(${(-420 * t).toFixed(1)})`);
    const fl = t >= T.asym + 1.2; c.sa.setAttribute('fill', K.c(fl ? 'b-neg' : 'b')); c.sb.setAttribute('fill', K.c(fl ? 'b' : 'b-neg'));
    c.pic.prec.style.opacity = po(T.prec); c.cyl.setAttribute('transform', `rotate(${(18 * Math.sin(0.9 * (t - T.prec))).toFixed(2)})`);
    // wall
    const wo = S.seg(t, T.wall + 0.4, T.wall + 0.9, S.ease.linear); c.wg.style.opacity = wo.toFixed(3); [c.lWs, c.lF, c.lT, c.lRm].forEach((e) => fade(e, t, T.wall + 0.5));
    const f = S.seg(t, c.fT, c.fT + 0.25, S.ease.inOutCubic), mv = S.seg(t, c.fT, c.fT + 1.2, S.ease.inOutCubic);
    c.knobS.setAttribute('cx', (-30 + 60 * f).toFixed(1)); const mx = c.m0 + (c.m1 - c.m0) * mv;
    c.mk.setAttribute('x1', mx.toFixed(1)); c.mk.setAttribute('x2', mx.toFixed(1)); c.reg.setAttribute('x', mx.toFixed(1)); c.reg.setAttribute('width', (c.AX1 - mx).toFixed(1));
    c.lDyn.style.left = (mx + 20) + 'px'; fade(c.lDyn, t, T.wall + 0.6); fade(c.lBc, t, c.fT + 1.0);
  },
});
</script></body></html>
