<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>03.3 Twisting rooms: the ABC flow</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch03.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch03_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 03.3 The ABC flow (L2, NIGHT, CONTEXT). Flat build (Canvas 2D, not WebGL): the velocity on one line (blue); the
   periodic box with params.streamlines.n streamlines (RK4 precomputed in setup from seeded starts, wrapped into the
   box), drawn in an orthographic view that orbits slowly (params.camera.orbit_deg_per_s), and the 26 neighbouring
   boxes as faint wireframes; on 'corkscrew' one streamline brightens and three ring-arrows show the spin around
   the direction of motion; on 'later' a faint staircase with its tier 2 glowing. */
Scene.define({
  duration: 25,
  register: 'night',
  cues: { why: 0.4, abc: 6.6, rooms: 9.0, corkscrew: 11.6, later: 17.8 },
  params: { abc: { A: 1, B: 1, C: 1 }, streamlines: { n: 40, max_segments_each: 300, width_px: 4, seed: 'ch03-abc-seeds', rk4_dt: 0.02 }, tiling: { neighbours: 26, opacity: 0.12 }, camera: { fov: 30, orbit_deg_per_s: 12 }, staircase_preview: { glow_tier: 2, opacity: 0.3, glow_s: 1.2 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C3.labOf(ctx, s, s), TAU = Math.PI * 2;
    const T = {}; ['why', 'abc', 'rooms', 'corkscrew', 'later'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    const L0 = (ctx.script.onscreen && ctx.script.onscreen.labels && ctx.script.onscreen.labels[0]) || '$\\U = (A\\sin z + C\\cos y,\\ B\\sin x + A\\cos z,\\ C\\sin y + B\\cos x)$';
    const E = K.equation(ctx, { x: 900, y: 150, size: 52, tex: '\\term{u}{\\cu{' + L0.replace(/^\$|\$$/g, '') + '}}', reveal: [['u', -0.3]] });   // base layout: the one-line formula from frame 0, underlined on 'why'
    const bu = E.box('u');
    K.pen(ctx, { kind: 'underline', box: bu, at: 'why+0.8', dur: 0.8, seed: 'oneline', offset: 4 });
    K.chip(ctx, { text: C3.chipOf(ctx, /A = B = C/, 'A = B = C = 1'), kind: 'plain', caps: false, x: bu.x + bu.w, y: bu.y + bu.h + 22, anchor: 'tr', at: 'abc-0.15' });
    // streamlines
    const { A, B, C } = P.abc, U = (x, y, z) => [A * Math.sin(z) + C * Math.cos(y), B * Math.sin(x) + A * Math.cos(z), C * Math.sin(y) + B * Math.cos(x)];
    const r = S.rng(P.streamlines.seed), dt = P.streamlines.rk4_dt, nS = P.streamlines.n, nSeg = P.streamlines.max_segments_each, lines = [];
    const md = (v) => ((v % TAU) + TAU) % TAU;
    for (let k = 0; k < nS; k++) { let p = [TAU * r(), TAU * r(), TAU * r()]; const segs = [[p.map(md)]];
      for (let i = 0; i < nSeg; i++) { const f = (q) => U(q[0], q[1], q[2]), add = (a, b, h) => a.map((v, j) => v + h * b[j]);
        const k1 = f(p), k2 = f(add(p, k1, dt / 2)), k3 = f(add(p, k2, dt / 2)), k4 = f(add(p, k3, dt));
        const np = p.map((v, j) => v + dt / 6 * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j])), w = np.map(md), last = segs[segs.length - 1], lw = last[last.length - 1];
        if (w.some((v, j) => Math.abs(v - lw[j]) > Math.PI)) segs.push([w]); else last.push(w); p = np; }
      lines.push(segs); }
    // brightest-candidate for 'corkscrew': the longest unbroken piece
    let hi = 0, hl = 0; lines.forEach((ls, i) => ls.forEach((sg) => { if (sg.length > hl) { hl = sg.length; hi = i; } }));
    const Lc = K.canvasLayer(ctx, 8, { x: 0, y: 220, w: 1920, h: 660 }, null, { reset: true });
    const lCork = K.el('div', { class: 'c3-label big c3-halo', html: K.markup(lab(/spins/)), 'data-qa': 'over-ok' }, st); Object.assign(lCork.style, { left: '120px', top: '300px', whiteSpace: 'normal', width: '640px' });
    // staircase preview
    const sv = K.svgLayer(ctx, 14), sg = K.s('g', {}, sv);
    K.staircase(ctx, { x: 120, y: 640, w: 520, h: 180, labels: false, at: 'later-0.15', out: '_tail-0.6', svg: sg });
    const sw = 520 / 5, glow = K.s('rect', { x: 120 + 2 * sw + 4, y: 640, width: sw - 8, height: 180, fill: 'none', stroke: K.c('u'), 'stroke-width': 4 }, sv);
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    // WORKAROUND (kit issue 2): the statement does not fit two lines at 28 px; shown in two parts split at its \qquad
    const F = ((ctx.script.onscreen && ctx.script.onscreen.formulas) || [])[0], items = [];
    if (F) { const i = F.tex.indexOf('\\qquad'); if (i > 0) { items.push({ tex: F.tex.slice(0, i), at: F.cue }); items.push({ tex: F.tex.slice(i + 7), at: F.cue + '+3.0' }); } else items.push({ tex: F.tex, at: F.cue }); }
    K.formulaLayer(ctx, { label: 'Formula · R §E3 setup, P3 Example 5.5', items });
    ctx.c3 = { T, lines, hi, Lc, lCork, sg, glow, TAU };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, P = ctx.params, c = ctx.c3, T = c.T, g = c.Lc.g, TAU = c.TAU;
    g.clearRect(0, 0, 1920, 660);
    const on = S.seg(t, T.rooms, T.rooms + 0.5, S.ease.linear);
    if (on > 0) {
      const th = (P.camera.orbit_deg_per_s * (t - T.rooms) + 30) * Math.PI / 180, tilt = 0.42, sc = 52, CX = 1200, CY = 285;
      const pr = (x, y, z) => { const X = x - Math.PI, Y = y - Math.PI, Z = z - Math.PI; const xr = X * Math.cos(th) - Y * Math.sin(th), yr = X * Math.sin(th) + Y * Math.cos(th);
        return [CX + sc * xr, CY - sc * (Z * Math.cos(tilt) - yr * Math.sin(tilt))]; };
      const edges = [[0, 1], [1, 3], [3, 2], [2, 0], [4, 5], [5, 7], [7, 6], [6, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
      const corner = (i, o) => [(i & 1 ? TAU : 0) + o[0], (i & 2 ? TAU : 0) + o[1], (i & 4 ? TAU : 0) + o[2]];
      g.lineWidth = 2;
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) for (let d = -1; d <= 1; d++) {
        const o = [a * TAU, b * TAU, d * TAU], centre = !a && !b && !d, far = Math.abs(a) + Math.abs(b) + Math.abs(d);
        g.strokeStyle = centre ? K.rgba(K.c('infra'), on) : K.rgba(K.c('infra'), on * P.tiling.opacity * (far === 1 ? 1 : far === 2 ? 0.6 : 0.35));
        g.beginPath(); edges.forEach(([i, j]) => { const p = pr(...corner(i, o)), q = pr(...corner(j, o)); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); }); g.stroke(); }
      const grow = S.seg(t, T.rooms + 0.3, T.rooms + 2.3, S.ease.inOutSine), ck = S.seg(t, T.corkscrew, T.corkscrew + 0.5, S.ease.linear);
      g.lineCap = 'round'; g.lineJoin = 'round';
      c.lines.forEach((segs, i) => { const hi = i === c.hi; g.strokeStyle = K.rgba(K.c('u'), on * (hi ? 1 : 1 - 0.65 * ck)); g.lineWidth = hi ? P.streamlines.width_px + 2 * ck : P.streamlines.width_px * 0.75;
        let n = 0; const tot = segs.reduce((s, q) => s + q.length, 0), lim = tot * grow; g.beginPath();
        segs.forEach((sg) => { sg.forEach((p, k) => { if (n++ > lim) return; const q = pr(...p); if (k) g.lineTo(q[0], q[1]); else g.moveTo(q[0], q[1]); }); }); g.stroke(); });
      // ring-arrows along the bright streamline
      if (ck > 0) { const sg = c.lines[c.hi].reduce((a, b) => (b.length > a.length ? b : a)); g.strokeStyle = K.rgba(K.c('chalk'), ck); g.lineWidth = 3;
        [0.25, 0.5, 0.75].forEach((f, k) => { const i = Math.floor(f * (sg.length - 2)), p = pr(...sg[i]), q = pr(...sg[i + 1]), ang = Math.atan2(q[1] - p[1], q[0] - p[0]), ph = 3 * (t - T.corkscrew) + k;
          g.save(); g.translate(p[0], p[1]); g.rotate(ang); g.beginPath(); g.ellipse(0, 0, 8, 22, 0, ph, ph + 4.6); g.stroke();
          const ex = 8 * Math.cos(ph + 4.6), ey = 22 * Math.sin(ph + 4.6); g.beginPath(); g.arc(ex, ey, 4, 0, TAU); g.fillStyle = K.rgba(K.c('chalk'), ck); g.fill(); g.restore(); }); }
    }
    C3.fadeEl(c.lCork, t, T.corkscrew + 0.4);
    c.glow.style.opacity = (Math.sin(Math.PI * S.seg(t, T.later + 0.5, T.later + 0.5 + P.staircase_preview.glow_s, S.ease.linear))).toFixed(3);
    c.sg.style.opacity = P.staircase_preview.opacity;
  },
});
</script></body></html>
