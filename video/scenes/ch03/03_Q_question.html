<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ch03.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch03.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch03_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* ch03.Q (question card, no claim, no badge). Everything on the card from the script's "question". Behind it at
   params.backdrop.opacity: two green axes, one with params.backdrop.even_dots evenly spaced dots, one with the same
   number packed in threes around the three thresholds of data/e3_growth.json, with the windows faintly shaded. */
Scene.define({
  duration: 9.4,
  register: 'night',
  cues: { q: 0.5 },
  data: { e3: 'data/e3_growth.json' },
  params: { backdrop: { opacity: 0.12, even_dots: 9, packed_dots_per_threshold: 3 } },
  setup(ctx) {
    const K = Kit, B = ctx.params.backdrop, D = ctx.data.e3, svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: B.opacity }, svg);
    const xs = D.x.values, lo = xs[0], hi = xs[xs.length - 1], X = (v) => 140 + 1640 * (v - lo) / (hi - lo), th = D.thresholds;
    [[th[0], th[1]], [th[2], hi]].forEach(([a, b]) => K.s('rect', { x: X(a), y: 820, width: X(b) - X(a), height: 50, fill: K.c('param'), opacity: 0.5 }, bg));
    [120, 845].forEach((y) => K.s('line', { x1: 140, x2: 1780, y1: y, y2: y, stroke: K.c('param'), 'stroke-width': 6 }, bg));
    for (let i = 0; i < B.even_dots; i++) K.s('circle', { cx: X(lo + (hi - lo) * (i + 0.5) / B.even_dots), cy: 120, r: 14, fill: K.c('param') }, bg);
    th.forEach((v) => { for (let k = 0; k < B.packed_dots_per_threshold; k++) K.s('circle', { cx: X(v) + (k - (B.packed_dots_per_threshold - 1) / 2) * 34, cy: 845, r: 14, fill: K.c('param') }, bg); });
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'ch03', category: 'runs', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-6 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
