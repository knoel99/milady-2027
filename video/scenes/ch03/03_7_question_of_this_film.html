<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>03.7 The question of this film</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch03.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch03_kit.js"></script>
<style>
  .c3-card { position: absolute; top: 360px; width: 520px; height: 340px; box-sizing: border-box; border: 3px solid var(--fg-2); border-radius: 14px; background: var(--panel); z-index: 20; transform-origin: 50% 0; }
  .c3-card .tx { position: absolute; left: 26px; right: 26px; top: 150px; font-size: 34px; line-height: 1.25; font-weight: 500; color: var(--fg); }
  .c3-card .n { position: absolute; left: 22px; top: 14px; font: 600 40px "Inter Display"; color: var(--fg-2); }
  .c3-card .box { position: absolute; right: 18px; top: 18px; width: 30px; height: 30px; border: 3px solid var(--fg-2); border-radius: 4px; }
  .c3-card .w { opacity: 0; }
  .c3-head { position: absolute; left: 0; right: 0; top: 262px; text-align: center; font: 600 60px "Inter Display"; color: var(--fg); z-index: 20; }
</style>
</head><body><div id="stage"></div>
<script>
/* 03.7 The question of this film (L2, NIGHT, PLANNED from 'map'). The 03.6 dots band at the top; project context in
   lower-thirds (params.lower_thirds); the heading and three promise cards (params.cards; text typed word by word on
   each sentence's timing; icons: violet cloud, a card beside an amber stack, a needle that flips); on 'map' the cards
   go to a row at the top (text fades), the five-tier staircase with params.staircase.labels, tier 2 flashes blue,
   'start here'; on 'honest' the disclaimer lower-third to the end and the staircase dims. */
Scene.define({
  duration: 50,
  register: 'night',
  cues: { gaps: 0.4, asks: 3.0, one: 6.2, two: 12.2, three: 19.0, map: 23.4, honest: 31.2 },
  params: { lower_thirds: [], heading: 'The study behind this film asks:', cards: [], staircase: { labels: ['three numbers', 'a flat sheet', 'a periodic box', 'the VKS cylinder', 'a precessing cylinder'], start_label: 'start here' } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C3.labOf(ctx, s, s);
    const T = {}; ['gaps', 'asks', 'one', 'two', 'three', 'map', 'honest'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    const svg = K.svgLayer(ctx, 12);
    // dots band (03.6), small, at the top
    const band = K.s('g', {}, svg); K.s('line', { x1: 560, x2: 1360, y1: 170, y2: 170, stroke: K.c('param'), 'stroke-width': 3 }, band);
    [0.12, 0.34, 0.41, 0.83].forEach((f) => K.s('circle', { cx: 560 + 800 * f, cy: 170, r: 8, fill: K.c('param') }, band));
    [[0.12, 0.34], [0.41, 0.83]].forEach(([a, b]) => { const q = K.s('text', { x: 560 + 800 * (a + b) / 2, y: 150, 'text-anchor': 'middle', class: 'kt-label' }, band, '?'); q.style.fill = K.c('chalk'); });
    (P.lower_thirds || []).forEach((L) => K.lowerThird(ctx, { kind: L.kind, l1: L.l1, l2: L.l2, at: L.at, ...(L.hold === 'to _tail' ? { out: '_tail' } : { hold: L.hold }) }));
    const head = K.el('div', { class: 'c3-head' }, st, P.heading);
    // cards
    const CX = [120, 700, 1280], sens = ctx.script.sentences || [];
    const cards = (P.cards.length ? P.cards : [{ n: 1, text: '…', icon: 'cloud', cue: 'one' }, { n: 2, text: '…', icon: 'card-and-stack', cue: 'two' }, { n: 3, text: '…', icon: 'needle', cue: 'three' }]).map((cd, i) => {
      const e = K.el('div', { class: 'c3-card' }, st); e.style.left = CX[i] + 'px'; K.el('div', { class: 'n' }, e, String(cd.n)); K.el('div', { class: 'box' }, e);
      // words with their markup class carried across words ({param}…{/})
      const tx = K.el('div', { class: 'tx' }, e); let cls = ''; const ws = [];
      cd.text.split(/\s+/).forEach((w) => { let m; let x = w; while ((m = x.match(/\{(u|b|param|model|metric)\}/))) { cls = 'k-' + m[1]; x = x.replace(m[0], ''); }
        const close = x.includes('{/}'); x = x.replace('{/}', ''); const sp = K.el('span', { class: 'w ' + cls }, tx, x + ' '); ws.push(sp); if (close) cls = ''; });
      const se = sens.find((s) => s.cue === cd.cue); const a = ctx.at(cd.cue) - 0.15, b = se ? se.end : a + 4;
      const isvg = K.s('svg', { width: 520, height: 140, style: 'position:absolute;left:0;top:0;overflow:visible' }, e), ig = K.s('g', { transform: 'translate(260 80)' }, isvg);
      let anim = null;
      if (cd.icon === 'cloud') { const r = S.rng('cl'), pts = Array.from({ length: 120 }, () => { const u = 6.283 * r(), rr = 50 * Math.sqrt(r()); return [Math.cos(u) * rr * 1.6, Math.sin(u) * rr * 0.9, 6.283 * r()]; });
        const ds = pts.map(() => K.s('circle', { r: 2.6, fill: K.c('model') }, ig)); anim = (t) => ds.forEach((d, k) => { const [x, y, ph] = pts[k], s = 1 + 0.1 * Math.sin(1.3 * t + ph); d.setAttribute('cx', (x * s).toFixed(1)); d.setAttribute('cy', (y * s).toFixed(1)); }); }
      if (cd.icon === 'card-and-stack') { K.s('rect', { x: -110, y: -40, width: 60, height: 80, rx: 6, fill: K.c('matter-dark'), stroke: K.c('fg-2'), 'stroke-width': 2 }, ig);
        for (let k = 0; k < 6; k++) K.s('rect', { x: 20 + 4 * k, y: -40 - 4 * k, width: 60, height: 80, rx: 6, fill: K.c('panel'), stroke: K.c('metric'), 'stroke-width': 2 }, ig); }
      let nd = null; if (cd.icon === 'needle') { K.s('circle', { r: 50, fill: K.c('panel'), stroke: K.c('matter'), 'stroke-width': 3 }, ig); nd = K.s('g', {}, ig); K.s('path', { d: 'M0,-40 L8,0 L-8,0 Z', fill: K.c('b') }, nd); K.s('path', { d: 'M0,40 L8,0 L-8,0 Z', fill: K.c('matter') }, nd); }
      return { e, tx, ws, a, b, anim, nd, i };
    });
    // staircase (five grey tiers) with the script's labels
    const SX = 360, SY = 300, SW = 1200, SH = 330, sgv = K.svgLayer(ctx, 14), sg = K.s('g', {}, sgv);
    K.staircase(ctx, { x: SX, y: SY, w: SW, h: SH, labels: false, at: 'map+0.4', svg: sg });
    const tl = P.staircase.labels.map((s, i) => { const e = C3.label(st, s, SX + SW / 10 + i * SW / 5, SY + SH + 24, 'center'); e.style.whiteSpace = 'normal'; e.style.width = (SW / 5 - 8) + 'px'; return e; });
    const sw5 = SW / 5, sh = Math.max(12, (SH - 60 - 64) / 4), t2 = K.s('rect', { x: SX + 2 * sw5 + 4, y: SY + SH - 64 - 2 * sh, width: sw5 - 8, height: 64 + 2 * sh, fill: K.rgba(K.c('u'), 0.25), stroke: K.c('u'), 'stroke-width': 3 }, sgv);
    K.pen(ctx, { kind: 'arrow', from: [SX - 120, SY + SH - 160], to: [SX + 30, SY + SH - 40], bend: -0.2, at: 'map+1.6', dur: 0.5, seed: 'start' });
    const lSt = C3.label(st, P.staircase.start_label, SX - 120, SY + SH - 214, 'center'); lSt.style.color = 'var(--chalk)';
    K.badge(ctx, { kind: 'PLANNED', note: 'PhD proposal · five tiers', at: 'map-0.15' });
    window.__EVENTS__ = [{ t: +(ctx.at('three') + 0.8).toFixed(3), id: 'needle', gain_db: -22 }];
    ctx.c3 = { T, band, head, cards, sg, tl, t2, lSt };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c3, T = c.T, fade = C3.fadeEl;
    c.band.style.opacity = (S.seg(t, -0.4, -0.1, S.ease.linear) * (1 - 0.7 * S.seg(t, T.asks, T.asks + 0.5, S.ease.linear)) * (1 - S.seg(t, T.map, T.map + 0.4, S.ease.linear))).toFixed(3);
    fade(c.head, t, T.asks, T.map);
    const mp = S.seg(t, T.map, T.map + 1.0, S.ease.inOutCubic);
    c.cards.forEach((q) => { const p = S.seg(t, q.a, q.a + 0.4, S.ease.outCubic); q.e.style.opacity = p.toFixed(3); K.show(q.e, p > 0);
      const s = 1 - 0.55 * mp, ty = (80 - 360) * mp; q.e.style.transform = `translate(${((960 - (parseFloat(q.e.style.left) + 260)) * 0.35 * mp).toFixed(1)}px, ${(ty + 20 * (1 - p)).toFixed(1)}px) scale(${s.toFixed(3)})`;
      const n = q.ws.length; q.ws.forEach((w, k) => { w.style.opacity = t >= q.a + 0.3 + (q.b - q.a - 0.3) * k / n ? 1 : 0; });
      q.tx.style.opacity = (1 - S.seg(t, T.map - 0.1, T.map + 0.3, S.ease.linear)).toFixed(3); K.show(q.tx, t < T.map + 0.3);
      q.e.querySelectorAll('.n').forEach((e) => { K.show(e, t < T.map + 0.3); });
      if (q.anim) q.anim(t); if (q.nd) q.nd.setAttribute('transform', `rotate(${(180 * S.spring((t - q.a - 0.95) / 0.9, 0.03)).toFixed(2)})`); });
    const dimS = 1 - 0.4 * S.seg(t, T.honest, T.honest + 0.5, S.ease.linear);
    c.sg.style.opacity = dimS.toFixed(3); c.tl.forEach((e, i) => { fade(e, t, T.map + 0.5 + 0.08 * i); e.style.opacity = (+e.style.opacity * dimS).toFixed(3); });
    c.t2.style.opacity = (0.9 * Math.sin(Math.PI * S.seg(t, T.map + 1.0, T.map + 2.0, S.ease.linear))).toFixed(3);
    fade(c.lSt, t, T.map + 1.9);
  },
});
</script></body></html>
