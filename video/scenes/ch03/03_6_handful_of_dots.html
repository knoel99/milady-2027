<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>03.6 A handful of dots</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch03.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>

</head><body><div id="stage"></div>
<script>
/* 03.6 A handful of dots (L2, NIGHT, CONTEXT, SCHEMATIC). Five small knobs collapse into one green axis
   (params.axis); four dots land at params.dots; each grows a stack of grey file slabs (params.stack); a short
   seeded polarity strip (params.barcode.flips sign changes) slides out above the second stack; chalk braces and
   question marks over the gaps, stacks dimmed. Sizes only on the formula layer (order of magnitude). */
Scene.define({
  duration: 25,
  register: 'night',
  cues: { costly: 0.4, dots: 4.4, stack: 7.4, few: 13.2, gaps: 15.6 },
  params: { axis: { x0: 200, x1: 1700, y: 700, label: 'knob settings' }, dots: [0.12, 0.34, 0.41, 0.83], stack: { slabs: 14, slab_w: 120, slab_h: 14, top_y: 230 }, barcode: { seed: 'ch03-few-flips', flips: 3, length_px: 420 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C3.labOf(ctx, s, s), A = P.axis;
    const T = {}; ['costly', 'dots', 'stack', 'few', 'gaps'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    const svg = K.svgLayer(ctx, 12), g = K.s('g', {}, svg);
    const knobs = [0, 1, 2, 3, 4].map((i) => { const e = K.s('g', {}, g); K.s('circle', { r: 30, fill: K.c('panel'), stroke: K.c('matter'), 'stroke-width': 3 }, e); K.s('line', { x1: 0, y1: 0, x2: 0, y2: -24, stroke: K.c('param'), 'stroke-width': 5 }, e); return e; });
    const axis = K.s('line', { x1: A.x0, x2: A.x1, y1: A.y, y2: A.y, stroke: K.c('param'), 'stroke-width': 4 }, g);
    const shim = K.s('line', { x1: A.x0, x2: A.x0 + 160, y1: A.y, y2: A.y, stroke: K.c('fg-2'), 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
    const lAx = C3.label(st, lab(A.label), A.x0, A.y + 18, ''); lAx.style.color = 'var(--param)';
    const X = P.dots.map((f) => A.x0 + f * (A.x1 - A.x0)), SK = P.stack;
    const gapMin = Math.min(...X.slice(1).map((x, i) => x - X[i])), sw = Math.min(SK.slab_w, gapMin - 14);   // stacks never touch
    const stacks = X.map((x) => { const sg = K.s('g', {}, g); const sl = Array.from({ length: SK.slabs }, (_, k) => K.s('rect', { x: x - sw / 2 + 2 * (k % 2), width: sw, height: SK.slab_h, rx: 2, fill: K.c('matter-dark'), stroke: K.c('infra'), 'stroke-width': 2 }, sg)); return { sg, sl }; });
    const dots = X.map((x) => K.s('circle', { cx: x, r: 13, fill: K.c('param') }, g));
    const lRun = C3.label(st, lab(/terabytes/), (X[2] + X[3]) / 2, 330, 'big center');
    const chO = K.chip(ctx, { text: C3.chipOf(ctx, /order-of-magnitude/, 'order-of-magnitude estimate · 384³ grid'), kind: 'plain', caps: false, maxWidth: 460, x: (X[2] + X[3]) / 2, y: 420, anchor: 'c', at: 'stack+1.6', out: 'gaps' }); void chO;
    // barcode above the second stack: params.barcode.flips sign changes at seeded positions
    const B = P.barcode, r = S.rng(B.seed), cuts = Array.from({ length: B.flips }, () => 0.1 + 0.8 * r()).sort((a, b) => a - b);
    const segs = []; let a0 = 0, sg0 = 1; [...cuts, 1].forEach((b) => { segs.push({ a: a0, b, s: sg0 }); a0 = b; sg0 = -sg0; });
    K.barcode(ctx, { box: { x: X[1] - 20, y: 170, w: B.length_px, h: 22 }, segments: segs, domain: [0, 1], at: 'few-0.15', dur: 1.0 });
    const lFew = C3.label(st, lab(/few flips/), X[1] - 20, 116, '');
    K.chip(ctx, { text: 'SCHEMATIC', kind: 'schematic', x: X[1] + B.length_px + 0, y: 158, at: 'few+0.3' });
    // braces and question marks over the gaps (above the axis, between the stacks)
    const qs = [];
    X.slice(1).forEach((x, i) => { const xa = X[i] + sw / 2 + 8, xb = x - sw / 2 - 8; if (xb - xa < 30) return;
      K.pen(ctx, { kind: 'brace', box: { x: xa, y: A.y - 70, w: xb - xa, h: 2 }, at: `gaps+${(0.2 * i).toFixed(1)}`, dur: 0.4, seed: 'gap' + i });
      const q = K.s('text', { x: (xa + xb) / 2, y: A.y - 100, 'text-anchor': 'middle', class: 'kt-big' }, svg, '?'); q.style.fill = K.c('chalk'); q.style.fontSize = '64px'; qs.push({ q, t: T.gaps + 0.2 * i + 0.3 }); });
    const lGap = C3.label(st, lab(/between the dots/), (X[2] + X[3]) / 2, A.y - 280, 'big center');
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    // WORKAROUND (kit issue 2): the statement does not fit two lines at 28 px: two parts, split at its ';'
    const F = ((ctx.script.onscreen && ctx.script.onscreen.formulas) || [])[0], items = [];
    if (F) { const i = F.tex.indexOf(';'); if (i > 0) { items.push({ tex: F.tex.slice(0, i), at: F.cue }); items.push({ tex: F.tex.slice(i + 1).replace(/^(\\\s*)+/, ''), at: F.cue + '+3.0' }); } else items.push({ tex: F.tex, at: F.cue }); }
    K.formulaLayer(ctx, { label: 'Formula · T §3.5 (order of magnitude)', items });
    window.__EVENTS__ = X.map((x, i) => ({ t: +(T.dots + 0.25 * i + 0.3).toFixed(3), id: 'pop', gain_db: -26 }));
    ctx.c3 = { T, knobs, axis, shim, lAx, X, stacks, dots, lRun, lFew, qs, lGap, SK, A };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.c3, T = c.T, A = c.A, fade = C3.fadeEl;
    // knobs collapse onto the axis
    const m = S.seg(t, T.costly, T.costly + 1.2, S.ease.inOutCubic);
    c.knobs.forEach((k, i) => { const x0 = 960 + (i - 2) * 300, y0 = 330, x = x0 + (960 - x0) * m, y = y0 + (A.y - y0) * m, s = 1 - m;
      k.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${Math.max(0.001, s).toFixed(3)})`); k.style.opacity = (S.seg(t, -0.4, -0.1, S.ease.linear) * (1 - m)).toFixed(3); });
    const ao = S.seg(t, T.costly + 0.6, T.costly + 1.2, S.ease.linear); c.axis.style.opacity = ao; fade(c.lAx, t, T.costly + 1.0);
    const sx = (t * 160) % (A.x1 - A.x0 + 200); c.shim.setAttribute('x1', (A.x0 + sx - 200).toFixed(1)); c.shim.setAttribute('x2', (A.x0 + sx - 40).toFixed(1)); c.shim.style.opacity = (0.5 * ao).toFixed(3);
    c.dots.forEach((d, i) => { const a = T.dots + 0.25 * i, p = S.seg(t, a, a + 0.3, S.ease.outCubic); d.setAttribute('cy', (A.y - 60 * (1 - p)).toFixed(1)); d.style.opacity = p.toFixed(3); });
    const dim = 1 - 0.5 * S.seg(t, T.gaps, T.gaps + 0.5, S.ease.linear);
    c.stacks.forEach((sk, i) => { const gp = S.seg(t, T.stack + 0.1 * i, T.stack + 1.5 + 0.1 * i, S.ease.outCubic), n = Math.round(c.SK.slabs * gp), step = (A.y - 20 - c.SK.top_y) / c.SK.slabs;
      sk.sl.forEach((r, k) => { r.setAttribute('y', (A.y - 20 - (k + 1) * step).toFixed(1)); r.style.opacity = k < n ? 1 : 0; }); sk.sg.style.opacity = dim.toFixed(3); });
    fade(c.lRun, t, T.stack + 1.2, T.gaps); fade(c.lFew, t, T.few + 0.6);
    c.qs.forEach((q) => { q.q.style.opacity = S.seg(t, q.t, q.t + 0.3, S.ease.linear).toFixed(3); }); fade(c.lGap, t, T.gaps + 0.6);
  },
});
</script></body></html>
