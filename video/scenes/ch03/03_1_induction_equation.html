<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>03.1 The induction equation, term by term</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch03.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch03_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 03.1 The induction equation (L2, NIGHT, PROVED · P3 Theorem 2.1). Chapter card; two looping picture panels
   (stretch: a thread pulled by two blue arrows lengthens and brightens; smudge: a thread blurs into grey haze);
   the equation (params.eq) as a ghost, terms lit on their cues with leaders to the panels and brace labels; 'poor'
   speeds up the smudge loop once; 'whole' focuses the right-hand side and the pen joins the two terms. */
Scene.define({
  duration: 40,
  register: 'night',
  cues: { race: 3.2, eqs: 7.6, lhs: 10.4, stretch: 13.8, smudge: 19.6, poor: 24.6, whole: 26.4 },
  params: { chapter: { num: '03', title: 'The equation, the windows, and the question', level: 'L2', levelFrom: 'L2' }, eq: null, panels: { loop_s: 4.0, loop_s_poor: 2.0 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, ch = P.chapter, lab = (s) => C3.labOf(ctx, s, s);
    K.chapterCard(ctx, { num: ch.num, title: (ctx.script.onscreen && ctx.script.onscreen.title) || ch.title, level: ch.level, levelFrom: ch.levelFrom, at: -0.3, out: 'race-0.4', railHold: 3 });
    K.badge(ctx, { kind: 'PROVED', note: 'P3 Theorem 2.1', at: 'eqs-0.15' });
    const eq = P.eq || { x: 960, y: 300, size: 88, tex: '\\term{lhs}{\\frac{\\partial \\B}{\\partial t}}\\term{eq}{\;=\;}\\term{adv}{\\nabla\\times(\\U\\times\\B)}\\term{plus}{\;+\;}\\term{diff}{\\etaP\\,\\nabla^{2}\\B}', reveal: [['lhs', 'lhs'], [['eq', 'adv'], 'stretch'], [['plus', 'diff'], 'smudge']] };
    const rv = eq.reveal.map(([ids, cue]) => [ids, cue + '-0.15']);
    const E = K.equation(ctx, { x: eq.x, y: eq.y, size: eq.size, tex: eq.tex, reveal: rv, ghost: true, at: 'eqs-0.15',
      labels: [{ id: 'adv', text: lab('carried and stretched by the flow'), color: 'u', at: 'stretch+0.15' }, { id: 'diff', text: lab('diffusion'), at: 'smudge+0.15' }],
      focus: [{ ids: ['adv', 'plus', 'diff', 'eq'], at: 'whole-0.15' }] });
    // panels
    const svg = K.svgLayer(ctx, 12), PY0 = 540, PY1 = 720, LX = [300, 860], RX = [1060, 1620];
    const defs = K.s('defs', {}, svg), flt = K.s('filter', { id: 'c3blur', x: '-50%', y: '-200%', width: '200%', height: '500%' }, defs), gb = K.s('feGaussianBlur', { stdDeviation: 0 }, flt);
    const pnl = (x0, x1) => K.s('rect', { x: x0, y: PY0, width: x1 - x0, height: PY1 - PY0, rx: 10, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2 }, svg);
    const pL = K.s('g', {}, svg), pR = K.s('g', {}, svg); pnl(...LX); pnl(...RX);
    const cxL = (LX[0] + LX[1]) / 2, cy = (PY0 + PY1) / 2, cxR = (RX[0] + RX[1]) / 2;
    const thL = K.s('path', { fill: 'none', stroke: K.c('b'), 'stroke-linecap': 'round' }, pL);
    const arL = K.s('path', { fill: 'none', stroke: K.c('u'), 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, pL), arR = K.s('path', { fill: 'none', stroke: K.c('u'), 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, pL);
    const trs = Array.from({ length: 10 }, (_, i) => ({ e: K.s('circle', { r: 4, fill: K.c('u') }, pL), y: PY0 + 24 + (i % 5) * 32, s: i < 5 ? -1 : 1, ph: (i * 0.37) % 1 }));
    const halo = K.s('path', { d: `M${cxR - 180},${cy} C${cxR - 60},${cy - 40} ${cxR + 60},${cy + 40} ${cxR + 180},${cy}`, fill: 'none', stroke: K.c('matter'), 'stroke-linecap': 'round' }, pR);
    const thR = K.s('path', { d: `M${cxR - 180},${cy} C${cxR - 60},${cy - 40} ${cxR + 60},${cy + 40} ${cxR + 180},${cy}`, fill: 'none', stroke: K.c('b'), 'stroke-width': 4, filter: 'url(#c3blur)' }, pR);
    // leaders and pen marks
    const lead = K.s('g', {}, svg), mkLead = () => K.s('path', { fill: 'none', stroke: K.c('chalk'), 'stroke-width': 2, 'stroke-dasharray': '5 6' }, lead);
    const ldA = mkLead(), ldD = mkLead();
    const bA = E.box('adv'), bD = E.box('diff'), bL = E.box('lhs');
    ldA.setAttribute('d', `M${bA.x + bA.w / 2},${bA.y + bA.h + 60} L${cxL},${PY0 - 4}`); ldD.setAttribute('d', `M${bD.x + bD.w / 2},${bD.y + bD.h + 60} L${cxR},${PY0 - 4}`);
    const PENS = [];
    const tEl = (id) => ctx.stage.querySelector(`[id$="${id}"]`) || null;
    PENS.push(K.pen(ctx, { kind: 'circle', target: tEl('lhs') || undefined, box: tEl('lhs') ? undefined : bL, at: 'lhs+0.3', dur: 0.5, out: 'stretch-0.2', seed: 'lhs', pad: 30  }));
    PENS.push(K.pen(ctx, { kind: 'circle', target: tEl('adv') || undefined, box: tEl('adv') ? undefined : bA, at: 'stretch+0.6', dur: 0.5, out: 'smudge-0.2', seed: 'adv', pad: 24  }));
    PENS.push(K.pen(ctx, { kind: 'circle', target: tEl('diff') || undefined, box: tEl('diff') ? undefined : bD, at: 'smudge+0.6', dur: 0.5, out: 'poor', seed: 'diff', pad: 24  }));
    PENS.forEach((p) => p.path.setAttribute('data-qa', 'ignore'));   // QA: each circle encloses its own term (false pen-over-text)
    const ay = Math.min(bA.y, bD.y) - 40;
    K.pen(ctx, { kind: 'arrow', from: [bA.x + bA.w * 0.6, ay], to: [bD.x + bD.w * 0.4, ay], bend: 0.18, at: 'whole+0.3', dur: 0.5, seed: 'race1' });
    K.pen(ctx, { kind: 'arrow', from: [bD.x + bD.w * 0.4, ay], to: [bA.x + bA.w * 0.6, ay], bend: -0.18, at: 'whole+0.8', dur: 0.5, seed: 'race2' });
    const ch1 = C3.chipOf(ctx, /η/, 'η · magnetic diffusivity · m²/s (glossary chip)').replace(/\s*\(glossary chip\)/, '');
    K.chip(ctx, { text: ch1, kind: 'plain', caps: false, x: 1824, y: 124, anchor: 'tr', at: 'smudge+0.8', out: 'whole-0.15' });
    // WORKAROUND (kit issues 2, 4): item 1 is shown in two parts split at its \qquad (the fraction touched its second line)
    const items = []; ((ctx.script.onscreen && ctx.script.onscreen.formulas) || []).forEach((F, k) => { const i = F.tex.indexOf('\\qquad');
      if (k === 0 && i > 0) { items.push({ tex: F.tex.slice(0, i), at: F.cue }); items.push({ tex: F.tex.slice(i + 7), at: F.cue + '+3.0' }); } else items.push({ tex: F.tex, at: F.cue }); });
    K.formulaLayer(ctx, { label: 'Formula · P3 (2.1), (2.2)', items });
    const T = {}; ['race', 'eqs', 'stretch', 'smudge', 'poor', 'whole'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    ctx.c3 = { T, svg, pL, pR, thL, arL, arR, trs, halo, thR, gb, ldA, ldD, cxL, cxR, cy, PY0 };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, P = ctx.params, c = ctx.c3, T = c.T;
    const on = S.seg(t, T.race, T.race + 0.6, S.ease.outCubic); c.svg.style.opacity = on.toFixed(3); c.svg.style.transform = `translateY(${(30 * (1 - on)).toFixed(1)}px)`;
    const L = P.panels.loop_s, Lp = P.panels.loop_s_poor;
    const pulse = 1 + 0.03 * Math.sin(Math.PI * S.seg(t, T.whole + 0.3, T.whole + 0.9, S.ease.inOutSine));
    // stretch loop
    const p = (((t - T.race) % L) + L) % L / L, half = 40 + 200 * S.ease.inOutSine(p);
    c.thL.setAttribute('d', `M${c.cxL - half},${c.cy} C${c.cxL - half / 3},${c.cy - 28} ${c.cxL + half / 3},${c.cy + 28} ${c.cxL + half},${c.cy}`);
    c.thL.setAttribute('stroke-width', (3 + 3 * p).toFixed(2)); c.thL.style.opacity = (0.55 + 0.45 * p).toFixed(3);
    c.arL.setAttribute('d', `M${c.cxL - 30},${c.cy - 60} H${c.cxL - 30 - 70 - 60 * p} M${c.cxL - 86 - 60 * p},${c.cy - 72} L${c.cxL - 102 - 60 * p},${c.cy - 60} L${c.cxL - 86 - 60 * p},${c.cy - 48}`);
    c.arR.setAttribute('d', `M${c.cxL + 30},${c.cy - 60} H${c.cxL + 30 + 70 + 60 * p} M${c.cxL + 86 + 60 * p},${c.cy - 72} L${c.cxL + 102 + 60 * p},${c.cy - 60} L${c.cxL + 86 + 60 * p},${c.cy - 48}`);
    c.trs.forEach((q) => { const u = ((t / L + q.ph) % 1); q.e.setAttribute('cx', (c.cxL + q.s * (20 + 220 * u)).toFixed(1)); q.e.setAttribute('cy', q.y); q.e.style.opacity = (1 - u).toFixed(3); });
    c.pL.setAttribute('transform', `translate(${c.cxL} ${c.cy}) scale(${pulse.toFixed(4)}) translate(${-c.cxL} ${-c.cy})`);
    // smudge loop (faster for one cycle from 'poor')
    let q;
    if (t >= T.poor && t < T.poor + Lp) q = (t - T.poor) / Lp; else { const t0 = t >= T.poor + Lp ? T.poor + Lp : T.race; q = (((t - t0) % L) + L) % L / L; }
    const sq = S.ease.inOutSine(q);
    c.gb.setAttribute('stdDeviation', (8 * sq).toFixed(2)); c.thR.style.opacity = (1 - 0.65 * sq).toFixed(3);
    c.halo.setAttribute('stroke-width', (6 + 40 * sq).toFixed(1)); c.halo.style.opacity = (0.35 * sq).toFixed(3);
    c.pR.setAttribute('transform', `translate(${c.cxR} ${c.cy}) scale(${pulse.toFixed(4)}) translate(${-c.cxR} ${-c.cy})`);
    // leaders 1.5 s after each term
    c.ldA.style.opacity = (S.seg(t, T.stretch + 0.2, T.stretch + 0.4, S.ease.linear) * (1 - S.seg(t, T.stretch + 1.7, T.stretch + 2.0, S.ease.linear))).toFixed(3);
    c.ldD.style.opacity = (S.seg(t, T.smudge + 0.2, T.smudge + 0.4, S.ease.linear) * (1 - S.seg(t, T.smudge + 1.7, T.smudge + 2.0, S.ease.linear))).toFixed(3);
  },
});
</script></body></html>
