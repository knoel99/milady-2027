<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>03.4 Predict: once on, always on?</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch03.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch03_kit.js"></script>
<style>
  .c3-pc { position: absolute; left: 560px; top: 90px; width: 800px; box-sizing: border-box; padding: 20px 30px 24px; background: var(--panel); border: 2px solid var(--fg-2); border-radius: 12px; z-index: 58; }
  .c3-pc .k, .c3-mini .k { font-family: "JetBrains Mono"; font-size: 28px; letter-spacing: .14em; color: var(--chalk); }
  .c3-pc .q { margin-top: 6px; font-family: "Inter Display"; font-weight: 600; font-size: 44px; color: var(--fg); }
  .c3-pc .row, .c3-mini { display: flex; gap: 22px; align-items: center; }
  .c3-pc .row { margin-top: 16px; }
  .c3-btn { padding: 6px 20px 8px; border: 2px solid var(--muted); border-radius: 8px; font-size: 30px; color: var(--fg-2); white-space: nowrap; }
  .c3-btn.lit { border-color: var(--fg); color: var(--fg); background: var(--grid); }
  .c3-mini { position: absolute; left: 96px; top: 44px; z-index: 58; }
  .c3-mini .c3-btn { font-size: 28px; padding: 2px 14px 4px; }
</style>
</head><body><div id="stage"></div>
<script>
/* 03.4 Once on, always on? (L2, NIGHT, MEASURED · E3 · 32³). Set-up: the twisting box icon and the Rm knob
   (params.knob.keys), a thread whose blur shrinks as the knob turns. PREDICT (held by the script). Answer: the
   card becomes a one-line reminder top-left; Kit.plot (params.plot) of s(Rm) at 32³ (data/e3_growth.json
   series[0], legend params.series) drawn on as the narration reaches each threshold (data thresholds); three points
   below the scale as arrows; green windows; four dominant-mode insets (data/e3_modes.json slice_z0, one vmax);
   published brackets (published_windows.bounds). Zero crossings export 'tick' page events. */
Scene.define({
  duration: 45,
  register: 'night',
  cues: { knob: 0.4, helps: 4.6, predict: 7.4, draw: 12.4, on: 15.6, off: 20.4, again: 23.0, windows: 25.8, bench: 31.4 },
  data: { e3: 'data/e3_growth.json', modes: 'data/e3_modes.json' },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C3.labOf(ctx, s, s), D = ctx.data.e3, Mo = ctx.data.modes.modes;
    const T = {}; ['knob', 'helps', 'predict', 'draw', 'on', 'off', 'again', 'windows', 'bench'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    const svg = K.svgLayer(ctx, 12);
    // P1: box icon + knob + blur thread
    const icon = K.s('g', { transform: 'translate(420 420)' }, svg);
    K.s('path', { d: 'M-70,-40 l70,-34 l70,34 v80 l-70,34 l-70,-34 Z M-70,-40 l70,34 l70,-34 M0,-6 v114', fill: 'none', stroke: K.c('matter'), 'stroke-width': 3 }, icon);
    [-30, 0, 30].forEach((dx, i) => { let d = ''; for (let k = 0; k <= 24; k++) { const u = k / 24; d += `${k ? 'L' : 'M'}${(dx + 8 * Math.sin(u * 4 * Math.PI)).toFixed(1)},${(-40 + 90 * u).toFixed(1)}`; } K.s('path', { d, fill: 'none', stroke: K.c('u'), 'stroke-width': 3 }, icon); void i; });
    const kn = P.knob || { label: 'Rm', keys: [{ at: 'knob+0.4', v: 0.25 }, { at: 'helps', v: 0.55, dur: 1.6 }] };
    const knob = K.knob(ctx, { x: 760, y: 430, r: 90, min: 0, max: 1, label: kn.label, showValue: false, labelDy: 150, at: 'knob-0.15', out: 'draw', keys: [{ at: 'knob-0.15', v: 0.08 }, ...kn.keys] });
    const defs = K.s('defs', {}, svg), fl = K.s('filter', { id: 'c3b4', x: '-50%', y: '-300%', width: '200%', height: '700%' }, defs), gb = K.s('feGaussianBlur', { stdDeviation: 6 }, fl);
    const thr = K.s('path', { d: 'M660,250 C720,220 800,280 860,250', fill: 'none', stroke: K.c('b'), 'stroke-width': 4, filter: 'url(#c3b4)' }, svg);
    // P2: PREDICT card, then a one-line reminder
    const pr = P.predict || { title: 'PREDICT', question: 'Once on, always on?', A: 'A · on for good', B: 'B · on, then off again' };
    const pc = K.el('div', { class: 'c3-pc' }, st); K.el('div', { class: 'k' }, pc, pr.title); K.el('div', { class: 'q' }, pc, pr.question);
    const row = K.el('div', { class: 'row' }, pc); K.el('div', { class: 'c3-btn' }, row, pr.A); K.el('div', { class: 'c3-btn' }, row, pr.B);
    const mini = K.el('div', { class: 'c3-mini' }, st); K.el('div', { class: 'k' }, mini, pr.title); K.el('div', { class: 'c3-btn' }, mini, pr.A); const mB = K.el('div', { class: 'c3-btn' }, mini, pr.B);
    // P3: plot
    const pp = P.plot || { box: { x0: 220, x1: 1260, y0: 220, y1: 560 }, x: { label: 'Rm, magnetic Reynolds number', min: 0, max: 31, ticks: [0, 10, 20, 30], param: true }, y: { label: 's, growth rate', min: -0.012, max: 0.012, ticks: [-0.01, 0, 0.01] } };
    const PL = K.plot(ctx, { box: pp.box, at: 'draw-0.15', x: pp.x, y: pp.y });
    const xs = D.x.values, ys = D.series[0].y, th = D.thresholds, ymin = pp.y.min;
    K.s('line', { x1: pp.box.x0, x2: pp.box.x1, y1: PL.sy(0), y2: PL.sy(0), stroke: K.c('fg-2'), 'stroke-width': 2, 'stroke-dasharray': '8 8' }, PL.root);
    const cid = 'c3clip4', cr = K.s('rect', { x: pp.box.x0 - 10, y: pp.box.y0 - 10, width: 0, height: pp.box.y1 - pp.box.y0 + 20 }, K.s('clipPath', { id: cid }, K.s('defs', {}, PL.root)));
    let d = ''; xs.forEach((x, i) => { if (ys[i] < ymin) return; d += `${d ? 'L' : 'M'}${PL.sx(x).toFixed(1)},${PL.sy(ys[i]).toFixed(1)}`; });
    K.s('path', { d, fill: 'none', stroke: K.c('b'), 'stroke-width': 4, 'clip-path': `url(#${cid})` }, PL.root);
    const dots = xs.map((x, i) => { const below = ys[i] < ymin, e = below ? K.s('path', { d: `M${PL.sx(x)},${pp.box.y1 - 30} v22 M${PL.sx(x) - 8},${pp.box.y1 - 16} L${PL.sx(x)},${pp.box.y1 - 6} L${PL.sx(x) + 8},${pp.box.y1 - 16}`, fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, PL.root)
      : K.s('circle', { cx: PL.sx(x), cy: PL.sy(ys[i]), r: 7, fill: K.c('b') }, PL.root); return { e, x, below }; });
    const leg = K.s('text', { x: pp.box.x1, y: pp.box.y0 - 34, 'text-anchor': 'end', class: 'kt-tick' }, PL.root, P.series || 's, 32³'); leg.style.fill = K.c('b');
    // head: Rm reached by the drawing at time t (keyed to the sentences)
    const xmin = xs[0], xmax = xs[xs.length - 1], keys = [[T.draw + 0.3, xmin], [T.on + 0.6, th[0]], [T.off + 0.4, th[1]], [T.again + 0.6, xmax]];
    const head = (t) => { if (t <= keys[0][0]) return xmin - 1; for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const [a, xa] = keys[i - 1], [b, xb] = keys[i]; return xa + (xb - xa) * S.ease.inOutSine((t - a) / (b - a)); } return xmax + 1; };
    const tOfX = (x) => { for (let i = 1; i < keys.length; i++) { const [a, xa] = keys[i - 1], [b, xb] = keys[i]; if (x <= xb) { const p = (x - xa) / (xb - xa); return a + (b - a) * Math.acos(1 - 2 * Math.max(0, Math.min(1, p))) / Math.PI; } } return keys[keys.length - 1][0]; };
    window.__EVENTS__ = th.map((x) => ({ t: +tOfX(x).toFixed(3), id: 'tick', gain_db: -20 }));
    // bands and labels
    const TL = P.threshold_labels || ['on', 'off', 'on again'];
    PL.band({ x: [th[0], th[1]], kind: 'window', at: 'on-0.15' }); PL.band({ x: [th[2], pp.x.max], kind: 'window', at: 'again-0.15' });
    const lOn = C3.label(st, TL[0], PL.sx(th[0]) + 8, pp.box.y0 + 8, ''), lOff = C3.label(st, TL[1], PL.sx(th[1]) - 8, pp.box.y0 + 50, 'right'), lAg = C3.label(st, TL[2], PL.sx(th[2]) + 8, pp.box.y0 + 8, '');
    [lOn, lOff, lAg].forEach((e) => { e.style.color = 'var(--param)'; e.style.fontSize = '28px'; e.classList.add('c3-halo'); });
    lAg.style.left = (PL.sx(pp.x.max) - 6) + 'px'; lAg.classList.add('right');
    K.chip(ctx, { text: C3.chipOf(ctx, /below the scale/, '3 points below the scale: Rm 2, 4, 6'), kind: 'plain', caps: false, x: pp.box.x0 + 20, y: pp.box.y1 - 74, at: 'draw+0.8' });
    const lWin = C3.label(st, lab('windows, not one threshold'), pp.box.x0, 112, 'big');
    // insets (2 x 2), shared vmax
    const ig = P.inset_grid || { x0: 1380, y0: 220, size: 190, gap: 34 }, ins = P.insets || [{ key: 'Rm8', label: 'Rm 8' }, { key: 'Rm12', label: 'Rm 12' }, { key: 'Rm16', label: 'Rm 16' }, { key: 'Rm20', label: 'Rm 20' }];
    let vmax = 0; ins.forEach((q) => { const g = S.f32(Mo[q.key].slice_z0); for (const v of g) vmax = Math.max(vmax, Math.abs(v)); });
    const leads = K.s('g', {}, svg);
    const insL = ins.map((q, i) => { const x = ig.x0 + (i % 2) * (ig.size + ig.gap), y = ig.y0 + 36 + Math.floor(i / 2) * (ig.size + ig.gap + 36);
      K.fieldMap(ctx, { grid: Mo[q.key].slice_z0, kind: 'b', vmax, x, y, w: ig.size, h: ig.size, at: `windows+${(0.3 * i).toFixed(1)}` });
      const l = C3.label(st, q.label, x, y - 40, ''); l.style.fontSize = '28px';
      const rm = Mo[q.key].Rm, j = xs.indexOf(rm), yy = j >= 0 ? ys[j] : 0;
      const ld = K.s('path', { d: `M${PL.sx(rm)},${PL.sy(yy)} L${x},${y + ig.size / 2}`, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 1.5, 'stroke-dasharray': '4 6' }, leads);
      return { l, ld, t: T.windows + 0.3 * i }; });
    const lCap = C3.label(st, lab(/dominant mode/), ig.x0 + 2 * ig.size + ig.gap, ig.y0 - 96, 'mono right'); lCap.style.fontSize = '28px';
    // published brackets
    const pb = D.published_windows.bounds, brg = K.s('g', {}, svg), by = pp.box.y0 - 8;
    [[pb[0], pb[1], true], [pb[2], pp.x.max, false]].forEach(([a, b, closed]) => K.s('path', { d: `M${PL.sx(a)},${by + 10} V${by} H${PL.sx(b)}${closed ? ' V' + (by + 10) : ''}`, fill: 'none', stroke: K.c('muted'), 'stroke-width': 3 }, brg));
    const lPub = C3.label(st, lab('published'), PL.sx(pb[0]), by - 44, 'mono'); lPub.style.fontSize = '28px';
    K.chip(ctx, { text: C3.chipOf(ctx, /test bench/, 'kinematic test bench · no generative model in E3'), kind: 'plain', caps: false, maxWidth: 760, x: pp.box.x0, y: 712, at: 'bench+0.4' });
    K.lowerThird(ctx, { kind: 'source', data: D, at: 'draw+0.5', hold: 5 });
    K.badge(ctx, { kind: 'MEASURED', note: 'E3 · 32³ · 24 runs', at: -0.3 });
    // WORKAROUND (kit issue 2): the statement does not fit two lines at 28 px: two parts, split at its first ';\quad'
    const F = ((ctx.script.onscreen && ctx.script.onscreen.formulas) || [])[0], items = [];
    if (F) { const i = F.tex.indexOf(';\\quad'); if (i > 0) { items.push({ tex: F.tex.slice(0, i), at: F.cue }); items.push({ tex: F.tex.slice(i + 6), at: F.cue + '+3.0' }); } else items.push({ tex: F.tex, at: F.cue }); }
    K.formulaLayer(ctx, { label: 'Formula · R §E3, Table 8', items });
    const pen = K.pen(ctx, { kind: 'check', target: mB, at: 'windows+0.2', dur: 0.4, seed: 'pickB' });
    ctx.c3 = { leg, T, icon, knob, thr, gb, pc, mini, mB, cr, PL, pp, dots, head, lOn, lOff, lAg, lWin, insL, lCap, brg, lPub, leads, pen };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c3, T = c.T, fade = C3.fadeEl;
    const p1 = S.seg(t, -0.4, -0.1, S.ease.linear) * (1 - S.seg(t, T.draw, T.draw + 0.4, S.ease.linear)); c.icon.style.opacity = p1.toFixed(3);
    const kv = c.knob.value(t); c.gb.setAttribute('stdDeviation', (8 * (1 - kv)).toFixed(2)); c.thr.style.opacity = (S.seg(t, T.helps, T.helps + 0.3, S.ease.linear) * (1 - S.seg(t, T.predict, T.predict + 0.3, S.ease.linear))).toFixed(3);
    const pci = S.seg(t, T.predict, T.predict + 0.4, S.ease.outCubic), pco = S.seg(t, T.draw, T.draw + 0.4, S.ease.linear);
    c.pc.style.opacity = (pci * (1 - pco)).toFixed(3); K.show(c.pc, pci > 0 && pco < 1); c.pc.style.transform = `translateY(${(20 * (1 - pci)).toFixed(1)}px) scale(${(1 + 0.008 * Math.sin(2 * Math.PI * t / 2.6)).toFixed(4)})`;
    fade(c.mini, t, T.draw + 0.3); c.mB.classList.toggle('lit', t >= T.windows);
    const h = c.head(t); c.cr.setAttribute('width', Math.max(0, c.PL.sx(Math.min(h, c.pp.x.max)) - c.pp.box.x0 + 10).toFixed(1));
    c.dots.forEach((q) => { q.e.style.opacity = h >= q.x ? 1 : 0; });
    fade(c.lOn, t, T.on + 0.2); fade(c.lOff, t, T.off + 0.2); fade(c.lAg, t, T.again + 0.2); fade(c.lWin, t, T.windows);
    c.insL.forEach((q) => { fade(q.l, t, q.t); q.ld.style.opacity = (S.seg(t, q.t + 0.2, q.t + 0.5, S.ease.linear) * 0.8).toFixed(3); });
    fade(c.lCap, t, T.windows + 1.2);
    c.leg.style.opacity = (1 - S.seg(t, T.bench - 0.3, T.bench, S.ease.linear)).toFixed(3);   // the legend leaves room for the 'published' brackets
    c.brg.style.opacity = S.seg(t, T.bench, T.bench + 0.4, S.ease.linear).toFixed(3); fade(c.lPub, t, T.bench + 0.2);
  },
});
</script></body></html>
