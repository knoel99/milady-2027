<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X5.2 A jar with a label</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X5a.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X5a_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X5.2 A jar with a label (L4, BLUEPRINT, MEASURED: format checks, The Well loader replayed, C:124). The MFF file
   layout (tree from the entry) on the left, the catalog ledger on the right, the links between them; identifiers drawn
   as x's (no fake UUID or hash). Schematic snapshot tiles and sparkline (not data). */
Scene.define({
  duration: 36, register: 'blueprint',
  cues: { jar: 0.4, inside: 6.6, labels: 13.0, row: 16.4, ingest: 20.2, force: 24.4 },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, FC = P.file_card.box.slice(), LG = P.ledger; FC[3] = 660;
    K.badge(ctx, { kind: 'MEASURED', note: 'format checks · The Well loader replayed · C:124', at: -0.3 });
    // the jar glyph zooms into the file card
    const svg = K.svgLayer(ctx, 12), jar = K.s('g', {}, svg);
    K.s('rect', { x: 900, y: 420, width: 120, height: 160, rx: 18, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, jar);
    K.s('rect', { x: 920, y: 470, width: 80, height: 50, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2 }, jar);
    XK.timed(ctx, jar, -0.3, 'jar+0.9');
    const card = K.el('div', { class: 'x5-panel' }, ctx.stage); Object.assign(card.style, { left: FC[0] + 'px', top: FC[1] + 'px', width: FC[2] + 'px', height: FC[3] + 'px', background: K.c('panel') });
    XK.timed(ctx, card, 'jar+0.9', null, { din: 0.4 });
    XK.lab(ctx, 'fields.h5', FC[0] + 20, FC[1] + 12, { cls: 'mono', at: 'jar+1.0' }).style.fontSize = '32px';
    XK.lab(ctx, P.file_card.path, FC[0] + 260, FC[1] + 16, { cls: 'mono', at: 'jar+1.0' });
    // tree lines
    const lines = {}; let k = 0;
    const tree = K.el('div', {}, ctx.stage); Object.assign(tree.style, { position: 'absolute', left: (FC[0] + 24) + 'px', top: (FC[1] + 92) + 'px', width: (FC[2] - 48) + 'px', zIndex: 31 });
    P.tree.forEach((n) => {
      const e = K.el('div', { class: 'x5-mono' }, tree, n.node); e.style.position = 'static'; e.style.whiteSpace = 'normal'; e.style.lineHeight = '1.22'; e.style.width = 'fit-content';
      if (n.parent) e.style.paddingLeft = '40px';
      if (n.well) e.style.color = K.c('muted'); if (n.color) e.style.color = K.c(n.color); if (n.label) { e.style.color = K.c('fg'); e.style.borderLeft = '2px solid ' + K.c('fg'); e.style.paddingLeft = '10px'; e.style.marginTop = '8px'; }
      const at = XK.at(ctx, n.cue, 0.3 + 0.04 * (k++));
      XK.timed(ctx, e, at, null, { din: 0.15, op: n.node.startsWith('milady_spectral') ? 0.6 : 1 });
      lines[n.node.split(/\s/)[0]] = e;
    });
    XK.lab(ctx, 'in grey: The Well convention', FC[0] + FC[2] - 20, FC[1] + 52, { anchor: 'r', cls: 'small', color: 'muted', at: 'jar+1.4' });
    XK.lab(ctx, '(trajectories, time, x, y, z, components)', FC[0] + 300, FC[1] + 92 + 34.2 * 5, { cls: 'small', color: 'muted', at: 'inside+0.4' });
    // schematic tiles behind velocity / magnetic_field
    XK.lab(ctx, "MFF · HDF5 following The Well (Ohana et al. 2024) · read back by replaying The Well's loader", 1060, 790, { w: 760, cls: 'small', color: 'muted', at: 'jar+1.2', out: 'labels-0.15' });
    K.pen(ctx, { kind: 'box', target: lines.milady_uuid, pad: 3, at: 'labels+0.8' });
    K.pen(ctx, { kind: 'box', target: lines.milady_git_commit, pad: 3, at: 'labels+1.2' });
    // ledger
    const LB = LG.box, lgr = K.el('div', { class: 'x5-panel' }, ctx.stage); Object.assign(lgr.style, { left: LB[0] + 'px', top: LB[1] + 'px', width: LB[2] + 'px', height: LB[3] + 'px', background: K.c('panel') });
    XK.timed(ctx, lgr, 'row-0.15', null, { dx: 80, din: 0.6 });
    const strip = LG.tables_strip.map((t, i) => { const e = K.el('div', { class: 'x5-mono' }, ctx.stage, t); Object.assign(e.style, { left: (LB[0] + 20 + (i % 3) * 230) + 'px', top: (LB[1] + 16 + Math.floor(i / 3) * 38) + 'px' });
      XK.timed(ctx, e, 'row', null, { dim: LG.catalog_only.includes(t) ? ['ingest+0.4', 0.4] : null }); return e; });
    void strip;
    XK.lab(ctx, 'only in the catalog', LB[0] + LB[2] - 20, LB[1] + 92, { anchor: 'r', cls: 'small', color: 'muted', at: 'ingest+0.6' });
    const cards = {}, cellEls = {}; let cy = LB[1] + 150;
    Object.entries(LG.cards).forEach(([nm, cols]) => { const h = 120;
      const c = K.el('div', { class: 'x5-term' }, ctx.stage); Object.assign(c.style, { left: (LB[0] + 30) + 'px', top: cy + 'px', width: (LB[2] - 60) + 'px', height: (h - 10) + 'px', zIndex: 13 });
      K.el('div', { class: 'x5-mono' }, c, nm).style.cssText = 'position:static;color:' + K.c('fg');
      const row = K.el('div', { class: 'x5-mono' }, c); row.style.cssText = 'position:static;white-space:normal;line-height:1.3';
      cols.forEach((col, i) => { const e = K.el('span', {}, row, col); cellEls[nm + '.' + col] = e; if (i < cols.length - 1) K.el('span', {}, row, ' · '); });
      XK.timed(ctx, c, XK.at(ctx, 'row', 0.3), null); cards[nm] = { c, y: cy, h }; cy += h + 10; });
    // the sha256 cell shows x's, then y's after --force
    const sha = cellEls['file.sha256']; const shaV = K.el('span', {}, sha, '  ' + P.rewrite.before); shaV.style.color = K.c('muted');
    // connectors (tree node → card), drawn on after 'row'
    const cg = K.svgLayer(ctx, 15);
    const box = (e) => K.box(e, ctx);
    LG.links.forEach(([a, b], i) => { const ea = a === 'path' ? null : lines[a], eb = cellEls[b] || (cards[b] ? cards[b].c : null); if (!eb) return;
      const p = K.s('path', { fill: 'none', stroke: K.c('infra'), 'stroke-width': 2 }, cg); ctx.add({ render(t) { void t; } });
      XK.drawOn(ctx, p, XK.at(ctx, 'row', 0.6 + 0.15 * i), 0.5);
      p.dataset.a = a; p.dataset.b = b; p._ea = ea; p._eb = eb; });
    ctx.x52 = { cg, lines, cellEls, cards, box, card, P, tF: ctx.at('force-0.15'), shaV, tR: ctx.at('row-0.15') };
    const hl1 = XK.lab(ctx, 'same UUID in the file and in the catalog', LB[0] + 30, LB[1] + LB[3] - 54, { at: 'row+1.6', out: 'row+3.2' });
    const hl2 = XK.lab(ctx, 'the checksum lives in the catalog', LB[0] + 30, LB[1] + LB[3] - 54, { at: 'row+3.2', out: 'ingest-0.15' });
    void hl1; void hl2;
    // ingest
    const ig = K.s('g', {}, svg); [0, 1, 2].forEach((i) => K.s('rect', { x: LB[0] + 40 + 10 * i, y: LB[1] + LB[3] - 100 + 10 * i, width: 110, height: 70, rx: 6, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 2 }, ig));
    K.s('path', { d: `M${LB[0] + 40},${LB[1] + LB[3] - 70} C${LB[0] - 10},${LB[1] + LB[3] - 70} ${LB[0] - 10},${cards.simulation.y + 40} ${LB[0] + 30},${cards.simulation.y + 40}`, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, ig);
    XK.timed(ctx, ig, 'ingest-0.15', null);
    XK.lab(ctx, 'ingest', LB[0] + 190, LB[1] + LB[3] - 80, { at: 'ingest' });
    XK.lab(ctx, 'rebuilt from the files: simulations, files, diagnostics · not restored: compute time, resources, campaign YAML', 1060, 790, { w: 760, cls: 'small', color: 'muted', at: 'ingest+0.3', out: 'force-0.15' });
    XK.lab(ctx, '--force', FC[0] + FC[2], FC[1] + FC[3] + 6, { anchor: 'r', cls: 'mono', at: 'force' });
    XK.lab(ctx, 'checksummed, not tamper-proof', LB[0] + 30, LB[1] + LB[3] + 6, { at: 'force+0.6' });
    K.chip(ctx, { text: 'validation flags all 18 corruptions tested', kind: 'plain', x: 1020, y: 830, at: Math.max(ctx.at('force+0.8'), ctx.duration - 3) });
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.x52;
    // connectors follow the element boxes (static layout, measured each frame cheaply from cached rects)
    if (t > c.tR + 0.5) c.cg.querySelectorAll('path').forEach((p) => { if (!p._eb) return; const a = p._ea ? c.box(p._ea) : { x: c.card.offsetLeft + 260, y: c.card.offsetTop + 16, w: 300, h: 30 }, b = c.box(p._eb);
      const x0 = Math.min(a.x + a.w, 980), y0 = a.y + a.h / 2, x1 = b.x, y1 = b.y + b.h / 2; p.setAttribute('d', `M${x0},${y0} C${x0 + 60},${y0} ${x1 - 60},${y1} ${x1},${y1}`); });
    const hu = t > c.tR + 1.6 && t < c.tR + 3.2, hs = t > c.tR + 3.2 && t < c.tR + 6;
    if (c.lines.milady_uuid) c.lines.milady_uuid.style.background = hu ? K.rgba(K.c('fg'), 0.15) : 'transparent';
    if (c.cellEls['simulation.id']) c.cellEls['simulation.id'].style.background = hu ? K.rgba(K.c('fg'), 0.15) : 'transparent';
    c.cellEls['file.sha256'].style.background = hs ? K.rgba(K.c('fg'), 0.15) : 'transparent';
    const fl = t > c.tF + 0.4 && t < c.tF + 0.7; c.card.style.borderColor = fl ? K.c('fg') : ''; c.shaV.textContent = '  ' + (t > c.tF + 0.6 ? c.P.rewrite.after : c.P.rewrite.before);
  },
});
</script></body></html>
