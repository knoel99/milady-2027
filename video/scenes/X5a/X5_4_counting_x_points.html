<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X5.4 Counting X-points</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X5a.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X5a_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X5.4 Counting X-points (L4, NIGHT, PENDING: CONJECTURE low). SCHEMATIC toy potential on the periodic square (entry
   modes, critical points from the entry): contours by marching squares (positive levels --b, negative --b-neg),
   one O-point and one X-point named, the predict beat, the Poincaré–Hopf tally (as many X as O); then Kit.seat 'curve'
   for data/x5_xpoints.json with an empty tolerance bracket. Ink change BLUEPRINT → NIGHT in the lead-in. */
Scene.define({
  duration: 36, register: 'night',
  cues: { lines: 1.0, points: 5.6, predict: 8.6, answer: 14.6, seat: 19.6, bet: 23.6, criterion: 27.6 },
  data: { seat: { url: 'data/x5_xpoints.json', optional: true } },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, T = P.toy, res = ctx.variant === 'result';
    const IC = P.ink_change; XK.inkChange(ctx, IC.t0, IC.t1, 540, 'blueprint');
    window.__EVENTS__ = [{ t: IC.t0, id: 'whoosh', gain_db: -22 }, { t: +(ctx.at('answer') + 0.2).toFixed(3), id: 'pop', gain_db: -24 }];
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'low', at: -0.3 });
    const B = T.box, Ng = T.grid, TAU = 2 * Math.PI;
    const a = (x, y) => T.modes.reduce((s, m) => s + m[0] * Math.cos(m[1] * x + m[2] * y + m[3]), 0);
    const F = new Float64Array((Ng + 1) * (Ng + 1)); let mn = Infinity, mx = -Infinity;
    for (let j = 0; j <= Ng; j++) for (let i = 0; i <= Ng; i++) { const v = a(TAU * i / Ng, TAU * j / Ng); F[j * (Ng + 1) + i] = v; mn = Math.min(mn, v); mx = Math.max(mx, v); }
    const lev = []; for (let k = 1; k <= T.levels; k++) lev.push(mn + (mx - mn) * k / (T.levels + 1));
    const X = (i) => B[0] + B[2] * i / Ng, Y = (j) => B[1] + B[3] * (1 - j / Ng);
    const segs = lev.map((L) => { const out = []; for (let j = 0; j < Ng; j++) for (let i = 0; i < Ng; i++) {
      const v = [F[j * (Ng + 1) + i], F[j * (Ng + 1) + i + 1], F[(j + 1) * (Ng + 1) + i + 1], F[(j + 1) * (Ng + 1) + i]], c = [[i, j], [i + 1, j], [i + 1, j + 1], [i, j + 1]], pts = [];
      for (let e = 0; e < 4; e++) { const p = v[e] - L, q = v[(e + 1) % 4] - L; if (p * q < 0) { const w = p / (p - q), A = c[e], Bc = c[(e + 1) % 4]; pts.push([X(A[0] + w * (Bc[0] - A[0])), Y(A[1] + w * (Bc[1] - A[1]))]); } }
      if (pts.length >= 2) out.push(pts[0][0], pts[0][1], pts[1][0], pts[1][1]); if (pts.length === 4) out.push(pts[2][0], pts[2][1], pts[3][0], pts[3][1]); } return { L, s: out }; });
    const CV = K.canvasLayer(ctx, 6, { x: B[0] - 10, y: B[1] - 10, w: B[2] + 20, h: B[3] + 20 }, null, { reset: true });
    const order = segs.map((s, k) => k).sort((p, q) => Math.abs(segs[q].L) - Math.abs(segs[p].L));
    // frame of the periodic square (dashed edges, paired ticks)
    const svg = K.svgLayer(ctx, 12), tg = K.s('g', {}, svg);
    K.s('rect', { x: B[0], y: B[1], width: B[2], height: B[3], fill: 'none', stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '10 8' }, tg);
    [[B[0] + B[2] / 2, B[1]], [B[0] + B[2] / 2, B[1] + B[3]]].forEach(([x, y]) => K.s('path', { d: `M${x - 10},${y - 8} l10,8 l-10,8 M${x},${y - 8} l10,8 l-10,8`, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2 }, tg));
    [[B[0], B[1] + B[3] / 2], [B[0] + B[2], B[1] + B[3] / 2]].forEach(([x, y]) => K.s('path', { d: `M${x - 8},${y - 10} l8,10 l8,-10`, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2 }, tg));
    K.chip(ctx, { text: 'SCHEMATIC · toy field on the periodic square', kind: 'schematic', x: B[0], y: B[1] + B[3] + 16, at: -0.3, out: 'seat-0.15' });
    XK.lab(ctx, 'field lines = contours of the potential A', B[0], B[1] - 50, { at: 'lines+0.4', out: 'seat-0.15' });
    // critical points
    const PX = (x) => B[0] + B[2] * x / TAU, PY = (y) => B[1] + B[3] * (1 - y / TAU);
    const marks = T.points.map((p) => { const g = K.s('g', {}, svg), x = PX(p[0]), y = PY(p[1]);
      if (p[2] === 'O') K.s('circle', { cx: x, cy: y, r: 9, fill: K.c('b'), stroke: K.c('fg'), 'stroke-width': 2 }, g);
      else K.s('path', { d: `M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18`, stroke: K.c('fg'), 'stroke-width': 4 }, g);
      return { g, p }; });
    const rng = S.rng('x5-points'), ord = marks.map((m, i) => i).sort(() => rng() - 0.5);
    const hO = T.points[T.highlight.O], hX = T.points[T.highlight.X], tX = XK.frac(ctx, 'points', 0.5, 1.5);
    XK.lab(ctx, 'O-point · island centre', PX(hO[0]) + 24, PY(hO[1]) - 60, { cls: 'small halo', at: 'points', out: 'answer-0.15', z: 32 });
    XK.lab(ctx, 'X-point · lines cross', PX(hX[0]) + 24, PY(hX[1]) - 60, { cls: 'small halo', at: tX + 0.1, raw: true, out: 'answer-0.15', z: 32 });
    K.predictCard(ctx, { x: 880, y: 190, w: 880, anchor: 'l', question: 'periodic square: more X-points or more O-points?', options: ['X', 'O'], at: 'predict-0.15', out: 'answer-0.15' });
    // tally
    const TL = P.tally.box, tal = K.s('g', {}, svg), nO = T.points.filter((p) => p[2] === 'O').length, nX = T.points.length - nO;
    const tO = [], tXm = []; for (let k = 0; k < nO; k++) tO.push(K.s('circle', { cx: TL[0] + 20, cy: TL[1] + TL[3] - 20 - 40 * k, r: 9, fill: K.c('b') }, tal));
    for (let k = 0; k < nX; k++) { const x = TL[0] + 60, y = TL[1] + TL[3] - 20 - 40 * k; tXm.push(K.s('path', { d: `M${x - 9},${y - 9} l18,18 M${x + 9},${y - 9} l-18,18`, stroke: K.c('fg'), 'stroke-width': 4 }, tal)); }
    K.pen(ctx, { kind: 'check', box: { x: TL[0] + TL[2] + 20, y: TL[1] + TL[3] - 300, w: 50, h: 44 }, at: 'answer+1.4', out: 'seat-0.15' });
    XK.lab(ctx, 'saddles = extrema on the torus · Poincaré–Hopf', TL[0] + TL[2] + 90, TL[1] + TL[3] - 300, { w: 540, at: 'answer+1.6', out: 'seat-0.15' });
    // seat
    const SE = P.seat, fr = { x: 760, y: 260, w: 400, h: 400 };
    K.seat(ctx, { type: 'curve', variant: ctx.variant, data: ctx.data.seat, tag: SE.tag, frame: fr, at: 'seat-0.15',
      x: { label: SE.x.label, min: 0, max: 1, ticks: [] }, y: { label: SE.y.label, min: 0, max: 1, ticks: [0, 0.5, 1] },
      bet: SE.bet, confidence: SE.confidence, criterion: SE.criterion, source: SE.source, ask: SE.ask,
      cues: res ? { frame: 'seat-0.15', bet: 'seat', criterion: 'seat+1.0', ask: 'seat+2.0', data: 'seat+0.4' } : { frame: 'seat-0.15', bet: 'bet-0.15', criterion: 'criterion-0.15', ask: 'criterion+1.6', data: 'seat' } });
    const bg = K.s('g', {}, svg), bx0 = fr.x + 140, bx1 = fr.x + 260, by = fr.y + 70;
    K.s('path', { d: `M${bx0},${by + 14} l0,-14 l${bx1 - bx0},0 l0,14`, fill: 'none', stroke: K.c('metric'), 'stroke-width': 3, 'stroke-dasharray': '8 6' }, bg);
    XK.timed(ctx, bg, 'seat+0.4', null);
    XK.lab(ctx, 'tolerance: not set', (bx0 + bx1) / 2, by - 44, { anchor: 'c', cls: 'small', color: 'metric', at: 'seat+0.5' });
    XK.lab(ctx, 'fewer', fr.x, fr.y + fr.h - 50, { cls: 'small', color: 'muted', at: 'seat' }); XK.lab(ctx, 'more', fr.x + fr.w, fr.y + fr.h - 50, { anchor: 'r', cls: 'small', color: 'muted', at: 'seat' });
    K.chip(ctx, { text: 'a metric requested by the internship offer · none computed in the report (R:739)', kind: 'plain', maxWidth: 900, x: 120, y: 790, at: 'seat+0.8' });
    K.formulaLayer(ctx);
    ctx.x54 = { CV, segs, order, B, marks, ord, tL: ctx.at('lines-0.15'), tP: ctx.at('points-0.15'), tX, tPr: ctx.at('predict-0.15'), tA: ctx.at('answer-0.15'), tS: ctx.at('seat-0.15'), hO: T.highlight.O, hX: T.highlight.X, sepL: hX[3], tO, tXm, svgT: [tg, svg] };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.x54, g = c.CV.g, ox = c.B[0] - 10, oy = c.B[1] - 10;
    g.clearRect(0, 0, c.CV.w, c.CV.h);
    const pl = S.seg(t, c.tL, c.tL + 1.2, S.ease.linear), sep = S.seg(t, c.tX, c.tX + 0.4, S.ease.linear) * (1 - S.seg(t, c.tA, c.tA + 0.4, S.ease.linear));
    const br = t > c.tPr && t < c.tA ? 0.08 * Math.sin(2 * Math.PI * (t - c.tPr) / 2) : 0;
    const shrink = S.seg(t, c.tS, c.tS + 0.8, S.ease.inOutCubic), sc = 1 - 0.2 * shrink;
    g.setTransform(sc, 0, 0, sc, 10 * (1 - sc) * 0, 0); g.lineWidth = 2;
    const nShow = Math.ceil(pl * c.order.length);
    c.order.slice(0, nShow).forEach((k) => { const sgm = c.segs[k]; g.strokeStyle = sgm.L >= 0 ? K.c('b') : K.c('b-neg'); g.globalAlpha = Math.max(0, Math.min(1, (1 - 0.5 * sep) + br));
      g.beginPath(); for (let i = 0; i < sgm.s.length; i += 4) { g.moveTo(sgm.s[i] - ox, sgm.s[i + 1] - oy); g.lineTo(sgm.s[i + 2] - ox, sgm.s[i + 3] - oy); } g.stroke(); });
    if (sep > 0) { // the separatrix through the X-point: contour at its level, bright
      g.globalAlpha = 1; g.lineWidth = 3; g.strokeStyle = K.c('fg'); let best = 0, bd = Infinity; c.segs.forEach((s, k) => { const d = Math.abs(s.L - c.sepL); if (d < bd) { bd = d; best = k; } });
      g.globalAlpha = sep; const s = c.segs[best].s; g.beginPath(); for (let i = 0; i < s.length; i += 4) { g.moveTo(s[i] - ox, s[i + 1] - oy); g.lineTo(s[i + 2] - ox, s[i + 3] - oy); } g.stroke(); }
    c.svgT[0].setAttribute('transform', `translate(${c.B[0] * (1 - sc)} ${c.B[1] * (1 - sc)}) scale(${sc})`);
    c.marks.forEach((m, i) => { let a = 0; if (i === c.hO) a = S.seg(t, c.tP, c.tP + 0.3, S.ease.linear); if (i === c.hX) a = S.seg(t, c.tX, c.tX + 0.3, S.ease.linear);
      const k = c.ord.indexOf(i); a = Math.max(a, S.seg(t, c.tA + 0.06 * k, c.tA + 0.06 * k + 0.2, S.ease.linear));
      m.g.style.opacity = a; m.g.setAttribute('transform', `translate(${c.B[0] * (1 - sc)} ${c.B[1] * (1 - sc)}) scale(${sc})`); });
    const ta = S.seg(t, c.tA + 0.3, c.tA + 1.3, S.ease.linear) * (1 - shrink);
    c.tO.forEach((e, k) => { e.style.opacity = ta * c.tO.length > k ? 1 - shrink : 0; }); c.tXm.forEach((e, k) => { e.style.opacity = ta * c.tXm.length > k ? 1 - shrink : 0; });
  },
});
</script></body></html>
