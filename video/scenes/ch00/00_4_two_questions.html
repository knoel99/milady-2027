<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>00.4 Two questions</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch00.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch00_kit.js"></script>
<style>
  .c0-card { position: absolute; top: 190px; width: 700px; height: 380px; box-sizing: border-box; border: 3px solid var(--muted);
    border-radius: 14px; background: var(--panel); z-index: 20; }
  .c0-card .q { position: absolute; left: 0; right: 0; top: 214px; text-align: center; font-family: "Inter Display"; font-weight: 600; font-size: 48px; color: var(--fg); }
  .c0-tag { position: absolute; padding: 6px 22px 8px; border: 3px solid var(--fg-2); border-radius: 8px; font-size: 32px; font-weight: 500; color: var(--fg); transform: translateX(-50%); z-index: 32; }
  .c0-tag.dash { border-style: dashed; }
</style>
</head><body><div id="stage"></div>
<script>
/* 00.4 Two questions (L0, NIGHT, MEASURED · three-mode model). The 00.3 strip shrinks to a band along the top;
   two cards (when / how often); predict hold; the clock card fails (three-mode model), the tally card is underlined;
   a roadmap (compass, tank of liquid metal, chaotic curve) leads to the violet cloud of generated snapshots (M4,
   data e1_samples_0.9.json, variant params.cloud_variant); tags 'exact' / 'on average'. */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { two: 0.3, when: 1.6, often: 3.3, bet: 5.3, hopeless: 9.3, answer: 13.4, path: 15.5, dream: 18.8, exact: 22.6 },
  data: { cloud: 'data/e1_samples_0.9.json' },
  params: { cloud_variant: 'C_equivariant', cloud_axes: ['D', 'Q'], cloud_points: 1500, cloud_range: [-2.8, 2.8], badge_note: 'three-mode model',
    window_Ma: [0, 5], normal_Ma: [[0.0, 0.78], [0.99, 1.07], [1.201, 1.211], [1.77, 1.95], [2.14, 2.15], [2.581, 3.04], [3.11, 3.22], [3.33, 3.58], [4.18, 4.29], [4.48, 4.62], [4.8, 4.89], [4.98, 5.23]] },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, on = ctx.script.onscreen || {}, labs = on.labels || [], chips = on.chips || [];
    const lab = (re, fb) => labs.find((l) => re.test(l)) || fb, chip = (re, fb) => chips.find((l) => re.test(l)) || fb;
    // ---- the 00.3 strip (same geometry), shrinking to a band along the top on 'two'
    const ssvg = K.svgLayer(ctx, 11), sg = K.s('g', {}, ssvg);
    const runs = C0.runs(P.normal_Ma, P.window_Ma), [w0, w1] = P.window_Ma, SX0 = 280, SX1 = 1640, SY = 500, SH = 56;
    const xOf = (m) => SX1 - (SX1 - SX0) * (m - w0) / (w1 - w0);
    runs.forEach((r) => K.s('rect', { x: xOf(r.b), y: SY, width: Math.max(2.7, xOf(r.a) - xOf(r.b)), height: SH, fill: K.c(r.s > 0 ? 'b' : 'b-neg') }, sg));
    // ---- the two cards
    const card = (x, txt) => { const c = K.el('div', { class: 'c0-card' }, st); c.style.left = x + 'px'; const q = K.el('div', { class: 'q', html: txt }, c); return { c, q }; };
    const cw = card(180, K.esc(lab(/^When/, 'When will it flip next?')));
    const howTxt = lab(/^How often/, 'How often does it flip?');
    const ch = card(1040, `<span class="pen-t">${K.esc(howTxt.slice(0, 9))}</span>${K.esc(howTxt.slice(9))}`);
    // clock (grey) in the left card
    const csvg = K.s('svg', { width: 700, height: 220, style: 'position:absolute;left:0;top:0;overflow:visible' }, cw.c);
    const cg = K.s('g', { transform: 'translate(350 118)' }, csvg);
    K.s('circle', { r: 78, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 5 }, cg);
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; K.s('line', { x1: 66 * Math.sin(a), y1: -66 * Math.cos(a), x2: 58 * Math.sin(a), y2: -58 * Math.cos(a), stroke: K.c('fg-2'), 'stroke-width': 3 }, cg); }
    const hh = K.s('line', { x1: 0, y1: 0, x2: 0, y2: -36, stroke: K.c('fg'), 'stroke-width': 7, 'stroke-linecap': 'round' }, cg);
    const mh = K.s('line', { x1: 0, y1: 0, x2: 0, y2: -58, stroke: K.c('fg'), 'stroke-width': 4, 'stroke-linecap': 'round' }, cg);
    const blur = K.s('circle', { r: 46, fill: K.c('fg-2'), opacity: 0 }, cg);
    // tally marks (amber: a distribution-level quantity) in the right card
    const tsvg = K.s('svg', { width: 700, height: 220, style: 'position:absolute;left:0;top:0;overflow:visible' }, ch.c);
    const tallies = [0, 1, 2, 3].map((i) => { const x = 280 + 46 * i, p = K.s('path', { d: `M${x},${60} Q${x + 4},${118} ${x - 2},${176}`, fill: 'none', stroke: K.c('metric'), 'stroke-width': 9, 'stroke-linecap': 'round' }, tsvg); const l = p.getTotalLength(); p.style.strokeDasharray = `${l} ${l + 10}`; return { p, l }; });
    // chips
    K.chip(ctx, { text: chip(/Earth/, 'for Earth: no one can say if or when · NOAA NCEI'), kind: 'plain', x: 530, y: 600, anchor: 'c', at: 'when+0.3', out: 'path-0.2' });
    K.chip(ctx, { text: chip(/Gissinger/, 'three-mode model (Gissinger 2012)'), kind: 'plain', x: 530, y: 530, anchor: 'c', at: 'hopeless-0.15', out: 'path-0.2', z: 46 });
    const pen = K.pen(ctx, { kind: 'underline', target: ch.q.querySelector('.pen-t'), at: 'answer-0.15', dur: 0.5, out: 'path-0.2', seed: 'howoften' });
    // ---- roadmap (grey line icons) and the cloud
    const rsvg = K.svgLayer(ctx, 12), rg = K.s('g', {}, rsvg), grey = K.c('fg-2'), lw = { fill: 'none', stroke: grey, 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
    const RX = [300, 590, 880], RY = 400, icons = RX.map((x) => K.s('g', { transform: `translate(${x} ${RY})` }, rg));
    K.s('circle', { r: 80, ...lw }, icons[0]); K.s('path', { d: 'M0,-58 L10,0 L-10,0 Z', fill: K.c('b') }, icons[0]); K.s('path', { d: 'M0,58 L10,0 L-10,0 Z', fill: K.c('matter') }, icons[0]);
    K.s('path', { d: 'M-70,-70 V60 a14,14 0 0 0 14,14 H56 a14,14 0 0 0 14,-14 V-70', ...lw }, icons[1]);
    K.s('path', { d: 'M-70,-14 q17.5,-14 35,0 t35,0 t35,0 t35,0', ...lw }, icons[1]);
    let dl = ''; for (let i = 0; i <= 400; i++) { const u = i / 400 * 6 * Math.PI, side = Math.sin(u / 3) > 0 ? 1 : -1, r = 30 + 10 * Math.sin(1.7 * u);
      dl += `${i ? 'L' : 'M'}${(side * 42 + r * Math.cos(u)).toFixed(1)},${(r * 1.3 * Math.sin(u)).toFixed(1)}`; }
    K.s('path', { d: dl, ...lw, 'stroke-width': 3 }, icons[2]);
    const links = [0, 1, 2].map((i) => K.s('line', { x1: RX[i] + 100, x2: i < 2 ? RX[i + 1] - 100 : 1080, y1: RY, y2: RY, stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '8 10' }, rg));
    const cv = ctx.data.cloud.variants[P.cloud_variant], X = Scene.f32(cv.x), cols = ctx.data.cloud.columns, n = Math.min(P.cloud_points, X.shape[0]);
    const ix = cols.indexOf(P.cloud_axes[0]), iy = cols.indexOf(P.cloud_axes[1]), pts = new Float32Array(2 * n);
    for (let i = 0; i < n; i++) { pts[2 * i] = X[3 * i + ix]; pts[2 * i + 1] = X[3 * i + iy]; }
    const rr = P.cloud_range;
    K.cloud(ctx, { box: { x: 1130, y: 130, w: 560, h: 440 }, range: { x: rr, y: rr }, targets: [{ pts, at: 'dream-0.15', dur: 3 }], n, strings: 60, at: 'dream-0.15', size: 3.4, seed: 'teaser' });
    K.chip(ctx, { text: chip(/generated/, 'generated snapshots · E1 three-mode model'), kind: 'generated', x: 1410, y: 610, anchor: 'c', at: 'dream+0.6' });
    K.lowerThird(ctx, { kind: 'source', data: ctx.data.cloud, at: 'dream+0.4', out: '_tail' });
    const tagE = K.el('div', { class: 'c0-tag' }, st, lab(/^exact$/, 'exact')); tagE.style.left = '1290px'; tagE.style.top = '660px';
    const tagA = K.el('div', { class: 'c0-tag dash' }, st, lab(/^on average$/, 'on average')); tagA.style.left = '1530px'; tagA.style.top = '660px';
    // ---- HUD
    K.badge(ctx, { kind: 'MEASURED', note: P.badge_note, at: -0.3 });
    K.formulaLayer(ctx);
    const T = { two: ctx.at('two-0.15'), when: ctx.at('when-0.15'), often: ctx.at('often-0.15'), bet: ctx.at('bet-0.15'), hop: ctx.at('hopeless-0.15'),
      ans: ctx.at('answer-0.15'), path: ctx.at('path-0.15'), dream: ctx.at('dream-0.15'), exact: ctx.at('exact-0.15') };
    window.__EVENTS__ = [0, 1, 2, 3].map((i) => ({ t: +(T.often + 0.15 + 0.3 * i).toFixed(3), id: 'tick', gain_db: -30 }));
    void pen;
    ctx.c0 = { sg, cw, ch, hh, mh, blur, tallies, rg, icons, links, tagE, tagA, T, SY, SH };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c0, T = c.T;
    // strip -> band along the top (y 120, 12 px), stays there
    const ps = S.seg(t, T.two, T.two + 1.0, S.ease.inOutCubic), sy = 1 + (12 / c.SH - 1) * ps, ty = c.SY + (120 - c.SY) * ps;
    c.sg.setAttribute('transform', `translate(0 ${(ty - c.SY * sy).toFixed(2)}) scale(1 ${sy.toFixed(4)})`);
    // cards in on 'two' (slide up), out on 'path'
    const out = S.seg(t, T.path, T.path + 0.6, S.ease.inOutCubic);
    [c.cw.c, c.ch.c].forEach((el, i) => { const p = S.seg(t, T.two + 0.3 + 0.12 * i, T.two + 0.9 + 0.12 * i, S.ease.outCubic);
      const pulse = Math.sin(Math.PI * S.seg(t, T.bet, T.bet + 0.6, S.ease.inOutSine)), br = 0.004 * Math.sin(2 * Math.PI * (t - T.bet) / 2.8) * (t > T.bet ? 1 : 0);
      el.style.transform = `translateY(${(30 * (1 - p) - 60 * out).toFixed(2)}px) scale(${(1 + 0.025 * pulse + br).toFixed(4)})`;
      let o = p * (1 - out); if (i === 0) o *= 1 - 0.6 * S.seg(t, T.hop + 0.2, T.hop + 1.0, S.ease.linear);
      el.style.opacity = o.toFixed(3); K.show(el, o > 0); });
    // lighting: the card's border brightens on its cue; the clock card turns dashed on 'hopeless'
    c.cw.c.style.borderColor = t >= T.when ? 'var(--fg)' : ''; c.cw.c.style.borderStyle = t >= T.hop ? 'dashed' : 'solid';
    c.ch.c.style.borderColor = t >= T.often ? 'var(--metric)' : '';
    // clock hands: one sweep on 'when', a spinning blur on 'hopeless'
    const sw = S.seg(t, T.when, T.when + 1.2, S.ease.inOutCubic), spin = Math.max(0, t - T.hop - 0.2);
    const am = 360 * sw + 1440 * spin * S.seg(t, T.hop + 0.2, T.hop + 0.8, S.ease.linear), ah = 30 * sw + 120 * spin * S.seg(t, T.hop + 0.2, T.hop + 0.8, S.ease.linear);
    c.mh.setAttribute('transform', `rotate(${(am % 360).toFixed(2)})`); c.hh.setAttribute('transform', `rotate(${(ah % 360 + 60).toFixed(2)})`);
    const bl = S.seg(t, T.hop + 0.3, T.hop + 0.8, S.ease.linear); c.blur.setAttribute('opacity', (0.35 * bl).toFixed(3)); c.mh.style.opacity = c.hh.style.opacity = (1 - 0.7 * bl).toFixed(3);
    // tallies, one after the other
    c.tallies.forEach((q, i) => { const a = T.often + 0.15 + 0.3 * i; q.p.style.strokeDashoffset = (q.l * (1 - S.seg(t, a, a + 0.25, S.ease.outCubic))).toFixed(2); q.p.style.opacity = t >= a ? 1 : 0; });
    // roadmap drawn left to right on 'path'; it breathes
    c.icons.forEach((g, i) => { const a = T.path + 0.4 + 0.35 * i, p = S.seg(t, a, a + 0.4, S.ease.outCubic); g.style.opacity = p.toFixed(3);
      const RX = [300, 590, 880][i], b = 1 + 0.015 * Math.sin(2 * Math.PI * t / 3 + i);
      g.setAttribute('transform', `translate(${RX} ${(400 + 14 * (1 - p)).toFixed(2)}) scale(${b.toFixed(4)})`); });
    c.links.forEach((l, i) => { const a = T.path + 0.6 + 0.35 * i + (i === 2 ? 0.5 : 0); l.style.opacity = S.seg(t, a, a + 0.3, S.ease.linear).toFixed(3); });
    // tags on 'exact'
    [c.tagE, c.tagA].forEach((e, i) => { const p = S.seg(t, T.exact + 0.25 * i, T.exact + 0.25 * i + 0.25, S.ease.outCubic); e.style.opacity = p.toFixed(3); K.show(e, p > 0);
      e.style.marginTop = (8 * (1 - p)).toFixed(2) + 'px'; });
  },
});
</script></body></html>
