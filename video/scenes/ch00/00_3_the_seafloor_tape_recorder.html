<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>00.3 The seafloor tape recorder</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch00.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch00_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 00.3 The seafloor tape recorder (L0, NIGHT, CONTEXT, SCHEMATIC). Ridge cross-section; grains line up with the
   field on 'grains'; on 'spread' time runs from 5 Ma ago to today at a constant schematic spreading rate, driven by
   the script's params.normal_Ma (Cande & Kent 1995 via Gee & Kent 2007): each polarity boundary flips the field
   arrow and starts a new stripe, mirror-symmetric on both sides; on 'uneven' the left half (5 Ma at the left, today
   at the axis) morphs (T1) into the film's horizontal polarity strip with its time axis and a sign trace. */
Scene.define({
  duration: 16.5,
  register: 'night',
  cues: { ridge: 0.3, grains: 3.7, spread: 7.1, uneven: 11.5 },
  params: { window_Ma: [0, 5], normal_Ma: [[0.0, 0.78], [0.99, 1.07], [1.201, 1.211], [1.77, 1.95], [2.14, 2.15], [2.581, 3.04], [3.11, 3.22], [3.33, 3.58], [4.18, 4.29], [4.48, 4.62], [4.8, 4.89], [4.98, 5.23]], flips_in_window: 22 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage;
    const on = ctx.script.onscreen || {}, labs = on.labels || [], chips = on.chips || [];
    const lab = (k, fb) => labs.find((l) => l === k) || fb;
    const [w0, w1] = P.window_Ma, runs = C0.runs(P.normal_Ma, P.window_Ma), flips = C0.flips(runs);
    if (flips.length !== P.flips_in_window) S.warn(`00.3: ${flips.length} polarity boundaries in the window, params.flips_in_window = ${P.flips_in_window}`);
    const AX = 960, HW = 680, v = HW / (w1 - w0);           // px per Ma (schematic constant spreading rate)
    const WY0 = 260, WY1 = 340, CY0 = 340, CY1 = 450;        // water band, recorded crust band
    // ---- cross-section group (zoomed on 'grains')
    const grp = K.el('div', { class: 'c0-grp' }, st); grp.style.zIndex = 10;
    const svg = K.svgLayer(ctx, 10, grp);
    K.s('rect', { x: AX - HW - 40, y: WY0, width: 2 * HW + 80, height: WY1 - WY0, fill: K.c('grid') }, svg);              // water (never blue)
    K.s('rect', { x: AX - HW - 40, y: CY1, width: 2 * HW + 80, height: 150, fill: K.c('panel') }, svg);                   // mantle
    const crustG = K.s('g', {}, svg);
    K.s('rect', { x: AX - HW - 40, y: CY0, width: 2 * HW + 80, height: CY1 - CY0, fill: K.c('matter-dark') }, crustG);   // old, unrecorded crust
    const magma = K.s('path', { d: `M${AX - 70},${CY1 + 150} C${AX - 40},${CY1 + 40} ${AX - 14},${CY1} ${AX - 10},${CY0 - 4} L${AX + 10},${CY0 - 4} C${AX + 14},${CY1} ${AX + 40},${CY1 + 40} ${AX + 70},${CY1 + 150} Z`, fill: K.c('fg-2') }, svg);
    K.s('path', { d: `M${AX - 160},${WY1} Q${AX},${WY1 - 46} ${AX + 160},${WY1}`, fill: K.c('matter-dark'), stroke: 'none' }, svg);   // ridge bump
    const leftG = K.s('g', {}, svg), rightG = K.s('g', {}, svg);
    const mk = (g) => runs.map((r) => K.s('rect', { y: CY0, height: CY1 - CY0, fill: K.c(r.s > 0 ? 'b' : 'b-neg'), width: 0 }, g));
    const L = mk(leftG), R = mk(rightG);
    const frame = K.s('rect', { x: AX - HW - 40, y: CY0, width: 2 * HW + 80, height: CY1 - CY0, fill: 'none', stroke: K.c('matter'), 'stroke-width': 2 }, svg);
    // grains in the new rock at the axis (seeded angles, they line up with the field)
    const rng = S.rng('grains'), grains = [];
    for (let i = 0; i < 12; i++) { const x = AX - 26 + 52 * ((i % 4) + 0.5) / 4, y = CY0 + 14 + 24 * Math.floor(i / 4);
      grains.push({ el: K.s('line', { x1: -6, x2: 6, y1: 0, y2: 0, stroke: K.c('fg'), 'stroke-width': 2.5, 'stroke-linecap': 'round' }, svg), x, y, a0: (rng() - 0.5) * 300, d: 0.15 * i * rng() }); }
    // field arrow above the ridge (right = normal, left = reversed)
    const arr = K.s('g', {}, svg); K.s('path', { d: 'M-80,0 H62 M44,-16 L76,0 L44,16', fill: 'none', stroke: K.c('b'), 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, arr);
    // labels (screen space)
    const mkL = (txt, x, y, cls = '') => { const e = K.el('div', { class: 'c0-label ' + cls }, st, txt); e.style.left = x + 'px'; e.style.top = y + 'px'; return e; };
    const lRidge = mkL(lab('ridge', 'ridge'), AX, 168, 'center big');
    const lNew = mkL(lab('new rock', 'new rock'), AX + 150, 646, 'big');
    const legend = K.el('div', { class: 'c0-label' }, st); legend.style.left = AX + 'px'; legend.style.top = '640px'; legend.style.transform = 'translateX(-50%)';
    legend.innerHTML = `<span style="display:inline-block;width:40px;height:26px;vertical-align:-4px;margin-right:12px;background:var(--b)"></span>${K.esc(lab('normal', 'normal'))}` +
      `<span style="display:inline-block;width:40px;height:26px;vertical-align:-4px;margin:0 12px 0 56px;background:var(--b-neg);outline:2px solid var(--matter)"></span>${K.esc(lab('reversed', 'reversed'))}`;
    // ---- the strip (after the morph): time axis, sign trace, caption
    const SX0 = 280, SX1 = 1640, SY = 500, SH = 56;
    const tsvg = K.svgLayer(ctx, 12); const axG = K.s('g', {}, tsvg);
    const xOf = (ma) => SX1 - (SX1 - SX0) * (ma - w0) / (w1 - w0);
    for (let m = w1; m >= w0; m--) { K.s('line', { x1: xOf(m), x2: xOf(m), y1: SY + SH, y2: SY + SH + 12, stroke: K.c('muted'), 'stroke-width': 2 }, axG);
      K.s('text', { x: xOf(m), y: SY + SH + 50, 'text-anchor': 'middle', class: 'kt-tick' }, axG, String(m)); }
    K.s('text', { x: (SX0 + SX1) / 2, y: SY + SH + 100, 'text-anchor': 'middle', class: 'kt-axis' }, axG, lab('millions of years ago', 'millions of years ago'));
    const TY0 = 384, TY1 = 444;   // sign trace: north up, south down
    let d = ''; runs.slice().reverse().forEach((r, i) => { const y = r.s > 0 ? TY0 : TY1; d += `${i ? 'L' : 'M'}${xOf(r.b).toFixed(1)},${y} L${xOf(r.a).toFixed(1)},${y} `; });
    const trace = K.s('path', { d, fill: 'none', stroke: K.c('b'), 'stroke-width': 3.5, 'stroke-linejoin': 'round' }, tsvg);
    const tl = trace.getTotalLength(); trace.style.strokeDasharray = `${tl} ${tl + 10}`;
    const lN = mkL(lab('north', 'north'), SX0 - 24, TY0 - 22, 'right'), lS = mkL(lab('south', 'south'), SX0 - 24, TY1 - 22, 'right');
    const cap = mkL(lab('about 20 flips in 5 million years · no schedule', 'about 20 flips in 5 million years · no schedule'), 960, 270, 'center big');
    // ---- HUD
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    K.chip(ctx, { text: 'SCHEMATIC', kind: 'schematic', x: 1824, y: 880, anchor: 'br', at: 'ridge-0.15', out: 'uneven-0.3' });
    const ref = chips.find((c) => /^REFERENCE/i.test(c)) || 'REFERENCE · Vine & Matthews 1963 · polarity ages: Cande & Kent 1995';
    const LT = K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: ref.split('·').slice(1).map((x) => x.trim()).join(' · '), at: 'uneven+0.2', out: '_tail' });
    const l2 = LT.root.querySelector('.l2'); l2.style.whiteSpace = 'nowrap'; K.fit(l2, 858, 44, 28, ctx);   // one line (it wrapped to three)
    // ---- timing; sound: one tick per polarity boundary, from the same mapping that draws the stripes
    const T = { rid: ctx.at('ridge-0.15'), gr: ctx.at('grains-0.15'), sp: ctx.at('spread-0.15'), un: ctx.at('uneven-0.15') };
    T.s0 = T.sp + 0.9; T.s1 = Math.max(T.s0 + 2.5, T.un - 0.35);
    const tOfMa = (ma) => T.s0 + (T.s1 - T.s0) * (w1 - ma) / (w1 - w0);
    window.__EVENTS__ = flips.map((m) => ({ t: +tOfMa(m).toFixed(3), id: 'tick', gain_db: -30 }));
    ctx.c0 = { grp, svg, magma, leftG, rightG, L, R, runs, grains, arr, lRidge, lNew, legend, axG, trace, tl, lN, lS, cap, frame, crustG, T, AX, HW, v, CY0, CY1, SX0, SX1, SY, SH, w0, w1, flips };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c0, T = c.T;
    const fade = (el, a, b) => { const o = S.seg(t, a, a + 0.25, S.ease.linear) * (b === undefined ? 1 : 1 - S.seg(t, b, b + 0.25, S.ease.linear)); el.style.opacity = o.toFixed(3); K.show(el, o > 0); };
    // zoom: in on 'grains', out on 'spread'
    const zi = S.seg(t, T.gr, T.gr + 0.9, S.ease.inOutCubic) * (1 - S.seg(t, T.sp, T.sp + 0.8, S.ease.inOutCubic));
    const z = 1 + 1.1 * zi, fx = c.AX, fy = 300;
    const mo = S.seg(t, T.un, T.un + 1.6, S.ease.inOutCubic);     // the morph to the strip
    c.grp.style.transform = `translate(${(fx * (1 - z)).toFixed(2)}px, ${(fy * (1 - z) + 40 * (1 - S.seg(t, T.rid, T.rid + 0.6, S.ease.outCubic))).toFixed(2)}px) scale(${z.toFixed(4)})`;
    c.grp.style.opacity = S.seg(t, -0.4, T.rid + 0.4, S.ease.linear).toFixed(3);
    // everything but the left stripes leaves during the morph
    const rest = (1 - S.seg(t, T.un, T.un + 0.6, S.ease.linear)).toFixed(3);
    Array.from(c.svg.children).forEach((e) => { if (e !== c.leftG) e.style.opacity = rest; });
    c.magma.style.opacity = (rest * (0.55 + 0.1 * Math.sin(2 * Math.PI * t / 2.3))).toFixed(3);
    // time: 5 Ma ago -> today during the spreading
    const ps = S.seg(t, T.s0, T.s1, S.ease.linear), tc = c.w1 - (c.w1 - c.w0) * ps, spreading = t >= T.s0;
    const polNow = (c.runs.find((r) => tc >= r.a && tc <= r.b) || c.runs[0]).s;
    c.runs.forEach((r, i) => {
      let a = 0, b = 0;
      if (spreading && r.b > tc) { a = c.v * (Math.max(r.a, tc) - tc); b = c.v * (r.b - tc); if (b - a < 2) b = a + 2; }
      if (!spreading && t >= T.gr + 0.4 && r === c.runs[c.runs.length - 1]) { a = 0; b = 26 * S.seg(t, T.gr + 0.4, T.gr + 1.6, S.ease.outCubic); }   // the first new rock at the axis
      c.L[i].setAttribute('x', (c.AX - b).toFixed(2)); c.L[i].setAttribute('width', Math.max(0, b - a).toFixed(2));
      c.R[i].setAttribute('x', (c.AX + a).toFixed(2)); c.R[i].setAttribute('width', Math.max(0, b - a).toFixed(2));
    });
    // field arrow: in on 'grains', flips with each boundary (fast 0.12 s turn)
    let ang = polNow > 0 ? 0 : 180;
    const ao = S.seg(t, T.gr, T.gr + 0.3, S.ease.linear);
    c.arr.setAttribute('transform', `translate(${c.AX} ${200}) rotate(${ang})`); c.arr.style.opacity = (ao * rest).toFixed(3);
    // grains rotate into line with the field, then freeze; gone once the spreading starts
    c.grains.forEach((g) => { const p = S.seg(t, T.gr + 0.5 + g.d, T.gr + 1.6 + g.d, S.ease.inOutCubic);
      g.el.setAttribute('transform', `translate(${g.x} ${g.y}) rotate(${(g.a0 * (1 - p)).toFixed(2)})`);
      g.el.style.opacity = (S.seg(t, T.gr + 0.2, T.gr + 0.5, S.ease.linear) * (1 - S.seg(t, T.sp, T.sp + 0.4, S.ease.linear))).toFixed(3); });
    // labels
    fade(c.lRidge, T.rid + 0.2, T.gr); fade(c.lNew, T.gr + 1.0, T.sp); fade(c.legend, T.sp + 0.6, T.un);
    // morph: left half (5 Ma at x = AX - HW, today at the axis) -> the strip
    const sx = 1 + ((c.SX1 - c.SX0) / c.HW - 1) * mo, sy = 1 + (c.SH / (c.CY1 - c.CY0) - 1) * mo;
    const x0 = c.AX - c.HW, tx = x0 + (c.SX0 - x0) * mo, ty = c.CY0 + (c.SY - c.CY0) * mo;
    c.leftG.setAttribute('transform', `translate(${(tx - x0 * sx + (z - 1) * 0).toFixed(2)} ${(ty - c.CY0 * sy).toFixed(2)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)})`);
    c.axG.style.opacity = S.seg(t, T.un + 1.2, T.un + 1.6, S.ease.linear).toFixed(3);
    c.trace.style.strokeDashoffset = (c.tl * (1 - S.seg(t, T.un + 1.4, T.un + 2.6, S.ease.inOutSine))).toFixed(2);
    c.trace.style.opacity = t >= T.un + 1.4 ? 1 : 0;
    fade(c.lN, T.un + 1.4); fade(c.lS, T.un + 1.4); fade(c.cap, T.un + 2.4);
  },
});
</script></body></html>
