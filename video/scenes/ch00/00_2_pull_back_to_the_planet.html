<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>00.2 Pull back to the planet</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch00.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch00_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 00.2 Pull back to the planet (L0, NIGHT, CONTEXT, SCHEMATIC chip). Flat T2 scale dive in reverse: the
   00.1 compass shrinks on a log scale onto a grey tabletop, then a point on a matte grey Earth; on 'permanent'
   dipole field lines (axis tilted by params.dipole_tilt_deg) bloom around the sphere; on 'not' they thin once;
   in the tail the view starts to dive toward one ocean (00.3 opens on the ridge). */
Scene.define({
  duration: 7.5,
  register: 'night',
  cues: { planet: 0.3, permanent: 4.9, not: 6.0 },
  params: { dipole_tilt_deg: 9.4, size: 560, cx: 960, cy: 440, earth_r: 250 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage;
    const chips = (ctx.script.onscreen && ctx.script.onscreen.chips) || [];
    // zoom group: compass + tabletop (scaled by the dive)
    const grp = K.el('div', { class: 'c0-grp', 'data-qa': 'ignore' }, st); grp.style.zIndex = 15;   // QA: the 00.1 compass shrinking in the dive (its N/S letters pass under 28 px while they vanish)
    const tsvg = K.svgLayer(ctx, 12, grp);
    const table = K.s('rect', { x: P.cx - 900, y: P.cy - 640, width: 1800, height: 1280, rx: 40, fill: K.c('matter-dark'), stroke: K.c('matter'), 'stroke-width': 6 }, tsvg);
    K.needle(ctx, { x: P.cx, y: P.cy, size: P.size, at: -0.4, parent: grp });
    // the Earth: matte grey sphere (matter is grey), a soft terminator, faint latitude lines
    const esvg = K.svgLayer(ctx, 8); const defs = K.s('defs', {}, esvg);
    K.s('rect', { x: 0, y: 0, width: 1920, height: 880 }, K.s('clipPath', { id: 'c0clip' }, defs));   // keep the subtitle band clear during the dive
    const eg = K.s('g', {}, K.s('g', { 'clip-path': 'url(#c0clip)' }, esvg));
    const grad = K.s('radialGradient', { id: 'c0earth', cx: '38%', cy: '34%', r: '75%' }, defs);
    K.s('stop', { offset: '0%', 'stop-color': K.c('matter') }, grad); K.s('stop', { offset: '100%', 'stop-color': K.c('matter-dark') }, grad);
    K.s('circle', { cx: 0, cy: 0, r: P.earth_r, fill: 'url(#c0earth)', stroke: K.c('matter'), 'stroke-width': 2 }, eg);
    [-50, -25, 0, 25, 50].forEach((lat) => { const y = -P.earth_r * Math.sin(lat * Math.PI / 180), rx = P.earth_r * Math.cos(lat * Math.PI / 180);
      K.s('ellipse', { cx: 0, cy: y, rx, ry: rx * 0.16, fill: 'none', stroke: K.c('bg'), 'stroke-width': 2, opacity: 0.35 }, eg); });
    K.s('line', { x1: 0, y1: -P.earth_r - 30, x2: 0, y2: P.earth_r + 30, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '6 8' }, eg);   // spin axis
    const dot = K.s('circle', { cx: 0, cy: -P.earth_r * 0.55, r: 6, fill: K.c('fg-2') }, eg);   // where the compass sat
    // field lines (canvas, drawn on from 'permanent')
    const L = K.canvasLayer(ctx, 6, { x: 0, y: 0, w: 1920, h: 880 }, null, { reset: true });
    const Ls = [1.35, 1.7, 2.15, 2.75, 3.5].map((k) => k * P.earth_r);
    const lines = C0.dipoleLines(P.cx, P.cy, Ls, P.dipole_tilt_deg, P.earth_r + 4);
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    K.chip(ctx, { text: 'SCHEMATIC', kind: 'schematic', x: 1824, y: 880, anchor: 'br', at: 'planet-0.15' });
    const ref = chips.find((c) => /^REFERENCE/i.test(c)) || 'REFERENCE · NOAA NCEI · close to a dipole field';
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: ref.split('·').slice(1).map((x) => x.trim()).join(' · '), at: 'permanent-0.15', hold: 4 });
    ctx.c0 = { grp, table, eg, dot, L, lines, T: { z0: ctx.at('planet-0.15'), perm: ctx.at('permanent-0.15'), not: ctx.at('not-0.15') } };
    ctx.c0.T.z1 = Math.min(ctx.c0.T.z0 + 3.5, ctx.c0.T.perm - 0.2);
  },
  render(t, ctx) {
    const S = Scene, K = Kit, P = ctx.params, c = ctx.c0, T = c.T;
    // log-scale pull-back: compass scale 1 -> 1e-3 (it lands on the dot on the sphere)
    const p = S.seg(t, T.z0, T.z1, S.ease.inOutCubic);
    const zc = Math.pow(10, -3 * p);
    const dx = P.cx, dy = P.cy - P.earth_r * 0.55;          // the dot on the sphere (final position of the compass)
    const ex = P.cx + (P.cx - dx) * 0, ey = P.cy;
    // the earth grows from a point (scale ze) while the compass shrinks; tie them so the compass sits on the dot
    const ze = Math.min(1, Math.pow(10, 3 * (p - 1)) * 1);
    // dive in the tail: zoom toward an ocean point (right of centre) after 'not'
    const dv = S.seg(t, T.not + 0.7, ctx.duration, S.ease.inOutCubic), zd = Math.pow(10, 0.7 * dv), ox = P.cx + 90, oy = P.cy + 40;
    const cxE = (x) => ox + (x - ox) * zd, cyE = (y) => oy + (y - oy) * zd;
    // compass centre follows the dot as the earth grows: dot position at scale ze around (ex, ey) = (cx, cy - 0.55 R ze)
    const ccx = P.cx, ccy = P.cy + (dy - P.cy) * ze;
    const sComp = zc;
    c.grp.style.transform = `translate(${(ccx - P.cx * sComp).toFixed(2)}px, ${(ccy - P.cy * sComp).toFixed(2)}px) scale(${sComp.toFixed(5)})`;
    c.grp.style.opacity = (1 - S.seg(t, T.z0 + 0.75 * (T.z1 - T.z0), T.z1, S.ease.linear)).toFixed(3);
    K.show(c.grp, p < 1);
    c.table.style.opacity = S.seg(t, T.z0, T.z0 + 0.25 * (T.z1 - T.z0), S.ease.linear).toFixed(3);   // 00.1 ends on the bare compass
    c.eg.setAttribute('transform', `translate(${cxE(ex).toFixed(2)} ${cyE(ey).toFixed(2)}) scale(${(ze * zd).toFixed(5)})`);
    c.eg.style.opacity = S.seg(t, T.z0 + 0.3 * (T.z1 - T.z0), T.z0 + 0.6 * (T.z1 - T.z0), S.ease.linear).toFixed(3);
    c.dot.style.opacity = (1 - S.seg(t, T.z1, T.z1 + 0.4, S.ease.linear)).toFixed(3);
    // field lines: bloom on 'permanent', breathe, thin once on 'not'
    const g = c.L.g; g.clearRect(0, 0, 1920, 1080);
    const pr = S.seg(t, T.perm, T.perm + 1.2, S.ease.inOutSine);
    if (pr > 0) {
      const flick = Math.sin(Math.PI * S.seg(t, T.not, T.not + 0.5, S.ease.linear));
      const br = 1 + 0.012 * Math.sin(2 * Math.PI * (t - T.perm) / 3.2);
      g.translate(ox, oy); g.scale(zd, zd); g.translate(-ox, -oy);
      g.translate(P.cx, P.cy); g.scale(br, br); g.translate(-P.cx, -P.cy);
      K.drawLines(g, c.lines, { color: 'b', width: 3.2 * (1 - 0.6 * flick), alpha: 0.95, progress: pr });
      // arrowheads: outside the planet the field runs from the south pole to the north pole
      g.fillStyle = K.c('b');
      for (const Lp of c.lines) {
        const i = Math.floor(Lp.length / 2); if (pr < 0.6 || i < 2) continue;
        const [x1, y1] = Lp[i - 1], [x0, y0] = Lp[i + 1], a = Math.atan2(y1 - y0, x1 - x0), x = Lp[i][0], y = Lp[i][1], h = 16;
        g.globalAlpha = S.seg(pr, 0.6, 1, S.ease.linear);
        g.beginPath(); g.moveTo(x + h * Math.cos(a), y + h * Math.sin(a)); g.lineTo(x + h * 0.6 * Math.cos(a + 2.3), y + h * 0.6 * Math.sin(a + 2.3)); g.lineTo(x + h * 0.6 * Math.cos(a - 2.3), y + h * 0.6 * Math.sin(a - 2.3)); g.closePath(); g.fill();
      }
    }
  },
});
</script></body></html>
