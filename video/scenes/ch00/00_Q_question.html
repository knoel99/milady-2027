<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ch00.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch00.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch00_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* ch00.Q (question card Q1, no claim, no badge). Everything on the card comes from the script's "question".
   Behind it, at 10 % opacity, the polarity strip of 00.3 (params.normal_Ma) drifts slowly: a texture. */
Scene.define({
  duration: 9.5,
  register: 'night',
  cues: { q: 0.5 },
  params: { bg_opacity: 0.1, window_Ma: [0, 5], normal_Ma: [[0.0, 0.78], [0.99, 1.07], [1.201, 1.211], [1.77, 1.95], [2.14, 2.15], [2.581, 3.04], [3.11, 3.22], [3.33, 3.58], [4.18, 4.29], [4.48, 4.62], [4.8, 4.89], [4.98, 5.23]] },
  setup(ctx) {
    const K = Kit, P = ctx.params;
    const svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: P.bg_opacity }, svg);
    const runs = C0.runs(P.normal_Ma, P.window_Ma), [w0, w1] = P.window_Ma, X0 = 60, X1 = 1860;
    const xOf = (m) => X1 - (X1 - X0) * (m - w0) / (w1 - w0);
    [70, 820].forEach((y) => runs.forEach((r) => K.s('rect', { x: xOf(r.b), y, width: Math.max(3, xOf(r.a) - xOf(r.b)), height: 40, fill: K.c(r.s > 0 ? 'b' : 'b-neg') }, bg)));
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'ch00', category: 'runs', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-8 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
