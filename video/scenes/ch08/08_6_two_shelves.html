<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>08.6 Two shelves</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch08.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch08_kit.js"></script>
<style>
  .tool { position: absolute; z-index: 22; font-size: 28px; color: var(--fg); white-space: nowrap; }
  .tool .v { display: inline-block; width: 34px; font-weight: 700; }
  .sub { position: absolute; z-index: 22; font-size: 28px; color: var(--fg-2); width: 230px; line-height: 1.2; text-align: center; transform: translateX(-50%); }
  .klass { position: absolute; z-index: 22; font-size: 32px; color: var(--fg-2); white-space: nowrap; transform: translateX(-50%); }
  .klass .katex { font-size: 32px; }
</style>
</head><body><div id="stage"></div>
<script>
/* 08.6 Two shelves (L4, NIGHT, PROVED: Def. 3.3, Prop. 1, 4, Cor. 6; measured in E1, E2). The shelves of ch07, now
   full: the every-snapshot shelf holds the divergence (built in or projected: exact; penalty: approximate) and two faint
   cards not tested here; the crowd shelf holds the budget (crowd loss works; reweighting fails where the model is poor;
   forcing each snapshot makes a spike) and the mirror (a crowd law a network carries exactly). One rule; then the formal
   row of the report's classes C1-C4. No number, no data file. */
Scene.define({
  duration: 40,
  register: 'night',
  cues: { fill: 0.5, every: 2.6, crowd: 9.8, mirror: 19.6, rule: 27.0 },
  params: { shelves: { variant_08_6: { label_y: 150, card_y: [200, 360], plank_y: 370, tags_y: [400, 610], left: [160, 900], right: [1020, 1760] } }, formal_row_y: 690, key_y: 760 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, V6 = P.shelves.variant_08_6;
    const T = {}; for (const k of ['fill', 'every', 'crowd', 'mirror', 'rule']) T[k] = ctx.at(k + '-0.15');
    const sent = (cue) => (ctx.script.sentences || []).find((x) => x.cue === cue), fr = (cue, f, fb) => { const s = sent(cue); return s ? s.start + f * (s.end - s.start) : ctx.at(cue) + fb; };
    const root = K.el('div', {}, st); root.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:120px 64px';
    const svg = K.svgLayer(ctx, 20, root);
    const slotX = (sh, i) => { const [a, b] = V6[sh]; return a + (b - a) / 3 * (i + 0.5); };
    [['left', 'true for every snapshot', 'chalk'], ['right', 'true only for the crowd', 'metric']].forEach(([sh, txt, col]) => {
      const [a, b] = V6[sh]; K.s('line', { x1: a, x2: b, y1: V6.plank_y, y2: V6.plank_y, stroke: K.c('fg-2'), 'stroke-width': 6, 'stroke-linecap': 'round' }, svg);
      const l = C8.lab(ctx, txt, a + 50, V6.label_y - 20, 'big', { parent: root }); l.style.zIndex = 22;
      K.s('rect', { x: a, y: V6.label_y - 22, width: 30, height: 40, rx: 4, fill: 'none', stroke: K.c(col), 'stroke-width': 3 }, svg);
    });
    const card = (sh, i, title, faint) => { const g = K.s('g', { transform: `translate(${slotX(sh, i) - 60} ${V6.card_y[0]})` }, svg);
      K.s('rect', { width: 120, height: 160, rx: 10, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 3 }, g);
      K.s('text', { x: 60, y: 148, 'text-anchor': 'middle', class: 'kt-label', style: 'font-size:28px' }, g, title); if (faint) g.setAttribute('data-faint', 1); return g; };
    const glyphs = {
      div: (g) => { K.s('rect', { x: 26, y: 40, width: 68, height: 52, rx: 4, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3, 'stroke-dasharray': '7 5' }, g); K.s('path', { d: 'M48,60 L72,60 M48,72 L72,72', stroke: K.c('chalk'), 'stroke-width': 4 }, g); },
      walls: (g) => { K.s('line', { x1: 30, x2: 30, y1: 30, y2: 110, stroke: K.c('fg-2'), 'stroke-width': 6 }, g); [50, 70, 90].forEach((y) => K.s('path', { d: `M34,${y} Q70,${y - 14} 100,${y}`, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, g)); },
      nonlin: (g) => { K.s('path', { d: 'M20,100 Q60,20 100,70', fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 4 }, g); },
      budget: (g) => { K.s('line', { x1: 60, y1: 40, x2: 60, y2: 108, stroke: K.c('metric'), 'stroke-width': 4 }, g); K.s('line', { x1: 24, y1: 56, x2: 96, y2: 56, stroke: K.c('metric'), 'stroke-width': 4 }, g); [24, 96].forEach((x) => K.s('path', { d: `M${x - 16},76 Q${x},96 ${x + 16},76 Z`, fill: 'none', stroke: K.c('metric'), 'stroke-width': 3 }, g)); },
      mirror: (g) => { K.s('line', { x1: 30, y1: 110, x2: 90, y2: 40, stroke: K.c('fg-2'), 'stroke-width': 3, 'stroke-dasharray': '6 6' }, g); K.s('circle', { cx: 38, cy: 100, r: 10, fill: K.c('b-neg') }, g); K.s('circle', { cx: 82, cy: 50, r: 10, fill: K.c('b') }, g); },
    };
    const cards = {
      div: card('left', 0, 'divergence'), walls: card('left', 1, 'walls', true), nonlin: card('left', 2, 'nonlinear', true),
      budget: card('right', 0, 'budget'), mirror: card('right', 1, 'mirror'),
    };
    Object.entries(cards).forEach(([k, g]) => glyphs[k](g));
    const sub = (k, sh, i, txt) => { const e = K.el('div', { class: 'sub' }, root, txt); e.style.left = slotX(sh, i) + 'px'; e.style.top = (V6.plank_y + 14) + 'px'; return e; };
    const subs = { div: sub('div', 'left', 0, 'lines never start or stop'), walls: sub('walls', 'left', 1, 'boundary conditions · later in the film'), nonlin: sub('nonlin', 'left', 2, 'laws of one field · not tested here'),
      budget: sub('budget', 'right', 0, 'on average, energy in = energy out'), mirror: sub('mirror', 'right', 1, 'each snapshot lopsided, the crowd balanced') };
    const tool = (x, y, txt, v, col) => { const e = K.el('div', { class: 'tool' }, root); e.innerHTML = `<span class="v" style="color:var(--${col || 'chalk'})">${v}</span>${K.esc(txt)}`; e.style.left = x + 'px'; e.style.top = y + 'px'; return e; };
    const ty = V6.plank_y + 130;
    const tools = [
      [tool(V6.left[0], ty, 'hill maps (potentials) · exact', '✓'), fr('every', 0.45, 2.0)], [tool(V6.left[0], ty + 40, 'projection · exact', '✓'), fr('every', 0.6, 2.6)], [tool(V6.left[0], ty + 80, 'penalty · approximate', '≈'), fr('every', 0.85, 4.0)],
      [tool(V6.right[0], ty, 'crowd loss, during training · works', '✓', 'metric'), fr('crowd', 0.3, 2.0)], [tool(V6.right[0], ty + 40, 'reweighting, afterwards · fails where the model is poor', '✗', 'metric'), fr('crowd', 0.55, 4.0)],
      [tool(V6.right[0], ty + 80, 'forced on each snapshot · harmful: the spike', '✗', 'metric'), fr('crowd', 0.8, 6.0)], [tool(V6.right[0], ty + 120, 'built into the network · exact', '✓', 'model'), fr('mirror', 0.6, 3.0)],
    ];
    tools[6][0].lastChild && (tools[6][0].style.color = K.c('model'));
    const rule = C8.lab(ctx, 'Enforce each law where it is true', 960, 700, 'lead center');
    K.pen(ctx, { kind: 'box', box: { x: 620, y: 698, w: 680, h: 54 }, pad: 10, at: 'rule+1.4', dur: 0.5, seed: 'rule86' });
    const ruleSub = C8.lab(ctx, 'respect each law where it holds: exactly, or on average', 120, 652, 'small');
    const klass = [['C1 · $\\mathbf{x} \\in \\ker A$', (slotX('left', 0) + slotX('left', 1)) / 2], ['C2 · $c(\\mathbf{x}) = 0$', slotX('left', 2)], ['C3 · $g_{\\#}\\mu = \\mu$', slotX('right', 1) + 40], ['C4 · $\\mathbb{E}_{\\mu}[\\mathcal{L}\\varphi] = 0$', slotX('right', 0) - 50]]
      .map(([tx, x]) => { const e = K.el('div', { class: 'klass', html: K.markup(tx) }, st); e.style.left = x + 'px'; e.style.top = (P.key_y + 8) + 'px'; return e; });
    const key = C8.lab(ctx, 'μ: the stationary distribution (long-exposure glow) · 𝓛φ: rate of change of φ given by the equations', 960, P.key_y + 54, 'small center');
    K.chip(ctx, { text: 'redrawn taxonomy · report Figure 3 and Definition 3.3', kind: 'plain', x: 1824, y: 860, anchor: 'br', at: 'fill+0.5', out: 'rule+2.0', caps: false });
    K.badge(ctx, { kind: 'PROVED', note: 'Def. 3.3 · Prop. 1, 4 · Cor. 6 · measured in E1, E2', at: -0.3 });
    ctx.c = { T, root, cards, subs, tools, rule, ruleSub, klass, key };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.c, T = c.T;
    const g = S.seg(t, T.fill, T.fill + 1.2, S.ease.inOutCubic), sc = 0.45 + 0.55 * g;
    void sc; c.root.style.opacity = (0.6 + 0.4 * g).toFixed(3);
    const on = { div: T.every, walls: T.every + 2.5, nonlin: T.every + 2.8, budget: T.crowd, mirror: T.mirror };
    Object.entries(c.cards).forEach(([k, e]) => { const faint = e.getAttribute('data-faint') ? 0.4 : 1; C8.fadeS(e, t, k === 'budget' || k === 'mirror' || k === 'div' ? -1 : on[k], Infinity, 0.3, faint); });
    Object.entries(c.subs).forEach(([k, e]) => C8.fade(e, t, on[k] + 0.3, Infinity, 0.25, k === 'walls' || k === 'nonlin' ? 0.6 : 1));
    c.tools.forEach(([e, a]) => C8.fade(e, t, a));
    C8.fade(c.rule, t, T.rule + 0.2); C8.fade(c.ruleSub, t, T.rule + 1.0);
    c.klass.forEach((e) => C8.fade(e, t, T.rule + 2.0)); C8.fade(c.key, t, T.rule + 2.3);
  },
});
</script></body></html>
