<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ch08.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch08.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch08_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* ch08.Q Question for the supervisors (framing). The card fills the frame; behind it at 10 %, the left plank of 08.6
   with the divergence card and the faint walls card. */
Scene.define({
  duration: 9.2,
  register: 'night',
  cues: { q: 0.5 },
  params: { backdrop: { opacity: 0.1 } },
  setup(ctx) {
    const K = Kit, P = ctx.params, svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: P.backdrop.opacity }, svg);
    svg.setAttribute('data-qa', 'ignore');   // a 10 % backdrop under the card
    K.s('line', { x1: 200, x2: 1100, y1: 640, y2: 640, stroke: K.c('fg-2'), 'stroke-width': 10 }, bg);
    [[300, 1], [560, 0.4]].forEach(([x, o]) => { const g = K.s('g', { transform: `translate(${x} 360) scale(1.7)`, opacity: o }, bg); K.s('rect', { width: 120, height: 160, rx: 10, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, g); });
    K.s('rect', { x: 345, y: 430, width: 115, height: 88, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 5, 'stroke-dasharray': '12 9' }, bg);
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'ch08', category: 'framing', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-6 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
