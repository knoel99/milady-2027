<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>08.4 Why almost is not exactly</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch08.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch08_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 08.4 Why almost is not exactly (L3, NIGHT, PROVED: Proposition 2 (c)-(d); the picture is schematic). The part of a
   field breaking the law is a ball on a spring above the line of divergence-free fields. The ideal wind brings it
   exactly to the line only with a stiffness 1/(1 − t) that blows up at the end; a bounded network (stiffness capped at
   K) with finite steps leaves a gap y0/(K e). No number on screen, no data file. */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { why: 0.5, stray: 4.6, spring: 6.6, capped: 14.6, gap: 19.4 },
  params: { y0: 1.0, K: 4.0, steps: 8, run_s: 3.5, line: { x0: 260, x1: 1300, y: 560 }, ball_x: 780, ball_y0: 250, meter: { x: 1560, y0: 180, y1: 640 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params;
    const T = {}; for (const k of ['why', 'stray', 'spring', 'capped', 'gap']) T[k] = ctx.at(k + '-0.15');
    C8.shelves(ctx, {});
    const svg = K.svgLayer(ctx, 12), L = P.line, px = (L.y - P.ball_y0) / P.y0;   // px per model unit of height
    K.s('line', { x1: L.x0, x2: L.x1, y1: L.y, y2: L.y, stroke: K.c('fg'), 'stroke-width': 4 }, svg);
    C8.lab(ctx, 'divergence-free fields', L.x0, L.y + 12, '');
    const bar = K.s('g', {}, svg), by = L.y + 90;
    K.s('rect', { x: L.x0, y: by, width: L.x1 - L.x0, height: 10, fill: K.c('model'), opacity: 0.2 }, bar);
    const fill = K.s('rect', { x: L.x0, y: by, height: 10, width: 0, fill: K.c('model') }, bar);
    const lT = C8.lab(ctx, 't · transport time', (L.x0 + L.x1) / 2, by + 20, 'small center'), l0 = C8.lab(ctx, '0', L.x0, by + 20, 'small center'), l1 = C8.lab(ctx, '1', L.x1, by + 20, 'small center');
    // meter
    const Mt = P.meter, mh = Mt.y1 - Mt.y0, vTop = 2.2 * P.K, my = (v) => Mt.y1 - mh * Math.min(1, v / vTop), mG = K.s('g', {}, svg);
    K.s('rect', { x: Mt.x - 30, y: Mt.y0, width: 60, height: mh, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, mG);
    const mA = K.s('rect', { x: Mt.x - 26, width: 52, fill: K.c('model'), opacity: 0.8 }, mG), mB = K.s('rect', { x: Mt.x - 26, width: 52, fill: K.c('fg-2') }, mG);
    const ceil = K.s('line', { x1: Mt.x - 44, x2: Mt.x + 44, y1: my(P.K), y2: my(P.K), stroke: K.c('fg-2'), 'stroke-width': 6 }, mG);
    const up = K.s('text', { x: Mt.x, y: Mt.y0 - 12, 'text-anchor': 'middle', style: 'font: 700 40px Inter', fill: K.c('model') }, mG, '↑');
    const lM = C8.lab(ctx, 'stiffness needed', Mt.x, Mt.y1 + 12, 'small center'), lInf = C8.lab(ctx, 'needs infinite stiffness at the end', Mt.x - 60, Mt.y0 + 20, 'small right', { w: 300 }); lInf.style.textAlign = 'right';
    const lBn = C8.lab(ctx, 'bounded network', Mt.x - 60, my(P.K) - 20, 'small right');
    // ball, spring; the two runs
    const ghost = K.s('g', { opacity: 0 }, svg), live = K.s('g', {}, svg);
    const mk = (g, col) => ({ spring: K.s('polyline', { fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, g), ball: K.s('circle', { r: 26, fill: K.c(col) }, g) });
    const A = mk(ghost, 'model'), B = mk(live, 'model');
    const lPart = C8.lab(ctx, 'the part that breaks the law', P.ball_x + 50, P.ball_y0 - 20, '');
    const lSteps = C8.lab(ctx, 'finite steps', P.ball_x + 60, L.y - 120, 'small');
    K.pen(ctx, { kind: 'check', box: { x: P.ball_x + 40, y: L.y - 70, w: 50, h: 50 }, at: T.spring + 0.15 + P.run_s, out: 'capped', dur: 0.4, seed: 'ok84' });
    // the capped run: y(t) = y0 (1 − t) until 1 − 1/K, then y0/K e^{−K (t − (1 − 1/K))}; hops at the step boundaries
    const tk = 1 - 1 / P.K, yCap = (t) => (t <= tk ? P.y0 * (1 - t) : P.y0 / P.K * Math.exp(-P.K * (t - tk)));
    const gapY = L.y - yCap(1) * px, brk = K.s('path', { d: `M${P.ball_x - 70},${gapY} L${P.ball_x - 80},${gapY} L${P.ball_x - 80},${L.y} L${P.ball_x - 70},${L.y}`, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 4 }, svg);
    const lGap = C8.lab(ctx, 'bounded network: a gap remains', P.ball_x - 100, gapY - 70, 'small right');
    const lAlm = C8.lab(ctx, 'almost ≠ exactly', 780, 740, 'lead center');
    const thumb = K.s('g', {}, svg);
    K.s('line', { x1: 200, x2: 200, y1: 230, y2: 400, stroke: K.c('muted'), 'stroke-width': 3 }, thumb); K.s('line', { x1: 176, x2: 224, y1: 244, y2: 244, stroke: K.c('model'), 'stroke-width': 5 }, thumb);
    K.s('text', { x: 250, y: 330, style: 'font: 700 64px Inter Display', fill: K.c('chalk') }, thumb, '?');
    K.chip(ctx, { text: 'SCHEMATIC · a spring, not the network', kind: 'schematic', x: 1824, y: 860, anchor: 'br', at: 'stray' });
    K.chip(ctx, { text: 'full statement: Proposition 2 and Remark 3.6 · extension X2.2', kind: 'plain', x: 96, y: 800, at: 'gap', caps: false, maxWidth: 700 });
    K.badge(ctx, { kind: 'PROVED', note: 'Prop. 2 (c), (d) · picture schematic', at: -0.3 });
    ctx.c = { T, px, A, B, ghost, live, fill, bar, lT, l0, l1, mA, mB, mG, ceil, up, my, lM, lInf, lBn, lPart, lSteps, tk, yCap, brk, lGap, lAlm, thumb };
  },
  render(t, ctx) {
    const S = Scene, P = ctx.params, c = ctx.c, T = c.T, L = P.line;
    const zig = (o, y) => { let pts = ''; const n = 14; for (let i = 0; i <= n; i++) { const yy = L.y - (L.y - y) * i / n, xx = P.ball_x + (i % 2 ? 14 : -14) * (i && i < n ? 1 : 0); pts += `${xx},${yy.toFixed(1)} `; } o.spring.setAttribute('points', pts); o.ball.setAttribute('cx', P.ball_x); o.ball.setAttribute('cy', (y - 26).toFixed(1)); };
    const tA = S.seg(t, T.spring + 0.15, T.spring + 0.15 + P.run_s, S.ease.linear), tB = S.seg(t, T.capped + 0.3, T.capped + 0.3 + P.run_s, S.ease.linear);
    const br = t > T.gap ? Math.sin(t * 3) : 0;
    const yA = L.y - (1 - tA) * P.y0 * c.px;
    const hop = (u) => { const k = Math.min(P.steps, Math.floor(u * P.steps)), f = u * P.steps - k, a = c.yCap(k / P.steps), b = c.yCap(Math.min(1, (k + 1) / P.steps)); return k >= P.steps ? c.yCap(1) : a + (b - a) * S.seg(f, 0.7, 1, S.ease.inOutCubic); };
    const yB = L.y - hop(tB) * c.px + br;
    const inBall = S.seg(t, T.stray, T.stray + 0.4, S.ease.linear), capOn = t >= T.capped;
    if (!capOn) { zig(c.B, yA); c.live.setAttribute('opacity', inBall); c.ghost.setAttribute('opacity', 0); }
    else { zig(c.A, L.y); zig(c.B, yB); c.ghost.setAttribute('opacity', 0.25); c.live.setAttribute('opacity', 1); }
    const tt = capOn ? tB : tA; c.fill.setAttribute('width', ((L.x1 - L.x0) * tt).toFixed(1)); C8.fadeS(c.bar, t, T.stray);
    [c.lT, c.l0, c.l1].forEach((e) => C8.fade(e, t, T.stray + 0.2));
    C8.fadeS(c.mG, t, T.spring); C8.fade(c.lM, t, T.spring);
    const vA = tA > 0 ? 1 / Math.max(1e-3, 1 - tA) : 0, vB = tB > 0 ? Math.min(1 / Math.max(1e-3, 1 - tB), P.K) : 0;
    const hA = c.my(0) - c.my(vA), hB = c.my(0) - c.my(vB);
    c.mA.setAttribute('y', c.my(vA)); c.mA.setAttribute('height', hA.toFixed(1)); c.mA.setAttribute('opacity', capOn ? 0.25 : 0.8);
    c.mB.setAttribute('y', c.my(vB)); c.mB.setAttribute('height', hB.toFixed(1)); c.mB.setAttribute('opacity', capOn ? 1 : 0);
    c.up.setAttribute('opacity', vA >= 2.2 * P.K ? 1 : 0); C8.fade(c.lInf, t, T.spring + 0.15 + P.run_s * 0.8, T.capped);
    C8.fadeS(c.ceil, t, T.capped); C8.fade(c.lBn, t, T.capped + 0.2);
    C8.fade(c.lPart, t, T.stray + 0.3, T.spring); C8.fade(c.lSteps, t, T.capped + 0.6);
    C8.fadeS(c.brk, t, T.gap + 0.2); C8.fade(c.lGap, t, T.gap + 0.4); C8.fade(c.lAlm, t, T.gap + 1.4);
    C8.fadeS(c.thumb, t, T.why, T.stray);
  },
});
</script></body></html>
