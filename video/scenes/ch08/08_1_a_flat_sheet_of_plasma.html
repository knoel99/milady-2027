<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>08.1 A flat sheet of plasma</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch08.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch08_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 08.1 A flat sheet of plasma (L3, NIGHT, MEASURED: E2 reference simulation, η = 0.00951). The declared side-step
   L4 → L3: whole fields instead of three dials. The periodic square (it tiles seamlessly), the swirl ω (blue family)
   and the current j (vermillion family) of two reference snapshots, the knob η with its trained / tested values, and
   the warning: a flat world cannot sustain a dynamo; a random forcing keeps the field alive. data/e2_maps.json, e2_eval. */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { bench: 3.6, square: 5.6, maps: 9.0, knob: 14.0, warning: 17.0, forced: 19.4 },
  data: { maps: 'data/e2_maps.json', ev: 'data/e2_eval.json' },
  params: { staircase: { lit: 1, done: [0], pending: [3, 4] }, rail: { from: 'L4', to: 'L3', tag: 'new test bench: from three numbers to whole fields' },
    square: { x: 700, y: 150, size: 520 }, tiling: { copies: 8, opacity: 0.35, wrap_dot_s: 2.0 }, maps: { size: 440, y: 170, x_left: 470, x_right: 1010, crossfade_s: 9.0 },
    eta_axis: { x0: 470, x1: 1450, y: 700, min: 0.0035, max: 0.026, log: true }, forcing_ring: { arrows: 10, pulse_s: 1.6 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, M = ctx.data.maps, EV = ctx.data.ev, R = M.variants.ref.samples;
    const T = {}; for (const k of ['bench', 'square', 'maps', 'knob', 'warning', 'forced']) T[k] = ctx.at(k + '-0.15');
    const title = (ctx.script.onscreen && ctx.script.onscreen.title) || 'Fields have stricter laws';
    K.chapterCard(ctx, { num: '08', title, level: P.rail.to, levelFrom: P.rail.from, tier: P.staircase.lit, pending: P.staircase.pending, at: -0.3, out: 'bench-0.4', railHold: 2.6 });
    const lRail = C8.lab(ctx, P.rail.tag, 120, 800, 'small');
    // the square, its tiling (periodic), the wrap dot
    const SQ = P.square, sq = { x: SQ.x, y: SQ.y, w: SQ.size, h: SQ.size };
    const tile = K.canvasLayer(ctx, 6, { x: 0, y: 56, w: 1920, h: 824 });
    const Gw = S.f32(R[0].omega), n = Gw.shape[1];
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) if (a || b) K.drawGrid(tile.g, Gw, n, n, { x: SQ.x + a * SQ.size, y: SQ.y - 56 + b * SQ.size, w: SQ.size, h: SQ.size, kind: 'u', vmax: M.vmax.omega });
    const big = C8.map(ctx, R[0].omega, 'u', M.vmax.omega, sq, { z: 7 });
    const svg = K.svgLayer(ctx, 14), dot = K.s('circle', { r: 9, fill: K.c('fg-2'), stroke: K.c('bg'), 'stroke-width': 2 }, svg);
    const frame = K.s('rect', { x: SQ.x, y: SQ.y, width: SQ.size, height: SQ.size, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 4 }, svg);
    const lWrap = C8.lab(ctx, 'leave on the right, come back on the left', SQ.x + SQ.size / 2, SQ.y + SQ.size + 14, 'center halo', { z: 31 });
    // two maps side by side, cross-fading between two reference snapshots
    const MP = P.maps, bl = { x: MP.x_left, y: MP.y, w: MP.size, h: MP.size }, br = { x: MP.x_right, y: MP.y, w: MP.size, h: MP.size };
    const w0 = C8.map(ctx, R[0].omega, 'u', M.vmax.omega, bl), w1 = C8.map(ctx, R[1].omega, 'u', M.vmax.omega, bl, { z: 9 });
    const j0 = C8.map(ctx, R[0].j, 'b', M.vmax.j, br), j1 = C8.map(ctx, R[1].j, 'b', M.vmax.j, br, { z: 9 });
    const lW = C8.lab(ctx, '', bl.x + bl.w / 2, MP.y + MP.size + 12, 'center'); lW.innerHTML = 'swirl of the flow · vorticity <span class="k-u">ω</span>';
    const lJ = C8.lab(ctx, '', br.x + br.w / 2, MP.y + MP.size + 12, 'center'); lJ.innerHTML = 'electric current <span class="k-b">j</span> · makes B';
    K.chip(ctx, { text: 'SIMULATED', kind: '', x: SQ.x + 8, y: SQ.y + 8, at: 'square', out: 'maps' });
    K.chip(ctx, { text: 'SIMULATED', kind: '', x: bl.x + 8, y: bl.y + 8, at: 'maps' });
    K.chip(ctx, { text: `display interpolation (spectral) · native grid ${M.native_grid[0]}²`, kind: 'plain', x: bl.x, y: MP.y - 50, at: 'maps+0.3', out: 'forced', caps: false });
    K.lowerThird(ctx, { kind: 'source', data: M, at: 'maps+0.5', hold: 4 });
    // knob η and its log axis
    const knobW = K.el('div', {}, st); knobW.style.cssText = 'position:absolute;left:0;top:0;width:1920px;height:1080px';
    K.knob(ctx, { parent: knobW, x: 250, y: 300, r: 70, min: 0, max: 1, keys: [{ at: 'knob', v: 0.2 }, { at: 'knob+0.4', v: 0.6, dur: 0.8 }], showValue: false, label: 'η' });
    const lKnob = C8.lab(ctx, 'η · magnetic diffusivity · how fast the field smudges', 110, 486, 'small', { w: 330 }); lKnob.style.color = K.c('param');
    const A = P.eta_axis, ax = (e) => A.x0 + (Math.log(e) - Math.log(A.min)) / (Math.log(A.max) - Math.log(A.min)) * (A.x1 - A.x0), axG = K.s('g', {}, svg);
    K.s('line', { x1: A.x0, x2: A.x1, y1: A.y, y2: A.y, stroke: K.c('param'), 'stroke-width': 4 }, axG);
    EV.config.eta_train.forEach((e) => K.s('circle', { cx: ax(e), cy: A.y, r: 10, fill: K.c('param') }, axG));
    EV.config.eta_test.forEach((e) => K.s('circle', { cx: ax(e), cy: A.y, r: 9, fill: K.c('bg'), stroke: K.c('param'), 'stroke-width': 3.5 }, axG));
    const lTr = C8.lab(ctx, 'trained', A.x0, A.y + 16, 'small'), lTe = C8.lab(ctx, 'tested · never seen in training', A.x0 + 150, A.y + 16, 'small'); [lTr, lTe].forEach((e) => { e.style.color = K.c('param'); });
    K.pen(ctx, { kind: 'circle', box: { x: ax(M.eta) - 12, y: A.y - 12, w: 24, h: 24 }, pad: 5, at: 'knob+1.0', dur: 0.4, seed: 'eta81' });
    const lEta = C8.lab(ctx, `η = ${K.fmt(M.eta, 3)} · test value`, A.x1 + 16, A.y - 20, 'small'); lEta.style.color = K.c('param');
    if (!EV.config.eta_test.some((e) => Math.abs(e - M.eta) < 1e-6)) S.warn('08.1: maps η is not a test value');
    // warning: a dynamo loop that tries to grow, crossed out; the forcing ring
    const loop = K.s('ellipse', { cx: 960, cy: 390, rx: 60, ry: 40, fill: 'none', stroke: K.c('b'), 'stroke-width': 6 }, K.svgLayer(ctx, 20));
    K.pen(ctx, { kind: 'cross', box: { x: 860, y: 310, w: 200, h: 160 }, at: 'warning+1.6', out: 'forced', dur: 0.4, seed: 'x81' });
    const lZel = C8.lab(ctx, 'not a dynamo: a flat flow cannot sustain a field (Zeldovich) · here B is kept alive by its own forcing', 110, 776, 'small', { w: 940 }); lZel.style.border = '2px solid var(--fg-2)'; lZel.style.borderRadius = '8px'; lZel.style.padding = '4px 12px';
    const ring = K.s('g', {}, svg), cx = br.x + br.w / 2, cy = br.y + br.h / 2;
    for (let i = 0; i < P.forcing_ring.arrows; i++) { const a = 2 * Math.PI * i / P.forcing_ring.arrows, r0 = br.w / 2 + 40, r1 = br.w / 2 + 12; const g = K.s('g', {}, ring);
      K.s('line', { x1: cx + r0 * Math.cos(a), y1: cy + r0 * Math.sin(a), x2: cx + r1 * Math.cos(a), y2: cy + r1 * Math.sin(a), stroke: K.c('fg-2'), 'stroke-width': 4, 'stroke-linecap': 'round' }, g); }
    const lForce = C8.lab(ctx, 'random forcing on the field', br.x + br.w + 50, br.y + 40, 'small', { w: 300 });
    const lGround = C8.lab(ctx, 'a training ground for laws, not a dynamo', 960, 92, 'lead center');
    K.badge(ctx, { kind: 'MEASURED', note: 'E2 · reference simulation · η = 0.00951', at: 'bench-0.15' });
    K.formulaLayer(ctx);
    ctx.c = { frame, lZel, T, lRail, tile, big, dot, lWrap, w0, w1, j0, j1, lW, lJ, knobW, lKnob, axG, lTr, lTe, lEta, loop, ring, lForce, lGround, SQ };
  },
  render(t, ctx) {
    const S = Scene, P = ctx.params, c = ctx.c, T = c.T;
    C8.fade(c.lRail, t, 0.2, T.bench - 0.4);
    const gr = S.seg(t, T.bench, T.bench + 1.2, S.ease.inOutCubic), fx = 1180 + (c.SQ.x + c.SQ.size / 2 - 1180) * gr, fy = 600 + (c.SQ.y + c.SQ.size / 2 - 600) * gr, fs = 0.1 + 0.9 * gr;
    c.frame.setAttribute('transform', `translate(${fx.toFixed(1)} ${fy.toFixed(1)}) scale(${fs.toFixed(3)}) translate(${-c.SQ.x - c.SQ.size / 2} ${-c.SQ.y - c.SQ.size / 2})`);
    c.frame.setAttribute('opacity', (S.seg(t, T.bench, T.bench + 0.2, S.ease.linear) * (1 - S.seg(t, T.maps, T.maps + 0.3, S.ease.linear))).toFixed(3));
    const sqOn = S.seg(t, T.square, T.square + 0.5, S.ease.linear) * (1 - S.seg(t, T.maps, T.maps + 0.5, S.ease.linear));
    c.big.set(sqOn);
    const tl = S.seg(t, T.square + 0.6, T.square + 1.0, S.ease.linear) * (1 - S.seg(t, T.square + 2.8, T.square + 3.3, S.ease.linear));
    c.tile.canvas.style.opacity = (P.tiling.opacity * tl).toFixed(3); c.tile.canvas.style.display = tl > 0 ? '' : 'none';
    const u = ((t - T.square - 0.8) / P.tiling.wrap_dot_s + 0.75) % 1, dOn = sqOn * (t > T.square + 0.8 ? 1 : 0);
    c.dot.setAttribute('cx', (c.SQ.x + u * c.SQ.size).toFixed(1)); c.dot.setAttribute('cy', c.SQ.y + c.SQ.size * 0.45); c.dot.setAttribute('opacity', dOn);
    C8.fade(c.lWrap, t, T.square + 0.8, T.maps);
    const mOn = S.seg(t, T.maps, T.maps + 0.6, S.ease.linear), dim = 1 - 0.5 * S.seg(t, T.warning, T.warning + 0.4, S.ease.linear) * (1 - S.seg(t, T.forced, T.forced + 0.4, S.ease.linear));
    const xf = S.seg(t, T.maps + 0.6, T.maps + 0.6 + P.maps.crossfade_s, S.ease.inOutSine);
    c.w0.set(mOn * dim); c.j0.set(mOn * dim); c.w1.set(mOn * dim * xf); c.j1.set(mOn * dim * xf);
    C8.fade(c.lW, t, T.maps + 0.4); C8.fade(c.lJ, t, T.maps + 0.4);
    C8.fade(c.knobW, t, T.knob); C8.fade(c.lKnob, t, T.knob + 0.2); C8.fadeS(c.axG, t, T.knob + 0.2);
    C8.fade(c.lTr, t, T.knob + 0.5); C8.fade(c.lTe, t, T.knob + 0.7); C8.fade(c.lEta, t, T.knob + 1.2);
    const lp = S.seg(t, T.warning + 0.2, T.warning + 1.7, S.ease.linear);
    c.loop.setAttribute('opacity', (lp > 0 && lp < 1 ? Math.sin(Math.PI * lp) : 0).toFixed(3)); c.loop.setAttribute('rx', (40 + 80 * lp).toFixed(1)); c.loop.setAttribute('ry', (26 + 50 * lp).toFixed(1));
    const pr = S.seg(t, T.forced, T.forced + 0.4, S.ease.linear), pulse = 0.55 + 0.45 * Math.sin(2 * Math.PI * (t - T.forced) / P.forcing_ring.pulse_s);
    c.ring.setAttribute('opacity', (pr * pulse).toFixed(3)); C8.fade(c.lForce, t, T.forced + 0.3);
    C8.fade(c.lGround, t, T.forced + 1.6); C8.fade(c.lZel, t, T.warning + 0.5);
  },
});
</script></body></html>
