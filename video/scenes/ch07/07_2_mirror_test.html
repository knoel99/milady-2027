<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>07.2 Predict: the mirror test</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch07.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch07_kit.js"></script>
<style>
  .stud { position: absolute; z-index: 18; box-sizing: border-box; background: var(--panel); border: 2px solid var(--fg-2); border-radius: 14px; padding: 18px 26px; transform-origin: 0 0; }
  .stud .h { font-family: "Inter Display"; font-weight: 700; font-size: 44px; color: var(--fg); }
  .stud .c { position: absolute; left: 26px; right: 26px; bottom: 18px; font-size: 32px; line-height: 1.2; color: var(--fg-2); }
</style>
</head><body><div id="stage"></div>
<script>
/* 07.2 Predict: the mirror test (L3, NIGHT, PROVED: Proposition 4; E1 clouds seed 0 illustrate it). Two students:
   augmentation (sees flipped copies) and equivariance (a mirrored noise point lands on the mirrored snapshot). Predict,
   then model C's cloud at Γ = 0.85 and three balances (A tilted, B slightly, C level); each snapshot keeps one polarity,
   the crowd is balanced; the mirror card lands on the crowd shelf. Numbers from data/e1_samples_0.85.json. */
Scene.define({
  duration: 40,
  register: 'night',
  cues: { ways: 0.5, augmentation: 2.2, equivariance: 6.8, predict: 15.2, answer: 20.4, tilts: 21.8, whirlpool: 24.0, crowd: 27.0, shelf: 30.0 },
  data: { samples: 'data/e1_samples_0.85.json' },
  params: { cards: { left: { x0: 200, x1: 860, y0: 330, y1: 700 }, right: { x0: 1060, x1: 1720, y0: 330, y1: 700 }, shrunk: { x0: 1240, x1: 1800, y0: 180, y1: 360 } },
    predict: { title: 'PREDICT', question: 'At a Γ neither has seen, who stays balanced?', box: { x0: 560, x1: 1360, y0: 170, y1: 270 } },
    noise_points: 300, noise_seed: 'ch07-noise', panel: { x0: 160, x1: 1120, y0: 200, y1: 720, range_Q: [-2.5, 2.5], range_D: [-2.5, 2.5] },
    balances: { x0: 1240, x1: 1800, y0: 400, y1: 700, rows: [{ variant: 'A_reference', label: 'A · plain', dim: true }, { variant: 'B_augmentation', label: 'B · augmentation' }, { variant: 'C_equivariant', label: 'C · equivariance' }] },
    highlight_seed: 'ch07-twin' },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, SM = ctx.data.samples;
    const T = {}; for (const k of ['ways', 'augmentation', 'equivariance', 'predict', 'answer', 'tilts', 'whirlpool', 'crowd', 'shelf']) T[k] = ctx.at(k + '-0.15');
    const PN = P.panel, XC = S.f32(SM.variants.C_equivariant.x), nC = SM.variants.C_equivariant.n;
    const pX = (q) => PN.x0 + (q - PN.range_Q[0]) / (PN.range_Q[1] - PN.range_Q[0]) * (PN.x1 - PN.x0), pY = (d) => PN.y1 - (d - PN.range_D[0]) / (PN.range_D[1] - PN.range_D[0]) * (PN.y1 - PN.y0);
    C7.shelves(ctx, { cards: [{ shelf: 'crowd', slot: 0, glyph: 'mirror', title: 'mirror', tag: 'built in, exactly', at: 'shelf-0.15', from: [pX(0) - 60, pY(0) - 80] }], bright: ['shelf-0.15'] });
    // ---- the two student cards
    const mkCard = (b, title, cap) => { const e = K.el('div', { class: 'stud' }, st); e.style.left = b.x0 + 'px'; e.style.top = b.y0 + 'px'; e.style.width = (b.x1 - b.x0) + 'px'; e.style.height = (b.y1 - b.y0) + 'px';
      K.el('div', { class: 'h' }, e, title); K.el('div', { class: 'c' }, e, cap); const sv = K.s('svg', { width: b.x1 - b.x0, height: b.y1 - b.y0, style: 'position:absolute;left:0;top:0;overflow:visible' }, e); return { e, sv, w: b.x1 - b.x0, h: b.y1 - b.y0 }; };
    const cL = mkCard(P.cards.left, 'data augmentation', 'sees each training snapshot flipped, half of the time');
    const cR = mkCard(P.cards.right, 'equivariance', 'mirror built into the wind: a mirrored noise point lands on the mirrored snapshot');
    // left: a training snapshot and its flipped twin (point reflection through the origin)
    const mq = (sv, w) => { const cx = w / 2, cy = 175, g = K.s('g', {}, sv); K.s('line', { x1: cx - 150, x2: cx + 150, y1: cy, y2: cy, stroke: K.c('grid'), 'stroke-width': 2 }, g); K.s('line', { x1: cx, x2: cx, y1: cy - 95, y2: cy + 95, stroke: K.c('grid'), 'stroke-width': 2 }, g); return { cx, cy }; };
    const oL = mq(cL.sv, cL.w), dot = K.s('circle', { cx: oL.cx - 70, cy: oL.cy - 50, r: 12, fill: K.c('b') }, cL.sv), twin = K.s('circle', { cx: oL.cx + 70, cy: oL.cy + 50, r: 12, fill: K.c('b-neg') }, cL.sv);
    // right: noise cloud with the point mirror, z and Sz travel to x and Sx (a model C snapshot and its image)
    const oR = mq(cR.sv, cR.w), nr = S.rng(P.noise_seed), noise = K.s('g', {}, cR.sv);
    for (let i = 0; i < P.noise_points; i++) { const u = Math.max(1e-9, nr()), v = nr(), r = Math.sqrt(-2 * Math.log(u)); K.s('circle', { cx: oR.cx + 22 * r * Math.cos(6.283 * v), cy: oR.cy + 22 * r * Math.sin(6.283 * v), r: 2, fill: K.c('model'), opacity: 0.6 }, noise); }
    K.s('circle', { cx: oR.cx, cy: oR.cy, r: 7, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 2.5 }, cR.sv);
    const hr = S.rng(P.highlight_seed); let hi = 0; for (let k = 0; k < 200; k++) { const i = Math.floor(hr() * nC); if (XC[3 * i + 1] > 1 && XC[3 * i] < -0.5) { hi = i; break; } }
    const hq = XC[3 * hi], hd = XC[3 * hi + 1], sc = 55, z = [oR.cx + 30, oR.cy - 18];
    const path = (sg) => { const x0 = oR.cx + sg * (z[0] - oR.cx), y0 = oR.cy + sg * (z[1] - oR.cy), x1 = oR.cx + sg * hq * sc, y1 = oR.cy - sg * hd * sc, mx = oR.cx + sg * 90, my = oR.cy - sg * 10; return [x0, y0, mx, my, x1, y1]; };
    const trav = [1, -1].map((sg) => { const [x0, y0, mx, my, x1, y1] = path(sg); const p = K.s('path', { d: `M${x0},${y0} Q${mx},${my} ${x1},${y1}`, fill: 'none', stroke: K.c('model'), 'stroke-width': 3 }, cR.sv); const L = p.getTotalLength(); p.style.strokeDasharray = `${L} ${L}`;
      const ring = K.s('circle', { r: 11, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3 }, cR.sv); return { p, L, ring, sg }; });
    // ---- predict card
    const PB = P.predict.box, pc = K.el('div', { class: 'c7-card' }, st); pc.style.left = PB.x0 + 'px'; pc.style.top = PB.y0 + 'px'; pc.style.width = (PB.x1 - PB.x0) + 'px';
    K.el('div', { class: 'k' }, pc, K.upper(P.predict.title)); K.el('div', { class: 'q', html: K.markup(P.predict.question.replace('Γ', '{param}Γ{/}')) }, pc);
    K.pen(ctx, { kind: 'check', box: { x: P.cards.right.x1 - 110, y: P.cards.right.y0 + 14, w: 70, h: 70 }, at: 'answer', out: 'answer+1.2', dur: 0.4, seed: 'ck72' });
    // ---- answer: model C's cloud, balances
    const LC = K.canvasLayer(ctx, 6, null, null, { reset: true }), svg = K.svgLayer(ctx, 12), panel = C7.panel(ctx, svg, PN, PN.range_Q, PN.range_D);
    K.chip(ctx, { text: 'GENERATED · model C · Γ = 0.85 · seed 0', kind: 'generated', x: PN.x1 - 8, y: PN.y1 - 8, anchor: 'br', at: 'answer+0.4', maxWidth: 470 });
    K.lowerThird(ctx, { kind: 'source', data: SM, at: 'answer+0.5', hold: 4 });
    const BB = P.balances, rows = BB.rows.map((r, i) => {
      const y = BB.y0 + 30 + i * 100, bal = C7.balance(svg, { x0: BB.x0, x1: BB.x1, y0: y, y1: y + 40 });
      const lab = C7.lab(ctx, r.label, BB.x0, y - 46, ''), pv = SM.variants[r.variant].p_positive;
      return { bal, lab, pv, dim: !!r.dim, v: r.variant };
    });
    const lB = C7.lab(ctx, `B: P(D > 0) = ${K.fmt(rows[1].pv, 2, { fixed: 2 })}`, BB.x1, BB.y0 + 30 + 100 - 42, 'right small'), lC = C7.lab(ctx, `C: P(D > 0) = ${K.fmt(rows[2].pv, 2, { fixed: 2 })}`, BB.x1, BB.y0 + 30 + 200 - 42, 'right small');
    const lBal = C7.lab(ctx, 'the crowd: balanced', BB.x0, BB.y1 + 4, 'big');
    const wx = pX(hq), wy = pY(hd), sx = pX(-hq), sy = pY(-hd);
    K.pen(ctx, { kind: 'circle', box: { x: wx - 14, y: wy - 14, w: 28, h: 28 }, pad: 6, at: 'whirlpool', out: 'shelf', dur: 0.4, seed: 'w72' });
    const mir = K.s('g', {}, svg);
    K.s('line', { x1: wx, y1: wy, x2: sx, y2: sy, stroke: K.c('chalk'), 'stroke-width': 2.5, 'stroke-dasharray': '7 7' }, mir);
    K.s('circle', { cx: sx, cy: sy, r: 14, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3 }, mir);
    const lOne = C7.lab(ctx, 'one snapshot · one polarity', PN.x0 + 10, wy + 40, 'big halo');
    K.badge(ctx, { kind: 'PROVED', note: 'Proposition 4 · E1 clouds, seed 0', at: -0.3 });
    K.chip(ctx, { text: 'classical for equivariant flows (R:412)', kind: 'plain', x: 1824, y: 112, anchor: 'tr', at: 'answer', caps: false });
    // WORKAROUND (script formula 2 too long for one layer item at 28 px): shown in two steps, split before its ⇒
    K.formulaLayer(ctx, { items: ((ctx.script.onscreen && ctx.script.onscreen.formulas) || []).flatMap((f) => { const parts = f.tex.split('\\;\\Rightarrow\\;'); return parts.map((tex, i) => ({ tex: i ? '\\Rightarrow\\; ' + tex : tex, at: i ? 'tilts-0.15' : f.cue + '-0.15' })); }) });
    ctx.c = { T, cL, cR, dot, twin, noise, trav, pc, LC, panel, XC, nC, rows, lB, lC, lBal, mir, lOne, oR };
  },
  render(t, ctx) {
    const S = Scene, P = ctx.params, c = ctx.c, T = c.T, ease = S.ease.inOutCubic;
    // student cards: rise, then shrink into the corner on 'answer'
    const shr = S.seg(t, T.answer + 0.3, T.answer + 1.3, ease), SH = P.cards.shrunk;
    [[c.cL, P.cards.left, 0], [c.cR, P.cards.right, 1]].forEach(([cd, b, i]) => {
      const rise = S.seg(t, T.ways + 0.1 * i, T.ways + 0.6 + 0.1 * i, S.ease.outCubic), k = (SH.x1 - SH.x0 - 20) / 2 / (b.x1 - b.x0);
      const tx = (SH.x0 + i * ((SH.x1 - SH.x0) / 2 + 10) - b.x0) * shr, ty = (SH.y0 - b.y0) * shr + 40 * (1 - rise), s = 1 + (k - 1) * shr;
      cd.e.style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${s.toFixed(3)})`;
      cd.e.querySelectorAll('.h, .c').forEach((q) => { q.style.opacity = (1 - Math.min(1, shr * 5)).toFixed(3); });
      const o = rise * (1 - S.seg(t, T.answer + 1.0, T.answer + 1.4, S.ease.linear)); cd.e.style.opacity = o.toFixed(3); cd.e.style.display = o > 0 ? '' : 'none';
    });
    C7.fadeS(c.dot, t, T.augmentation); const ph = (t - T.augmentation - 0.6) % 1.2; c.twin.setAttribute('opacity', t > T.augmentation + 0.6 && ph < 0.6 ? 1 : 0);
    C7.fadeS(c.noise, t, T.equivariance, Infinity, 0.3); c.noise.setAttribute('transform', `translate(${c.oR.cx} ${c.oR.cy}) scale(${(1 + 0.02 * Math.sin(t * 2.3)).toFixed(4)}) translate(${-c.oR.cx} ${-c.oR.cy})`);
    const tv = S.seg(t, T.equivariance + 1.2, T.equivariance + 3.0, S.ease.inOutSine);
    c.trav.forEach((r) => { r.p.style.strokeDashoffset = (r.L * (1 - tv)).toFixed(1); r.p.style.opacity = t > T.equivariance + 1.2 ? 1 : 0; const q = r.p.getPointAtLength(r.L * tv); r.ring.setAttribute('cx', q.x.toFixed(1)); r.ring.setAttribute('cy', q.y.toFixed(1)); r.ring.setAttribute('opacity', S.seg(t, T.equivariance + 0.4, T.equivariance + 0.7, S.ease.linear)); });
    C7.fade(c.pc, t, T.predict, T.answer + 0.2);
    // model C cloud and balances
    const g = c.LC.g; g.clearRect(0, 0, 1920, 1080);
    const k = Math.floor(c.nC * S.seg(t, T.answer + 0.4, T.answer + 1.6, S.ease.linear));
    if (k > 0) C7.cloud(g, c.XC, c.nC, k, c.panel, S.col('model'), 0.45, 2);
    C7.fadeS(c.panel.g, t, T.answer + 0.3);
    c.rows.forEach((r, i) => {
      const on = S.seg(t, T.answer + 0.6, T.answer + 1.0, S.ease.linear);
      let p = 0.5;
      if (r.dim) p = r.pv; else if (i === 2) p = 0.5 + (r.pv - 0.5) * S.seg(t, T.answer + 0.8, T.answer + 1.6, ease); else p = 0.5 + (r.pv - 0.5) * S.seg(t, T.tilts, T.tilts + 0.8, ease);
      r.bal.set(p);
      const pulse = i === 2 ? 1 - 0.4 * Math.sin(Math.PI * S.seg(t, T.crowd, T.crowd + 0.6, S.ease.linear)) : 1;
      r.bal.g.setAttribute('opacity', (on * (r.dim ? 0.4 : 1) * pulse).toFixed(3)); C7.fade(r.lab, t, T.answer + 0.6, Infinity, 0.25, r.dim ? 0.5 : 1);
    });
    C7.fade(c.lB, t, T.tilts + 0.5); C7.fade(c.lC, t, T.crowd + 0.2); C7.fade(c.lBal, t, T.crowd + 0.5);
    C7.fadeS(c.mir, t, T.whirlpool + 0.5, T.shelf); C7.fade(c.lOne, t, T.whirlpool + 0.4, T.shelf);
  },
});
</script></body></html>
