<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>07.4 The budget is blind to the mirror</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch07.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch07_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 07.4 The budget is blind to the mirror (L3, NIGHT, PROVED: Remark 3.7; E1 confirms). Any mix p of the two whirlpools
   balances every crowd law: the energy gauge (computed from the stored snapshots' dE/dt, split by the sign of D) never
   moves while p sweeps; on the check of ten crowd laws the most lopsided model A even scores lowest. The mirror needs
   its own tool. data/ch07_mirror.json (ref_sym_085, check3), data/e1_eval.json (source). */
Scene.define({
  duration: 20,
  register: 'night',
  cues: { catch: 0.5, own: 2.6, mix: 5.0, check: 7.8, separately: 12.4 },
  data: { mirror: 'data/ch07_mirror.json', eval: 'data/e1_eval.json' },
  params: { panel: { x0: 160, x1: 1000, y0: 200, y1: 690, range_Q: [-2.5, 2.5], range_D: [-2.5, 2.5] }, slider: { x0: 200, x1: 960, y: 728, label: 'share in the up whirlpool, p' },
    p_keys: [{ at: 'own', p: 1.0 }, { at: 'own+1.0', p: 0.0 }, { at: 'mix', p: 0.5 }, { at: 'mix+1.2', p: 0.15 }, { at: 'mix+2.4', p: 0.85 }, { at: 'mix+3.4', p: 0.3 }],
    gauge: { x0: 1200, x1: 1700, y0: 220, y1: 520, label: 'average energy change of the mix' }, bars: { x0: 1200, x1: 1760, y0: 470, y1: 680 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, MI = ctx.data.mirror, R = MI.ref_sym_085, C3 = MI.check3;
    const T = {}; for (const k of ['catch', 'own', 'mix', 'check', 'separately']) T[k] = ctx.at(k + '-0.15');
    C7.shelves(ctx, { cards: [{ shelf: 'crowd', slot: 0, glyph: 'mirror', title: 'mirror', tag: 'built in, exactly' }], empty: [{ shelf: 'crowd', slot: 1, label: 'budget', at: 'separately-0.15' }], bright: ['separately-0.15'] });
    const XS = S.f32(R.x), DE = S.f32(R.dEdt), n = R.n;
    // up / down whirlpools, seeded ranks, the two mean energy changes
    const rr = S.rng('ranks'), rank = new Float32Array(n), up = new Uint8Array(n); let mu = 0, md = 0, nu = 0, nd = 0, s2 = 0;
    for (let i = 0; i < n; i++) { rank[i] = rr(); up[i] = XS[3 * i + 1] > 0 ? 1 : 0; if (up[i]) { mu += DE[i]; nu++; } else { md += DE[i]; nd++; } }
    mu /= nu; md /= nd; for (let i = 0; i < n; i++) s2 += DE[i] * DE[i]; const spread = Math.sqrt(s2 / n);
    const keys = P.p_keys.map((k) => ({ t: ctx.at(k.at), p: k.p }));
    const pAt = (t) => { let p = 0.5; for (let i = 0; i < keys.length; i++) if (t >= keys[i].t) { const prev = i ? keys[i - 1].p : 0.5; p = prev + (keys[i].p - prev) * S.ease.inOutCubic(S.seg(t, keys[i].t, keys[i].t + 0.6, S.ease.linear)); } return p; };
    window.__EVENTS__ = keys.map((k) => ({ t: +(k.t + 0.6).toFixed(3), id: 'detent' }));
    const LC = K.canvasLayer(ctx, 6, null, null, { reset: true }), svg = K.svgLayer(ctx, 12), PN = P.panel, panel = C7.panel(ctx, svg, PN, PN.range_Q, PN.range_D);
    // slider (chalk, not green: p is a mixing weight)
    const SL = P.slider, slG = K.s('g', {}, svg);
    K.s('line', { x1: SL.x0, x2: SL.x1, y1: SL.y, y2: SL.y, stroke: K.c('chalk'), 'stroke-width': 3 }, slG);
    const knob = K.s('circle', { cy: SL.y, r: 13, fill: K.c('chalk') }, slG);
    const lSl = C7.lab(ctx, SL.label, SL.x0, SL.y - 60, 'small halo');
    // amber gauge
    const G = P.gauge, gx = (G.x0 + G.x1) / 2, gy = G.y1 - 60, gr = (G.x1 - G.x0) / 2 - 30, gG = K.s('g', {}, svg);
    K.s('path', { d: `M${gx - gr},${gy} A${gr},${gr} 0 0 1 ${gx + gr},${gy}`, fill: 'none', stroke: K.c('metric'), 'stroke-width': 6 }, gG);
    K.s('line', { x1: gx, x2: gx, y1: gy - gr - 14, y2: gy - gr + 14, stroke: K.c('metric'), 'stroke-width': 4 }, gG);
    const needle = K.s('line', { x1: 0, y1: 0, x2: 0, y2: -gr + 24, stroke: K.c('fg'), 'stroke-width': 5, 'stroke-linecap': 'round' }, gG);
    K.s('text', { x: gx, y: gy - gr - 24, 'text-anchor': 'middle', class: 'kt-label' }, gG, '0');
    K.s('text', { x: gx - gr, y: gy + 40, 'text-anchor': 'middle', class: 'kt-label' }, gG, 'losing'); K.s('text', { x: gx + gr, y: gy + 40, 'text-anchor': 'middle', class: 'kt-label' }, gG, 'gaining');
    const lG = C7.lab(ctx, G.label, gx, G.y1 + 6, 'center'); lG.style.color = K.c('metric');
    const lPass = C7.lab(ctx, 'passes for every p', gx, G.y1 + 56, 'center'); lPass.style.color = K.c('metric'); lPass.style.border = '2px dashed var(--metric)'; lPass.style.padding = '2px 12px'; lPass.style.borderRadius = '8px';
    // check bars
    const B = P.bars, bmax = Math.max(C3.A, C3.B, C3.C) * 1.15, bx = (v) => B.x0 + 260 + (B.x1 - B.x0 - 270) * v / bmax, chk = K.s('g', {}, svg);
    const rows = [['A · plain', C3.A], ['B · augmentation', C3.B], ['C · equivariance', C3.C]];
    rows.forEach(([lab, v], i) => { const y = B.y0 + 30 + i * 56; K.s('rect', { x: B.x0 + 260, y: y - 16, width: bx(v) - B.x0 - 260, height: 32, fill: K.c('metric') }, chk); K.s('text', { x: B.x0 + 250, y: y + 10, 'text-anchor': 'end', class: 'kt-label', style: 'font-size:28px' }, chk, lab); });
    K.s('line', { x1: bx(C3.floor), x2: bx(C3.floor), y1: B.y0, y2: B.y0 + 190, stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '10 8' }, chk);
    K.s('text', { x: bx(C3.floor), y: B.y0 - 8, 'text-anchor': 'middle', class: 'kt-mono' }, chk, 'NOISE FLOOR');
    K.pen(ctx, { kind: 'circle', box: { x: B.x0 + 268, y: B.y0 + 12, w: bx(C3.A) - B.x0 - 268, h: 36 }, pad: 6, at: 'check+1.0', dur: 0.5, seed: 'low74' });
    const lLow = C7.lab(ctx, 'lowest', bx(C3.A) + 30, B.y0 + 8, 'big'); lLow.style.color = K.c('chalk');
    const lCap = C7.lab(ctx, `check · ${C3.label} · test Γ, 2 seeds`, B.x0, B.y0 + 200, 'small', { w: 560 });
    K.lowerThird(ctx, { kind: 'source', data: ctx.data.eval, at: 'check+0.3', hold: 3.5 });
    const wall = K.s('line', { x1: 940, x2: 940, y1: 70, y2: 152, stroke: K.c('chalk'), 'stroke-width': 4, 'stroke-linecap': 'round' }, K.svgLayer(ctx, 30));
    const lSep = C7.lab(ctx, 'separate tools', 1320, 96, 'small'); lSep.style.color = K.c('chalk');
    K.badge(ctx, { kind: 'PROVED', note: 'Remark 3.7 · E1 confirms', at: -0.3 });
    K.formulaLayer(ctx);
    ctx.c = { T, LC, XS, n, rank, up, pAt, panel, slG, knob, lSl, gG, needle, gx, gy, mu, md, spread, lG, lPass, chk, lLow, lCap, wall, lSep, SL, nu, nd };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.c, T = c.T, g = c.LC.g;
    g.clearRect(0, 0, 1920, 1080);
    const p = c.pAt(t), on = S.seg(t, T.catch, T.catch + 0.5, S.ease.linear);
    const cb = S.col('b'), cn = S.col('b-neg');
    g.globalAlpha = 0.5 * on;
    for (let i = 0; i < c.n; i++) {
      const vis = c.up[i] ? c.rank[i] < p : c.rank[i] < 1 - p;
      if (!vis) continue; g.fillStyle = c.up[i] ? cb : cn; g.fillRect(c.panel.X(c.XS[3 * i]) - 1, c.panel.Y(c.XS[3 * i + 1]) - 1, 2, 2);
    }
    C7.fadeS(c.panel.g, t, T.catch); C7.fadeS(c.slG, t, T.catch); C7.fade(c.lSl, t, T.catch + 0.2);
    c.knob.setAttribute('cx', (c.SL.x0 + (c.SL.x1 - c.SL.x0) * p).toFixed(1));
    const ang = 90 * (p * c.mu + (1 - p) * c.md) / c.spread;
    const sh = S.seg(t, T.check, T.check + 0.8, S.ease.inOutCubic);
    void sh;
    c.needle.setAttribute('transform', `translate(${c.gx} ${c.gy}) rotate(${ang.toFixed(3)})`);
    C7.fadeS(c.gG, t, T.catch + 0.2, T.check); C7.fade(c.lG, t, T.catch + 0.3, T.check);
    C7.fade(c.lPass, t, T.mix + 0.8, T.check);
    C7.fadeS(c.chk, t, T.check + 0.3); C7.fade(c.lLow, t, T.check + 1.4); C7.fade(c.lCap, t, T.check + 0.6);
    C7.fadeS(c.wall, t, T.separately + 0.4); C7.fade(c.lSep, t, T.separately + 0.6);
  },
});
</script></body></html>
