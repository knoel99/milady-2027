<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>07.3 Only where the data are</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch07.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch07_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 07.3 Only where the data are (L3, NIGHT, MEASURED: E1, 2 seeds, 21 Γ). Asymmetry |P(D > 0) − ½| per Γ on a log
   axis: A copies its training runs' imbalance and spills it onto unseen settings; B sits on the noise floor at its
   training settings and drifts between them; C stays on the floor everywhere. data/e1_eval.json, data/ch07_mirror.json. */
Scene.define({
  duration: 35,
  register: 'night',
  cues: { imbalance: 0.5, unevenly: 2.4, copies: 8.0, augmentation: 12.6, drifts: 15.2, everywhere: 18.0, teach: 20.6 },
  data: { eval: 'data/e1_eval.json', mirror: 'data/ch07_mirror.json' },
  params: { plot: { box: { x0: 220, x1: 1400, y0: 270, y1: 640 }, x: { label: 'Γ, control parameter', min: 0.8, max: 1.0, ticks: [0.8, 0.85, 0.9, 0.95, 1.0], param: true },
    y: { label: 'asymmetry |P(D > 0) − ½|', min: 0.002, max: 0.3, log: true } }, threshold_band: [0.86, 0.865],
    series: [{ variant: 'A_reference', label: 'A · plain', opacity: 0.5, marker: 'square' }, { variant: 'B_augmentation', label: 'B · augmentation', opacity: 0.75, marker: 'triangle' }, { variant: 'C_equivariant', label: 'C · equivariance', opacity: 1.0, marker: 'circle' }],
    column: { x0: 1460, x1: 1800, y0: 210, y1: 640 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, EV = ctx.data.eval, MI = ctx.data.mirror, AS = MI.asym;
    const T = {}; for (const k of ['imbalance', 'unevenly', 'copies', 'augmentation', 'drifts', 'everywhere', 'teach']) T[k] = ctx.at(k + '-0.15');
    C7.shelves(ctx, {});
    const Pl = K.plot(ctx, Object.assign({}, P.plot, { at: 'imbalance-0.15' }));
    Pl.band({ x: P.threshold_band, kind: 'window', label: 'threshold', labelX: Pl.sx(P.threshold_band[1]) + 10, labelY: Pl.box.y1 - 16, at: 'imbalance' });
    const ser = P.series.map((sp, k) => {
      const pg = EV.variants[sp.variant].per_gamma, pts = [];
      pg.train.Gamma.forEach((g, i) => pts.push([g, pg.train.asym[i], true])); pg.test.Gamma.forEach((g, i) => pts.push([g, pg.test.asym[i], false]));
      pts.sort((a, b) => a[0] - b[0]);
      const at = ['copies-0.15', 'augmentation+0.3', 'everywhere-0.15'][k];
      const cv = Pl.curve({ x: pts.map((p) => p[0]), y: pts.map((p) => p[1]), field: 'model', kind: 'generated', width: 4, at, dur: 2.0 });
      const dt = Pl.dots({ x: pts.map((p) => p[0]), y: pts.map((p) => p[1]), filled: pts.map((p) => p[2]), field: 'model', r: 7, at, dur: 2.0 });
      return { cv, dt, pts, op: sp.opacity, label: sp.label };
    });
    const by = (k, G) => ser[k].pts.find((p) => Math.abs(p[0] - G) < 1e-9);
    const A86 = by(0, 0.86), A87 = by(0, 0.87);
    K.pen(ctx, { kind: 'circle', box: { x: Pl.sx(0.86) - 14, y: Pl.sy(A86[1]) - 14, w: 28, h: 28 }, pad: 6, at: 'copies+2.0', out: 'augmentation', dur: 0.4, seed: 'a86' });
    K.pen(ctx, { kind: 'circle', box: { x: Pl.sx(0.87) - 14, y: Pl.sy(A87[1]) - 14, w: 28, h: 28 }, pad: 6, at: 'copies+2.4', out: 'augmentation', dur: 0.4, seed: 'a87' });
    Pl.hline({ y: AS.floor, label: `noise floor · ${K.fmt(AS.floor)}`, at: 'augmentation-0.15' });
    [0.81, 0.85, 0.93].forEach((G, i) => { const p = by(1, G); if (p) K.pen(ctx, { kind: 'arrow', from: [Pl.sx(G), Pl.sy(p[1]) - 18], to: [Pl.sx(G), Pl.sy(p[1]) - 70], bend: 0, at: 'drifts+' + (0.2 + 0.25 * i).toFixed(2), out: 'teach', dur: 0.35, seed: 'up' + i }); });
    K.chip(ctx, { text: 'filled: training Γ · open: never seen', kind: 'plain', x: 1400, y: 212, anchor: 'tr', at: 'imbalance+0.4', caps: false });
    // right column: training runs, then the series labels
    const CO = P.column, runsG = K.svgLayer(ctx, 12), runLab = [];
    MI.runs.slice().reverse().forEach((r, j) => {
      const y0 = CO.y0 + j * 170, sc = j ? 0.75 : 1;
      runLab.push(C7.lab(ctx, `${j ? 'at' : 'training runs at'} Γ = ${r.gamma} · ${r.n_up} of ${r.n_runs} up`, CO.x0, y0, j ? 'small' : '', { w: 340 }));
      for (let i = 0; i < r.n_runs; i++) K.s('line', { x1: CO.x0 + 8 + i * 15 * sc, x2: CO.x0 + 8 + i * 15 * sc, y1: y0 + 90, y2: y0 + 90 + 60 * sc, stroke: K.c(i < r.n_up ? 'b' : 'b-neg'), 'stroke-width': 6, 'stroke-linecap': 'round', 'data-row': j }, runsG);
    });
    const arrows = MI.runs.slice().reverse().map((r, j) => K.pen(ctx, { kind: 'arrow', from: [CO.x0 - 16, CO.y0 + j * 170 + 120], to: [Pl.sx(r.gamma) + 10, Pl.box.y0 + 30], bend: 0.15, at: 'unevenly+' + (1.0 + 0.4 * j).toFixed(1), out: 'augmentation', dur: 0.5, seed: 'ra' + j }));
    void arrows;
    const SA = AS.summary, f3 = (v) => v.toFixed(3);
    const colA = C7.lab(ctx, `A · plain — ${f3(SA.A.at_0_86)} at 0.86 · ${f3(SA.A.at_0_87)} at 0.87, unseen`, CO.x0, CO.y0, 'small', { w: 340 });
    const colB = C7.lab(ctx, `B · augmentation — ${f3(SA.B.train_range[0])}–${f3(SA.B.train_range[1])} at training values · ${f3(SA.B.test_range[0])}–${f3(SA.B.test_range[1])} between them (mean ${f3(SA.B.test_mean)})`, CO.x0, CO.y0 + 120, 'small', { w: 340 });
    const colC = C7.lab(ctx, `C · equivariance — about ${K.fmt(AS.floor)} everywhere: on the floor`, CO.x0, CO.y0 + 320, 'small', { w: 340 });
    const chB = C7.lab(ctx, 'augmentation: only where the data are', Pl.sx(0.9), Pl.sy(0.03), 'small halo'), chC = C7.lab(ctx, 'equivariance: everywhere', Pl.sx(0.9), Pl.sy(AS.floor) - 48, 'small halo');
    K.chip(ctx, { text: `two seeds per model · ${AS.n.toLocaleString('en-US')} snapshots per Γ`, kind: 'plain', x: 220, y: 760, at: 'teach+0.4', caps: false });
    K.lowerThird(ctx, { kind: 'source', data: EV, at: 'copies+0.4', hold: 4 });
    K.badge(ctx, { kind: 'MEASURED', note: 'E1 · 2 seeds · 21 Γ', at: -0.3 });
    K.formulaLayer(ctx);
    ctx.c = { T, ser, runsG, runLab, colA, colB, colC, chB, chC };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.c, T = c.T;
    const aDim = 1 - 0.75 * S.seg(t, T.teach, T.teach + 0.5, S.ease.linear);
    c.ser.forEach((s, k) => { const o = s.op * (k === 0 ? aDim : 1); s.cv.path.setAttribute('opacity', o); s.dt.g.setAttribute('opacity', o); });
    C7.fadeS(c.runsG, t, T.unevenly, T.augmentation); c.runLab.forEach((e, j) => C7.fade(e, t, T.unevenly + 0.3 * j, T.augmentation));
    C7.fade(c.colA, t, T.augmentation + 0.3, Infinity, 0.25, 1); if (t > T.teach) c.colA.style.opacity = (0.4 + 0.6 * (1 - S.seg(t, T.teach, T.teach + 0.5, S.ease.linear))).toFixed(3);
    C7.fade(c.colB, t, T.drifts + 0.3); C7.fade(c.colC, t, T.everywhere + 1.0);
    C7.fade(c.chB, t, T.teach + 0.3); C7.fade(c.chC, t, T.teach + 0.6);
  },
});
</script></body></html>
