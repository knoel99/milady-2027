<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>07.1 A lopsided machine</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch07.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch07_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 07.1 A lopsided machine (L3, NIGHT, MEASURED: E1, Γ = 0.85, model A seed 0). The two shelves start empty. Then the
   (Q, D) clouds at an unseen Γ: the truth (stored snapshots + their mirror images, symmetric by construction) and the
   plain generator; the shape is right but the balance tilts (P(D > 0) of model A), copied from training runs that split
   unevenly. Numbers from data/e1_samples_0.85.json, data/ch07_mirror.json, data/e1_data_rates.json. */
Scene.define({
  duration: 40,
  register: 'night',
  cues: { shelves: 3.6, every: 5.4, crowd: 7.0, empty: 8.6, dials: 11.0, grey: 14.4, violet: 15.8, shape: 17.6, weigh: 19.8, tilt: 21.2, four: 23.8, copied: 26.6 },
  data: { samples: 'data/e1_samples_0.85.json', rates: 'data/e1_data_rates.json', mirror: 'data/ch07_mirror.json' },
  params: { chapter_card: { num: '07', level: 'L3', levelFrom: 'L3', tier: 0, pending: [3, 4] },
    panels: { left: { x0: 140, x1: 760, y0: 210, y1: 660 }, right: { x0: 860, x1: 1480, y0: 210, y1: 660 }, range_Q: [-2.5, 2.5], range_D: [-2.5, 2.5] },
    point_px: 2, alpha_ref: 0.4, alpha_model: 0.45, reveal_s: 1.5, ref_block: 'ref_sym_085', model_variant: 'A_reference', gamma: 0.85,
    ruler: { x0: 1540, x1: 1800, y: 250, min: 0.8, max: 0.9 }, balance: { y0: 678, y1: 718 }, runs_gamma: 0.86, runs_box: { x0: 1540, x1: 1800, y0: 340, y1: 680 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, SM = ctx.data.samples, MI = ctx.data.mirror, RT = ctx.data.rates;
    const T = {}; for (const k of Object.keys({ shelves: 0, every: 0, crowd: 0, empty: 0, dials: 0, grey: 0, violet: 0, shape: 0, weigh: 0, tilt: 0, four: 0, copied: 0 })) T[k] = ctx.at(k + '-0.15');
    const title = (ctx.script.onscreen && ctx.script.onscreen.title) || 'The mirror and the crowd', cc = P.chapter_card;
    K.chapterCard(ctx, { num: cc.num, title, level: cc.level, levelFrom: cc.levelFrom, tier: cc.tier, pending: cc.pending, at: -0.3, out: 'shelves-0.4', railHold: 2.6 });
    C7.shelves(ctx, { full: { in: 'shelves-0.15', out: 'empty+0.6' }, labAt: { every: 'every-0.15', crowd: 'crowd-0.15' }, slotsAt: 'empty-0.15' });
    const REF = MI[P.ref_block], MV = SM.variants[P.model_variant];
    if (Math.abs(REF.gamma - P.gamma) > 1e-9 || Math.abs(SM.gamma - P.gamma) > 1e-9) S.warn('07.1: Γ mismatch between data and params');
    const XR = S.f32(REF.x), XA = S.f32(MV.x), nR = REF.n, nA = MV.n;
    const ord = (n, seed) => { const r = S.rng(seed), a = Array.from({ length: n }, (_, i) => i); for (let i = n - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
    const oR = ord(nR, 'ref'), oA = ord(nA, 'modelA');
    const LC = K.canvasLayer(ctx, 6, null, null, { reset: true });
    const svg = K.svgLayer(ctx, 12), PN = P.panels;
    const pL = C7.panel(ctx, svg, PN.left, PN.range_Q, PN.range_D), pR = C7.panel(ctx, svg, PN.right, PN.range_Q, PN.range_D);
    // Γ ruler (right column)
    const RU = P.ruler, rx = (g) => RU.x0 + (g - RU.min) / (RU.max - RU.min) * (RU.x1 - RU.x0), ruler = K.s('g', {}, svg);
    K.s('line', { x1: RU.x0, x2: RU.x1, y1: RU.y, y2: RU.y, stroke: K.c('param'), 'stroke-width': 4 }, ruler);
    RT.x.values.forEach((g, i) => { if (g < RU.min - 1e-9 || g > RU.max + 1e-9) return; const tr = RT.x.train[i]; K.s('circle', { cx: rx(g), cy: RU.y, r: tr ? 8 : 7, fill: tr ? K.c('param') : K.c('bg'), stroke: K.c('param'), 'stroke-width': 3 }, ruler); });
    [RU.min, (RU.min + RU.max) / 2, RU.max].forEach((g) => K.s('text', { x: rx(g), y: RU.y + 44, 'text-anchor': 'middle', class: 'kt-tick' }, ruler, K.fmt(g)));
    K.pen(ctx, { kind: 'circle', box: { x: rx(P.gamma) - 12, y: RU.y - 12, w: 24, h: 24 }, pad: 4, at: 'dials+0.5', dur: 0.4, seed: 'ring71' });
    const lG = C7.lab(ctx, `Γ = ${P.gamma} · never seen in training`, RU.x0, RU.y - 116, '', { w: 270 }); lG.style.color = K.c('param');
    K.chip(ctx, { text: 'SIMULATED', kind: '', x: PN.left.x1 - 8, y: PN.left.y0 + 8, anchor: 'tr', at: 'grey' });
    K.chip(ctx, { text: 'GENERATED · plain model A', kind: 'generated', x: PN.right.x0 + 8, y: PN.right.y1 - 8, anchor: 'bl', maxWidth: 300, at: 'violet', out: 'four-0.3' });
    K.chip(ctx, { text: `model A · seed 0 · ${nA.toLocaleString('en-US')} snapshots`, kind: 'plain', x: PN.right.x1 - 8, y: PN.right.y0 + 50, anchor: 'tr', maxWidth: 330, at: 'violet+0.3', out: 'weigh', caps: false });
    K.lowerThird(ctx, { kind: 'source', data: SM, at: 'grey+0.4', hold: 4 });
    // whirlpool ellipses on the right panel
    const up = { x: pR.X(-1.2), y: pR.Y(1.3) }, dn = { x: pR.X(1.2), y: pR.Y(-1.3) };
    [up, dn].forEach((c, i) => K.pen(ctx, { kind: 'circle', box: { x: c.x - 80, y: c.y - 65, w: 160, h: 130 }, pad: 6, at: 'shape+' + (0.1 + 0.4 * i), out: 'weigh', dur: 0.5, seed: 'wh' + i }));
    // balances
    const BA = P.balance, bL = C7.balance(svg, { x0: PN.left.x0 + 60, x1: PN.left.x1 - 60, y0: BA.y0, y1: BA.y1 }), bR = C7.balance(svg, { x0: PN.right.x0 + 60, x1: PN.right.x1 - 60, y0: BA.y0, y1: BA.y1 });
    const pRef = REF.p_positive, pA = MV.p_positive;
    const lPL = C7.lab(ctx, `P(D > 0) = ${K.fmt(pRef, 2, { fixed: 2 })} · symmetrized by construction`, PN.left.x0 + 10, BA.y0 - 104, 'halo', { w: 560 }); lPL.setAttribute('data-qa', 'over-ok');
    const lPR = C7.lab(ctx, `P(D > 0) = ${K.fmt(pA, 2, { fixed: 2 })}`, PN.right.x0 + 10, BA.y0 - 64, 'big halo'); lPR.setAttribute('data-qa', 'over-ok');
    K.pen(ctx, { kind: 'underline', box: { x: PN.right.x0 + 10, y: BA.y0 - 64, w: 260, h: 40 }, at: 'four+0.5', dur: 0.4, seed: 'u71' });
    // training runs at 0.86
    const run = MI.runs.find((r) => Math.abs(r.gamma - P.runs_gamma) < 1e-9), RB = P.runs_box, runG = K.s('g', {}, svg);
    const lRun = C7.lab(ctx, `training runs at Γ = ${run.gamma}`, RB.x0, RB.y0, '', { w: 260 });
    for (let i = 0; i < run.n_runs; i++) { const x = RB.x0 + 8 + i * 15; K.s('line', { x1: x, x2: x, y1: RB.y0 + 110, y2: RB.y0 + 190, stroke: K.c(i < run.n_up ? 'b' : 'b-neg'), 'stroke-width': 7, 'stroke-linecap': 'round' }, runG); }
    const lCnt = C7.lab(ctx, `${run.n_up} of ${run.n_runs} up`, RB.x0, RB.y0 + 206, 'big');
    K.pen(ctx, { kind: 'arrow', from: [RB.x0 - 10, RB.y0 + 150], to: [PN.right.x1 - 70, BA.y0 - 10], bend: -0.2, at: 'copied+0.8', dur: 0.6, seed: 'arr71' });
    // the cliffhanger: a point-mirror glyph and a question mark between the panels
    const mg = K.s('g', { transform: `translate(${(PN.left.x1 + PN.right.x0) / 2} 450)` }, svg);
    K.s('circle', { r: 30, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3 }, mg);
    K.s('line', { x1: -20, y1: 20, x2: 20, y2: -20, stroke: K.c('chalk'), 'stroke-width': 3, 'stroke-dasharray': '5 5' }, mg);
    K.s('text', { x: 0, y: 92, 'text-anchor': 'middle', style: 'font: 700 56px Inter Display', fill: K.c('chalk') }, mg, '?');
    K.badge(ctx, { kind: 'MEASURED', note: 'E1 · Γ = 0.85 · model A, seed 0', at: 'dials-0.15' });
    // WORKAROUND (script formula too long for one layer item at 28 px): its two halves (split at \quad), one after the other
    K.formulaLayer(ctx, { label: 'Formula · R:400-412', items: ((ctx.script.onscreen && ctx.script.onscreen.formulas) || []).flatMap((f) => f.tex.split('\\quad').map((tex, i) => ({ tex: i ? tex : tex.replace('\\ \\text{leaves', '\\quad\\text{leaves'), at: i ? 'four-0.15' : f.cue + '-0.15' }))) });
    ctx.c = { T, LC, XR, XA, nR, nA, oR, oA, pL, pR, ruler, lG, bL, bR, pRef, pA, lPL, lPR, runG, lRun, lCnt, mg, tEnd: ctx.at('_speech_end') };
  },
  render(t, ctx) {
    const S = Scene, P = ctx.params, c = ctx.c, T = c.T, g = c.LC.g;
    g.clearRect(0, 0, 1920, 1080);
    const pin = S.seg(t, T.dials, T.dials + 0.6, S.ease.linear);
    C7.fadeS(c.pL.g, t, T.dials); C7.fadeS(c.pR.g, t, T.dials); C7.fadeS(c.ruler, t, T.dials + 0.2); C7.fade(c.lG, t, T.dials + 0.4);
    const kR = Math.floor(c.nR * S.seg(t, T.grey, T.grey + P.reveal_s, S.ease.linear)), kA = Math.floor(c.nA * S.seg(t, T.violet, T.violet + P.reveal_s, S.ease.linear));
    if (kR > 0) C7.cloud(g, c.XR, c.nR, kR, c.pL, S.col('silver'), P.alpha_ref * pin, P.point_px, c.oR);
    if (kA > 0) C7.cloud(g, c.XA, c.nA, kA, c.pR, S.col('model'), P.alpha_model * pin, P.point_px, c.oA);
    const bOn = S.seg(t, T.weigh, T.weigh + 0.4, S.ease.linear);
    c.bL.g.setAttribute('opacity', bOn); c.bR.g.setAttribute('opacity', bOn);
    const tl = S.seg(t, T.tilt, T.tilt + 0.8, S.ease.inOutCubic);
    c.bL.set(0.5 + (c.pRef - 0.5) * tl); c.bR.set(0.5 + (c.pA - 0.5) * tl);
    C7.fade(c.lPL, t, T.four); C7.fade(c.lPR, t, T.four + 0.2);
    C7.fadeS(c.runG, t, T.copied); C7.fade(c.lRun, t, T.copied); C7.fade(c.lCnt, t, T.copied + 0.4);
    C7.fadeS(c.mg, t, c.tEnd - 0.15);
  },
});
</script></body></html>
