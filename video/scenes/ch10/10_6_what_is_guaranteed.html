<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>10.6 What is guaranteed</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch10.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="../../runtime/components/threemodes.js"></script>
<script src="ch10_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 10.6 What is guaranteed (L5, NIGHT, PROVED: Prop. 1, Prop. 4). Two columns, GUARANTEED (this scene) and MUST BE
   MEASURED (dim, filled in 10.7). data/fm3d_guarantees.json does not exist yet (requested, unit notes): when it is
   present, the log gauge drops its needles to g.div_rel_b / g.div_rel_u and the mirror error is printed; without it
   the field lines are a SCHEMATIC (closed loops) and the gauge reads AWAITING. No number is invented. */
Scene.define({
  duration: 27,
  register: 'night',
  cues: { nobet: 0.4, curl: 2.4, zero: 9.0, mirror: 14.6, mechanism: 19.4 },
  data: { g: { url: 'data/fm3d_guarantees.json', optional: true } },
  params: { gauge: { log_min: -18, log_max: 0, label: '∇·B, relative' }, columns: { left: 'GUARANTEED', right: 'MUST BE MEASURED (next scene)' } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK, G = ctx.data.g;
    U.label(ctx, { text: 'GUARANTEED', x: 120, y: 120, size: 36, cls: 'display', at: -0.3 });
    U.label(ctx, { text: 'MUST BE MEASURED', x: 1060, y: 120, size: 36, cls: 'display dim', alpha: 0.4, at: -0.3 });
    const sv = K.svgLayer(ctx, 12);
    K.s('line', { x1: 1000, x2: 1000, y1: 120, y2: 700, stroke: K.c('grid'), 'stroke-width': 2 }, sv);
    // the generated cube (violet frame) with field lines: closed loops (schematic unless the data file gives polylines)
    const C = { x: 140, y: 210, s: 360 }, cube = K.s('g', {}, sv);
    K.s('rect', { x: C.x, y: C.y, width: C.s, height: C.s, fill: 'none', stroke: K.c('model'), 'stroke-width': 4 }, cube);
    const loops = K.s('g', {}, cube), rng = S.rng('loops');
    for (let i = 0; i < 9; i++) { const cx = C.x + 60 + rng() * (C.s - 120), cy = C.y + 60 + rng() * (C.s - 120), rx = 30 + rng() * 60, ry = 20 + rng() * 50, a = rng() * 180;
      K.s('ellipse', { cx, cy, rx, ry, transform: `rotate(${a.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})`, fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, loops); }
    U.fade(ctx, cube, { at: 'nobet-0.15' });
    K.chip(ctx, { text: 'GENERATED · fm3d · untrained weights', kind: 'generated', x: C.x, y: 168, at: 'nobet', out: 'mirror-0.4' });
    if (!G) K.chip(ctx, { text: 'SCHEMATIC · field lines drawn as loops until data/fm3d_guarantees.json exists', kind: 'schematic', maxWidth: 820, x: 96, y: 790, at: 'nobet+0.4' });
    // potential -> curl: grey arrows feed the cube
    const pa = K.s('g', {}, sv);
    [0, 1, 2].forEach((k) => K.s('path', { d: `M${C.x + C.s + 40},${C.y + 80 + 90 * k} h-28 m10,-10 l-10,10 l10,10`, fill: 'none', stroke: K.c('muted'), 'stroke-width': 3 }, pa));
    U.fade(ctx, pa, { at: 'curl-0.15' });
    U.label(ctx, { text: 'potential → curl', x: C.x + C.s + 52, y: C.y + 20, size: 30, at: 'curl' });
    // the log gauge
    const GX = 840, gy0 = 260, gy1 = 640, GL = P.gauge, gy = (lg) => gy0 + (gy1 - gy0) * (GL.log_max - lg) / (GL.log_max - GL.log_min);
    const gg = K.s('g', {}, sv);
    K.s('line', { x1: GX, x2: GX, y1: gy0, y2: gy1, stroke: K.c('muted'), 'stroke-width': 4 }, gg);
    for (let e = GL.log_max; e >= GL.log_min; e -= 6) { K.s('line', { x1: GX - 12, x2: GX, y1: gy(e), y2: gy(e), stroke: K.c('muted'), 'stroke-width': 3 }, gg);
      K.s('text', { x: GX - 22, y: gy(e) + 10, 'text-anchor': 'end', class: 'kt-tick' }, gg, K.pow10(Math.pow(10, e))); }
    U.fade(ctx, gg, { at: 'zero-0.15' });
    U.label(ctx, { text: GL.label, x: GX + 30, y: gy0 - 20, size: 30, at: 'zero' });
    U.label(ctx, { text: 'random, untrained weights', x: GX + 20, y: gy1 + 14, size: 28, cls: 'dim', at: 'zero+0.4' });
    let needle = null, tZ = ctx.at('zero-0.15');
    if (G && Number.isFinite(G.div_rel_b)) {
      needle = K.s('path', { d: 'M0,0 l26,-12 v24 Z', fill: K.c('b') }, gg);
      const target = gy(Math.log10(G.div_rel_b));
      ctx.add({ render(t) { const p = S.seg(t, tZ, tZ + 1.2, S.ease.outCubic); needle.setAttribute('transform', `translate(${GX + 6} ${(gy0 + (target - gy0) * p).toFixed(1)})`); } });
    } else U.label(ctx, { text: 'AWAITING · fm3d_guarantees', x: GX + 20, y: (gy0 + gy1) / 2 - 20, size: 28, cls: 'mono', at: 'zero+0.2' });
    // mirror: two small samples, z and S z: the same loops, B reversed (a shade, not a hue)
    const m = K.s('g', {}, sv), ms = 150;
    [['b', 140], ['b-neg', 140 + ms + 60]].forEach(([col, x], i) => { K.s('rect', { x, y: 610, width: ms, height: ms, fill: K.c('bg'), stroke: K.c('model'), 'stroke-width': 3 }, m);
      [[0.35, 0.4, 30, 20], [0.65, 0.6, 26, 34]].forEach(([fx, fy, rx, ry]) => { K.s('ellipse', { cx: x + fx * ms, cy: 610 + fy * ms, rx, ry, fill: 'none', stroke: K.c(col), 'stroke-width': 3 }, m);
        K.s('path', { d: `M${x + fx * ms - 6},${610 + fy * ms - ry - 6} l${i ? -12 : 12},6 l${i ? 12 : -12},6`, fill: 'none', stroke: K.c(col), 'stroke-width': 3 }, m); }); });
    U.fade(ctx, m, { at: 'mirror-0.15' });
    U.label(ctx, { text: 'sample from z', x: 140, y: 610 - 40, size: 28, at: 'mirror' });
    U.label(ctx, { text: 'sample from S z · B → −B', x: 140 + ms + 60, y: 610 - 40, size: 28, at: 'mirror+0.3' });
    // the cube shrinks out of the way of the mirror pair
    ctx.u = { cube, loops, C, tM: ctx.at('mirror-0.3') };
    K.chip(ctx, { text: 'by construction (Prop. 1, Prop. 4): this shows the mechanism, not quality', kind: 'plain', maxWidth: 820, x: 1060, y: 200, at: 'mechanism-0.15' });
    K.badge(ctx, { kind: 'PROVED', at: -0.3 });
    UK.formulaLayers(ctx, 'Formula · Prop. 1, Prop. 4', UK.formulaItems(ctx, 80));
  },
  render(t, ctx) {
    const u = ctx.u, S = Scene, p = S.seg(t, u.tM, u.tM + 0.8, S.ease.inOutCubic), s = 1 - 0.55 * p;
    u.cube.setAttribute('transform', `translate(${(u.C.x * (1 - s)).toFixed(1)} ${(u.C.y * (1 - s) - 60 * p).toFixed(1)}) scale(${s.toFixed(4)})`);
    u.loops.setAttribute('opacity', (0.8 + 0.2 * Math.sin(t * 1.3)).toFixed(3));
  },
});
</script></body></html>
