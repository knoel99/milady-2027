<html lang="en"><head><meta charset="utf-8">
<title>10.5 Bet 2: a dynamo that saturates</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch10.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>

</head><body><div id="stage"></div>
<script>
/* 10.5 Bet 2: a dynamo that saturates (Taylor-Green) (L5, NIGHT, CONJECTURE medium; PENDING). READY anchor: the
   Taylor-Green forcing shape in z = 0 (analytic, k0 = 2: tracers, no data number), the Lorentz push-back arrows, a
   SCHEMATIC ln E_B(t) curve (growth then saturation) with the kept window; the seat: a 4 × 3 grid (Re × Pm) of empty
   runs with their Rm = Re × Pm (axis values of the configured grid), the bet, confidence, criterion and question. */
Scene.define({
  duration: 42,
  register: 'night',
  cues: { anchor: 0.4, push: 5.0, grow: 7.6, seat: 12.8, bet: 16.4, why: 21.4, catch: 28.0, ask: 32.4 },
  data: { seat: { url: 'data/palier2_tg3d.json', optional: true } },
  params: { flow: { tracers: 500, trail: 8 }, seat: { grid: { Re: [25, 50, 100, 200], Pm: [0.5, 1, 2] } },
    schematic_curve: { labels: ['seed 10⁻³ (rms)', 'exponential growth', 'saturation', 'kept window · t 100-140', 'still growing?'] } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK, sp = Object.assign({}, P.seat);
    // ---- anchor: Taylor-Green cells, u = (sin 2x cos 2y, -cos 2x sin 2y) on [0, 2π]², in a 440 px box
    const B = { x: 140, y: 200, w: 340, h: 340 }, k = 2 * Math.PI / B.w, sp0 = 90;
    const F = (x, y) => { const X = (x - B.x) * k * 2, Y = (y - B.y) * k * 2; return [sp0 * Math.sin(X) * Math.cos(Y), -sp0 * Math.cos(X) * Math.sin(Y)]; };
    K.tracers(ctx, { F, box: B, n: P.flow.tracers, trail: P.flow.trail, color: 'u', at: 'anchor-0.15', seed: 'tg' });
    const fsvg = K.svgLayer(ctx, 12); K.s('rect', { x: B.x, y: B.y, width: B.w, height: B.h, fill: 'none', stroke: K.c('matter'), 'stroke-width': 2 }, fsvg);
    U.label(ctx, { text: 'Taylor-Green flow · slice z = 0', x: 120, y: B.y - 88, size: 28, at: 'anchor' });
    const pg = K.s('g', {}, K.svgLayer(ctx, 13));
    [[B.x + B.w / 8, B.y + B.h / 8], [B.x + 5 * B.w / 8, B.y + 3 * B.h / 8]].forEach(([x, y]) => K.s('path', { d: `M${x - 26},${y + 20} q26,-46 52,0 m-10,-14 l10,14 l-16,4`, fill: 'none', stroke: K.c('b'), 'stroke-width': 4 }, pg));
    U.fade(ctx, pg, { at: 'push-0.15' });
    U.label(ctx, { text: 'Lorentz force: the field pushes back', x: B.x + 8, y: B.y + 8, maxW: 320, size: 28, color: 'b', cls: 'halo', at: 'push' });
    // ---- schematic ln E_B(t), small, under the flow
    const C = { x: 120, y: 600, w: 420, h: 110 }, cs = K.s('g', {}, K.svgLayer(ctx, 14));
    K.s('line', { x1: C.x, x2: C.x + C.w, y1: C.y + C.h, y2: C.y + C.h, stroke: K.c('muted'), 'stroke-width': 2 }, cs);
    const win = K.s('rect', { x: C.x + 0.72 * C.w, y: C.y, width: 0.26 * C.w, height: C.h, fill: K.rgba(K.c('muted'), 0.18) }, cs);
    const curve = (late) => { let d = ''; for (let i = 0; i <= 60; i++) { const u = i / 60, y = late ? Math.min(1, Math.max(0, (u - 0.15) * 1.0)) : 1 / (1 + Math.exp(-14 * (u - 0.45))); d += `${i ? 'L' : 'M'}${(C.x + u * C.w).toFixed(1)},${(C.y + C.h - 12 - y * (C.h - 24)).toFixed(1)}`; } return d; };
    K.s('path', { d: curve(false), fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3, 'stroke-dasharray': '10 7' }, cs);
    U.fade(ctx, cs, { at: 'grow-0.15' }); void win;
    const late = K.s('path', { d: curve(true), fill: 'none', stroke: K.c('chalk'), 'stroke-width': 3, 'stroke-dasharray': '3 6' }, K.svgLayer(ctx, 14));
    U.fade(ctx, late, { at: 'catch-0.15' });
    const SL = P.schematic_curve.labels;
    U.label(ctx, { text: 'ln E_B(t) · growth → ' + SL[2], x: C.x, y: C.y - 46, size: 28, cls: 'dim', at: 'grow' });
    U.label(ctx, { text: 'kept window', x: C.x + C.w - 4, y: C.y + 2, anchor: 'r', size: 28, cls: 'dim halo', at: 'grow+0.6' });
    U.label(ctx, { text: SL[4], x: C.x + C.w - 10, y: C.y + C.h - 44, anchor: 'r', size: 28, color: 'chalk', cls: 'halo', at: 'catch' });
    K.chip(ctx, { text: 'SCHEMATIC · growth then saturation, no data', kind: 'schematic', x: 96, y: 52, at: 'grow+0.4' });
    // ---- seat (map type) with a 4 × 3 grid of empty runs inside its square
    const fr = { x: 700, y: 236, w: 470, h: 380 };
    const SE = U.seat(ctx, Object.assign({}, sp, { grid: undefined }), { frame: fr, map: Object.assign({}, sp.map || {}, { title: '', xLabel: '', yLabel: '' }) });
    SE.root.querySelectorAll('text').forEach((e) => { if (['AWAITING DATA', 'x', 'y'].includes(e.textContent)) e.remove(); });   // the dashed cells say it
    const side = Math.min(fr.w - 160, fr.h - 60), mx = fr.x + 40, my = fr.y + 10, G = sp.grid, gg = K.s('g', {}, K.svgLayer(ctx, 13));
    const cw = side / G.Re.length, ch = side / G.Pm.length;
    G.Pm.forEach((pm, r) => G.Re.forEach((re, c) => { const x = mx + c * cw, y = my + side - (r + 1) * ch;
      K.s('rect', { x: x + 5, y: y + 5, width: cw - 10, height: ch - 10, fill: 'none', stroke: K.c('muted'), 'stroke-width': 1.5, 'stroke-dasharray': '4 5' }, gg);
      const t = K.s('text', { x: x + cw / 2, y: y + ch / 2 + 10, 'text-anchor': 'middle', class: 'kt-tick' }, gg, String(re * pm)); t.style.fill = K.c('param'); }));
    G.Re.forEach((re, c) => K.s('text', { x: mx + (c + 0.5) * cw, y: my + side + 40, 'text-anchor': 'middle', class: 'kt-tick' }, gg, String(re)).style.fill = K.c('param'));
    G.Pm.forEach((pm, r) => K.s('text', { x: mx - 12, y: my + side - (r + 0.5) * ch + 10, 'text-anchor': 'end', class: 'kt-tick' }, gg, String(pm)).style.fill = K.c('param'));
    U.fade(ctx, gg, { at: 'seat-0.15' });
    U.label(ctx, { text: 'Rm = Re × Pm · 12 runs · 64³ · 40 snapshots each', x: 600, y: 100, size: 28, cls: 'dim', at: 'seat+0.4' });
    U.label(ctx, { text: 'Re', x: mx + side / 2, y: my + side + 52, anchor: 'c', size: 32, color: 'param', at: 'seat' });
    U.label(ctx, { text: 'Pm', x: mx - 60, y: my - 50, anchor: 'c', size: 32, color: 'param', at: 'seat' });
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'medium', at: -0.3 });
    UK.formulaLayers(ctx, 'Formula', UK.formulaItems(ctx, 80), { left: true });
  },
});
</script></body></html>
