<html lang="en"><head><meta charset="utf-8">
<title>ch10.Q Question for the supervisors</title>

<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch10.css">
<script src="../../vendor/katex/katex.min.js"></script>

<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>

</head><body><div id="stage"></div>
<script>
/* ch10.Q (question card, no claim, no badge). Text, number, category and who-to-ask from the script's "question".
   Behind it at params.backdrop.opacity: the empty 4 × 3 grid of Taylor-Green runs of 10.5. */
Scene.define({
  duration: 9,
  register: 'night',
  cues: { q: 0.5 },
  params: { backdrop: { opacity: 0.1 } },
  setup(ctx) {
    const K = Kit, svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: ctx.params.backdrop.opacity }, svg);
    for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) K.s('rect', { x: 420 + c * 280, y: 200 + r * 230, width: 250, height: 200, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 4, 'stroke-dasharray': '14 10' }, bg);
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'ch10', category: 'runs', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
    window.__EVENTS__ = [{ t: Math.max(0, +(ctx.at('q') - 0.2).toFixed(3)), id: 'chime' }];
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-6 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
