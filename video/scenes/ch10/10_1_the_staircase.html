<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>10.1 The staircase</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch10.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="../../runtime/components/threemodes.js"></script>
<script src="ch10_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 10.1 The staircase (L4, NIGHT, PLANNED). Chapter card (rail L5 -> L4, declared side-step), then the large staircase
   of 03.7: step 0 and step 1 light with thumbnails from data/fig_plan_these.json (polarity strip of D, a current map),
   step 2 a 40 % preview (ABC mode slice), steps 2-4 marked BET; the 'independent proposal' chip holds to the end. */
Scene.define({
  duration: 27,
  register: 'night',
  cues: { stairs: 3.6, lit: 5.2, preview: 10.2, bets: 13.8 },
  data: { plan: 'data/fig_plan_these.json' },
  params: { chapter_card: { num: '10', level: 'L4', levelFrom: 'L5', tier: 2, pending: [3, 4] },
    staircase: { labels: ['three numbers', 'a flat sheet', 'a periodic box', 'the VKS cylinder', 'a precessing cylinder'], tags: ['E1 · three dials · CPU', 'E2 · flat sheet · CPU', 'E3 · kinematic ABC · 32³ · preview'] } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK, D = ctx.data.plan.data, cc = P.chapter_card;
    const title = (ctx.script.onscreen && ctx.script.onscreen.title) || 'The climb to 3D: bets on the staircase';
    K.chapterCard(ctx, { num: cc.num, title, level: cc.level, levelFrom: cc.levelFrom, tier: cc.tier, pending: cc.pending, at: -0.3, out: 'stairs-0.4', railHold: 2.6 });
    const X = 210, Y = 230, W = 1500, H = 470, sw = W / 5, base = 64, sh = (H - 60 - base) / 4;
    const svg = K.svgLayer(ctx, 14), g = K.s('g', {}, svg);
    K.staircase(ctx, { x: X, y: Y, w: W, h: H, lit: null, pending: [2, 3, 4], labels: false, at: 'stairs-0.15', svg: g });
    U.fade(ctx, g, { at: 'stairs-0.15' });
    const top = (i) => Y + H - base - i * sh - 60, cx = (i) => X + i * sw + sw / 2;
    P.staircase.labels.forEach((l, i) => { const e = U.label(ctx, { text: l, x: cx(i), y: Y + H + 12, anchor: 'c', size: 30, at: 'stairs+0.2' }); if (l.length > 16) { e.el.style.whiteSpace = 'normal'; e.el.style.width = '280px'; e.el.style.textAlign = 'center'; } });
    // lit steps: a bright outline over the block, a thumbnail above the icon, a mono tag under the label
    const hi = (i, at, alpha, dashed) => { const r = K.s('rect', { x: X + i * sw + 4, y: top(i) + 60, width: sw - 8, height: Y + H - top(i) - 60, fill: K.rgba(K.c('fg'), 0.1 * alpha), stroke: K.c('fg'), 'stroke-width': 3, 'stroke-dasharray': dashed ? '9 7' : 'none', opacity: alpha }, svg); U.fade(ctx, r, { at }); };
    const tL = ctx.at('lit-0.15'), tL2 = tL + 0.6, tP = ctx.at('preview-0.15');
    hi(0, tL, 1); hi(1, tL2, 1); hi(2, tP, 0.4, true);
    const TW = 200, TH = 110, ty = (i) => top(i) - TH - 16;
    const gs = D.gissinger;
    K.barcode(ctx, { box: { x: cx(0) - TW / 2, y: ty(0) + 30, w: TW, h: 50 }, series: { t: gs.t, D: gs.D }, at: tL, dur: 1.0 });
    const flat = (rows) => { const a = new Float32Array(rows.length * rows[0].length); rows.forEach((r, y) => r.forEach((v, x) => { a[y * r.length + x] = v; })); a.shape = [rows.length, rows[0].length]; return a; };
    const fm = (rows, i, at) => { const grid = flat(rows); let vm = 0; for (const v of grid) vm = Math.max(vm, Math.abs(v));   // display scale of the thumbnail only
      return K.fieldMap(ctx, { grid, ny: grid.shape[0], nx: grid.shape[1], kind: 'b', vmax: vm, x: cx(i) - TH / 2, y: ty(i), w: TH, h: TH, at, z: 15 }); };
    const jgrid = D.mhd2d.j; fm(jgrid, 1, tL2);
    const ab = D.abc.z1 || D.abc.x1; const m2 = fm(ab, 2, tP); if (m2 && m2.root) m2.root.style.opacity = 0.6;
    P.staircase.tags.forEach((tg, i) => { const w = tg.split(' · '); const l = U.label(ctx, { html: K.esc(w.slice(0, 2).join(' · ')) + '<br>' + K.esc(w.slice(2).join(' · ')), x: cx(i), y: Y + H + 56, anchor: 'c', size: 28, cls: 'dim', at: [tL, tL2, tP][i] + 0.2 }); l.el.style.textAlign = 'center'; });
    // BET seats on steps 2-4
    [2, 3, 4].forEach((i, k) => { const bx = cx(i) - 44, by = top(i) + 60 + 62, b = K.s('g', {}, svg);
      K.s('rect', { x: bx, y: by, width: 88, height: 40, rx: 4, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '6 5' }, b);
      K.s('text', { x: cx(i), y: by + 30, 'text-anchor': 'middle', class: 'kt-mono' }, b, 'BET');
      U.fade(ctx, b, { at: ctx.at('bets-0.15') + 0.3 * k }); });
    K.chip(ctx, { text: (ctx.script.onscreen && ctx.script.onscreen.chips && ctx.script.onscreen.chips[0]) || 'Independent PhD proposal · not requested or validated by the supervisors', kind: 'plain', x: 960, y: 128, anchor: 'tl', at: 'bets+0.6' }).root.style.transform = 'translate(-50%,0)';
    K.badge(ctx, { kind: 'PLANNED', at: 'stairs-0.15' });
    K.lowerThird(ctx, { kind: 'source', data: ctx.data.plan, at: 'lit+1.0', hold: 4 });
    ctx.u = { g };
  },
  render(t, ctx) { const b = 1 + 0.004 * Math.sin(2 * Math.PI * t / 4); ctx.u.g.setAttribute('transform', `translate(960 465) scale(${b.toFixed(4)}) translate(-960 -465)`); },
});
</script></body></html>
