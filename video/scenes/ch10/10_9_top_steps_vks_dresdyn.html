<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>10.9 The top steps: VKS and DRESDYN</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch10.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>

</head><body><div id="stage"></div>
<script>
/* 10.9 The top steps: VKS and DRESDYN (L5, NIGHT, CONJECTURE low; PENDING). READY anchor: the two machines drawn
   schematically (VKS with two soft-iron impellers; the DRESDYN cylinder, slowly precessing). Then two empty seats
   sharing one right column: VKS (map, joint law of D and Q) carries the column; DRESDYN (Rm_c against Po, ±10 % band)
   is a second dashed frame with its own tag and criterion line. */
Scene.define({
  duration: 32,
  register: 'night',
  cues: { top: 0.4, seats: 7.6, vks: 9.6, dresdyn: 17.4, data: 22.8 },
  data: { vks: { url: 'data/tier3_vks.json', optional: true }, dresdyn: { url: 'data/tier4_dresdyn.json', optional: true } },
  params: { seat_vks: { map: {} }, seat_dresdyn: {}, confidence: 'low', why: '', ask: '' },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK, sv = K.svgLayer(ctx, 12), ink = K.c('fg-2');
    // anchor drawings (schematic), shrinking to corner icons at 'seats'
    const cylD = (x, y, w, h) => `M${x},${y + 16} v${h - 32} a${w / 2},16 0 0 0 ${w},0 v${-(h - 32)} a${w / 2},16 0 0 0 ${-w},0 a${w / 2},16 0 0 0 ${w},0`;
    const vks = K.s('g', {}, sv); K.s('path', { d: cylD(-110, -170, 220, 340), fill: 'none', stroke: ink, 'stroke-width': 3 }, vks);
    [-120, 120].forEach((y) => K.s('rect', { x: -80, y: y - 8, width: 160, height: 16, fill: K.c('matter'), stroke: ink, 'stroke-width': 2 }, vks));
    const dr = K.s('g', {}, sv), drIn = K.s('g', {}, dr); K.s('path', { d: cylD(-110, -150, 220, 300), fill: 'none', stroke: ink, 'stroke-width': 3 }, drIn);
    K.s('line', { x1: 0, y1: -200, x2: 0, y2: 200, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '6 6' }, dr);
    const tS = ctx.at('seats-0.15');
    U.label(ctx, { text: 'VKS · two soft-iron impellers', x: 560, y: 690, anchor: 'c', size: 30, at: 'top', out: 'seats-0.3' });
    U.label(ctx, { text: 'DRESDYN · precessing cylinder', x: 1360, y: 690, anchor: 'c', size: 30, at: 'top', out: 'seats-0.3' });
    K.chip(ctx, { text: 'SCHEMATIC · VKS and DRESDYN drawings', kind: 'schematic', x: 96, y: 52, at: 'top' });
    // seats: VKS (Kit.seat map, carries the column), DRESDYN drawn beside it
    const sp = Object.assign({ tag: 'tier3_vks', type: 'map' }, P.seat_vks, { confidence: P.confidence, ask: P.ask, why: P.why,
      cues: { frame: 'seats', bet: 'vks', criterion: 'vks+1.2', ask: 'data+1.0', data: 'seats+0.8' } });
    ctx.data.seat = ctx.data.vks;
    U.seat(ctx, sp, { frame: { x: 250, y: 300, w: 380, h: 330 }, map: Object.assign({}, sp.map, { title: '' }) });
    const D = { x: 730, y: 330, w: 380, h: 240 }, dg = K.s('g', {}, sv);
    K.s('rect', { x: D.x - 20, y: D.y - 70, width: D.w + 40, height: D.h + 250, rx: 10, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2.5, 'stroke-dasharray': '14 10' }, dg);
    K.s('line', { x1: D.x + 60, x2: D.x + D.w, y1: D.y + D.h, y2: D.y + D.h, stroke: K.c('param'), 'stroke-width': 3 }, dg);
    K.s('line', { x1: D.x + 60, x2: D.x + 60, y1: D.y, y2: D.y + D.h, stroke: K.c('muted'), 'stroke-width': 2 }, dg);
    K.s('path', { d: `M${D.x + 70},${D.y + 200} C${D.x + 200},${D.y + 120} ${D.x + 300},${D.y + 160} ${D.x + D.w - 10},${D.y + 80}`, fill: 'none', stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '8 8' }, dg);
    K.s('path', { d: `M${D.x + 70},${D.y + 170} C${D.x + 200},${D.y + 90} ${D.x + 300},${D.y + 130} ${D.x + D.w - 10},${D.y + 50} L${D.x + D.w - 10},${D.y + 110} C${D.x + 300},${D.y + 190} ${D.x + 200},${D.y + 150} ${D.x + 70},${D.y + 230} Z`, fill: K.rgba(K.c('chalk'), 0.08), stroke: 'none' }, dg);
    U.fade(ctx, dg, { at: 'seats+0.2' });
    U.label(ctx, { text: 'Po, Poincaré number', x: D.x + 60 + (D.w - 60) / 2, y: D.y + D.h + 14, anchor: 'c', size: 28, color: 'param', at: 'seats+0.2' });
    U.label(ctx, { text: 'Rm_c, threshold · ± 10 %', x: D.x + 60, y: D.y - 50, size: 28, at: 'seats+0.2' });
    U.label(ctx, { html: K.upper('DATA · tier4_dresdyn') + '<br>' + K.upper('AWAITING'), x: D.x, y: D.y - 134, cls: 'mono', at: 'seats+0.4' });
    U.label(ctx, { text: (P.seat_dresdyn.criterion || '') + (P.seat_dresdyn.source ? ' · ' + P.seat_dresdyn.source : ''), x: D.x - 10, y: D.y + D.h + 54, size: 28, cls: 'dim', maxW: D.w + 20, at: 'dresdyn-0.15' });
    K.chip(ctx, { text: 'CAVEAT · no MilaDy data used · consortium simulations, not public (T:929)', kind: 'plain', maxWidth: 1080, x: 96, y: 790, at: 'data-0.15' });
    ctx.u = { vks, dr, drIn, tS };
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'low', at: -0.3 });
  },
  render(t, ctx) {
    const u = ctx.u, S = Scene, p = S.seg(t, u.tS, u.tS + 0.8, S.ease.inOutCubic), s = 1 - 0.75 * p;
    u.vks.setAttribute('transform', `translate(${560 + (200 - 560) * p} ${440 + (200 - 440) * p}) scale(${s})`);
    u.dr.setAttribute('transform', `translate(${1360 + (330 - 1360) * p} ${440 + (200 - 440) * p}) scale(${s}) rotate(${(12 * Math.sin(2 * Math.PI * t / 12)).toFixed(2)})`);
    u.drIn.setAttribute('transform', `rotate(${(4 * Math.sin(2 * Math.PI * t / 3)).toFixed(2)})`);
    [u.vks, u.dr].forEach((g) => { g.style.opacity = (1 - 0.6 * p).toFixed(3); });
  },
});
</script></body></html>
