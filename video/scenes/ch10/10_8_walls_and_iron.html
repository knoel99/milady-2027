<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>10.8 Walls and iron</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch10.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="../../runtime/components/threemodes.js"></script>
<script src="ch10_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 10.8 Walls and iron (L5, PAPER, PROVED: Thm 2.2 published, Prop. 2.6, Remark 2.5; untested). Ink drawings, no data:
   the periodic box becomes a bounded cylinder; the potential's arrows snap tangent at the wall (gauge + wall
   condition); a soft-iron slab bends the field lines (SCHEMATIC, refraction exaggerated) and the potential needs a
   kink there; the exterior current-free field; one wall point linked to the whole wall (nonlocal); an open question. */
Scene.define({
  duration: 42,
  register: 'paper',
  cues: { leave: 0.4, gauge: 4.4, iron: 9.6, vacuum: 20.4, nonlocal: 24.6, open: 31.0 },
  params: { nonlocal: { rays: 24 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK, sv = K.svgLayer(ctx, 12), ink = K.c('fg-2'), b = K.c('b');
    // the periodic box and its ghost copies, then the cylinder (meridian section)
    const X0 = 260, Y0 = 230, W = 300, H = 420;
    const box = K.s('g', {}, sv);
    [[-1, 0], [1, 0], [0, -1], [0, 1]].forEach(([i, j]) => K.s('rect', { x: X0 + i * (W + 10), y: Y0 + j * (H + 10), width: W, height: H, fill: 'none', stroke: ink, 'stroke-width': 2, 'stroke-dasharray': '6 8', opacity: 0.35 }, box));
    K.s('rect', { x: X0, y: Y0, width: W, height: H, fill: 'none', stroke: ink, 'stroke-width': 3 }, box);
    U.fade(ctx, box, { at: -0.3, out: 'leave+0.4', dout: 0.8 });
    const cyl = K.s('g', {}, sv);
    K.s('path', { d: `M${X0},${Y0 + 30} v${H - 60} a${W / 2},30 0 0 0 ${W},0 v${-(H - 60)} a${W / 2},30 0 0 0 ${-W},0 a${W / 2},30 0 0 0 ${W},0`, fill: 'none', stroke: K.c('fg'), 'stroke-width': 3.5 }, cyl);
    U.fade(ctx, cyl, { at: 'leave+0.4', din: 0.8 });
    U.label(ctx, { text: 'periodic box → bounded vessel', x: X0 + W / 2, y: Y0 - 120, anchor: 'c', size: 32, at: 'leave+0.4' });
    // potential arrows; near the wall they lose their normal part
    const arrows = [], ag = K.s('g', {}, sv), rng = S.rng('A');
    for (let i = 0; i < 5; i++) for (let j = 0; j < 7; j++) { const x = X0 + 30 + i * (W - 60) / 4, y = Y0 + 60 + j * (H - 120) / 6, a = rng() * 6.283, wall = i === 0 || i === 4;
      const e = K.s('path', { d: 'M-14,0 H14 M6,-6 L14,0 L6,6', fill: 'none', stroke: ink, 'stroke-width': 2.5 }, ag); arrows.push({ e, x, y, a, wall, k: j * 0.05 }); }
    U.fade(ctx, ag, { at: 'gauge-0.15', out: 'iron-0.2' });
    U.label(ctx, { text: 'gauge + wall condition → one potential per field', x: X0, y: Y0 + H + 50, size: 30, maxW: 560, at: 'gauge+0.2', out: 'vacuum-0.2' });
    // the iron panel (SCHEMATIC): hatched slab, refracted lines, and the potential's profile across the interface
    const I = { x: 900, y: 190, w: 620, h: 300 }, ir = K.s('g', {}, sv);
    const pat = K.s('pattern', { id: 'hatch10', width: 12, height: 12, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, K.s('defs', {}, ir));
    K.s('line', { x1: 0, y1: 0, x2: 0, y2: 12, stroke: K.c('matter'), 'stroke-width': 2 }, pat);
    const sy0 = I.y + I.h / 2 - 50;
    K.s('rect', { x: I.x, y: sy0, width: I.w, height: 100, fill: 'url(#hatch10)', stroke: K.c('matter'), 'stroke-width': 2 }, ir);
    [0, 1, 2, 3].forEach((k) => { const x = I.x + 90 + k * 140; K.s('path', { d: `M${x},${I.y} L${x + 40},${sy0} L${x + 170},${sy0 + 100} L${x + 210},${I.y + I.h}`, fill: 'none', stroke: b, 'stroke-width': 3 }, ir); });
    U.fade(ctx, ir, { at: 'iron-0.15' });
    U.label(ctx, { text: 'soft iron', x: I.x + I.w + 14, y: sy0 + 30, size: 28, at: 'iron' });
    U.label(ctx, { text: 'B · n continuous · tangential B / μ_r continuous', x: I.x, y: I.y - 50, size: 28, at: 'iron+0.6' });
    K.chip(ctx, { text: 'SCHEMATIC · refraction exaggerated', kind: 'schematic', x: I.x, y: I.y + I.h + 8, at: 'iron+0.3' });
    const Pf = { x: 900, y: 580, w: 620, h: 150 }, pf = K.s('g', {}, sv), xm = Pf.x + Pf.w / 2;
    K.s('line', { x1: xm, x2: xm, y1: Pf.y, y2: Pf.y + Pf.h, stroke: K.c('matter'), 'stroke-width': 2, 'stroke-dasharray': '5 6' }, pf);
    K.s('path', { d: `M${Pf.x},${Pf.y + 110} C${xm - 100},${Pf.y + 110} ${xm - 60},${Pf.y + 30} ${xm},${Pf.y + 30} C${xm + 60},${Pf.y + 30} ${xm + 100},${Pf.y + 110} ${Pf.x + Pf.w},${Pf.y + 110}`, fill: 'none', stroke: ink, 'stroke-width': 3 }, pf);
    K.s('path', { d: `M${Pf.x},${Pf.y + 140} L${xm},${Pf.y + 20} L${Pf.x + Pf.w},${Pf.y + 140}`, fill: 'none', stroke: b, 'stroke-width': 3.5 }, pf);
    U.fade(ctx, pf, { at: U.frac(ctx, 'iron', 0.6, 3) });
    U.label(ctx, { text: 'smooth potential', x: Pf.x, y: Pf.y + 60, size: 28, cls: 'dim', at: U.frac(ctx, 'iron', 0.6, 3) });
    U.label(ctx, { text: 'kinked potential', x: Pf.x + Pf.w, y: Pf.y + 60, anchor: 'r', size: 28, color: 'b', at: U.frac(ctx, 'iron', 0.7, 3.4) });
    K.pen(ctx, { kind: 'cross', box: { x: xm - 150, y: Pf.y + 40, w: 40, h: 40 }, at: U.frac(ctx, 'iron', 0.8, 4), dur: 0.4, seed: 'x1' });
    K.pen(ctx, { kind: 'circle', box: { x: xm - 18, y: Pf.y + 6, w: 36, h: 30 }, at: U.frac(ctx, 'iron', 0.9, 4.4), dur: 0.5, seed: 'c1' });
    [ir, pf].forEach((g) => { g.__out = true; });
    // vacuum: exterior field lines wrapping the cylinder
    const vg = K.s('g', {}, sv);
    [60, 120, 190].forEach((d) => K.s('path', { d: `M${X0 + W / 2},${Y0 - 10} C${X0 - d},${Y0 - 10} ${X0 - d},${Y0 + H + 10} ${X0 + W / 2},${Y0 + H + 10} C${X0 + W + d},${Y0 + H + 10} ${X0 + W + d},${Y0 - 10} ${X0 + W / 2},${Y0 - 10}`, fill: 'none', stroke: b, 'stroke-width': 2, opacity: 0.8 }, vg));
    U.fade(ctx, vg, { at: 'vacuum-0.15' });
    U.label(ctx, { text: 'vacuum: current-free field', x: X0 + W / 2, y: Y0 + H + 50, anchor: 'c', size: 30, at: 'vacuum+0.2' });
    // nonlocal: one wall point joined to many wall points
    const ng = K.s('g', {}, sv), px = X0 + W, py = Y0 + H * 0.4;
    for (let k = 0; k < P.nonlocal.rays; k++) { const u = k / (P.nonlocal.rays - 1), side = k % 2, y = Y0 + 30 + u * (H - 60); K.s('line', { x1: px, y1: py, x2: side ? X0 : X0 + W, y2: y, stroke: K.c('matter'), 'stroke-width': 1.5 }, ng); }
    K.s('circle', { cx: px, cy: py, r: 9, fill: b }, ng);
    U.fade(ctx, ng, { at: 'nonlocal-0.15' });
    U.label(ctx, { text: 'one point depends on the whole wall', x: px + 20, y: py - 20, size: 30, cls: 'halo', at: 'nonlocal+0.2' });
    U.label(ctx, { text: '?', x: X0 + W + 210, y: Y0 + 40, size: 72, color: 'chalk', at: 'open-0.15' });
    K.chip(ctx, { text: 'vacuum matching: candidate routes, an open question of the PhD plan', kind: 'plain', maxWidth: 820, x: 96, y: 790, at: 'open' });
    ctx.u = { arrows, tG: ctx.at('gauge+0.3'), ir, pf, tV: ctx.at('vacuum-0.3') };
    K.badge(ctx, { kind: 'PROVED', at: -0.3 });
    UK.formulaLayers(ctx, 'Formula', UK.formulaItems(ctx, 90));
  },
  render(t, ctx) {
    const u = ctx.u, S = Scene;
    u.arrows.forEach((a) => { const p = a.wall ? S.seg(t, u.tG + a.k * 4, u.tG + a.k * 4 + 0.6, S.ease.inOutCubic) : 0, ang = a.a * (1 - p) + (a.a > Math.PI ? 1.5 * Math.PI : 0.5 * Math.PI) * p;
      a.e.setAttribute('transform', `translate(${a.x.toFixed(1)} ${a.y.toFixed(1)}) rotate(${(ang * 180 / Math.PI + 4 * Math.sin(t + a.x)).toFixed(2)})`); });
    const o = 1 - S.seg(t, u.tV, u.tV + 0.5, S.ease.linear); [u.ir, u.pf].forEach((g) => { g.style.opacity = (+g.style.opacity || 0) * (0.35 + 0.65 * o); });
  },
});
</script></body></html>
