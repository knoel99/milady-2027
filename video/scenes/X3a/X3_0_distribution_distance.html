<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X3.0 The distribution distance, defined</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X3a.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="X3a_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X3.0 The distribution distance, defined (L4, PAPER, CONTEXT: Székely & Rizzo 2013). Two SCHEMATIC toy crowds
   (seeded Gaussians); cross-pair hairlines (amber), within-pair hairlines (ink / violet); the generated crowd glides
   onto the simulated law and a live plug-in estimate (no digits) shrinks to just above the noise floor. */
Scene.define({
  duration: 21, register: 'paper',
  cues: { sand: 1.0, pairs: 4.4, dots: 7.6, cross: 9.6, within: 13.0, zero: 16.2 },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, C = P.clouds;
    const MT = P.module_tag || { l1: 'EXTENSION · X3a', l2: 'Crowd laws, deeper', hold: 3 };
    K.lowerThird(ctx, { kind: 'chapter', l1: MT.l1, l2: MT.l2, at: -0.2, out: Math.min(MT.hold, ctx.at('pairs-0.6')) });
    K.rail(ctx, { from: 'L4', to: 'L4', at: -0.2, hold: 3 });
    K.badge(ctx, { kind: 'CONTEXT', note: 'the score used in E1 and E2', at: -0.3 });
    // sand pile glyph (callback to 06.5)
    const svg = K.svgLayer(ctx, 12), sand = K.s('g', {}, svg);
    K.s('path', { d: 'M180,330 C230,250 290,230 330,230 C370,230 430,250 480,330 Z', fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, sand);
    for (let k = 0; k < 9; k++) K.s('circle', { cx: 220 + 30 * k, cy: 315 - 30 * Math.sin(Math.PI * k / 8), r: 3, fill: K.c('fg-2') }, sand);
    const sandL = XK.lab(ctx, '{metric}distribution distance{/}', 510, 280, {});
    const tS = ctx.at('sand-0.15'), tP = ctx.at('pairs-0.15');
    // crowds (y range scaled by 0.85 so the bottom chip stays clear)
    const rng = S.rng(C.seed || 'x30-clouds'), rng2 = S.rng((C.seed || 'x30-clouds') + '-same');
    const sim = [], gen = [], gen2 = [];
    for (let i = 0; i < C.n; i++) { const a = XK.gauss(rng); sim.push([C.sim.cx + C.sim.sx * 0.85 * a[0], C.sim.cy - 20 + C.sim.sy * 0.85 * a[1]]); }
    for (let i = 0; i < C.n; i++) { const a = XK.gauss(rng); gen.push([C.gen.cx + C.gen.sx * 0.85 * a[0], C.gen.cy - 20 + C.gen.sy * 0.85 * a[1]]); }
    for (let i = 0; i < C.n; i++) { const a = XK.gauss(rng2); gen2.push([C.sim.cx + C.sim.sx * 0.85 * a[0], C.sim.cy - 20 + C.sim.sy * 0.85 * a[1]]); }
    const LC = K.canvasLayer(ctx, 6, { x: 200, y: 330, w: 1520, h: 520 }, null, { reset: true });
    const dg = K.s('g', {}, svg);
    const sd = sim.map((p) => K.s('circle', { cx: p[0], cy: p[1], r: 7, fill: K.c('fg') }, dg));
    const gd = gen.map(() => K.s('circle', { r: 7, fill: K.c('model') }, dg));
    const gr = gen.map(() => K.s('circle', { r: 12, fill: 'none', stroke: K.c('model'), 'stroke-width': 1.5, 'stroke-dasharray': '3 3' }, dg));
    XK.timed(ctx, dg, 'pairs-0.15', null, { din: 0.6 });
    XK.lab(ctx, 'simulated crowd', 380, 560, { anchor: 'r', at: 'pairs+0.2', cls: 'halo' });
    XK.lab(ctx, '{model}generated crowd{/}', 1450, 560, { at: 'pairs+0.4', cls: 'halo' });
    XK.lab(ctx, 'one dot = one snapshot', 1450, 620, { at: 'dots', out: 'cross-0.2' });
    K.chip(ctx, { text: 'SCHEMATIC · two toy crowds', kind: 'schematic', x: 120, y: 766, at: 'pairs+0.4' });
    K.chip(ctx, { text: 'technical name: energy distance · REFERENCE · Székely & Rizzo 2013', kind: 'plain', x: 120, y: 820, at: 'pairs+0.6' });
    // equation
    const tex = ctx.script.onscreen && ctx.script.onscreen.labels ? ctx.script.onscreen.labels.find((l) => l.indexOf('\\term{cross}') >= 0) : null;
    const E = K.equation(ctx, { tex: (tex || '').replace(/^\$|\$$/g, ''), x: P.equation.x - 120, y: P.equation.y - 40, size: P.equation.size,
      reveal: [['cross', 'cross'], [['w1', 'w2'], 'within']],
      labels: [{ id: 'cross', text: 'across the two crowds · ×2', color: 'metric', at: 'cross+0.3', out: 'within-0.1' }, { id: 'w1', text: 'within each crowd', at: 'within+0.3' }] });
    void E;
    XK.lab(ctx, '0 ⇔ same law', 1440, 316, { at: 'zero+0.8', color: 'metric', cls: 'big' });
    // gauge (amber bar, live plug-in estimate, no digits)
    const G = P.gauge.box, gb = K.s('g', {}, svg);
    K.s('rect', { x: G[0], y: G[1] + 60, width: G[2], height: G[3], fill: 'none', stroke: K.c('muted'), 'stroke-width': 2 }, gb);
    const gbar = K.s('rect', { x: G[0], y: G[1] + 60, height: G[3], fill: K.c('metric') }, gb);
    XK.timed(ctx, gb, 'cross-0.15', null);
    const D = (A, B, same) => { let s = 0, n = 0; for (let i = 0; i < A.length; i++) for (let j = 0; j < B.length; j++) { if (same && i === j) continue; s += Math.hypot(A[i][0] - B[j][0], A[i][1] - B[j][1]); n++; } return s / n; };
    const est = (G2) => 2 * D(sim, G2, false) - D(sim, sim, true) - D(G2, G2, true);
    const E0 = est(gen), E1 = est(gen2), fl = Math.max(E1, 0.04 * E0);
    const floorX = G[0] + G[2] * fl / E0 * 0.9;
    K.s('line', { x1: floorX, x2: floorX, y1: G[1] + 50, y2: G[1] + 104, stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '5 4' }, gb);
    XK.lab(ctx, 'noise floor', floorX - 10, G[1] + 106, { cls: 'small', at: 'zero+0.6' });
    // cross / within orders (seeded)
    const ord = []; for (let i = 0; i < C.n; i++) for (let j = 0; j < C.n; j++) ord.push([i, j]);
    const or = S.rng('x30-order'); for (let k = ord.length - 1; k > 0; k--) { const j = Math.floor(or() * (k + 1)); [ord[k], ord[j]] = [ord[j], ord[k]]; }
    ctx.x30 = { sand, sandL, tS, tP, sim, gen, gen2, gd, gr, LC, ord, tC: ctx.at('cross-0.15'), tW: ctx.at('within-0.15'), tZ: ctx.at('zero-0.15'), tD: ctx.at('dots-0.15'),
      gbar, G, E0, est, P };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.x30;
    const pin = S.seg(t, c.tS, c.tS + 0.4, S.ease.linear), pout = S.seg(t, c.tP, c.tP + 0.5, S.ease.inOutSine);
    c.sand.style.opacity = c.sandL.style.opacity = (pin * (1 - pout)).toFixed(3); c.sand.style.transform = `translateX(${(-300 * pout).toFixed(1)}px)`;
    c.sandL.style.display = c.sand.style.display = pin > 0 && pout < 1 ? '' : 'none';
    const z = S.seg(t, c.tZ, c.tZ + 1.2, S.ease.inOutSine);
    const G2 = c.gen.map((p, i) => [XK.lerp(p[0], c.gen2[i][0], z), XK.lerp(p[1], c.gen2[i][1], z)]);
    const sw = S.seg(t, c.tD, c.tD + 0.3, S.ease.outCubic) * (1 - S.seg(t, c.tD + 0.8, c.tD + 1.1, S.ease.linear));
    c.gd.forEach((d, i) => { d.setAttribute('cx', G2[i][0].toFixed(1)); d.setAttribute('cy', G2[i][1].toFixed(1)); d.setAttribute('r', i === 0 ? (7 + 9 * sw).toFixed(1) : 7);
      c.gr[i].setAttribute('cx', G2[i][0].toFixed(1)); c.gr[i].setAttribute('cy', G2[i][1].toFixed(1)); });
    const g = c.LC.g, ox = 200, oy = 330; g.clearRect(0, 0, c.LC.w, c.LC.h); g.lineWidth = 1;
    const pc = S.seg(t, c.tC, c.tC + 0.8, S.ease.linear), nC = Math.floor(pc * c.ord.length);
    if (nC > 0) { g.strokeStyle = K.rgba(K.c('metric'), c.P.lines.cross_opacity * 4); g.beginPath();
      for (let k = 0; k < nC; k++) { const [i, j] = c.ord[k]; g.moveTo(c.sim[i][0] - ox, c.sim[i][1] - oy); g.lineTo(G2[j][0] - ox, G2[j][1] - oy); } g.stroke(); }
    const pw = S.seg(t, c.tW, c.tW + 0.8, S.ease.linear);
    if (pw > 0) { const nn = c.sim.length, lim = Math.floor(pw * nn);
      g.strokeStyle = K.rgba(K.c('fg'), c.P.lines.within_opacity * 3); g.beginPath();
      for (let i = 0; i < lim; i++) for (let j = i + 1; j < nn; j++) { g.moveTo(c.sim[i][0] - ox, c.sim[i][1] - oy); g.lineTo(c.sim[j][0] - ox, c.sim[j][1] - oy); } g.stroke();
      g.strokeStyle = K.rgba(K.c('model'), c.P.lines.within_opacity * 3); g.beginPath();
      for (let i = 0; i < lim; i++) for (let j = i + 1; j < nn; j++) { g.moveTo(G2[i][0] - ox, G2[i][1] - oy); g.lineTo(G2[j][0] - ox, G2[j][1] - oy); } g.stroke(); }
    const e = t >= c.tZ ? c.est(G2) : c.E0;
    c.gbar.setAttribute('width', (c.G[2] * 0.9 * Math.max(0, e) / c.E0).toFixed(1));
  },
});
</script></body></html>
