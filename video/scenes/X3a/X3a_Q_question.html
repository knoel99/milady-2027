<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X3a.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X3a.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="X3a_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X3a.Q question card (no claim, no badge). Text from the script's "question"; behind it at 10 %, a texture of grouped
   bars (schematic heights, no data) with a row of squares, echoing X3.4. */
Scene.define({
  duration: 9, register: 'night',
  cues: { q: 0.5 },
  params: { backdrop: { opacity: 0.1 } },
  setup(ctx) {
    const K = Kit, P = ctx.params;
    window.__EVENTS__ = [{ t: +Math.max(0, ctx.at('q') - 0.2).toFixed(3), id: 'chime', gain_db: -22 }];
    const svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: P.backdrop.opacity }, svg);
    const hs = [[0.3, 0.3, 0.3], [0.4, 0.4, 0.35], [0.55, 0.55, 0.45], [0.75, 0.74, 0.5], [0.9, 0.89, 0.55]];
    hs.forEach((g, gi) => g.forEach((h, k) => { const x = 380 + gi * 260 + k * 56; K.s('rect', { x, y: 900 - 700 * h, width: 46, height: 700 * h - 120, fill: k === 2 ? K.c('metric') : 'none', stroke: k === 0 ? K.c('model') : K.c('muted'), 'stroke-width': 4 }, bg);
      if (k === 1) K.s('rect', { x: x - 10, y: 820, width: 40 - 8 * gi, height: 40 - 8 * gi, fill: K.c('metric') }, bg); }));
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'X3a', category: 'framing', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-6 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
