<html lang="en"><head><meta charset="utf-8">
<title>X3.1 The least-distorting correction</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">

<script src="../../vendor/katex/katex.min.js"></script>

</head><body><div id="stage"></div>
<script>
/* X3.1 The least-distorting correction (L4, NIGHT, PROVED: Proposition 7). SCHEMATIC toy law of the report's
   interactive diagram (constants in the entry): n dots at the shifted quantiles of μ; three weightings that hit the
   target average 0, solved in setup (drop the top, linear, exponential tilt); costs KL(w‖uniform) as bars (no digits);
   the tilt's cost is checked to be the smallest. Then the Pythagorean picture of the I-projection (inset). */
Scene.define({
  duration: 41, register: 'night',
  cues: { route: 1.6, off: 3.4, stay: 6.2, many: 9.6, least: 12.0, line: 17.6, foot: 21.6, extra: 24.4, moves: 28.6 },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, T = P.toy, AX = P.axis, ST = P.strip, HB = P.hist;
    XK.inkChange(ctx, 0.1, 1.4, 540, 'paper');
    K.badge(ctx, { kind: 'PROVED', note: 'Prop. 7 · exact on the sample, when β* exists', at: -0.3 });
    // ---- the toy law ----
    const erf = (x) => { const s = Math.sign(x), a = Math.abs(x), t = 1 / (1 + 0.3275911 * a); return s * (1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-a * a)); };
    const cdf = (x) => T.p.reduce((s, p, k) => s + p * 0.5 * (1 + erf((x - T.m[k]) / (T.s[k] * Math.SQRT2))), 0);
    const pdf = (x) => T.p.reduce((s, p, k) => s + p * Math.exp(-0.5 * ((x - T.m[k]) / T.s[k]) ** 2) / (T.s[k] * Math.sqrt(2 * Math.PI)), 0);
    const inv = (u) => { let a = -10, b = 10; for (let i = 0; i < 60; i++) { const m = (a + b) / 2; if (cdf(m) < u) a = m; else b = m; } return (a + b) / 2; };
    const n = T.n, r = []; for (let j = 1; j <= n; j++) r.push(inv((j - 0.5) / n) + T.bias);
    const norm = (w) => { const s = w.reduce((a, b) => a + b, 0); return w.map((x) => x / s); };
    const avg = (w) => w.reduce((s, x, i) => s + x * r[i], 0);
    const U = r.map(() => 1 / n);
    // drop the top
    let S0 = 0, kk = 0, f = 0; for (let k = 0; k < n; k++) { if (S0 < 0 && S0 + r[k] >= 0) { kk = k; f = -S0 / r[k]; break; } S0 += r[k]; }
    const Wd = norm(r.map((_, i) => (i < kk ? 1 : i === kk ? f : 0)));
    // linear
    let a0 = 0, a1 = 10; for (let i = 0; i < 80; i++) { const a = (a0 + a1) / 2, w = norm(r.map((x) => Math.max(0, 1 - a * x))); if (avg(w) > 0) a0 = a; else a1 = a; }
    const Wl = norm(r.map((x) => Math.max(0, 1 - (a0 + a1) / 2 * x)));
    // exponential tilt (Newton on the mean)
    const tilt = (b) => norm(r.map((x) => Math.exp(b * x)));
    let beta = 0; for (let i = 0; i < 50; i++) { const w = tilt(beta), m = avg(w), v = w.reduce((s, x, j) => s + x * (r[j] - m) ** 2, 0); beta -= m / v; }
    const Wt = tilt(beta);
    const KL = (w) => w.reduce((s, x) => s + (x > 0 ? x * Math.log(n * x) : 0), 0);
    const costs = [KL(Wd), KL(Wl), KL(Wt)];
    if (!(costs[2] <= costs[0] && costs[2] <= costs[1])) S.warn && S.warn('X3.1: the tilt is not the cheapest weighting');
    // ---- geometry ----
    const X = (v) => AX.x0 + (AX.x1 - AX.x0) * (v - AX.rmin) / (AX.rmax - AX.rmin);
    const jr = S.rng(T.jitter_seed), ys = r.map(() => ST.y0 + 10 + (ST.y1 - ST.y0 - 20) * jr());
    const svg = K.svgLayer(ctx, 12), main = K.s('g', {}, svg);
    K.s('line', { x1: AX.x0, x2: AX.x1, y1: AX.y, y2: AX.y, stroke: K.c('muted'), 'stroke-width': 2 }, main);
    AX.ticks.forEach((v) => { K.s('line', { x1: X(v), x2: X(v), y1: AX.y, y2: AX.y + 10, stroke: K.c('muted'), 'stroke-width': 2 }, main);
      K.s('text', { x: X(v), y: AX.y + 44, 'text-anchor': 'middle', class: 'kt-tick' }, main, K.fmt(v, 2)); });
    K.s('text', { x: AX.x0, y: AX.y + 90, 'text-anchor': 'start', class: 'kt-axis' }, main, 'energy change of one snapshot · r = dE/dt').style.fill = K.c('metric');
    const dots = r.map((x, i) => K.s('circle', { cx: X(x), cy: ys[i], fill: K.c('model') }, main));
    const pins = K.s('g', {}, main); r.forEach((x, i) => K.s('line', { x1: X(x), x2: X(x), y1: ys[i] + 4, y2: ys[i] + 14, stroke: K.c('fg-2'), 'stroke-width': 1.5 }, pins));
    // truth (grey dashed) and weighted histogram outline (violet)
    const NB = HB.bins, bw = (AX.rmax - AX.rmin) / NB, hb = { x: HB.box[0], y: HB.box[1], w: HB.box[2], h: HB.box[3] };
    const hist = (w) => { const h = new Float64Array(NB); r.forEach((x, i) => { const k = Math.floor((x - AX.rmin) / bw); if (k >= 0 && k < NB) h[k] += w[i] / bw; }); return h; };
    const H0 = hist(U), Ht = hist(Wt); let hm = 0; for (let k = 0; k < NB; k++) hm = Math.max(hm, H0[k], Ht[k]); for (let x = AX.rmin; x < AX.rmax; x += 0.05) hm = Math.max(hm, pdf(x)); hm *= 1.1;
    const HY = (d) => hb.y + hb.h - hb.h * d / hm;
    let td = ''; for (let i = 0; i <= 200; i++) { const x = AX.rmin + (AX.rmax - AX.rmin) * i / 200; td += (i ? 'L' : 'M') + X(x).toFixed(1) + ',' + HY(pdf(x)).toFixed(1); }
    K.s('path', { d: td, fill: 'none', stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '8 8' }, main);
    const hp = K.s('path', { fill: 'none', stroke: K.c('model'), 'stroke-width': 4 }, main);
    const labs = [XK.lab(ctx, 'truth', X(-1.6), HY(pdf(-1.6)) - 50, { cls: 'small' }), XK.lab(ctx, '{model}model q{/}', X(2.3), HY(pdf(1.9)) - 40, {})];
    XK.timed(ctx, main, 'route-0.15', null, { din: 0.8 }); labs.forEach((e) => XK.timed(ctx, e, 'route+0.4', 'line-0.15'));
    // triangles: weighted average (violet) and target 0 (amber)
    const triV = K.s('path', { d: 'M0,0 l-12,22 h24 z', fill: K.c('model') }, svg), triA = K.s('path', { d: `M${X(0)},${AX.y + 2} l-12,22 h24 z`, fill: K.c('metric') }, svg);
    XK.timed(ctx, triA, 'off-0.15', null); XK.timed(ctx, triV, 'off-0.15', null);
    XK.lab(ctx, 'target: average 0 (energy budget)', X(0) - 20, AX.y + 120, { anchor: 'r', color: 'metric', at: 'off+0.2', out: 'many-0.15', cls: 'small' });
    XK.lab(ctx, 'misses the target', X(avg(U)) + 30, AX.y + 120, { at: 'off+0.6', out: 'many-0.15', cls: 'small' });
    XK.timed(ctx, pins, 'stay-0.15', null, { din: 0.5 });
    XK.lab(ctx, 'no snapshot moves · only its weight', X(-2.4), ST.y0 - 50, { at: 'stay+0.2', out: 'many-0.15' });
    // cost bars
    const CB = P.cost_bars, cmax = Math.max(...costs) * 1.05, bars = [], names = [P.alternatives[0].label, P.alternatives[1].label, 'w ∝ exp(β r)'];
    XK.lab(ctx, 'cost: how much the crowd is distorted', 1824, CB.y0 - 60, { anchor: 'r', cls: 'small', at: 'many-0.15', out: 'line-0.15' });
    const bt = [XK.at(ctx, 'many', 1.2), XK.at(ctx, 'many', 2.8), XK.at(ctx, 'least', 1.6)];
    costs.forEach((cst, k) => { const y = CB.y0 + 10 + k * (CB.h + CB.gap + 34);
      XK.lab(ctx, names[k], CB.x - 40, y - 4, { cls: 'small', at: bt[k] - 0.4, out: 'line-0.15', color: k === 2 ? 'metric' : null });
      const b = K.s('rect', { x: CB.x - 40, y: y + 34, height: CB.h, width: 0, fill: k === 2 ? K.c('metric') : K.c('matter') }, svg); bars.push({ b, w: (CB.w) * cst / cmax, t: bt[k] }); });
    XK.lab(ctx, 'I-projection', CB.x - 40, CB.y0 + 10 + 2 * (CB.h + CB.gap + 34) + 66, { color: 'metric', at: XK.at(ctx, 'least', 1.8), out: 'line-0.15' });
    XK.lab(ctx, 'w ∝ exp(β r)', X(-0.6), ST.y0 - 50, { at: 'least+0.4', out: 'line-0.15', color: 'model' });
    // inset (I-projection geometry)
    const IB = P.inset.box, ig = K.s('g', {}, svg);
    K.s('rect', { x: IB[0], y: IB[1], width: IB[2], height: IB[3], rx: 10, fill: K.c('panel'), stroke: K.c('matter'), 'stroke-width': 2 }, ig);
    const L1 = [IB[0] + 60, IB[1] + IB[3] - 70], L2 = [IB[0] + IB[2] - 60, IB[1] + 150], Q = [IB[0] + 220, IB[1] + 90];
    const dx = L2[0] - L1[0], dy = L2[1] - L1[1], tt = ((Q[0] - L1[0]) * dx + (Q[1] - L1[1]) * dy) / (dx * dx + dy * dy), Fp = [L1[0] + tt * dx, L1[1] + tt * dy], Pp = [L1[0] + 0.85 * dx, L1[1] + 0.85 * dy];
    K.s('line', { x1: L1[0], y1: L1[1], x2: L2[0], y2: L2[1], stroke: K.c('metric'), 'stroke-width': 4 }, ig);
    K.s('circle', { cx: Q[0], cy: Q[1], r: 10, fill: K.c('model') }, ig); K.s('circle', { cx: Pp[0], cy: Pp[1], r: 9, fill: K.c('fg-2') }, ig);
    const perp = K.s('line', { x1: Q[0], y1: Q[1], x2: Fp[0], y2: Fp[1], stroke: K.c('fg-2'), 'stroke-width': 3, 'stroke-dasharray': '8 6' }, svg);
    const fpd = K.s('circle', { cx: Fp[0], cy: Fp[1], r: 10, fill: K.c('metric') }, svg);
    const sideQP = K.s('line', { x1: Q[0], y1: Q[1], x2: Pp[0], y2: Pp[1], stroke: K.c('muted'), 'stroke-width': 2 }, svg);
    XK.timed(ctx, ig, 'line-0.15', 'moves-0.15', { din: 0.6 }); XK.timed(ctx, perp, 'foot-0.15', 'moves-0.15'); XK.timed(ctx, fpd, 'foot+0.4', 'moves-0.15'); XK.timed(ctx, sideQP, 'extra+0.4', 'moves-0.15');
    XK.lab(ctx, 'every crowd with average 0', L2[0], L2[1] - 54, { anchor: 'r', color: 'metric', cls: 'small', at: 'line+0.2', out: 'moves-0.15' });
    XK.lab(ctx, '{model}model q{/}', Q[0] - 20, Q[1] - 48, { anchor: 'r', cls: 'small', at: 'line+0.3', out: 'moves-0.15' });
    XK.lab(ctx, 'another fix p', Pp[0] + 10, Pp[1] + 16, { cls: 'small', at: 'line+0.6', out: 'moves-0.15' });
    XK.lab(ctx, 'tilted q*', Fp[0] - 14, Fp[1] + 14, { anchor: 'r', cls: 'small', at: 'foot+0.4', out: 'moves-0.15' });
    XK.lab(ctx, 'cost of q*', (Q[0] + Fp[0]) / 2 - 18, (Q[1] + Fp[1]) / 2 - 10, { anchor: 'r', cls: 'small', at: 'foot+0.7', out: 'moves-0.15' });
    XK.lab(ctx, 'extra', (Fp[0] + Pp[0]) / 2, (Fp[1] + Pp[1]) / 2 + 14, { cls: 'small', at: 'extra-0.15', out: 'moves-0.15' });
    XK.lab(ctx, 'cost of p', (Q[0] + Pp[0]) / 2 + 16, (Q[1] + Pp[1]) / 2 + 4, { cls: 'small', at: 'extra+0.25', out: 'moves-0.15' });
    K.pen(ctx, { kind: 'check', box: { x: Fp[0] + 8, y: Fp[1] - 44, w: 30, h: 26 }, at: 'foot+0.6', out: 'moves-0.15' });
    // moves: hatch beyond the extreme dots
    const hg = K.s('g', {}, svg), xl = X(r[0]) - 16, xr = X(r[n - 1]) + 16;
    [[AX.x0, xl], [xr, AX.x1]].forEach(([a, b]) => { for (let x = a; x < b - 8; x += 14) K.s('line', { x1: x, y1: AX.y - 4, x2: x + 12, y2: AX.y - 30, stroke: K.c('muted'), 'stroke-width': 2 }, hg); });
    XK.timed(ctx, hg, 'moves-0.15', null);
    XK.lab(ctx, 'no dot here: no mass, before or after', Math.min(X(r[n - 1]) + 24, 1520), ST.y0 + 10, { w: 290, at: 'moves+0.2', cls: 'small' });
    K.chip(ctx, { text: "SCHEMATIC · toy law of the report's interactive diagram", kind: 'schematic', x: 120, y: 130, at: 'route+0.2' });
    K.chip(ctx, { text: 'REFERENCE · Csiszár 1975', kind: 'plain', x: 120, y: 836, at: 'least+0.4' });
    K.formulaLayer(ctx);
    ctx.x31 = { r, U, Wd, Wl, beta, tilt, dots, hp, hist, HY, X, NB, bw, AX, ST, triV, bars, main, n, pins,
      tM: ctx.at('many-0.15'), tL: ctx.at('least-0.15'), tLine: ctx.at('line-0.15'), tMv: ctx.at('moves-0.15') };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.x31;
    const mix = (A, B, p) => A.map((x, i) => x + (B[i] - x) * p);
    let w = c.U;
    const p1 = S.seg(t, c.tM, c.tM + 1.2, S.ease.inOutCubic), p2 = S.seg(t, c.tM + 1.6, c.tM + 2.8, S.ease.inOutCubic);
    if (t >= c.tM) w = p2 > 0 ? mix(c.Wd, c.Wl, p2) : mix(c.U, c.Wd, p1);
    if (t >= c.tL) { const pb = S.seg(t, c.tL, c.tL + 0.4, S.ease.linear), pt = S.seg(t, c.tL + 0.4, c.tL + 1.8, S.ease.inOutSine);
      w = pt > 0 ? c.tilt(c.beta * pt) : mix(c.Wl, c.U, pb); }
    const pulse = 1 + 0.15 * Math.sin(Math.PI * S.seg(t, c.tMv + 0.3, c.tMv + 0.6, S.ease.linear));
    c.dots.forEach((d, i) => { const rr = Math.max(c.ST.r_min_px, Math.min(c.ST.r_max_px, 6 * Math.sqrt(c.n * w[i]))); d.setAttribute('r', (rr * (t > c.tMv ? pulse : 1)).toFixed(2)); });
    const h = c.hist(w); let d = '';
    for (let k = 0; k < c.NB; k++) { const x0 = c.X(c.AX.rmin + k * c.bw), x1 = c.X(c.AX.rmin + (k + 1) * c.bw), y = c.HY(h[k]); d += (k ? 'L' : 'M') + x0.toFixed(1) + ',' + y.toFixed(1) + 'L' + x1.toFixed(1) + ',' + y.toFixed(1); }
    c.hp.setAttribute('d', d);
    const m = w.reduce((s, x, i) => s + x * c.r[i], 0); c.triV.setAttribute('transform', `translate(${c.X(m).toFixed(1)} ${c.AX.y + 26})`);
    c.bars.forEach((b) => b.b.setAttribute('width', (b.w * S.seg(t, b.t - 0.4, b.t, S.ease.outCubic)).toFixed(1)));
    const dim = 1 - 0.65 * S.seg(t, c.tLine, c.tLine + 0.5, S.ease.linear) * (1 - S.seg(t, c.tMv, c.tMv + 0.5, S.ease.linear));
    c.main.style.filter = ''; c.main.style.opacity = (Math.min(1, S.seg(t, c.tLine - 10, c.tLine - 9.2, S.ease.linear) + 1) * dim).toFixed(3);
  },
});
