<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>ep01.01 Ouverture</title>
<!-- Storyboard ep01, scène ep01.01 (plans 1.1 à 1.11), narration P1 et P2.
     Écoulement cellulaire u = (sin x cos y, −cos x sin y) sur [0, 2π]², coordonnées mathématiques y vers le haut,
     panneau de 780 px (124,14 px par unité), x 570 à 1350, y 78 à 858 ; toPx renverse l'axe vertical.
     La cellule en bas à gauche (0 < x, y < π) tourne dans le sens trigonométrique (section 0).
     Caméra : tout le contenu de la carte vit dans un calque « monde » (div transformée), écran = Q + s·(P − c0),
     c0 = centre de la carte ; zoom, réductions et vignette sont des fonctions pures de t. -->
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/ep-kit.js"></script>
<style>
  .world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; z-index: 10; }
</style>
</head><body><div id="stage"></div>
<script>
Scene.define({
  duration: 39.1,
  register: 'night',
  // temps d'aperçu = estimation du moteur ; le moteur injecte les vrais
  cues: { 'e1-carte': 0.4, 'e1-fleche': 3.2, 'e1-longueur': 6.94, 'e1-question': 10.44, 'e1-deux': 13.71, 'e1-sort': 17.68,
    'e1-tourne': 19.24, 'e1-outil': 21.85, 'e1-machine': 26.43, 'e1-juger': 31.09, 'e1-lire': 35.6 },
  setup(ctx) {
    const K = Kit, S = Scene, at = ctx.at, seg = S.seg, E = S.ease, TAU = Math.PI * 2;
    const T = {}; for (const k of Object.keys(ctx.cues)) if (k.startsWith('e1-')) T[k.slice(3)] = at(k);
    // ---------- géométrie (section 0) ----------
    const X0 = 570, Y1 = 858, SC = 780 / TAU;                 // 124,14 px par unité
    const toPx = (x, y) => [X0 + SC * x, Y1 - SC * y];        // monde (carte à 100 %), y renversé
    const fromPx = (px, py) => [(px - X0) / SC, (Y1 - py) / SC];
    const U = (x, y) => [Math.sin(x) * Math.cos(y), -Math.cos(x) * Math.sin(y)];
    const C0 = [960, 468];                                    // centre de la carte

    // ---------- caméra : écran = Q + s·(P − C0) ----------
    const ZA = toPx(Math.PI / 2, 2 * Math.PI / 3), ZB = toPx(Math.PI / 2, Math.PI);
    const ZM = [(ZA[0] + ZB[0]) / 2, (ZA[1] + ZB[1]) / 2];
    const zoomQ = [960 - 2.5 * (ZM[0] - C0[0]), 470 - 2.5 * (ZM[1] - C0[1])];
    const keys = [   // [début, fin, s, Q] : chaque mouvement part de l'état précédent
      [T.fleche, T.fleche + 0.8, 2.5, zoomQ],                   // 1.2 zoom
      [T.question - 0.9, T.question - 0.1, 1, C0],              // 1.3 retour au plan large
      [T.deux, T.deux + 0.8, 0.7, [620, 468]],                  // 1.5 la carte glisse à gauche, 70 %
      [T.outil + 0.5, T.outil + 1.5, 1, C0],                    // 1.8 la carte reprend 100 %
      [T.machine, T.machine + 0.8, 0.4, [276, 236]],            // 1.9 vignette en haut à gauche
      [T.lire, T.lire + 0.8, 1, C0],                            // 1.11 retour au centre
    ];
    const cam = (t) => {
      let s = 1, Q = C0;
      for (const [a, b, s1, Q1] of keys) {
        const p = seg(t, a, b, E.inOutCubic); if (p <= 0) break;
        s = S.lerp(s, s1, p); Q = [S.lerp(Q[0], Q1[0], p), S.lerp(Q[1], Q1[1], p)];
      }
      return { s, Q };
    };
    const camApply = (c, P) => [c.Q[0] + c.s * (P[0] - C0[0]), c.Q[1] + c.s * (P[1] - C0[1])];
    const camInv = (c, Sp) => [C0[0] + (Sp[0] - c.Q[0]) / c.s, C0[1] + (Sp[1] - c.Q[1]) / c.s];
    const world = K.el('div', { class: 'world', 'data-layer': 'world' }, ctx.stage);
    // la caméra est le premier composant enregistré : elle se met à jour avant tous les autres
    ctx.add({ render(t) { const c = cam(t);
      world.style.transform = `translate(${(c.Q[0] - c.s * C0[0]).toFixed(3)}px, ${(c.Q[1] - c.s * C0[1]).toFixed(3)}px) scale(${c.s.toFixed(5)})`; } });

    // ---------- carte : cadre et flèches (SVG, nettes au zoom) ----------
    const chalk = K.c('chalk'), muted = K.c('muted'), ucol = K.c('u');
    const msvg = K.svgLayer(ctx, 10, world); msvg.setAttribute('data-kit', 'carte');
    K.s('rect', { x: X0, y: 78, width: 780, height: 780, fill: 'none', stroke: K.c('matter'), 'stroke-width': 2 }, msvg);
    const AK = 55;                                            // px par unité de vitesse : longueur ∝ intensité
    const arrows = [];
    for (let i = 0; i <= 12; i++) for (let j = 0; j <= 12; j++) {
      const x = i * Math.PI / 6, y = j * Math.PI / 6, v = U(x, y), [px, py] = toPx(x, y);
      const el = K.s('path', { fill: ucol, stroke: ucol, 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, msvg);
      arrows.push({ i, j, px, py, vx: v[0], vy: v[1], el, last: -1 });
    }
    const A = arrows.find((a) => a.i === 3 && a.j === 4), B = arrows.find((a) => a.i === 3 && a.j === 6);
    const dotA = K.s('circle', { cx: A.px, cy: A.py, r: 5, fill: chalk }, msvg);
    // 1.4 : le point et le point d'interrogation (halo : il est posé sur les traceurs)
    const Pq = toPx(2.2, 1.0);
    const dotQ = K.s('circle', { cx: Pq[0], cy: Pq[1], r: 9, fill: chalk }, msvg);
    const qm = K.s('text', { x: Pq[0] + 34, y: Pq[1] - 18, fill: chalk, 'font-size': 80, 'font-family': 'Inter Display', 'font-weight': 600,
      'dominant-baseline': 'central' }, msvg, '?');
    qm.style.cssText = `paint-order: stroke; stroke: ${K.c('bg')}; stroke-width: 8px; stroke-linejoin: round`;
    // 1.2, 1.3 : cercles au stylo, dans le repère de la carte (un groupe du calque monde)
    const penG = K.s('g', {}, K.svgLayer(ctx, 30, world));
    K.pen(ctx, { kind: 'circle', box: { x: A.px - 30, y: A.py - 9, w: 34, h: 18 }, pad: 6, width: 2, svg: penG, at: 'e1-fleche+0.9', dur: 0.5, out: 'e1-question-0.9' });
    K.pen(ctx, { kind: 'circle', box: { x: B.px - 58, y: B.py - 9, w: 62, h: 18 }, pad: 6, width: 2, svg: penG, at: 'e1-longueur+0.1', dur: 0.5, out: 'e1-question-0.9' });

    // ---------- 1.4 : traceurs ----------
    const V = SC * 0.45;
    K.tracers(ctx, { parent: world, z: 6, n: 300, box: { x: X0, y: 78, w: 780, h: 780 }, alpha: 0.4, trail: 14, seed: 'ep01.01',
      F: (px, py) => { const [x, y] = fromPx(px, py), v = U(x, y); return [v[0] * V, -v[1] * V]; }, at: 'e1-question' });

    // ---------- 1.5 à 1.7 : emplacements et pictogrammes (écran) ----------
    const psvg = K.svgLayer(ctx, 12); psvg.setAttribute('data-kit', 'pictos');
    const SL = [[1320, 290], [1320, 646]], SH = 140;
    const slots = SL.map(([x, y]) => K.s('rect', { x: x - SH, y: y - SH, width: 2 * SH, height: 2 * SH, rx: 10, fill: 'none', stroke: muted, 'stroke-width': 2.5, 'stroke-dasharray': '10 8' }, psvg));
    const pc = SL.map(() => K.s('circle', { r: 45, fill: 'none', stroke: chalk, 'stroke-width': 3, 'stroke-dasharray': '12 9' }, psvg));
    const outA = [0, 1, 2, 3].map(() => K.s('path', { fill: ucol, stroke: ucol, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, psvg));
    const arc = K.s('path', { fill: 'none', stroke: chalk, 'stroke-width': 4, 'stroke-linecap': 'round' }, psvg);
    const arcHead = K.s('path', { fill: chalk, stroke: chalk, 'stroke-width': 2, 'stroke-linejoin': 'round' }, psvg);

    // ---------- 1.8 : le petit cercle, cercle-sonde (aucun compteur) ----------
    const C = [1.4, 1.8], tA = T.outil + 0.5, tB = T.outil + 1.5, Mscr = [1320, 468];
    const camA = cam(tA), W0 = camInv(camA, Mscr), W1 = toPx(...C), Wc = [(W0[0] + W1[0]) / 2, Math.min(W0[1], W1[1]) - 260];
    const r0 = 45 / camA.s / SC, r1 = 0.6;
    const flight = (t) => seg(t, tA, tB, E.inOutCubic);
    K.probe(ctx, { toPx, F: U, parent: world, z: 13, at: 'e1-outil+0.45',
      circle: {
        c: (t) => { const p = flight(t), q = 1 - p;
          const w = [q * q * W0[0] + 2 * q * p * Wc[0] + p * p * W1[0], q * q * W0[1] + 2 * q * p * Wc[1] + p * p * W1[1]];
          return fromPx(w[0], w[1]); },
        r: (t) => S.lerp(r0, r1, flight(t)),
      } });

    // ---------- 1.9, 1.10 : la carte vide et l'emplacement de verdict ----------
    const esvg = K.svgLayer(ctx, 12); esvg.setAttribute('data-kit', 'carte-vide');
    const EC = [960, 440], EH = 156;
    const empty = K.s('rect', { x: EC[0] - EH, y: EC[1] - EH, width: 2 * EH, height: 2 * EH, fill: 'none', stroke: muted, 'stroke-width': 2.5, 'stroke-dasharray': '12 9' }, esvg);
    const verdict = K.s('path', { d: `M${EC[0] - 80},${EC[1] + EH + 64}L${EC[0] + 80},${EC[1] + EH + 64}`, fill: 'none', stroke: muted, 'stroke-width': 3, 'stroke-linecap': 'butt' }, esvg);
    verdict.style.strokeDasharray = 160;

    ctx.S = { T, arrows, A, B, dotA, dotQ, qm, slots, pc, outA, arc, arcHead, SL, empty, verdict, AK };
  },

  render(t, ctx) {
    const K = Kit, S = Scene, seg = S.seg, E = S.ease, TAU = Math.PI * 2;
    const { T, arrows, A, B, dotA, dotQ, qm, slots, pc, outA, arc, arcHead, SL, empty, verdict, AK } = ctx.S;

    // ---------- 1.1 : les flèches poussent depuis leur pied, balayage de gauche à droite ; 1.3 : mise en avant ----------
    const dim = 1 - 0.65 * seg(t, T.longueur, T.longueur + 0.4, E.linear) * (1 - seg(t, T.question - 0.9, T.question - 0.1, E.linear));
    const pulse = (a0) => Math.sin(Math.PI * seg(t, a0, a0 + 0.6, E.linear));
    const pA = pulse(T.longueur + 0.6) + pulse(T.longueur + 2.0), pB = pulse(T.longueur + 1.3) + pulse(T.longueur + 2.7);
    for (const a of arrows) {
      const g = seg(t, T.carte + 0.1 + 1.2 * a.i / 12, T.carte + 0.6 + 1.2 * a.i / 12, E.outCubic);
      const I = Math.hypot(a.vx, a.vy), m = AK * I * g;
      const key = Math.round(m * 100);
      if (key !== a.last) {
        a.last = key;
        a.el.setAttribute('d', m < 3 ? '' : K.arrowPath(a.px, a.py, a.px + a.vx / I * m, a.py - a.vy / I * m, Math.min(14, m * 0.4)));
      }
      const hi = a === A || a === B;
      a.el.style.opacity = hi ? 1 : dim;
      a.el.setAttribute('stroke-width', a === A ? (3 + 2.5 * pA).toFixed(2) : a === B ? (3 + 2.5 * pB).toFixed(2) : 3);
    }
    dotA.style.opacity = seg(t, T.fleche + 0.6, T.fleche + 0.9, E.linear) * (1 - seg(t, T.question - 0.9, T.question - 0.5, E.linear));

    // ---------- 1.4 : le point pulse une fois ; il s'efface quand le cercle arrive ----------
    const qOn = seg(t, T.question, T.question + 0.3, E.linear) * (1 - seg(t, T.outil, T.outil + 0.4, E.linear));
    dotQ.setAttribute('r', (9 + 7 * Math.sin(Math.PI * seg(t, T.question + 0.1, T.question + 0.7, E.linear))).toFixed(2));
    dotQ.style.opacity = qOn; qm.style.opacity = qOn; K.show(qm, qOn > 0.01);

    // ---------- 1.5 à 1.8 : emplacements, pictogrammes, fusion des deux cercles ----------
    const slotOn = seg(t, T.deux + 0.5, T.deux + 1.0, E.linear) * (1 - seg(t, T.outil, T.outil + 0.4, E.linear));
    slots.forEach((r) => { r.style.opacity = slotOn; });
    const merge = seg(t, T.outil, T.outil + 0.5, E.inOutCubic), pictoOff = 1 - seg(t, T.outil + 0.45, T.outil + 0.6, E.linear);
    const cy = SL.map(([, y]) => S.lerp(y, 468, merge));
    const cOn = [seg(t, T.sort, T.sort + 0.3, E.linear), seg(t, T.tourne, T.tourne + 0.3, E.linear)];
    pc.forEach((c, k) => { c.setAttribute('cx', SL[k][0]); c.setAttribute('cy', cy[k].toFixed(2)); c.style.opacity = cOn[k] * pictoOff; K.show(c, cOn[k] * pictoOff > 0); });
    // pictogramme « sort » : quatre flèches --u vers l'extérieur, 0,6 s
    const gs = seg(t, T.sort, T.sort + 0.6, E.outCubic), fade = 1 - seg(t, T.outil, T.outil + 0.35, E.linear);
    outA.forEach((p, k) => {
      const a = k * Math.PI / 2, [x, y] = [SL[0][0], cy[0]], r1 = 16 + (105 - 16) * gs;
      p.setAttribute('d', gs > 0 ? K.arrowPath(x + 16 * Math.cos(a), y - 16 * Math.sin(a), x + r1 * Math.cos(a), y - r1 * Math.sin(a), 16) : '');
      p.style.opacity = fade;
    });
    // pictogramme « tourne » : flèche de parcours en arc, un tour dans le sens trigonométrique en 1 s
    const tOn = seg(t, T.tourne, T.tourne + 0.2, E.linear) * fade;
    const ph = TAU * seg(t, T.tourne, T.tourne + 1.0, E.inOutSine), R = 68, span = 1.5 * Math.PI, [ax, ay] = [SL[1][0], cy[1]];
    let d = '';
    for (let i = 0; i <= 48; i++) { const a = ph + span * i / 48; d += (i ? 'L' : 'M') + (ax + R * Math.cos(a)).toFixed(2) + ',' + (ay - R * Math.sin(a)).toFixed(2); }
    arc.setAttribute('d', d); arc.style.opacity = tOn; K.show(arc, tOn > 0);
    const ae = ph + span, hx = ax + R * Math.cos(ae), hy = ay - R * Math.sin(ae), tx = -Math.sin(ae), ty = -Math.cos(ae);   // tangente écran, sens trigonométrique
    const nx = Math.cos(ae), ny = -Math.sin(ae);
    arcHead.setAttribute('d', `M${(hx + 16 * tx).toFixed(2)},${(hy + 16 * ty).toFixed(2)}L${(hx + 10 * nx).toFixed(2)},${(hy + 10 * ny).toFixed(2)}L${(hx - 10 * nx).toFixed(2)},${(hy - 10 * ny).toFixed(2)}Z`);
    arcHead.style.opacity = tOn; K.show(arcHead, tOn > 0);

    // ---------- 1.9 à 1.11 : carte vide, filet de verdict ----------
    const eOn = seg(t, T.machine + 0.4, T.machine + 1.2, E.linear) * (1 - seg(t, T.lire, T.lire + 0.4, E.linear));
    empty.style.opacity = eOn; K.show(empty, eOn > 0);
    const vp = seg(t, T.juger, T.juger + 0.5, E.inOutSine);
    verdict.style.strokeDashoffset = (160 * (1 - vp)).toFixed(2);
    verdict.style.opacity = (vp > 0 ? 1 : 0) * (1 - seg(t, T.lire, T.lire + 0.4, E.linear));
  },
});
</script></body></html>
