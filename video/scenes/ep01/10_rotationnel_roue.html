<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>ep01.10 Rotationnel et roue</title>
<!-- Storyboard ep01, scène ep01.10 (plans 10.1 à 10.14), narration P17 et P18.
     10.1 à 10.8 : le champ et le panneau de la scène 09, u = (x − 0,4y ; y + 0,4x), ω = 0,8 partout, P en (620, 340),
     180 px par unité. Perspective : transformation affine du dessin 2D (compression verticale cos θ, cisaillement
     −0,6 sin θ), θ = 55°, pas de 3D CSS ; une flèche perpendiculaire au plan se projette à la verticale, longueur
     ℓ sin θ ; de face, ⊙ si elle sort de l'écran, ⊗ si elle y entre. Roue posée sur P (vitesse nulle), sens
     trigonométrique, α̇ = ω/2 = 0,4 rad par seconde de scène, en forme fermée.
     10.9 à 10.14 : rotation solide u = (−y, x), panneau 1000 × 720 px (x 120 à 1120), origine en (620, 460),
     100 px par unité ; disque de fluide, rayon marqué, roue portée à 200 px de l'origine : α̇_disque = α̇_roue = 1,
     l'aube marquée reste parallèle au rayon marqué ; compteur de vorticité (circulation ÷ aire, calculée) : 2. -->
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/ep-kit.js"></script>
<style>
  .lab { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 48px; color: var(--fg); z-index: 22;
    text-shadow: 0 0 6px var(--bg), 0 0 3px var(--bg); }
  .lab .katex { font-size: 1em; }
  .pclip { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 7; }
  .pin { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .kit-readout.boxed { background: var(--panel-a); padding: 4px 12px 6px; border-radius: 6px; }
</style>
</head><body><div id="stage"></div>
<script>
Scene.define({
  duration: 59.63,
  register: 'night',
  // temps d'aperçu = estimation du moteur ; le moteur injecte les vrais
  cues: { 'e1-fleche3d': 0.4, 'e1-plan': 5.7, 'e1-signe': 10.32, 'e1-longueur3d': 14.54, 'e1-roue': 18.97, 'e1-pousse': 24.35,
    'e1-moitie': 29.29, 'e1-exemple': 33.27, 'e1-reprends': 35.4, 'e1-disque': 38.28, 'e1-vitesseun': 42.55, 'e1-colle': 45.87,
    'e1-affiche': 49.84, 'e1-retiens': 53.38 },
  setup(ctx) {
    const K = Kit, S = Scene, at = ctx.at, seg = S.seg, E = S.ease, TAU = 2 * Math.PI;
    const T = {};
    for (const k of Object.keys(ctx.cues)) if (k.startsWith('e1-')) T[k.slice(3)] = at(k);
    const chalk = K.c('chalk'), muted = K.c('muted'), ucol = K.c('u'), panel = K.c('panel');
    const TILT = 55 * Math.PI / 180;

    // =============== 10.1 à 10.8 : le panneau de la scène 09 ===============
    const PX = 620, PY = 340, SC = 180, BOX = { x: 120, y: 100, w: 900, h: 720 }, PIV = [570, 460];
    const toPx = (x, y) => [PX + SC * x, PY - SC * y];
    const U = (x, y) => [x - 0.4 * y, y + 0.4 * x];
    const FPX = (px, py) => { const v = U((px - PX) / SC, (PY - py) / SC); return [v[0], -v[1]]; };
    const pclip = K.el('div', { class: 'pclip', 'data-kit': 'panel' }, ctx.stage);
    const pin = K.el('div', { class: 'pin' }, pclip);
    K.arrows(ctx, { F: FPX, box: BOX, nx: 9, ny: 8, scale: 0.85, at: -1.5, parent: pin, z: 7 });
    const arrows1 = pin.querySelector('canvas');
    const psvg = K.svgLayer(ctx, 12, pin); psvg.setAttribute('data-kit', 'panel-geo');
    const mk = (tag, a, p) => K.s(tag, a, p);
    const square = mk('rect', { x: PX - 120, y: PY - 120, width: 240, height: 240, fill: 'none', stroke: chalk, 'stroke-width': 5 }, psvg);
    mk('circle', { cx: PX, cy: PY, r: 7, fill: chalk }, psvg);
    // tilt θ(t) : bascule de 1,2 s (10.1), retour de face en 1 s (10.2)
    const thetaP = (t) => TILT * (seg(t, T.fleche3d + 0.6, T.fleche3d + 1.8, E.inOutCubic) - seg(t, T.plan + 2.0, T.plan + 3.0, E.inOutCubic));
    // (x, y) → (x + sh (y − cy) + e, cy + d (y − cy)) autour de c0 ; e : décalage vers la droite (panneau : le parallélogramme
    // reste dans le cadre sûr)
    const affine = (th, c0, shift = 0) => { const d = Math.cos(th), sh = -0.35 * Math.sin(th), e = shift * Math.sin(th) / Math.sin(TILT);
      return { d, sh, e, f: (x, y) => [x + sh * (y - c0[1]) + e, c0[1] + d * (y - c0[1])] }; };
    // roue à aubes posée sur P (10.5 à 10.8), dans le panneau (le zoom de 10.6 l'agrandit avec lui)
    const tl = T.roue + 1.0;                               // fin de la descente de 0,6 s
    const wheel1 = K.paddleWheel(ctx, { toPx, r: 46, at: 'e1-roue+0.4', out: 'e1-exemple+0.3', parent: pin, z: 15,
      pos: (t) => [0, 0.5 * (1 - S.spring(S.clamp((t - (tl - 0.6)) / 0.6), 0.03))],
      angle: (t) => 0.4 * Math.max(0, t - tl) });        // ω/2 = 0,4 rad par seconde, sens trigonométrique
    const fsvg = K.svgLayer(ctx, 16, pin); fsvg.setAttribute('data-kit', 'wheel-flow');
    const flowT = [0, 1, 2, 3].map(() => mk('path', { fill: ucol, stroke: ucol, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, fsvg));
    const flowR = [0, 1, 2, 3].map(() => mk('path', { fill: 'none', stroke: muted, 'stroke-width': 3, 'stroke-dasharray': '7 6' }, fsvg));
    const refLine = mk('line', { x1: PX, y1: PY, x2: PX + 70, y2: PY, stroke: chalk, 'stroke-width': 2.5, 'stroke-dasharray': '6 5' }, fsvg);
    const aArc = mk('path', { fill: 'none', stroke: chalk, 'stroke-width': 3 }, fsvg);
    const alab = K.el('div', { class: 'lab', html: K.tex('\\alpha', false) }, ctx.stage); alab.style.color = chalk; alab.style.fontSize = '40px';

    // flèches perpendiculaires au plan (10.1, 10.2), hors du conteneur : dessinées en projection
    const osvg = K.svgLayer(ctx, 17); osvg.setAttribute('data-kit', 'curl-arrows');
    const GRID = []; for (const y of [160, 340, 520]) for (const x of [320, 620, 920]) GRID.push([x, y]);
    const vArrows = GRID.map(() => mk('path', { fill: ucol, stroke: ucol, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, osvg));
    const dotSym = (parent) => { const g = mk('g', {}, parent); mk('circle', { r: 17, fill: K.c('bg'), stroke: ucol, 'stroke-width': 3.5 }, g); mk('circle', { r: 5.5, fill: ucol }, g); return g; };
    const crossSym = (parent) => { const g = mk('g', {}, parent); mk('circle', { r: 17, fill: K.c('bg'), stroke: ucol, 'stroke-width': 3.5 }, g);
      mk('path', { d: 'M-11,-11L11,11M11,-11L-11,11', stroke: ucol, 'stroke-width': 3.5, 'stroke-linecap': 'round' }, g); return g; };
    const odots = GRID.map(() => dotSym(osvg));

    // =============== 10.3, 10.4 : disques en perspective ===============
    const dsvg = K.svgLayer(ctx, 18); dsvg.setAttribute('data-kit', 'disks');
    const curved = (parent, R, ccw) => {   // flèche courbe dans le plan du disque (coordonnées locales, y vers le bas)
      const g = mk('g', {}, parent), a0 = ccw ? 20 : 340, a1 = ccw ? 300 : 60; let d = '';
      for (let i = 0; i <= 40; i++) { const a = S.lerp(a0, a1, i / 40) * Math.PI / 180; d += (i ? 'L' : 'M') + (R * Math.cos(a)).toFixed(2) + ',' + (-R * Math.sin(a)).toFixed(2); }
      mk('path', { d, fill: 'none', stroke: ucol, 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
      const a = a1 * Math.PI / 180, s = ccw ? 1 : -1, ex = R * Math.cos(a), ey = -R * Math.sin(a), tx = -s * Math.sin(a), ty = -s * Math.cos(a), ang = Math.atan2(ty, tx), hl = 24;
      mk('path', { d: `M${(ex + 0.5 * hl * tx).toFixed(2)},${(ey + 0.5 * hl * ty).toFixed(2)}L${(ex - hl * Math.cos(ang - 0.5)).toFixed(2)},${(ey - hl * Math.sin(ang - 0.5)).toFixed(2)}L${(ex - hl * Math.cos(ang + 0.5)).toFixed(2)},${(ey - hl * Math.sin(ang + 0.5)).toFixed(2)}Z`, fill: ucol }, g);
      return g;
    };
    const mkDisk = (cx, cy, R) => {   // flèche de dessous (derrière), disque, flèches du plan, flèche de dessus (devant), symbole de face
      const root = mk('g', {}, dsvg);
      const below = mk('path', { fill: ucol, stroke: ucol, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, root);
      const plane = mk('g', {}, root);
      mk('circle', { r: R, fill: panel, 'fill-opacity': 0.92, stroke: chalk, 'stroke-width': 3 }, plane);
      mk('circle', { r: R, fill: K.rgba(chalk, 0.08), stroke: 'none' }, plane);
      const ccw = curved(plane, R * 0.6, true), cw = curved(plane, R * 0.6, false);
      const above = mk('path', { fill: ucol, stroke: ucol, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, root);
      const sym = mk('g', {}, root), dot = dotSym(sym), cross = crossSym(sym);
      return { root, below, plane, ccw, cw, above, sym, dot, cross, cx, cy, R };
    };
    const D1 = mkDisk(340, 450, 140), D2 = mkDisk(800, 450, 140), D3 = mkDisk(570, 450, 190);
    const lab = (tex, x, y) => { const d = K.el('div', { class: 'lab', html: K.tex(tex, false) }, ctx.stage); d.style.left = x + 'px'; d.style.top = y + 'px'; return d; };
    const lPos = lab('\\cu{\\omega} > 0', 340, 690), lNeg = lab('\\cu{\\omega} < 0', 800, 690);
    const l3 = [lab('\\cu{\\omega} > 0', 570, 720), lab('\\cu{\\omega} = 0', 570, 720), lab('\\cu{\\omega} < 0', 570, 720)];
    const brace = mk('path', { fill: 'none', stroke: muted, 'stroke-width': 3.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, dsvg);
    const lAbs = lab('|\\cu{\\omega}|', 0, 0); lAbs.style.color = muted;
    const omega3 = (t) => { const p = seg(t, T.longueur3d + 0.6, T.longueur3d + 3.6, E.linear);   // +1 → 0 (palier) → −1, continu
      return p < 0.42 ? Math.cos(Math.PI * p / 0.84) : p > 0.58 ? -Math.cos(Math.PI * (1 - p) / 0.84) : 0; };

    // ∇×u (10.1), à droite
    K.equation(ctx, { x: 1400, y: 360, size: 96, anchor: 'center', at: 'e1-fleche3d+1.2', out: 'e1-roue', tex: '\\nabla\\times\\U' });

    // 10.7, 10.8 : α̇_roue = ω/2, en grand, puis en haut de la colonne
    const Ea = K.equation(ctx, { x: 1250, y: 380, size: 90, anchor: 'left', at: 'e1-moitie+0.3',
      tex: '\\dot\\alpha_{\\text{roue}} = \\frac{\\cu{\\omega}}{2}' });
    const EA0 = K.box(Ea.root, ctx), EAS = 0.62, EAX = 1180, EAY = 112;
    const eaFinal = { x: EAX + (EA0.x - 1250) * EAS, y: EAY + (EA0.y - 380) * EAS, w: EA0.w * EAS, h: EA0.h * EAS };
    K.pen(ctx, { kind: 'circle', pad: 16, box: { x: eaFinal.x - 6, y: eaFinal.y - 30, w: eaFinal.w + 12, h: eaFinal.h + 60 }, at: 'e1-retiens+0.8', dur: 0.6, width: 4 });

    // =============== 10.9 à 10.14 : rotation solide ===============
    const OX = 620, OY = 460, SC2 = 100, BOX2 = { x: 120, y: 100, w: 1000, h: 720 }, RD = 3.2, PHI = 1.9;
    const toPx2 = (x, y) => [OX + SC2 * x, OY - SC2 * y];
    const U2 = (x, y) => [-y, x];
    const beta = (t) => t - T.reprends;                  // angle du rayon marqué : 1 rad par seconde de scène
    const wpos = (t) => [2 * Math.cos(beta(t) + PHI), 2 * Math.sin(beta(t) + PHI)];
    const A2 = K.arrows(ctx, { F: (px, py) => [(py - OY) / SC2, -(px - OX) / SC2], box: BOX2, nx: 10, ny: 7, scale: 0.85, at: 'e1-reprends', z: 7 });
    const TR = K.canvasLayer(ctx, 6, null, null, { reset: true }); TR.canvas.setAttribute('data-kit', 'tracers');
    const rng = S.rng('solid-tracers'), trs = [];
    for (let i = 0; i < 200; i++) trs.push({ r: 0.3 + 3.9 * Math.sqrt(rng()), th: rng() * TAU });
    const ssvg = K.svgLayer(ctx, 11); ssvg.setAttribute('data-kit', 'solid');
    const diskS = mk('circle', { cx: OX, cy: OY, r: RD * SC2, fill: K.rgba(chalk, 0.08), stroke: 'none' }, ssvg);
    const radius = mk('line', { x1: OX, y1: OY, x2: OX, y2: OY, stroke: chalk, 'stroke-width': 4, 'stroke-linecap': 'round' }, ssvg);
    const radDot = mk('circle', { r: 6, fill: chalk }, ssvg);
    const wheel2 = K.paddleWheel(ctx, { toPx: toPx2, r: 46, at: 'e1-reprends', pos: wpos, angle: (t) => beta(t), z: 15 });
    // 10.13 : cercle en tirets de 70 px emporté avec la roue, compteur de vorticité
    const probe = K.probe(ctx, { toPx: toPx2, F: U2, mode: 'circulation', perArea: true, circle: { c: wpos, r: 0.7 }, at: 'e1-affiche', z: 14 });
    const ro = K.readout(ctx, { label: 'VORTICITÉ', value: (t) => probe.value(t), digits: 0, at: 'e1-affiche+0.4',
      pos: (t) => { const q = toPx2(...wpos(t)); return [q[0] + 84, q[1] - 46]; } });
    ro.root.classList.add('boxed');
    // cadrans (10.11, 10.12)
    const csvg = K.svgLayer(ctx, 18); csvg.setAttribute('data-kit', 'dials');
    const mkDial = (cx, cy, needleCol) => {
      const g = mk('g', { transform: `translate(${cx},${cy})` }, csvg);
      mk('circle', { r: 86, fill: 'none', stroke: muted, 'stroke-width': 3 }, g);
      mk('line', { x1: 0, y1: 0, x2: 86, y2: 0, stroke: muted, 'stroke-width': 3 }, g);
      const flash = mk('line', { x1: 40, y1: 0, x2: 98, y2: 0, stroke: chalk, 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
      const arc = mk('path', { fill: 'none', stroke: muted, 'stroke-width': 3.5 }, g);
      const needle = mk('line', { x1: 0, y1: 0, x2: 76, y2: 0, stroke: K.c(needleCol), 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
      mk('circle', { r: 6, fill: K.c(needleCol) }, g);
      const al = K.el('div', { class: 'lab', html: K.tex('\\alpha', false) }, ctx.stage); al.style.color = muted; al.style.fontSize = '36px';
      return { g, flash, arc, needle, al, cx, cy };
    };
    const dial1 = mkDial(1330, 390, 'u'), dial2 = mkDial(1640, 390, 'chalk');
    K.equation(ctx, { x: 1330, y: 500, size: 46, anchor: 'center', at: 'e1-vitesseun+0.5', tex: '\\dot\\alpha_{\\text{disque}} = 1' });
    const Er = K.equation(ctx, { x: 1640, y: 500, size: 46, anchor: 'center', at: 'e1-colle+0.5', tex: '\\dot\\alpha_{\\text{roue}} = 1' });
    K.equation(ctx, { x: 1640, y: 650, size: 56, anchor: 'center', at: 'e1-retiens+0.6', tex: '\\cu{\\omega} = 2' });

    ctx.S = { T, TILT, PX, PY, SC, PIV, toPx, U, pclip, pin, arrows1, square, thetaP, affine, GRID, vArrows, odots, tl, flowT, flowR, refLine, aArc, alab,
      D1, D2, D3, lPos, lNeg, l3, brace, lAbs, omega3, Ea, EAS, EAX, EAY, OX, OY, SC2, toPx2, beta, wpos, A2, TR, trs, diskS, radius, radDot, RD,
      dial1, dial2, Er };
  },

  render(t, ctx) {
    const K = Kit, S = Scene, seg = S.seg, E = S.ease, TAU = 2 * Math.PI;
    const C = ctx.S, T = C.T, TILT = C.TILT;
    const show = (el, o) => { el.style.opacity = o; K.show(el, o > 0.005); };

    // =============== panneau de la scène 09 ===============
    const o1 = Math.max(1 - seg(t, T.signe, T.signe + 0.4, E.linear), seg(t, T.roue + 0.1, T.roue + 0.6, E.linear)) * (1 - seg(t, T.exemple + 0.3, T.exemple + 0.9, E.linear));
    show(C.pclip, o1);
    C.arrows1.style.opacity = t < T.roue ? 0.25 : 0.4;
    show(C.square, 1 - seg(t, T.fleche3d, T.fleche3d + 0.5, E.linear));
    const th = C.thetaP(t), A = C.affine(th, C.PIV, 90);
    // 10.6, 10.7 : zoom de 1,8× sur la roue, autour de P
    const z = 1 + 0.8 * (seg(t, T.pousse, T.pousse + 0.8, E.inOutCubic) - seg(t, T.moitie, T.moitie + 0.8, E.inOutCubic));
    if (th > 1e-4) { C.pin.style.transformOrigin = `${C.PIV[0]}px ${C.PIV[1]}px`; C.pin.style.transform = `matrix(1,0,${A.sh.toFixed(5)},${A.d.toFixed(5)},${A.e.toFixed(3)},0)`; }
    else if (z > 1.0001) { C.pin.style.transformOrigin = `${C.PX}px ${C.PY}px`; C.pin.style.transform = `scale(${z.toFixed(4)})`; }
    else C.pin.style.transform = '';
    C.pclip.style.clipPath = z > 1.0001 ? 'inset(100px 900px 260px 120px)' : 'none';

    // 10.1, 10.2 : flèches perpendiculaires au plan, ⊙ de face
    const ell = 150 * 0.8, oA = o1 * (1 - seg(t, T.signe, T.signe + 0.4, E.linear)) * (t < T.roue ? 1 : 0);
    const gP = seg(t, T.fleche3d + 1.8, T.fleche3d + 2.4, E.outCubic), gG = seg(t, T.plan + 0.2, T.plan + 1.0, E.outCubic);
    const dotO = seg(t, T.plan + 2.5, T.plan + 3.0, E.linear);
    C.GRID.forEach(([x, y], i) => {
      const isP = x === C.PX && y === C.PY, g = isP ? Math.max(gP, gG) : gG, [bx, by] = A.f(x, y), L = ell * Math.sin(th) * g;
      C.vArrows[i].setAttribute('d', L > 6 ? K.arrowPath(bx, by, bx, by - L, 20) : '');
      C.vArrows[i].style.opacity = oA;
      C.odots[i].setAttribute('transform', `translate(${bx.toFixed(2)},${by.toFixed(2)})`);
      C.odots[i].style.opacity = oA * dotO; K.show(C.odots[i], dotO > 0 && oA > 0);
    });

    // =============== 10.3 : deux disques ; 10.4 : un disque ===============
    const placeDisk = (D, thD, wv, o, symScale = 1, symO = 0) => {
      show(D.root, o); if (o <= 0) return;
      const Ad = C.affine(thD, [D.cx, D.cy]);
      D.plane.setAttribute('transform', `translate(${D.cx},${D.cy}) matrix(1,0,${Ad.sh.toFixed(5)},${Ad.d.toFixed(5)},0,0)`);
      const L = 170 * Math.abs(wv) * Math.sin(thD);
      D.above.setAttribute('d', wv > 0 && L > 6 ? K.arrowPath(D.cx, D.cy, D.cx, D.cy - L, 24) : '');
      D.below.setAttribute('d', wv < 0 && L > 6 ? K.arrowPath(D.cx, D.cy, D.cx, D.cy + L, 24) : '');
      D.ccw.style.opacity = S.clamp(wv / 0.15); D.cw.style.opacity = S.clamp(-wv / 0.15);
      D.sym.setAttribute('transform', `translate(${D.cx},${D.cy}) scale(${symScale.toFixed(4)})`); D.sym.style.opacity = symO;
      D.dot.style.display = wv > 0 ? '' : 'none'; D.cross.style.display = wv < 0 ? '' : 'none';
      return L;
    };
    const o2 = seg(t, T.signe + 0.3, T.signe + 0.7, E.linear) * (1 - seg(t, T.longueur3d, T.longueur3d + 0.3, E.linear));
    const th2 = TILT * (1 - seg(t, T.signe + 2.6, T.signe + 3.6, E.inOutCubic)), g2 = seg(t, T.signe + 0.6, T.signe + 1.2, E.outCubic);
    const so2 = seg(t, T.signe + 3.1, T.signe + 3.6, E.linear), sc2 = seg(t, T.signe + 3.6, T.signe + 4.4, E.inOutSine);
    placeDisk(C.D1, th2, g2, o2, 1 + 0.25 * sc2, so2); placeDisk(C.D2, th2, -g2, o2, 1 - 0.25 * sc2, so2);
    const lo = seg(t, T.signe + 1.0, T.signe + 1.4, E.linear) * o2; show(C.lPos, lo); show(C.lNeg, lo);
    const o3 = seg(t, T.longueur3d + 0.1, T.longueur3d + 0.5, E.linear) * (1 - seg(t, T.roue, T.roue + 0.3, E.linear));
    const w3 = C.omega3(t), L3 = placeDisk(C.D3, TILT, w3, o3) || 0;
    // accolade le long de la flèche, à sa gauche, et |ω|
    const bo = o3 * S.clamp((Math.abs(w3) - 0.04) / 0.08);
    if (bo > 0 && L3 > 20) {
      const x0 = C.D3.cx - 26, y0 = C.D3.cy, y1 = w3 > 0 ? C.D3.cy - L3 : C.D3.cy + L3, side = w3 > 0 ? 1 : -1;
      const len = Math.abs(y1 - y0), r = Math.min(16, len / 4), d = -r;
      C.brace.setAttribute('d', `M0,0 q0,${d} ${r},${d} L${len / 2 - r},${d} q${r},0 ${r},${d} q0,${-d} ${r},${-d} L${len - r},${d} q${r},0 ${r},${-d}`);
      C.brace.setAttribute('transform', `translate(${x0},${y0}) rotate(${side > 0 ? -90 : 90}) scale(1,${side > 0 ? 1 : -1})`);
      C.lAbs.style.left = (x0 - 62) + 'px'; C.lAbs.style.top = ((y0 + y1) / 2) + 'px';
    }
    show(C.brace, bo); show(C.lAbs, bo);
    const oPos = S.clamp((w3 - 0.03) / 0.1), oNeg = S.clamp((-w3 - 0.03) / 0.1), oZero = 1 - oPos - oNeg;
    show(C.l3[0], o3 * oPos); show(C.l3[1], o3 * oZero); show(C.l3[2], o3 * oNeg);

    // =============== 10.6 : flèches du fluide au bout des aubes ; angle α ===============
    const fo = o1 * seg(t, T.pousse + 0.6, T.pousse + 1.0, E.linear) * (1 - seg(t, T.moitie, T.moitie + 0.4, E.linear));
    const alpha = 0.4 * Math.max(0, t - C.tl), Rm = 46 / C.SC, KF = 250;
    for (let i = 0; i < 4; i++) {
      const a = alpha + i * Math.PI / 2, px = Rm * Math.cos(a), py = Rm * Math.sin(a), v = C.U(px, py);
      const tx = -Math.sin(a), ty = Math.cos(a), vt = v[0] * tx + v[1] * ty, vr = v[0] * Math.cos(a) + v[1] * Math.sin(a);
      const [bx, by] = C.toPx(px, py);
      C.flowT[i].setAttribute('d', K.arrowPath(bx, by, bx + tx * vt * KF, by - ty * vt * KF, 12));
      C.flowR[i].setAttribute('d', `M${bx.toFixed(2)},${by.toFixed(2)}L${(bx + Math.cos(a) * vr * KF).toFixed(2)},${(by - Math.sin(a) * vr * KF).toFixed(2)}`);
      show(C.flowT[i], fo); show(C.flowR[i], fo);
    }
    const ao = o1 * seg(t, T.pousse + 0.8, T.pousse + 1.2, E.linear) * (1 - seg(t, T.moitie, T.moitie + 0.4, E.linear));
    const am = alpha % TAU, ra = 30;
    let d = ''; for (let i = 0; i <= 40; i++) { const a = am * i / 40; d += (i ? 'L' : 'M') + (C.PX + ra * Math.cos(a)).toFixed(2) + ',' + (C.PY - ra * Math.sin(a)).toFixed(2); }
    C.aArc.setAttribute('d', d); show(C.aArc, ao); show(C.refLine, ao);
    const zz = z, la = am / 2;
    C.alab.style.top = (C.PY - zz * 80 * Math.sin(la)).toFixed(1) + 'px';
    C.alab.style.left = (C.PX + zz * 80 * Math.cos(la)).toFixed(1) + 'px';
    show(C.alab, ao);

    // =============== 10.7, 10.8 : α̇ = ω/2 monte en haut de la colonne ===============
    const gl = seg(t, T.exemple, T.exemple + 0.6, E.inOutCubic), s = S.lerp(1, C.EAS, gl);
    C.Ea.root.style.transformOrigin = '0 0';
    C.Ea.root.style.transform = gl > 0 ? `translate(${((C.EAX - 1250) * gl).toFixed(2)}px, ${((C.EAY - 380) * gl).toFixed(2)}px) scale(${s.toFixed(4)})` : '';

    // =============== 10.9 à 10.14 : rotation solide ===============
    const oS = seg(t, T.reprends, T.reprends + 0.6, E.linear);
    C.A2.canvas.style.opacity = 0.5;
    const b = C.beta(t), g = C.TR.g; g.clearRect(0, 0, 1920, 1080); K.show(C.TR.canvas, oS > 0);
    if (oS > 0) {
      g.save(); g.beginPath(); g.rect(120, 100, 1000, 720); g.clip();
      g.strokeStyle = K.c('u'); g.lineWidth = 2.4; g.lineCap = 'round'; g.globalAlpha = 0.5 * oS; g.beginPath();
      for (const p of C.trs) {   // trait de 0,3 rad derrière chaque particule : rotation d'un bloc, distances gardées
        const R = p.r * C.SC2, a1 = p.th + b, a0 = a1 - 0.3;
        g.moveTo(C.OX + R * Math.cos(a0), C.OY - R * Math.sin(a0));
        g.arc(C.OX, C.OY, R, -a0, -a1, true);
      }
      g.stroke(); g.restore();
    }
    const dO = seg(t, T.disque, T.disque + 0.5, E.linear);
    show(C.diskS, dO); show(C.radius, dO); show(C.radDot, dO);
    const re = [C.OX + C.RD * C.SC2 * Math.cos(b), C.OY - C.RD * C.SC2 * Math.sin(b)];
    C.radius.setAttribute('x2', re[0].toFixed(2)); C.radius.setAttribute('y2', re[1].toFixed(2));
    C.radDot.setAttribute('cx', re[0].toFixed(2)); C.radDot.setAttribute('cy', re[1].toFixed(2));
    // cadrans : aiguille sur le rayon marqué (1) ou sur l'aube marquée (2), arc α qui repart de zéro à chaque tour
    const bm = ((b % TAU) + TAU) % TAU;
    let flash = 0;
    if (t >= T.colle) for (let k = 1; k < 20; k++) { const tk = T.reprends + TAU * k; if (t >= tk && t < tk + 0.5) flash = 1 - (t - tk) / 0.5; }
    [[C.dial1, T.vitesseun], [C.dial2, T.colle]].forEach(([D, a0]) => {
      const o = seg(t, a0, a0 + 0.4, E.linear);
      show(D.g, o); show(D.al, o);
      if (o <= 0) return;
      D.needle.setAttribute('transform', `rotate(${(-b * 180 / Math.PI).toFixed(3)})`);
      let p = ''; for (let i = 0; i <= 60; i++) { const a = bm * i / 60; p += (i ? 'L' : 'M') + (44 * Math.cos(a)).toFixed(2) + ',' + (-44 * Math.sin(a)).toFixed(2); }
      D.arc.setAttribute('d', p);
      D.al.style.left = (D.cx + 62 * Math.cos(bm / 2)).toFixed(1) + 'px'; D.al.style.top = (D.cy - 62 * Math.sin(bm / 2)).toFixed(1) + 'px';
      D.flash.style.opacity = flash;
    });
    // 10.14 : α̇_roue = 1 glisse en face de ω = 2
    const rg = seg(t, T.retiens, T.retiens + 0.6, E.inOutCubic);
    C.Er.root.style.transform = `translateX(-50%) translate(${(-310 * rg).toFixed(2)}px, ${(150 * rg).toFixed(2)}px)`;
  },
});
</script></body></html>
