<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>ep01.16 Deux gestes</title>
<!-- Storyboard ep01, scène ep01.16 (plans 16.1 à 16.9), narration P26 et P27.
     Colonne de gauche (x 160 à 360) : les deux pictogrammes de l'ouverture, « sort » en haut, « tourne » en bas, puis
     la petite roue ; formules en face (x 420 à 1200). Colonne de droite (x 1280 à 1800) : vignettes du cisaillement et du
     tourbillon, puis carte d'exercices. Roue : α, angle de l'aube marquée, compté dans le sens trigonométrique. -->
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/ep-kit.js"></script>
<style>
  .lab { position: absolute; white-space: nowrap; font-size: 36px; color: var(--fg-2); z-index: 18; }
  .lab .katex { font-size: 1em; }
  .ex-card { position: absolute; left: 1290px; top: 110px; width: 510px; height: 600px; box-sizing: border-box;
    border: 2px solid var(--grid); background: var(--panel); border-radius: 6px; z-index: 13; }
  .ex-row { position: absolute; white-space: nowrap; z-index: 18; }
  .ex-num { font-family: "Inter Display"; font-weight: 600; font-size: 40px; color: var(--fg); }
  .veil { position: absolute; inset: 0; background: var(--bg); pointer-events: none; }
</style>
</head><body><div id="stage"></div>
<script>
Scene.define({
  duration: 44.5,
  register: 'night',
  // temps d'aperçu (estimation à 146 mots par minute) ; le moteur injecte les vrais
  cues: { 'e1-retenir': 0.4, 'e1-sortir': 1.93, 'e1-tourner': 8.4, 'e1-rouemoitie': 12.81, 'e1-rappelcis': 17.63, 'e1-rappeltour': 23.27,
    'e1-crayon': 28.91, 'e1-exos': 31.68, 'e1-suivant': 36.09 },
  setup(ctx) {
    const K = Kit, S = Scene, at = ctx.at, seg = S.seg, E = S.ease, PI = Math.PI;
    const T = {};
    for (const k of Object.keys(ctx.cues)) if (k.startsWith('e1-')) T[k.slice(3)] = at(k);
    const chalk = K.c('chalk'), ucol = K.c('u'), muted = K.c('muted'), matter = K.c('matter');
    const svg = K.svgLayer(ctx, 14); svg.setAttribute('data-kit', 'cloture');
    const mk = (tag, a, p = svg) => K.s(tag, a, p);
    const dashedCircle = (p, r, w = 3) => mk('circle', { r, fill: 'none', stroke: chalk, 'stroke-width': w, 'stroke-dasharray': '12 9' }, p);
    const lab = (tex, x, y, size = 36, parent = ctx.stage) => { const d = K.el('div', { class: 'lab', html: K.tex(tex, false) }, parent); d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.fontSize = size + 'px'; return d; };
    // arc fléché de rayon R, de a0 à a1 (radians, sens trigonométrique si a1 > a0), à l'écran autour de (0, 0)
    const arcArrow = (p, R, a0, a1, col, w = 5, hl = 20) => {
      let d = ''; const N = 48;
      for (let i = 0; i <= N; i++) { const a = a0 + (a1 - a0) * i / N; d += (i ? 'L' : 'M') + (R * Math.cos(a)).toFixed(1) + ',' + (-R * Math.sin(a)).toFixed(1); }
      const s = Math.sign(a1 - a0), ex = R * Math.cos(a1), ey = -R * Math.sin(a1), ang = Math.atan2(-s * Math.cos(a1), -s * Math.sin(a1));
      const g = mk('g', {}, p);
      mk('path', { d, fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, g);
      mk('path', { d: `M${(ex + 4 * Math.cos(ang)).toFixed(1)},${(ey + 4 * Math.sin(ang)).toFixed(1)}L${(ex - hl * Math.cos(ang - 0.5)).toFixed(1)},${(ey - hl * Math.sin(ang - 0.5)).toFixed(1)}L${(ex - hl * Math.cos(ang + 0.5)).toFixed(1)},${(ey - hl * Math.sin(ang + 0.5)).toFixed(1)}Z`, fill: col }, g);
      return g;
    };

    // ---------- 16.1 : les deux pictogrammes de l'ouverture ----------
    const PS = [260, 230], PT = [260, 500];
    const picS = mk('g', { transform: `translate(${PS[0]},${PS[1]})` });
    const picSc = mk('g', {}, picS);
    const picSCircle = dashedCircle(picSc, 90);
    for (let i = 0; i < 4; i++) { const a = i * PI / 2, c = Math.cos(a), s = -Math.sin(a);
      mk('path', { d: K.arrowPath(30 * c, 30 * s, 128 * c, 128 * s, 18), fill: ucol, stroke: ucol, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, picS); }
    const picT = mk('g', { transform: `translate(${PT[0]},${PT[1]})` });
    dashedCircle(picT, 90);
    arcArrow(picT, 112, -PI / 3, 7 * PI / 6, chalk, 5, 22);

    // ---------- 16.2 à 16.4 : les formules en face ----------
    const EQX = 420;
    const Es = K.equation(ctx, { x: EQX, y: 150, size: 52, anchor: 'left',
      tex: '\\nabla\\cdot\\U = \\lim_{r\\to0} \\dfrac{\\text{flux}}{\\pi r^2} = \\partial_x \\cu{u_x} + \\partial_y \\cu{u_y}', at: 'e1-sortir+0.3', wipe: 1.2 });
    const Et = K.equation(ctx, { x: EQX, y: 420, size: 52, anchor: 'left',
      tex: '\\cu{\\omega} = \\lim_{r\\to0} \\dfrac{\\text{circulation}}{\\pi r^2} = \\partial_x \\cu{u_y} - \\partial_y \\cu{u_x}', at: 'e1-tourner+0.3', wipe: 1.2 });
    const Er = K.equation(ctx, { x: EQX, y: 615, size: 52, anchor: 'left',
      tex: '\\dot\\alpha_{\\text{roue}} = \\cu{\\omega}/2', at: 'e1-rouemoitie+0.2', wipe: 0.6 });
    // la petite roue, sous le pictogramme « tourne » : un quart de tour dans le sens trigonométrique (ω > 0)
    const wheelToPx = (x, y) => [x, -y];
    K.paddleWheel(ctx, { toPx: wheelToPx, pos: [PT[0], -665], r: 42, at: 'e1-rouemoitie+0.1', z: 15,
      angle: (t) => PI / 2 + (PI / 2) * seg(t, T.rouemoitie + 0.7, T.rouemoitie + 2.0, E.inOutSine) });

    // ---------- 16.5 : vignette du cisaillement u = (y, 0) ----------
    const VX = 1300, VW = 500, VH = 240;
    const vigS = mk('g', {}), vigT = mk('g', {});
    const SY = 115, SU = 50;                     // centre de la vignette (y écran) ; 50 px par unité, y de −2 à 2 (hauteur 240)
    const shY0 = 90, shCy = shY0 + VH / 2;
    mk('rect', { x: VX, y: shY0, width: VW, height: VH, fill: 'none', stroke: matter, 'stroke-width': 2 }, vigS);
    const shLines = [-1.6, -0.8, 0, 0.8, 1.6];
    for (const yy of shLines) mk('line', { x1: VX + 10, x2: VX + VW - 10, y1: shCy - yy * SU * 1.2, y2: shCy - yy * SU * 1.2, stroke: ucol, 'stroke-width': 2.5, opacity: 0.55 }, vigS);
    const shArrows = [];
    for (const yy of shLines) for (const xx of [0.18, 0.82]) {
      if (yy === 0) continue;
      mk('path', { d: K.arrowPath(VX + xx * VW, shCy - yy * SU * 1.2, VX + xx * VW + yy * 40, shCy - yy * SU * 1.2, 14), fill: ucol, stroke: ucol, 'stroke-width': 4, 'stroke-linecap': 'round' }, vigS);
    }
    // points portés par le courant, en forme fermée : x = x0 + vitesse · t, ramené dans la vignette
    const shDots = [];
    for (const yy of shLines) for (let k = 0; k < 4; k++) shDots.push({ yy, x0: k / 4, el: mk('circle', { r: 5, fill: ucol }, vigS) });
    const labS = lab('\\cu{\\omega} = -1', VX + 8, shY0 + VH + 10, 36);
    // roue au centre, sur la ligne immobile : sens horaire, α̇ = ω/2 = −1/2 rad par seconde de scène
    const wS = K.paddleWheel(ctx, { toPx: wheelToPx, pos: [VX + VW / 2, -shCy], r: 30, at: 'e1-rappelcis+0.2', out: 'e1-crayon', z: 15,
      angle: (t) => PI / 2 - 0.5 * Math.max(0, t - T.rappelcis) });

    // ---------- 16.6 : vignette du tourbillon ----------
    const vtY0 = 430, vtCx = VX + VW / 2, vtCy = vtY0 + VH / 2;
    mk('rect', { x: VX, y: vtY0, width: VW, height: VH, fill: 'none', stroke: matter, 'stroke-width': 2 }, vigT);
    for (const R of [38, 78, 108]) mk('circle', { cx: vtCx, cy: vtCy, r: R, fill: 'none', stroke: ucol, 'stroke-width': 2.5, opacity: 0.55 }, vigT);
    mk('circle', { cx: vtCx, cy: vtCy, r: 6, fill: K.c('fg') }, vigT);
    const labT = lab('\\cu{\\omega} = 0 \\ \\text{pour}\\ r > 0', VX + 8, vtY0 + VH + 10, 36);
    // la roue fait le tour dans le sens trigonométrique, à vitesse constante (un tour en 9 s), sans pivoter (aube vers le haut)
    const ORB = 78, wT = K.paddleWheel(ctx, { toPx: wheelToPx, r: 22, at: 'e1-rappeltour+0.2', out: 'e1-crayon', z: 15,
      pos: (t) => { const a = -PI / 2 + 2 * PI * Math.max(0, t - T.rappeltour) / 9; return [vtCx + ORB * Math.cos(a), -(vtCy - ORB * Math.sin(a))]; },
      angle: () => PI / 2 });

    // ---------- 16.7, 16.8 : la carte d'exercices ----------
    const card = K.el('div', { class: 'ex-card', 'data-kit': 'exercise-card' }, ctx.stage);
    const cardTitle = K.el('div', { class: 'ex-row mono', 'data-kit': 'exercise-card' }, ctx.stage, K.upper('Exercices'));
    cardTitle.style.left = '1320px'; cardTitle.style.top = '134px'; cardTitle.style.fontSize = '32px'; cardTitle.style.color = K.c('fg-2');
    const pencil = mk('g', { transform: 'translate(1745,152) rotate(-35)' });
    mk('path', { d: 'M-34,-7 L22,-7 L36,0 L22,7 L-34,7 Z', fill: 'none', stroke: chalk, 'stroke-width': 3, 'stroke-linejoin': 'round' }, pencil);
    mk('path', { d: 'M22,-7 L22,7 M-24,-7 L-24,7', fill: 'none', stroke: chalk, 'stroke-width': 3 }, pencil);
    mk('path', { d: 'M31,-2.5 L36,0 L31,2.5 Z', fill: chalk }, pencil);
    const rowY = [262, 432, 572];
    const rows = ['1 (b)', '2 (b)', '2 (c)'].map((s, i) => { const d = K.el('div', { class: 'ex-row ex-num tnum', 'data-kit': 'exercise-card' }, ctx.stage, s);
      d.style.left = '1320px'; d.style.top = (rowY[i] - 26) + 'px'; return d; });
    const anchor = K.el('div', { class: 'ex-row mono', 'data-kit': 'exercise-card' }, ctx.stage, K.upper('#exercices'));
    anchor.style.left = '1320px'; anchor.style.top = '650px'; anchor.style.color = muted;
    // miniatures : 1 (b) les deux formules de gauche, posées à côté de la ligne, sans signe d'égalité avec l'énoncé
    const mini1 = [lab('\\nabla\\cdot\\U = \\partial_x \\cu{u_x} + \\partial_y \\cu{u_y}', 1450, rowY[0] - 50, 30),
      lab('\\cu{\\omega} = \\partial_x \\cu{u_y} - \\partial_y \\cu{u_x}', 1450, rowY[0] + 4, 30)];
    mini1.forEach((d) => { d.style.color = muted; });   // --muted plein, sans opacité réduite
    // 2 (b) : la roue du cisaillement ; 2 (c) : la roue du tourbillon
    const m2 = mk('g', {});
    const m2x = 1450, m2w = 300;
    for (const yy of [-30, 0, 30]) mk('line', { x1: m2x, x2: m2x + m2w, y1: rowY[1] + yy, y2: rowY[1] + yy, stroke: ucol, 'stroke-width': 2.5, opacity: 0.55 }, m2);
    for (const [yy, dir] of [[-30, 1], [30, -1]]) for (const xx of [m2x + 40, m2x + m2w - 40]) mk('path', { d: K.arrowPath(xx - 18 * dir, rowY[1] + yy, xx + 18 * dir, rowY[1] + yy, 12), fill: ucol, stroke: ucol, 'stroke-width': 3.5 }, m2);
    const m3 = mk('g', {});
    const m3c = [1600, rowY[2]];
    for (const R of [26, 52]) mk('circle', { cx: m3c[0], cy: m3c[1], r: R, fill: 'none', stroke: ucol, 'stroke-width': 2.5, opacity: 0.55 }, m3);
    mk('circle', { cx: m3c[0], cy: m3c[1], r: 4, fill: K.c('fg') }, m3);
    const wM2 = K.paddleWheel(ctx, { toPx: wheelToPx, pos: [m2x + m2w / 2, -rowY[1]], r: 22, at: 'e1-exos+1.4', z: 17, angle: (t) => PI / 2 - 0.5 * Math.max(0, t - T.exos - 1.4) });
    const wM3 = K.paddleWheel(ctx, { toPx: wheelToPx, r: 16, at: 'e1-exos+2.4', z: 17, angle: () => PI / 2,
      pos: (t) => { const a = 2 * PI * Math.max(0, t - T.exos - 2.4) / 9; return [m3c[0] + 52 * Math.cos(a), -(m3c[1] - 52 * Math.sin(a))]; } });

    // ---------- 16.9 : tout baisse à 40 % ; un petit cercle au centre devient un carrelage 3 × 2 ----------
    const veil = K.el('div', { class: 'veil', 'data-qa': 'ignore' }, ctx.stage); veil.style.zIndex = 56;
    const svgTile = K.svgLayer(ctx, 57); svgTile.setAttribute('data-kit', 'tiling');
    const TC = [960, 785], TS = 80;   // centré en x, sous les formules (la seule zone libre : au centre exact, il recouvrirait la ligne de ω)
    const tCircle = mk('circle', { cx: TC[0], cy: TC[1], r: 40, fill: 'none', stroke: chalk, 'stroke-width': 3, 'stroke-dasharray': '12 9' }, svgTile);
    const tiles = [];
    for (let j = 0; j < 2; j++) for (let i = 0; i < 3; i++) tiles.push({ i, j, el: mk('rect', { width: TS, height: TS, fill: 'none', stroke: chalk, 'stroke-width': 2, 'stroke-dasharray': '10 8' }, svgTile) });
    const outline = mk('rect', { x: TC[0] - 1.5 * TS, y: TC[1] - TS, width: 3 * TS, height: 2 * TS, fill: 'none', stroke: chalk }, svgTile);
    const black = K.el('div', { class: 'veil', 'data-qa': 'ignore' }, ctx.stage); black.style.zIndex = 60;

    ctx.S = { T, PI, picS, picT, picSc, picSCircle, vigS, vigT, labS, labT, shDots, shLines, VX, VW, shCy, SU, card, cardTitle, pencil, rows, anchor,
      mini1, m2, m3, veil, svgTile, tCircle, tiles, outline, black, TC, TS, Es, Et, Er };
  },

  render(t, ctx) {
    const K = Kit, S = Scene, seg = S.seg, E = S.ease;
    const C = ctx.S, T = C.T;
    const fade = (a, d = 0.35) => seg(t, a, a + d, E.linear);
    // 16.1 : apparition échelonnée
    C.picS.style.opacity = fade(T.retenir - 0.6, 0.5); C.picT.style.opacity = fade(T.retenir + 0.2, 0.5);
    // 16.2 : le cercle du pictogramme « sort » rétrécit un peu et revient
    const sh = Math.sin(C.PI * seg(t, T.sortir + 1.6, T.sortir + 3.4, E.inOutSine));
    C.picSCircle.setAttribute('r', (90 - 28 * sh).toFixed(2));

    // 16.5, 16.6 : vignettes, effacées sur [e1-crayon]
    const vOut = 1 - fade(T.crayon, 0.4);
    const oS = fade(T.rappelcis, 0.4) * vOut, oT = fade(T.rappeltour, 0.4) * vOut;
    C.vigS.style.opacity = oS; C.labS.style.opacity = oS; K.show(C.labS, oS > 0);
    C.vigT.style.opacity = oT; C.labT.style.opacity = oT; K.show(C.labT, oT > 0);
    const dt = Math.max(0, t - T.rappelcis);
    for (const d of C.shDots) {
      const w = C.VW - 20, x = C.VX + 10 + (((d.x0 * w + d.yy * 40 * dt) % w) + w) % w;
      d.el.setAttribute('cx', x.toFixed(1)); d.el.setAttribute('cy', (C.shCy - d.yy * C.SU * 1.2).toFixed(1));
    }

    // 16.7 : carte d'exercices, lignes en cascade ; 16.8 : miniatures une à une
    const cOn = fade(T.crayon + 0.2, 0.4);
    C.card.style.opacity = cOn; K.show(C.card, cOn > 0);
    C.cardTitle.style.opacity = cOn; K.show(C.cardTitle, cOn > 0);
    C.pencil.style.opacity = fade(T.crayon + 0.5, 0.3);
    C.rows.forEach((r, i) => { const o = fade(T.crayon + 0.6 + 0.35 * i, 0.3); r.style.opacity = o; K.show(r, o > 0); });
    const ao = fade(T.crayon + 1.7, 0.3); C.anchor.style.opacity = ao; K.show(C.anchor, ao > 0);
    const m1 = fade(T.exos + 0.4, 0.4); C.mini1.forEach((d) => { d.style.opacity = m1; K.show(d, m1 > 0); });
    C.m2.style.opacity = fade(T.exos + 1.4, 0.4); C.m3.style.opacity = fade(T.exos + 2.4, 0.4);

    // 16.9 : voile à 60 % (tout à 40 %), carrelage, puis fondu au noir de 1 s en fin de scène
    const dim = fade(T.suivant, 0.6);
    C.veil.style.opacity = (0.6 * dim).toFixed(3); K.show(C.veil, dim > 0);
    const tOn = fade(T.suivant + 0.1, 0.4), split = seg(t, T.suivant + 0.6, T.suivant + 1.8, E.inOutCubic);
    C.svgTile.style.opacity = tOn; K.show(C.svgTile, tOn > 0);
    C.tCircle.style.opacity = 1 - split;
    C.tiles.forEach(({ i, j, el }) => {
      const x = C.TC[0] + (i - 1.5) * C.TS, y = C.TC[1] + (j - 1) * C.TS;      // position finale du carreau
      const s = S.lerp(0.25, 1, split), cx = C.TC[0] + (x + C.TS / 2 - C.TC[0]) * split, cy = C.TC[1] + (y + C.TS / 2 - C.TC[1]) * split;
      el.setAttribute('x', (cx - C.TS * s / 2).toFixed(2)); el.setAttribute('y', (cy - C.TS * s / 2).toFixed(2));
      el.setAttribute('width', (C.TS * s).toFixed(2)); el.setAttribute('height', (C.TS * s).toFixed(2));
      el.style.opacity = split;
    });
    const thick = seg(t, T.suivant + 1.8, T.suivant + 2.8, E.inOutSine);
    C.outline.style.opacity = split >= 1 ? 1 : 0; C.outline.setAttribute('stroke-width', (2 + 6 * thick).toFixed(2));
    const end = seg(t, ctx.duration - 1, ctx.duration, E.inOutSine);
    C.black.style.opacity = end.toFixed(3); K.show(C.black, end > 0);
  },
});
</script></body></html>
