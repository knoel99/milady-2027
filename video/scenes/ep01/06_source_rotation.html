<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>ep01.06 Source et rotation</title>
<!-- Storyboard ep01, scène ep01.06 (plans 6.1 à 6.12), narration P10 et P11.
     Deux panneaux 700 × 560 (x 140 à 840 et 1080 à 1780, y 200 à 760), unité 140 px, y vers le haut.
     Gauche : source u = (x, y), origine en (470, 520). Droite : rotation u = (−y, x), origine en (1410, 520).
     Flèches de la grille 11 × 9, longueur proportionnelle : 16 px par unité de champ (les mêmes dans la scène 07).
     Flèche du point qui marche : 40 px par unité (lisibilité), parts plein --u / tirets --muted. -->
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/ep-kit.js"></script>
<style>
  .lab { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 32px; color: var(--muted); z-index: 18; }
  .lab .katex { font-size: 1em; }
</style>
</head><body><div id="stage"></div>
<script>
Scene.define({
  duration: 52.6,
  register: 'night',
  // temps d'aperçu = estimation du moteur ; le moteur injecte les vrais
  cues: { 'e1-essai': 0.4, 'e1-fuit': 3.29, 'e1-allonge': 8.42, 'e1-srcdroite': 12.92, 'e1-srchaut': 18.18, 'e1-un': 22.22,
    'e1-vautdeux': 24.4, 'e1-bloc': 28.83, 'e1-perp': 34.3, 'e1-rotdroite': 39.77, 'e1-rothaut': 43.78, 'e1-vautzero': 47.45 },
  setup(ctx) {
    const K = Kit, S = Scene, at = ctx.at, seg = S.seg, E = S.ease;
    const T = {};
    for (const k of Object.keys(ctx.cues)) if (k.startsWith('e1-')) T[k.slice(3)] = at(k);
    const UNIT = 140, KG = 16, WS = 40;            // px par unité de longueur ; px par unité de champ (grille, marche)
    const PAN = [{ x: 140, y: 200, w: 700, h: 560, ox: 470, oy: 520 }, { x: 1080, y: 200, w: 700, h: 560, ox: 1410, oy: 520 }];
    const toPxF = (P) => (x, y) => [P.ox + UNIT * x, P.oy - UNIT * y];
    const toM = (P) => (px, py) => [(px - P.ox) / UNIT, (P.oy - py) / UNIT];
    const toPx = [toPxF(PAN[0]), toPxF(PAN[1])];
    const Fsrc = (x, y) => [x, y], Frot = (x, y) => [-y, x];
    const FF = [Fsrc, Frot];

    // ---------- cadres (posés dès la première image) ----------
    const back = K.svgLayer(ctx, 4); back.setAttribute('data-kit', 'panels');
    for (const P of PAN) K.s('rect', { x: P.x, y: P.y, width: P.w, height: P.h, fill: 'none', stroke: K.c('matter'), 'stroke-width': 2 }, back);

    // ---------- flèches de la grille (Kit.arrows, longueur linéaire) ----------
    const gridF = (i) => (px, py) => { const [x, y] = toM(PAN[i])(px, py), v = FF[i](x, y); return [v[0], -v[1]]; };
    const A = [0, 1].map((i) => K.arrows(ctx, { F: gridF(i), box: { x: PAN[i].x, y: PAN[i].y, w: PAN[i].w, h: PAN[i].h }, nx: 11, ny: 9,
      compress: { k: KG, threshold: 1e9 }, color: 'u', width: 3, at: i ? 'e1-bloc' : 'e1-fuit', z: 7 }));

    // ---------- traceurs en forme fermée (calque Canvas découpé au panneau) ----------
    const TL = K.canvasLayer(ctx, 6, null, null, { reset: true }); TL.canvas.setAttribute('data-kit', 'tracers');
    const rs = S.rng('src-tracers'), rr = S.rng('rot-tracers');
    const SRC = Array.from({ length: 150 }, () => ({ phi: rs() * 2 * Math.PI, p: rs() }));
    const ROT = Array.from({ length: 190 }, () => ({ r: Math.sqrt(0.02 + 0.98 * rr()) * 3.6, th: rr() * 2 * Math.PI }));
    const RMIN = 0.15, RMAX = 3.8, TCYC = Math.log(RMAX / RMIN);   // source : r = rmin·e^{s}, vitesse radiale = r (1 unité par s)

    // ---------- SVG du premier plan ----------
    const svg = K.svgLayer(ctx, 12); svg.setAttribute('data-kit', 'scene06');
    const mk = (tag, a, p = svg) => K.s(tag, a, p);
    const chalk = K.c('chalk'), muted = K.c('muted'), ucol = K.c('u');
    const arrowEl = (w = 4) => mk('path', { fill: ucol, stroke: ucol, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const dashEl = () => mk('path', { fill: 'none', stroke: muted, 'stroke-width': 3, 'stroke-dasharray': '8 7' });
    const lineEl = (col, w, dash) => mk('path', Object.assign({ fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, dash ? { 'stroke-dasharray': dash } : {}));
    const setArrow = (el, x0, y0, dx, dy, o = 1, hl = 16) => { el.setAttribute('d', K.arrowPath(x0, y0, x0 + dx, y0 + dy, hl)); el.style.opacity = o; };
    const setLine = (el, x0, y0, x1, y1, o = 1) => { el.setAttribute('d', `M${x0.toFixed(2)},${y0.toFixed(2)}L${x1.toFixed(2)},${y1.toFixed(2)}`); el.style.opacity = o; };

    // 6.3 et 6.9 : un rayon --muted et trois flèches à 1, 2, 3 unités (même échelle que la grille)
    const RAYA = [42 * Math.PI / 180, 38 * Math.PI / 180];
    const rays = [0, 1].map(() => lineEl(muted, 3));
    const hi = [0, 1].map(() => [1, 2, 3].map(() => arrowEl(5)));
    const corners = [1, 2, 3].map(() => mk('path', { fill: 'none', stroke: muted, 'stroke-width': 2.5 }));
    // 6.8 : rayon marqué --chalk qui tourne avec le fluide
    const spoke = lineEl(chalk, 5);
    const hubDot = mk('circle', { r: 6, fill: chalk });

    // marche (6.4, 6.5, 6.10, 6.11) : droite --chalk, point, part pleine --u, part en tirets --muted
    const walk = [0, 1].map(() => ({ hline: lineEl(chalk, 3), vline: lineEl(chalk, 3), dot: mk('circle', { r: 9, fill: chalk }), solid: arrowEl(5), dash: dashEl() }));

    // ---------- médaillons (Kit.plot, 260 × 180, fond --panel) ----------
    const MED = [{ x: 150, y: 210 }, { x: 1090, y: 210 }];
    const medSvg = K.svgLayer(ctx, 11); medSvg.setAttribute('data-kit', 'medallions');
    const medBg = MED.map((m) => mk('rect', { x: m.x, y: m.y, width: 260, height: 180, rx: 6, fill: K.c('panel'), stroke: K.c('grid'), 'stroke-width': 2 }, medSvg));
    const plotBox = (m) => ({ x0: m.x + 50, x1: m.x + 242, y0: m.y + 24, y1: m.y + 142 });
    const AX = { min: -1.5, max: 2, ticks: [] };
    // plots[i][0] : u_x en fonction de x (droite horizontale) ; plots[i][1] : u_y en fonction de y (droite verticale)
    const cueOf = [['e1-srcdroite', 'e1-srchaut'], ['e1-rotdroite', 'e1-rothaut']];
    const endOut = 'e1-vautzero+1.6';
    const plots = [0, 1].map((i) => [0, 1].map((j) => K.plot(ctx, { box: plotBox(MED[i]), x: AX, y: AX, grid: false, svg: medSvg,
      at: cueOf[i][j], out: j === 0 ? cueOf[i][1] : endOut })));
    const WALKDUR = [3.0, 2.5];
    const curveF = [[(x) => x, (y) => y], [() => 1, (x) => 1.5]];   // u_x(x) sur y = −1 ; u_y(y) sur x = 1,5
    const NS = 64;
    plots.forEach((row, i) => row.forEach((P, j) => {
      P.hline({ y: 0, kind: 'zero', at: cueOf[i][j] });
      const xs = Array.from({ length: NS + 1 }, (_, k) => -1.5 + 3.5 * k / NS);
      P.curve({ x: xs, y: xs.map(curveF[i][j]), field: 'u', width: 4, at: `${cueOf[i][j]}+0.3`, dur: WALKDUR[j] });
    }));
    const medDot = [0, 1].map(() => mk('circle', { r: 7, fill: chalk }, medSvg));
    // triangle de pente « 1 de côté, 1 de montée » sur le graphe de la source (6.4 et 6.5)
    const tri = [0, 1].map(() => { const g = mk('g', {}, medSvg);
      return { g, legs: mk('path', { fill: 'none', stroke: chalk, 'stroke-width': 3, 'stroke-linejoin': 'round' }, g) }; });
    const lab = (tex, color = 'muted', size = 32) => { const d = K.el('div', { class: 'lab', html: K.tex(tex, false) }, ctx.stage); d.style.color = K.c(color); d.style.fontSize = size + 'px'; return d; };
    const place = (el, x, y, o) => { el.style.left = x.toFixed(1) + 'px'; el.style.top = y.toFixed(1) + 'px'; el.style.opacity = o; K.show(el, o > 0.01); };
    // étiquettes d'axes des médaillons : [panneau][graphe] = {y, x}
    const axLab = [0, 1].map((i) => [['\\cu{u_x}', 'x'], ['\\cu{u_y}', 'y']].map(([ly, lx]) => ({ y: lab(ly, 'fg-2'), x: lab(lx, 'muted') })));
    const triLab = [0, 1].map(() => ({ a: lab('1', 'chalk', 28), b: lab('1', 'chalk', 28) }));

    // ---------- équations ----------
    const EQS = 46;
    const recall = K.equation(ctx, { x: 960, y: 92, size: 52, anchor: 'center', at: 'e1-essai', wipe: 0.01, out: 'e1-fuit-0.35',
      tex: '\\nabla\\cdot\\U = \\partial_x \\cu{u_x} + \\partial_y \\cu{u_y}' });
    const head = [
      K.equation(ctx, { x: 490, y: 70, size: EQS, anchor: 'center', reveal: [[['f'], 'e1-fuit+0.2']], tex: '\\term{f}{\\U = (x,\\, y)}' }),
      K.equation(ctx, { x: 1430, y: 70, size: EQS, anchor: 'center', reveal: [[['f'], 'e1-bloc+0.2']], tex: '\\term{f}{\\U = (-y,\\, x)}' }),
    ];
    const vals = ['1', '0'], res = ['2', '0'], dv = ['e1-vautdeux', 'e1-vautzero'];
    const band = [0, 1].map((i) => K.equation(ctx, { x: PAN[i].ox + 20, y: 784, size: EQS, anchor: 'center', out: endOut,
      tex: `\\term{dx}{\\partial_x \\cu{u_x}}\\term{e1}{=}\\term{v1}{${vals[i]}}\\term{sp}{\\qquad\\quad}\\term{dy}{\\partial_y \\cu{u_y}}\\term{e2}{=}\\term{v2}{${vals[i]}}`,
      reveal: [[['dx', 'e1', 'v1', 'sp'], `${cueOf[i][0]}+${WALKDUR[0] + 0.4}`], [['dy', 'e2', 'v2'], `${cueOf[i][1]}+${WALKDUR[1] + 0.35}`]] }));
    const divl = [0, 1].map((i) => K.equation(ctx, { x: PAN[i].ox + 20, y: 132, size: EQS, anchor: 'center',
      tex: `\\term{lhs}{\\nabla\\cdot\\U}\\term{eq}{=}\\term{v1}{${vals[i]}}\\term{plus}{+}\\term{v2}{${vals[i]}}\\term{res}{=${res[i]}}`,
      reveal: [[['lhs', 'eq', 'plus', 'v1', 'v2'], `${dv[i]}+0.5`], ['res', `${dv[i]}+1.5`]] }));
    // 6.6 : les deux « = 1 » soulignés ensemble
    const ub = (B, a, b) => { const p = B.tbox[a], q = B.tbox[b]; return { x: p.x, y: Math.min(p.y, q.y), w: q.x + q.w - p.x, h: Math.max(p.y + p.h, q.y + q.h) - Math.min(p.y, q.y) }; };
    K.pen(ctx, { kind: 'underline', box: ub(band[0], 'e1', 'v1'), at: 'e1-un+0.1', dur: 0.45, out: 'e1-vautdeux+1.8', width: 4 });
    K.pen(ctx, { kind: 'underline', box: ub(band[0], 'e2', 'v2'), at: 'e1-un+0.1', dur: 0.45, out: 'e1-vautdeux+1.8', width: 4 });
    // vol des deux valeurs de la bande vers la ligne de la divergence
    const fly = [0, 1].map((i) => { const d = {}; for (const k of ['v1', 'v2']) { const a = band[i].tbox[k], b = divl[i].tbox[k]; d[k] = [a.x - b.x, a.y - b.y]; } return d; });

    ctx.S = { T, UNIT, KG, WS, PAN, toPx, FF, A, TL, SRC, ROT, RMIN, TCYC, rays, hi, corners, RAYA, spoke, hubDot, walk, plots, medDot, tri, axLab, triLab,
      MED, plotBox, WALKDUR, curveF, place, setArrow, setLine, recall, head, band, divl, fly, medBg };
  },

  render(t, ctx) {
    const K = Kit, S = Scene, seg = S.seg, E = S.ease;
    const C = ctx.S, T = C.T, { UNIT, KG, WS, PAN, toPx, FF, setArrow, setLine, place } = C;

    // 6.1 : rappel à 40 %
    C.recall.root.style.opacity = (0.4 * seg(t, T.essai, T.essai + 0.6, E.linear) * (1 - seg(t, T.fuit - 0.35, T.fuit, E.linear))).toFixed(3);

    // ---------- opacité des grilles ----------
    {   // gauche : 1 → 0,45 (6.3) → 0,3 (6.4 à 6.6) → 1 (6.7)
      let o = 1;
      if (t >= T.allonge) o = 1 - 0.55 * seg(t, T.allonge, T.allonge + 0.4, E.linear);
      if (t >= T.srcdroite) o = S.lerp(0.45, 0.3, seg(t, T.srcdroite, T.srcdroite + 0.4, E.linear));
      if (t >= T.vautdeux + 0.6) o = S.lerp(0.3, 1, seg(t, T.vautdeux + 0.6, T.vautdeux + 1.2, E.linear));
      C.A[0].canvas.style.opacity = o.toFixed(3);
      let r = 1;   // droite : 1 → 0,45 (6.9) → 0,3 (6.10 à 6.12) → 1 à la fin
      if (t >= T.perp) r = 1 - 0.55 * seg(t, T.perp, T.perp + 0.4, E.linear);
      if (t >= T.rotdroite) r = S.lerp(0.45, 0.3, seg(t, T.rotdroite, T.rotdroite + 0.4, E.linear));
      if (t >= T.vautzero + 1.6) r = S.lerp(0.3, 1, seg(t, T.vautzero + 1.6, T.vautzero + 2.2, E.linear));
      C.A[1].canvas.style.opacity = r.toFixed(3);
    }

    // ---------- traceurs ----------
    const g = C.TL.g; g.clearRect(0, 0, 1920, 1080);
    const aS = 0.3 * seg(t, T.fuit, T.fuit + 0.8, E.inOutSine) * (1 - seg(t, T.srcdroite, T.srcdroite + 0.5, E.linear));
    const aR = 0.3 * seg(t, T.bloc, T.bloc + 0.8, E.inOutSine) * (1 - seg(t, T.rotdroite, T.rotdroite + 0.5, E.linear));
    g.lineWidth = 2.2; g.lineCap = 'round'; g.strokeStyle = K.c('u');
    if (aS > 0.001) {
      const P = PAN[0]; g.save(); g.beginPath(); g.rect(P.x, P.y, P.w, P.h); g.clip(); g.globalAlpha = aS; g.beginPath();
      for (const q of C.SRC) {
        const s = ((t / C.TCYC + q.p) % 1 + 1) % 1, r = C.RMIN * Math.exp(s * C.TCYC), r0 = r * Math.exp(-0.2);
        const c = Math.cos(q.phi), sn = Math.sin(q.phi);
        const a = toPx[0](r0 * c, r0 * sn), b = toPx[0](r * c, r * sn);
        g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]);
      }
      g.stroke(); g.restore();
    }
    if (aR > 0.001) {
      const P = PAN[1]; g.save(); g.beginPath(); g.rect(P.x, P.y, P.w, P.h); g.clip(); g.globalAlpha = aR; g.beginPath();
      for (const q of C.ROT) {
        const th = q.th + (t - T.bloc), rp = q.r * UNIT, a0 = -th;   // angle écran = −angle mathématique
        g.moveTo(P.ox + rp * Math.cos(a0), P.oy + rp * Math.sin(a0));
        g.arc(P.ox, P.oy, rp, a0, a0 + 0.24, false);
      }
      g.stroke(); g.restore();
    }

    // ---------- 6.3 et 6.9 : rayon et trois flèches ----------
    for (let i = 0; i < 2; i++) {
      const c0 = i ? T.perp : T.allonge, c1 = i ? T.rotdroite : T.srcdroite;
      const on = seg(t, c0, c0 + 0.4, E.linear) * (1 - seg(t, c1, c1 + 0.4, E.linear));
      const th = C.RAYA[i], ct = Math.cos(th), st = Math.sin(th);
      const o0 = toPx[i](0, 0), o1 = toPx[i](3 * ct, 3 * st);
      setLine(C.rays[i], o0[0], o0[1], S.lerp(o0[0], o1[0], seg(t, c0, c0 + 0.5, E.outCubic)), S.lerp(o0[1], o1[1], seg(t, c0, c0 + 0.5, E.outCubic)), on);
      K.show(C.rays[i], on > 0.001);
      [1, 2, 3].forEach((r, k) => {
        const el = C.hi[i][k], a0 = c0 + 0.5 + 0.9 * k, pul = Math.sin(Math.PI * seg(t, a0, a0 + 0.8, E.linear));
        const lit = seg(t, a0, a0 + 0.3, E.linear) * on;
        const [x, y] = [r * ct, r * st], v = FF[i](x, y), b = toPx[i](x, y);
        K.show(el, lit > 0.001);
        setArrow(el, b[0], b[1], v[0] * KG, -v[1] * KG, lit, 14);
        el.setAttribute('stroke-width', (4 + 3 * pul).toFixed(2));
        if (i === 1) {   // petit angle droit au pied de la flèche, entre le rayon et la flèche
          const s = 12, ux = ct, uy = -st, px = -st, py = -ct;   // écran : direction du rayon, direction de la flèche
          const cn = C.corners[k];
          cn.setAttribute('d', `M${(b[0] - s * ux).toFixed(2)},${(b[1] - s * uy).toFixed(2)}L${(b[0] - s * ux + s * px).toFixed(2)},${(b[1] - s * uy + s * py).toFixed(2)}L${(b[0] + s * px).toFixed(2)},${(b[1] + s * py).toFixed(2)}`);
          cn.style.opacity = lit; K.show(cn, lit > 0.001);
        }
      });
    }

    // ---------- 6.8 : rayon marqué de la rotation ----------
    const so = seg(t, T.bloc + 0.4, T.bloc + 1.0, E.linear) * (1 - seg(t, T.rotdroite, T.rotdroite + 0.5, E.linear));
    const sa = t - T.bloc, o0 = toPx[1](0, 0), o1 = toPx[1](1.6 * Math.cos(sa), 1.6 * Math.sin(sa));
    setLine(C.spoke, o0[0], o0[1], o1[0], o1[1], so); K.show(C.spoke, so > 0.001);
    C.hubDot.setAttribute('cx', o0[0]); C.hubDot.setAttribute('cy', o0[1]); C.hubDot.style.opacity = so;

    // ---------- marches ----------
    for (let i = 0; i < 2; i++) {
      const W = C.walk[i], [cH, cV] = i ? [T.rotdroite, T.rothaut] : [T.srcdroite, T.srchaut], cEnd = i ? T.vautzero : T.vautdeux;
      const hOn = seg(t, cH, cH + 0.3, E.linear) * (1 - seg(t, cV, cV + 0.3, E.linear));
      const vOn = seg(t, cV, cV + 0.3, E.linear) * (1 - seg(t, cEnd, cEnd + 0.4, E.linear));
      const a = toPx[i](-1.5, -1), b = toPx[i](2, -1), c = toPx[i](1.5, -1.5), d = toPx[i](1.5, 2);
      setLine(W.hline, a[0], a[1], b[0], b[1], hOn); K.show(W.hline, hOn > 0.001);
      setLine(W.vline, c[0], c[1], d[0], d[1], vOn); K.show(W.vline, vOn > 0.001);
      let pt = null, show = 0, horiz = true;
      if (t >= cH && t < cV + 0.3) { const p = seg(t, cH + 0.3, cH + 0.3 + C.WALKDUR[0], E.inOutSine); pt = [S.lerp(-1.5, 2, p), -1]; show = hOn; }
      if (t >= cV) { const p = seg(t, cV + 0.3, cV + 0.3 + C.WALKDUR[1], E.inOutSine); pt = [1.5, S.lerp(-1.5, 2, p)]; show = vOn; horiz = false; }
      for (const el of [W.dot, W.solid, W.dash]) K.show(el, !!pt && show > 0.001);
      const md = C.medDot[i];
      if (pt && show > 0.001) {
        const v = FF[i](pt[0], pt[1]), q = toPx[i](pt[0], pt[1]);
        W.dot.setAttribute('cx', q[0]); W.dot.setAttribute('cy', q[1]); W.dot.style.opacity = show;
        if (horiz) { setArrow(W.solid, q[0], q[1], v[0] * WS, 0, show); setLine(W.dash, q[0], q[1], q[0], q[1] - v[1] * WS, show); }
        else { setArrow(W.solid, q[0], q[1], 0, -v[1] * WS, show); setLine(W.dash, q[0], q[1], q[0] + v[0] * WS, q[1], show); }
        // point du médaillon : (abscisse de marche, composante)
        const P = C.plots[i][horiz ? 0 : 1], s = horiz ? pt[0] : pt[1], val = horiz ? v[0] : v[1];
        md.setAttribute('cx', P.sx(s)); md.setAttribute('cy', P.sy(val)); md.style.opacity = show; K.show(md, true);
      } else K.show(md, false);
    }

    // ---------- médaillons : fond, étiquettes, triangle de pente ----------
    for (let i = 0; i < 2; i++) {
      const [cH, cV] = i ? [T.rotdroite, T.rothaut] : [T.srcdroite, T.srchaut];
      const mOn = seg(t, cH, cH + 0.4, E.linear) * (1 - seg(t, T.vautzero + 1.6, T.vautzero + 1.9, E.linear));
      C.medBg[i].style.opacity = mOn; K.show(C.medBg[i], mOn > 0.001);
      const m = C.MED[i], bx = C.plotBox(m);
      for (let j = 0; j < 2; j++) {
        const on = j === 0 ? seg(t, cH, cH + 0.4, E.linear) * (1 - seg(t, cV, cV + 0.3, E.linear)) : seg(t, cV, cV + 0.4, E.linear) * (1 - seg(t, T.vautzero + 1.6, T.vautzero + 1.9, E.linear));
        place(C.axLab[i][j].y, m.x + 26, bx.y0 + 4, on);
        place(C.axLab[i][j].x, bx.x1 + 2, m.y + 162, on);
      }
      // triangle : seulement pour la source (pente 1), à la fin de chaque marche
      const tr = C.tri[i], TL = C.triLab[i];
      if (i === 0) {
        const j = t >= cV ? 1 : 0, c0 = j ? cV : cH, P = C.plots[0][j];
        const p = seg(t, c0 + 0.3 + C.WALKDUR[j] * 0.9, c0 + 0.6 + C.WALKDUR[j] * 0.9 + 0.3, E.inOutSine);
        const off = j ? 1 - seg(t, T.vautzero + 1.6, T.vautzero + 1.9, E.linear) : 1 - seg(t, cV, cV + 0.3, E.linear);
        const x0 = P.sx(0), y0 = P.sy(0), x1 = P.sx(1), y1 = P.sy(1);
        tr.legs.setAttribute('d', `M${x0.toFixed(1)},${y0.toFixed(1)}L${x1.toFixed(1)},${y0.toFixed(1)}L${x1.toFixed(1)},${y1.toFixed(1)}`);
        tr.g.style.opacity = p * off; K.show(tr.g, p * off > 0.001);
        place(TL.a, (x0 + x1) / 2, y0 + 20, p * off);
        place(TL.b, x1 + 24, (y0 + y1) / 2, p * off);
      } else { K.show(tr.g, false); place(TL.a, 0, 0, 0); place(TL.b, 0, 0, 0); }
    }

    // ---------- bandes du bas : valeurs allumées en 6.6 ; vol vers la divergence (6.7, 6.12) ----------
    const litOn = t >= T.un + 0.1 && t < T.vautdeux + 1.8 ? 1 : 0;
    for (const k of ['e1', 'v1', 'e2', 'v2']) C.band[0].terms[k].style.color = litOn ? K.c('chalk') : '';
    for (let i = 0; i < 2; i++) {
      const D = C.divl[i], a0 = (i ? T.vautzero : T.vautdeux) + 0.2, p = seg(t, a0, a0 + 1.0, E.inOutCubic);
      if (t >= a0) for (const k of ['v1', 'v2']) {
        const el = D.terms[k], [dx, dy] = C.fly[i][k];
        el.style.clipPath = 'none'; el.style.visibility = 'visible'; el.style.display = 'inline-block'; el.style.opacity = 1;
        el.style.transform = `translate(${(dx * (1 - p)).toFixed(2)}px, ${(dy * (1 - p)).toFixed(2)}px)`;
        if (i === 0) el.style.color = p < 1 ? K.c('chalk') : '';
      }
      K.show(D.root, t >= a0);
    }
  },
});
</script></body></html>
