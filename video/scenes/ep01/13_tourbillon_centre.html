<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>ep01.13 Le centre du tourbillon</title>
<!-- Storyboard ep01, scène ep01.13 (plans 13.1 à 13.8), narration P23.
     Même tourbillon, même panneau et mêmes réglages que la scène 12 : u = (−y, x)/(x² + y²), y vers le haut, 100 px par
     unité, centre à l'écran en (620, 480), flèches compressées (k = 70 px par unité, I_s = 0,8), disque vide de 30 px.
     Les dix petits compteurs de 13.2 sont calculés (Kit.probe, quadrature sur 256 points) ; les valeurs 2π et 0 de 13.5
     à 13.7 sont symboliques, écrites. Aucun cercle ne rétrécit vers le centre : les cercles qui l'entourent apparaissent
     du plus petit au plus grand. -->
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/ep-kit.js"></script>
<style>
  .lab { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 40px; color: var(--muted); z-index: 22;
    text-shadow: 0 0 6px var(--bg), 0 0 3px var(--bg); }
  .lab .katex { font-size: 1em; }
  .val { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 48px; color: var(--fg); z-index: 23;
    text-shadow: 0 0 8px var(--bg), 0 0 4px var(--bg), 0 0 2px var(--bg); }
  .val .katex { font-size: 1em; }
  .legend { position: absolute; left: 1260px; white-space: nowrap; color: var(--muted); z-index: 22; transform: translateY(-50%); }
  .kit-readout { text-shadow: 0 0 6px var(--bg), 0 0 3px var(--bg); }
</style>
</head><body><div id="stage"></div>
<script>
Scene.define({
  duration: 32.83,
  register: 'night',
  // temps d'aperçu = estimation du moteur ; le moteur injecte les vrais
  cues: { 'e1-ou': 0.4, 'e1-nullepartout': 4.08, 'e1-nondef': 7.46, 'e1-entiere': 12.37, 'e1-revele': 16.11, 'e1-memecirc': 21.52,
    'e1-zerocirc': 25.41, 'e1-image': 28.94 },
  setup(ctx) {
    const K = Kit, S = Scene, at = ctx.at, TAU = Math.PI * 2;
    const T = {};
    for (const k of Object.keys(ctx.cues)) if (k.startsWith('e1-')) T[k.slice(3)] = at(k);

    // ---------- géométrie et champ, identiques à la scène 12 ----------
    const CX = 620, CY = 480, SC = 100;
    const toPx = (x, y) => [CX + SC * x, CY - SC * y];
    const toM = (px, py) => [(px - CX) / SC, (CY - py) / SC];
    const U = (x, y) => { const r2 = x * x + y * y; return [-y / r2, x / r2]; };
    const KC = 70, IS = 0.8;
    const chalk = K.c('chalk'), muted = K.c('muted'), fg = K.c('fg');
    const band = (lo, hi) => (px, py) => { const [x, y] = toM(px, py), r = Math.hypot(x, y); if (r < lo || r >= hi) return [0, 0]; const u = U(x, y); return [u[0], -u[1]]; };
    const box = { x: 120, y: 100, w: 1000, h: 760 };

    // état de fin de la scène 12, dès la première image : cadre, flèches, lignes de courant, point du centre, vignettes
    const fsvg = K.svgLayer(ctx, 4); fsvg.setAttribute('data-kit', 'panel-frame');
    K.s('rect', { x: 120, y: 100, width: 1000, height: 760, rx: 10, fill: 'none', stroke: K.c('grid'), 'stroke-width': 3 }, fsvg);
    const arrows = K.arrows(ctx, { F: band(0, 99), box, nx: 10, ny: 8, compress: { k: KC, threshold: IS }, hole: { x: CX, y: CY, r: 30 }, at: -1, width: 3 });
    // 13.3 : les flèches les plus proches du centre, les plus longues de la carte, repassées plus épaisses en --u-hi
    const near = K.arrows(ctx, { F: band(0, 1), box, nx: 10, ny: 8, compress: { k: KC, threshold: IS }, hole: { x: CX, y: CY, r: 30 }, at: 'e1-nondef+0.2', out: 'e1-entiere', width: 5, color: 'u-hi', z: 8 });
    const circ = (r, n = 240) => Array.from({ length: n + 1 }, (_, i) => toPx(r * Math.cos(TAU * i / n), r * Math.sin(TAU * i / n)));
    K.fieldLines(ctx, { lines: [0.8, 1.5, 2.2, 3.0, 3.7].map((r) => circ(r)), color: 'u', width: 2.5, alpha: 0.5, at: -1, dur: 0.01, out: 'e1-nullepartout' });
    const vig = buildVignettes(ctx, { at: -1, out: 'e1-ou+0.2', phase: (t) => t });

    const psvg = K.svgLayer(ctx, 16); psvg.setAttribute('data-kit', 'vortex-centre');
    const holeRim = K.s('circle', { cx: CX, cy: CY, r: 30, fill: 'none', stroke: muted, 'stroke-width': 3 }, psvg);
    const centre = K.s('circle', { cx: CX, cy: CY, r: 7, fill: fg }, psvg);

    // ---------- 13.2 : dix petits cercles (rayon 30 px) loin du centre, compteurs calculés ----------
    const SMALL = [[-3.8, 2.7], [-1.5, 2.9], [1.4, 2.5], [3.7, 2.8], [-3.4, 0.2], [-1.3, -0.5], [2.2, 0.9], [3.9, -1.2], [-2.3, -2.6], [1.0, -2.8]];
    for (const [x, y] of SMALL) if (Math.hypot(x, y) * SC - 30 <= 80) throw new Error('petit cercle trop près du centre');
    const probes = SMALL.map(([x, y], i) => {
      const a = `e1-nullepartout+${(0.15 * i).toFixed(2)}`;
      const P = K.probe(ctx, { toPx, F: U, mode: 'circulation', perArea: true, circle: { c: [x, y], r: 0.3 }, at: a, out: 'e1-entiere', z: 13 });
      const [px, py] = toPx(x, y);
      K.readout(ctx, { value: (t) => P.value(t), digits: 2, pos: () => [px + 38, py - 30], size: 40, at: `${a}+0.3`, out: 'e1-entiere', z: 24 });
      return P;
    });

    // ---------- colonne de droite ----------
    // légende des compteurs : un petit cercle en tirets et le libellé, une fois pour tous les cercles de la carte
    const lsvg = K.svgLayer(ctx, 14); lsvg.setAttribute('data-kit', 'legend');
    const legIcon = K.s('circle', { cx: 1215, cy: 150, r: 22, fill: 'none', stroke: chalk, 'stroke-width': 3, 'stroke-dasharray': '12 9' }, lsvg);
    const leg1 = K.el('div', { class: 'legend mono' }, ctx.stage, K.upper('Circulation ÷ aire')); leg1.style.top = '150px';
    const leg2 = K.el('div', { class: 'legend mono' }, ctx.stage, K.upper('Circulation')); leg2.style.top = '150px';
    const Ew = K.equation(ctx, { x: 1200, y: 230, size: 52, anchor: 'left', tex: '\\cu{\\omega} = 0 \\quad \\text{pour } r > 0', at: 'e1-nullepartout+0.4' });
    const Eu = K.equation(ctx, { x: 1200, y: 350, size: 52, anchor: 'left', tex: '\\lvert\\U\\rvert = \\dfrac{1}{r} \\to \\infty \\ \\text{ quand } r \\to 0', at: 'e1-nondef+0.4' });

    // ---------- 13.5 à 13.7 : cercles qui entourent le centre (du petit au grand), puis un cercle à l'écart ----------
    // rayons et centres en px (décalages comptés y vers le haut) ; valeurs symboliques
    const BIG = [
      { c: [0, 0], r: 120, a: 'e1-revele+0.3', v: '2\\pi', va: 135 },
      { c: [70, 40], r: 220, a: 'e1-memecirc+0.2', v: '2\\pi', va: 40 },
      { c: [0, 0], r: 320, a: 'e1-memecirc+1.6', v: '2\\pi', va: 140 },
      { c: [-380, 250], r: 70, a: 'e1-zerocirc+0.2', v: '0', va: 225 },
    ];
    const csvg = K.svgLayer(ctx, 15); csvg.setAttribute('data-kit', 'circles');
    for (const B of BIG) {
      const enclosed = Math.hypot(B.c[0], B.c[1]) < B.r;
      if ((B.v === '0') === enclosed) throw new Error('cercle et valeur incohérents');
      B.cx = CX + B.c[0]; B.cy = CY - B.c[1]; B.t = at(B.a);
      B.path = K.s('path', { fill: 'none', stroke: chalk, 'stroke-width': 3, 'stroke-dasharray': '12 9' }, csvg);
      const va = B.va * Math.PI / 180, off = B.r + 36;
      B.lab = K.el('div', { class: 'val', html: K.tex(B.v, false) }, ctx.stage);
      B.lab.style.left = (B.cx + off * Math.cos(va)).toFixed(1) + 'px'; B.lab.style.top = (B.cy - off * Math.sin(va)).toFixed(1) + 'px';
    }

    ctx.S = { T, CX, CY, arrows, near, vig, holeRim, centre, probes, legIcon, leg1, leg2, Ew, Eu, BIG };
  },

  render(t, ctx) {
    const K = Kit, S = Scene, seg = S.seg, E = S.ease, TAU = Math.PI * 2;
    const Z = ctx.S, T = Z.T;
    const dim = 1 - 0.6 * seg(t, T.image + 0.2, T.image + 0.9, E.inOutSine);   // 13.8 : tout à 40 %, sauf le centre et les 2π

    // flèches
    Z.arrows.canvas.style.opacity = dim.toFixed(3);
    Z.near.canvas.style.opacity = (0.55 + 0.45 * Math.sin(Math.PI * ((Math.max(0, t - T.nondef - 0.2) / 0.9) % 1))).toFixed(3);

    // point du centre : pulsation (13.1), puis --u-hi et pulsation lente (13.4 à la fin)
    const p1 = Math.sin(Math.PI * seg(t, T.ou + 0.3, T.ou + 1.1, E.linear)) + Math.sin(Math.PI * seg(t, T.ou + 1.3, T.ou + 2.1, E.linear));
    const hi = seg(t, T.entiere, T.entiere + 0.5, E.linear);
    const slow = t >= T.entiere ? 0.5 - 0.5 * Math.cos(TAU * (t - T.entiere) / 2.2) : 0;
    Z.centre.setAttribute('r', (7 + 5 * p1 + 3 * hi + 4 * slow).toFixed(2));
    Z.centre.setAttribute('fill', hi > 0.5 ? K.c('u-hi') : K.c('fg'));

    // 13.3 : bord du disque vide
    Z.holeRim.style.opacity = seg(t, T.nondef, T.nondef + 0.5, E.linear) * dim;

    // légende : « CIRCULATION ÷ AIRE » avec les petits cercles, « CIRCULATION » avec les cercles qui entourent le centre
    const l1 = seg(t, T.nullepartout, T.nullepartout + 0.4, E.linear) * (1 - seg(t, T.entiere, T.entiere + 0.3, E.linear));
    const l2 = seg(t, T.revele + 0.6, T.revele + 1.0, E.linear) * dim;
    Z.leg1.style.opacity = l1; K.show(Z.leg1, l1 > 0.01);
    Z.leg2.style.opacity = l2; K.show(Z.leg2, l2 > 0.01);
    const li = Math.max(l1, l2); Z.legIcon.style.opacity = li; K.show(Z.legIcon, li > 0.01);
    if (t >= T.image) { Z.Ew.root.style.opacity = (parseFloat(Z.Ew.root.style.opacity || 1) * dim).toFixed(3); Z.Eu.root.style.opacity = (parseFloat(Z.Eu.root.style.opacity || 1) * dim).toFixed(3); }

    // cercles tracés dans le sens trigonométrique, en partant du haut ; valeurs écrites ensuite
    for (const B of Z.BIG) {
      const p = seg(t, B.t, B.t + 0.9, E.inOutSine);
      if (p <= 0) { B.path.setAttribute('d', ''); K.show(B.lab, false); continue; }
      let d = ''; const n = Math.max(8, Math.ceil(160 * p));
      for (let i = 0; i <= n; i++) { const a = Math.PI / 2 + TAU * p * i / n; d += (i ? 'L' : 'M') + (B.cx + B.r * Math.cos(a)).toFixed(2) + ',' + (B.cy - B.r * Math.sin(a)).toFixed(2); }
      B.path.setAttribute('d', d + (p >= 1 ? 'Z' : ''));
      B.path.style.opacity = dim;
      const lo = seg(t, B.t + 0.8, B.t + 1.1, E.linear);
      K.show(B.lab, lo > 0); B.lab.style.opacity = (lo * (B.v === '0' ? dim : 1)).toFixed(3);
    }

    Z.vig.render(t);
  },
});

// Vignettes de 12.15, reprises à l'identique de la scène 12 (même fonction, même géométrie) pour le raccord.
function buildVignettes(ctx, o) {
  const K = Kit, S = Scene, TAU = Math.PI * 2;
  const t0 = ctx.at(o.at), t1 = o.out !== undefined ? ctx.at(o.out) : Infinity;
  const svg = K.svgLayer(ctx, 13); svg.setAttribute('data-kit', 'vignettes');
  const ucol = K.c('u'), muted = K.c('muted'), fg = K.c('fg');
  const VW = 270, VH = 230, VY = 290, B1 = { x: 1190, y: VY }, B2 = { x: 1510, y: VY };
  for (const b of [B1, B2]) K.s('rect', { x: b.x, y: b.y, width: VW, height: VH, rx: 8, fill: K.c('panel'), stroke: muted, 'stroke-width': 2 }, svg);
  const sc1 = 46, c1 = [B1.x + VW / 2, B1.y + VH / 2];
  for (const y of [-2, -1, 0, 1, 2]) {
    const py = c1[1] - sc1 * y;
    K.s('line', { x1: B1.x + 14, y1: py, x2: B1.x + VW - 14, y2: py, stroke: y === 0 ? muted : ucol, 'stroke-width': y === 0 ? 2 : 3, opacity: y === 0 ? 1 : 0.85 }, svg);
    if (y !== 0) for (const xx of [0.22, 0.78]) {
      const px = B1.x + VW * xx, s = Math.sign(y), h = 6 + 2 * Math.abs(y);
      K.s('path', { d: `M${px - s * h},${py - h}L${px + s * h},${py}L${px - s * h},${py + h}Z`, fill: ucol }, svg);
    }
  }
  // phase(t) = t : la scène 12 finit à la phase 0, celle-ci y reprend (raccord sans saut)
  K.paddleWheel(ctx, { toPx: (x, y) => [c1[0] + sc1 * x, c1[1] - sc1 * y], pos: [0, 0], angle: (t) => Math.PI / 2 - 0.5 * o.phase(t), r: 30, at: o.at, out: o.out, z: 14 });
  const c2 = [B2.x + VW / 2, B2.y + VH / 2];
  for (const r of [36, 70, 100]) K.s('circle', { cx: c2[0], cy: c2[1], r, fill: 'none', stroke: ucol, 'stroke-width': 3, opacity: 0.85 }, svg);
  K.s('circle', { cx: c2[0], cy: c2[1], r: 6, fill: fg }, svg);
  K.paddleWheel(ctx, { toPx: (x, y) => [c2[0] + x, c2[1] - y], pos: (t) => { const a = TAU * o.phase(t) / 4 - Math.PI / 2; return [70 * Math.cos(a), 70 * Math.sin(a)]; },
    angle: () => Math.PI / 2, r: 22, at: o.at, out: o.out, z: 14 });
  const lab1 = K.el('div', { class: 'lab', html: K.tex('\\cu{\\omega} = -1', false) }, ctx.stage);
  const lab2 = K.el('div', { class: 'lab', html: K.tex('\\cu{\\omega} = 0 \\text{ pour } r > 0', false) }, ctx.stage);
  for (const [l, b] of [[lab1, B1], [lab2, B2]]) { l.style.left = (b.x + VW / 2) + 'px'; l.style.top = (b.y + VH + 40) + 'px'; l.style.fontSize = '34px'; l.style.color = K.c('fg'); }
  return {
    render(t) {
      const e = K.env(t, t0, t1, 0.4, 0.3);
      for (const el of [svg, lab1, lab2]) { K.show(el, e.on); el.style.opacity = e.o; }
    },
  };
}
</script></body></html>
