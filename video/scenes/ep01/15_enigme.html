<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>ep01.15 L'énigme des cellules</title>
<!-- Storyboard ep01, scène ep01.15 (plans 15.1 à 15.7), narration P25.
     Même carte, même panneau qu'à la fin de la scène 14 (x 120 à 900, y 80 à 860, 780/2π ≈ 124 px par unité,
     y vers le haut) ; calque de formule à 60 % toute la scène. Les compteurs « FLUX ÷ AIRE » sont calculés par
     quadrature (Kit.probe, 256 points) et affichent 0, jamais « −0 » (Kit.fmtFr). Aucun ψ. -->
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/ep-kit.js"></script>
<style>
  .kit-readout.backed { background: var(--panel-a); padding: 4px 12px 2px; border-radius: 4px; }
  .kit-readout.small .ro-value { font-size: 36px; }
  .qmark { position: absolute; font-family: "Inter Display"; font-weight: 800; color: var(--chalk); line-height: 1; z-index: 47;
    transform-origin: 0 50%; white-space: nowrap; }
</style>
</head><body><div id="stage"></div>
<script>
Scene.define({
  duration: 29.4,
  register: 'night',
  // temps d'aperçu (estimation à 146 mots par minute) ; le moteur injecte les vrais
  cues: { 'e1-autreq': 0.4, 'e1-promene': 6.04, 'e1-zero': 10.04, 'e1-nullepart': 14.04, 'e1-hasard': 18.86, 'e1-pourquoi': 21.22, 'e1-ouverte': 24.8 },
  setup(ctx) {
    const K = Kit, S = Scene, at = ctx.at, seg = S.seg, E = S.ease, PI = Math.PI;
    const T = {};
    for (const k of Object.keys(ctx.cues)) if (k.startsWith('e1-')) T[k.slice(3)] = at(k);

    // ---------- géométrie et champ (section 0) ----------
    const X0 = 120, Y1 = 860, SIDE = 780, SC = SIDE / (2 * PI);
    const toPx = (x, y) => [X0 + SC * x, Y1 - SC * y];
    const toMath = (px, py) => [(px - X0) / SC, (Y1 - py) / SC];
    const U = (x, y) => [Math.sin(x) * Math.cos(y), -Math.cos(x) * Math.sin(y)];
    const Fpx = (px, py) => { const [x, y] = toMath(px, py), v = U(x, y); return [v[0], -v[1]]; };

    const svgP = K.svgLayer(ctx, 12); svgP.setAttribute('data-kit', 'panel');
    K.s('rect', { x: X0, y: Y1 - SIDE, width: SIDE, height: SIDE, fill: 'none', stroke: K.c('matter'), 'stroke-width': 2 }, svgP);
    const step = SC * PI / 6;
    K.arrows(ctx, { F: Fpx, box: { x: X0 - step / 2, y: Y1 - SIDE - step / 2, w: 13 * step, h: 13 * step }, nx: 13, ny: 13, scale: 0.8, color: 'u', width: 3, at: -1 });
    K.tracers(ctx, { F: (px, py) => { const v = Fpx(px, py); return [v[0] * SC * 0.8, v[1] * SC * 0.8]; },
      n: 300, box: { x: X0, y: Y1 - SIDE, w: SIDE, h: SIDE }, color: 'u', alpha: 0.4, trail: 12, seed: 'ep01.15', at: -1, warmup: 4 });
    // calque de formule, à 60 % jusqu'à la fin de la scène (opacité réglée dans render)
    const FL = K.formulaLayer(ctx, { label: 'Champ', items: [{ tex: '\\U = (\\sin x\\cos y,\\ -\\cos x\\sin y)', at: -1 }] });

    // ---------- 15.1 : pictogramme « sort » à droite de la carte ----------
    const chalk = K.c('chalk'), ucol = K.c('u');
    const svgI = K.svgLayer(ctx, 14); svgI.setAttribute('data-kit', 'picto-sort');
    const PIC = [1500, 300];
    const picG = K.s('g', { transform: `translate(${PIC[0]},${PIC[1]})` }, svgI);
    K.s('circle', { r: 90, fill: 'none', stroke: chalk, 'stroke-width': 3, 'stroke-dasharray': '12 9' }, picG);
    const picArrows = [0, 1, 2, 3].map(() => K.s('path', { fill: ucol, stroke: ucol, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, picG));

    // ---------- 15.1 à 15.5 : le grand cercle qui se promène ----------
    // trajectoire fermée autour du centre de la carte (rayon 1,55), parcours du sens trigonométrique, départ et arrivée en
    // P0 = (π + 1,10 ; π − 1,10) ; rayon de 60 à 200 px, 90 px au départ et à l'arrivée ; marge au bord ≥ 2,8 px partout
    const sOf = (t) => seg(t, T.promene, T.hasard + 0.4, E.outCubic);
    const cOf = (t) => { const p = -PI / 4 + 2 * PI * sOf(t); return [PI + 1.55 * Math.cos(p), PI + 1.55 * Math.sin(p)]; };
    const rOf = (t) => (130 + 70 * Math.sin(4 * PI * sOf(t) - 0.608)) / SC;
    const big = K.probe(ctx, { toPx, F: U, mode: 'flux', perArea: true, n: 256, circle: { c: cOf, r: rOf }, draw: false, at: 'e1-autreq' });
    const svgC = K.svgLayer(ctx, 13); svgC.setAttribute('data-kit', 'probe-path');
    const dashed = (p) => K.s('path', { fill: 'none', stroke: chalk, 'stroke-width': 3, 'stroke-dasharray': '12 9' }, p);
    const bigPath = dashed(svgC);
    // un cercle tracé dans le sens trigonométrique jusqu'à la fraction prog
    const arcD = (cx, cy, r, prog) => { const N = Math.max(8, Math.ceil(96 * prog)); let d = '';
      for (let i = 0; i <= N; i++) { const a = 2 * PI * prog * i / N; d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(2) + ',' + (cy - r * Math.sin(a)).toFixed(2); } return d; };
    const roPos = (t) => { const c = cOf(t), r = rOf(t), [px, py] = toPx(c[0] + r, c[1]); return [px + 22, py - 52]; };
    const RO = K.readout(ctx, { label: 'Flux ÷ aire', value: (t) => big.value(t), digits: 2, at: 'e1-autreq+0.5', pos: roPos });
    RO.root.classList.add('backed'); RO.el.style.transformOrigin = '0 50%';

    // ---------- 15.4 : douze petits cercles de 40 px, sur les droites de séparation et au milieu des cellules ----------
    const smallC = [[PI, 0.6], [PI, 4.0], [PI, 5.6], [0.9, PI], [2.3, PI], [4.0, PI], [5.5, PI],
      [PI / 2, PI / 2], [PI / 2, 3 * PI / 2], [3 * PI / 2, 3 * PI / 2], [5.6, 0.5], [1.2, 5.45]];
    const r40 = 40 / SC;
    const wave = (c) => T.nullepart + 0.2 + 0.8 * (c[0] / (2 * PI));            // vague de gauche à droite, 1 s
    const smalls = smallC.map((c, i) => {
      const a = `e1-nullepart+${(wave(c) - T.nullepart).toFixed(3)}`;
      const pr = K.probe(ctx, { toPx, F: U, mode: 'flux', perArea: true, n: 256, circle: { c, r: r40 }, draw: false, at: a, out: 'e1-hasard' });
      const path = dashed(svgC);
      const [px, py] = toPx(c[0], c[1]);
      const ro = K.readout(ctx, { value: (t) => pr.value(t), digits: 2, at: a, out: 'e1-hasard', x: px + 50, y: py - 26 });
      ro.root.classList.add('backed', 'small');
      return { c, px, py, path, t0: wave(c) };
    });

    // ---------- 15.6, 15.7 : le point d'interrogation ----------
    const Q = K.el('div', { class: 'qmark', 'data-kit': 'question-mark' }, ctx.stage, '?');

    ctx.S = { picG, T, PI, toPx, picArrows, cOf, rOf, bigPath, arcD, roPos, RO, smalls, Q, FL };
  },

  render(t, ctx) {
    const K = Kit, S = Scene, seg = S.seg, E = S.ease;
    const { picG, T, PI, toPx, picArrows, cOf, rOf, bigPath, arcD, roPos, RO, smalls, Q, FL } = ctx.S;
    if (FL) FL.root.style.opacity = (+FL.root.style.opacity * 0.6).toFixed(3);

    // 15.1 : les quatre flèches du pictogramme poussent vers l'extérieur
    picG.style.opacity = seg(t, T.autreq, T.autreq + 0.3, E.linear).toFixed(3);   // il se pose sur [e1-autreq]
    const g = seg(t, T.autreq + 0.1, T.autreq + 0.7, E.outCubic);
    picArrows.forEach((el, i) => {
      const a = i * PI / 2, r0 = 30, r1 = 30 + 105 * g, c = Math.cos(a), s = -Math.sin(a);
      el.setAttribute('d', g > 0.05 ? K.arrowPath(r0 * c, r0 * s, r1 * c, r1 * s, 18) : '');
    });

    // le grand cercle : tracé en 15.1, puis promené ; il reste jusqu'à la fin
    const tr = seg(t, T.autreq + 0.3, T.autreq + 1.3, E.inOutSine);
    const c = cOf(t), [px, py] = toPx(c[0], c[1]), rp = rOf(t) * (toPx(1, 0)[0] - toPx(0, 0)[0]);
    bigPath.setAttribute('d', tr > 0 ? arcD(px, py, rp, tr) : '');
    // pulsations du compteur : à mi-plan de 15.3 et en 15.6
    const mid = (T.zero + T.nullepart) / 2;
    const pulse = Math.sin(PI * seg(t, mid - 0.4, mid + 0.4, E.linear)) + Math.sin(PI * seg(t, T.pourquoi, T.pourquoi + 0.8, E.linear));
    RO.el.style.opacity = (1 - 0.55 * pulse).toFixed(3);   // pulsation par l'opacité : une échelle ferait chevaucher le libellé

    // 15.4 : les petits cercles apparaissent en vague, s'effacent en 15.5 (0,4 s)
    const off = 1 - seg(t, T.hasard, T.hasard + 0.4, E.linear);
    for (const sm of smalls) {
      const p = seg(t, sm.t0, sm.t0 + 0.35, E.inOutSine) * off;
      sm.path.setAttribute('d', p > 0 ? arcD(sm.px, sm.py, 40, 1) : '');
      sm.path.style.opacity = p;
    }

    // 15.6 : « ? » de 120 px à côté du compteur ; 15.7 : il se réduit et se loge en haut à gauche de la colonne libre
    const [rx, ry] = roPos(t);
    const qOn = seg(t, T.pourquoi + 0.2, T.pourquoi + 0.6, E.linear);
    const m = seg(t, T.ouverte + 0.2, T.ouverte + 1.0, E.inOutCubic);
    const qx0 = rx + RO.root.offsetWidth + 30, qy0 = ry + 50, qx1 = 990, qy1 = 110;
    Q.style.left = S.lerp(qx0, qx1, m).toFixed(1) + 'px'; Q.style.top = (S.lerp(qy0, qy1, m) - 60).toFixed(1) + 'px';
    Q.style.fontSize = '120px';
    Q.style.transform = `scale(${S.lerp(1, 0.45, m).toFixed(4)})`;
    Q.style.opacity = qOn; K.show(Q, qOn > 0);
  },
});
</script></body></html>
