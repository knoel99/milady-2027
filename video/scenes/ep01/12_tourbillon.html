<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>ep01.12 Le tourbillon ponctuel</title>
<!-- Storyboard ep01, scène ep01.12 (plans 12.1 à 12.15), narration P21 et P22.
     Tourbillon ponctuel u = (−y, x)/(x² + y²), sens trigonométrique ; coordonnées mathématiques y vers le haut,
     100 px par unité, centre à l'écran en (620, 480) ; panneau x 120 à 1120, y 100 à 860 ; colonne x 1180 à 1780.
     Flèches : longueur compressée L(I) = k·I sous I_s = 0,8, k·I_s·(2 − I_s/I) au-dessus (k = 70 px par unité),
     disque vide de 30 px autour du centre. Roue de rayon a = 0,5 sur le cercle R = 2,2, jamais sur le centre. -->
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/ep-kit.js"></script>
<style>
  .lab { position: absolute; transform: translate(-50%, -50%); white-space: nowrap; font-size: 40px; color: var(--muted); z-index: 22;
    text-shadow: 0 0 6px var(--bg), 0 0 3px var(--bg); }
  .lab .katex { font-size: 1em; }
</style>
</head><body><div id="stage"></div>
<script>
Scene.define({
  duration: 61.7,
  register: 'night',
  // temps d'aperçu = estimation du moteur ; le moteur injecte les vrais
  cues: { 'e1-tourbillon': 0.4, 'e1-autour': 3.42, 'e1-diminue': 6.88, 'e1-double': 10.77, 'e1-loincentre': 14.22, 'e1-cabine': 18.25,
    'e1-surplace': 23.5, 'e1-bords': 26.78, 'e1-proche': 29.34, 'e1-unsens': 34.31, 'e1-courbure': 38.3, 'e1-virage': 40.33,
    'e1-annulent': 44.25, 'e1-exo2': 49.97, 'e1-lecon2': 55.32 },
  setup(ctx) {
    const K = Kit, S = Scene, at = ctx.at, seg = S.seg, E = S.ease, TAU = Math.PI * 2;
    const T = {};
    for (const k of Object.keys(ctx.cues)) if (k.startsWith('e1-')) T[k.slice(3)] = at(k);

    // ---------- géométrie et champ (section 0 : y vers le haut, toPx renverse l'axe vertical) ----------
    const CX = 620, CY = 480, SC = 100;
    const toPx = (x, y) => [CX + SC * x, CY - SC * y];
    const toM = (px, py) => [(px - CX) / SC, (CY - py) / SC];
    const U = (x, y) => { const r2 = x * x + y * y; return [-y / r2, x / r2]; };
    const KC = 70, IS = 0.8, len = (I) => K.compressLength(I, KC, IS);   // section 0, compression des longueurs
    const chalk = K.c('chalk'), muted = K.c('muted'), ucol = K.c('u'), fg = K.c('fg');

    // panneau : un calque découpé au cadre du panneau, et dedans un calque zoomable (12.8, zoom de 1,8× sur la roue)
    const clip = K.el('div', { class: 'kit-layer', 'data-layer': 'panel-clip' }, ctx.stage);
    clip.style.zIndex = 7; clip.style.clipPath = 'inset(100px 800px 220px 120px)';
    const zoom = K.el('div', { class: 'kit-layer', 'data-layer': 'panel-zoom' }, clip);
    // cadre du panneau, présent dès la première image (la scène est collée à la précédente)
    const fsvg = K.svgLayer(ctx, 4); fsvg.setAttribute('data-kit', 'panel-frame');
    K.s('rect', { x: 120, y: 100, width: 1000, height: 760, rx: 10, fill: 'none', stroke: K.c('grid'), 'stroke-width': 3 }, fsvg);
    const R = 2.2, A = 0.5, WX = toPx(R, 0);          // la roue s'arrête à 3 h : centre du zoom
    zoom.style.transformOrigin = `${WX[0]}px ${WX[1]}px`;

    // flèches du tourbillon (Kit.arrows, compression, trou de 30 px), en quatre anneaux qui entrent de l'extérieur vers l'intérieur
    const band = (lo, hi) => (px, py) => { const [x, y] = toM(px, py), r = Math.hypot(x, y); if (r < lo || r >= hi) return [0, 0]; const u = U(x, y); return [u[0], -u[1]]; };
    const box = { x: 120, y: 100, w: 1000, h: 760 };
    const bands = [[3, 99], [2, 3], [1, 2], [0, 1]].map(([lo, hi], i) => K.arrows(ctx, { F: band(lo, hi), box, nx: 10, ny: 8, compress: { k: KC, threshold: IS },
      hole: { x: CX, y: CY, r: 30 }, at: `e1-autour+${(0.3 * i).toFixed(1)}`, parent: zoom, width: 3 }));

    // cinq lignes de courant circulaires (rayon 2,2 : la trajectoire de la roue)
    const radii = [0.8, 1.5, 2.2, 3.0, 3.7];
    const circ = (r, n = 240) => Array.from({ length: n + 1 }, (_, i) => toPx(r * Math.cos(TAU * i / n), r * Math.sin(TAU * i / n)));
    const lines = K.fieldLines(ctx, { lines: radii.map((r) => circ(r)), color: 'u', width: 2.5, alpha: 0.5, at: 'e1-autour+0.5', dur: 1.2, parent: zoom });

    // SVG du panneau (zoomé) : point du centre, arc de trajectoire, flèches des bords, flèches courbes
    const psvg = K.svgLayer(ctx, 16, zoom); psvg.setAttribute('data-kit', 'vortex-panel');
    const mk = (tag, a, p = psvg) => K.s(tag, a, p);
    const centre = mk('circle', { cx: CX, cy: CY, r: 7, fill: fg });
    const traj = mk('path', { fill: 'none', stroke: chalk, 'stroke-width': 4, 'stroke-linecap': 'round' });
    const edgeIn = mk('path', { fill: ucol, stroke: ucol, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const edgeOut = mk('path', { fill: ucol, stroke: ucol, 'stroke-width': 4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const curvUp = mk('path', { fill: 'none', stroke: ucol, 'stroke-width': 4.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const curvDn = mk('path', { fill: 'none', stroke: ucol, 'stroke-width': 4.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    // arc de cercle (angles mathématiques, sens de a0 vers a1) avec une pointe au bout, en px d'écran
    const arcArrow = (cx, cy, r, a0, a1, head = 13) => {
      let d = ''; const n = 40;
      for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; d += (i ? 'L' : 'M') + (cx + r * Math.cos(a)).toFixed(2) + ',' + (cy - r * Math.sin(a)).toFixed(2); }
      const ex = cx + r * Math.cos(a1), ey = cy - r * Math.sin(a1), s = Math.sign(a1 - a0);
      const tx = -Math.sin(a1) * s, ty = -Math.cos(a1) * s;          // tangente à l'écran, sens du parcours
      const ang = Math.atan2(ty, tx);
      d += `M${(ex - head * Math.cos(ang - 0.5)).toFixed(2)},${(ey - head * Math.sin(ang - 0.5)).toFixed(2)}L${ex.toFixed(2)},${ey.toFixed(2)}L${(ex - head * Math.cos(ang + 0.5)).toFixed(2)},${(ey - head * Math.sin(ang + 0.5)).toFixed(2)}`;
      return d;
    };

    // ---------- 12.5 à 12.8 : orbite de la roue, en forme fermée ----------
    // vitesse constante, un tour en 9 s, sens trigonométrique ; ralenti de 1,2 s jusqu'à l'arrêt à 3 h, 1,2 s après [e1-bords]
    const W0 = TAU / 9, tStart = T.loincentre + 0.6, ts = T.bords + 1.2, D = 1.2, tdec = ts - D;
    const travel = (t) => {
      if (t <= tStart) return 0;
      if (t <= tdec) return W0 * (t - tStart);
      const s = Math.min(t, ts) - tdec;
      return W0 * (tdec - tStart) + W0 * (s - s * s / (2 * D));
    };
    const total = travel(1e9), th0 = -total;           // θ(ts) = 0 : position 3 h
    const theta = (t) => th0 + travel(t);
    const place = (t) => seg(t, T.loincentre, T.loincentre + 0.6, E.outCubic);
    const wheelPos = (t) => { const th = theta(t), p = place(t); return [R * Math.cos(th), R * Math.sin(th) + 0.5 * (1 - p)]; };
    const ALPHA = () => Math.PI / 2;                   // l'aube marquée reste pointée vers le haut : la roue ne pivote pas
    // fantômes (12.6) : un à chaque passage d'un multiple de 45° entre [e1-cabine] et [e1-bords]
    const ghostDiv = K.el('div', { class: 'kit-layer', 'data-layer': 'ghosts' }, zoom); ghostDiv.style.opacity = 0.25; ghostDiv.style.zIndex = 14;
    const ghostTimes = [];
    for (let k = Math.ceil((theta(T.cabine) - 1e-9) / (Math.PI / 4)); ; k++) {
      const tk = tStart + (k * Math.PI / 4 - th0) / W0;
      if (tk >= Math.min(T.bords, tdec) - 0.3) break;
      if (tk >= T.cabine) ghostTimes.push(tk);
    }
    for (const tk of ghostTimes) {
      const th = theta(tk);
      K.paddleWheel(ctx, { toPx, pos: [R * Math.cos(th), R * Math.sin(th)], angle: ALPHA, r: 50, at: tk, out: 'e1-bords', parent: ghostDiv });
    }
    const wheel = K.paddleWheel(ctx, { toPx, pos: wheelPos, angle: ALPHA, r: 50, at: 'e1-loincentre', out: 'e1-lecon2', parent: zoom, z: 15 });

    // ---------- étiquettes et schémas hors zoom (12.3 à 12.5) ----------
    const ssvg = K.svgLayer(ctx, 12); ssvg.setAttribute('data-kit', 'vortex-notes');
    const ray = K.s('path', { fill: 'none', stroke: muted, 'stroke-width': 3, 'stroke-linecap': 'round' }, ssvg);
    const rayDot = K.s('circle', { r: 6, fill: muted }, ssvg);
    const ticks = [1.5, 3].map(() => K.s('path', { fill: 'none', stroke: muted, 'stroke-width': 3, 'stroke-linecap': 'round' }, ssvg));
    const two = [1.5, 3].map(() => K.s('path', { fill: ucol, stroke: ucol, 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, ssvg));
    const refV = K.s('path', { d: 'M1100,140L1100,250', fill: 'none', stroke: muted, 'stroke-width': 4, 'stroke-linecap': 'round' }, ssvg);
    const lab = (tex) => { const d = K.el('div', { class: 'lab', html: K.tex(tex, false) }, ctx.stage); return d; };
    const labR = lab('r'), lab2R = lab('2r');
    const putLab = (el, x, y, o) => { el.style.left = x.toFixed(1) + 'px'; el.style.top = y.toFixed(1) + 'px'; el.style.opacity = o; K.show(el, o > 0.01); };

    // ---------- colonne de droite ----------
    const COLX = 1480;
    K.equation(ctx, { x: COLX, y: 150, size: 64, anchor: 'center', tex: '\\lvert\\U\\rvert = \\dfrac{1}{r}', at: 'e1-diminue+0.3', out: 'e1-bords' });
    // cadran (12.7) : trait de référence horizontal fixe --muted, arc α --muted, aiguille --chalk qui suit l'aube marquée
    const DX = 1480, DY = 560, DR = 85;
    const dsvg = K.svgLayer(ctx, 14); dsvg.setAttribute('data-kit', 'dial');
    const dial = K.s('g', {}, dsvg);
    K.s('circle', { cx: DX, cy: DY, r: DR, fill: 'none', stroke: muted, 'stroke-width': 3 }, dial);
    for (let i = 0; i < 12; i++) { const a = TAU * i / 12; K.s('line', { x1: DX + (DR - 12) * Math.cos(a), y1: DY - (DR - 12) * Math.sin(a), x2: DX + DR * Math.cos(a), y2: DY - DR * Math.sin(a), stroke: muted, 'stroke-width': 3, 'stroke-linecap': 'round' }, dial); }
    K.s('line', { x1: DX, y1: DY, x2: DX + DR + 18, y2: DY, stroke: muted, 'stroke-width': 3, 'stroke-dasharray': '7 6' }, dial);
    const dArc = K.s('path', { fill: 'none', stroke: muted, 'stroke-width': 3 }, dial);
    const needle = K.s('line', { x1: DX, y1: DY, stroke: chalk, 'stroke-width': 6, 'stroke-linecap': 'round' }, dial);
    const needleDot = K.s('circle', { r: 6, fill: chalk }, dial);
    K.s('circle', { cx: DX, cy: DY, r: 7, fill: chalk }, dial);
    const labA = lab('\\alpha'); labA.style.zIndex = 15;

    // rappel |u| = 1/r au calque de formule (12.9)
    K.formulaLayer(ctx, { items: [{ tex: '\\lvert\\U\\rvert = \\dfrac{1}{r}', at: 'e1-proche+0.4', out: 'e1-lecon2' }], label: false, out: 'e1-lecon2' });

    // 12.14 : chip, crayon, question à calculer, Γ = 2π
    const chip = K.chip(ctx, { text: 'Module 1 · exercice 2 (c)', kind: 'plain', x: 1190, y: 118, at: 'e1-exo2+0.2', out: 'e1-lecon2' });
    const cb = K.box(chip.root, ctx);
    const pen = K.s('g', {}, dsvg);
    const PX = cb.x + cb.w + 34, PY = cb.y + cb.h / 2;
    // petit crayon --chalk, pointe en bas à gauche
    K.s('path', { d: 'M0,0 L10,-4 L40,-34 L34,-40 L4,-10 Z', fill: 'none', stroke: chalk, 'stroke-width': 3, 'stroke-linejoin': 'round' }, pen);
    K.s('path', { d: 'M0,0 L10,-4 L4,-10 Z', fill: chalk }, pen);
    K.s('path', { d: 'M33,-27 L27,-33', stroke: chalk, 'stroke-width': 3 }, pen);
    const penLine = K.s('path', { fill: 'none', stroke: chalk, 'stroke-width': 3.5, 'stroke-linecap': 'round' }, dsvg);
    const Q1 = K.equation(ctx, { x: 1190, y: 186, size: 48, anchor: 'left', tex: '\\U = \\dfrac{(-y,\\ x)}{x^2 + y^2}', at: 'e1-exo2+0.8', out: 'e1-lecon2' });
    const q1 = K.box(Q1.root, ctx);
    K.equation(ctx, { x: q1.x + q1.w + 36, y: q1.y + q1.h / 2 - 30, size: 40, anchor: 'left', tex: '\\cg{\\Gamma = 2\\pi}', at: 'e1-exo2+2.4', out: 'e1-lecon2' });
    const Q2 = K.equation(ctx, { x: 1190, y: q1.y + q1.h + 20, size: 46, anchor: 'left',
      tex: '\\cu{\\omega} = \\partial_x \\cu{u_y} - \\partial_y \\cu{u_x} = \\;?', at: 'e1-exo2+1.5', out: 'e1-lecon2' });
    const q2 = K.box(Q2.root, ctx);
    K.equation(ctx, { x: 1190, y: q2.y + q2.h + 6, size: 40, anchor: 'left', tex: '\\text{pour } r > 0', at: 'e1-exo2+1.9', out: 'e1-lecon2' });

    // ---------- 12.15 : vignettes côte à côte (cisaillement, tourbillon), mouvement en boucle courte ----------
    const vig = buildVignettes(ctx, { at: 'e1-lecon2+0.4', phase: (t) => t - ctx.duration });

    ctx.S = { T, CX, CY, SC, R, A, toPx, U, len, zoom, bands, lines, centre, traj, edgeIn, edgeOut, curvUp, curvDn, arcArrow, theta, wheel, ray, rayDot, ticks, two, refV,
      labR, lab2R, putLab, dsvg, dial, dArc, needle, needleDot, labA, DX, DY, DR, ALPHA, ts, pen, penLine, PX, PY, WX, vig };
  },

  render(t, ctx) {
    const K = Kit, S = Scene, seg = S.seg, E = S.ease;
    const Z = ctx.S, T = Z.T, { CX, CY, SC, toPx } = Z;

    // ---------- zoom (12.8) et retour au plan large (12.15) ----------
    const zIn = seg(t, Z.ts, Z.ts + 0.8, E.inOutCubic), zOut = seg(t, T.lecon2, T.lecon2 + 0.8, E.inOutCubic);
    const zf = 1 + 0.8 * zIn * (1 - zOut);
    Z.zoom.style.transform = zf > 1.0001 ? `scale(${zf.toFixed(4)})` : '';

    // flèches baissées pendant les comparaisons (12.4) et pendant le zoom (12.9 à 12.14)
    const dimA = 1 - 0.6 * seg(t, T.double, T.double + 0.4, E.linear) * (1 - seg(t, T.loincentre, T.loincentre + 0.5, E.linear))
      - 0.6 * seg(t, Z.ts, Z.ts + 0.6, E.linear) * (1 - zOut);
    for (const b of Z.bands) b.canvas.style.opacity = dimA.toFixed(3);
    Z.lines.canvas.style.opacity = (1 - 0.4 * seg(t, Z.ts, Z.ts + 0.6, E.linear) * (1 - zOut)).toFixed(3);

    // ---------- 12.3 et 12.4 : r, puis deux flèches sur un rayon, à r et à 2r ----------
    const nOut = 1 - seg(t, T.loincentre, T.loincentre + 0.4, E.linear);
    const pr = seg(t, T.diminue + 0.4, T.diminue + 1.0, E.inOutSine);           // segment du centre à r = 1,5
    const pe = seg(t, T.double, T.double + 0.6, E.inOutSine);                    // le rayon s'allonge jusqu'à 3,3
    const rEnd = 1.5 * pr + 1.8 * pe, c0 = toPx(0, 0), c1 = toPx(0, rEnd);
    Z.ray.setAttribute('d', `M${c0[0]},${c0[1] - 34}L${c1[0]},${Math.min(c0[1] - 34, c1[1])}`);
    Z.ray.style.opacity = pr > 0 ? nOut : 0;
    const dp = toPx(0, 1.5);
    Z.rayDot.setAttribute('cx', dp[0]); Z.rayDot.setAttribute('cy', dp[1]); Z.rayDot.style.opacity = (pr >= 1 ? 1 : 0) * nOut * (1 - pe);
    Z.putLab(Z.labR, S.lerp(c0[0] + 34, dp[0] + 34, pe), S.lerp(CY - 0.75 * SC, dp[1], pe), seg(t, T.diminue + 0.9, T.diminue + 1.2, E.linear) * nOut);
    [1.5, 3].forEach((r, i) => {
      const p = toPx(0, r), on = seg(t, T.double + 0.4 + 0.3 * i, T.double + 0.7 + 0.3 * i, E.linear) * nOut;
      Z.ticks[i].setAttribute('d', `M${p[0] - 12},${p[1]}L${p[0] + 12},${p[1]}`); Z.ticks[i].style.opacity = i === 0 ? (pe > 0 ? nOut : 0) : on;
      // flèche exacte : vitesse (−1/r, 0), longueur compressée (ici linéaire, sous le seuil), pulsation de l'épaisseur
      const L = Z.len(1 / r) * seg(t, T.double + 0.6, T.double + 1.0, E.outCubic);
      const pul = 1 + 0.6 * Math.sin(Math.PI * seg(t, T.double + 1.2 + 0.5 * i, T.double + 1.9 + 0.5 * i, E.linear));
      Z.two[i].setAttribute('d', L > 1 ? K.arrowPath(p[0], p[1], p[0] - L, p[1], 14) : '');
      Z.two[i].setAttribute('stroke-width', (6 * pul).toFixed(2));
      Z.two[i].style.opacity = seg(t, T.double + 0.6, T.double + 0.8, E.linear) * nOut;
    });
    Z.putLab(Z.lab2R, toPx(0, 3)[0] + 44, toPx(0, 3)[1], seg(t, T.double + 0.7, T.double + 1.0, E.linear) * nOut);
    // référence verticale fixe (12.5 à 12.7)
    Z.refV.style.opacity = seg(t, T.loincentre + 0.3, T.loincentre + 0.8, E.linear) * (1 - seg(t, T.bords, T.bords + 0.4, E.linear));

    // ---------- cadran (12.7 à 12.13) ----------
    const dOn = seg(t, T.surplace, T.surplace + 0.4, E.linear) * (1 - seg(t, T.lecon2, T.lecon2 + 0.3, E.linear));
    Z.dial.style.opacity = dOn; K.show(Z.dial, dOn > 0);
    const al = Z.ALPHA(t), nl = Z.DR - 16;
    Z.needle.setAttribute('x2', (Z.DX + nl * Math.cos(al)).toFixed(2)); Z.needle.setAttribute('y2', (Z.DY - nl * Math.sin(al)).toFixed(2));
    Z.needleDot.setAttribute('cx', (Z.DX + nl * Math.cos(al)).toFixed(2)); Z.needleDot.setAttribute('cy', (Z.DY - nl * Math.sin(al)).toFixed(2));
    Z.dArc.setAttribute('d', Z.arcArrow(Z.DX, Z.DY, 34, 0, al, 0).replace(/M[^M]*$/, ''));
    Z.putLab(Z.labA, Z.DX + 48, Z.DY - 48, dOn);

    // ---------- 12.9 : flèches de vitesse sur les deux bords de la roue (roue arrêtée à 3 h) ----------
    const [wx, wy] = Z.WX, ap = Z.A * SC;
    const gE = seg(t, T.proche + 0.3, T.proche + 1.1, E.outCubic), eOut = 1 - seg(t, T.lecon2, T.lecon2 + 0.3, E.linear);
    const Lin = Z.len(1 / (Z.R - Z.A)) * gE, Lout = Z.len(1 / (Z.R + Z.A)) * gE;   // 0,59 et 0,37 : sous le seuil, rapport exact
    Z.edgeIn.setAttribute('d', Lin > 1 ? K.arrowPath(wx - ap, wy, wx - ap, wy - Lin, 13) : '');
    Z.edgeOut.setAttribute('d', Lout > 1 ? K.arrowPath(wx + ap, wy, wx + ap, wy - Lout, 13) : '');
    Z.edgeIn.style.opacity = Z.edgeOut.style.opacity = (gE > 0 ? 1 : 0) * eOut;

    // ---------- 12.11 : arc de la trajectoire ----------
    const pa = seg(t, T.courbure + 0.2, T.courbure + 1.0, E.inOutSine), half = 0.5 * pa;
    Z.traj.setAttribute('d', pa > 0 ? Z.arcArrow(CX, CY, Z.R * SC, -half, half, 0).replace(/M[^M]*$/, '') : '');
    Z.traj.style.opacity = eOut;

    // ---------- 12.10, 12.12, 12.13 : deux flèches courbes de même taille, qui se rapprochent et s'annulent ----------
    const slide = seg(t, T.annulent + 0.3, T.annulent + 1.1, E.inOutCubic), gone = 1 - seg(t, T.annulent + 1.1, T.annulent + 1.6, E.linear);
    const rc = 82, toR = Math.PI / 180;
    const pu = seg(t, T.unsens + 0.3, T.unsens + 1.0, E.inOutSine), pd = seg(t, T.virage + 0.3, T.virage + 1.0, E.inOutSine);
    // au-dessus : sens horaire (de 140° vers 40°) ; dessous : sens trigonométrique (de 220° vers 320°)
    Z.curvUp.setAttribute('d', pu > 0 ? Z.arcArrow(wx, wy + 44 * slide, rc, 140 * toR, (140 - 100 * pu) * toR, pu > 0.3 ? 14 : 0) : '');
    Z.curvDn.setAttribute('d', pd > 0 ? Z.arcArrow(wx, wy - 44 * slide, rc, 220 * toR, (220 + 100 * pd) * toR, pd > 0.3 ? 14 : 0) : '');
    Z.curvUp.style.opacity = Z.curvDn.style.opacity = gone;

    // ---------- 12.14 : le crayon trace un petit trait ----------
    const penOn = seg(t, T.exo2 + 0.2, T.exo2 + 0.5, E.linear) * (1 - seg(t, T.lecon2, T.lecon2 + 0.3, E.linear));
    const pt = seg(t, T.exo2 + 3.0, T.exo2 + 3.8, E.inOutSine);
    const x0 = Z.PX - 6, y0 = Z.PY + 16;
    Z.pen.setAttribute('transform', `translate(${(x0 + 46 * pt).toFixed(2)},${(y0 + 4 * Math.sin(Math.PI * pt)).toFixed(2)})`);
    Z.pen.style.opacity = penOn; K.show(Z.pen, penOn > 0);
    Z.penLine.setAttribute('d', pt > 0 ? `M${x0},${y0}L${(x0 + 46 * pt).toFixed(2)},${y0}` : '');
    Z.penLine.style.opacity = penOn;

    Z.vig.render(t);
  },
});

// Vignettes de 12.15 (reprises à l'identique au début de la scène 13 ; phase nulle à la dernière image, d'où le raccord) : cisaillement u = (y, 0), roue au milieu qui tourne
// dans le sens horaire à 1/2 ; tourbillon, roue qui fait le tour sans pivoter. Mouvements en forme fermée.
function buildVignettes(ctx, o) {
  const K = Kit, S = Scene, TAU = Math.PI * 2;
  const t0 = ctx.at(o.at), t1 = o.out !== undefined ? ctx.at(o.out) : Infinity;
  const svg = K.svgLayer(ctx, 13); svg.setAttribute('data-kit', 'vignettes');
  const ucol = K.c('u'), muted = K.c('muted'), fg = K.c('fg');
  const VW = 270, VH = 230, VY = 290, B1 = { x: 1190, y: VY }, B2 = { x: 1510, y: VY };
  for (const b of [B1, B2]) K.s('rect', { x: b.x, y: b.y, width: VW, height: VH, rx: 8, fill: K.c('panel'), stroke: muted, 'stroke-width': 2 }, svg);
  // cisaillement : lignes droites, sens par de petites pointes ; ligne du milieu immobile en --muted
  const sc1 = 46, c1 = [B1.x + VW / 2, B1.y + VH / 2];
  for (const y of [-2, -1, 0, 1, 2]) {
    const py = c1[1] - sc1 * y;
    K.s('line', { x1: B1.x + 14, y1: py, x2: B1.x + VW - 14, y2: py, stroke: y === 0 ? muted : ucol, 'stroke-width': y === 0 ? 2 : 3, opacity: y === 0 ? 1 : 0.85 }, svg);
    if (y !== 0) for (const xx of [0.22, 0.78]) {
      const px = B1.x + VW * xx, s = Math.sign(y), h = 6 + 2 * Math.abs(y);
      K.s('path', { d: `M${px - s * h},${py - h}L${px + s * h},${py}L${px - s * h},${py + h}Z`, fill: ucol }, svg);
    }
  }
  const w1 = K.paddleWheel(ctx, { toPx: (x, y) => [c1[0] + sc1 * x, c1[1] - sc1 * y], pos: [0, 0], angle: (t) => Math.PI / 2 - 0.5 * o.phase(t), r: 30, at: o.at, out: o.out, z: 14 });
  // tourbillon : trois cercles, centre --fg, roue sur le cercle du milieu, un tour en 4 s, aube marquée toujours vers le haut
  const c2 = [B2.x + VW / 2, B2.y + VH / 2];
  for (const r of [36, 70, 100]) K.s('circle', { cx: c2[0], cy: c2[1], r, fill: 'none', stroke: ucol, 'stroke-width': 3, opacity: 0.85 }, svg);
  K.s('circle', { cx: c2[0], cy: c2[1], r: 6, fill: fg }, svg);
  const w2 = K.paddleWheel(ctx, { toPx: (x, y) => [c2[0] + x, c2[1] - y], pos: (t) => { const a = TAU * o.phase(t) / 4 - Math.PI / 2; return [70 * Math.cos(a), 70 * Math.sin(a)]; },
    angle: () => Math.PI / 2, r: 22, at: o.at, out: o.out, z: 14 });
  const lab1 = K.el('div', { class: 'lab', html: K.tex('\\cu{\\omega} = -1', false) }, ctx.stage);
  const lab2 = K.el('div', { class: 'lab', html: K.tex('\\cu{\\omega} = 0 \\text{ pour } r > 0', false) }, ctx.stage);
  for (const [l, b] of [[lab1, B1], [lab2, B2]]) { l.style.left = (b.x + VW / 2) + 'px'; l.style.top = (b.y + VH + 40) + 'px'; l.style.fontSize = '34px'; l.style.color = K.c('fg'); }
  return {
    render(t) {
      const e = K.env(t, t0, t1, 0.4, 0.3);
      for (const el of [svg, lab1, lab2]) { K.show(el, e.on); el.style.opacity = e.o; }
    },
  };
}
