<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ch04.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch04.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch04_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* ch04.Q (question card, no claim, no badge). The card's text, number, category and who-to-ask come from the
   script's "question". Behind it, at 10 % opacity, the film strip of similar neighbouring frames (04.6, cue
   'alike') and the shoebox: a texture, schematic dial angles, no data. */
Scene.define({
  duration: 9.27,
  register: 'night',
  cues: { q: 0.5 },
  params: { bg_opacity: 0.1, frames: 11 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params;
    C4.fixAt(ctx); C4.tokens(ctx, 0.6);
    // background: film strip of neighbouring frames across the top, the shoebox peeking under the card
    const svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: P.bg_opacity }, svg);
    const FW = 124, FH = 94, PITCH = 144, x0 = (1920 - (P.frames - 1) * PITCH - FW) / 2, y0 = 22;
    K.s('rect', { x: x0 - 24, y: y0 - 12, width: (P.frames - 1) * PITCH + FW + 48, height: FH + 24, rx: 6, fill: K.c('matter-dark'), stroke: K.c('matter'), 'stroke-width': 2 }, bg);
    for (let i = 0; i < P.frames; i++) {
      const u = i * 0.22;   // slowly varying readings: neighbouring frames look alike
      C4.frame(bg, { x: x0 + i * PITCH, y: y0, w: FW, h: FH, q: 1.6 * Math.sin(u + 2.1), d: 1.4 + 0.5 * Math.sin(1.3 * u), v: 0.6 * Math.cos(0.8 * u), vmax: 3 });
    }
    const boxG = K.s('g', { transform: 'translate(330 780) scale(0.6) translate(-960 -600)' }, bg); C4.shoebox(boxG, { x: 960, y: 600, w: 520, h: 260 });
    ctx.bgG = bg;
    // the card: everything from the script's "question" (en, why, unblocks, ask_who, n, category)
    K.questionCard(ctx, { chapter: 'ch04', category: 'runs', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
    // REVIEW (cards.js breaks 'D. | Lucor' after the initial): keep each name whole, a break only after ' / '
    ctx.stage.querySelectorAll('.qc-who').forEach((w) => { for (const n of w.childNodes) if (n.nodeType === 3) n.nodeValue = n.nodeValue.replace(/\b([A-Z])\. /g, '$1.\u00a0'); });
    C4.nbhy(ctx.stage);
  },
  render(t, ctx) {
    // the background breathes slowly (no stillness while the card is read)
    ctx.bgG.setAttribute('transform', `translate(${(-6 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`);
  },
});
</script></body></html>
