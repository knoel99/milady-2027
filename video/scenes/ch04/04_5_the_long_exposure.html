<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>04.5 The long exposure</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch04.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch04_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 04.5 The long exposure (L2, NIGHT, CONTEXT: ergodic theorem, observed numerically on this model).
   Two copies of the three-mode model at Γ = params.gamma (live integration, illustration): each step adds
   light where the state is (log-scaled), and an amber histogram of D grows from the same visits (M5, first
   appearance). Copy A starts with D > 0, copy B with D < 0 at a non-mirror state; both stay in their lobe while
   the integration is slow (seeded search), then the integration speeds up and both paint the same glow.
   'below': the inset at Γ = params.inset_gamma, one glow per start. */
Scene.define({
  duration: 29.23,
  register: 'night',
  cues: { shutter: 0.4, glow: 3.9, second: 7.64, same: 12.66, hist: 16.5, name: 20.99, below: 24.61 },
  data: { e1: 'data/e1_finegrid.json' },
  params: { gamma: 0.93, inset_gamma: 0.8, dt: 0.01, transient_units: 600, units_per_s: 400, units_per_s_slow: 25, bins: 41, range_D: [-3, 3], seed: 11 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, E1 = ctx.data.e1;
    C4.fixAt(ctx); C4.tokens(ctx, 0.6);
    const M = C4.model(E1.config.mu, E1.config.nu), G = P.gamma;
    const PAN = [{ x: 140, y: 120, w: 760, h: 400 }, { x: 1020, y: 120, w: 760, h: 400 }], HB = { y: 544, h: 136 }, R = 3.2;
    const T = { sh: ctx.at('shutter-0.15'), open: ctx.at('shutter+0.9'), sec: ctx.at('second-0.15'), same: ctx.at('same'), slide: ctx.at('same+1.5'),
      hist: ctx.at('hist-0.15'), name: ctx.at('name-0.15'), below: ctx.at('below-0.15'), end: ctx.duration };
    const rate = (t) => P.units_per_s_slow + (P.units_per_s - P.units_per_s_slow) * S.seg(t, T.same, T.same + 1.5, S.ease.inOutSine);
    const SR = 120, NS = Math.ceil(T.end * SR) + 2, PT = 0.05;   // scene samples per second; one stored point every PT units
    // model time of each copy at scene time t (copy A from 'shutter', copy B from 'second')
    const tauTab = new Float64Array(NS); for (let n = 1; n < NS; n++) tauTab[n] = tauTab[n - 1] + rate(n / SR) / SR;
    const tauFrom = (t0) => (t) => Math.max(0, tauTab[Math.min(NS - 1, Math.floor(t * SR))] - tauTab[Math.floor(t0 * SR)]);
    const tauA = tauFrom(T.sh), tauB = tauFrom(T.sec);
    // starts: from one long seeded run, a D > 0 state for A and a D < 0 state for B that keep their sign while slow
    const needA = tauA(T.same) + 15, needB = tauB(T.same) + 15, rng = S.rng('starts' + P.seed);
    const s = M.seed(G, +1, rng); M.run(s, G, P.transient_units, P.dt);
    const LR = 40000, hist = [], cross = []; let pd = s[1];
    for (let i = 0; i < LR / 0.5; i++) { M.run(s, G, 0.5, P.dt); hist.push(Float64Array.from(s)); if ((s[1] > 0) !== (pd > 0)) cross.push(i); pd = s[1]; }
    const pickStart = (sgn, need, avoid) => {   // a random position inside a long enough stay of the right polarity
      const ok = []; for (let k = 0; k + 1 < cross.length; k++) { const a = cross[k] + 20, b = cross[k + 1] - Math.ceil(need / 0.5); if (b > a && Math.sign(hist[a][1]) === sgn) ok.push([a, b]); }
      for (let tries = 0; tries < 200 && ok.length; tries++) {
        const [a, b] = ok[Math.floor(rng() * ok.length)], i = a + Math.floor(rng() * (b - a));
        if (!avoid || Math.hypot(hist[i][0] + avoid[0], hist[i][1] + avoid[1], hist[i][2] - avoid[2]) > 0.5) return hist[i];   // not the mirror of A
      }
      S.warn(`04.5: no start keeps its polarity for ${need.toFixed(0)} units; the first crossing comes earlier`); return hist[cross[0] + 20];
    };
    const sA = pickStart(+1, needA, null), sB = pickStart(-1, needB, sA);
    // integrate each copy through the scene clock; points (Q, D) every PT units, index per scene sample
    const integ = (s0, t0) => {
      const s = Float64Array.from(s0), pts = [], idx = new Int32Array(NS); let acc = 0;
      for (let n = 1; n < NS; n++) {
        if (n / SR > t0) {
          let du = rate(n / SR) / SR;
          while (du > 1e-12) { const h = Math.min(P.dt, du); M.step(s, G, h); du -= h; acc += h; if (acc >= PT) { acc -= PT; pts.push(s[0], s[1]); } }
        }
        idx[n] = pts.length / 2;
      }
      return { pts: Float32Array.from(pts), idx };
    };
    const A = integ(sA, T.sh), B = integ(sB, T.sec);
    // inset (below the threshold): one start and its mirror, each in its own whirlpool
    const s8 = M.seed(P.inset_gamma, +1, S.rng('inset')); M.run(s8, P.inset_gamma, P.transient_units, P.dt);
    const ptsI = []; for (let i = 0; i < 1500 / PT; i++) { M.run(s8, P.inset_gamma, PT, P.dt); ptsI.push(s8[0], s8[1]); }
    const I = Float32Array.from(ptsI);

    // ---------- drawing ----------
    const GW = 152, GH = 80;    // glow grid per panel (5 px cells, drawn smoothed and slightly blurred)
    const cell = (q, d) => { const i = Math.floor((q + R) / (2 * R) * GW), j = Math.floor((R - d) / (2 * R) * GH); return i >= 0 && i < GW && j >= 0 && j < GH ? j * GW + i : -1; };
    const NB = P.bins, r0 = P.range_D[0], r1 = P.range_D[1], bw = (r1 - r0) / NB;
    const bin = (d) => { const k = Math.floor((d - r0) / bw); return k >= 0 && k < NB ? k : -1; };
    const init = () => ({ gA: new Float32Array(GW * GH), gB: new Float32Array(GW * GH), gI: new Float32Array(GW * GH), hA: new Float64Array(NB), hB: new Float64Array(NB), nA: 0, nB: 0, mA: 1, mB: 1, mI: 1, iI: 0 });
    const tI0 = T.below + 0.1, tI1 = T.below + 2.6;
    const step = (st, dt, t0) => {
      const n0 = Math.max(0, Math.floor(t0 * SR)), n1 = Math.min(NS - 1, Math.floor((t0 + dt) * SR));
      const add = (C, g, h, key) => {
        const a = C.idx[n0], b = C.idx[n1];
        for (let k = a; k < b; k++) {
          const q = C.pts[2 * k], d = C.pts[2 * k + 1], c = cell(q, d);
          if (c >= 0) { g[c] += 1; if (g[c] > st['m' + key]) st['m' + key] = g[c]; }
          const j = bin(d); if (j >= 0) { h[j] += 1; st['n' + key] += 1; }
        }
      };
      if (t0 + dt > T.open) add(A, st.gA, st.hA, 'A');   // the shutter opens: from now on every pass leaves light
      add(B, st.gB, st.hB, 'B');
      if (t0 + dt > tI0) {   // inset: both starts paint their own lobe over 2.5 s
        const nI = Math.min(I.length / 2, Math.floor(I.length / 2 * S.seg(t0 + dt, tI0, tI1, S.ease.linear)));
        for (let k = st.iI; k < nI; k++) for (const sg of [1, -1]) { const c = cell(sg * I[2 * k], sg * I[2 * k + 1]); if (c >= 0) { st.gI[c] += 1; if (st.gI[c] > st.mI) st.mI = st.gI[c]; } }
        st.iI = Math.max(st.iI, nI);
      }
      return st;
    };
    const acc = S.stepper(init, step, 1 / SR);
    // histogram scale: the single hump of copy A just before the speed-up, plus 15 %
    const pre = (() => { const h = new Float64Array(NB); let n = 0; const b = A.idx[Math.floor(T.same * SR)], a = A.idx[Math.floor(T.open * SR)]; for (let k = a; k < b; k++) { const j = bin(A.pts[2 * k + 1]); if (j >= 0) { h[j]++; n++; } } return Math.max(...h) / Math.max(1, n) / bw; })();
    const yMax = pre * 1.15;
    // final double hump (for the pen marks on 'hist')
    const fin = new Float64Array(NB); for (let k = 0; k < A.pts.length / 2; k++) { const j = bin(A.pts[2 * k + 1]); if (j >= 0) fin[j]++; }
    let kPos = 0; for (let k = Math.ceil(NB / 2); k < NB; k++) if (fin[k] > fin[kPos]) kPos = k;
    const humpD = r0 + (kPos + 0.5) * bw;

    // canvases (glow) and SVG (histograms, axes)
    const LG = PAN.map((p) => K.canvasLayer(ctx, 6, { x: p.x, y: p.y, w: p.w, h: p.h }));
    const off = document.createElement('canvas'); off.width = GW; off.height = GH; const og = off.getContext('2d'), im = og.createImageData(GW, GH);
    const svg = K.svgLayer(ctx, 10);
    PAN.forEach((p, i) => {
      const g = K.s('g', { 'data-panel': i }, svg); p.g = g;
      K.s('rect', { x: p.x, y: p.y, width: p.w, height: p.h, fill: 'none', stroke: K.c('matter-dark'), 'stroke-width': 2 }, g);
      K.s('line', { x1: p.x, x2: p.x + p.w, y1: p.y + p.h / 2, y2: p.y + p.h / 2, stroke: K.c('muted'), 'stroke-width': 1.5, opacity: 0.6 }, g);
      K.s('line', { x1: p.x + p.w / 2, x2: p.x + p.w / 2, y1: p.y, y2: p.y + p.h, stroke: K.c('muted'), 'stroke-width': 1.5, opacity: 0.6 }, g);
      K.s('text', { x: p.x + p.w - 12, y: p.y + p.h / 2 - 12, 'text-anchor': 'end', class: 'kt-tick' }, g, 'Q');
      K.s('text', { x: p.x + p.w / 2 - 12, y: p.y + p.h - 12, 'text-anchor': 'end', class: 'kt-tick' }, g, 'D');
    });
    const mkHist = (i) => {
      const p = PAN[i], g = K.s('g', {}, svg), w = p.w / NB;
      K.s('line', { x1: p.x, x2: p.x + p.w, y1: HB.y + HB.h, y2: HB.y + HB.h, stroke: K.c('muted'), 'stroke-width': 2 }, g);
      const bars = []; for (let k = 0; k < NB; k++) bars.push(K.s('rect', { x: p.x + k * w + 1.5, width: w - 3, y: HB.y + HB.h, height: 0, fill: K.c('metric') }, g));
      const outline = K.s('path', { d: '', fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3, 'stroke-linejoin': 'round' }, g);
      return { g, bars, outline, w, p };
    };
    const HA = mkHist(0), HBh = mkHist(1);
    const lab = (text, x, y, cls) => { const e = K.el('div', { class: cls || 'c4-label' }, st, text); e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.zIndex = 30; return e; };
    const lDax = lab('D · dipole', PAN[0].x + PAN[0].w / 2, HB.y + HB.h + 14, 'c4-label center small');
    const lA = lab('copy A', PAN[0].x + 16, PAN[0].y + 10), lB = lab('copy B', PAN[1].x + 16, PAN[1].y + 10);
    const lLong = lab('long exposure', PAN[0].x + PAN[0].w - 16, PAN[0].y + 10, 'c4-label right');
    const lSame = lab('same glow, same humps', PAN[1].x, HB.y + 46, 'c4-label big');
    const lName = lab('the long-exposure glow (stationary distribution)', PAN[0].x + 16, PAN[0].y + 10, 'c4-label');
    const lBelow = lab('below the threshold: one whirlpool per start', PAN[1].x, HB.y + 6, 'c4-label');
    // shutter icon (grey): six blades that open
    const shG = K.s('g', { transform: `translate(${PAN[0].x + PAN[0].w - 300},${PAN[0].y + 30})` }, svg);
    const blades = []; for (let k = 0; k < 6; k++) blades.push(K.s('line', { stroke: K.c('matter'), 'stroke-width': 3, 'stroke-linecap': 'round' }, shG));
    K.s('circle', { r: 20, fill: 'none', stroke: K.c('matter'), 'stroke-width': 2.5 }, shG);
    // chips, badge, references
    K.badge(ctx, { kind: 'CONTEXT', at: 'shutter' });
    const gch = K.chip(ctx, { text: `Γ = ${G}`, kind: 'plain', x: 140, y: 56, at: 'shutter-0.1' }); gch.root.classList.add('c4-chip-param'); gch.root.style.border = '2px solid'; gch.root.style.padding = '0 16px';
    K.chip(ctx, { text: 'illustration · live integration of the model', kind: 'plain', x: 340, y: 56, at: 'shutter+0.2' });
    const ich = K.chip(ctx, { text: `Γ = ${P.inset_gamma.toFixed(2)}`, kind: 'plain', x: PAN[1].x + 16, y: PAN[1].y + 12, at: 'below', z: 46 }); ich.root.classList.add('c4-chip-param'); ich.root.style.border = '2px solid'; ich.root.style.padding = '0 16px';
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: 'Birkhoff 1931 · ergodic theorem', at: 'name+0.4', hold: 4 });
    C4.formulas(ctx);
    // pen on 'hist': circle both humps, underline the empty middle (left histogram)
    const hx = (d) => PAN[0].x + PAN[0].w * (d - r0) / (r1 - r0);
    K.pen(ctx, { kind: 'circle', box: { x: hx(humpD) - 60, y: HB.y + HB.h * 0.45, w: 120, h: HB.h * 0.5 }, at: 'hist', dur: 0.5, pad: 4, seed: 'humpR' });
    K.pen(ctx, { kind: 'circle', box: { x: hx(-humpD) - 60, y: HB.y + HB.h * 0.45, w: 120, h: HB.h * 0.5 }, at: 'hist+0.5', dur: 0.5, pad: 4, seed: 'humpL' });
    K.pen(ctx, { kind: 'underline', box: { x: hx(-0.5), y: HB.y + HB.h - 14, w: hx(0.5) - hx(-0.5), h: 4 }, at: 'hist+1.2', dur: 0.4, seed: 'mid' });

    ctx.c45 = { PAN, HB, LG, off, og, im, GW, GH, acc, A, B, NS, SR, cell, HA, HBh, yMax, NB, bw, lA, lB, lLong, lSame, lName, lBelow, lDax, blades, shG, T, R };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c45, T = c.T;
    const st = c.acc(t);
    const hexB = K.hex(K.c('b')), hexN = K.hex(K.c('b-neg')), bg = K.hex(K.c('bg'));
    // glows: log-scaled light, D > 0 half in --b, D < 0 half in --b-neg
    const paint = (L, grid, mx, alpha, clear = true) => {
      const d = c.im.data, lm = Math.log(1 + mx);
      for (let j = 0; j < c.GH; j++) {
        const hue = j < c.GH / 2 ? hexB : hexN;
        for (let i = 0; i < c.GW; i++) {
          const v = Math.min(1, Math.log(1 + grid[j * c.GW + i]) / lm), q = 4 * (j * c.GW + i);
          d[q] = bg[0] + (hue[0] - bg[0]) * v; d[q + 1] = bg[1] + (hue[1] - bg[1]) * v; d[q + 2] = bg[2] + (hue[2] - bg[2]) * v; d[q + 3] = 255;
        }
      }
      c.og.putImageData(c.im, 0, 0);
      const g = L.g; if (clear) g.clearRect(0, 0, L.w, L.h); g.save(); g.globalAlpha = alpha; g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.filter = 'blur(2px)'; g.drawImage(c.off, 0, 0, L.w, L.h); g.filter = 'none'; g.restore();
    };
    const pA = S.seg(t, T.sh, T.sh + 0.4, S.ease.linear), pB = S.seg(t, T.sec, T.sec + 0.4, S.ease.linear);
    const swap = S.seg(t, T.below, T.below + 0.8, S.ease.inOutSine);
    K.show(c.LG[0].canvas, pA > 0); if (pA > 0) paint(c.LG[0], st.gA, st.mA, pA);
    K.show(c.LG[1].canvas, pB > 0);
    if (pB > 0) { if (swap < 1) paint(c.LG[1], st.gB, st.mB, pB * (1 - swap)); if (swap > 0) paint(c.LG[1], st.gI, st.mI, swap, swap >= 1); }
    c.PAN[0].g.style.opacity = pA; c.PAN[1].g.style.opacity = pB;
    // the dots with a short fading trail (the last few units), drawn over the glow
    const dot = (L, C, p, t0, alpha) => {
      if (alpha <= 0) return;
      const n = Math.min(c.NS - 1, Math.floor(t * c.SR)), k1 = C.idx[n], k0 = Math.max(0, k1 - 160), g = L.g, X = (q) => (q + c.R) / (2 * c.R) * L.w, Y = (d) => (c.R - d) / (2 * c.R) * L.h;
      if (k1 < 1) return;
      g.save(); g.lineWidth = 2.6; g.lineCap = 'round';
      for (let k = k0 + 1; k < k1; k++) { g.globalAlpha = alpha * (k - k0) / (k1 - k0); g.strokeStyle = C.pts[2 * k + 1] > 0 ? K.c('b') : K.c('b-neg'); g.beginPath(); g.moveTo(X(C.pts[2 * k - 2]), Y(C.pts[2 * k - 1])); g.lineTo(X(C.pts[2 * k]), Y(C.pts[2 * k + 1])); g.stroke(); }
      const q = C.pts[2 * k1 - 2], d = C.pts[2 * k1 - 1];
      g.globalAlpha = alpha; g.fillStyle = d > 0 ? K.c('b') : K.c('b-neg'); g.strokeStyle = K.c('fg'); g.lineWidth = 2.5; g.beginPath(); g.arc(X(q), Y(d), 8, 0, Math.PI * 2); g.fill(); g.stroke(); g.restore();
    };
    dot(c.LG[0], c.A, 0, T.sh, pA); dot(c.LG[1], c.B, 1, T.sec, pB * (1 - swap));
    // histograms: density with a growing normaliser (bars grow from zero while few visits exist)
    const bars = (H, h, n, alpha, asOutline, dx) => {
      const N = Math.max(n, 1500), sy = (v) => c.HB.y + c.HB.h - c.HB.h * Math.min(1, v / c.yMax);
      let d = `M${H.p.x + dx},${c.HB.y + c.HB.h}`;
      for (let k = 0; k < c.NB; k++) {
        const v = h[k] / (N * c.bw), y = sy(v);
        H.bars[k].setAttribute('y', y.toFixed(2)); H.bars[k].setAttribute('height', (c.HB.y + c.HB.h - y).toFixed(2));
        d += `L${(H.p.x + dx + k * H.w).toFixed(1)},${y.toFixed(1)}L${(H.p.x + dx + (k + 1) * H.w).toFixed(1)},${y.toFixed(1)}`;
      }
      H.outline.setAttribute('d', d + `L${H.p.x + dx + H.p.w},${c.HB.y + c.HB.h}`);
      H.g.style.opacity = alpha;
      H.bars.forEach((b) => { b.style.opacity = (1 - asOutline).toFixed(3); });
      H.outline.style.opacity = asOutline.toFixed(3);
    };
    const pHA = S.seg(t, T.open, T.open + 0.4, S.ease.linear);
    bars(c.HA, st.hA, st.nA, pHA, 0, 0);
    // on 'same+1.5' the right histogram slides under the left one and becomes its outline
    const pSl = S.seg(t, T.slide, T.slide + 1.0, S.ease.inOutCubic), dx = -(c.PAN[1].x - c.PAN[0].x) * pSl;
    c.HBh.g.setAttribute('transform', `translate(${dx.toFixed(2)} 0)`);
    bars(c.HBh, st.hB, st.nB, pB, S.seg(t, T.slide + 0.5, T.slide + 1.0, S.ease.linear), 0);
    c.HBh.g.querySelector('line').style.opacity = (1 - pSl).toFixed(3);
    // labels
    const f = (el, a, b = Infinity) => { const p = S.seg(t, a, a + 0.25, S.ease.linear) * (b === Infinity ? 1 : 1 - S.seg(t, b, b + 0.3, S.ease.linear)); el.style.opacity = p; K.show(el, p > 0); };
    f(c.lA, T.sec + 0.2, T.name - 0.3); f(c.lB, T.sec + 0.2, T.below - 0.3); f(c.lLong, T.open, T.sec); f(c.lSame, T.slide + 1.0, T.below - 0.4); f(c.lName, T.name); f(c.lBelow, T.below + 0.4); f(c.lDax, T.open);
    // shutter: blades rotate open at 'shutter+0.9'
    const po = S.seg(t, T.open - 0.4, T.open + 0.2, S.ease.inOutCubic), ps = S.seg(t, T.sh, T.sh + 0.3, S.ease.linear) * (1 - S.seg(t, T.sec - 0.3, T.sec, S.ease.linear));
    c.shG.style.opacity = ps; K.show(c.shG, ps > 0);
    c.blades.forEach((b, k) => { const a = k * Math.PI / 3 + po * 0.9, r0 = 4 + 14 * po; b.setAttribute('x1', (r0 * Math.cos(a)).toFixed(2)); b.setAttribute('y1', (r0 * Math.sin(a)).toFixed(2)); b.setAttribute('x2', (19 * Math.cos(a + 1.1)).toFixed(2)); b.setAttribute('y2', (19 * Math.sin(a + 1.1)).toFixed(2)); });
  },
});
</script></body></html>
