<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>04.6 The shoebox</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch04.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>

<style>
  .ts { font-family: "JetBrains Mono"; font-size: 28px; letter-spacing: .07em; fill: var(--muted); }
  .rd { font: 500 28px Inter; fill: var(--fg); font-feature-settings: "tnum"; }
  .eqcard { position: absolute; box-sizing: border-box; padding: 14px 22px 16px; background: var(--panel); border: 2px solid var(--matter); border-radius: 10px; }
  .eqcard .katex { font-size: 34px; }
  .eqcard .row { line-height: 1.5; }
  .tag { position: absolute; box-sizing: border-box; padding: 8px 18px 10px; border: 2px solid var(--fg-2); border-radius: 8px; font-size: 32px; color: var(--fg); white-space: nowrap; }
  .tag.promise { border: 2px dashed var(--metric); color: var(--metric); white-space: normal; width: 760px; line-height: 1.25; }
  .plus { position: absolute; font-family: "Inter Display"; font-weight: 600; font-size: 64px; color: var(--fg-2); transform: translate(-50%, -50%); }
</style>
</head><body><div id="stage"></div>
<script>
/* 04.6 The shoebox (L2, NIGHT, MEASURED: E1 reference snapshots at Γ = 0.93). A film of a live trajectory
   (illustration: three small dials per frame, one frame every params.frame_every_units), cut into frames,
   shuffled into the shoebox (timestamps peel off), poured out into the 8,000 reference snapshots of
   data/e1_samples_0.93.json, which redraw the glow of 04.5. One snapshot = three dial readings, no clock.
   The shoebox plus the equations answer the crowd questions (tags). */
Scene.define({
  duration: 33.73,
  register: 'night',
  cues: { film: 0.4, alike: 4.53, cut: 6.81, shuffle: 8.66, pour: 13.15, photo: 17.74, notime: 21.76, enough: 24.57, tags: 28.59 },
  data: { shoebox: 'data/e1_samples_0.93.json', e1: 'data/e1_finegrid.json' },
  params: { gamma: 0.93, variant: 'ref', frame_every_units: 2, film_frames: 12, point_px: 2, point_alpha: 0.5, box: { x: 960, y: 600, w: 520, h: 260 },
    dt: 0.01, transient_units: 600, seed: 6, photo_index: 0 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, SB = ctx.data.shoebox, E1 = ctx.data.e1;
    C4.fixAt(ctx); C4.tokens(ctx, 0.6);
    const V = SB.variants[P.variant], XS = Scene.f32(V.x), N = V.n, G = SB.gamma;
    if (Math.abs(G - P.gamma) > 1e-9) S.warn(`04.6: data Γ = ${G}, params.gamma = ${P.gamma}`);
    const M = C4.model(E1.config.mu, E1.config.nu);
    const T = { film: ctx.at('film-0.15'), alike: ctx.at('alike-0.1'), cut: ctx.at('cut'), sh: ctx.at('shuffle-0.15'), pour: ctx.at('pour-0.15'),
      photo: ctx.at('photo-0.15'), notime: ctx.at('notime'), enough: ctx.at('enough-0.15'), tags: ctx.at('tags-0.1'), end: ctx.duration };
    const tagSent = (ctx.script.sentences || []).find((s) => s.cue === 'tags');
    const tagDur = tagSent ? Math.max(1.2, tagSent.end - tagSent.start) : 3.6;

    // ---------- the film: a live trajectory at Γ, one frame every frame_every_units ----------
    const s = M.seed(G, +1, S.rng('film' + P.seed)); M.run(s, G, P.transient_units, P.dt);
    const NF = P.film_frames, frames = [];
    for (let i = 0; i < NF; i++) { frames.push({ q: s[0], d: s[1], v: s[2] }); M.run(s, G, P.frame_every_units, P.dt); }
    const FW = 128, FH = 96, PITCH = 140, FX0 = (1920 - (NF - 1) * PITCH - FW) / 2, FY = 158;
    const svg = K.svgLayer(ctx, 20);
    const strip = K.s('g', {}, svg);
    const band = K.s('g', {}, strip);
    K.s('rect', { x: FX0 - 24, y: FY - 34, width: (NF - 1) * PITCH + FW + 48, height: FH + 108, rx: 6, fill: K.c('matter-dark'), stroke: K.c('matter'), 'stroke-width': 2 }, band);
    for (let x = FX0 - 10; x < FX0 + (NF - 1) * PITCH + FW + 10; x += 34) { K.s('rect', { x, y: FY - 26, width: 18, height: 14, rx: 3, fill: K.c('bg') }, band); K.s('rect', { x, y: FY + FH + 58, width: 18, height: 14, rx: 3, fill: K.c('bg') }, band); }
    // the shoebox: inside, then the frames (content), then the front face
    const boxG = K.s('g', {}, svg);
    const box = C4.shoebox(boxG, { x: P.box.x, y: P.box.y, w: P.box.w, h: P.box.h });
    box.content.remove(); box.front.remove();
    const frameG = K.s('g', {}, svg);   // frames live above the strip band and the box inside
    const front = K.s('g', {}, svg); front.appendChild(box.front);
    const rng = S.rng('shuffle' + P.seed), order = frames.map((_, i) => i).sort(() => rng() - 0.5);
    const fr = frames.map((f, i) => {
      const g = K.s('g', {}, frameG), x = FX0 + i * PITCH, y = FY;
      C4.frame(g, { x: 0, y: 0, w: FW, h: FH, q: f.q, d: f.d, v: f.v, vmax: 3 });
      const ts = K.s('text', { x: x + FW / 2, y: y + FH + 40, 'text-anchor': 'middle', class: 'ts' }, strip, `time ${i * P.frame_every_units}`);
      const rank = order.indexOf(i);
      return { g, x, y, ts, rank, tx: P.box.x - P.box.w * 0.36 + (rng() * 0.72) * P.box.w - FW / 2, ty: P.box.y - P.box.h / 2 - FH * 0.55 + rng() * 26, rot: (rng() - 0.5) * 40 };
    });
    K.pen(ctx, { kind: 'box', box: { x: FX0 + 5 * PITCH - 8, y: FY - 8, w: PITCH + FW + 16 - 12 - 4, h: FH + 16 }, at: 'alike', out: 'cut', dur: 0.5, seed: 'alike' });
    const cuts = []; for (let i = 0; i < NF - 1; i++) { const x = FX0 + i * PITCH + FW + (PITCH - FW) / 2; cuts.push(K.s('line', { x1: x, x2: x, y1: FY - 30, y2: FY + FH + 76, stroke: K.c('chalk'), 'stroke-width': 3.5, 'stroke-dasharray': '8 7', 'stroke-linecap': 'round' }, svg)); }

    // ---------- the map: the 8,000 reference snapshots (Q across, D up) and the 04.5 glow outline ----------
    const MAP = { x: 560, y: 110, w: 800, h: 590 }, RR = 3.2, small = { x: 120, y: 150, w: 560, h: 413 };
    const LP = K.canvasLayer(ctx, 15);
    const mapSvg = K.svgLayer(ctx, 14), mapG = K.s('g', {}, mapSvg);
    K.s('line', { x1: MAP.x, x2: MAP.x + MAP.w, y1: MAP.y + MAP.h / 2, y2: MAP.y + MAP.h / 2, stroke: K.c('muted'), 'stroke-width': 2, opacity: 0.6 }, mapG);
    K.s('line', { x1: MAP.x + MAP.w / 2, x2: MAP.x + MAP.w / 2, y1: MAP.y, y2: MAP.y + MAP.h, stroke: K.c('muted'), 'stroke-width': 2, opacity: 0.6 }, mapG);
    K.s('text', { x: MAP.x + MAP.w - 8, y: MAP.y + MAP.h / 2 - 14, 'text-anchor': 'end', class: 'kt-label' }, mapG, 'Q');
    K.s('text', { x: MAP.x + MAP.w / 2 - 14, y: MAP.y + 30, 'text-anchor': 'end', class: 'kt-label' }, mapG, 'D');
    // outline of the glow: a smoothed density contour of the same snapshots (marching squares)
    const GX = 64, GY = 48, dens = new Float32Array(GX * GY);
    for (let k = 0; k < N; k++) { const i = Math.floor((XS[3 * k] + RR) / (2 * RR) * GX), j = Math.floor((RR - XS[3 * k + 1]) / (2 * RR) * GY); if (i >= 0 && i < GX && j >= 0 && j < GY) dens[j * GX + i]++; }
    for (let pass = 0; pass < 2; pass++) { const c = dens.slice(); for (let j = 1; j < GY - 1; j++) for (let i = 1; i < GX - 1; i++) { let a = 0; for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) a += c[(j + dj) * GX + i + di]; dens[j * GX + i] = a / 9; } }
    const lev = Math.max(...dens) * 0.06; let cd = '';
    const gx = (i) => MAP.x + (i + 0.5) / GX * MAP.w, gy = (j) => MAP.y + (j + 0.5) / GY * MAP.h;
    for (let j = 0; j < GY - 1; j++) for (let i = 0; i < GX - 1; i++) {
      const v = [dens[j * GX + i], dens[j * GX + i + 1], dens[(j + 1) * GX + i + 1], dens[(j + 1) * GX + i]], code = v.map((x, k) => (x > lev ? 1 << k : 0)).reduce((a, b) => a + b, 0);
      if (code === 0 || code === 15) continue;
      const e = [[gx(i) + (lev - v[0]) / (v[1] - v[0]) * (gx(i + 1) - gx(i)), gy(j)], [gx(i + 1), gy(j) + (lev - v[1]) / (v[2] - v[1]) * (gy(j + 1) - gy(j))],
        [gx(i) + (lev - v[3]) / (v[2] - v[3]) * (gx(i + 1) - gx(i)), gy(j + 1)], [gx(i), gy(j) + (lev - v[0]) / (v[3] - v[0]) * (gy(j + 1) - gy(j))]];
      const cross = [0, 1, 2, 3].filter((k) => ((code >> k) & 1) !== ((code >> ((k + 1) % 4)) & 1));   // edge k joins corners k and k+1
      for (let a = 0; a + 1 < cross.length; a += 2) cd += `M${e[cross[a]][0].toFixed(1)},${e[cross[a]][1].toFixed(1)}L${e[cross[a + 1]][0].toFixed(1)},${e[cross[a + 1]][1].toFixed(1)}`;
    }
    const contour = K.s('path', { d: cd, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2, 'stroke-dasharray': '5 6', opacity: 0.7 }, mapG);
    // launch order and times of the snapshots (they pour from the box mouth)
    const prng = S.rng('pour' + P.seed), launch = new Float32Array(N); for (let k = 0; k < N; k++) launch[k] = prng();
    const lab = (text, x, y, cls) => { const e = K.el('div', { class: cls || 'c4-label' }, st, text); e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.zIndex = 30; return e; };
    const lN = lab(`${N.toLocaleString('en-US')} snapshots · Γ = ${G}`, MAP.x + MAP.w / 2, MAP.y + MAP.h + 12, 'c4-label center');
    K.chip(ctx, { text: 'SIMULATED', kind: '', x: MAP.x + 16, y: MAP.y + 12, at: 'pour+1.2', out: 'enough-0.4' });
    K.lowerThird(ctx, { kind: 'source', data: SB, at: 'pour+0.6', hold: 4 });

    // ---------- one snapshot, enlarged: three dials and their readings, no clock ----------
    const ph = P.photo_index, pq = XS[3 * ph], pd = XS[3 * ph + 1], pv = XS[3 * ph + 2];
    const card = K.s('g', {}, svg), CX = 1424, CY = 150, CW = 380, CH = 250;
    C4.frame(card, { x: CX, y: CY, w: CW, h: CH, q: pq, d: pd, v: pv, vmax: 3, dialY: 0.42, stroke: 3 });
    [[pq, 'Q'], [pd, 'D'], [pv, 'V']].forEach(([v, n], i) => K.s('text', { x: CX + CW * [0.2, 0.5, 0.8][i], y: CY + CH - 22, 'text-anchor': 'middle', class: 'rd' }, card, K.fmt(v, 2, { fixed: 2 })));
    const photoLink = K.s('line', { stroke: K.c('chalk'), 'stroke-width': 2.5, 'stroke-dasharray': '4 6' }, svg);
    const lSnap = lab('snapshot = (Q, D, V)', CX, CY + CH + 14, 'c4-label big');
    lSnap.innerHTML = 'snapshot = (<span class="k-q">Q</span>, <span class="k-b">D</span>, <span class="k-u">V</span>)';
    // the crossed-out clock
    const clock = K.s('g', { transform: `translate(${CX + CW - 34},${CY + CH + 92})` }, svg);
    K.s('circle', { r: 26, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, clock);
    K.s('path', { d: 'M0,-15 V0 L11,8', fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3, 'stroke-linecap': 'round' }, clock);
    K.pen(ctx, { kind: 'cross', box: { x: CX + CW - 64, y: CY + CH + 62, w: 60, h: 60 }, at: 'notime+0.2', out: 'enough-0.4', dur: 0.4, seed: 'clock' });
    const lNo = lab('a snapshot carries no timestamp and no time order', CX, CY + CH + 136, 'c4-label');
    lNo.style.whiteSpace = 'normal'; lNo.style.width = '396px'; lNo.style.lineHeight = '1.25';

    // ---------- enough: shoebox + the equations; tags ----------
    const eq = K.el('div', { class: 'eqcard' }, st); eq.style.left = '1150px'; eq.style.top = '176px'; eq.style.zIndex = 30;
    const Qs = '\\htmlClass{k-q}{Q}';
    [`\\dot{${Qs}} = ${K.fmt(E1.config.mu)}\\,${Qs} - \\cu{V}\\,\\cb{D}`, `\\dot{\\cb{D}} = -${K.fmt(E1.config.nu)}\\,\\cb{D} + \\cu{V}\\,${Qs}`, `\\dot{\\cu{V}} = \\Gam - \\cu{V} + ${Qs}\\,\\cb{D}`]
      .forEach((tx) => K.el('div', { class: 'row', html: K.tex(tx, false) }, eq));
    const plus = K.el('div', { class: 'plus' }, st, '+'); plus.style.left = '1080px'; plus.style.top = '290px'; plus.style.zIndex = 30;
    const tags = [K.el('div', { class: 'tag' }, st, 'averages'), K.el('div', { class: 'tag' }, st, 'energy budgets'),
      K.el('div', { class: 'tag promise' }, st, 'how often D crosses zero · with the equations · chapter 05')];
    tags.forEach((g, i) => { g.style.left = (i === 2 ? 790 : [790, 1050][i]) + 'px'; g.style.top = (i === 2 ? 556 : 470) + 'px'; g.style.zIndex = 30; });
    const tagT = [T.tags, T.tags + 0.3 * tagDur, T.tags + 0.58 * tagDur];

    K.badge(ctx, { kind: 'MEASURED', note: ctx.script.badge && ctx.script.badge.note, at: 'film' });
    C4.formulas(ctx);
    const L = P.point_px, alpha = P.point_alpha;
    ctx.c46 = { T, strip, band, fr, cuts, boxG, front, box, frameG, MAP, small, RR, LP, mapG, contour, launch, XS, N, lN, card, photoLink, lSnap, clock, lNo, eq, plus, tags, tagT, ph, pq, pd, L, alpha, FW, FH, PITCH };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c46, T = c.T, P = ctx.params;
    const f = (el, a, b = Infinity, d = 0.3) => { const p = S.seg(t, a, a + d, S.ease.linear) * (b === Infinity ? 1 : 1 - S.seg(t, b, b + 0.3, S.ease.linear)); el.style.opacity = p.toFixed(3); el.style.display = p > 0 ? '' : 'none'; return p; };
    // --- film: the strip scrolls in from the right, stops; the cut; frames fall into the box (random order)
    const scroll = 1750 * (1 - S.seg(t, T.film, T.alike - 0.2, S.ease.outCubic));
    const apart = S.seg(t, T.cut + 0.5, T.cut + 1.0, S.ease.inOutCubic);
    c.strip.setAttribute('transform', `translate(${scroll.toFixed(1)} 0)`);
    f(c.strip, T.film, T.sh + 0.4);
    c.band.style.opacity = (1 - S.seg(t, T.cut + 0.4, T.cut + 0.9, S.ease.linear)).toFixed(3);
    // --- the box: appears before the shuffle, shakes twice, tips and pours, parks small; joins the equations on 'enough'
    const pb = S.seg(t, T.sh - 0.5, T.sh, S.ease.linear), bx = P.box.x, by = P.box.y;
    const shake = 8 * (Math.sin(Math.PI * 2 * S.seg(t, T.sh + 2.0, T.sh + 2.35, S.ease.linear)) + Math.sin(Math.PI * 2 * S.seg(t, T.sh + 2.5, T.sh + 2.85, S.ease.linear)));
    const tip = S.seg(t, T.pour, T.pour + 0.6, S.ease.inOutCubic), away = S.seg(t, T.pour + 2.9, T.pour + 3.8, S.ease.inOutCubic), back = S.seg(t, T.enough, T.enough + 1.0, S.ease.inOutCubic);
    const cx = S.lerp(S.lerp(bx, 230, away), 900, back) + shake, cy = S.lerp(S.lerp(by - 30 * tip, 620, away), 300, back);
    const rot = -32 * tip * (1 - away), sc = S.lerp(1, 0.42, away);
    const tf = `translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${rot.toFixed(2)}) scale(${sc.toFixed(3)}) translate(${-bx} ${-by})`;
    c.boxG.setAttribute('transform', tf); c.front.setAttribute('transform', tf);
    c.boxG.style.opacity = c.front.style.opacity = pb.toFixed(3); K.show(c.boxG, pb > 0); K.show(c.front, pb > 0);
    const rr = -32 * Math.PI / 180, mx0 = -P.box.w / 2 + 30, my0 = -P.box.h / 2 - 20;   // the mouth (top-left of the tipped box)
    c.mouth = [bx + mx0 * Math.cos(rr) - my0 * Math.sin(rr), by - 30 + mx0 * Math.sin(rr) + my0 * Math.cos(rr)];
    // --- frames: in the strip, then they fall into the box (random order), ride with the box, fade when it pours
    c.fr.forEach((F, i) => {
      if (t < T.film) { F.g.style.display = 'none'; return; }
      F.g.style.display = '';
      const sp = (i - (c.fr.length - 1) / 2) * 10 * apart;   // the cut frames come apart
      const t0 = T.sh + 0.12 * F.rank, p = S.seg(t, t0, t0 + 0.55, S.ease.inCubic);
      if (p < 1) {
        const x = S.lerp(F.x + scroll + sp, F.tx, p), y = S.lerp(F.y, F.ty, p);
        F.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${(F.rot * p).toFixed(2)} ${c.FW / 2} ${c.FH / 2})`);
      } else F.g.setAttribute('transform', `${tf} translate(${F.tx.toFixed(1)} ${F.ty.toFixed(1)}) rotate(${F.rot.toFixed(2)} ${c.FW / 2} ${c.FH / 2})`);
      const pe = S.seg(t, T.sh + 0.3, T.sh + 1.1, S.ease.outCubic);   // timestamps peel off and drift up
      F.ts.setAttribute('transform', `translate(${sp.toFixed(1)} ${(-60 * pe).toFixed(1)})`); F.ts.style.opacity = (1 - pe).toFixed(3);
      F.g.style.opacity = (1 - S.seg(t, T.pour + 0.2, T.pour + 0.7, S.ease.linear)).toFixed(3);
    });
    c.cuts.forEach((L, i) => { const a = T.cut + 0.04 * i; L.style.opacity = (S.seg(t, a, a + 0.15, S.ease.linear) * (1 - S.seg(t, T.cut + 0.9, T.cut + 1.2, S.ease.linear))).toFixed(3); L.style.display = t >= a ? '' : 'none'; });
    // --- the map: points pour from the box mouth to their places (shuffled order), then the outline of the glow
    const mv = S.seg(t, T.enough - 0.4, T.enough + 0.8, S.ease.inOutCubic);   // the map shrinks to the left on 'enough'
    const MP = { x: S.lerp(c.MAP.x, c.small.x, mv), y: S.lerp(c.MAP.y, c.small.y, mv), w: S.lerp(c.MAP.w, c.small.w, mv), h: S.lerp(c.MAP.h, c.small.h, mv) };
    const k = MP.w / c.MAP.w;
    c.mapG.setAttribute('transform', `translate(${MP.x} ${MP.y}) scale(${k.toFixed(4)}) translate(${-c.MAP.x} ${-c.MAP.y})`);
    const pm = f(c.mapG, T.pour + 0.2, Infinity, 0.5); void pm;
    c.contour.style.opacity = (0.7 * S.seg(t, T.pour + 2.4, T.pour + 3.0, S.ease.linear)).toFixed(3);
    const g = c.LP.g; g.clearRect(0, 0, 1920, 1080);
    const t0 = T.pour + 0.5, span = 2.4, fly = 0.55;
    if (t > t0) {
      const mouthBox = c.mouth;
      const B = K.c('b'), BN = K.c('b-neg');
      g.globalAlpha = c.alpha;
      for (let i = 0; i < c.N; i++) {
        const a = t0 + span * c.launch[i], p = S.seg(t, a, a + fly, S.ease.outCubic); if (p <= 0) continue;
        const q = c.XS[3 * i], d = c.XS[3 * i + 1];
        const X = MP.x + (q + c.RR) / (2 * c.RR) * MP.w, Y = MP.y + (c.RR - d) / (2 * c.RR) * MP.h;
        g.fillStyle = d > 0 ? B : BN;
        g.fillRect(S.lerp(mouthBox[0], X, p) - c.L / 2, S.lerp(mouthBox[1], Y, p) - c.L / 2, c.L, c.L);
      }
      g.globalAlpha = 1;
    }
    f(c.lN, T.pour + 2.0, T.enough - 0.4);
    // --- the photo: one snapshot lifts out to the right and enlarges
    const pp = f(c.card, T.photo, T.enough - 0.4, 0.45);
    const sX = MP.x + (c.pq + c.RR) / (2 * c.RR) * MP.w, sY = MP.y + (c.RR - c.pd) / (2 * c.RR) * MP.h;
    c.card.setAttribute('transform', `translate(${S.lerp(sX - 1424, 0, S.ease.outCubic(pp)).toFixed(1)} ${S.lerp(sY - 150, 0, S.ease.outCubic(pp)).toFixed(1)}) translate(1424 150) scale(${(0.15 + 0.85 * S.ease.outCubic(pp)).toFixed(3)}) translate(-1424 -150)`);
    c.photoLink.setAttribute('x1', sX); c.photoLink.setAttribute('y1', sY); c.photoLink.setAttribute('x2', 1424); c.photoLink.setAttribute('y2', 150 + 125);
    f(c.photoLink, T.photo + 0.4, T.notime);
    f(c.lSnap, T.photo + 0.45, T.enough - 0.4); f(c.clock, T.notime - 0.15, T.enough - 0.4); f(c.lNo, T.notime + 0.4, T.enough - 0.4);
    // --- enough: box + equations; then the three tags on their words
    f(c.plus, T.enough + 0.9); f(c.eq, T.enough + 1.1, Infinity, 0.4);
    c.tags.forEach((el, i) => { const p = f(el, c.tagT[i], Infinity, 0.25); el.style.transform = `translateY(${(10 * (1 - p)).toFixed(1)}px)`; });
  },
});
</script></body></html>
