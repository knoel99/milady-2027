<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>04.1 Three dials</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch04.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch04_kit.js"></script>
<style>
  .grp { position: absolute; inset: 0; transform-origin: 0 0; }
  .eqw { position: absolute; inset: 0; }
  .dlab { position: absolute; transform: translateX(-50%); text-align: center; white-space: nowrap; }
  .dlab .n { font-size: 36px; font-weight: 600; color: var(--fg); display: inline-flex; align-items: center; gap: 12px; }
  .dlab .n svg { flex: none; }
  .dlab .s { font-size: 28px; color: var(--fg-2); margin-top: 2px; }
  .gam { position: absolute; transform: translateX(-50%); font-family: "Inter Display"; font-weight: 600; font-size: 44px; color: var(--param); }
</style>
</head><body><div id="stage"></div>
<script>
/* 04.1 Three dials (L2, NIGHT, CONTEXT). Lead-in: chapter card T4. Then the three dials of Gissinger's
   model (schematic, no numbers), their equations (coefficients from data/e1_finegrid.json config), the
   mirror (Q, D) -> (-Q, -D), and the landing on tier 0 of the staircase. */
Scene.define({
  duration: 31.6,
  register: 'night',
  cues: { caricature: 3.2, dipole: 7.36, quadrupole: 11.37, flow: 14.4, eqs: 19.3, mirror: 23.1, bench: 26.76 },
  data: { e1: 'data/e1_finegrid.json' },
  params: { dial_radius_px: 110, dial_x: [560, 960, 1360], dial_y: 290, q_shade_opacity: 0.6, staircase: { lit: 0, pending: [3, 4] },
    rest_deg: [-55, 62, 28], knob_x: 1660 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, cfg = ctx.data.e1.config;
    C4.fixAt(ctx);
    C4.tokens(ctx, P.q_shade_opacity);
    const title = (ctx.script.onscreen && ctx.script.onscreen.title) || ctx.script.title || 'Chaos and the shoebox of photographs';

    // ---- lead-in: chapter card T4 (staircase tier 0 lit, rail at L2 without climbing)
    K.chapterCard(ctx, { num: '04', title, level: 'L2', levelFrom: 'L2', tier: P.staircase.lit, pending: P.staircase.pending, at: -0.3, out: 'caricature-0.55', railHold: 2.9 });   // REVIEW: gone before the dials fade in (no double exposure)
    K.badge(ctx, { kind: 'CONTEXT', at: 'caricature' });

    // ---- the dial group (dials, springs, labels, equations, knob): shrinks onto tier 0 at 'bench'
    const grp = K.el('div', { class: 'grp' }, st); grp.style.zIndex = 20;
    const svg = K.svgLayer(ctx, 1, grp);
    const R = P.dial_radius_px, X = P.dial_x, Y = P.dial_y;
    const springs = [0, 1].map(() => K.s('polyline', { fill: 'none', stroke: K.c('infra'), 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, svg));
    const dials = X.map((x) => C4.dial(svg, { x, y: Y, r: R }));
    const tIn = ctx.at('caricature-0.15');

    const TAUf = Math.PI * 2;
    // labels under the dials, with the small field icons (two dipole loops, four quadrupole lobes)
    const icon = (lobes, col) => {   // r = L |sin(lobes θ / 2)|^2-like rose, in a 44 x 36 box
      let d = ''; const n = 120;
      for (let i = 0; i <= n; i++) { const th = TAUf * i / n, r = 16 * Math.pow(Math.abs(lobes === 2 ? Math.sin(th) : Math.sin(2 * th)), lobes === 2 ? 2 : 1);
        d += `${i ? 'L' : 'M'}${(22 + r * (lobes === 2 ? Math.sin(th) : Math.cos(th))).toFixed(1)},${(18 - r * (lobes === 2 ? Math.cos(th) : Math.sin(th))).toFixed(1)}`; }
      return `<svg width="44" height="36" viewBox="0 0 44 36"><path d="${d}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linejoin="round"/></svg>`;
    };
    const qcol = C4.qcol(P.q_shade_opacity), bcol = K.c('b'), ucol = K.c('u');
    const mkLab = (x, nHtml, sub) => { const d = K.el('div', { class: 'dlab' }, grp); d.style.left = x + 'px'; d.style.top = (Y + R + 22) + 'px';
      K.el('div', { class: 'n', html: nHtml }, d); if (sub) K.el('div', { class: 's' }, d, sub); return d; };
    const labQ = mkLab(X[0], icon(4, qcol) + '<span><span class="k-q">Q</span> · quadrupole</span>', 'four-pole');
    const labD = mkLab(X[1], icon(2, bcol) + '<span><span class="k-b">D</span> · dipole</span>', 'north-south');
    const labV = mkLab(X[2], '<span><span class="k-u">V</span> · flow pattern</span>', null);

    // the knob Γ drives V (no window, no numbers)
    const kx = P.knob_x, kr = 52;
    K.knob(ctx, { x: kx, y: Y, r: kr, min: 0.8, max: 1.0, value: 0.9, at: 'flow-0.15', parent: grp, ticks: 8 });
    const gam = K.el('div', { class: 'gam' }, grp, 'Γ'); gam.style.left = kx + 'px'; gam.style.top = (Y + R + 8) + 'px';
    K.pen(ctx, { kind: 'arrow', from: [kx - kr - 50, Y], to: [X[2] + R + 16, Y], bend: 0, color: 'param', at: 'flow+0.25', dur: 0.4, parent: grp, seed: 'knobarrow' });

    // the three equations, one under each dial, coefficients from the data (never typed)
    const mu = K.fmt(cfg.mu), nu = K.fmt(cfg.nu);
    const Qs = '\\htmlClass{k-q}{Q}';
    const tex = [
      `\\term{e}{\\dot{${Qs}} = ${mu}\\,${Qs} - \\cu{V}\\,\\cb{D}}`,
      `\\term{e}{\\dot{\\cb{D}} = -${nu}\\,\\cb{D} + \\cu{V}\\,${Qs}}`,
      `\\term{e}{\\dot{\\cu{V}} = \\Gam - \\cu{V} + ${Qs}\\,\\cb{D}}`,
    ];
    // rows centred under the dials (Q, D, V), one every 0.6 s; dashed leaders routed around the rows to each dial
    const EY0 = Y + R + 108, EDY = 78, EX = 724;
    const eqw = [], eqs = tex.map((tx, i) => {
      const w = K.el('div', { class: 'eqw' }, grp); eqw.push(w);
      return K.equation(ctx, { tex: tx, x: EX, y: EY0 + EDY * i, size: 56, anchor: 'left', parent: w, reveal: [['e', `eqs+${(0.6 * i).toFixed(1)}`]] });
    });
    const eb = eqs.map((E) => E.box('e'));
    const labBottom = (L) => K.box(L, ctx).y + K.box(L, ctx).h + 6;
    const lq = labBottom(labQ), ld = labBottom(labD), lv = labBottom(labV), mid = (b) => b.y + b.h * 0.55;
    const xl = Math.min(...eb.map((b) => b.x)) - 22;
    const routes = [
      `M${eb[0].x - 10},${mid(eb[0])} H${X[0]} V${lq}`,
      `M${eb[1].x - 10},${mid(eb[1])} H${xl} V${eb[0].y - 8} H${K.box(labD, ctx).x - 12}`,   // REVIEW: stops left of 'north-south' (it ran through the letters)
      `M${eb[2].x + eb[2].w + 10},${mid(eb[2])} H${X[2]} V${lv}`,
    ];
    void ld;
    const leaders = routes.map((d) => K.s('path', { d, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 2.5, 'stroke-dasharray': '5 7', 'stroke-linejoin': 'round' }, svg));
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: 'Gissinger 2012 · three-mode model', at: 'eqs+0.4', out: 'mirror-0.3' });

    // mirror: the pen ticks the three rows, 'same equations' beside them
    const xr = Math.max(...eb.map((b) => b.x + b.w)) + 28;
    const checks = eb.map((b, i) => K.pen(ctx, { kind: 'check', box: { x: xr, y: b.y + b.h * 0.2, w: 34, h: 34 }, at: `mirror+${(0.45 + 0.15 * i).toFixed(2)}`, dur: 0.35, parent: grp, seed: 'chk' + i }));
    const same = K.el('div', { class: 'c4-label big' }, grp, 'same equations'); same.style.left = (xr + 64) + 'px'; same.style.top = (eb[1].y + eb[1].h / 2 - 24) + 'px';
    // chip (schematic metaphor), formula layer from the script
    K.chip(ctx, { text: 'SCHEMATIC · dials and springs', kind: 'schematic', x: 1824, y: 124, anchor: 'tr', at: 'caricature+0.3', out: 'bench-0.2' });
    if (ctx.script.onscreen && ctx.script.onscreen.formulas) K.formulaLayer(ctx);

    // ---- bench: the group shrinks onto tier 0 of a small staircase
    const sSvg = K.svgLayer(ctx, 18); const sG = K.s('g', {}, sSvg);
    const SX = 560, SY = 220, SW = 800, SH = 300;
    K.staircase(ctx, { x: SX, y: SY, w: SW, h: SH, lit: P.staircase.lit, pending: P.staircase.pending, at: 'bench+0.5', svg: sG });
    const tier0 = [SX + SW / 10, SY + SH - 64 - 60 + 28];
    const benchLab = K.el('div', { class: 'c4-label big' }, st, 'tier 0 · three modes · test bench E1'); benchLab.style.left = SX + 'px'; benchLab.style.top = (SY + SH + 112) + 'px'; benchLab.style.zIndex = 21;
    K.pen(ctx, { kind: 'circle', box: { x: SX + 4, y: tier0[1] - 22, w: SW / 5 - 8, h: SY + SH - tier0[1] + 22 }, at: 'bench+1.4', dur: 0.6, pad: 2, seed: 'benchCircle' });

    // ---- timing
    const T = { in: tIn, dip: ctx.at('dipole-0.15'), quad: ctx.at('quadrupole-0.15'), flow: ctx.at('flow-0.15'), eq: ctx.at('eqs'),
      mir: ctx.at('mirror-0.15'), bench: ctx.at('bench-0.2') };
    const rest = P.rest_deg, ph = [0.0, 2.1, 4.0];
    const grey = K.hex(K.c('matter')), cb = K.hex(K.c('b')), cbn = K.hex(K.c('b-neg')), cu = K.hex(K.c('u')), cq = C4.mixRGB('b', 'fg', P.q_shade_opacity);
    const lerpC = (a, b, p) => `rgb(${a.map((x, i) => Math.round(x + (b[i] - x) * p)).join(',')})`;
    const zig = (x0, x1, y, amp) => { const n = 9, pts = [[x0, y]]; for (let i = 1; i < 2 * n; i++) pts.push([x0 + (x1 - x0) * i / (2 * n), y + (i % 2 ? -amp : amp)]); pts.push([x1, y]); return pts.map((p) => p.map((v) => v.toFixed(1)).join(',')).join(' '); };
    C4.nbhy(st);   // REVIEW: tabular hyphen of the theme ('north - south')
    ctx.c4 = { checks, eqy: eb.map((b) => b.y + b.h / 2), grp, svg, dials, springs, labs: [labQ, labD, labV], gam, eqw, leaders, same, benchLab, sG, tier0, T, rest, ph, grey, cb, cbn, cu, cq, lerpC, zig, R, X, Y };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c4, T = c.T;
    // the dial group: visible from 'caricature', shrinks onto tier 0 from 'bench'
    const on = t >= T.in;
    K.show(c.grp, on); if (!on) { K.show(c.benchLab, false); return; }
    const pIn = S.seg(t, T.in, T.in + 0.5, S.ease.outCubic);
    const pB = S.seg(t, T.bench, T.bench + 1.2, S.ease.inOutCubic);
    const s = 1 - 0.93 * pB, cx = 960, cy = 420;
    const tx = (1 - pB) * cx + pB * c.tier0[0] - s * cx, ty = (1 - pB) * cy + pB * c.tier0[1] - s * cy;
    c.grp.style.transform = `translate(${tx.toFixed(2)}px, ${(ty + 16 * (1 - pIn)).toFixed(2)}px) scale(${s.toFixed(4)})`;
    c.grp.style.opacity = (pIn * (1 - S.seg(t, T.bench + 0.7, T.bench + 1.2, S.ease.linear))).toFixed(3);
    if (pB >= 1) K.show(c.grp, false);
    // text leaves first when the group shrinks (only the dials and springs land on tier 0)
    const txt = 1 - S.seg(t, T.bench, T.bench + 0.3, S.ease.linear);
    c.eqw.forEach((w) => { w.style.opacity = txt.toFixed(3); });
    c.labs.forEach((L) => { L.style.filter = ''; }); c.txt = txt;
    // pointers: swing in (spring), idle coupled jiggle, the mirror swings Q and D to the other side
    const jig = (i) => 2.6 * Math.sin(2 * Math.PI * t / 3.1 + c.ph[i]) + 1.2 * Math.sin(2 * Math.PI * t / 1.9 + 1.7 * c.ph[i]);
    const mir = S.seg(t, T.mir, T.mir + 1.0, S.ease.inOutCubic);
    const ang = c.rest.map((r, i) => {
      const enter = S.spring((t - T.in - 0.12 * i) / 0.9, 0.03);
      const target = i < 2 ? r * (1 - 2 * mir) : r;
      return target * enter + jig(i) * S.seg(t, T.in + 0.8, T.in + 1.6, S.ease.linear);
    });
    const cQ = S.seg(t, T.quad, T.quad + 0.25, S.ease.linear), cD = S.seg(t, T.dip, T.dip + 0.25, S.ease.linear), cV = S.seg(t, T.flow, T.flow + 0.25, S.ease.linear);
    c.dials[0].set(ang[0], c.lerpC(c.grey, c.cq, cQ));
    c.dials[1].set(ang[1], cD < 1 ? c.lerpC(c.grey, c.cb, cD) : c.lerpC(c.cb, c.cbn, mir));
    c.dials[2].set(ang[2], c.lerpC(c.grey, c.cu, cV));
    // springs between the bezels: the zig-zag breathes with the pointers
    const amp = (i) => 13 + 2.2 * Math.sin(2 * Math.PI * t / 3.1 + c.ph[i] + 1) ;
    c.springs[0].setAttribute('points', c.zig(c.X[0] + c.R + 14, c.X[1] - c.R - 14, c.Y, amp(0)));
    c.springs[1].setAttribute('points', c.zig(c.X[1] + c.R + 14, c.X[2] - c.R - 14, c.Y, amp(1)));
    // labels on their words
    [T.quad, T.dip, T.flow].forEach((a, i) => { const L = c.labs[i], p = S.seg(t, a, a + 0.25, S.ease.outCubic); L.style.opacity = p; L.style.marginTop = (8 * (1 - p)).toFixed(2) + 'px'; K.show(L, p > 0); });
    const pg = S.seg(t, T.flow + 0.1, T.flow + 0.35, S.ease.linear); c.gam.style.opacity = pg; K.show(c.gam, pg > 0);
    // leaders: each row to its dial, 1.5 s after the row appears
    c.leaders.forEach((L, i) => { const a = T.eq + 0.6 * i; L.style.opacity = (0.75 * S.seg(t, a + 0.1, a + 0.35, S.ease.linear) * (1 - S.seg(t, a + 1.6, a + 1.9, S.ease.linear))).toFixed(3); });
    // mirror: the rows pulse once, then 'same equations'
    c.eqw.forEach((w, i) => { const a = T.mir + 0.25 + 0.12 * i, p = Math.sin(Math.PI * S.seg(t, a, a + 0.6, S.ease.inOutSine));
      w.style.transformOrigin = `960px ${c.eqy[i]}px`; w.style.transform = p > 0 ? `scale(${(1 + 0.03 * p).toFixed(4)})` : ''; });
    const ps = S.seg(t, T.mir + 1.0, T.mir + 1.25, S.ease.linear); c.same.style.opacity = ps; K.show(c.same, ps > 0);
    // the staircase breathes after landing; its label
    const pl = S.seg(t, T.bench + 1.2, T.bench + 1.45, S.ease.linear); c.benchLab.style.opacity = pl; K.show(c.benchLab, pl > 0);
    [...c.labs, c.gam, c.same].forEach((e) => { e.style.opacity = (+e.style.opacity * c.txt).toFixed(3); });
    c.checks.forEach((p) => { p.path.style.opacity = (+p.path.style.opacity * c.txt).toFixed(3); });
    const br = 1 + 0.006 * Math.sin(2 * Math.PI * Math.max(0, t - T.bench) / 3.4);
    c.sG.setAttribute('transform', `translate(960 400) scale(${br.toFixed(4)}) translate(-960 -400)`);
  },
});
</script></body></html>
