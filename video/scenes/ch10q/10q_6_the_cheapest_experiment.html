<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>10q.6 The cheapest experiment</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch10q.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="../../runtime/components/threemodes.js"></script>
<script src="ch10q_board.js"></script>
<script src="ch10q_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 10q.6 The cheapest experiment (L4, NIGHT, CONJECTURE medium). Board C: the 13 priority-1 tickets fly into one
   message card 'BEFORE RENTING · TO THE SUPERVISORS' (two columns, labels as on the board), the other 24 wait as a dim
   double row; two tickets trade places ('ranking: a proposal'); a chalk correction arrow; a dashed 'rented GPU?'
   machine that flickers; the pointer to the companion question sheet (plain mono, case kept). */
Scene.define({
  duration: 26,
  register: 'night',
  cues: { message: 0.4, order: 4.2, reorder: 6.0, change: 8.8, cheapest: 13.6 },
  params: { message: { header: 'BEFORE RENTING · TO THE SUPERVISORS', swap: ['Q22', 'Q21'] }, order_chip: 'ranking: a proposal', machine: { label: 'rented GPU?' },
    pointer: { lines: ['every question, with why and what it unblocks:', 'companion question sheet (French) · infra/cloud/RECOMMANDATION-CLOUD.md §0'] } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK;
    const o1 = window.CQ_BOARD.order.filter((id) => CQ.byId(id).pri === 1);
    const sw = P.message.swap || [], o2 = o1.slice(); const i = o2.indexOf(sw[0]), j = o2.indexOf(sw[1]); if (i >= 0 && j >= 0) { o2[i] = sw[1]; o2[j] = sw[0]; }
    const box = K.el('div', { class: 'uk-card' }, ctx.stage); box.style.cssText += ';left:240px;top:190px;width:1100px;height:420px;z-index:21';
    K.el('div', { class: 'uk-lab mono' }, box, K.upper(P.message.header)).style.cssText += ';left:24px;top:14px';
    U.fade(ctx, box, { at: 'message-0.15' });
    CQ.build(ctx, [{ t: -0.4, pos: CQ.layoutA(true) }, { t: 'message-0.15', pos: CQ.layoutC(o1), stagger: 0.02 }, { t: 'order-0.15', pos: CQ.layoutC(o2) }]);
    U.label(ctx, { text: P.order_chip, x: 1320, y: 204, anchor: 'r', cls: 'mono', z: 34, at: 'order+0.4' });
    K.pen(ctx, { kind: 'arrow', from: [1370, 560], to: [1370, 270], bend: 0.2, at: 'reorder-0.15', out: 'reorder+1.2', dur: 0.5, seed: 'reorder' });
    // the rented machine: dashed rack with one card, flickers once
    const sv = K.svgLayer(ctx, 14), m = K.s('g', {}, sv);
    K.s('rect', { x: 1460, y: 300, width: 300, height: 260, rx: 8, fill: 'none', stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '10 8' }, m);
    [0, 1, 2].forEach((k) => K.s('line', { x1: 1490, x2: 1730, y1: 360 + 60 * k, y2: 360 + 60 * k, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '6 6' }, m));
    K.s('rect', { x: 1560, y: 470, width: 100, height: 40, fill: 'none', stroke: K.c('muted'), 'stroke-width': 3 }, m);
    const ar = K.s('path', { d: 'M1350,430 L1440,430 m-14,-10 l14,10 l-14,10', fill: 'none', stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '6 6' }, sv);
    U.fade(ctx, ar, { at: 'change' });
    U.label(ctx, { text: K.upper(P.machine.label), x: 1610, y: 576, anchor: 'c', cls: 'mono', at: 'change' });
    const tC = ctx.at('change-0.15'), tF = U.frac(ctx, 'change', 0.75, 3), tH = ctx.at('cheapest-0.15');
    ctx.add({ render(t) { const a = S.seg(t, tC, tC + 0.5, S.ease.linear) * (t > tF && t < tF + 0.25 ? 0 : 1) * (1 - 0.7 * S.seg(t, tH, tH + 0.5, S.ease.linear)); m.style.opacity = a.toFixed(3); m.style.display = t < tC ? 'none' : ''; } });
    K.pen(ctx, { kind: 'underline', box: { x: 260, y: 204, w: 700, h: 34 }, at: 'cheapest+0.2', dur: 0.5, seed: 'hdr', z: 35 });
    const pt = U.label(ctx, { html: Kit.esc(P.pointer.lines[0]) + '<br>' + Kit.esc(P.pointer.lines[1]), x: 240, y: 760, size: 28, at: 'cheapest+0.6' });
    pt.el.style.fontFamily = '"JetBrains Mono"'; pt.el.style.color = 'var(--fg-2)';
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'medium', at: -0.3 });
  },
});
</script></body></html>
