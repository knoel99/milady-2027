<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>10q.1 A staircase of decisions</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch10q.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>

<script src="../../runtime/components/seat.js"></script>
<script src="../../runtime/components/threemodes.js"></script>

<script src="ch10q_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 10q.1 A staircase of decisions (L4, NIGHT, PLANNED). Chapter card (rail L5 -> L4, side-step); the question
   tickets (current register, ch10q_board.js) fan in: the cards' tickets, then the register-only asks; the staircase
   draws and every ticket hangs under the step it shapes (hooks), the narrated bets on their cues. */
Scene.define({
  duration: 38,
  register: 'night',
  cues: { cards: 3.6, seats: 6.6, stairs: 8.6, bet1: 10.8, bet2: 14.6, gen: 18.8, top: 21.4, decisions: 24.4 },
  params: { chapter_card: { num: 'ASK', title: 'Before we compute', level: 'L4', levelFrom: 'L5', tier: 1, pending: [2, 3, 4] } },
  setup(ctx) {
    const K = Kit, P = ctx.params, U = UK, cc = P.chapter_card, E = CQ.E();
    K.chapterCard(ctx, { num: cc.num, title: cc.title, level: cc.level, levelFrom: cc.levelFrom, tier: cc.tier, pending: cc.pending, at: -0.3, out: 'cards-0.4', railHold: 2.6 });
    // fan: a loose grid at the centre, cards first then the register-only asks
    const fan = {}, cards = E.filter((e) => e.kind === 'card'), seats = E.filter((e) => e.kind !== 'card');
    [...cards, ...seats].forEach((e, i) => { fan[e.id] = { x: 420 + 104 * (i % 10) + (Math.floor(i / 10) % 2) * 40, y: 300 + 76 * Math.floor(i / 10), a: 1, lab: 0 }; });
    const fanCards = {}; cards.forEach((e) => { fanCards[e.id] = fan[e.id]; });
    // hang positions under the staircase (x 200-1700, steps 300 px); 'every' gets its own column left of step 0
    const SX = 200, SW = 300, HX = { every: 104, tier0: SX + 100, tier1: SX + SW + 100, bet1: SX + 2 * SW + 10, bet2: SX + 2 * SW + 106, gen: SX + 2 * SW + 202, vks: SX + 3 * SW + 50, dresdyn: SX + 4 * SW + 100 };
    const hang = {}, cnt = {}, H0 = 500;
    E.forEach((e) => { const h = HX[e.hook] !== undefined ? e.hook : 'every', k = cnt[h] = (cnt[h] || 0) + 1, i = k - 1, two = h === 'vks' || h === 'every';
      hang[e.id] = { x: HX[h] + (two ? 92 * (i % 2) : 0), y: H0 + 46 * (two ? Math.floor(i / 2) : i), a: 1, lab: 0 }; });
    // the narrated hooks arrive on their cues, the others at 'stairs'
    const when = { bet1: 'bet1', bet2: 'bet2', gen: 'gen', vks: 'top', dresdyn: 'top' };
    const frames = [{ t: 'cards-0.15', pos: fanCards, stagger: 0.04 }, { t: 'seats-0.15', pos: fan, stagger: 0.02 }];
    const mid = {}; let w = 0; E.forEach((e) => { if (!when[e.hook]) mid[e.id] = hang[e.id]; else { mid[e.id] = { x: 560 + 92 * (w % 13), y: 760 + 46 * Math.floor(w / 13), a: 0.35, lab: 0 }; w++; } });   // waiting row
    frames.push({ t: 'stairs+0.3', pos: mid });
    let cur = mid; ['bet1', 'bet2', 'gen', 'top'].forEach((c) => { const nx = Object.assign({}, cur); E.forEach((e) => { if (when[e.hook] === c) nx[e.id] = hang[e.id]; }); frames.push({ t: c + '-0.15', pos: nx }); cur = nx; });
    CQ.build(ctx, frames);
    // the staircase and the hook labels
    const sv = K.svgLayer(ctx, 14); K.staircase(ctx, { x: SX, y: 110, w: 1500, h: 330, lit: 1, pending: [2, 3, 4], labels: false, at: 'stairs-0.15', svg: sv });
    const HL = { every: 'EVERY STEP', tier0: 'DIALS', tier1: 'FIRST CAMPAIGN', bet1: 'BET 1', bet2: 'BET 2', gen: '3D GEN.', vks: 'VKS', dresdyn: 'DRESDYN' };
    Object.entries(HL).forEach(([h, l]) => U.label(ctx, { text: l, x: HX[h] + (h === 'vks' || h === 'every' ? 86 : 40), y: 452, anchor: 'c', cls: 'dim', size: 28, at: (when[h] || 'stairs') + '-0.15' }));
    const sl = K.s('line', { x1: SX, x2: SX + 1500, y1: 490, y2: 490, stroke: K.c('infra'), 'stroke-width': 1.5 }, sv); U.fade(ctx, sl, { at: 'stairs' });
    U.label(ctx, { text: 'A staircase of bets is a staircase of decisions', x: 1240, y: 820, anchor: 'c', size: 36, at: 'decisions-0.15' });
    U.label(ctx, { html: K.upper('Independent PhD proposal') + '<br>' + K.upper('not requested or validated by the supervisors'), x: 96, y: 40, cls: 'mono', at: 'stairs' });
    K.badge(ctx, { kind: 'PLANNED', at: 'cards-0.15' });
  },
});
</script></body></html>
