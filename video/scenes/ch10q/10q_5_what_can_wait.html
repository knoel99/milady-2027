<html lang="en"><head><meta charset="utf-8">

<script src="../../vendor/katex/katex.min.js"></script>

</head><body><div id="stage"></div>
<script>
/* 10q.5 What can wait (L4, NIGHT, CONJECTURE medium: a proposed ranking). Board A -> B at 'later': shelf 1 compresses to
   stubs, the 14 priority-2 tickets fill shelf 2 with labels; the narrated ones light (their register question in the
   panel); at 'wait' the 10 priority-3 tickets fill shelf 3 as stubs, and the legend of the ticket outlines types in. */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { later: 0.4, count: 6.4, exact: 9.4, labels: 12.0, publish: 14.4, wait: 17.4 },
  params: { focus: [], legend: ['solid: a question card', 'dashed: asked without a card', 'double: asked in the extended cut only'] },
  setup(ctx) {
    const K = Kit, P = ctx.params, U = UK;
    const B = CQ.build(ctx, [{ t: -0.4, pos: CQ.layoutA(true) }, { t: 'later-0.15', pos: CQ.layoutB(false), stagger: 0.015 }, { t: 'wait-0.15', pos: CQ.layoutB(true), stagger: 0.02 }]);
    CQ.heads(ctx, -0.3);
    U.label(ctx, { text: '1 · BEFORE RENTING', x: 110, y: 158, cls: 'mono', at: -0.3 });
    U.label(ctx, { text: '2 · FOR THE PLAN AND THE DATA REQUEST', x: 110, y: 300, cls: 'mono', at: 'later+0.2' });
    U.label(ctx, { text: 'not needed for the first campaigns', x: 830, y: 300, size: 28, cls: 'dim', at: 'later+0.4' });
    U.label(ctx, { text: '3 · CAN WAIT', x: 110, y: 690, cls: 'mono', at: 'wait' });
    U.label(ctx, { text: 'the top steps, verdict rules, the first paper', x: 400, y: 690, size: 28, cls: 'dim', at: 'wait+0.2' });
    const items = [];
    (P.focus || []).forEach((f, i) => { const at = ctx.at(f.cue + '-0.15'), nx = P.focus[i + 1]; const out = nx ? ctx.at(nx.cue + '-0.15') : ctx.at('wait-0.3');
      B.hiTicket(f.tickets, at, out); f.tickets.forEach((id) => items.push({ id, at, out })); });
    if (items.length) CQ.panel(ctx, { x0: 1270, x1: 1824, y0: 494, y1: 680 }, items);
    // legend: three small outlines and their meaning
    const lg = (P.legend || []);
    lg.forEach((l, i) => { const x = 110 + 560 * i, d = K.el('div', { class: 'cq-t ' + (i === 1 ? 'seat' : '') + (i === 2 ? ' ext' : '') }, ctx.stage); d.style.cssText += `;left:${x}px;top:840px;width:40px;height:28px;padding:0`; U.fade(ctx, d, { at: ctx.at('wait+0.6') + 0.3 * i });
      U.label(ctx, { text: l, x: x + 56, y: 836, size: 28, cls: 'dim', at: ctx.at('wait+0.6') + 0.3 * i }); });
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'medium', at: -0.3 });
  },
});
</script></body></html>
