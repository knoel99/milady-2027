<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ch06.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch06.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch06_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* ch06.Q Question for the supervisors (framing). The card fills the frame; behind it at 10 %, the small bar chart of
   06.5: zero line, the dashed grey noise floor and the violet-outlined model bar. */
Scene.define({
  duration: 9.2,
  register: 'night',
  cues: { q: 0.5 },
  params: { bg_opacity: 0.1 },
  setup(ctx) {
    const K = Kit, P = ctx.params, svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: P.bg_opacity }, svg);
    svg.setAttribute('data-qa', 'ignore');   // a 10 % backdrop under the card
    const x0 = 1180, x1 = 1760, y0 = 260, y1 = 760;
    K.s('line', { x1: x0, x2: x0, y1: y0, y2: y1, stroke: K.c('muted'), 'stroke-width': 4 }, bg);
    K.s('line', { x1: x0, x2: x1, y1: y1, y2: y1, stroke: K.c('fg-2'), 'stroke-width': 4 }, bg);
    K.s('rect', { x: x0 + 60, y: y1 - 140, width: 160, height: 140, fill: K.c('metric') }, bg);
    K.s('rect', { x: x0 + 320, y: y1 - 330, width: 160, height: 330, fill: K.c('metric'), 'fill-opacity': 0.6, stroke: K.c('model'), 'stroke-width': 5, 'stroke-dasharray': '12 8' }, bg);
    K.s('line', { x1: x0, x2: x1, y1: y1 - 140, y2: y1 - 140, stroke: K.c('muted'), 'stroke-width': 5, 'stroke-dasharray': '16 12' }, bg);
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'ch06', category: 'framing', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-6 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
