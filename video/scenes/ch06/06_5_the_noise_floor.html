<script>
/* 06.5 The noise floor (L3, NIGHT, CONTEXT: finite-sample statistics, R:723). Crowds, not twins: two sand piles and the
   earth-mover's work; predict; a fair die rolled 1,000 times twice gives two different histograms: that gap is the
   noise floor; judge models against it at equal sample size, never against zero; overlapping samples make the floor too
   low. Every quantity is a seeded illustration: no number on screen except the roll count label. */
Scene.define({
  duration: 50,
  register: 'night',
  cues: { twin: 0.5, sand: 4.0, distance: 6.0, earth: 9.4, predict: 13.4, dice: 19.0, differ: 22.4, floor: 25.0, judge: 28.6, independent: 32.4, overlap: 34.6 },
  params: { rolls: 1000, one_by_one: 12, one_by_one_s: 0.3, rain_s: 2.0, seed_die_a: 'die-a', seed_die_b: 'die-b', overlap_share: 0.5, grains: 300,
    piles: { centres: [-0.6, 0.7], widths: [0.9, 0.7], range: [-3, 3] }, chart: { x0: 1180, x1: 1760, y0: 220, y1: 600 }, tick_gain_db: -26 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage;
    const T = {}; for (const k of ['twin', 'sand', 'distance', 'earth', 'predict', 'dice', 'differ', 'floor', 'judge', 'independent', 'overlap']) T[k] = ctx.at(k + '-0.15');
    const svg = K.svgLayer(ctx, 12);
    // ---- shot 1: crowds
    const twin = K.s('g', {}, svg);
    K.s('rect', { x: 300, y: 150, width: 170, height: 120, rx: 8, fill: K.c('panel'), stroke: K.c('model'), 'stroke-width': 4 }, twin);
    [0.25, 0.5, 0.75].forEach((f) => K.s('circle', { cx: 300 + f * 170, cy: 210, r: 20, fill: 'none', stroke: K.c('matter'), 'stroke-width': 3 }, twin));
    K.s('line', { x1: 480, x2: 680, y1: 210, y2: 210, stroke: K.c('fg-2'), 'stroke-width': 3, 'stroke-dasharray': '8 8' }, twin);
    K.s('rect', { x: 690, y: 150, width: 170, height: 120, rx: 8, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3, 'stroke-dasharray': '10 8' }, twin);
    const lTwin = C6.lab(ctx, 'its true twin?', 775, 286, 'big center');
    K.pen(ctx, { kind: 'cross', box: { x: 555, y: 185, w: 50, h: 50 }, at: 'twin+0.8', out: 'sand', dur: 0.35, seed: 'tw65' });
    const PL = P.piles, AX = { x0: 260, x1: 1660, y: 600 }, xs = (v) => AX.x0 + (v - PL.range[0]) / (PL.range[1] - PL.range[0]) * (AX.x1 - AX.x0);
    const axis = K.s('line', { x1: AX.x0, x2: AX.x1, y1: AX.y, y2: AX.y, stroke: K.c('muted'), 'stroke-width': 3 }, svg);

    const pileD = (k) => { let d = `M${xs(PL.range[0])},${AX.y}`; for (let i = 0; i <= 120; i++) { const v = PL.range[0] + (PL.range[1] - PL.range[0]) * i / 120; d += `L${xs(v).toFixed(1)},${(AX.y - 230 * pdf(v, k) / (1 / PL.widths[1])).toFixed(1)}`; } return d + `L${xs(PL.range[1])},${AX.y}Z`; };

    // grains of the generated pile, matched in sorted order to the simulated pile (no two arcs cross)
    const gr = S.rng('grains'), sample = (k) => { const a = []; for (let i = 0; i < P.grains; i++) a.push(PL.centres[k] + PL.widths[k] * C6.gauss(gr)[0]); return a.sort((p, q) => p - q); };
    const A = sample(0), Bs = sample(1), bin = (AX.x1 - AX.x0) / 70, stack = (arr) => { const h = {}; return arr.map((v) => { const b = Math.round(xs(v) / bin); h[b] = (h[b] || 0) + 1; return [b * bin, AX.y - 5 - 9 * (h[b] - 1)]; }); };
    const sa = stack(A), sb = stack(Bs), grains = A.map((_, i) => ({ e: K.s('circle', { r: 4, fill: K.c('metric') }, svg), a: sa[i], b: sb[i], w: i % 3 }));

    const cmax = 1.35 * P.rolls / 6, bars = (H, col) => { const g = K.s('g', {}, svg), bw = (H.x1 - H.x0) / 6; return { g, H, r: [0, 1, 2, 3, 4, 5].map((i) => K.s('rect', { x: H.x0 + i * bw + 6, width: bw - 12, y: H.y1, height: 0, fill: K.c(col), 'fill-opacity': 0.85 }, g)) }; };

    const nOf = (t, t0, speed) => { const k = (t - t0) / (P.one_by_one_s * speed); if (k < 0) return 0; if (k <= P.one_by_one) return Math.floor(k); return Math.min(P.rolls, P.one_by_one + Math.floor((P.rolls - P.one_by_one) * S.seg(t, t0 + P.one_by_one * P.one_by_one_s * speed, t0 + P.one_by_one * P.one_by_one_s * speed + P.rain_s * speed, S.ease.inOutSine))); };
    const tA = T.dice + 1.0, tB = tA + P.one_by_one * P.one_by_one_s + P.rain_s + 0.3;
    const ev = []; for (let i = 0; i < P.one_by_one; i++) { ev.push({ t: +(tA + i * P.one_by_one_s).toFixed(3), id: 'tick', gain_db: P.tick_gain_db }); ev.push({ t: +(tB + i * P.one_by_one_s * 0.5).toFixed(3), id: 'tick', gain_db: P.tick_gain_db }); }
    window.__EVENTS__ = ev;
    const fmtN = P.rolls.toLocaleString('en-US');
    const lA = C6.lab(ctx, `${fmtN} rolls`, (HA.x0 + HA.x1) / 2, HA.y1 + 16, 'big center'), lB = C6.lab(ctx, `${fmtN} more`, (HB.x0 + HB.x1) / 2, HB.y1 + 16, 'big center');
    const die = K.s('g', { transform: 'translate(200 470)' }, svg);
    K.s('rect', { x: -44, y: -44, width: 88, height: 88, rx: 14, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 4 }, die);
    [[-20, -20], [20, -20], [0, 0], [-20, 20], [20, 20]].forEach(([x, y]) => K.s('circle', { cx: x, cy: y, r: 7, fill: K.c('fg-2') }, die));
    K.chip(ctx, { text: 'SCHEMATIC · a fair die', kind: 'schematic', x: 120, y: 540, at: 'dice+0.4', out: 'floor' });
    const lSame = C6.lab(ctx, 'same die, same truth', (HA.x0 + HA.x1) / 2, HA.y0 - 70, 'big center');
    // the floor and the judge chart
    const C = P.chart, chart = K.s('g', {}, svg);
    K.s('line', { x1: C.x0, x2: C.x0, y1: C.y0, y2: C.y1, stroke: K.c('muted'), 'stroke-width': 2 }, chart);
    const zero = K.s('line', { x1: C.x0, x2: C.x1, y1: C.y1, y2: C.y1, stroke: K.c('fg-2'), 'stroke-width': 3 }, chart);
    const lCy = C6.lab(ctx, 'distribution distance', C.x0 - 10, C.y0 - 52, ''); lCy.style.color = K.c('metric');
    const floorH = 110, modelH = 260, bw2 = 150;
    const fBar = K.s('rect', { x: C.x0 + 60, width: bw2, fill: K.c('metric'), opacity: 0.85 }, chart);
    const mBar = K.s('rect', { x: C.x0 + 300, width: bw2, fill: K.c('metric'), 'fill-opacity': 0.6, stroke: K.c('model'), 'stroke-width': 3, 'stroke-dasharray': '9 6' }, chart);
    const fLine = K.s('line', { x1: C.x0, x2: C.x1, stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '12 9' }, svg);
    const lFloor = C6.lab(ctx, 'noise floor', C.x1, 0, 'right halo');
    const lModel = C6.lab(ctx, 'model', C.x0 + 300 + bw2 / 2, C.y1 + 14, 'center');
    K.pen(ctx, { kind: 'cross', box: { x: C.x1 - 70, y: C.y1 - 24, w: 48, h: 48 }, at: 'judge+1.4', dur: 0.35, seed: 'z65' });
    const lNot = C6.lab(ctx, 'not zero', C.x1 - 46, C.y1 + 30, 'center');
    const lEq = C6.lab(ctx, 'equal sample size', (C.x0 + C.x1) / 2, C.y1 + 62, 'center');
    const tagI = [HA].map((H) => C6.lab(ctx, 'independent', (H.x0 + H.x1) / 2, H.y0 - 70, 'center'));
    const lLow = C6.lab(ctx, 'overlapping samples: floor too low', (C.x0 + C.x1) / 2, C.y0 - 120, 'center', { w: 560 });
    const lHon = C6.lab(ctx, 'independent samples: honest floor', (C.x0 + C.x1) / 2, C.y0 - 120, 'center', { w: 560 });
    [lLow, lHon].forEach((e) => { e.style.textAlign = 'center'; });
    const tLow = T.overlap + 0.3, tBack = T.overlap + 2.6;
    K.pen(ctx, { kind: 'arrow', from: [C.x1 - 30, C.y1 - floorH - 40], to: [C.x1 - 30, C.y1 - floorH * 0.45], at: tLow + 0.5, out: tBack, dur: 0.4, seed: 'dn65' });
    K.pen(ctx, { kind: 'check', box: { x: C.x1 - 54, y: C.y1 - floorH - 70, w: 44, h: 44 }, at: tBack + 0.6, dur: 0.4, seed: 'ok65' });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    // WORKAROUND (script formula 2 too long for one layer item at 28 px): a \quad break before its parenthesis
    K.formulaLayer(ctx, { items: ((ctx.script.onscreen && ctx.script.onscreen.formulas) || []).map((f) => ({ tex: f.tex.replace('\\ \\ (= 0', ';\\quad (= 0'), at: f.cue + '-0.15' })) });
    ctx.c = { T, twin, lTwin, axis, piles, pGen, pSim, lGen, lSim, grains, simG, work, gauge, gBar, lDist, HA, HB, hA, hB, RA, RB0, RB1, counts, cmax, nOf, tA, tB, outl, deltas, dRects, lA, lB, die, lSame,
      chart, zero, lCy, fBar, mBar, fLine, lFloor, lModel, lNot, lEq, tagI, lLow, lHon, tLow, tBack, C, floorH, modelH };
  },
  render(t, ctx) {
    const S = Scene, P = ctx.params, c = ctx.c, T = c.T, ease = S.ease.inOutCubic;
    C6.fadeS(c.twin, t, -0.3, T.sand); C6.fade(c.lTwin, t, T.twin + 0.3, T.sand);
    // piles → sand → earth mover; out on 'dice'
    const pileIn = S.seg(t, T.twin + 1.6, T.twin + 2.4, S.ease.linear), shot1Out = S.seg(t, T.dice, T.dice + 0.5, S.ease.linear), dim = 1 - 0.7 * S.seg(t, T.predict, T.predict + 0.4, S.ease.linear);

    c.axis.setAttribute('opacity', (pileIn * (1 - shot1Out)).toFixed(3));
    const toSand = S.seg(t, T.sand, T.sand + 0.8, S.ease.linear);
    c.piles.setAttribute('opacity', (s1 * (1 - 0.75 * toSand) * (1 + 0.02 * Math.sin(t * 2))).toFixed(3));
    C6.fade(c.lGen, t, T.sand, T.predict - 0.2); C6.fade(c.lSim, t, T.sand + 0.2, T.predict - 0.2);
    c.simG.setAttribute('opacity', (toSand * s1).toFixed(3));
    const waveT = (w) => T.distance + 0.8 + w * 1.5;
    let moved = 0;
    for (let i = 0; i < c.grains.length; i++) {
      const gr = c.grains[i], p = S.seg(t, waveT(gr.w), waveT(gr.w) + 1.2, ease), x = gr.a[0] + (gr.b[0] - gr.a[0]) * p, y = gr.a[1] + (gr.b[1] - gr.a[1]) * p - Math.sin(Math.PI * p) * Math.min(120, 0.25 * Math.abs(gr.b[0] - gr.a[0]) + 20);
      gr.e.setAttribute('cx', x.toFixed(1)); gr.e.setAttribute('cy', y.toFixed(1)); gr.e.setAttribute('opacity', (toSand * s1).toFixed(3));
      moved += p * Math.abs(gr.b[0] - gr.a[0]);
    }
    const tot = c.grains.reduce((s, g) => s + Math.abs(g.b[0] - g.a[0]), 0);
    c.gBar.setAttribute('width', (300 * moved / tot * (1 - S.seg(t, T.predict, T.predict + 0.4, S.ease.linear))).toFixed(1));
    C6.fadeS(c.gauge, t, T.distance, T.dice); C6.fade(c.lDist, t, T.distance + 0.2, T.dice);

    const nA = c.nOf(t, c.tA, 1), nB = c.nOf(t, c.tB, 0.5);
    const ovl = S.seg(t, c.tLow - 0.3, c.tLow + 0.4, ease) * (1 - S.seg(t, c.tBack, c.tBack + 0.6, ease));

    c.hB.r.forEach((r, i) => { const y = hy(c.HB, cB[i]); r.setAttribute('y', y.toFixed(1)); r.setAttribute('height', (c.HB.y1 - y).toFixed(1)); });

      const tx = c.C.x0 + 60, ty = c.C.y1 - c.floorH + i * c.floorH / 6;
      r.setAttribute('x', (x0 + (tx - x0) * fly).toFixed(1)); r.setAttribute('y', (y0 + (ty - y0) * fly).toFixed(1)); r.setAttribute('width', ((bw - 12) + (150 - (bw - 12)) * fly).toFixed(1)); r.setAttribute('height', (h + (c.floorH / 6 - h) * fly).toFixed(1));
