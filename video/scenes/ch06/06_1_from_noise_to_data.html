<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>06.1 From noise to data</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch06.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch06_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 06.1 From noise to data (L3, NIGHT, CONTEXT: flow matching, Lipman et al. 2023). A violet noise cloud, the target
   crowd (two mirror blobs, the site's toy data) over it, the EXACT wind of that toy target (closed form, no network)
   carries the cloud onto the blobs along curved paths; fresh noise makes fresh snapshots. SCHEMATIC toy: no number. */
Scene.define({
  duration: 35,
  register: 'night',
  cues: { noise: 3.6, data: 7.6, wind: 13.6, bend: 15.6, fresh: 19.0, model: 22.4, learn: 26.6 },
  data: { fm: 'data/fig_flow_matching.json' },
  params: { n_particles: 1200, seed_noise: 'noise', seed_fresh: 'noise2', heun_steps: 40, transport_s: 3.5, fresh_transport_s: 2.0, trail: 10, arrows: [14, 9],
    box: { x0: 360, x1: 1560, y0: 130, y1: 700 }, range: [-3.2, 3.2], staircase: { lit: 0, pending: [3, 4] } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, B = P.box, FM = ctx.data.fm.data;
    const title = (ctx.script.onscreen && ctx.script.onscreen.title) || 'A machine that dreams snapshots';
    K.chapterCard(ctx, { num: '06', title, level: 'L3', levelFrom: 'L3', tier: P.staircase.lit, pending: P.staircase.pending, at: -0.3, out: 'noise-0.4', railHold: 2.6 });
    const T = {}; for (const k of ['noise', 'data', 'wind', 'bend', 'fresh', 'model', 'learn']) T[k] = ctx.at(k + '-0.15');
    const m = C6.val(FM.params.m), s = C6.val(FM.params.s), mh = C6.val(FM.cloud_mh);
    const cx = (B.x0 + B.x1) / 2, cy = (B.y0 + B.y1) / 2, k = (B.y1 - B.y0) / (P.range[1] - P.range[0]) * 1.12;
    const X = (x) => cx + x * k, Y = (y) => cy - y * k;
    const gen = (seed, n) => { const r = S.rng(seed), out = []; while (out.length < n) { const g = C6.gauss(r); out.push(g); } return out; };
    const N0 = gen(P.seed_noise, P.n_particles), N1 = gen(P.seed_fresh, Math.round(P.n_particles / 2));
    const paths = C6.transport(N0, mh, m, s, P.heun_steps), paths2 = C6.transport(N1, mh, m, s, P.heun_steps);
    const jr = S.rng('jit'), ph = N0.map(() => jr() * 6.283);
    const L = K.canvasLayer(ctx, 6, { x: B.x0, y: B.y0, w: B.x1 - B.x0, h: B.y1 - B.y0 }, null, { reset: true });
    // static target: contours, diagonal, cloud1
    const svg = K.svgLayer(ctx, 10), tg = K.s('g', {}, svg);
    const frame = K.s('rect', { x: B.x0, y: B.y0, width: B.x1 - B.x0, height: B.y1 - B.y0, fill: 'none', stroke: K.c('muted'), 'stroke-width': 1.5, opacity: 0 }, svg);
    K.s('line', { x1: X(-2.6 * mh / m), y1: Y(-2.6), x2: X(2.6 * mh / m), y2: Y(2.6), stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '2 8', 'stroke-linecap': 'round' }, tg);
    for (const sg of [1, -1]) for (const w of [1, 2]) K.s('circle', { cx: X(sg * mh), cy: Y(sg * m), r: w * s * k, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2.5, 'stroke-dasharray': '8 7' }, tg);
    for (const [x, y] of FM.cloud1) K.s('circle', { cx: X(x), cy: Y(y), r: 3, fill: K.c('fg'), opacity: 0.6 }, tg);
    const prog = K.s('rect', { x: X(-2.9), y: B.y1 + 12, height: 6, width: 0, fill: K.c('model') }, svg);
    const progBg = K.s('rect', { x: X(-2.9), y: B.y1 + 12, height: 6, width: 5.8 * k, fill: K.c('model'), opacity: 0.2 }, svg);
    // labels
    const lNoise = C6.lab(ctx, 'noise', X(-1.6), cy - 22, 'big right halo');
    const lData = C6.lab(ctx, 'the snapshots we want · one point each', X(1.0) + 40, Y(m) - 120, 'big halo', { w: 420 });
    const lWind = C6.lab(ctx, 'the wind', X(2.2), Y(-1.8), 'big halo'); lWind.style.color = K.c('model');
    const lFresh = C6.lab(ctx, 'new noise → new snapshots', X(-2.0), Y(-1.6), 'big right halo');
    const head = C6.lab(ctx, '{model}generative model{/}: new, plausible examples on demand', 120, 56, 'lead', { html: true });
    const lLearn = C6.lab(ctx, 'the wind: to be learned', X(2.2), Y(-1.8), 'big halo');
    // pen on one arrow (grid cell near the upper blob's approach), at learn
    const AX = P.arrows[0], AY = P.arrows[1], gx = (i) => -3.0 + 6.0 * i / (AX - 1), gy = (j) => -2.4 + 4.8 * j / (AY - 1);
    const pi = Math.round(AX * 0.62), pj = Math.round(AY * 0.6);
    K.pen(ctx, { kind: 'circle', box: { x: X(gx(pi)) - 30, y: Y(gy(pj)) - 30, w: 60, h: 60 }, pad: 8, at: 'learn+0.5', dur: 0.5, seed: 'learn61' });
    K.chip(ctx, { text: 'GENERATED', kind: 'generated', x: X(mh) + 70, y: Y(m) + 60, at: 'model', out: 'learn' });
    K.chip(ctx, { text: 'SCHEMATIC · toy data, exact wind, no network', kind: 'schematic', x: 120, y: 720, at: 'data' });
    K.badge(ctx, { kind: 'CONTEXT', at: 'noise-0.15' });
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: 'Lipman et al. 2023 · flow matching', at: 'model+0.4', hold: 4 });
    K.formulaLayer(ctx);
    ctx.c = { frame, T, L, X, Y, k, B, N0, paths, paths2, ph, tg, prog, progBg, lNoise, lData, lWind, lFresh, head, lLearn, m, s, mh, AX, AY, gx, gy };
  },
  render(t, ctx) {
    const S = Scene, P = ctx.params, c = ctx.c, T = c.T, g = c.L.g, B = c.B;
    g.clearRect(0, 0, B.x1 - B.x0, B.y1 - B.y0);
    g.translate(-B.x0, -B.y0);
    const tau = S.ease.inOutSine(S.seg(t, T.bend, T.bend + P.transport_s, S.ease.linear));
    const tau2 = S.ease.inOutSine(S.seg(t, T.fresh + 0.3, T.fresh + 0.3 + P.fresh_transport_s, S.ease.linear));
    const appear = S.seg(t, T.noise, T.noise + 0.6, S.ease.linear);
    const dimLanded = 1 - 0.7 * S.seg(t, T.fresh, T.fresh + 0.4, S.ease.linear);
    const learnDim = 1 - 0.8 * S.seg(t, T.learn, T.learn + 0.5, S.ease.linear);
    const mcol = S.col('model'), q = [0, 0];
    const drawCloud = (paths, tv, alpha, jit) => {
      if (alpha <= 0) return;
      const dtr = 1 / P.heun_steps;
      if (tv > 0 && tv < 1) {   // fading trails (trail samples behind the head)
        g.strokeStyle = mcol; g.lineWidth = 1.2; g.globalAlpha = alpha * 0.28; g.beginPath();
        for (const p of paths) { for (let j = 0; j <= P.trail; j++) { C6.at(p, Math.max(0, tv - j * dtr * 0.6), q); const x = c.X(q[0]), y = c.Y(q[1]); if (j) g.lineTo(x, y); else g.moveTo(x, y); } }
        g.stroke();
      }
      g.fillStyle = mcol; g.globalAlpha = alpha * 0.75;
      paths.forEach((p, i) => { C6.at(p, tv, q); const jx = jit ? 1.6 * Math.sin(t * 1.7 + c.ph[i % c.ph.length]) : 0, jy = jit ? 1.6 * Math.cos(t * 1.3 + c.ph[i % c.ph.length] * 1.7) : 0; g.fillRect(c.X(q[0]) + jx - 1.2, c.Y(q[1]) + jy - 1.2, 2.4, 2.4); });
    };
    drawCloud(c.paths, tau, appear * dimLanded * learnDim, true);
    if (t > T.fresh) drawCloud(c.paths2, tau2, S.seg(t, T.fresh, T.fresh + 0.3, S.ease.linear) * learnDim, true);
    // arrows of the exact wind at the current transport time (at 0.5 and breathing after 'learn')
    const aOn = S.seg(t, T.wind, T.wind + 0.4, S.ease.linear) * (1 - S.seg(t, T.fresh, T.fresh + 0.4, S.ease.linear));
    const lOn = S.seg(t, T.learn + 0.1, T.learn + 0.6, S.ease.linear);
    const ta = lOn > 0 ? 0.5 : tau, alpha = Math.max(0.35 * aOn, lOn * (0.85 + 0.15 * Math.sin(t * 2.2)));
    if (alpha > 0) {
      g.strokeStyle = mcol; g.lineWidth = 2.5; g.globalAlpha = alpha; g.beginPath();
      const v = [0, 0];
      for (let i = 0; i < c.AX; i++) for (let j = 0; j < c.AY; j++) { const x = c.gx(i), y = c.gy(j); C6.wind(x, y, ta, c.mh, c.m, c.s, v); const sc = 16 * (lOn > 0 ? 1 + 0.06 * Math.sin(t * 2.2) : 1); C6.arrow(g, c.X(x), c.Y(y), Math.max(-60, Math.min(60, v[0] * sc)), Math.max(-60, Math.min(60, -v[1] * sc)), 8); }
      g.stroke();
    }
    C6.fadeS(c.tg, t, T.data, T.learn, 0.4);
    C6.fadeS(c.frame, t, T.noise, Infinity, 0.4, 0.5);
    const pb = S.seg(t, T.wind, T.wind + 0.3, S.ease.linear) * (1 - S.seg(t, T.learn, T.learn + 0.3, S.ease.linear));
    c.prog.setAttribute('width', (5.8 * c.k * Math.max(tau, tau2 > 0 && tau2 < 1 ? tau2 : tau)).toFixed(1));
    c.prog.setAttribute('opacity', pb); c.progBg.setAttribute('opacity', 0.2 * pb);
    C6.fade(c.lNoise, t, T.noise + 0.4, T.bend);
    C6.fade(c.lData, t, T.data + 0.4, T.model);
    C6.fade(c.lWind, t, T.wind + 0.4, T.fresh);
    C6.fade(c.lFresh, t, T.fresh + 0.6, T.learn);
    C6.fade(c.head, t, T.model + 0.1);
    C6.fade(c.lLearn, t, T.learn + 0.7);
  },
});
</script></body></html>
