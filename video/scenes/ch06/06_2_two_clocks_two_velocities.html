<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>06.2 Two clocks, two velocities</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch06.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch06_kit.js"></script>
<style>.neq { position: absolute; z-index: 30; font-family: "Inter Display"; font-weight: 700; font-size: 110px; color: var(--chalk); transform: translate(-50%, -50%); }</style>
</head><body><div id="stage"></div>
<script>
/* 06.2 Two clocks, two velocities (L3, NIGHT, SCHEMATIC: the report's notation, R:260). Left: the violet transport
   clock t from 0 to 1 is not physical time (the grey clock and its film strip); the generator ends on one snapshot,
   not a movie. Right: the wind's arrows v_θ move snapshots, the fluid's velocity u moves fluid: not the same. */
Scene.define({
  duration: 20,
  register: 'night',
  cues: { warning: 0.5, clock: 2.2, notime: 5.6, arrows: 10.3 },
  data: { fm: 'data/fig_flow_matching.json' },
  params: { clock_r: 110, left_x: 520, right_x: 1400, row_y: 400, film_frames: 6, tracers: 160 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, FM = ctx.data.fm.data;
    const T = {}; for (const k of ['warning', 'clock', 'notime', 'arrows']) T[k] = ctx.at(k + '-0.15');
    const svg = K.svgLayer(ctx, 12);
    // the 06.1 cloud (cloud1 of the toy) shrinking to a thumbnail top-left
    const thumbG = K.s('g', {}, svg), c0 = FM.cloud0, c1 = FM.cloud1;
    const dots = c1.map(([x, y]) => K.s('circle', { cx: x * 60, cy: -y * 60, r: 4, fill: K.c('model'), opacity: 0.8 }, thumbG));
    const divider = K.s('line', { x1: 960, x2: 960, y1: 120, y2: 820, stroke: K.c('muted'), 'stroke-width': 2 }, svg);
    // left: the violet transport clock
    const R = P.clock_r, LX = P.left_x, RY = P.row_y;
    const clk = K.s('g', { transform: `translate(${LX},${RY})` }, svg);
    K.s('circle', { r: R, fill: K.c('panel'), stroke: K.c('model'), 'stroke-width': 6 }, clk);
    for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; K.s('line', { x1: 0.82 * R * Math.sin(a), y1: -0.82 * R * Math.cos(a), x2: 0.94 * R * Math.sin(a), y2: -0.94 * R * Math.cos(a), stroke: K.c('model'), 'stroke-width': 3 }, clk); }
    const hand = K.s('line', { x1: 0, y1: 0, x2: 0, y2: -0.78 * R, stroke: K.c('model'), 'stroke-width': 7, 'stroke-linecap': 'round' }, clk);
    K.s('circle', { r: 9, fill: K.c('model') }, clk);
    const l0 = C6.lab(ctx, '0', LX - 34, RY - R - 52, 'big'), l1 = C6.lab(ctx, '1', LX + 18, RY - R - 52, 'big');
    const lT = C6.lab(ctx, 't · transport time', LX, RY + R + 14, 'big center'); lT.innerHTML = '<span class="k-model">t</span> · transport time';
    // thumbnail beside the clock: noise → two blobs (straight interpolation)
    const th = K.s('g', { transform: `translate(${LX + R + 120},${RY})` }, svg);
    K.s('rect', { x: -78, y: -78, width: 156, height: 156, rx: 6, fill: 'none', stroke: K.c('muted'), 'stroke-width': 1.5 }, th);
    const tdots = c1.map(() => K.s('circle', { r: 2.6, fill: K.c('model') }, th));
    // physical time: a grey clock with the film strip behind it
    const gy = RY + R + 170, film = K.s('g', {}, svg);
    const FW = 92, PITCH = 108, fx0 = LX - (P.film_frames * PITCH) / 2;
    K.s('rect', { x: fx0 - 12, y: gy - 46, width: P.film_frames * PITCH + 14, height: 92, rx: 4, fill: K.c('matter-dark'), stroke: K.c('matter'), 'stroke-width': 2 }, film);
    for (let i = 0; i < P.film_frames; i++) K.s('rect', { x: fx0 + i * PITCH, y: gy - 30, width: FW, height: 60, rx: 3, fill: K.c('panel'), stroke: K.c('matter'), 'stroke-width': 1.5 }, film);
    const gclk = K.s('g', { transform: `translate(${LX},${gy})` }, svg);
    K.s('circle', { r: 52, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 4 }, gclk);
    K.s('path', { d: 'M0,-34 V0 L24,14', fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 4, 'stroke-linecap': 'round' }, gclk);
    const lPhys = C6.lab(ctx, 'physical time', LX, gy + 54, 'big center');
    const link = K.s('line', { x1: LX - R - 20, y1: RY + 40, x2: fx0 + 30, y2: gy - 48, stroke: K.c('fg-2'), 'stroke-width': 3, 'stroke-dasharray': '8 8' }, svg);
    const mx = (LX - R - 20 + fx0 + 30) / 2, my = (RY + 40 + gy - 48) / 2;
    K.pen(ctx, { kind: 'cross', box: { x: mx - 28, y: my - 28, w: 56, h: 56 }, at: 'notime+0.6', dur: 0.35, seed: 'x62' });
    // one snapshot pops out at the end of the hand
    const photo = K.s('g', {}, svg);
    K.s('rect', { x: LX + 40, y: RY - R - 120, width: 120, height: 84, rx: 6, fill: K.c('panel'), stroke: K.c('model'), 'stroke-width': 4 }, photo);
    [0.25, 0.5, 0.75].forEach((f) => K.s('circle', { cx: LX + 40 + f * 120, cy: RY - R - 78, r: 15, fill: 'none', stroke: K.c('matter'), 'stroke-width': 2.5 }, photo));
    const lMov = C6.lab(ctx, 'the generator makes snapshots, not movies', LX, 812, 'big center');
    // right: two velocities
    const svgR = K.svgLayer(ctx, 14);
    const pv = { x: 1010, y: 300, w: 360, h: 260 }, pu = { x: 1460, y: 300, w: 360, h: 260 };
    const panels = K.s('g', {}, svgR);
    [pv, pu].forEach((b) => K.s('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 8, fill: 'none', stroke: K.c('muted'), 'stroke-width': 1.5 }, panels));
    const rr = S.rng('v62'), vdots = []; for (let i = 0; i < 46; i++) { const g = C6.gauss(rr); vdots.push({ e: K.s('circle', { r: 3.5, fill: K.c('model'), opacity: 0.8 }, svgR), x: pv.x + 110 + g[0] * 34, y: pv.y + 150 + g[1] * 34, ph: rr() }); }
    const arr = (b, col) => { const g = K.s('g', {}, svgR); K.s('path', { d: `M${b.x + 50},${b.y + b.h / 2 + 40} Q${b.x + b.w / 2},${b.y + 60} ${b.x + b.w - 50},${b.y + b.h / 2 - 20}`, fill: 'none', stroke: K.c(col), 'stroke-width': 8, 'stroke-linecap': 'round' }, g);
      K.s('path', { d: `M${b.x + b.w - 78},${b.y + b.h / 2 - 40} L${b.x + b.w - 50},${b.y + b.h / 2 - 20} L${b.x + b.w - 82},${b.y + b.h / 2 - 2}`, fill: 'none', stroke: K.c(col), 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g); return g; };
    const aV = arr(pv, 'model'), aU = arr(pu, 'u');
    const lV = C6.lab(ctx, '', pv.x + pv.w / 2, pv.y + pv.h + 14, 'big center'); lV.innerHTML = '<span class="k-model">v<sub>θ</sub></span> · moves snapshots';
    const lU = C6.lab(ctx, '', pu.x + pu.w / 2 - 20, pu.y + pu.h + 14, 'big center'); lU.innerHTML = '<span class="k-u">u</span> · moves fluid';
    const neq = K.el('div', { class: 'neq' }, st, '≠'); neq.style.left = ((pv.x + pv.w + pu.x) / 2) + 'px'; neq.style.top = (pv.y + pv.h / 2) + 'px';
    const W = pu.w, H = pu.h, A = 60;
    K.tracers(ctx, { F: (x, y) => { const X = (x - pu.x) / W * 2 * Math.PI, Y = (y - pu.y) / H * Math.PI; return [A * Math.sin(X) * Math.cos(Y), -A * 2 * Math.cos(X) * Math.sin(Y) * H / W]; },
      box: { x: pu.x + 4, y: pu.y + 4, w: W - 8, h: H - 8 }, n: P.tracers, trail: 8, color: 'u', at: 'arrows+0.1', seed: 't62', alpha: 0.6 });
    K.chip(ctx, { text: 'SCHEMATIC · notation of the report', kind: 'schematic', x: 1010, y: 150, at: -0.3 });
    K.badge(ctx, { kind: 'SCHEMATIC', at: -0.3 });
    K.formulaLayer(ctx);
    ctx.c = { panels, T, thumbG, dots, divider, clk, hand, l0, l1, lT, th, tdots, c0, c1, film, gclk, lPhys, link, photo, lMov, aV, aU, lV, lU, neq, vdots, pv, R };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.c, T = c.T, ease = S.ease.inOutCubic;
    const sh = S.seg(t, T.warning, T.warning + 1.0, ease);
    const sc = 1 - 0.55 * sh, x = 480 + (200 - 480) * sh, y = 440 + (170 - 440) * sh;
    c.thumbG.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(3)})`);
    c.thumbG.setAttribute('opacity', (1 - 0.5 * sh).toFixed(3));
    const dv = S.seg(t, T.warning + 0.4, T.warning + 1.0, S.ease.linear); c.divider.setAttribute('y2', 120 + 700 * dv); c.divider.setAttribute('opacity', dv > 0 ? 1 : 0);
    C6.fadeS(c.clk, t, T.clock); [c.l0, c.l1, c.lT].forEach((e) => C6.fade(e, t, T.clock + 0.2));
    const sw = S.seg(t, T.clock + 0.3, T.clock + 2.3, S.ease.inOutSine);
    c.hand.setAttribute('transform', `rotate(${(360 * sw).toFixed(2)})`);
    C6.fadeS(c.th, t, T.clock + 0.2);
    c.tdots.forEach((d, i) => { const a = c.c0[i % c.c0.length], b = c.c1[i]; d.setAttribute('cx', ((a[0] + (b[0] - a[0]) * sw) * 30).toFixed(1)); d.setAttribute('cy', (-(a[1] + (b[1] - a[1]) * sw) * 30).toFixed(1)); });
    [c.film, c.gclk, c.link].forEach((e) => C6.fadeS(e, t, T.notime)); C6.fade(c.lPhys, t, T.notime + 0.2);
    const pp = S.seg(t, T.notime + 1.2, T.notime + 1.5, S.ease.outCubic); c.photo.setAttribute('opacity', pp); c.photo.setAttribute('transform', `translate(0 ${(16 * (1 - pp)).toFixed(1)})`);
    C6.fade(c.lMov, t, T.notime + 1.6);
    const ar = S.seg(t, T.arrows, T.arrows + 0.4, S.ease.linear), br = 1 + 0.03 * Math.sin(t * 2.4);
    [c.aV, c.aU].forEach((a, i) => { a.setAttribute('opacity', ar); const b = i ? { x: 1460, y: 300 } : c.pv; a.setAttribute('transform', `translate(${b.x + 180} ${b.y + 130}) scale(${br.toFixed(3)}) translate(${-b.x - 180} ${-b.y - 130})`); });
    C6.fadeS(c.panels, t, T.arrows - 0.1);
    C6.fade(c.lV, t, T.arrows + 0.3); C6.fade(c.lU, t, T.arrows + 0.6); C6.fade(c.neq, t, T.arrows + 1.2);
    c.vdots.forEach((d) => { const u = ((t - T.arrows) * 0.25 + d.ph) % 1; d.e.setAttribute('cx', (d.x + 150 * u).toFixed(1)); d.e.setAttribute('cy', (d.y - 50 * Math.sin(Math.PI * u)).toFixed(1)); d.e.setAttribute('opacity', (0.8 * ar * Math.sin(Math.PI * u)).toFixed(3)); });
  },
});
</script></body></html>
