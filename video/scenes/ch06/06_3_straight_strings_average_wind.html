<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>06.3 Straight strings, average wind</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch06.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch06_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 06.3 Straight strings, average wind (L3, NIGHT, PROVED: the regression minimiser is the conditional average,
   R:296; transport theorem, Lipman et al. 2023). The site's Figure 4 a-b animated: one coordinate up, the transport
   clock across; straight noise-data strings cross everywhere; at one place and moment the network learns their
   average direction; the averaged wind's paths bend and, drawn against the clock, never cross. SCHEMATIC toy data. */
Scene.define({
  duration: 50,
  register: 'night',
  cues: { how: 0.5, unroll: 3.4, strings: 7.4, many: 11.4, probe: 14.6, pass: 16.8, average: 19.6, regression: 23.4, follow: 28.4, curve: 30.6, land: 34.6 },
  data: { fm: 'data/fig_flow_matching.json' },
  params: { box: { x0: 260, x1: 1480, y0: 140, y1: 700 }, x_range: [-3.3, 3.3], n_strings: 2400, string_alpha: 0.07, pairs_one_by_one_s: 0.08,
    inset: { x0: 1540, x1: 1800, y0: 200, y1: 430 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, B = P.box, st = ctx.stage, FM = ctx.data.fm.data;
    const T = {}; for (const k of ['how', 'unroll', 'strings', 'many', 'probe', 'pass', 'average', 'regression', 'follow', 'curve', 'land']) T[k] = ctx.at(k + '-0.15');
    const m = C6.val(FM.params.m), s = C6.val(FM.params.s), fan = { t: C6.val(FM.fan.t), x: C6.val(FM.fan.x), v: C6.val(FM.fan.v), pairs: C6.val(FM.fan.pairs), weights: C6.val(FM.fan.weights) };
    const traj = C6.val(FM.traj.lam2), grid = FM.grid, field = FM.field;
    const X = (t) => B.x0 + t * (B.x1 - B.x0), ky = (B.y1 - B.y0) / (P.x_range[1] - P.x_range[0]), Y = (x) => (B.y0 + B.y1) / 2 - x * ky;
    // the web of strings, drawn once into an offscreen canvas (setup), shown with an alpha
    const off = document.createElement('canvas'), d = window.devicePixelRatio || 1;
    off.width = (B.x1 - B.x0 + 20) * d; off.height = (B.y1 - B.y0 + 20) * d;
    const og = off.getContext('2d'); og.scale(d, d); og.translate(-B.x0 + 10, -B.y0 + 10);
    og.strokeStyle = S.col('fg'); og.lineWidth = 1; og.globalAlpha = P.string_alpha; og.beginPath();
    const r = S.rng('strings');
    for (let i = 0; i < P.n_strings; i++) { const x0 = C6.gauss(r)[0], g = C6.gauss(r)[0], x1 = (r() < 0.5 ? m : -m) + s * g; og.moveTo(X(0), Y(x0)); og.lineTo(X(1), Y(x1)); }
    og.stroke();
    const L = K.canvasLayer(ctx, 6, { x: B.x0 - 10, y: B.y0 - 10, w: B.x1 - B.x0 + 20, h: B.y1 - B.y0 + 20 }, null, { reset: true });
    // axes
    const svg = K.svgLayer(ctx, 12), ax = K.s('g', {}, svg);
    K.s('line', { x1: B.x0, x2: B.x0, y1: B.y0, y2: B.y1, stroke: K.c('muted'), 'stroke-width': 2 }, ax);
    const tAxis = K.s('line', { x1: B.x0, x2: B.x0, y1: B.y1, y2: B.y1, stroke: K.c('model'), 'stroke-width': 3 }, svg);
    const lY = C6.lab(ctx, 'one coordinate', B.x0 - 12, B.y0 - 52, 'halo');
    const lT = C6.lab(ctx, 't · transport time, not physical time', B.x0 + 44, B.y1 + 14, ''); lT.innerHTML = '<span class="k-model">t</span> · transport time, not physical time';
    const l0 = C6.lab(ctx, '0', B.x0, B.y1 + 14, 'center'), l1 = C6.lab(ctx, '1', B.x1 + 16, B.y1 - 22, '');
    const lNoise = C6.lab(ctx, 'noise', B.x0 + 14, B.y0 - 6, 'big halo'), lData = C6.lab(ctx, 'data', B.x1 - 14, B.y0 - 6, 'big right halo');
    // the two clouds that unroll to the edges (cloud0 noise, cloud1 data; vertical coordinate kept)
    const c0 = FM.cloud0, c1 = FM.cloud1, cl = K.s('g', {}, svg);
    const cdots = c0.map(([a, b]) => ({ e: K.s('circle', { r: 3.5, fill: K.c('model') }, cl), sx: 420 + a * 40, sy: 420 - b * 40, ex: X(0), ey: Y(b) }))
      .concat(c1.map(([a, b]) => ({ e: K.s('circle', { r: 3.5, fill: K.c('fg') }, cl), sx: 420 + a * 40, sy: 420 - b * 40, ex: X(1), ey: Y(b) })));
    const lStr = C6.lab(ctx, 'straight strings', X(0.5), B.y0 - 52, 'big center halo');
    // probe, fan, average
    const px = X(fan.t), py = Y(fan.x);
    K.pen(ctx, { kind: 'circle', box: { x: px - 26, y: py - 26, w: 52, h: 52 }, pad: 6, at: 'probe+0.1', out: 'follow', dur: 0.5, seed: 'probe63' });
    const lProbe = C6.lab(ctx, 'one place, one moment', px + 60, py - 110, 'big halo');
    const lAvg = C6.lab(ctx, 'average direction', px + 60, py - 110, 'big halo'); lAvg.style.color = K.c('model');
    // inset: regression lands on the average (schematic)
    const I = P.inset, inset = K.s('g', {}, svg), ir = S.rng('inset');
    K.s('rect', { x: I.x0, y: I.y0, width: I.x1 - I.x0, height: I.y1 - I.y0, rx: 6, fill: K.c('panel'), stroke: K.c('muted'), 'stroke-width': 1.5 }, inset);
    const lineY = (u) => I.y1 - 30 - u * (I.y1 - I.y0 - 60);
    for (let i = 0; i < 40; i++) { const u = ir(), g = C6.gauss(ir)[0]; K.s('circle', { cx: I.x0 + 20 + u * (I.x1 - I.x0 - 40), cy: lineY(u) + g * 22, r: 3.5, fill: K.c('fg-2') }, inset); }
    K.s('line', { x1: I.x0 + 14, x2: I.x1 - 14, y1: lineY(-0.03), y2: lineY(1.03), stroke: K.c('model'), 'stroke-width': 4 }, inset);
    const us = 0.62, sxl = I.x0 + 20 + us * (I.x1 - I.x0 - 40);
    K.s('line', { x1: sxl, x2: sxl, y1: I.y0 + 12, y2: I.y1 - 12, stroke: K.c('chalk'), 'stroke-width': 2, 'stroke-dasharray': '5 6' }, inset);
    for (const g of [-1.3, -0.6, 0.2, 0.9, 1.5]) K.s('circle', { cx: sxl, cy: lineY(us) + g * 22, r: 4.5, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 2.5 }, inset);
    K.s('circle', { cx: sxl, cy: lineY(us), r: 8, fill: K.c('model') }, inset);
    const lReg = C6.lab(ctx, 'regression: the fit lands on the average', (I.x0 + I.x1) / 2, I.y1 + 14, 'center', { w: 300 }); lReg.style.textAlign = 'center';
    K.chip(ctx, { text: 'SCHEMATIC', kind: 'schematic', x: I.x1, y: I.y0 - 12, anchor: 'br', at: 'regression', out: 'follow' });
    // trajectories (exact, λ fixed) and closest approach of neighbours
    const pmax = Math.max(...field.map((f) => f.p));
    let best = { d: 1e9 };
    const tsorted = traj.map((tr) => tr.map(([t, x]) => [X(t), Y(x)]));
    for (let k = 0; k + 1 < traj.length; k++) for (let j = Math.floor(traj[k].length * 0.3); j < traj[k].length - 2; j++) { const dd = Math.abs(traj[k + 1][j][1] - traj[k][j][1]); if (dd < best.d) best = { d: dd, x: X(traj[k][j][0]), y: (Y(traj[k][j][1]) + Y(traj[k + 1][j][1])) / 2 }; }
    K.pen(ctx, { kind: 'check', box: { x: best.x - 22, y: best.y - 60, w: 44, h: 44 }, at: 'curve+2.6', dur: 0.4, seed: 'chk63' });
    const lCurve = C6.lab(ctx, 'drawn against the clock, paths never cross', X(0.5), B.y0 - 52, 'big center halo');
    const lLand = C6.lab(ctx, 'noise → data', X(0.5), B.y1 + 14, 'big center halo');
    K.chip(ctx, { text: 'SCHEMATIC · 1D toy law, exact wind, no network', kind: 'schematic', x: 96, y: 800, at: 'unroll', out: 'average+0.4' });
    K.chip(ctx, { text: 'SCHEMATIC · 1D toy law, exact wind, no network', kind: 'schematic', x: 96, y: 800, at: 'average+4.9' });
    K.badge(ctx, { kind: 'PROVED', note: 'R:296 · P7 Proposition 5.2 · Lipman et al. 2023', at: -0.3 });
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: 'Lipman et al. 2023 · Liu et al. 2023', at: 'average+0.6', hold: 4 });
    K.formulaLayer(ctx);
    ctx.c = { T, L, off, B, X, Y, ky, tAxis, ax, lY, lT, l0, l1, lNoise, lData, cl, cdots, lStr, px, py, lProbe, lAvg, inset, lReg, fan, field, pmax, tsorted, lCurve, lLand, grid, pdfN: FM.pdf_noise, pdfL: FM.pdf_law2, m };
  },
  render(t, ctx) {
    const S = Scene, P = ctx.params, c = ctx.c, T = c.T, B = c.B, g = ctx.c.L.g, ease = S.ease.inOutCubic;
    g.clearRect(0, 0, B.x1 - B.x0 + 20, B.y1 - B.y0 + 20); g.translate(-B.x0 + 10, -B.y0 + 10);
    const un = S.seg(t, T.unroll, T.unroll + 1.6, ease);
    C6.fadeS(c.cl, t, -0.3, T.follow, 0.4);
    c.cdots.forEach((d) => { d.e.setAttribute('cx', (d.sx + (d.ex - d.sx) * un).toFixed(1)); d.e.setAttribute('cy', (d.sy + (d.ey - d.sy) * un).toFixed(1)); });
    c.tAxis.setAttribute('x2', (B.x0 + (B.x1 - B.x0) * un).toFixed(1));
    C6.fadeS(c.ax, t, T.unroll); [c.lY, c.lT, c.l0, c.l1].forEach((e) => C6.fade(e, t, T.unroll + 1.0));
    C6.fade(c.lNoise, t, T.unroll + 1.2, T.probe); C6.fade(c.lData, t, T.unroll + 1.2, T.probe);
    const dimP = 1 - 0.75 * S.seg(t, T.probe, T.probe + 0.4, S.ease.linear) * (1 - S.seg(t, T.follow, T.follow + 0.4, S.ease.linear));
    const follow = S.seg(t, T.follow, T.follow + 0.6, S.ease.linear);
    // the 34 pairs one by one
    const FM = ctx.data.fm.data, nP = FM.pairs.length;
    const shown = Math.min(nP, Math.max(0, Math.floor((t - T.strings) / P.pairs_one_by_one_s)));
    if (shown > 0) {
      g.strokeStyle = S.col('fg'); g.lineWidth = 2; g.globalAlpha = 0.7 * dimP * (1 - 0.9 * follow); g.beginPath();
      for (let i = 0; i < shown; i++) { const [a, b] = FM.pairs[i]; g.moveTo(c.X(0), c.Y(a)); g.lineTo(c.X(1), c.Y(b)); }
      g.stroke();
    }
    const web = S.seg(t, T.many, T.many + 0.8, S.ease.linear);
    if (web > 0) { g.globalAlpha = web * dimP * (1 - 0.85 * follow); g.drawImage(c.off, B.x0 - 10, B.y0 - 10, B.x1 - B.x0 + 20, B.y1 - B.y0 + 20); }
    C6.fade(c.lStr, t, T.strings + 0.4, T.probe);
    // the fan through the probe, then the average arrow
    const pass = S.seg(t, T.pass, T.pass + 0.4, S.ease.linear) * (1 - S.seg(t, T.follow, T.follow + 0.4, S.ease.linear));
    const merge = S.seg(t, T.average, T.average + 0.8, ease);
    const dir = (sl, len) => { const dx = c.B.x1 - c.B.x0, dy = -c.ky * sl, n = Math.hypot(dx, dy); return [dx / n * len, dy / n * len]; };
    if (pass > 0) {
      g.globalAlpha = pass * (1 - 0.6 * merge); g.strokeStyle = S.col('fg');
      c.fan.pairs.forEach(([a, b]) => { g.lineWidth = 1.5 + 4 * (b > 0 ? c.fan.weights[0] : c.fan.weights[1]); g.beginPath(); g.moveTo(c.X(0), c.Y(a)); g.lineTo(c.X(1), c.Y(b)); g.stroke(); });
      c.fan.pairs.forEach(([a, b]) => { const sl = b - a, [dx, dy] = dir(sl * (1 - merge) + c.fan.v * merge, 90); g.globalAlpha = pass * (1 - merge); g.lineWidth = 3; g.strokeStyle = S.col('chalk'); g.beginPath(); C6.arrow(g, c.px, c.py, dx, dy, 14); g.stroke(); });
      if (merge > 0) { const [dx, dy] = dir(c.fan.v, 130); g.globalAlpha = merge; g.lineWidth = 9; g.strokeStyle = S.col('model'); g.lineCap = 'round'; g.beginPath(); C6.arrow(g, c.px, c.py, dx, dy, 26); g.stroke(); }
    }
    C6.fade(c.lProbe, t, T.probe + 0.3, T.average); C6.fade(c.lAvg, t, T.average + 0.6, T.follow);
    C6.fadeS(c.inset, t, T.regression, T.follow); C6.fade(c.lReg, t, T.regression + 0.3, T.follow);
    // the averaged wind everywhere, then the exact trajectories
    if (follow > 0) {
      g.strokeStyle = S.col('model'); g.lineWidth = 3; g.lineCap = 'round';
      for (const f of c.field) { const [dx, dy] = dir(f.v, 46); g.globalAlpha = follow * (0.15 + 0.85 * f.p / c.pmax) * (1 - 0.5 * S.seg(t, T.curve, T.curve + 0.5, S.ease.linear)); g.beginPath(); C6.arrow(g, c.X(f.t) - dx / 2, c.Y(f.x) - dy / 2, dx, dy, 10); g.stroke(); }
    }
    const cv = S.seg(t, T.curve, T.curve + 2.5, S.ease.inOutSine);
    if (cv > 0) {
      g.globalAlpha = 1; g.strokeStyle = S.col('model'); g.lineWidth = 4; g.lineJoin = 'round'; g.beginPath();
      for (const tr of c.tsorted) { const n = Math.max(2, Math.round(tr.length * cv)); g.moveTo(tr[0][0], tr[0][1]); for (let j = 1; j < n; j++) g.lineTo(tr[j][0], tr[j][1]); }
      g.stroke();
    }
    C6.fade(c.lCurve, t, T.curve + 0.6);
    // end profiles drawn sideways along the two edges
    const ld = S.seg(t, T.land, T.land + 1.0, S.ease.linear);
    if (ld > 0) {
      const mN = Math.max(...c.pdfN), mL = Math.max(...c.pdfL);
      g.globalAlpha = ld; g.strokeStyle = S.col('fg-2'); g.lineWidth = 2.5;
      g.beginPath(); c.grid.forEach((x, i) => { const px = c.X(0) + 120 * c.pdfN[i] / mN, py = c.Y(x); if (i) g.lineTo(px, py); else g.moveTo(px, py); }); g.stroke();
      g.beginPath(); c.grid.forEach((x, i) => { const px = c.X(1) - 120 * c.pdfL[i] / mL, py = c.Y(x); if (i) g.lineTo(px, py); else g.moveTo(px, py); }); g.stroke();
      g.fillStyle = S.col('model'); for (const tr of c.tsorted) { const e = tr[tr.length - 1]; g.globalAlpha = ld * (0.6 + 0.4 * Math.sin(t * 3)); g.beginPath(); g.arc(e[0], e[1], 8, 0, 6.283); g.fill(); }
    }
    C6.fade(c.lLand, t, T.land + 0.6);
    if (t > T.land) c.lT.style.opacity = (1 - S.seg(t, T.land, T.land + 0.3, S.ease.linear)).toFixed(3);
  },
});
</script></body></html>
