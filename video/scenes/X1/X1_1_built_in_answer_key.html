<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X1.1 A built-in answer key</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X1.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>

</head><body><div id="stage"></div>
<script>
/* X1.1 A built-in answer key (L4, NIGHT, MEASURED: E3, Rm 2, exact check). B = u for the ABC flow: no stretching,
   diffusion only, s = −1/Rm. The in-plane arrows at z = 0 come from the closed form with A, B, C from
   data/e3_growth.json config; the bound, the measured rate and the late fit are read from the same file. */
Scene.define({
  duration: 39, register: 'night',
  cues: { key: 0.6, copy: 4.0, nostretch: 8.8, fade: 13.4, bound: 18.6, measure: 25.4 },
  data: { e3: 'data/e3_growth.json' },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, E3 = ctx.data.e3, EC = E3.exact_check, cf = E3.config, LA = P.lattice, LY = P.layout;
    window.__EVENTS__ = [{ t: +(ctx.at('measure') + 0.5).toFixed(3), id: 'pop', gain_db: -24 }];
    K.rail(ctx, { from: 'L4', to: 'L4', at: -0.2, hold: 3 });
    const MT = P.module_tag; K.lowerThird(ctx, { kind: 'chapter', l1: MT.l1, l2: MT.l2, at: -0.2, out: Math.min(MT.hold, ctx.at('copy') - 0.3) });
    K.badge(ctx, { kind: 'MEASURED', note: 'E3 · Rm 2 · exact check · R:1116', at: -0.3 });
    XK.title(ctx, 'A built-in answer key', 'key-0.15', { x: 140, y: P.title_y - 24 });
    // answer slot
    const slot = K.chip(ctx, { text: '? = known answer', kind: 'schematic', x: LY.right.x0 + 40, y: LY.right.y0 - 40, at: 'key', out: 'bound-0.15' });
    void slot;
    // lattice
    const L = LY.left, n = LA.n, svg = K.svgLayer(ctx, 12), x0 = L.x0 + 60, x1 = L.x1 - 60, y0 = 410, y1 = L.y1 - 10;
    const arrows = [], rng = S.rng(LA.seed), ord = [];
    let vmax = 0; const U = (x, y) => [cf.C * Math.cos(y) + cf.A * Math.sin(0), cf.B * Math.sin(x) + cf.A * Math.cos(0)];
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const v = U(2 * Math.PI * i / n, 2 * Math.PI * j / n); vmax = Math.max(vmax, Math.hypot(v[0], v[1])); }
    const arrowD = (cx, cy, vx, vy, s) => { const L2 = LA.max_len_px * s, len = Math.hypot(vx, vy) / vmax * L2, a = Math.atan2(-vy, vx), ex = cx + len * Math.cos(a) / 2, ey = cy + len * Math.sin(a) / 2, sx = cx - len * Math.cos(a) / 2, sy = cy - len * Math.sin(a) / 2, h = Math.min(12, len * 0.4);
      return `M${sx.toFixed(1)},${sy.toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)} M${(ex - h * Math.cos(a - 0.5)).toFixed(1)},${(ey - h * Math.sin(a - 0.5)).toFixed(1)} L${ex.toFixed(1)},${ey.toFixed(1)} L${(ex - h * Math.cos(a + 0.5)).toFixed(1)},${(ey - h * Math.sin(a + 0.5)).toFixed(1)}`; };
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const cx = x0 + (x1 - x0) * i / (n - 1), cy = y1 - (y1 - y0) * j / (n - 1), v = U(2 * Math.PI * i / n, 2 * Math.PI * j / n);
      const u = K.s('path', { d: arrowD(cx, cy, v[0], v[1], 1), fill: 'none', stroke: K.c('u'), 'stroke-width': 3, 'stroke-linecap': 'round' }, svg);
      const b = K.s('path', { fill: 'none', stroke: K.c('b'), 'stroke-width': 3, 'stroke-linecap': 'round' }, svg);
      arrows.push({ cx, cy, v, u, b }); ord.push(rng()); }
    const rank = ord.map((r, i) => [r, i]).sort((a, b) => a[0] - b[0]).map((p) => p[1]), delay = new Array(arrows.length); rank.forEach((i, k) => { delay[i] = k * 0.03; });
    const ug = arrows.map((a) => a.u); ug.forEach((e) => XK.timed(ctx, e, 'copy-0.15', null, { din: 0.4 }));
    K.chip(ctx, { text: 'slice z = 0 · in-plane arrows', kind: 'plain', x: L.x0, y: L.y1 + 20, at: 'copy' });
    XK.lab(ctx, '{b}B{/} = {u}u{/}', L.x1 - 20, 300, { anchor: 'r', size: 44, at: 'copy+0.4', out: 'nostretch-0.15' });
    // equation (callback of 03.1)
    const EQ = P.equation;
    const E = K.equation(ctx, { tex: EQ.tex, x: EQ.x, y: EQ.y - 50, size: 56, at: 'nostretch-0.15', reveal: [],
      labels: [{ id: 'adv', text: 'carried and stretched by the flow', color: 'u', at: 'nostretch+0.2', out: 'nostretch+0.9' }],
      focus: [{ ids: ['lhs', 'eq', 'plus', 'diff'], at: 'nostretch+1.2' }] });
    const bx = E.box('adv');
    K.pen(ctx, { kind: 'cross', box: bx, at: 'nostretch+1.0' });
    XK.lab(ctx, '= 0 · {u}u{/} × {b}B{/} = {u}u{/} × {u}u{/} = 0', bx.x, bx.y + bx.h + 64, { cls: 'small', at: 'nostretch+1.3', out: 'fade-0.15' });
    K.pen(ctx, { kind: 'box', box: E.box('diff'), at: 'fade' });
    XK.lab(ctx, 'diffusion only · shape kept', E.box('diff').x - 60, E.box('diff').y + E.box('diff').h + 16, { cls: 'small', at: 'fade+0.3', out: 'bound-0.15' });
    XK.tex(ctx, 's = -1/\\Rm', L.x0 + 20, 300, { size: 48, at: 'fade+0.5' });
    K.chip(ctx, { text: 'time compressed · shape exact', kind: 'plain', x: L.x0, y: L.y1 + 64, at: 'fade+1.0' });
    // ruler
    const R = P.ruler, X = (v) => R.x0 + (R.x1 - R.x0) * (v - R.min) / (R.max - R.min), rg = K.s('g', {}, svg);
    K.s('line', { x1: R.x0, x2: R.x1, y1: R.y, y2: R.y, stroke: K.c('muted'), 'stroke-width': 2 }, rg);
    R.ticks.forEach((v) => { K.s('line', { x1: X(v), x2: X(v), y1: R.y, y2: R.y + 10, stroke: K.c('muted'), 'stroke-width': 2 }, rg); K.s('text', { x: X(v), y: R.y + 44, 'text-anchor': 'middle', class: 'kt-tick' }, rg, K.fmt(v, 2)); });
    K.s('text', { x: R.x1, y: R.y + 90, 'text-anchor': 'end', class: 'kt-axis' }, rg, R.label);
    for (let x = R.x0; x < X(EC.bound) - 6; x += 14) K.s('line', { x1: x, y1: R.y - 4, x2: x + 12, y2: R.y - 40, stroke: K.c('muted'), 'stroke-width': 2, opacity: 0.5 }, rg);
    K.s('line', { x1: X(EC.bound), x2: X(EC.bound), y1: R.y - 50, y2: R.y + 12, stroke: K.c('chalk'), 'stroke-width': 4 }, rg);
    XK.timed(ctx, rg, 'bound-0.15', null);
    K.chip(ctx, { text: `Rm = ${EC.Rm}`, kind: 'param', x: R.x1 - 150, y: R.y - 110, at: 'bound' });
    XK.lab(ctx, `exact mode: −1/Rm = ${K.fmt(EC.bound, 2)}`, X(EC.bound) + 14, R.y - 92, { cls: 'small', at: 'bound+0.3' });
    XK.lab(ctx, 'the dominant rate cannot be here', R.x0, R.y + 100, { cls: 'small', color: 'muted', at: 'bound+0.6' });
    K.chip(ctx, { text: `dominant rate ≥ ${K.fmt(EC.bound, 2)}`, kind: '', x: LY.right.x0 + 40, y: LY.right.y0 - 40, at: 'bound' });
    const pin = K.s('g', {}, svg); K.s('line', { x1: 0, y1: -40, x2: 0, y2: 0, stroke: K.c('b'), 'stroke-width': 4 }, pin); K.s('circle', { cx: 0, cy: -44, r: 10, fill: K.c('b') }, pin);
    XK.lab(ctx, `measured: ${K.fmt(EC.s, 4)}`, X(EC.s) + 20, R.y - 56, { color: 'b', cls: 'small', at: 'measure+0.6' });
    // magnifier
    const MG = Object.assign({}, P.magnifier, { cx: 1580, cy: 620, r: 110 }), mg = K.s('g', {}, svg), mx0 = MG.cx - MG.r + 30, mx1 = MG.cx + MG.r - 30, MX = (v) => mx0 + (mx1 - mx0) * (v - MG.range[0]) / (MG.range[1] - MG.range[0]);
    K.s('circle', { cx: MG.cx, cy: MG.cy, r: MG.r, fill: K.c('panel'), stroke: K.c('muted'), 'stroke-width': 2 }, mg);
    K.s('line', { x1: X(EC.bound), y1: R.y + 12, x2: MG.cx - MG.r * 0.7, y2: MG.cy - MG.r * 0.7, stroke: K.c('muted'), 'stroke-width': 1.5 }, mg);
    K.s('line', { x1: X(EC.bound), y1: R.y + 12, x2: MG.cx + MG.r * 0.7, y2: MG.cy - MG.r * 0.7, stroke: K.c('muted'), 'stroke-width': 1.5 }, mg);
    K.s('line', { x1: mx0, x2: mx1, y1: MG.cy, y2: MG.cy, stroke: K.c('muted'), 'stroke-width': 2 }, mg);
    MG.ticks.forEach((v, k) => { K.s('line', { x1: MX(v), x2: MX(v), y1: MG.cy, y2: MG.cy + 8, stroke: K.c('muted'), 'stroke-width': 2 }, mg); if (k % 3 === 0) K.s('text', { x: MX(v), y: MG.cy + 40, 'text-anchor': 'middle', class: 'kt-tick' }, mg, K.fmt(v, 5)); });
    K.s('line', { x1: MX(EC.bound), x2: MX(EC.bound), y1: MG.cy - 30, y2: MG.cy + 10, stroke: K.c('chalk'), 'stroke-width': 3 }, mg);
    const late = E3.series[1].y[0];
    K.s('circle', { cx: MX(EC.s), cy: MG.cy - 26, r: 9, fill: K.c('b') }, mg); K.s('circle', { cx: MX(late), cy: MG.cy - 56, r: 9, fill: K.c('bg'), stroke: K.c('b'), 'stroke-width': 3 }, mg);
    XK.timed(ctx, mg, 'measure+1.2', null, { din: 0.5 });
    XK.lab(ctx, '● long fit · second half', LY.right.x0, 650, { cls: 'small', color: 'b', at: 'measure+1.5' });
    XK.lab(ctx, '○ late fit · last quarter', LY.right.x0, 690, { cls: 'small', color: 'b', at: 'measure+1.6' });
    const rel = Math.abs(EC.s - EC.bound) / Math.abs(EC.bound), dlt = Math.abs(EC.s - late);
    XK.lab(ctx, `on the bound to about 1 part in ${K.pow10(Math.pow(10, Math.round(-Math.log10(rel))))} · the two fits differ by ${K.fmt(dlt, 1)}`, LY.right.x0, 520, { w: 440, cls: 'small', color: 'muted', at: 'measure+2.0' });
    K.pen(ctx, { kind: 'check', box: { x: LY.right.x0 + 420, y: LY.right.y0 - 50, w: 40, h: 36 }, at: 'measure+2.4' });
    K.lowerThird(ctx, { kind: 'source', data: E3, at: 'measure+0.4', hold: 5 });
    K.formulaLayer(ctx, { label: 'Formula · R:1116, R:1066' });
    ctx.x11 = { arrows, delay, arrowD, tC: ctx.at('copy-0.15'), tF: ctx.at('fade-0.15'), pin, X, R, EC, tM: ctx.at('measure-0.15'), LA };
  },
  render(t, ctx) {
    const S = Scene, c = ctx.x11, br = 1 + c.LA.breathe.amp * Math.sin(2 * Math.PI * t / c.LA.breathe.period_s);
    const sh = 1 - (1 - c.LA.shrink_to) * S.seg(t, c.tF, c.tF + c.LA.shrink_dur, S.ease.outCubic);
    c.arrows.forEach((a, i) => { const p = S.seg(t, c.tC + 0.6 + c.delay[i], c.tC + 1.2 + c.delay[i], S.ease.outCubic);
      a.b.setAttribute('d', c.arrowD(a.cx + 4 + 30 * (1 - p), a.cy - 4, a.v[0], a.v[1], sh * br)); a.b.style.opacity = p; a.u.setAttribute('d', c.arrowD(a.cx, a.cy, a.v[0], a.v[1], br)); });
    const pp = S.spring(S.seg(t, c.tM, c.tM + 0.6, S.ease.linear), 0.03), px = c.X(c.EC.s), py = 260 + (c.R.y - 260) * pp;
    c.pin.setAttribute('transform', `translate(${px.toFixed(1)} ${py.toFixed(1)})`); c.pin.style.opacity = S.seg(t, c.tM, c.tM + 0.1, S.ease.linear);
  },
});
</script></body></html>
