<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ABC flow in 3D</title>
<link rel="stylesheet" href="../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../runtime/theme.css">
<script src="../vendor/katex/katex.min.js"></script>
<script src="../runtime/scene.js"></script>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script>
<style>
  #title { position: absolute; left: 96px; top: 64px; }
  #formula { position: absolute; left: 96px; top: 150px; font-size: 34px; color: var(--fg-2); }
  .axis { position: absolute; font-family: "Inter"; font-weight: 500; font-size: 26px; color: var(--muted); transform: translate(-50%, -50%); }
</style></head>
<body><div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <div id="title" class="heading">The ABC flow: a simple 3D flow that can make a dynamo</div>
  <div id="formula"></div>
  <div class="lower-third" id="lt" style="border-left-color:var(--u)"><div class="l1">Schematic · Arnold–Beltrami–Childress · A = B = C = 1</div><div class="l2">Streamlines of the velocity u in a periodic box</div></div>
  <div id="axes"></div>
</div>
<script type="module">
/* Three.js test scene (WebGL through SwiftShader on a CPU-only machine). Streamlines are integrated
   once in setup (RK4); render(t) only sets the camera, the line draw ranges and the overlay. */
import * as THREE from 'three';
import { LineSegments2 } from '../vendor/three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from '../vendor/three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from '../vendor/three/addons/lines/LineMaterial.js';

Scene.define({
  duration: 6,
  cues: { grow: 0.4, orbit: 0 },
  params: { A: 1, B: 1, C: 1, lines: 40, points: 700, h: 0.02 },
  setup(ctx) {
    const P = ctx.params, TWO_PI = 2 * Math.PI;
    katex.render('\\htmlClass{k-u}{\\mathbf{u}} = (A\\sin z + C\\cos y,\\; B\\sin x + A\\cos z,\\; C\\sin y + B\\cos x)',
      document.getElementById('formula'), { output: 'html', trust: true });
    const canvas = document.getElementById('gl');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: P.aa !== false, preserveDrawingBuffer: true });   // MSAA costs a lot on SwiftShader
    renderer.setPixelRatio(window.devicePixelRatio || 1);
    renderer.setSize(1920, 1080, false);
    renderer.setClearColor(Scene.C.bg, 1);
    const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 200);
    camera.setViewOffset(1920, 1080, -240, 70, 1920, 1080);   // push the box right of the title and lower-third
    const box = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(TWO_PI, TWO_PI, TWO_PI)),
      new THREE.LineBasicMaterial({ color: Scene.C.infra, transparent: true, opacity: 0.6 }));
    scene.add(box);
    const vel = (x, y, z) => [P.A * Math.sin(z) + P.C * Math.cos(y), P.B * Math.sin(x) + P.A * Math.cos(z), P.C * Math.sin(y) + P.B * Math.cos(x)];
    const rnd = Scene.mulberry32(11), col = new THREE.Color(), lines = [];
    const res = new THREE.Vector2(1920 * renderer.getPixelRatio(), 1080 * renderer.getPixelRatio());
    for (let l = 0; l < P.lines; l++) {
      let p = [rnd() * TWO_PI, rnd() * TWO_PI, rnd() * TWO_PI];
      const pos = [], cols = [];
      let prev = p.map((v) => v - Math.PI);
      for (let i = 0; i < P.points; i++) {
        const f = (q) => vel(q[0], q[1], q[2]), h = P.h;
        const k1 = f(p), k2 = f(p.map((v, j) => v + h / 2 * k1[j])), k3 = f(p.map((v, j) => v + h / 2 * k2[j])), k4 = f(p.map((v, j) => v + h * k3[j]));
        p = p.map((v, j) => v + h / 6 * (k1[j] + 2 * k2[j] + 2 * k3[j] + k4[j]));
        const w = p.map((v) => ((v % TWO_PI) + TWO_PI) % TWO_PI - Math.PI);   // wrap into the box
        const jump = Math.hypot(w[0] - prev[0], w[1] - prev[1], w[2] - prev[2]) > 1;
        if (i > 0 && !jump) {
          pos.push(...prev, ...w);
          const s = Math.hypot(...f(p)) / Math.sqrt(3 * 3);           // speed in [0, ~1.2]
          col.set(Scene.C.u).offsetHSL(0, 0, 0.18 * (s - 0.5));
          cols.push(col.r, col.g, col.b, col.r, col.g, col.b);
        }
        prev = w;
      }
      const g = new LineSegmentsGeometry(); g.setPositions(pos); g.setColors(cols);
      const m = new LineMaterial({ linewidth: 2.6, vertexColors: true, resolution: res, transparent: true, opacity: 0.95 });
      const obj = new LineSegments2(g, m); scene.add(obj);
      lines.push({ g, n: pos.length / 6, delay: rnd() * 0.8 });
    }
    // axis labels follow projected box corners
    const axes = document.getElementById('axes');
    const mk = (txt) => { const d = document.createElement('div'); d.className = 'axis'; d.textContent = txt; axes.appendChild(d); return d; };
    ctx.labels = [[mk('x'), new THREE.Vector3(0, -Math.PI - 0.5, Math.PI + 0.5)], [mk('y'), new THREE.Vector3(Math.PI + 0.5, 0, Math.PI + 0.5)],
                  [mk('z'), new THREE.Vector3(Math.PI + 0.5, -Math.PI - 0.5, 0)]];
    Object.assign(ctx, { renderer, scene, camera, lines });
  },
  render(t, ctx) {
    const { renderer, scene, camera, lines } = ctx;
    const a = 0.6 + 0.35 * t, r = 23;                      // slow orbit, a pure function of t
    camera.position.set(r * Math.cos(a), 7 + 1.5 * Math.sin(0.4 * t), r * Math.sin(a));
    camera.lookAt(0, 0, 0);
    const g0 = ctx.cue('grow', 0.4);
    for (const L of lines) {
      const p = Scene.seg(t, g0 + L.delay, g0 + L.delay + 3.5, Scene.ease.inOutSine);
      L.g.instanceCount = Math.floor(L.n * p);
    }
    renderer.render(scene, camera);
    camera.updateMatrixWorld();
    for (const [el, v] of ctx.labels) {
      const q = v.clone().project(camera);
      el.style.left = ((q.x + 1) / 2 * 1920) + 'px'; el.style.top = ((1 - q.y) / 2 * 1080) + 'px';
    }
    const lt = Scene.seg(t, 0.8, 1.15);
    document.getElementById('lt').style.clipPath = `inset(0 ${100 - 100 * lt}% 0 0)`;
  },
});
</script></body></html>
