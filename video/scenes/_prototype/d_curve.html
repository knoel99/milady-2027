<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Data-driven curve</title>
<link rel="stylesheet" href="../runtime/theme.css">
<script src="../runtime/scene.js"></script>
<style>
  #plot { position: absolute; inset: 0; }
  .tick { font: 500 22px Inter; fill: var(--muted); font-feature-settings: "tnum"; }
  .axt { font: 500 28px Inter; }
  .leg { font: 500 26px Inter; fill: var(--fg-2); }
  .chip { font: 500 18px "JetBrains Mono"; letter-spacing: .08em; }
  .await { font: 500 26px "JetBrains Mono"; letter-spacing: .07em; fill: var(--muted); text-transform: uppercase; }
</style></head>
<body><div id="stage">
  <svg id="plot" class="full" viewBox="0 0 1920 1080"></svg>
  <div class="lower-third" id="lt" style="border-left-color:var(--b)"><div class="l1" id="lt1"></div><div class="l2" id="lt2"></div></div>
</div>
<script>
/* Regenerable plot template. Every number on screen comes from the data file named in the timeline
   entry (entry.data.curve). With status "pending" and no data, it renders the SAME frame with hatched
   data areas and an AWAITING label, so the film can be assembled before the campaign has run. */
Scene.define({
  duration: 6,
  cues: { draw: 0.6, gen: 3.0 },
  data: { curve: '../data/e1_rate.json' },
  requireData: false,                       // checked below: only a pending scene may lack its data
  setup(ctx) {
    const D = ctx.data.curve, P = ctx.params, C = Scene.C, NS = 'http://www.w3.org/2000/svg';
    if (!D && ctx.status !== 'pending') throw new Error('missing data for a non-pending scene: ' + ctx.missing.join(', '));
    const svg = document.getElementById('plot');
    const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); parent.appendChild(e); return e; };
    const X0 = 260, X1 = 1680, Y0 = 680, Y1 = 150;           // plot box; axis title ends above the lower-third (y 800)
    ctx.box = { X0, X1, Y0, Y1 };
    const xs = D ? D.x.values : [0, 1], ys = D ? D.series.flatMap((s) => s.y) : [0, 1];
    const xmin = Math.min(...xs), xmax = Math.max(...xs), ymax = Math.max(...ys) * 1.08 || 1;
    const sx = (x) => X0 + (X1 - X0) * (x - xmin) / (xmax - xmin), sy = (y) => Y0 - (Y0 - Y1) * y / ymax;
    // axes: x axis is the control parameter -> green; y axis neutral
    el('line', { x1: X0, y1: Y0, x2: X1 + 20, y2: Y0, stroke: C.param, 'stroke-width': 2.5 });
    el('line', { x1: X0, y1: Y0, x2: X0, y2: Y1 - 20, stroke: C.muted, 'stroke-width': 2 });
    const xl = el('text', { x: (X0 + X1) / 2, y: Y0 + 84, 'text-anchor': 'middle', class: 'axt', fill: C.param });
    xl.textContent = D ? D.x.label : P.x_label;
    const yl = el('text', { x: X0 - 150, y: (Y0 + Y1) / 2, 'text-anchor': 'middle', class: 'axt', fill: C.fg2, transform: `rotate(-90 ${X0 - 150} ${(Y0 + Y1) / 2})` });
    yl.textContent = D ? D.y.label : P.y_label;
    if (D) {
      for (let i = 0; i <= 5; i++) {                           // ticks from the data range
        const xv = xmin + (xmax - xmin) * i / 5, yv = ymax * i / 5;
        el('text', { x: sx(xv), y: Y0 + 38, 'text-anchor': 'middle', class: 'tick' }).textContent = xmax < 0.1 ? xv.toFixed(4) : xv.toFixed(2);
        el('text', { x: X0 - 16, y: sy(yv) + 8, 'text-anchor': 'end', class: 'tick' }).textContent = ymax >= 0.1 ? yv.toFixed(2) : yv.toFixed(3);
        el('line', { x1: X0, x2: X1, y1: sy(yv), y2: sy(yv), stroke: C.grid, 'stroke-width': 1 });
      }
      ctx.paths = D.series.map((s, k) => {
        const d = s.y.map((y, i) => `${i ? 'L' : 'M'}${sx(xs[i]).toFixed(1)},${sy(y).toFixed(1)}`).join('');
        const col = C[s.field] || C.fg;
        const p = el('path', { d, fill: 'none', stroke: col, 'stroke-width': s.kind === 'generated' ? 4 : 5,
          'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
        const L = p.getTotalLength();
        // provenance by line style: simulated solid, generated dashed (dash pattern applied after the draw-on)
        const lg = el('g', {});
        const ly = Y1 - 10 + 44 * k;
        el('line', { x1: X1 - 330, x2: X1 - 270, y1: ly, y2: ly, stroke: col, 'stroke-width': 4, 'stroke-dasharray': s.kind === 'generated' ? '14 10' : 'none' }, lg);
        el('text', { x: X1 - 255, y: ly + 9, class: 'leg' }, lg).textContent = s.name;
        return { p, L, kind: s.kind, lg };
      });
      // training values filled dots, test values open dots (site convention), on the simulation curve
      const dc = C[D.series[0].field] || C.fg;
      ctx.dots = xs.map((x, i) => el('circle', { cx: sx(x), cy: sy(D.series[0].y[i]), r: 6, fill: D.x.train[i] ? dc : C.bg, stroke: dc, 'stroke-width': 2.5 }));
      document.getElementById('lt1').textContent = D.meta.stamp;
      document.getElementById('lt2').textContent = 'source: ' + D.meta.source + ' · ' + D.meta.sha256.slice(0, 8);
    } else {
      // pending: hatched data area and AWAITING label, same frame as the final shot
      const defs = el('defs', {});
      const pat = el('pattern', { id: 'hatch', width: 18, height: 18, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
      el('line', { x1: 0, y1: 0, x2: 0, y2: 18, stroke: C.muted, 'stroke-width': 3, 'stroke-opacity': 0.12 }, pat);
      ctx.hatch = el('rect', { x: X0 + 2, y: Y1, width: X1 - X0, height: Y0 - Y1 - 2, fill: 'url(#hatch)' });
      const t = el('text', { x: (X0 + X1) / 2, y: (Y0 + Y1) / 2, 'text-anchor': 'middle', class: 'await' });
      t.textContent = 'AWAITING · ' + P.awaiting; ctx.await = t;
      document.getElementById('lt1').textContent = 'Regenerable section · status: pending';
      document.getElementById('lt2').textContent = 'Re-rendered automatically when the data file appears';
    }
  },
  render(t, ctx) {
    const c = (n, f) => ctx.cue(n, f);
    if (ctx.paths) ctx.paths.forEach((s) => {
      const t0 = s.kind === 'generated' ? c('gen', 3.0) : c('draw', 0.6);
      const p = Scene.seg(t, t0, t0 + 1.8, Scene.ease.inOutSine);
      if (s.kind === 'generated' && p >= 1) { s.p.style.strokeDasharray = '14 10'; s.p.style.strokeDashoffset = 0; }
      else { s.p.style.strokeDasharray = s.L; s.p.style.strokeDashoffset = s.L * (1 - p); }
      s.p.style.opacity = p > 0 ? 1 : 0;
      s.lg.style.opacity = Scene.seg(t, t0, t0 + 0.4);
    });
    if (ctx.dots) { const t0 = c('draw', 0.6); ctx.dots.forEach((d, i) => { d.style.opacity = Scene.seg(t, t0 + 1.8 * i / ctx.dots.length, t0 + 1.8 * i / ctx.dots.length + 0.2); }); }
    if (ctx.hatch) { const p = Scene.seg(t, c('draw', 0.6), c('draw', 0.6) + 0.8); ctx.hatch.style.opacity = p; ctx.await.style.opacity = p; }
    const lt = Scene.seg(t, 0.5, 0.85);
    document.getElementById('lt').style.clipPath = `inset(0 ${100 - 100 * lt}% 0 0)`;
  },
});
</script></body></html>
