<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>A flow stretches a field line</title>
<link rel="stylesheet" href="../runtime/theme.css">
<script src="../runtime/scene.js"></script>
<style>
  #title { position: absolute; left: 96px; top: 64px; }
  #counter { position: absolute; right: 96px; top: 72px; text-align: right; }
  #counter .v { font-family: "Inter Display"; font-weight: 600; font-size: 64px; color: var(--b); }
</style></head>
<body><div id="stage">
  <canvas id="bgc" width="1920" height="1080"></canvas>
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="title" class="heading">A flow can stretch a magnetic field line</div>
  <div id="counter"><div class="label" style="color:var(--muted)">field-line length</div><div class="v" id="len">×1.0</div></div>
  <div class="lower-third" id="lt" style="border-left-color:var(--u)"><div class="l1" id="lt1"></div><div class="l2" id="lt2"></div></div>
</div>
<script>
/* Canvas 2D test scene: tracer particles (u, blue) in a time-periodic cellular flow, and one material
   line (B, vermillion) frozen into the flow (ideal limit Rm -> infinity). All parameters come from
   data/fieldlines.json; the state is integrated by Scene.stepper (fixed dt), so frames are exact. */
Scene.define({
  duration: 6,
  cues: { title: 0.2, line: 0.6, flow: 1.4 },
  data: { p: '../data/fieldlines.json' },
  setup(ctx) {
    const P = ctx.data.p, W = 1920, H = 1080, C = Scene.C;
    const kx = Math.PI * P.cells_x / W, ky = Math.PI * P.cells_y / H;
    const U = P.amplitude_px_s, eps = P.boundary_wobble_px, om = 2 * Math.PI / P.wobble_period_s;
    // streamfunction psi = (U/k) sin(kx (x + eps sin wt)) sin(ky y);  u = dpsi/dy, v = -dpsi/dx
    const vel = (x, y, s) => {
      const X = kx * (x + eps * Math.sin(om * s)), Y = ky * y;
      return [U * Math.sin(X) * Math.cos(Y), -U * (kx / ky) * Math.cos(X) * Math.sin(Y)];
    };
    ctx.vel = vel;
    // static background: faint aligned segments along u ("iron filings" for the flow)
    const g = Scene.hidpi(document.getElementById('bgc'));
    g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
    g.strokeStyle = C.u; g.lineWidth = 2; g.lineCap = 'round';
    for (let y = 20; y < H; y += 36) for (let x = 20; x < W; x += 36) {
      const [u, v] = vel(x, y, 0), m = Math.hypot(u, v) / U;
      g.globalAlpha = 0.08 + 0.22 * m;
      const L = 9 * m + 3, dx = u / (Math.hypot(u, v) + 1e-9), dy = v / (Math.hypot(u, v) + 1e-9);
      g.beginPath(); g.moveTo(x - dx * L, y - dy * L); g.lineTo(x + dx * L, y + dy * L); g.stroke();
    }
    g.globalAlpha = 1;
    const rnd = Scene.mulberry32(P.seed), N = P.particles, K = P.trail;
    const tFlow = ctx.cue('flow', 1.4);
    const rk2 = (x, y, s, dt) => {
      const [u1, v1] = vel(x, y, s), [u2, v2] = vel(x + 0.5 * dt * u1, y + 0.5 * dt * v1, s + 0.5 * dt);
      return [Math.min(W - 1, Math.max(1, x + dt * u2)), Math.min(H - 1, Math.max(1, y + dt * v2))];
    };
    ctx.sim = Scene.stepper(() => {
      const px = new Float32Array(N * K), py = new Float32Array(N * K);
      for (let i = 0; i < N; i++) { const x = rnd() * W, y = rnd() * H; for (let k = 0; k < K; k++) { px[i * K + k] = x; py[i * K + k] = y; } }
      const line = [];
      for (let i = 0; i <= 240; i++) line.push([W * (0.06 + 0.88 * i / 240), H * P.line_y_frac]);
      return { px, py, head: 0, line, steps: 0 };
    }, (S, dt, s) => {
      const { px, py } = S, nh = (S.head + 1) % K;
      for (let i = 0; i < N; i++) {
        const [x, y] = rk2(px[i * K + S.head], py[i * K + S.head], s, dt);
        px[i * K + nh] = x; py[i * K + nh] = y;
      }
      S.head = nh;
      const L = S.line, out = [];
      for (let i = 0; i < L.length; i++) L[i] = rk2(L[i][0], L[i][1], s, dt);
      for (let i = 0; i < L.length; i++) {   // refine: keep segments shorter than max_seg_px
        out.push(L[i]);
        if (i + 1 < L.length && out.length < P.max_line_points) {
          const a = L[i], b = L[i + 1];
          if (Math.hypot(b[0] - a[0], b[1] - a[1]) > P.max_seg_px) out.push([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
        }
      }
      S.line = out; S.steps++;
      return S;
    }, 1 / P.steps_per_s);
    ctx.tFlow = tFlow;
    ctx.L0 = W * 0.88;
    ctx.g = Scene.hidpi(document.getElementById('c'));
    document.getElementById('lt1').textContent = P.chip;
    document.getElementById('lt2').textContent = P.caption;
  },
  render(t, ctx) {
    const P = ctx.data.p, g = ctx.g, C = Scene.C, W = 1920, H = 1080, K = P.trail;
    const s = Math.max(0, t - ctx.tFlow) * P.time_scale;           // simulated time
    const S = ctx.sim(s);
    g.clearRect(0, 0, W, H);
    // tracer trails: one path per age so that the whole swarm costs K strokes
    const appear = Scene.seg(t, 0, 0.8);
    g.lineCap = 'round'; g.strokeStyle = C.u; g.lineWidth = 2.2;
    for (let a = K - 1; a >= 1; a--) {
      const i0 = (S.head - a + 1 + K * 4) % K, i1 = (S.head - a + K * 4) % K;   // segment from age a to a-1
      g.globalAlpha = appear * 0.85 * (1 - a / K);
      g.beginPath();
      for (let i = 0; i < P.particles; i++) {
        g.moveTo(S.px[i * K + i1], S.py[i * K + i1]); g.lineTo(S.px[i * K + i0], S.py[i * K + i0]);
      }
      g.stroke();
    }
    g.globalAlpha = appear; g.fillStyle = '#9CC6FF';
    for (let i = 0; i < P.particles; i++) g.fillRect(S.px[i * K + S.head] - 1.5, S.py[i * K + S.head] - 1.5, 3, 3);
    // the magnetic field line: draw-on, then frozen into the flow
    const draw = Scene.seg(t, ctx.cue('line', 0.6), ctx.cue('line', 0.6) + 0.7);
    const L = S.line, n = Math.max(2, Math.floor(L.length * draw));
    let len = 0; for (let i = 1; i < L.length; i++) len += Math.hypot(L[i][0] - L[i - 1][0], L[i][1] - L[i - 1][1]);
    g.globalAlpha = draw > 0 ? 1 : 0;
    for (const [w, a] of [[12, 0.18], [4, 1]]) {
      g.lineWidth = w; g.strokeStyle = C.b; g.globalAlpha = a * (draw > 0 ? 1 : 0); g.lineJoin = 'round';
      g.beginPath(); g.moveTo(L[0][0], L[0][1]); for (let i = 1; i < n; i++) g.lineTo(L[i][0], L[i][1]); g.stroke();
    }
    g.globalAlpha = 1;
    document.getElementById('len').textContent = '×' + (len / ctx.L0).toFixed(1);
    document.getElementById('title').style.opacity = Scene.seg(t, ctx.cue('title', 0.2), ctx.cue('title', 0.2) + 0.5);
    document.getElementById('counter').style.opacity = Scene.seg(t, ctx.tFlow, ctx.tFlow + 0.4);
    const lt = Scene.seg(t, 0.8, 1.15);
    document.getElementById('lt').style.clipPath = `inset(0 ${100 - 100 * lt}% 0 0)`;
  },
});
</script></body></html>
