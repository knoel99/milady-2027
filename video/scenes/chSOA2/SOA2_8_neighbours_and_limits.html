<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA2.8 Neighbours and limits</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA2.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="../../runtime/components/threemodes.js"></script>
<script src="chSOA2_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* SOA2.8 Neighbours and limits (L5, NIGHT, CONJECTURE medium). The full zoomed map with the dashed thesis ring in the
   crossing; the PBFM pin on the SOFT strand with its quote (as written by its authors); the report's own square on the
   DISTRIBUTIONAL strand, linked 'to be positioned'; four things not claimed; every empty spot is a search result;
   handoff: the ring shrinks into the small staircase glyph for 10.1. */
Scene.define({
  duration: 34,
  register: 'night',
  cues: { pbfm: 0.4, place: 9.6, notclaimed: 14.8, watch: 23.0 },
  params: { pbfm_quote: { text: '', who: '' }, report_pin: { label: '' }, link_label: 'to be positioned', not_claimed: [], watch_chip: '' },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK;
    const M = SM.map(ctx, { at: -0.3, focus: [{ at: -1, key: 'constraints.SOFT' }, { at: 'place-0.3', key: 'constraints.DISTRIBUTIONAL' }] });
    M.addPins(SM.ALL_PINS.filter((p) => !p.lane.startsWith('dynamo') && p.id !== 'c_pbfm').map((p) => Object.assign({}, p, { lane: p.lane === 'constraints' ? 'constraints.HARD' : p.lane, label: null, at: -0.3 })), { labels: false });
    const pb = SM.ALL_PINS.find((p) => p.id === 'c_pbfm');
    M.addPins([Object.assign({}, pb, { label: 'PBFM · physics vs distribution', at: 'pbfm-0.15', color: 'model' })]);
    const pbq = M.pins[M.pins.length - 1];
    const rp = { id: 'report', lane: 'constraints.DISTRIBUTIONAL', year: 2026.85, glyph: 'square', color: 'chalk', label: P.report_pin.label.replace(/^PROSPECTIVE REPORT · NOV 2026 · /, 'this report · '), at: 'place-0.15' };
    M.addPins([rp]); rp.year = 'Nov 2026';
    const rq = M.pins[M.pins.length - 1]; rq.p.year = 2026.85; if (rq.lab) rq.lab.textContent = P.report_pin.label;
    // the thesis ring in the crossing
    const sv = K.svgLayer(ctx, 26), xa = M.x(2027), xb = M.x(2030), ring = K.s('ellipse', { cx: (xa + xb) / 2, rx: (xb - xa) / 2 - 6, fill: 'none', stroke: K.c('model'), 'stroke-width': 4, 'stroke-dasharray': '10 8' }, sv);
    const link = K.s('path', { fill: 'none', stroke: K.c('muted'), 'stroke-width': 2.5, 'stroke-dasharray': '6 6' }, sv);
    const tP = ctx.at('place+0.6'), tH = ctx.at('watch+1.8');
    ctx.add({ render(t) { const g = M.rowBox('generative', t), c = M.rowBox('constraints', t), h = S.seg(t, tH, tH + 0.8, S.ease.inOutCubic);
      ring.setAttribute('cy', (g.y0 + c.y1) / 2); ring.setAttribute('ry', ((c.y1 - g.y0) / 2 - 10) * (1 - 0.8 * h)); ring.setAttribute('rx', ((xb - xa) / 2 - 6) * (1 - 0.8 * h)); ring.style.opacity = (1 - h) * M.dim(t);
      const s1 = M.rowBox('constraints.SOFT', t), d1 = M.rowBox('constraints.DISTRIBUTIONAL', t), xp = M.x(pb.year), xr = M.x(2026.85);
      link.setAttribute('d', `M${xp},${s1.y1 - 16} C${xp - 60},${(s1.y1 + d1.y1) / 2} ${xr - 60},${(s1.y1 + d1.y1) / 2} ${xr},${d1.y1 - 28}`); link.style.opacity = S.seg(t, tP, tP + 0.5, S.ease.linear); } });
    U.label(ctx, { text: P.link_label, x: M.x(2026.85) + 24, y: 420, size: 28, cls: 'dim halo', at: 'place+0.8', out: 'notclaimed-0.2' });
    void pbq;
    // the quote card over the upper lanes
    const card = K.el('div', { class: 'uk-card' }, ctx.stage); card.style.cssText += ';left:380px;top:176px;width:900px;padding:18px 24px;z-index:36';
    const qt = K.el('div', { class: 'uk-lab' }, card, P.pbfm_quote.text); qt.style.cssText += ';position:static;white-space:normal;font-size:32px;font-style:italic';
    const qw = K.el('div', { class: 'uk-lab mono' }, card, K.upper(P.pbfm_quote.who)); qw.style.cssText += ';position:static;margin-top:10px';
    U.fade(ctx, card, { at: 'pbfm+0.6', out: 'notclaimed-0.3' });
    K.chip(ctx, { text: 'claim quoted as written by its authors', kind: 'plain', x: 96, y: 780, at: 'pbfm+0.6', out: 'notclaimed-0.3' });
    // not claimed: a heading and four tags in the gate column (the gate grid is not used here)
    M.gatesAlpha = (t) => 0.25;
    U.label(ctx, { text: 'NOT CLAIMED', x: 1352, y: 210, size: 28, cls: 'mono', z: 40, at: 'notclaimed-0.15', out: 'watch+1.6' });
    const tags = P.not_claimed.map((n) => n.text), tN = ctx.at('notclaimed-0.15');
    const ns = (ctx.script.sentences || []).find((x) => x.cue === 'notclaimed');
    tags.forEach((tx, i) => { const a = ns ? ns.start + (ns.end - ns.start) * (0.3 + 0.17 * i) : tN + 0.6 + 0.6 * i;
      U.label(ctx, { html: '⊘ ' + K.esc(tx), x: 1352, y: 256 + 50 * i, size: 32, cls: 'uk-pill dim', z: 40, at: a - 0.15, out: 'watch+1.6' }); });
    K.chip(ctx, { text: P.watch_chip, kind: 'plain', maxWidth: 900, x: 96, y: 780, at: 'watch-0.15' });
    // handoff: the small staircase glyph (bottom right)
    K.staircase(ctx, { x: 1200, y: 470, w: 620, h: 230, lit: 0, pending: [3, 4], at: 'watch+2.0' });
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'medium', at: -0.3 });
  },
});
</script></body></html>
