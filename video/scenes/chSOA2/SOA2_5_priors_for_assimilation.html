<html lang="en"><head><meta charset="utf-8">
<title>SOA2.5 Priors for assimilation</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">

<link rel="stylesheet" href="chSOA2.css">

</head><body><div id="stage"></div>
<script>
/* SOA2.5 Priors for assimilation (L5, NIGHT, CONTEXT). ASSIMILATION PRIORS lane focused; S. Cheng's rings with their
   name tags; the dashed empty slot for conducting fluids; a schematic posterior inset: two polarities, a prior that
   ignores the mirror tips one hump down, the mirror line levels them; the ASSIMILATION row of gate cells. */
Scene.define({
  duration: 31,
  register: 'night',
  cues: { assim: 0.4, priors: 4.4, library: 9.6, mhd: 14.0, two: 18.0 },
  params: { lane: 'assimilation', pins: [], verdicts: { '3d': 'yes', walls: 'partly', lowpm: 'no', rare: 'open' }, verdict_at: 'two+0.8', lower_thirds: [] },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK;
    SM.laneScene(ctx, P);
    U.label(ctx, { text: 'ring = co-signed by a supervisor', x: 460, y: 360, size: 28, cls: 'dim', at: 'priors+0.4', out: 'priors+3.6' });
    K.chip(ctx, { text: 'none found · search to 6 Nov 2026', kind: 'schematic', x: 96, y: 752, at: 'mhd+0.3', out: 'two-0.2' });
    // posterior inset (SCHEMATIC) over the dimmed upper rows
    const bx0 = 400, bx1 = 940, by0 = 196, by1 = 386, isvg = K.svgLayer(ctx, 34), ig = K.s('g', {}, isvg);
    K.s('rect', { x: bx0, y: by0, width: bx1 - bx0, height: by1 - by0, rx: 8, fill: K.c('bg'), stroke: K.c('muted'), 'stroke-width': 2 }, ig);
    const dx = (d) => bx0 + 150 + (bx1 - bx0 - 180) * (d + 2.4) / 4.8, base = by1 - 40;
    K.s('line', { x1: bx0 + 140, x2: bx1 - 20, y1: base, y2: base, stroke: K.c('muted'), 'stroke-width': 2 }, ig);
    [0, 1, 2].forEach((i) => K.s('circle', { cx: bx0 + 40 + 30 * i, cy: by0 + 90 + 14 * (i % 2), r: 7, fill: K.c('chalk') }, ig));
    K.s('path', { d: `M${bx0 + 112},${by0 + 98} h20 m-8,-8 l8,8 l-8,8`, fill: 'none', stroke: K.c('chalk'), 'stroke-width': 2.5 }, ig);
    const hp = K.s('path', { fill: 'none', stroke: K.c('b'), 'stroke-width': 3.5 }, ig), hn = K.s('path', { fill: 'none', stroke: K.c('b-neg'), 'stroke-width': 3.5 }, ig);
    const pri = K.s('path', { fill: 'none', stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '8 6' }, ig);
    const mir = K.s('line', { x1: dx(0), x2: dx(0), y1: by0 + 14, y2: base, stroke: K.c('chalk'), 'stroke-width': 2.5, 'stroke-dasharray': '4 6' }, ig);
    U.fade(ctx, ig, { at: 'two-0.15' });
    U.label(ctx, { text: 'probes', x: bx0 + 70, y: by0 + 120, anchor: 'c', size: 28, cls: 'dim', z: 35, at: 'two-0.15' });
    U.label(ctx, { text: '−D', x: dx(-1.2), y: base + 4, anchor: 'c', size: 28, color: 'b-neg', z: 35, at: 'two-0.15' });
    U.label(ctx, { text: '+D', x: dx(1.2), y: base + 4, anchor: 'c', size: 28, color: 'b', z: 35, at: 'two-0.15' });
    const tIg = U.frac(ctx, 'two', 0.55, 2.4), tLev = U.end(ctx, 'two', 4) + 0.1;
    U.label(ctx, { text: 'prior ignores the mirror', x: bx1, y: by1 + 6, anchor: 'r', size: 28, cls: 'dim', z: 35, at: tIg, out: tLev });
    K.chip(ctx, { text: 'illustration · no numbers', kind: 'schematic', x: bx0 + 8, y: by0 + 8, at: 'two-0.15' });
    const g = (d, m, s) => Math.exp(-0.5 * ((d - m) / s) ** 2);
    const path = (f) => { let s = ''; for (let i = 0; i <= 80; i++) { const d = -2.4 + 4.8 * i / 80; s += `${i ? 'L' : 'M'}${dx(d).toFixed(1)},${(base - 100 * f(d)).toFixed(1)}`; } return s; };
    ctx.add({ render(t) {
      const a = S.seg(t, tIg, tIg + 0.8, S.ease.inOutCubic), b = S.seg(t, tLev, tLev + 0.8, S.ease.inOutCubic), sink = a * (1 - b);
      hp.setAttribute('d', path((d) => (d >= 0 ? g(d, 1.2, 0.45) : 0))); hn.setAttribute('d', path((d) => (d < 0 ? (1 - 0.6 * sink) * g(d, -1.2, 0.45) : 0)));
      pri.setAttribute('d', path((d) => 0.5 * (b * 0.5 * (g(d, 1.2, 0.9) + g(d, -1.2, 0.9)) + (1 - b) * g(d, 1.0, 1.0))));
      pri.style.opacity = a.toFixed(3); mir.style.opacity = (b * (0.6 + 0.4 * Math.sin(Math.PI * S.seg(t, tLev, tLev + 0.6, S.ease.linear)))).toFixed(3); } });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    UK.formulaLayers(ctx, 'Formula');
  },
});
</script></body></html>
