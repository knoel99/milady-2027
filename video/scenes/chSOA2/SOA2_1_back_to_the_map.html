<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA2.1 Back to the map</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA2.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>

<script src="../../runtime/components/equation.js"></script>

</head><body><div id="stage"></div>
<script>
/* SOA2.1 Back to the map (L4, NIGHT, CONTEXT). Chapter card; the century map (redrawn here: the chSOA1 map module does
   not exist yet) with the supervisors' rings and diamonds as unlabelled glyphs; the dive into the data-driven lane,
   which opens into four tracks (2012-2031); the four tests, spelled as captions, then set as the gate heads. */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { map: 3.6, zoom: 9.6, gates: 14.8 },
  params: { chapter_card: { num: '09+', title: 'The map of the field: where this work fits', level: 'L4', levelFrom: 'L4', tier: 0, pending: [3, 4] },
    gate_caption: { text: ['3D · three dimensions', 'WALLS · walls, vacuum, iron', 'LOW Pm · a tiny magnetic Prandtl number', 'RARE · rare flips'] } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK, cc = P.chapter_card;
    K.chapterCard(ctx, { num: cc.num, title: cc.title, level: cc.level, levelFrom: cc.levelFrom, tier: cc.tier, pending: cc.pending, at: -0.3, out: 'map-0.4', railHold: 2.6 });
    // the century map: four dynamo lanes and the data-driven lane, 1900-2031
    const C = SM.map(ctx, { axis: [1900, 2031], rows: ['record', 'dynamo.THEORY', 'dynamo.LAB DYNAMOS', 'dynamo.SIMULATIONS', 'dynamo.REDUCED MODELS', 'datadriven'], gates: false, at: 'map-0.15', out: 'zoom-0.15' });
    C.addPins(SM.ALL_PINS.filter((p) => p.lane.startsWith('dynamo')).map((p) => Object.assign({}, p, { label: null, at: 'map+0.4' })), { labels: false });
    const dd = C.rowBox('datadriven', 0), band = K.s('rect', { x: C.x(2012), y: 0, width: C.x(2031) - C.x(2012), height: 10, fill: K.rgba(K.c('chalk'), 0.12), stroke: K.c('chalk'), 'stroke-width': 2 }, C.svg);
    void dd;
    const tZ = ctx.at('zoom-0.15');
    ctx.add({ render(t) { const r = C.rowBox('datadriven', t); band.setAttribute('y', r.y0 + 2); band.setAttribute('height', r.y1 - r.y0 - 4); band.style.opacity = S.seg(t, tZ - 1.2, tZ - 0.6, S.ease.linear) * (1 - S.seg(t, tZ, tZ + 0.5, S.ease.linear)); } });
    // the zoomed map (gates' heads appear with the captions)
    const Z = SM.map(ctx, { at: 'zoom-0.15', focus: [] });
    const tG = ctx.at('gates-0.15');
    Z.gatesAlpha = (t) => S.seg(t, tG + 2.4, tG + 3.0, S.ease.linear);
    U.label(ctx, { text: 'MILADY · ANR · 2026-2029', x: Z.x(2026), y: 166, size: 28, cls: 'mono', at: 'zoom+0.6' });
    const caps = P.gate_caption.text;
    caps.forEach((c, i) => U.label(ctx, { text: c, x: 1340, y: 300 + 60 * i, anchor: 'r', size: 36, cls: 'halo', z: 40, at: tG + 0.35 * i, out: tG + 2.4 + 0.2 * i }));
    K.chip(ctx, { text: 'gate verdicts in the next scenes: our reading of published abstracts', kind: 'plain', maxWidth: 820, x: 96, y: 760, at: 'gates+3.0' });
    K.badge(ctx, { kind: 'CONTEXT', at: 'map-0.15' });
    UK.formulaLayers(ctx, 'Formula');
  },
});
</script></body></html>
