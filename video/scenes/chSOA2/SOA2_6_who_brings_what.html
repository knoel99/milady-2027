<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA2.6 Who brings what</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA2.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="../../runtime/components/threemodes.js"></script>
<script src="chSOA2_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* SOA2.6 Who brings what (L5, NIGHT, CONTEXT). The map unfolds to 1995-2031 with the four dynamo strips; the
   supervisors' co-signed papers (rings) and MilaDy-funded papers (diamonds) land with their names (text only);
   community pins stay as dim dots; then three ingredients and the empty slot. */
Scene.define({
  duration: 44,
  register: 'night',
  cues: { rings: 0.4, dynamo: 3.8, reversals: 13.6, learning: 21.0, assim: 26.6, gap: 31.0 },
  params: { pins: [], relit: ['a_gla', 'a_torchda'], ingredients: [], neg_chip: '', lower_thirds: [] },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK;
    const rows = ['dynamo.THEORY', 'dynamo.LAB DYNAMOS', 'dynamo.SIMULATIONS', 'dynamo.REDUCED MODELS', 'surrogates', 'generative', 'constraints', 'assimilation'];
    const f = (at, key) => ({ at, key });
    const M = SM.map(ctx, { axis: [1995, 2031], rows, at: -0.3, focus: [f('dynamo-0.3', 'dynamo.SIMULATIONS'), f('reversals-0.3', 'dynamo.REDUCED MODELS'), f('learning-0.3', 'surrogates'), f('assim-0.3', 'generative'), f('gap-0.3', 'assimilation')] });
    M.gatesAlpha = () => 0.2;
    // community pins of SOA2.2-SOA2.5 as dim dots (the supervisor rings of SOA2.5 relit)
    const comm = SM.ALL_PINS.filter((p) => ['SOA2.2', 'SOA2.3', 'SOA2.4', 'SOA2.5'].includes(p.scene)).map((p) => Object.assign({}, p, { lane: p.lane.split('.')[0], label: null, at: -0.3 }));
    M.addPins(comm, { labels: false });
    const fmt = (p) => Object.assign({}, p, { lane: p.lane.startsWith('dynamo.') ? p.lane : p.lane.split('.')[0] });
    M.addPins(P.pins.map(fmt));
    // relit S. Cheng rings pulse at 'rings' and 'assim'
    const relit = M.pins.filter((q) => P.relit.includes(q.p.id)), tR = ctx.at('rings-0.15'), tA = ctx.at('assim');
    ctx.add({ render(t) { const s = Math.max(Math.sin(Math.PI * S.seg(t, tR, tR + 0.8, S.ease.linear)), Math.sin(Math.PI * S.seg(t, tA, tA + 0.8, S.ease.linear)));
      relit.forEach((q) => { q.pg.style.opacity = Math.max(+q.pg.style.opacity || 0, 0.4 + 0.6 * s); }); } });
    U.label(ctx, { text: 'ring = co-signed by a supervisor', x: 96, y: 52, size: 28, cls: 'dim', at: 'rings', out: 'reversals-0.2' });
    U.label(ctx, { text: 'diamond = declares MilaDy funding', x: 96, y: 52, size: 28, cls: 'dim', at: 'reversals', out: 'reversals+3.4' });
    // ingredients over the dimmed gates, at 'gap'
    const tG = ctx.at('gap-0.15'), panel = K.el('div', { class: 'uk-card' }, ctx.stage); panel.style.cssText += ';left:1340px;top:180px;width:484px;height:470px;padding:20px 22px;z-index:36';
    (P.ingredients.length ? P.ingredients : []).forEach((ing) => { const d = K.el('div', {}, panel); d.style.cssText = 'margin-bottom:22px';
      K.el('div', { class: 'uk-lab mono' }, d, K.upper(ing.names)).style.position = 'static';
      const tx = K.el('div', { class: 'uk-lab' }, d, ing.text); tx.style.cssText += ';position:static;white-space:normal;font-size:32px'; });
    U.fade(ctx, panel, { at: tG });
    K.chip(ctx, { text: P.neg_chip, kind: 'schematic', maxWidth: 1180, x: 96, y: 774, at: 'gap+1.0' });
    (P.lower_thirds || []).forEach((l) => { const pin = P.pins.find((p) => p.id === l.pin); if (pin && pin.ref) K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: pin.ref, at: l.cue + '+0.3', hold: l.hold }); });
    U.label(ctx, { html: Kit.upper('names in text only') + '<br>' + Kit.upper('what each paper showed, no opinions'), x: 1824, y: 790, anchor: 'r', cls: 'mono', at: 'rings', out: 'gap-0.2' });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
  },
});
</script></body></html>
