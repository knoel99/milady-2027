<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA2.7 The empty intersection</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA2.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>

</head><body><div id="stage"></div>
<script>
/* SOA2.7 The empty intersection (L5, NIGHT, PLANNED). The crossing of the generative and constraint tracks with the
   dynamo tracks is empty; the independent thesis proposal's dashed violet ring moves into it; then the map dims and
   the five gaps are listed beside the ring, each with its nearest neighbour; three MEASURED callbacks (icons only). */
Scene.define({
  duration: 54,
  register: 'night',
  cues: { cross: 0.4, thesis: 6.0, gap1: 13.4, gap2: 16.4, gap3: 23.2, gap4: 29.6, gap5: 33.8, toys: 38.4 },
  params: { thesis_ring: { label: 'THESIS · 2027-2030 · PLANNED', chip: 'independent proposal · not requested or validated by the supervisors' }, gaps: [], measured_tags: [], neg_chip: '' },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK;
    const M = SM.map(ctx, { at: -0.3, focus: [] });
    M.addPins(SM.ALL_PINS.filter((p) => p.scene !== 'SOA2.6' || !p.lane.startsWith('dynamo')).map((p) => Object.assign({}, p, { lane: p.lane.startsWith('dynamo') ? 'dynamo' : p.lane, label: null, at: -0.3 })), { labels: false });
    const tD = ctx.at('thesis+1.5');
    M.dim = (t) => 1 - S.seg(t, tD, tD + 0.8, S.ease.inOutCubic);   // the map leaves for the list (QA: no text over a dimmed map)
    M.gatesAlpha = (t) => 0.4 * M.dim(t);
    // the crossing: a dashed violet band from the generative and constraint lanes up to the dynamo band
    const sv = K.svgLayer(ctx, 26), xa = M.x(2027), xb = M.x(2030);
    const band = K.s('rect', { x: xa, width: xb - xa, fill: K.rgba(K.c('model'), 0.08), stroke: K.c('model'), 'stroke-width': 2.5, 'stroke-dasharray': '8 8', rx: 8 }, sv);
    const small = K.s('ellipse', { cx: (xa + xb) / 2, rx: (xb - xa) / 2 - 6, fill: 'none', stroke: K.c('model'), 'stroke-width': 4, 'stroke-dasharray': '10 8' }, sv);
    const tC = ctx.at('cross-0.15'), tT = ctx.at('thesis-0.15');
    ctx.add({ render(t) { const d = M.rowBox('dynamo', t), c = M.rowBox('constraints', t), g = M.rowBox('generative', t), dim = M.dim(t);
      band.setAttribute('y', d.y0 + 4); band.setAttribute('height', c.y1 - d.y0 - 8); band.style.opacity = S.seg(t, tC, tC + 0.5, S.ease.linear) * dim;
      const cy = (g.y0 + c.y1) / 2; small.setAttribute('cy', cy - 40 * (1 - S.seg(t, tT, tT + 0.8, S.ease.outCubic))); small.setAttribute('ry', (c.y1 - g.y0) / 2 - 10);
      small.style.opacity = S.seg(t, tT, tT + 0.4, S.ease.linear) * (1 - S.seg(t, tD, tD + 0.6, S.ease.linear)); } });
    U.label(ctx, { text: P.thesis_ring.label, x: (xa + xb) / 2, y: 690, anchor: 'c', size: 28, color: 'model', cls: 'halo', at: 'thesis', out: tD });
    K.chip(ctx, { text: P.neg_chip, kind: 'schematic', x: 96, y: 774, at: 'cross+0.4', out: 'thesis+1.4' });
    const pc = P.thesis_ring.chip.split(' · ');
    U.label(ctx, { html: Kit.upper(pc[0]) + '<br>' + Kit.upper(pc.slice(1).join(' · ')), x: 96, y: 790, cls: 'mono', at: 'thesis+1.5' });
    // the ring and the five gaps (list beside it)
    const RX = 330, RY = 440, RR = 150, big = K.s('g', {}, K.svgLayer(ctx, 33));
    K.s('circle', { cx: RX, cy: RY, r: RR, fill: K.c('bg'), stroke: K.c('model'), 'stroke-width': 5, 'stroke-dasharray': '14 10' }, big);
    U.fade(ctx, big, { at: tD, din: 0.6 });
    U.label(ctx, { html: 'THESIS<br>2027-2030<br>PLANNED', x: RX, y: RY - 62, anchor: 'c', size: 32, color: 'model', z: 36, at: tD + 0.3 });
    const rowY = (i) => 140 + 128 * i, LX = 560, links = K.s('g', {}, K.svgLayer(ctx, 32));
    (P.gaps || []).forEach((gp, i) => {
      const y = rowY(i), a = ctx.at(gp.cue + '-0.15');
      const l = K.s('path', { d: `M${RX + RR * Math.cos((i - 2) * 0.42)},${RY + RR * Math.sin((i - 2) * 0.42)} L${LX - 16},${y + 20}`, stroke: K.c('muted'), 'stroke-width': 2, fill: 'none' }, links); U.fade(ctx, l, { at: a });
      U.label(ctx, { text: gp.label, x: LX, y, size: 32, z: 36, at: a });
      U.label(ctx, { text: gp.neighbour, x: LX + 30, y: y + 40, size: 28, cls: 'dim', z: 36, at: a + 0.6 });
      const tag = (P.measured_tags || []).find((m) => m.gap === gp.n);
      if (tag) U.label(ctx, { html: `<span style="font-family:'JetBrains Mono';letter-spacing:.07em">MEASURED</span> · ${Kit.esc(tag.text)} · ${tag.icon}`, x: LX + 30, y: y + 74, size: 28, cls: 'uk-pill', z: 37, at: ctx.at(tag.cue) + 0.3 * (tag.gap - 2) });
    });
    K.badge(ctx, { kind: 'PLANNED', at: -0.3 });
    UK.formulaLayers(ctx, 'Formula');
  },
});
</script></body></html>
