<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>SOA2.2 Fast, but average</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="chSOA2.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="../../runtime/components/threemodes.js"></script>
<script src="chSOA2_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* SOA2.2 Fast, but average (L4, NIGHT, CONTEXT). The zoomed map, SURROGATES lane focused; pins of entry.params land
   on their cues (stacked labels); the 2022 Earth study as a cross; a schematic two-polarity inset collapses to its
   middle (a mean-square fit returns the average); the SURROGATES row of gate cells fills. */
Scene.define({
  duration: 36,
  register: 'night',
  cues: { fast: 0.4, kinds: 3.6, mhd: 8.0, earth: 11.6, mean: 18.0, middle: 23.6 },
  params: { lane: 'surrogates', pins: [], verdicts: { '3d': 'partly', walls: 'no', lowpm: 'no', rare: 'no' }, verdict_at: 'middle+0.8',
    two_polarity_inset: { box: [400, 556, 940, 736] }, lower_thirds: [] },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK;
    const M = SM.map(ctx, { focus: [{ at: -1, key: P.lane }], at: -0.3 });
    M.addPins(P.pins);
    // the earlier rows keep nothing here (first lane of the dive); the probe runs along the lane
    const pr = K.s('line', { stroke: K.c('chalk'), 'stroke-width': 2.5, 'stroke-dasharray': '4 8' }, M.svg);
    const tF = ctx.at('fast-0.15'), tEnd = ctx.at(P.verdict_at);
    ctx.add({ render(t) { const r = M.rowBox(P.lane, t), p = S.seg(t, tF, tEnd, S.ease.linear), y = r.y1 - 16;
      pr.setAttribute('x1', M.X0); pr.setAttribute('x2', M.X0 + (M.gx(0) - M.GW / 2 - M.X0) * p); pr.setAttribute('y1', y); pr.setAttribute('y2', y); pr.style.opacity = t >= tF ? 0.7 : 0; } });
    M.verdicts(P.lane, P.verdicts, P.verdict_at);
    K.chip(ctx, { text: 'gate verdicts: our reading of abstracts', kind: 'plain', x: 96, y: 52, at: P.verdict_at });
    // lower-thirds: references of the pins named in params.lower_thirds
    (P.lower_thirds || []).forEach((l) => { const pin = P.pins.find((p) => p.id === l.pin); if (pin && pin.ref) K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: pin.ref, at: l.cue + '+0.3', hold: l.hold }); });
    // the two-polarity inset (SCHEMATIC): bimodal D, blurs into one grey bump at 'middle', the fit marker slides to 0
    const B = P.two_polarity_inset.box, bx0 = 400, bx1 = 940, by0 = 556, by1 = 736;
    void B;
    const isvg = K.svgLayer(ctx, 34), ig = K.s('g', {}, isvg);
    K.s('rect', { x: bx0, y: by0, width: bx1 - bx0, height: by1 - by0, rx: 8, fill: K.c('bg'), stroke: K.c('muted'), 'stroke-width': 2 }, ig);
    const dx = (d) => bx0 + 30 + (bx1 - bx0 - 60) * (d + 2.6) / 5.2, base = by1 - 46;
    K.s('line', { x1: bx0 + 20, x2: bx1 - 20, y1: base, y2: base, stroke: K.c('muted'), 'stroke-width': 2 }, ig);
    const mir = K.s('line', { x1: dx(0), x2: dx(0), y1: by0 + 14, y2: base, stroke: K.c('chalk'), 'stroke-width': 2, 'stroke-dasharray': '4 6', opacity: 0 }, ig);
    const humpP = K.s('path', { d: '', fill: K.rgba(K.c('b'), 0.0), stroke: K.c('b'), 'stroke-width': 3.5 }, ig), humpN = K.s('path', { d: '', fill: 'none', stroke: K.c('b-neg'), 'stroke-width': 3.5 }, ig);
    const bump = K.s('path', { d: '', fill: 'none', stroke: K.c('muted'), 'stroke-width': 3.5 }, ig);
    const mk = K.s('path', { d: 'M0,0 l-11,18 h22 Z', fill: K.c('muted') }, ig);
    U.fade(ctx, ig, { at: 'mean+0.4' });
    U.label(ctx, { text: '−D', x: dx(-1.3), y: base + 6, anchor: 'c', size: 28, color: 'b-neg', at: 'mean+0.4', z: 35 });
    U.label(ctx, { text: '+D', x: dx(1.3), y: base + 6, anchor: 'c', size: 28, color: 'b', at: 'mean+0.4', z: 35 });
    K.chip(ctx, { text: 'illustration · a mean-square fit returns the average', kind: 'schematic', x: bx0 + 6, y: by0 + 8, at: 'mean+0.4' });
    const tM = ctx.at('middle-0.15');
    const g = (d, m, s) => Math.exp(-0.5 * ((d - m) / s) ** 2);
    const path = (f) => { let s = ''; for (let i = 0; i <= 80; i++) { const d = -2.6 + 5.2 * i / 80; s += `${i ? 'L' : 'M'}${dx(d).toFixed(1)},${(base - 110 * f(d)).toFixed(1)}`; } return s; };
    ctx.add({ render(t) {
      const p = S.seg(t, tM, tM + 1.2, S.ease.inOutCubic), sp = 0.45 + 0.9 * p, m = 1.3 * (1 - p);
      humpP.setAttribute('d', path((d) => (d >= 0 ? g(d, m, sp) : 0))); humpN.setAttribute('d', path((d) => (d < 0 ? g(d, -m, sp) : 0)));
      humpP.style.opacity = humpN.style.opacity = (1 - p).toFixed(3); bump.setAttribute('d', path((d) => g(d, 0, 0.5 + 0.4 * (1 - p)) * 0.95)); bump.style.opacity = p.toFixed(3);
      mk.setAttribute('transform', `translate(${dx(1.3 * (1 - p)).toFixed(1)} ${base + 4})`); mir.setAttribute('opacity', (0.5 * p).toFixed(3)); } });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    UK.formulaLayers(ctx, 'Formula');
  },
});
</script></body></html>
