<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X6.1 A gauge for a bounded world</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X6.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>

</head><body><div id="stage"></div>
<script>
/* X6.1 A gauge for a bounded world (PAPER, PROVED). A theorem drawn as a picture, no number: the periodic box becomes a
   vessel; in its meridian half-section the potential arrows tilt under seeded hills (A + ∇χ) while the field lines stay;
   gauge noise; the projector (M6) drops A' onto the gauge-fixed plane; arrows snap tangent at the wall; two panels for
   the two boundary conditions; the helicity label replaced by the relative helicity. Fields are analytic schematics
   (ψ = sin πr sin πz for the gauge-fixed potential), seeded hills, not solutions of anything. */
Scene.define({
  duration: 46, register: 'paper',
  cues: { walls: 0.6, many: 2.4, noise: 9.6, fix: 15.1, one: 21.1, second: 27.9, helicity: 34.7 },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, L = ctx.script.onscreen.labels, svg = K.svgLayer(ctx, 12);
    window.__EVENTS__ = [{ t: +(ctx.at('one') + 0.8).toFixed(3), id: 'pop', gain_db: -24 }];
    K.badge(ctx, { kind: 'PROVED', at: -0.3 });
    XK.title(ctx, ctx.script.onscreen.title, -0.3, { y: 132 });
    const [SX0, SY0, SX1, SY1] = P.section.box, sx = (r) => SX0 + (SX1 - SX0) * r, sy = (z) => SY1 - (SY1 - SY0) * z;
    // left: the periodic box (with two faint copies) cross-fades to an upright cylinder
    const cube = (g, ox, oy, op) => { const a = 150, d = 60; const q = K.s('g', { opacity: op }, g);
      const P0 = [[0, 0], [a, 0], [a, a], [0, a]].map(([x, y]) => [ox + x, oy + y]), P1 = P0.map(([x, y]) => [x + d, y - d]);
      [P0, P1].forEach((pp) => K.s('path', { d: 'M ' + pp.map((p) => p.join(' ')).join(' L ') + ' Z', fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, q));
      for (let k = 0; k < 4; k++) K.s('line', { x1: P0[k][0], y1: P0[k][1], x2: P1[k][0], y2: P1[k][1], stroke: K.c('fg-2'), 'stroke-width': 3 }, q); return q; };
    const gb = K.s('g', {}, svg); cube(gb, 380, 420, 1); const cp = K.s('g', {}, svg); cube(cp, 170, 420, 0.25); cube(cp, 590, 420, 0.25);
    XK.timed(ctx, gb, -0.3, 'walls+0.6'); XK.timed(ctx, cp, -0.3, 'walls-0.1');
    const cy = K.s('g', {}, svg);
    K.s('ellipse', { cx: 470, cy: 380, rx: 120, ry: 34, fill: 'none', stroke: K.c('fg'), 'stroke-width': 3 }, cy);
    K.s('path', { d: 'M 350 380 L 350 640 A 120 34 0 0 0 590 640 L 590 380', fill: 'none', stroke: K.c('fg'), 'stroke-width': 3 }, cy);
    K.s('line', { x1: 470, y1: 340, x2: 470, y2: 690, stroke: K.c('muted'), 'stroke-width': 1.5, 'stroke-dasharray': '14 6 3 6' }, cy);
    K.s('rect', { x: 470, y: 380, width: 120, height: 260, fill: K.rgba(K.c('fg'), 0.08) }, cy);
    XK.timed(ctx, cy, 'walls+0.4', 'noise-0.15', { din: 0.9 });
    XK.lab(ctx, L[0], 470, 724, { anchor: 'c', at: 'walls+0.6', out: 'noise-0.15' });
    // the section frame
    const fr = K.s('g', {}, svg);
    K.s('line', { x1: SX0, y1: SY0 - 10, x2: SX0, y2: SY1 + 10, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '14 6 3 6' }, fr);
    K.s('path', { d: `M ${SX0} ${SY0} L ${SX1} ${SY0} L ${SX1} ${SY1} L ${SX0} ${SY1}`, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2 }, fr);
    K.s('line', { x1: SX1, y1: SY0, x2: SX1, y2: SY1, stroke: K.c('fg'), 'stroke-width': 7 }, fr);
    XK.timed(ctx, fr, 'walls+0.8', 'second-0.15');
    XK.lab(ctx, L[1], SX0 + 8, SY1 - 40, { cls: 'mono', color: 'muted', at: 'walls+1.0', out: 'second-0.15' });
    XK.lab(ctx, L[2], SX1 - 12, SY0 + 4, { cls: 'mono', anchor: 'r', at: 'walls+1.0', out: 'second-0.15' });
    // potentials: A = A_fix + w0 G0 + Σ w_k ∇χ_k
    const AR = P.arrows, rng = S.rng(AR.seed), hr = S.rng(P.hills.seed);
    const bump = () => Array.from({ length: P.hills.n }, () => ({ r: 0.15 + 0.7 * hr(), z: 0.15 + 0.7 * hr(), a: (hr() < 0.5 ? -1 : 1) * (0.6 + 0.6 * hr()), s: 0.18 + 0.1 * hr() }));
    const hills = [bump(), bump(), bump(), bump(), bump()];   // 0: the initial gauge, 1: 'many', 2-4: 'noise'
    const grad = (H, r, z) => { let gr = 0, gz = 0; H.forEach((b) => { const e = b.a * Math.exp(-((r - b.r) ** 2 + (z - b.z) ** 2) / (2 * b.s * b.s)) / (b.s * b.s); gr -= e * (r - b.r); gz -= e * (z - b.z); }); return [gr * P.hills.amp, gz * P.hills.amp]; };
    const afix = (r, z) => [Math.sin(Math.PI * r) * Math.cos(Math.PI * z), -Math.cos(Math.PI * r) * Math.sin(Math.PI * z)];
    const ga = K.s('g', {}, svg), arrows = [];
    for (let i = 0; i < AR.nx; i++) for (let j = 0; j < AR.ny; j++) { const r = (i + 0.5) / AR.nx, z = (j + 0.5) / AR.ny;
      arrows.push({ r, z, el: K.s('path', { d: '', fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2.5, 'stroke-linecap': 'round' }, ga), rank: AR.nx - 1 - i + 0.3 * rng() }); }
    XK.timed(ctx, ga, 'many-0.15', 'second-0.15');
    // hill contours (faint)
    const hc = hills.map((H) => { const g = K.s('g', { opacity: 0 }, svg); H.forEach((b) => [0.5, 1, 1.5].forEach((m) => K.s('ellipse', { cx: sx(b.r), cy: sy(b.z), rx: m * b.s * (SX1 - SX0) * 0.6, ry: m * b.s * (SY1 - SY0) * 0.6, fill: 'none', stroke: K.c('muted'), 'stroke-width': 1.2, 'stroke-dasharray': '4 5' }, g))); return g; });
    // field lines (vermillion, schematic closed loops), they never move
    const gl = K.s('g', {}, svg);
    [[0.42, 0.5, 0.22, 0.36], [0.42, 0.5, 0.32, 0.42], [0.62, 0.5, 0.2, 0.18], [0.3, 0.5, 0.1, 0.2]].forEach(([r, z, a, b]) => K.s('ellipse', { cx: sx(r), cy: sy(z), rx: a * (SX1 - SX0), ry: b * (SY1 - SY0), fill: 'none', stroke: K.c('b'), 'stroke-width': 3.5 }, gl));
    XK.timed(ctx, gl, 'many+0.4', 'second-0.15');
    K.pen(ctx, { kind: 'check', box: { x: sx(0.62) + 0.2 * (SX1 - SX0) - 30, y: sy(0.5) - 30, w: 60, h: 60 }, at: 'many+4.2', out: 'noise-0.15' });
    XK.lab(ctx, L[3], SX0, 196, { at: 'many+3.4', out: 'second-0.15' });
    const tm = ctx.at('many') + 1.6, tn = ctx.at('noise') - 0.15, tf = ctx.at('fix') - 0.15;
    ctx.add({ render(t) {
      const w1 = S.seg(t, tm, tm + 1.2, S.ease.inOutSine) * (1 - S.seg(t, tn, tn + 0.3, S.ease.linear));
      const kn = t >= tn && t < tf ? 2 + Math.floor((t - tn) / 0.5) % 3 : -1;
      hc.forEach((g, k) => { g.style.opacity = (k === 1 ? w1 : k === kn ? 1 : 0) * 0.9; });
      arrows.forEach((a) => {
        const ts = tf + AR.stagger * 4 * a.rank, w0 = 1 - S.seg(t, ts, ts + AR.snap_dur, S.ease.inOutCubic);
        const [fr0, fz0] = afix(a.r, a.z), [g0r, g0z] = grad(hills[0], a.r, a.z); let vr = fr0 + w0 * g0r, vz = fz0 + w0 * g0z;
        if (w1 > 0) { const [gr, gz] = grad(hills[1], a.r, a.z); vr += w1 * gr; vz += w1 * gz; }
        if (kn > 0) { const [gr, gz] = grad(hills[kn], a.r, a.z); vr += gr; vz += gz; }
        const n = Math.hypot(vr, vz) || 1, len = Math.min(34, 20 + 10 * n), ux = vr / n, uz = vz / n, x = sx(a.r), y = sy(a.z);
        const x0 = x - ux * len / 2, y0 = y + uz * len / 2, x1 = x + ux * len / 2, y1 = y - uz * len / 2;
        a.el.setAttribute('d', `M ${x0.toFixed(1)} ${y0.toFixed(1)} L ${x1.toFixed(1)} ${y1.toFixed(1)} M ${(x1 - 9 * ux + 5 * uz).toFixed(1)} ${(y1 + 9 * uz + 5 * ux).toFixed(1)} L ${x1.toFixed(1)} ${y1.toFixed(1)} L ${(x1 - 9 * ux - 5 * uz).toFixed(1)} ${(y1 + 9 * uz - 5 * ux).toFixed(1)}`);
      });
    } });
    // gauge noise: a violet point cloud jittering with the hills
    const nc = K.s('g', {}, svg), pr = S.rng('x6-1-cloud'), pts = [];
    for (let k = 0; k < 60; k++) { const [a, b] = XK.gauss(pr); pts.push({ a, b, el: K.s('circle', { r: 5, fill: K.c('model') }, nc) }); }
    XK.timed(ctx, nc, 'noise-0.15', 'fix-0.15');
    ctx.add({ render(t) { if (t < tn || t > tf + 0.4) return; const k = Math.floor((t - tn) / 0.5) % 3, jr = S.rng('x6-1-j' + k);
      pts.forEach((p) => { const [u, v] = XK.gauss(jr); p.el.setAttribute('cx', (470 + 90 * p.a + 40 * u).toFixed(1)); p.el.setAttribute('cy', (520 + 70 * p.b + 30 * v).toFixed(1)); }); } });
    K.chip(ctx, { text: L[4], kind: 'generated', x: 380, y: 700, at: 'noise+0.4', out: 'fix-0.15' });
    // the projector (M6)
    const PB = P.projector.box, PXc = (PB[0] + PB[2]) / 2, PYc = PB[1] + 300, psc = 0.7;
    K.projector(ctx, { x: PXc, y: PYc, scale: psc, planeLabel: P.projector.plane_label, field: 'fg-2', at: 'fix-0.15', drop: 'fix+1.2' });
    XK.lab(ctx, L[5], PB[0], PB[1] - 10, { cls: 'mono', color: 'muted', at: 'fix-0.15' });
    const dl = K.s('g', {}, svg), fx = PXc + 60 * psc, fy = PYc - 20 * psc;
    [-150, 0, 150].forEach((dx, k) => K.s('line', { x1: fx + dx * psc - 40, y1: fy - 300 * psc, x2: fx + dx * psc + 30, y2: fy + 120 * psc, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '8 8' }, dl));
    XK.timed(ctx, dl, 'fix+0.4', null);
    XK.lab(ctx, L[7], fx + 150 * psc - 30, fy - 300 * psc - 40, { cls: 'small', color: 'muted', at: 'fix+0.6' });
    K.pen(ctx, { kind: 'check', box: { x: fx - 24, y: fy - 24, w: 48, h: 48 }, at: 'one-0.15' });
    XK.lab(ctx, L[8], PB[0], PB[3] + 20, { at: 'one+0.6', out: 'helicity-0.15' });
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: 'Amrouche & Seloula 2011 · Theorem 2.2', at: 'one+0.3', hold: 4 });
    // two panels for the two boundary conditions
    const panel = (box, normal, lab, out) => { const [x0, y0, x1, y1] = box, px = (r) => x0 + (x1 - x0) * r, py = (z) => y1 - (y1 - y0) * z, g = K.s('g', {}, svg);
      K.s('line', { x1: x0, y1: y0, x2: x0, y2: y1, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '14 6 3 6' }, g);
      K.s('path', { d: `M ${x0} ${y0} L ${x1} ${y0} L ${x1} ${y1} L ${x0} ${y1}`, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2 }, g);
      K.s('line', { x1: x1, y1: y0, x2: x1, y2: y1, stroke: K.c('fg'), 'stroke-width': 7 }, g);
      for (let i = 0; i < 5; i++) for (let j = 0; j < 9; j++) { const r = (i + 0.5) / 5 + (i === 4 ? 0.06 : 0), z = (j + 0.5) / 9;
        let [vr, vz] = normal ? [Math.sin(Math.PI * r / 2) * Math.cos(Math.PI * z), Math.cos(Math.PI * r / 2) * Math.sin(Math.PI * z) * 0.6] : afix(r, z);
        if (normal && i === 4) { vr = Math.sign(vr || 1); vz = 0; }
        const n = Math.hypot(vr, vz) || 1, ux = vr / n, uz = vz / n, x = px(Math.min(r, 0.97)), y = py(z), l = 13;
        K.s('path', { d: `M ${x - ux * l} ${y + uz * l} L ${x + ux * l} ${y - uz * l}`, stroke: K.c('fg-2'), 'stroke-width': 2.5, 'stroke-linecap': 'round' }, g); }
      const fl = K.s('g', {}, g);
      if (normal) [[0.45, 0.3, 0.3], [0.6, 0.45, 0.4]].forEach(([r, a, b]) => K.s('rect', { x: px(0.5 - a), y: py(0.5 + b), width: (x1 - x0) * 2 * a, height: (y1 - y0) * 2 * b, rx: 40, fill: 'none', stroke: K.c('b'), 'stroke-width': 3.5 }, fl));
      else [[0.62, 0.3, 0.3], [0.75, 0.42, 0.4]].forEach(([r, a, b]) => K.s('path', { d: `M ${x1} ${py(0.5 + b)} A ${(x1 - x0) * a} ${(y1 - y0) * b} 0 1 0 ${x1} ${py(0.5 - b)}`, fill: 'none', stroke: K.c('b'), 'stroke-width': 3.5 }, fl));
      XK.timed(ctx, g, 'second-0.15', out);
      XK.lab(ctx, lab, x0, 196, { at: 'second', out });
      return { g, px, py, x1 }; };
    const PL = panel(P.panels.left, false, L[9], null);
    panel(P.panels.right, true, L[10], 'helicity-0.15');
    // helicity: the lines continue outside the wall, dashed
    const ho = K.s('g', {}, svg), [lx0, ly0, lx1, ly1] = P.panels.left;
    [[0.3, 0.3], [0.42, 0.4]].forEach(([a, b]) => K.s('path', { d: `M ${lx1} ${PL.py(0.5 + b)} A ${(lx1 - lx0) * a * 0.5} ${(ly1 - ly0) * b} 0 0 1 ${lx1} ${PL.py(0.5 - b)}`, fill: 'none', stroke: K.c('b'), 'stroke-width': 2, 'stroke-dasharray': '8 7' }, ho));
    XK.timed(ctx, ho, 'helicity+0.2', null);
    const h1 = XK.lab(ctx, L[11], 180, 712, { color: 'metric', at: 'helicity+1.2' });
    K.pen(ctx, { kind: 'cross', box: { x: 180, y: 712, w: 380, h: 36 }, at: 'helicity+2.6' });
    XK.lab(ctx, L[12], 180, 760, { color: 'metric', at: 'helicity+3.4' });
    K.chip(ctx, { text: ctx.script.onscreen.chips[1], kind: 'plain', x: 180, y: 820, at: 'helicity+1.0' });
    const fl = (ctx.script.onscreen.formulas || []).map((f) => ({ tex: f.tex, at: f.cue, out: f.out }));
    K.formulaLayer(ctx, { items: fl });
  },
});
</script></body></html>
