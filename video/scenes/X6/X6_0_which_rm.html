<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X6.0 Which Rm?</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X6.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X6_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X6.0 Which Rm? (PAPER, CONTEXT). VKS meridian drawing redrawn as a schematic (proportions from the radii in the data
   file), one impeller turning; three page cards with a ruler each: the same 16 Hz rotation read in two conventions
   (values from data/X6_rm_conventions.json, transcribed by tools/data_X6.py), the third convention without a number
   (decision D19); the published thresholds as stamps; then a generator box with an 'Rm = ?' slot. T3 ink change
   NIGHT → PAPER in the lead-in. */
Scene.define({
  duration: 25, register: 'paper',
  cues: { first: 2.0, factor: 7.8, same: 15.2, convention: 19.7 },
  data: { rm: 'data/X6_rm_conventions.json' },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, D = ctx.data.rm, L = ctx.script.onscreen.labels, svg = K.svgLayer(ctx, 12);
    window.__EVENTS__ = [{ t: 0.2, id: 'whoosh', gain_db: -20 }, { t: +(ctx.at('convention') + 1.4).toFixed(3), id: 'pop', gain_db: -24 }];
    XK.inkChange(ctx, P.ink_change.t0, P.ink_change.t1, P.ink_change.pen_y, 'night');
    K.rail(ctx, { from: 'L5', to: 'L5', at: P.rail.at, hold: P.rail.hold });
    const TG = P.tag; K.lowerThird(ctx, { kind: 'chapter', l1: TG.l1, l2: TG.l2, at: TG.at, hold: TG.hold });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    XK.title(ctx, ctx.script.onscreen.title, 'first-0.15', { y: 172 });
    // the drawing (schematic): radii in px from the data's mm
    const r = D.radii_mm, s = 130 / r.R_cyl, AY = 540, X0 = 220, X1 = 700, g = K.s('g', {}, svg), ink = K.c('fg-2');
    const Rc = r.R_cyl * s, Ri = r.R_imp * s, Ro = r.R_o * s;
    K.s('rect', { x: X0 - 34, y: AY - Ro - 12, width: X1 - X0 + 68, height: 2 * Ro + 24, rx: 8, fill: 'none', stroke: ink, 'stroke-width': 6 }, g);
    K.s('rect', { x: X0 - 22, y: AY - Ro, width: X1 - X0 + 44, height: 2 * Ro, rx: 6, fill: K.rgba(K.c('fg'), 0.04), stroke: ink, 'stroke-width': 2 }, g);
    K.s('rect', { x: X0, y: AY - Rc, width: X1 - X0, height: 2 * Rc, fill: 'none', stroke: K.c('fg'), 'stroke-width': 3 }, g);
    K.s('line', { x1: X0 - 60, y1: AY, x2: X1 + 60, y2: AY, stroke: K.c('muted'), 'stroke-width': 1.5, 'stroke-dasharray': '14 6 3 6' }, g);
    const disc = (x, hi) => { const d = K.s('g', {}, g);
      K.s('rect', { x: x - 6, y: AY - Ri, width: 12, height: 2 * Ri, fill: K.rgba(K.c('fg'), hi ? 0.5 : 0.25), stroke: K.c(hi ? 'fg' : 'fg-2'), 'stroke-width': 2 }, d);
      for (let k = -3; k <= 3; k++) if (k) K.s('line', { x1: x, y1: AY + k * Ri / 3.6, x2: x + (x < 460 ? 22 : -22), y2: AY + k * Ri / 3.6, stroke: K.c('fg-2'), 'stroke-width': 2 }, d);
      K.s('line', { x1: x, y1: AY - 6, x2: x < 460 ? X0 - 60 : X1 + 60, y2: AY - 6, stroke: K.c('fg-2'), 'stroke-width': 4 }, d); return d; };
    disc(X0 + 50, true); disc(X1 - 50, false);
    XK.timed(ctx, g, -0.3, null);
    // the turning arrow around the axis of the left impeller (idle motion)
    const rot = K.s('path', { d: '', fill: 'none', stroke: K.c('param'), 'stroke-width': 3 }, svg), tip = K.s('path', { d: '', fill: K.c('param') }, svg);
    XK.timed(ctx, rot, 'first', null); XK.timed(ctx, tip, 'first', null);
    ctx.add({ render(t) { const cx = X0 + 50, a0 = 0.6 * t, pts = [];
      for (let k = 0; k <= 24; k++) { const a = a0 + k * 0.2; pts.push(`${(cx - 26 * Math.cos(a) * 0.35).toFixed(1)} ${(AY - Ri - 26 + 22 * Math.sin(a) * 0.3 + 0).toFixed(1)}`); }
      const a = a0 + 4.8, ex = cx - 26 * Math.cos(a) * 0.35, ey = AY - Ri - 26 + 22 * Math.sin(a) * 0.3;
      rot.setAttribute('d', `M ${cx - 34} ${AY - Ri - 26} a 34 12 0 1 0 68 0`);
      const ph = (0.7 * t) % 1, tx = cx - 34 * Math.cos(Math.PI * ph), ty = AY - Ri - 26 + 12 * Math.sin(Math.PI * ph);
      tip.setAttribute('d', `M ${tx - 8} ${ty - 7} L ${tx + 9} ${ty} L ${tx - 8} ${ty + 7} Z`); } });
    XK.lab(ctx, L[2], X0 - 30, 300, { color: 'param', at: 'first+0.4' });
    K.chip(ctx, { text: ctx.script.onscreen.chips[1], kind: 'plain', x: 160, y: 760, at: 'first+0.8', out: 'same+0.3' });
    // the three radii on the three clauses
    const fac = [ctx.at('factor'), XK.frac(ctx, 'factor', 0.38), XK.frac(ctx, 'factor', 0.72)];
    [[460, Rc, 'R_cyl'], [X0 + 80, Ri, 'R_imp'], [600, Ro, 'R_o']].forEach(([x, R, nm], k) => {
      const ln = K.s('path', { d: `M ${x} ${AY} L ${x} ${AY + R}`, fill: 'none', stroke: K.c('fg'), 'stroke-width': 3 }, svg);
      XK.drawOn(ctx, ln, fac[k] - 0.15, 0.5);
      XK.lab(ctx, L[3 + k], x + 8, AY + R / 2 - 18, { cls: 'mono', at: fac[k] + 0.2 }); });
    // the cards
    const CX = 900, CW = 880, CH = 146, RX0 = 1110, RX1 = 1740, RU = P.cards.ruler, rx = (v) => RX0 + (RX1 - RX0) * (v - RU.min) / (RU.max - RU.min);
    const cards = [], ptx = [];
    D.defs.forEach((d, k) => { const y = 280 + k * 154, c = K.s('g', {}, svg), at = fac[k] - 0.15;
      K.s('rect', { x: CX, y, width: CW, height: CH, rx: 6, fill: K.c('panel'), stroke: K.c('grid'), 'stroke-width': 1.5 }, c);
      K.s('line', { x1: RX0, y1: y + 60, x2: RX1, y2: y + 60, stroke: K.c('fg-2'), 'stroke-width': 2 }, c);
      for (let v = RU.min; v <= RU.max; v += RU.tick) K.s('line', { x1: rx(v), y1: y + 52, x2: rx(v), y2: y + 68, stroke: K.c('fg-2'), 'stroke-width': v % 40 ? 1 : 2 }, c);
      const els = [c];
      els.push(XK.lab(ctx, `${d.card} · ${d.rule}`, CX + 18, y + 6, { at, dx: 40 }));
      els.push(XK.lab(ctx, L[9], CX + 18, y + 54, { cls: 'small', color: 'muted', at, dx: 40 }));
      els.push(XK.lab(ctx, String(RU.min), RX0, y + 66, { cls: 'mono', color: 'muted', anchor: 'c', at }));
      if (d.at) els.push(XK.lab(ctx, String(RU.max), RX1, y + 66, { cls: 'mono', color: 'muted', anchor: 'c', at }));
      XK.timed(ctx, c, at, 'convention-0.15', { dx: 40 });
      if (d.at) { const v = d.at[String(D.F_hz[0])], px = rx(v); ptx.push([px, y]);
        const pg = K.s('path', { d: `M ${px} ${y + 58} L ${px - 10} ${y + 40} L ${px + 10} ${y + 40} Z`, fill: K.c('param') }, svg); XK.timed(ctx, pg, at + 0.4, 'convention-0.15');
        els.push(XK.lab(ctx, v.toFixed(1), px, y + 66, { anchor: 'c', cls: 'mono', color: 'param', at: at + 0.4 })); }
      else { const nl = K.s('line', { x1: rx(40), y1: y + 48, x2: rx(80), y2: y + 48, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '8 6' }, svg); XK.timed(ctx, nl, at + 0.4, 'convention-0.15');
        els.push(XK.lab(ctx, L[11], rx(56), y + 66, { cls: 'small', color: 'muted', anchor: 'c', at: at + 0.4 })); }
      // stamps on 'same'
      const st = d.threshold ? (d.threshold.note ? `${L[12]} · ${L[14]}` : `${L[12]} · ${L[13]}`) : L[15];
      els.push(XK.lab(ctx, st, CX + 18, y + 104, { cls: 'small', color: d.threshold ? 'fg' : 'muted', at: XK.at(ctx, 'same', 0.4 * k - 0.15) }));
      if (d.threshold && d.threshold.lo !== undefined) { const br = K.s('path', { d: `M ${rx(d.threshold.lo)} ${y + 30} L ${rx(d.threshold.lo)} ${y + 24} L ${rx(d.threshold.hi)} ${y + 24} L ${rx(d.threshold.hi)} ${y + 30}`, fill: 'none', stroke: K.c('fg'), 'stroke-width': 3 }, svg);
        XK.timed(ctx, br, XK.at(ctx, 'same', 0.4 * k), 'convention-0.15'); }
      els.slice(1).forEach((e) => { e.dataset.out = 1; XK.timed(ctx, e, at, 'convention-0.15', { dx: 0 }); });
      cards.push(els); });
    // ÷ K arrow between the two pointers
    const [[p1, y1], [p2, y2]] = ptx, ar = K.s('path', { d: `M ${p1 + 12} ${y1 + 40} C ${p1 + 200} ${y1 + 20}, ${p2 - 60} ${y2 - 80}, ${p2 - 4} ${y2 + 36}`, fill: 'none', stroke: K.c('fg'), 'stroke-width': 2 }, svg);
    XK.drawOn(ctx, ar, XK.at(ctx, 'factor', 0.9 * (ctx.at('same') - ctx.at('factor')) - 0.6), 0.6, 'convention-0.15');
    XK.lab(ctx, L[10], 1580, y1 + 104, { cls: 'small', at: XK.at(ctx, 'factor', 0.9 * (ctx.at('same') - ctx.at('factor'))), out: 'convention-0.15' });
    [0, 1].forEach((k) => K.pen(ctx, { kind: 'underline', box: { x: CX + 18, y: 280 + 154 * k + 104, w: k ? 800 : 420, h: 34 }, at: XK.at(ctx, 'same', 2.0 + 0.3 * k), out: 'convention-0.15' }));
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: 'Monchaux 2007 · Nore 2018 · Miralles 2013 · R:141', at: 'same+0.6', hold: 4 });
    // the generator with its slot
    const gg = K.s('g', {}, svg), GX = 1180, GY = 380;
    K.s('rect', { x: GX, y: GY, width: 460, height: 240, rx: 18, fill: K.rgba(K.c('model'), 0.08), stroke: K.c('model'), 'stroke-width': 4 }, gg);
    for (let k = 0; k < 3; k++) K.s('circle', { cx: GX + 140 + 90 * k, cy: GY + 120, r: 26, fill: 'none', stroke: K.c('model'), 'stroke-width': 3 }, gg);
    K.s('rect', { x: GX - 160, y: GY + 90, width: 160, height: 60, rx: 8, fill: 'none', stroke: K.c('param'), 'stroke-width': 3 }, gg);
    XK.timed(ctx, gg, 'convention-0.15', null);
    const slot = XK.lab(ctx, L[16], GX - 80, GY + 100, { anchor: 'c', color: 'param', at: 'convention' });
    K.pen(ctx, { kind: 'circle', box: { x: GX - 50, y: GY + 96, w: 34, h: 48 }, pad: 6, at: 'convention+1.0' });
    XK.lab(ctx, L[17], GX - 160, GY + 170, { at: 'convention+1.4' });
    const fl = (ctx.script.onscreen.formulas || []).map((f) => ({ tex: f.tex, at: f.cue, out: f.out }));
    K.formulaLayer(ctx, { items: fl });
  },
});
</script></body></html>
