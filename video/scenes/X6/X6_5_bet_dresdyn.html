<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X6.5 Bet: DRESDYN, the precession knob</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X6.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X6_kit.js"></script>
<style>
  .kit-seat-col { left: 1256px !important; width: 568px !important; }
</style>
</head><body><div id="stage"></div>
<script>
/* X6.5 Bet: DRESDYN, the precession knob (NIGHT, PENDING: CONJECTURE low). Flat SVG anchor instead of Three.js: a
   precessing cylinder (projected box, spin stripes, blue streaks, the axis tip on a dashed cone); the Po knob speeds
   the precession up and back; the generated flow → solver → (Rm_c, symmetry) pipeline; then Kit.seat 'curve' with no
   ticks, the placeholders (two dashed dots, an open dashed circle with a vertical band) and two empty symmetry boxes. */
Scene.define({
  duration: 38, register: 'night',
  cues: { anchor: 0.5, knob: 5.4, flow: 11.7, bet: 21.6, confidence: 26.9, ask: 32.2 },
  data: { seat: { url: 'data/tier4_dresdyn.json', optional: true } },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, SE = P.seat, L = ctx.script.onscreen.labels, C = ctx.script.onscreen.chips, svg = K.svgLayer(ctx, 12), res = ctx.variant === 'result';
    window.__EVENTS__ = [{ t: +(ctx.at('knob') + 0.6).toFixed(3), id: 'detent', gain_db: -24 }];
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'low', at: -0.3 });
    // the precessing cylinder (flat projection)
    const cg = K.s('g', {}, svg), CX = 820, CY = 500, H = 170, W = 80, AL = 0.42;
    const cone = K.s('ellipse', { fill: 'none', stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '8 8' }, cg);
    K.s('line', { x1: CX, y1: CY - 260, x2: CX, y2: CY + 230, stroke: K.c('muted'), 'stroke-width': 1.5, 'stroke-dasharray': '14 6 3 6' }, cg);
    const body = K.s('path', { fill: K.rgba(K.c('fg'), 0.08), stroke: K.c('fg-2'), 'stroke-width': 3 }, cg);
    const stripes = [0, 1, 2, 3, 4, 5].map(() => K.s('line', { stroke: K.c('fg-2'), 'stroke-width': 1.5 }, cg));
    const streaks = [-0.5, 0, 0.5].map(() => K.s('path', { fill: 'none', stroke: K.c('u'), 'stroke-width': 3 }, cg));
    const gstreaks = [-0.5, 0, 0.5].map(() => K.s('path', { fill: 'none', stroke: K.c('model'), 'stroke-width': 2, 'stroke-dasharray': '6 6', opacity: 0 }, cg));
    const tip = K.s('circle', { r: 6, fill: K.c('fg') }, cg);
    const tk = ctx.at('knob') + 0.6, tr = ctx.at('knob') + 3.6, tf = ctx.at('flow') - 0.15, tic = XK.frac(ctx, 'flow', 0.78);
    const bump = (t) => S.seg(t, tk, tk + 0.6, S.ease.inOutSine) * (1 - S.seg(t, tr, tr + 0.6, S.ease.inOutSine));
    const phi = (t) => { let I = 0; const n = 120; if (t > tk) { const t1 = Math.min(t, tr + 0.6); for (let i = 0; i < n; i++) I += bump(tk + (i + 0.5) * (t1 - tk) / n) * (t1 - tk) / n; } return 2 * Math.PI * (t + 2 * I) / 12; };
    const ico = { x: 1010, y: 150, s: 0.3 };
    ctx.add({ render(t) {
      const f = phi(t), ax = Math.sin(AL) * Math.sin(f), ay = -Math.cos(AL), n = Math.hypot(ax, ay), ux = ax / n, uy = ay / n, px = -uy, py = ux, hl = H * n;
      const c = (s, w) => [CX + ux * hl * s + px * W * w, CY + uy * hl * s + py * W * w];
      body.setAttribute('d', 'M ' + [c(1, 1), c(1, -1), c(-1, -1), c(-1, 1)].map((q) => q.map((v) => v.toFixed(1)).join(' ')).join(' L ') + ' Z');
      stripes.forEach((e, k) => { const w = Math.sin(1.4 * t + k * Math.PI / 3), [x1, y1] = c(0.95, w), [x2, y2] = c(-0.95, w); e.setAttribute('x1', x1); e.setAttribute('y1', y1); e.setAttribute('x2', x2); e.setAttribute('y2', y2); e.style.opacity = Math.cos(1.4 * t + k * Math.PI / 3) > 0 ? 0.9 : 0.25; });
      const sk = (k) => { const w = [-0.5, 0, 0.5][k], a = c(-0.7, w), b = c(0, w + 0.25), d = c(0.7, w); return `M ${a[0].toFixed(1)} ${a[1].toFixed(1)} Q ${b[0].toFixed(1)} ${b[1].toFixed(1)} ${d[0].toFixed(1)} ${d[1].toFixed(1)}`; };
      streaks.forEach((e, k) => e.setAttribute('d', sk(k))); gstreaks.forEach((e, k) => { e.setAttribute('d', sk(k)); e.style.opacity = S.seg(t, tf, tf + 0.5, S.ease.linear); });
      const tp = c(1, 0); tip.setAttribute('cx', tp[0]); tip.setAttribute('cy', tp[1]);
      cone.setAttribute('cx', CX); cone.setAttribute('cy', CY - H * Math.cos(AL)); cone.setAttribute('rx', H * Math.sin(AL)); cone.setAttribute('ry', 0.3 * H * Math.sin(AL));
      const p = S.seg(t, tic, tic + 0.9, S.ease.inOutCubic), s = 1 + (ico.s - 1) * p;
      cg.setAttribute('transform', `translate(${(CX + (ico.x + 120 * ico.s - CX) * p).toFixed(1)} ${(CY + (ico.y + 260 * ico.s - CY) * p).toFixed(1)}) scale(${s.toFixed(4)}) translate(${-CX} ${-CY})`);
    } });
    XK.timed(ctx, cg, 'anchor-0.15', null);
    XK.lab(ctx, L[0], CX, CY + 250, { anchor: 'c', at: 'anchor+0.3', out: tic - 0.1, raw: true });
    K.chip(ctx, { text: C[0], kind: 'plain', x: 180, y: 812, at: 'anchor+0.6', out: tic - 0.1 });
    K.knob(ctx, { x: 1180, y: 420, r: 40, min: 0, max: 1, label: L[1], labelDy: 62, showValue: false, ticks: 2, at: 'knob-0.15', out: tic - 0.1,
      keys: [{ at: 'knob-0.15', v: 0.3, dur: 0 }, { at: 'knob+0.1', v: 0.55, dur: 0.5 }, { at: tr, v: 0.3, dur: 0.6 }] });
    // the pipeline
    const parts = L[10].split(' → '), pg = K.s('g', {}, svg);
    K.s('path', { d: 'M 1010 560 L 1240 560 M 1228 552 L 1240 560 L 1228 568', fill: 'none', stroke: K.c('fg'), 'stroke-width': 2.5 }, pg);
    K.s('rect', { x: 1250, y: 520, width: 420, height: 80, rx: 8, fill: K.c('panel'), stroke: K.c('fg-2'), 'stroke-width': 2 }, pg);
    K.s('path', { d: 'M 1460 600 L 1460 640 M 1360 640 L 1560 640 M 1360 640 L 1360 664 M 1560 640 L 1560 664', fill: 'none', stroke: K.c('fg'), 'stroke-width': 2.5 }, pg);
    XK.timed(ctx, pg, 'flow+1.0', tic - 0.1, { raw: false });
    XK.lab(ctx, parts[1], 1460, 540, { anchor: 'c', cls: 'small', at: 'flow+1.0', out: tic - 0.1 });
    parts[2].split(', ').forEach((o, k) => XK.lab(ctx, o, 1360 + 200 * k, 668, { anchor: 'c', color: k ? 'b' : 'fg', at: 'flow+1.8', out: tic - 0.1 }));
    XK.lab(ctx, L[10], 180, 760, { cls: 'small', color: 'muted', at: 'flow+2.2', out: tic - 0.1 });
    // the seat
    const fr = { x: 300, y: 270, w: 680, h: 240 };
    K.seat(ctx, { type: 'curve', variant: ctx.variant, data: ctx.data.seat, tag: SE.tag, frame: fr,
      x: { label: SE.x.label, min: 0, max: 1, ticks: [], param: true }, y: { label: SE.y.label, min: 0, max: 1, ticks: [] },
      bet: SE.bet, confidence: SE.confidence, criterion: SE.criterion, source: SE.source, ask: SE.ask,
      cues: res ? { frame: 'anchor', bet: 'curve', criterion: 'curve+1.5', ask: 'fixed', data: 'verdict' } : { frame: tic + 0.6, bet: 'bet', criterion: 'bet+1.5', ask: 'ask', data: 'confidence' } });
    const fx = (v) => fr.x + v * fr.w, fy = (v) => fr.y + fr.h - v * fr.h, ph = K.s('g', {}, svg), at = tic + 1.0;
    [[0.25, 0.66], [0.75, 0.86]].forEach(([x, y]) => K.s('circle', { cx: fx(x), cy: fy(y), r: 10, fill: 'none', stroke: K.c('muted'), 'stroke-width': 2.5, 'stroke-dasharray': '4 4' }, ph));
    const band = K.s('rect', { x: fx(0.5) - 14, y: fy(0.88), width: 28, height: fy(0.66) - fy(0.88), fill: K.rgba(K.c('fg'), 0.1), stroke: K.c('muted'), 'stroke-width': 1.5, 'stroke-dasharray': '6 5' }, ph);
    K.s('circle', { cx: fx(0.5), cy: fy(0.77), r: 16, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2.5, 'stroke-dasharray': '6 5' }, ph);
    XK.timed(ctx, ph, at, null, { raw: true });
    XK.lab(ctx, L[4], fx(0.25), fy(0.66) + 18, { anchor: 'c', cls: 'small', color: 'muted', at, raw: true });
    XK.lab(ctx, L[5], fx(0.5) + 30, fy(0.77) - 30, { cls: 'small', at, raw: true });
    XK.lab(ctx, L[6], fx(0.5) + 30, fy(0.77) + 6, { cls: 'small', color: 'muted', at: at + 0.3, raw: true });
    // symmetry badge: two empty boxes
    XK.lab(ctx, L[7], 180, 648, { at: at + 0.4, raw: true });
    const sb = K.s('g', {}, svg); [0, 1].forEach((k) => K.s('rect', { x: 180, y: 702 + 44 * k, width: 26, height: 26, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2 }, sb));
    XK.timed(ctx, sb, at + 0.4, null, { raw: true });
    [0, 1].forEach((k) => XK.lab(ctx, L[8 + k], 220, 696 + 44 * k, { cls: 'small', at: at + 0.4, raw: true }));
    const pu = K.s('g', {}, svg); K.s('rect', { x: fx(0.5) - 18, y: fy(0.88) - 4, width: 36, height: fy(0.66) - fy(0.88) + 8, fill: 'none', stroke: K.c('fg'), 'stroke-width': 2 }, pu);
    [0, 1].forEach((k) => K.s('rect', { x: 176, y: 698 + 44 * k, width: 34, height: 34, fill: 'none', stroke: K.c('fg'), 'stroke-width': 2 }, pu));
    XK.timed(ctx, pu, 'bet+0.4', 'bet+1.2');
    XK.lab(ctx, SE.why, 1256, 640, { w: 560, cls: 'small', color: 'muted', at: 'confidence+0.6', out: 'ask-0.4' });
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: 'Botez et al. 2026 · Phys. Rev. Fluids 11, 083701', at: 'confidence', hold: 4 });
    const fl = (ctx.script.onscreen.formulas || []).map((f) => ({ tex: f.tex, at: f.cue, out: f.out || 'confidence-0.15' }));
    K.formulaLayer(ctx, { items: res ? [{ tex: fl[0].tex, at: 'anchor', out: 'verdict' }] : fl });
  },
});
</script></body></html>
