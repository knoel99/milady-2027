<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X6.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X6.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X6_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X6.Q question card (framing; no claim, no badge). Text from the script's "question"; behind it at 10 %, the
   schematic VKS cylinder of X6.4 (outline, shell, two discs) with three small tag pills (no text), slow drift. */
Scene.define({
  duration: 9, register: 'night',
  cues: { q: 0.5 },
  params: { backdrop: { opacity: 0.1 } },
  setup(ctx) {
    const K = Kit, P = ctx.params;
    window.__EVENTS__ = [{ t: +Math.max(0, ctx.at('q') - 0.2).toFixed(3), id: 'chime', gain_db: -22 }];
    const svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: P.backdrop.opacity }, svg), CX = 960, CY = 500;
    K.s('rect', { x: CX - 520, y: CY - 270, width: 1040, height: 540, rx: 20, fill: 'none', stroke: K.c('fg'), 'stroke-width': 8 }, bg);
    K.s('rect', { x: CX - 480, y: CY - 230, width: 960, height: 460, rx: 10, fill: 'none', stroke: K.c('fg'), 'stroke-width': 4 }, bg);
    [-1, 1].forEach((s) => K.s('rect', { x: CX + s * 380 - 10, y: CY - 180, width: 20, height: 360, fill: K.c('fg') }, bg));
    [[CX - 300, CY - 330, 'param'], [CX + 120, CY - 330, 'fg'], [CX + 300, CY + 300, 'fg']].forEach(([x, y, c]) => K.s('rect', { x, y, width: 200, height: 44, rx: 22, fill: 'none', stroke: K.c(c), 'stroke-width': 4 }, bg));
    ctx.bgG = bg;
    K.questionCard(ctx, { chapter: 'X6', category: 'framing', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.bgG.setAttribute('transform', `translate(${(-6 * Math.sin(2 * Math.PI * t / 9)).toFixed(2)} 0)`); },
});
</script></body></html>
