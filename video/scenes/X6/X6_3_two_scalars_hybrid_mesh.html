<html lang="en"><head><meta charset="utf-8">
<title>X6.3 Two scalars and a hybrid mesh</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X6.css">
<script src="../../vendor/katex/katex.min.js"></script>

<script src="../../runtime/components/hud.js"></script>

</head><body><div id="stage"></div>
<script>
/* X6.3 Two scalars and a hybrid mesh (PAPER, PROVED). SCHEMATIC: a wire cube with three component maps folding into
   two scalar sheets; the meridian half-plane with a seeded Delaunay mesh (Bowyer-Watson in the page, denser near the
   impeller discs), the four Fourier rings, a sweep around the axis; potential arrows turned by a curl gate; two meters
   without numbers (generated: at the bottom mark; solver data: a band just above it), the caption relabelled. */
Scene.define({
  duration: 40, register: 'paper',
  cues: { scalars: 0.5, nogauge: 6.7, slices: 12.9, exact: 23.6, weak: 28.9, yardstick: 35.5 },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, L = ctx.script.onscreen.labels, C = ctx.script.onscreen.chips, svg = K.svgLayer(ctx, 12);
    K.badge(ctx, { kind: 'PROVED', at: -0.3 });
    XK.title(ctx, ctx.script.onscreen.title, -0.3, { y: 132 });
    // left: cube with a bundle of field lines, three component maps → two scalar sheets
    const lg = K.s('g', {}, svg), a = 170, d = 60, ox = 180, oy = 330;
    const P0 = [[0, 0], [a, 0], [a, a], [0, a]].map(([x, y]) => [ox + x, oy + y]), P1 = P0.map(([x, y]) => [x + d, y - d]);
    [P0, P1].forEach((pp) => K.s('path', { d: 'M ' + pp.map((p) => p.join(' ')).join(' L ') + ' Z', fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3 }, lg));
    for (let k = 0; k < 4; k++) K.s('line', { x1: P0[k][0], y1: P0[k][1], x2: P1[k][0], y2: P1[k][1], stroke: K.c('fg-2'), 'stroke-width': 3 }, lg);
    for (let k = 0; k < 5; k++) K.s('path', { d: `M ${ox + 10} ${oy + 40 + 22 * k} C ${ox + 80} ${oy - 10 + 22 * k}, ${ox + 140} ${oy + 90 + 22 * k}, ${ox + a + d - 10} ${oy + 10 + 22 * k}`, fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, lg);
    XK.timed(ctx, lg, 'scalars-0.15', null, { dim: ['nogauge+1.2', 0.4] });
    const map = (g, x, y, w, ph) => { K.s('rect', { x, y, width: w, height: w, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2 }, g);
      for (let k = 1; k <= 3; k++) K.s('ellipse', { cx: x + w / 2 + 10 * Math.cos(ph), cy: y + w / 2 + 10 * Math.sin(ph), rx: k * w / 8, ry: k * w / 10, fill: 'none', stroke: K.c('muted'), 'stroke-width': 1.5, transform: `rotate(${ph * 57} ${x + w / 2} ${y + w / 2})` }, g); };
    const g3 = K.s('g', {}, svg); [0, 1, 2].forEach((k) => map(g3, 470 + k * 135, 330, 120, k * 1.3));
    XK.timed(ctx, g3, 'scalars-0.15', XK.frac(ctx, 'scalars', 0.6));
    const l3 = XK.lab(ctx, L[0], 470, 462, { cls: 'mono', at: 'scalars-0.15', out: XK.frac(ctx, 'scalars', 0.6) });
    const g2 = K.s('g', {}, svg); [0, 1].forEach((k) => map(g2, 500 + k * 190, 330, 150, 0.6 + k * 1.7));
    XK.timed(ctx, g2, XK.frac(ctx, 'scalars', 0.6), null, { din: 1.2, dim: ['nogauge+1.2', 0.4] });
    XK.lab(ctx, L[1], 575, 492, { anchor: 'c', at: XK.frac(ctx, 'scalars', 0.7), dim: ['nogauge+1.2', 0.4] });
    XK.lab(ctx, L[2], 765, 492, { anchor: 'c', at: XK.frac(ctx, 'scalars', 0.75), dim: ['nogauge+1.2', 0.4] });
    K.pen(ctx, { kind: 'check', box: { x: 180, y: 540, w: 44, h: 44 }, at: 'nogauge+0.4', out: 'slices-0.15' });
    XK.lab(ctx, L[3], 236, 544, { at: 'nogauge', out: 'exact-0.15' });
    // the meridian half-plane: seeded Delaunay mesh
    const [MX0, MY0, MX1, MY1] = P.mesh.box, rng = S.rng(P.mesh.seed), pts = [];
    for (let i = 0; i <= 6; i++) { pts.push([i / 6, 0], [i / 6, 1]); } for (let j = 1; j < 9; j++) pts.push([0, j / 9], [1, j / 9]);
    while (pts.length < P.mesh.n_points) { const r = rng(), z = rng(), near = Math.min(Math.abs(z - 0.15), Math.abs(z - 0.85)) < 0.07 && r < 0.78;
      if (near || rng() < 0.35) pts.push([0.03 + 0.94 * r, 0.03 + 0.94 * z]); }
    const tri = (() => { const V = pts.concat([[-10, -10], [10, -10], [0, 10]]), n = pts.length; let T = [[n, n + 1, n + 2]];
      const cc = (t) => { const [ax, ay] = V[t[0]], [bx, by] = V[t[1]], [cx, cy] = V[t[2]], dd = 2 * (ax * (by - cy) + bx * (cy - ay) + cx * (ay - by));
        const ux = ((ax * ax + ay * ay) * (by - cy) + (bx * bx + by * by) * (cy - ay) + (cx * cx + cy * cy) * (ay - by)) / dd, uy = ((ax * ax + ay * ay) * (cx - bx) + (bx * bx + by * by) * (ax - cx) + (cx * cx + cy * cy) * (bx - ax)) / dd;
        return [ux, uy, (ax - ux) ** 2 + (ay - uy) ** 2]; };
      for (let p = 0; p < n; p++) { const [px, py] = V[p], bad = [], keep = [];
        T.forEach((t) => { const [ux, uy, r2] = cc(t); ((px - ux) ** 2 + (py - uy) ** 2 < r2 ? bad : keep).push(t); });
        const edges = []; bad.forEach((t) => [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]].forEach((e) => edges.push(e)));
        const bnd = edges.filter((e, i) => !edges.some((f, j) => j !== i && ((f[0] === e[0] && f[1] === e[1]) || (f[0] === e[1] && f[1] === e[0]))));
        T = keep.concat(bnd.map((e) => [e[0], e[1], p])); }
      return T.filter((t) => t.every((v) => v < n)); })();
    const mx = (r) => MX0 + (MX1 - MX0) * r, my = (z) => MY1 - (MY1 - MY0) * z, mg = K.s('g', {}, svg), mesh = K.s('g', {}, mg);
    const ed = new Set(); tri.forEach((t) => [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]].forEach(([u, v]) => ed.add(u < v ? u + ',' + v : v + ',' + u)));
    const edl = [...ed].map((s) => s.split(',').map(Number)).sort((e, f) => (pts[e[0]][1] + pts[e[1]][1]) - (pts[f[0]][1] + pts[f[1]][1]));
    const tdraw = ctx.at('slices') + 0.6;
    edl.forEach(([u, v], k) => { const ln = K.s('line', { x1: mx(pts[u][0]), y1: my(pts[u][1]), x2: mx(pts[v][0]), y2: my(pts[v][1]), stroke: K.c('fg-2'), 'stroke-width': 1.2, opacity: 0 }, mesh); ln.dataset.t = tdraw + 1.0 * k / edl.length; });
    K.s('rect', { x: MX0, y: MY0, width: MX1 - MX0, height: MY1 - MY0, fill: 'none', stroke: K.c('fg'), 'stroke-width': 3 }, mg);
    [0.15, 0.85].forEach((z) => K.s('rect', { x: MX0, y: my(z) - 4, width: (MX1 - MX0) * 0.75, height: 8, fill: K.rgba(K.c('fg'), 0.45) }, mg));
    K.s('line', { x1: MX0, y1: MY0 - 16, x2: MX0, y2: MY1 + 4, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '14 6 3 6' }, mg);
    XK.timed(ctx, mg, 'slices-0.15', null);
    const meshEls = [...mesh.children], tsw = ctx.at('slices') + 0.9 * (ctx.at('exact') - ctx.at('slices')) - 2.2;
    ctx.add({ render(t) { meshEls.forEach((e) => { e.style.opacity = S.seg(t, +e.dataset.t, +e.dataset.t + 0.2, S.ease.linear); });
      const p = S.seg(t, tsw, tsw + 2, S.ease.inOutSine), c = Math.cos(2 * Math.PI * p);
      mg.setAttribute('transform', `translate(${MX0} 0) scale(${c.toFixed(4)} 1) translate(${-MX0} 0)`); } });
    XK.lab(ctx, L[5], MX0, MY0 - 52, { at: 'slices+0.8' });
    XK.lab(ctx, L[4], MX0 - 10, MY0 - 6, { cls: 'mono', color: 'muted', anchor: 'r', at: 'slices+0.8' });
    K.chip(ctx, { text: C[0], kind: 'plain', x: 180, y: 800, at: 'slices+0.8', out: 'yardstick+0.6' });
    // four Fourier rings on 'zero, one, two, three'
    const RG = P.rings;
    RG.m.forEach((m, k) => { const cx = RG.x, cy = RG.y0 + k * RG.dy, at = XK.frac(ctx, 'slices', 0.33 + 0.07 * k), g = K.s('g', {}, svg);
      K.s('circle', { cx, cy, r: RG.r, fill: 'none', stroke: K.c('grid'), 'stroke-width': 1.5 }, g);
      if (m === 0) K.s('circle', { cx, cy, r: RG.r, fill: 'none', stroke: K.c('b'), 'stroke-width': 6 }, g);
      else for (let s = 0; s < 72; s++) { const a0 = 2 * Math.PI * s / 72, a1 = 2 * Math.PI * (s + 1) / 72, rr = (q) => RG.r + 12 * Math.cos(m * q);
        K.s('line', { x1: cx + rr(a0) * Math.cos(a0), y1: cy + rr(a0) * Math.sin(a0), x2: cx + rr(a1) * Math.cos(a1), y2: cy + rr(a1) * Math.sin(a1), stroke: K.c(Math.cos(m * (a0 + a1) / 2) >= 0 ? 'b' : 'b-light'), 'stroke-width': 4 }, g); }
      XK.timed(ctx, g, at, null, { raw: true });
      XK.lab(ctx, L[6 + k], cx + RG.r + 26, cy - 18, { cls: 'mono', at, raw: true }); });
    // exact: potential arrows on the nodes, the curl gate turns them into a field
    const ag = K.s('g', {}, svg), arr = [], te = ctx.at('exact') - 0.15;
    pts.forEach(([r, z], i) => { if (i % 2 || r < 0.05 || r > 0.95 || z < 0.05 || z > 0.95) return; arr.push({ x: mx(r), y: my(z), a: Math.atan2(Math.cos(Math.PI * z), Math.sin(Math.PI * r)), el: K.s('path', { d: '', fill: 'none', 'stroke-width': 2.5, 'stroke-linecap': 'round' }, ag) }); });
    XK.timed(ctx, ag, 'exact-0.15', null);
    const gate = K.s('g', {}, svg); K.s('rect', { x: MX0 + 150, y: MY0 - 34, width: 160, height: 26, rx: 6, fill: K.c('bg'), stroke: K.c('fg'), 'stroke-width': 2 }, gate);
    K.s('path', { d: `M ${MX0 + 170} ${MY0 - 21} L ${MX0 + 290} ${MY0 - 21} M ${MX0 + 280} ${MY0 - 28} L ${MX0 + 290} ${MY0 - 21} L ${MX0 + 280} ${MY0 - 14}`, fill: 'none', stroke: K.c('fg'), 'stroke-width': 2 }, gate);
    XK.timed(ctx, gate, 'exact+0.6', 'weak-0.15');
    ctx.add({ render(t) { if (t < te) return; const p = S.seg(t, te + 1.0, te + 2.0, S.ease.inOutSine), col = p > 0.5 ? K.c('b') : K.c('fg-2');
      arr.forEach((q) => { const a = q.a + p * Math.PI / 2, l = 11, ux = Math.cos(a), uy = Math.sin(a);
        q.el.setAttribute('d', `M ${(q.x - ux * l).toFixed(1)} ${(q.y - uy * l).toFixed(1)} L ${(q.x + ux * l).toFixed(1)} ${(q.y + uy * l).toFixed(1)}`); q.el.setAttribute('stroke', col); }); } });
    // meters (no number)
    const meter = (x, at, level, band) => { const g = K.s('g', {}, svg), y0 = 380, y1 = 680, ind = K.s('rect', { x: x - 12, y: y0, width: 24, height: 6, fill: K.c('fg') }, g);
      K.s('rect', { x: x - 8, y: y0, width: 16, height: y1 - y0, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2 }, g);
      K.s('line', { x1: x - 18, y1: y1, x2: x + 18, y2: y1, stroke: K.c('fg'), 'stroke-width': 3 }, g);
      if (band) K.s('rect', { x: x - 8, y: y1 - 44, width: 16, height: 34, fill: K.rgba(K.c('fg'), 0.2) }, g);
      XK.timed(ctx, g, at, null); const t0 = ctx.at(at) + 0.4;
      ctx.add({ render(t) { const p = S.seg(t, t0, t0 + 1.4, S.ease.outCubic); ind.setAttribute('y', (y0 + (level - y0) * p - 3).toFixed(1)); } }); return g; };
    meter(910, 'exact+2.2', 680, false); meter(980, 'weak-0.15', 653, true);
    XK.lab(ctx, L[10], 880, 662, { anchor: 'r', cls: 'small', color: 'model', at: 'exact+2.8', out: 'yardstick-0.15' });
    XK.lab(ctx, L[11], 880, 612, { anchor: 'r', cls: 'small', at: 'weak+0.6', out: 'yardstick-0.15' });
    const ld = K.s('path', { d: 'M 884 630 L 966 650', fill: 'none', stroke: K.c('muted'), 'stroke-width': 1.5 }, svg); XK.timed(ctx, ld, 'weak+0.6', 'yardstick-0.15');
    XK.lab(ctx, L[12], 880, 700, { anchor: 'r', at: 'yardstick-0.15' });
    K.pen(ctx, { kind: 'underline', box: { x: 400, y: 700, w: 480, h: 36 }, at: 'yardstick+0.4' });
    XK.lab(ctx, P.mff_chip, 180, 752, { cls: 'small', color: 'muted', w: 860, at: 'yardstick+0.8' });
    const fl = (ctx.script.onscreen.formulas || []).map((f) => ({ tex: f.tex, at: f.cue, out: f.out }));
    K.formulaLayer(ctx, { items: fl });
  },
});
</script></body></html>
