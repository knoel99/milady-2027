<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X6.6 Downstream: assimilation with a mirror</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X6.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X6_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* X6.6 Downstream: assimilation with a mirror (NIGHT, PROVED). Computed in the page from existing E1 snapshots (model C,
   Γ = 0.9, data/e1_samples_0.9.json; mu from data/e1_finegrid.json; Qdot = mu Q − V D): violet cloud; binned conditional
   drift arrows; the probe band; the mirror-completed sample weighted by the likelihood (two humps), the weighted mean
   (a cross) and the count of snapshots near it; the mean-and-spread ellipse; a SCHEMATIC lopsided reweighting; mirror
   links and the latent inset. No number on screen. The M1 corner needle is not drawn. */
Scene.define({
  duration: 45, register: 'night',
  cues: { drift: 0.6, prior: 13.4, probe: 15.9, predict: 19.6, humps: 25.8, ghost: 29.9, pairs: 36.9 },
  data: { s: 'data/e1_samples_0.9.json', fg: 'data/e1_finegrid.json' },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, L = ctx.script.onscreen.labels, C = ctx.script.onscreen.chips, svg = K.svgLayer(ctx, 12);
    window.__EVENTS__ = [{ t: +(ctx.at('probe') + 0.4).toFixed(3), id: 'tick', gain_db: -20 }, { t: +(ctx.at('humps') + 0.3).toFixed(3), id: 'pop', gain_db: -24 }];
    K.badge(ctx, { kind: 'PROVED', at: -0.3 });
    XK.title(ctx, ctx.script.onscreen.title, -0.3, { y: 132 });
    const V = ctx.data.s.variants[P.variant], XS = S.f32(V.x), DD = S.f32(V.Ddot), N = V.n, mu = ctx.data.fg.config.mu, PL = P.plane, B = PL.box;
    const X = (q) => B[0] + (q - PL.Q[0]) / (PL.Q[1] - PL.Q[0]) * (B[2] - B[0]), Y = (d) => B[3] - (d - PL.D[0]) / (PL.D[1] - PL.D[0]) * (B[3] - B[1]);
    // axes
    const ax = K.s('g', {}, svg);
    K.s('line', { x1: B[0], y1: Y(0), x2: B[2], y2: Y(0), stroke: K.c('grid'), 'stroke-width': 2 }, ax);
    K.s('line', { x1: X(0), y1: B[1], x2: X(0), y2: B[3], stroke: K.c('grid'), 'stroke-width': 2 }, ax);
    XK.timed(ctx, ax, -0.3, null);
    XK.lab(ctx, L[0], B[2] - 8, B[3] - 44, { anchor: 'r', cls: 'small', color: 'b-light', at: -0.3 });
    XK.lab(ctx, L[1], X(0) + 12, B[1] - 6, { cls: 'small', color: 'b', at: -0.3 });
    // the dots (canvas), mirror-completed for the posterior
    const sg = P.observation.sigma_obs, pts = [];
    for (let i = 0; i < N; i++) { const q = XS[3 * i], d = XS[3 * i + 1], w = Math.exp(-((d - P.observation.y) ** 2) / (2 * sg * sg)); pts.push([q, d, w, 0], [-q, -d, Math.exp(-((-d - P.observation.y) ** 2) / (2 * sg * sg)), 1]); }
    let sw = 0, sq = 0, sd = 0; pts.forEach(([q, d, w]) => { sw += w; sq += w * q; sd += w * d; }); const mq = sq / sw, md = sd / sw;
    let vq = 0, vd = 0; pts.forEach(([q, d, w]) => { vq += w * (q - mq) ** 2; vd += w * (d - md) ** 2; }); vq = Math.sqrt(vq / sw); vd = Math.sqrt(vd / sw);
    let inside = 0; for (let i = 0; i < N; i++) if (Math.hypot(XS[3 * i] - mq, XS[3 * i + 1] - md) < 0.4) inside++;
    const wmax = Math.max(...pts.map((p) => p[2]));
    const CV = K.canvasLayer(ctx, 6, { x: B[0], y: B[1], w: B[2] - B[0], h: B[3] - B[1] }, null, { reset: true });
    const T = { d: ctx.at('drift') - 0.15, pr: ctx.at('predict') - 0.15, h: ctx.at('humps') - 0.15, gl: ctx.at('ghost') + 2.0 };
    ctx.add({ render(t) { const g = CV.g; g.clearRect(0, 0, CV.w, CV.h); if (t < T.d) return;
      const a0 = S.seg(t, T.d, T.d + 0.6, S.ease.linear), pf = S.seg(t, T.pr, T.pr + 0.6, S.ease.linear), ph = S.seg(t, T.h, T.h + 1.0, S.ease.inOutSine);
      const lop = S.seg(t, T.gl, T.gl + 0.4, S.ease.inOutSine) * (1 - S.seg(t, T.gl + 1.5, T.gl + 1.9, S.ease.inOutSine));
      g.fillStyle = S.col('model');
      pts.forEach(([q, d, w, m]) => { if (m && ph <= 0) return; const inb = Math.abs(d) < sg;
        let al = 0.55 * a0 * (inb ? 1 : 1 - 0.85 * pf); let r = 1.4;
        if (ph > 0) { const lw = lop ? (q > 0 ? 1 + lop * (2 * P.lopsided.weights[0] - 1) : 1 - lop * (1 - 2 * P.lopsided.weights[1])) : 1;
          const ww = w / wmax * lw; r = S.lerp(1.4, 1 + 5 * Math.sqrt(ww), ph); al = S.lerp(al, Math.min(0.85, 0.05 + 0.8 * Math.sqrt(ww)), ph) * (m ? ph : 1); }
        if (al < 0.01) return; g.globalAlpha = al; g.beginPath(); g.arc(X(q) - B[0], Y(d) - B[1], r, 0, 2 * Math.PI); g.fill(); });
      g.globalAlpha = 1; } });
    K.chip(ctx, { text: C[0], kind: 'generated', x: 160, y: 800, at: 'drift+0.2', out: 'pairs-0.15' });
    // the binned drift
    const [nx, ny] = P.drift.grid, bins = Array.from({ length: nx * ny }, () => [0, 0, 0]);
    for (let i = 0; i < N; i++) { const q = XS[3 * i], d = XS[3 * i + 1], v = XS[3 * i + 2], bx = Math.floor((q - PL.Q[0]) / (PL.Q[1] - PL.Q[0]) * nx), by = Math.floor((d - PL.D[0]) / (PL.D[1] - PL.D[0]) * ny);
      if (bx < 0 || by < 0 || bx >= nx || by >= ny) continue; const b = bins[by * nx + bx]; b[0] += mu * q - v * d; b[1] += DD[i]; b[2]++; }
    const ok = bins.map((b, k) => ({ k, n: b[2], u: b[2] ? b[0] / b[2] : 0, w: b[2] ? b[1] / b[2] : 0 })).filter((b) => b.n >= P.drift.min_count);
    const vmax = Math.max(...ok.map((b) => Math.hypot(b.u * (B[2] - B[0]) / 6, b.w * (B[3] - B[1]) / 5)));
    const cw = (B[2] - B[0]) / nx, ch = (B[3] - B[1]) / ny, dg = K.s('g', {}, svg);
    ok.forEach((b, j) => { const cx = B[0] + cw * (b.k % nx + 0.5), cy = B[3] - ch * (Math.floor(b.k / nx) + 0.5);
      let ux = b.u * (B[2] - B[0]) / 6, uy = -b.w * (B[3] - B[1]) / 5; const n = Math.hypot(ux, uy) || 1, l = 0.45 * Math.min(cw, ch) * Math.hypot(ux, uy) / vmax; ux /= n; uy /= n;
      const p = K.s('path', { d: `M ${cx - ux * l} ${cy - uy * l} L ${cx + ux * l} ${cy + uy * l} M ${cx + ux * l - 8 * ux + 5 * uy} ${cy + uy * l - 8 * uy - 5 * ux} L ${cx + ux * l} ${cy + uy * l} L ${cx + ux * l - 8 * ux - 5 * uy} ${cy + uy * l - 8 * uy + 5 * ux}`, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2.5 }, dg);
      XK.drawOn(ctx, p, XK.at(ctx, 'drift', 1.5 + 2.0 * j / ok.length), 0.3, 'prior-0.15'); });
    XK.lab(ctx, L[3], 1220, 230, { w: 600, at: 'drift+2.0', out: 'prior-0.15' });
    XK.lab(ctx, L[2], 1220, 230, { color: 'model', at: 'prior' });
    // probe and band
    const band = K.s('rect', { x: B[0], y: Y(sg), width: B[2] - B[0], height: Y(-sg) - Y(sg), fill: K.rgba(K.c('fg'), 0.12) }, svg); XK.timed(ctx, band, 'probe-0.15', null);
    const pr = K.s('g', {}, svg); K.s('rect', { x: B[0] - 40, y: Y(0) - 14, width: 28, height: 28, rx: 4, fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, pr); K.s('line', { x1: B[0] - 12, y1: Y(0), x2: B[0], y2: Y(0), stroke: K.c('b'), 'stroke-width': 3 }, pr);
    XK.timed(ctx, pr, 'probe-0.15', null);
    XK.lab(ctx, L[4], B[0] - 50, Y(0) + 24, { anchor: 'r', color: 'b', at: 'probe+0.2' });
    // predict
    XK.lab(ctx, L[5], 160, 200, { cls: 'mono', at: 'predict-0.15', out: 'humps-0.15' });
    const qr = K.s('circle', { cx: X(0), cy: Y(0), r: 26, fill: 'none', stroke: K.c('fg'), 'stroke-width': 2.5, 'stroke-dasharray': '6 5' }, svg); XK.timed(ctx, qr, 'predict', 'humps-0.15');
    XK.lab(ctx, '?', X(0) + 32, Y(0) - 70, { cls: 'big', at: 'predict+0.2', out: 'humps-0.15' });
    // humps: mean cross, ring count
    const cr = K.s('path', { d: `M ${X(mq) - 12} ${Y(md) - 12} L ${X(mq) + 12} ${Y(md) + 12} M ${X(mq) - 12} ${Y(md) + 12} L ${X(mq) + 12} ${Y(md) - 12}`, stroke: K.c('chalk'), 'stroke-width': 4 }, svg); XK.timed(ctx, cr, 'humps+0.6', null);
    const rg = K.s('ellipse', { cx: X(mq), cy: Y(md), rx: X(0.4) - X(0), ry: Y(0) - Y(0.4), fill: 'none', stroke: K.c('chalk'), 'stroke-width': 1.5 }, svg); XK.timed(ctx, rg, 'humps+1.0', null);
    XK.lab(ctx, L[6], X(2.0), Y(0) - 120, { anchor: 'c', color: 'model', at: 'humps+0.4' });
    XK.lab(ctx, L[7], X(mq) + 16, Y(md) - 104, { cls: 'small', at: 'humps+0.8' });
    XK.lab(ctx, inside === 0 ? L[8] : 'almost no snapshot here', X(mq) - 120, Y(md) + 64, { cls: 'small', at: 'humps+1.4', out: 'pairs-0.15' });
    // ghost: mean-and-spread ellipse, lopsided prior
    const ge = K.s('ellipse', { cx: X(mq), cy: Y(md), rx: X(mq + vq) - X(mq), ry: Y(md) - Y(md + Math.max(vd, 0.15)), fill: 'none', stroke: K.c('muted'), 'stroke-width': 2.5, 'stroke-dasharray': '10 8' }, svg); XK.timed(ctx, ge, 'ghost-0.15', 'pairs-0.15');
    XK.lab(ctx, L[9], X(mq), Y(-1.3), { anchor: 'c', cls: 'small', color: 'muted', at: 'ghost', out: 'pairs-0.15' });
    K.chip(ctx, { text: C[1], kind: 'schematic', x: 1220, y: 300, at: 'ghost+1.8', out: 'pairs-0.15' });
    XK.lab(ctx, L[10], 1220, 356, { at: 'ghost+2.0', out: 'pairs-0.15' });
    K.pen(ctx, { kind: 'cross', box: { x: X(1.2), y: Y(0.6), w: X(3) - X(1.2), h: Y(-0.6) - Y(0.6) }, at: 'ghost+3.0', out: 'pairs-0.15' });
    // pairs: mirror links and the latent inset
    const lr = S.rng('x6-6-links'), lk = K.s('g', {}, svg); let made = 0, guard = 0;
    while (made < P.pairs.n_links && guard++ < 5000) { const i = Math.floor(lr() * N), q = XS[3 * i], d = XS[3 * i + 1]; if (Math.abs(d) > sg || Math.abs(q) < 0.8) continue;
      const ln = K.s('path', { d: `M ${X(q)} ${Y(d)} L ${X(-q)} ${Y(-d)}`, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 1.5, 'stroke-dasharray': '6 6' }, lk); XK.drawOn(ctx, ln, XK.at(ctx, 'pairs', 0.2 + 0.1 * made), 0.6); made++; }
    XK.lab(ctx, L[11], B[0] + 10, B[1] + 10, { at: 'pairs+0.4' });
    const LI = P.latent_inset.box, lg = K.s('g', {}, svg), lcx = (LI[0] + LI[2]) / 2, lcy = (LI[1] + LI[3]) / 2, cr2 = S.rng('x6-6-latent');
    K.s('circle', { cx: lcx, cy: lcy, r: 120, fill: 'none', stroke: K.c('grid'), 'stroke-width': 1.5 }, lg);
    for (let k = 0; k < 90; k++) { const [u, v] = XK.gauss(cr2); K.s('circle', { cx: lcx + 40 * u, cy: lcy + 40 * v, r: 2.5, fill: K.rgba(K.c('model'), 0.4) }, lg); }
    const z = [lcx + 56, lcy - 30], sz = [lcx - 56, lcy + 30];
    K.s('circle', { cx: z[0], cy: z[1], r: 8, fill: K.c('model') }, lg); K.s('circle', { cx: sz[0], cy: sz[1], r: 8, fill: K.c('model') }, lg);
    XK.timed(ctx, lg, XK.frac(ctx, 'pairs', 0.6), null, { raw: true });
    [[z, X(2.0)], [sz, X(-2.0)]].forEach(([p, hx], k) => { const ln = K.s('path', { d: `M ${p[0]} ${p[1]} C ${p[0] - 80} ${p[1] - 140 + 280 * k}, ${hx + 200} ${Y(0) - 160 + 320 * k}, ${hx} ${Y(0)}`, fill: 'none', stroke: K.c('model'), 'stroke-width': 2, 'stroke-dasharray': '8 7' }, svg);
      XK.drawOn(ctx, ln, XK.frac(ctx, 'pairs', 0.7) + 0.3 * k, 1.0); });
    XK.lab(ctx, 'z', z[0] + 12, z[1] - 40, { cls: 'mono', color: 'model', at: XK.frac(ctx, 'pairs', 0.6), raw: true });
    XK.lab(ctx, 'S z', sz[0] - 12, sz[1] + 6, { cls: 'mono', color: 'model', anchor: 'r', at: XK.frac(ctx, 'pairs', 0.6), raw: true });
    XK.lab(ctx, L[12], LI[0], LI[3] + 20, { w: 560, at: XK.frac(ctx, 'pairs', 0.7), raw: true });
    K.chip(ctx, { text: C[2], kind: 'plain', maxWidth: 860, x: 160, y: 800, at: 'pairs+0.8' });
    const fl = (ctx.script.onscreen.formulas || []).map((f) => ({ tex: f.tex, at: f.cue, out: f.out }));
    K.formulaLayer(ctx, { items: fl });
  },
});
</script></body></html>
