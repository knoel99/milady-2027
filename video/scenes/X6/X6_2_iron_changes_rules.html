<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X6.2 Iron changes the rules</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X6.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>

</head><body><div id="stage"></div>
<script>
/* X6.2 Iron changes the rules (PAPER, PROVED). SCHEMATIC interface sodium | soft iron, refraction exaggerated (angles
   are drawing choices, no physical value); the two jump rules; PREDICT; the smooth potential gives unbent lines, the
   kinked profile; the nonlocal vacuum condition on the whole cylinder; two route cards. μ_r and thresholds only on the
   formula layer (script). The T2 zooms are approximated by an anchor icon with leader lines and a cross-fade. */
Scene.define({
  duration: 43, register: 'paper',
  cues: { metal: 0.5, rules: 3.4, predict: 12.0, kink: 17.4, fix: 26.0, vacuum: 30.9, open: 39.1 },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, L = ctx.script.onscreen.labels, C = ctx.script.onscreen.chips, svg = K.svgLayer(ctx, 12);
    window.__EVENTS__ = [{ t: +(ctx.at('kink') + 2.2).toFixed(3), id: 'pop', gain_db: -24 }];
    K.badge(ctx, { kind: 'PROVED', at: -0.3 });
    XK.title(ctx, ctx.script.onscreen.title, -0.3, { y: 132 });
    const IF = P.interface, X = IF.x, BX0 = 560, BX1 = 1360, BY0 = 280, BY1 = 650;
    // anchor icon (the impeller disc of the VKS drawing) with leader lines: the zoom's origin
    const ic = K.s('g', {}, svg);
    K.s('rect', { x: 180, y: 300, width: 160, height: 110, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 2 }, ic);
    K.s('rect', { x: 214, y: 316, width: 10, height: 78, fill: K.rgba(K.c('fg'), 0.5) }, ic);
    K.s('rect', { x: 206, y: 340, width: 26, height: 30, fill: 'none', stroke: K.c('fg'), 'stroke-width': 2 }, ic);
    K.s('line', { x1: 232, y1: 340, x2: BX0, y2: BY0, stroke: K.c('muted'), 'stroke-width': 1.5, 'stroke-dasharray': '6 6' }, ic);
    K.s('line', { x1: 232, y1: 370, x2: BX0, y2: BY1, stroke: K.c('muted'), 'stroke-width': 1.5, 'stroke-dasharray': '6 6' }, ic);
    XK.timed(ctx, ic, 'metal-0.15', 'vacuum-0.15');
    // the interface region
    const id = 'x62clip', cl = K.s('clipPath', { id }, svg); K.s('rect', { x: BX0, y: BY0, width: BX1 - BX0, height: BY1 - BY0 }, cl);
    const rg = K.s('g', {}, svg);
    K.s('rect', { x: BX0, y: BY0, width: BX1 - BX0, height: BY1 - BY0, fill: 'none', stroke: K.c('grid'), 'stroke-width': 1.5 }, rg);
    const hz = K.s('g', { 'clip-path': `url(#${id})` }, rg);
    for (let x = X - 400; x < BX1; x += 22) K.s('line', { x1: x, y1: BY1, x2: x + (BY1 - BY0), y2: BY0, stroke: K.rgba(K.c('fg'), 0.16), 'stroke-width': 2 }, hz);
    K.s('rect', { x: BX0, y: BY0, width: X - BX0, height: BY1 - BY0, fill: K.c('bg') }, hz);
    K.s('line', { x1: X, y1: BY0, x2: X, y2: BY1, stroke: K.c('fg'), 'stroke-width': 4 }, rg);
    XK.timed(ctx, rg, 'metal-0.15', 'vacuum-0.15', { din: 0.8 });
    XK.lab(ctx, L[0], BX0 + 10, BY0 - 44, { at: 'metal+0.2', out: 'vacuum-0.15' });
    XK.lab(ctx, L[1], BX1 - 10, BY0 - 44, { anchor: 'r', at: 'metal+0.2', out: 'vacuum-0.15' });
    K.chip(ctx, { text: C[0], kind: 'plain', maxWidth: 860, x: 180, y: 800, at: 'metal+0.6', out: 'fix-0.15' });
    // field lines (vermillion): θ1 in sodium, θ2 in iron; on 'kink' the smooth potential gives θ2 = θ1, then they bend back
    const gl = K.s('g', { 'clip-path': `url(#${id})` }, svg), lines = [];
    for (let k = 0; k < P.lines.n; k++) lines.push({ y: BY0 + 40 + k * (BY1 - BY0 - 80) / (P.lines.n - 1), el: K.s('path', { d: '', fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, gl) });
    XK.timed(ctx, gl, 'metal+0.3', 'vacuum-0.15');
    const tk = ctx.at('kink') - 0.15, tb = ctx.at('kink') + 3.6, t1 = 32 * Math.PI / 180, t2 = 68 * Math.PI / 180;
    ctx.add({ render(t) { const m = S.seg(t, tk, tk + 0.8, S.ease.inOutSine) * (1 - S.seg(t, tb, tb + 0.8, S.ease.inOutSine)), br = 0.02 * Math.sin(2 * Math.PI * t / 4);
      const a1 = t1 + br, a2 = S.lerp(t2, t1, m) + br;
      lines.forEach((l) => { const yl = l.y + 400 * Math.tan(a1) * 0.5, yr = l.y - 400 * Math.tan(a2) * 0.5;
        l.el.setAttribute('d', `M ${X - 400} ${(l.y + 400 * Math.tan(a1)).toFixed(1)} L ${X} ${l.y.toFixed(1)} L ${X + 400} ${(l.y - 400 * Math.tan(a2)).toFixed(1)}`); void yl; void yr; }); } });
    // the two rules
    const r2 = XK.frac(ctx, 'rules', 0.45), ra = K.s('g', {}, svg);
    K.s('path', { d: `M ${BX1 + 40} 400 L ${BX1 + 100} 400 M ${BX1 + 88} 392 L ${BX1 + 100} 400 L ${BX1 + 88} 408`, fill: 'none', stroke: K.c('fg'), 'stroke-width': 2.5 }, ra);
    XK.timed(ctx, ra, 'rules-0.15', 'vacuum-0.15');
    const rb = K.s('g', {}, svg);
    K.s('path', { d: `M ${BX1 + 70} 520 L ${BX1 + 70} 470 M ${BX1 + 62} 482 L ${BX1 + 70} 470 L ${BX1 + 78} 482`, fill: 'none', stroke: K.c('fg'), 'stroke-width': 2.5 }, rb);
    XK.timed(ctx, rb, r2 - 0.15, 'vacuum-0.15', { raw: true });
    XK.lab(ctx, L[2], BX1 + 116, 382, { w: 320, at: 'rules', out: 'vacuum-0.15' });
    const tl = XK.lab(ctx, L[3], BX1 + 116, 470, { w: 320, at: r2, out: 'vacuum-0.15', raw: true, dim: ['kink+0.8', 0.45] });
    K.pen(ctx, { kind: 'cross', box: { x: BX1 + 110, y: 466, w: 330, h: 80 }, at: 'kink+0.6', out: 'vacuum-0.15' });
    // PREDICT and the profiles
    XK.lab(ctx, L[4], 160, 222, { cls: 'mono', at: 'predict-0.15', out: 'kink-0.15' });
    const PB = P.profile.box, pg = K.s('g', {}, svg), pm = (PB[1] + PB[3]) / 2;
    const smooth = K.s('path', { d: `M ${PB[0]} ${PB[3] - 6} C ${X - 200} ${PB[3] - 10}, ${X - 120} ${PB[1] + 10}, ${X} ${pm - 10} S ${X + 260} ${PB[1] + 6}, ${PB[2]} ${PB[1] + 4}`, fill: 'none', stroke: K.c('fg-2'), 'stroke-width': 3.5 }, svg);
    XK.drawOn(ctx, smooth, 'predict-0.15', 0.9, 'vacuum-0.15');
    const q = XK.lab(ctx, '?', X + 14, PB[1] - 26, { cls: 'big', at: 'predict+0.6', out: 'kink-0.15' });
    XK.lab(ctx, L[5], PB[0] - 20, PB[1] - 4, { anchor: 'r', color: 'muted', at: 'predict+0.4', out: 'vacuum-0.15' });
    K.pen(ctx, { kind: 'cross', box: { x: PB[0] - 290, y: PB[1] - 4, w: 270, h: 34 }, at: 'kink+1.0', out: 'vacuum-0.15' });
    const kinked = K.s('path', { d: `M ${PB[0]} ${PB[3] - 4} C ${X - 220} ${PB[3] - 6}, ${X - 80} ${PB[3] - 20}, ${X} ${PB[1] + 6} C ${X + 80} ${PB[3] - 20}, ${X + 260} ${PB[3] - 6}, ${PB[2]} ${PB[3] - 4}`, fill: 'none', stroke: K.c('b'), 'stroke-width': 3.5 }, svg);
    XK.drawOn(ctx, kinked, 'kink+1.4', 0.9, 'vacuum-0.15');
    XK.lab(ctx, L[6], PB[0] - 20, PB[1] + 38, { anchor: 'r', color: 'b', at: 'kink+1.6', out: 'vacuum-0.15' });
    K.pen(ctx, { kind: 'circle', box: { x: X - 24, y: PB[1] - 10, w: 48, h: 40 }, at: 'kink+2.2', out: 'vacuum-0.15' });
    K.chip(ctx, { text: C[1], kind: 'plain', maxWidth: 860, x: 180, y: 800, at: 'fix-0.15', out: 'open-0.15' });
    // vacuum: the whole cylinder, exterior lines, the nonlocal rays
    const CX0 = 760, CX1 = 1160, CY0 = 300, CY1 = 600, vg = K.s('g', {}, svg);
    [[230, 200], [300, 250], [380, 300]].forEach(([rx, ry]) => K.s('ellipse', { cx: (CX0 + CX1) / 2, cy: (CY0 + CY1) / 2, rx, ry, fill: 'none', stroke: K.c('b'), 'stroke-width': 2 }, vg));
    K.s('rect', { x: CX0, y: CY0, width: CX1 - CX0, height: CY1 - CY0, rx: 6, fill: K.rgba(K.c('fg'), 0.05), stroke: K.c('fg'), 'stroke-width': 4 }, vg);
    XK.timed(ctx, vg, 'vacuum-0.15', null, { din: 0.8 });
    const wp = [CX1, CY0 + (CY1 - CY0) / 3], rays = K.s('g', {}, svg), per = 2 * (CX1 - CX0 + CY1 - CY0);
    for (let k = 0; k < P.nonlocal.rays; k++) { let s = (k + 0.5) / P.nonlocal.rays * per, x, y;
      if (s < CX1 - CX0) { x = CX0 + s; y = CY0; } else if ((s -= CX1 - CX0) < CY1 - CY0) { x = CX1; y = CY0 + s; } else if ((s -= CY1 - CY0) < CX1 - CX0) { x = CX1 - s; y = CY1; } else { s -= CX1 - CX0; x = CX0; y = CY1 - s; }
      const ln = K.s('path', { d: `M ${wp[0]} ${wp[1]} L ${x} ${y}`, fill: 'none', stroke: K.c('muted'), 'stroke-width': 1.2 }, rays); XK.drawOn(ctx, ln, XK.at(ctx, 'vacuum', 3.0), 0.8); }
    const dot = K.s('circle', { cx: wp[0], cy: wp[1], r: 9, fill: K.c('fg') }, svg); XK.timed(ctx, dot, 'vacuum+2.8', null);
    XK.lab(ctx, L[7], 180, 300, { w: 380, at: 'vacuum+0.6' });
    XK.lab(ctx, L[8], 180, 380, { w: 380, color: 'muted', at: 'vacuum+3.4' });
    // open: two route cards and a question mark
    P.routes.forEach((r, k) => { const c = XK.card(ctx, 520 + k * 480, 616, 440, 92, { at: XK.at(ctx, 'open', 0.3 * k - 0.15) }); c.body.innerHTML = K.markup(r); });
    const qm = K.s('path', { d: 'M 968 640 C 968 620, 992 620, 992 638 C 992 652, 980 654, 980 668 M 980 680 L 980 684', fill: 'none', stroke: K.c('fg'), 'stroke-width': 3.5, 'stroke-linecap': 'round' }, svg);
    XK.drawOn(ctx, qm, 'open+0.8', 0.6);
    K.chip(ctx, { text: C[2], kind: 'plain', maxWidth: 860, x: 180, y: 800, at: 'open' });
    const fl = (ctx.script.onscreen.formulas || []).map((f) => ({ tex: f.tex, at: f.cue, out: f.out }));
    K.formulaLayer(ctx, { items: fl });
  },
});
</script></body></html>
