<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>X6.4 Bet: VKS in the generator</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="X6.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="X6_kit.js"></script>
<style>
  svg[data-kit="seat"] text.kt-label { font-size: 28px; }
  .kit-seat-col { left: 1256px !important; width: 568px !important; }
</style>
</head><body><div id="stage"></div>
<script>
/* X6.4 Bet: VKS in the generator (NIGHT, PENDING: CONJECTURE low). Flat SVG anchor instead of Three.js: the VKS
   cylinder schematic with the two discs counter-rotating (blade ticks moving), the four mode glyphs peeling off on
   'patterns', the cylinder shrinking to a corner icon; then Kit.seat 'lamps' (4 rows; the 2 × 2 mini-frames are not
   drawn). No result number anywhere. T3 ink change PAPER → NIGHT in the lead-in. */
Scene.define({
  duration: 45, register: 'night',
  cues: { anchor: 1.8, patterns: 8.0, bet: 14.7, iron: 24.6, confidence: 31.6, ask: 39.4 },
  data: { seat: { url: 'data/tier3_vks.json', optional: true } },
  params: {},
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, SE = P.seat, L = ctx.script.onscreen.labels, C = ctx.script.onscreen.chips, svg = K.svgLayer(ctx, 12), res = ctx.variant === 'result';
    window.__EVENTS__ = [{ t: 0.2, id: 'whoosh', gain_db: -20 }, { t: +(ctx.at('patterns') + 1.2).toFixed(3), id: 'pop', gain_db: -24 }];
    XK.inkChange(ctx, P.ink_change.t0, P.ink_change.t1, 540, 'paper');
    K.badge(ctx, { kind: 'CONJECTURE', confidence: 'low', at: -0.3 });
    // the anchor (flat): cylinder, copper shell, two bladed discs counter-rotating
    const cg = K.s('g', {}, svg), CX = 960, CY = 480, HW = 300, HR = 150;
    K.s('rect', { x: CX - HW - 26, y: CY - HR - 26, width: 2 * HW + 52, height: 2 * HR + 52, rx: 16, fill: 'none', stroke: K.c('matter'), 'stroke-width': 7 }, cg);
    K.s('rect', { x: CX - HW, y: CY - HR, width: 2 * HW, height: 2 * HR, rx: 8, fill: K.rgba(K.c('fg'), 0.05), stroke: K.c('fg-2'), 'stroke-width': 3 }, cg);
    K.s('line', { x1: CX - HW - 60, y1: CY, x2: CX + HW + 60, y2: CY, stroke: K.c('muted'), 'stroke-width': 1.5, 'stroke-dasharray': '14 6 3 6' }, cg);
    const blades = [];
    [-1, 1].forEach((sd) => { const x = CX + sd * (HW - 60);
      K.s('rect', { x: x - 6, y: CY - 112, width: 12, height: 224, fill: K.c('infra'), stroke: K.c('fg-2'), 'stroke-width': 2 }, cg);
      for (let k = 0; k < 8; k++) blades.push({ sd, x, k, el: K.s('line', { stroke: K.c('fg-2'), 'stroke-width': 3 }, cg) }); });
    const ico = { x: 1000, y: 150, s: 0.25 }, tic = ctx.at('bet') - 1.2;
    ctx.add({ render(t) { blades.forEach((b) => { const ph = b.sd * 0.9 * t + b.k * Math.PI / 4, y = CY + 112 * Math.sin(ph), vis = Math.cos(ph) > 0;
        b.el.setAttribute('x1', b.x); b.el.setAttribute('x2', b.x - b.sd * 24); b.el.setAttribute('y1', y.toFixed(1)); b.el.setAttribute('y2', (y + 6).toFixed(1)); b.el.style.opacity = vis ? 1 : 0.25; });
      const p = S.seg(t, tic, tic + 0.9, S.ease.inOutCubic), s = 1 + (ico.s - 1) * p, tx = (ico.x + (HW + 26) * ico.s - CX) * p, ty = (ico.y + (HR + 26) * ico.s - CY) * p;
      cg.setAttribute('transform', `translate(${(CX + tx).toFixed(1)} ${(CY + ty).toFixed(1)}) scale(${s.toFixed(4)}) translate(${-CX} ${-CY})`); } });
    XK.timed(ctx, cg, 'anchor-0.15', null);
    XK.lab(ctx, L[0], CX, CY + HR + 44, { anchor: 'c', at: 'anchor+0.3', out: tic - 0.1 });
    K.chip(ctx, { text: C[0], kind: 'plain', maxWidth: 860, x: 216, y: 812, at: 'anchor+0.6', out: 'confidence-0.15' });
    // the four mode glyphs (three groups), one per noun
    const gy = 196, mg = [];
    const g1 = K.s('g', {}, svg); [-1, 1].forEach((s) => K.s('ellipse', { cx: 620 + s * 40, cy: gy + 40, rx: 34, ry: 48, fill: 'none', stroke: K.c('b'), 'stroke-width': 3.5 }, g1));
    const g2 = K.s('g', {}, svg); K.s('ellipse', { cx: 920, cy: gy + 22, rx: 70, ry: 22, fill: 'none', stroke: K.c('b'), 'stroke-width': 3.5 }, g2); K.s('ellipse', { cx: 920, cy: gy + 66, rx: 70, ry: 22, fill: 'none', stroke: K.c('b-neg'), 'stroke-width': 3.5 }, g2);
    const g3 = K.s('g', {}, svg); K.s('ellipse', { cx: 1240, cy: gy + 44, rx: 80, ry: 30, fill: 'none', stroke: K.c('u'), 'stroke-width': 3.5 }, g3);
    K.s('path', { d: `M 1180 ${gy + 80} C 1200 ${gy}, 1280 ${gy}, 1300 ${gy + 80}`, fill: 'none', stroke: K.c('u'), 'stroke-width': 3.5 }, g3);
    [[g1, 620, 1], [g2, 920, 2], [g3, 1240, 3]].forEach(([g, x, k], i) => { const at = XK.frac(ctx, 'patterns', 0.35 + 0.17 * i);
      XK.timed(ctx, g, at, tic - 0.1, { raw: true, dy: 40 }); XK.lab(ctx, L[k], x, gy + 102, { anchor: 'c', color: k === 3 ? 'u' : 'b', at, raw: true, out: tic - 0.1 }); });
    // the seat
    const fr = { x: 216, y: 320, w: 940, h: 360 };
    K.seat(ctx, { type: 'lamps', variant: ctx.variant, data: ctx.data.seat, tag: SE.tag, frame: fr, lamps: SE.lamps.map((l) => ({ id: l.id, label: l.label, rule: l.rule })), lampsTitle: SE.lampsTitle,
      bet: SE.bet, confidence: SE.confidence, criterion: SE.criterion, source: SE.source, ask: SE.ask,
      cues: res ? { frame: 'anchor', bet: 'lamps', criterion: 'lamps+2.0', ask: 'fixed', data: 'verdict' } : { frame: tic + 0.6, bet: 'bet', criterion: 'bet+2.0', ask: 'ask', data: 'confidence' } });
    XK.lab(ctx, P.joint_mirror_chip, 1256, 640, { w: 560, cls: 'small', color: 'muted', at: 'confidence+1.5', out: 'confidence+4.5' });
    XK.lab(ctx, SE.why, 1256, 640, { w: 560, cls: 'small', color: 'muted', at: 'confidence+4.9', out: 'ask-0.4' });
    K.chip(ctx, { text: C[1], kind: 'caveat', maxWidth: 860, x: 216, y: 812, at: 'confidence' });
    const fl = (ctx.script.onscreen.formulas || []).map((f) => ({ tex: f.tex, at: f.cue, out: f.out === 'confidence' ? 'confidence-0.15' : (f.out || 'ask-0.3') }));
    if (fl.length) K.formulaLayer(ctx, { items: res ? [{ tex: fl[0].tex, at: 'anchor', out: 'verdict' }] : fl });
  },
});
</script></body></html>
