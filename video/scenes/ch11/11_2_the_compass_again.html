<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>11.2 The compass again</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch11.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>

</head><body><div id="stage"></div>
<script>
/* 11.2 The compass again (L0, NIGHT, MEASURED). A 2D compass (not the WebGL compass of 00.1: no 3D in this batch)
   and the two questions; then a montage, one motif per sentence inside params.montage_box: the seafloor polarity strip
   (Cande & Kent intervals), two starts a hair apart (live integration of the three-mode model, illustration), the
   crossings of zero, the shoebox of snapshots (data/e1_samples_0.93.json), the generated cloud and its mirror, the
   crossing-rate chart (counted vs generated), the staircase of bets; the compass returns for the lesson. */
Scene.define({
  duration: 72,
  register: 'night',
  cues: { compass: 0.8, when: 4.6, earth: 6.6, chaos: 8.8, often: 13.6, shoebox: 18.2, cloud: 22.0, partly: 27.4, mirror: 30.0, rate: 32.8, steep: 38.0, bets: 41.0, lesson: 47.6, where: 49.2, exact: 51.6, average: 53.6 },
  data: { measured: 'data/ch11_measured.json', e1: 'data/e1_finegrid.json', s093: 'data/e1_samples_0.93.json' },
  params: { normal_Ma: [], montage_box: { x0: 360, x1: 1560, y0: 180, y1: 780 }, chaos: { gamma: 0.93, dt: 0.01, transient_units: 600, delta: 0.001, units_per_s: 24, seed: 11 },
    shoebox: { photos: 12, seed: 7 }, rate_chart: { series: ['simulation (counted crossings)', 'Rice, generated (model C)'] }, rail: { from: 'L5', to: 'L0', at: 'compass', hold: 4 } },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, U = UK, MB = P.montage_box, st = ctx.stage, E1 = ctx.data.e1, SM = ctx.data.s093, ME = ctx.data.measured;
    const T = (c) => ctx.at(c);
    const win = (a, b) => ({ at: typeof a === 'number' ? a : T(a + '-0.15'), out: b === undefined ? undefined : (typeof b === 'number' ? b : T(b + '-0.15') - 0.2) });
    const grp = (a, b) => { const g = K.s('g', {}, K.svgLayer(ctx, 12)); U.fade(ctx, g, Object.assign({ din: 0.2, dout: 0.2 }, win(a, b))); return g; };
    // ---- compass (2D): body, north tip in --b, settles on north with a spring; hidden from chaos to lesson
    const cg = K.s('g', {}, K.svgLayer(ctx, 14));
    K.s('circle', { r: 200, fill: K.c('panel'), stroke: K.c('matter'), 'stroke-width': 8 }, cg);
    for (let k = 0; k < 36; k++) { const a = k * 10 * Math.PI / 180, r1 = k % 9 ? 182 : 168; K.s('line', { x1: r1 * Math.sin(a), y1: -r1 * Math.cos(a), x2: 192 * Math.sin(a), y2: -192 * Math.cos(a), stroke: K.c('matter'), 'stroke-width': 3 }, cg); }
    const needle = K.s('g', {}, cg);   // drawn over the dial
    K.s('path', { d: 'M0,-160 L16,0 L-16,0 Z', fill: K.c('b') }, needle); K.s('path', { d: 'M0,160 L16,0 L-16,0 Z', fill: K.c('silver') }, needle); K.s('circle', { r: 10, fill: K.c('matter') }, cg);
    const ghost = K.s('path', { d: 'M0,-160 L16,0 L-16,0 Z', fill: K.c('b'), opacity: 0 }, cg);
    const cardL = U.label(ctx, { html: '<span style="color:var(--muted)">◷</span> When will it flip next?', x: 640, y: 740, anchor: 'c', size: 36, at: 'compass-0.15', out: 'earth-0.3' });
    const cardR = U.label(ctx, { html: '<span class="k-metric">||||</span> How often does it flip?', x: 1280, y: 740, anchor: 'c', size: 36, at: 'compass-0.15', out: 'earth-0.3' });
    void cardR; K.rail(ctx, P.rail);
    // ---- earth: polarity strip of the seafloor record (normal intervals, Ma), no axis, no numbers
    const nm = P.normal_Ma, tMax = nm.length ? nm[nm.length - 1][1] : 5.23, segs = []; let a = 0;
    nm.forEach(([x0, x1]) => { if (x0 > a) segs.push({ a, b: x0, s: -1 }); segs.push({ a: x0, b: x1, s: 1 }); a = x1; });
    const eg = grp('earth', 'chaos');
    const sx = (v) => MB.x0 + (MB.x1 - MB.x0) * v / tMax;
    segs.forEach((s) => K.s('rect', { x: sx(s.a), y: 420, width: Math.max(1, sx(s.b) - sx(s.a)), height: 90, fill: K.c(s.s > 0 ? 'b' : 'b-neg') }, eg));
    U.label(ctx, { text: 'seafloor record · no schedule', x: 960, y: 540, anchor: 'c', size: 32, color: 'chalk', ...win('earth', 'chaos') });
    K.chip(ctx, { text: 'for Earth: no one can say if or when · NOAA NCEI', kind: 'plain', x: 960, y: 610, anchor: 'tl', ...win('earth', 'chaos') }).root.style.transform = 'translate(-50%,0)';
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: 'NOAA NCEI · polarity ages: Cande & Kent 1995', at: 'earth+0.3', hold: 4 });
    // ---- chaos and crossings: the three-mode model, two starts a hair apart (illustration)
    const C = P.chaos, Mo = K.threeModes(E1.config.mu, E1.config.nu), s1 = Mo.seed(C.gamma, 1, S.rng('ch11-' + C.seed)); Mo.run(s1, C.gamma, C.transient_units, C.dt);
    const s2 = Float64Array.from(s1); s2[1] += C.delta;
    const tC = T('chaos-0.15'), tO = T('often-0.15'), units = (tO - tC + 4) * C.units_per_s, HD = 0.1, n = Math.round(units / HD), A1 = [], A2 = [];
    for (let i = 0; i <= n; i++) { A1.push(s1[1]); A2.push(s2[1]); Mo.run(s1, C.gamma, HD, C.dt); Mo.run(s2, C.gamma, HD, C.dt); }
    const vmax = Math.max(...A1.map(Math.abs), ...A2.map(Math.abs));
    const px = (i) => MB.x0 + (MB.x1 - MB.x0) * i / n, py = (v) => 480 - 220 * v / vmax;
    const pth = (A) => A.map((v, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join('');
    const chg = grp('chaos', 'shoebox');
    K.s('line', { x1: MB.x0, x2: MB.x1, y1: 480, y2: 480, stroke: K.c('muted'), 'stroke-width': 2 }, chg);
    const p1 = K.s('path', { d: pth(A1), fill: 'none', stroke: K.c('b'), 'stroke-width': 3 }, chg), p2 = K.s('path', { d: pth(A2), fill: 'none', stroke: K.c('chalk'), 'stroke-width': 2.5, 'stroke-dasharray': '7 5' }, chg);
    [p1, p2].forEach((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = p === p2 ? '7 5' : `${L} ${L}`; p.__L = L; });
    U.label(ctx, { text: 'two starts, a hair apart', x: MB.x0, y: 220, size: 32, ...win('chaos', 'often') });
    const ticks = K.s('g', {}, chg), events = [];
    for (let i = 1; i <= n; i++) if ((A1[i] > 0) !== (A1[i - 1] > 0)) { K.s('line', { x1: px(i), x2: px(i), y1: 460, y2: 500, stroke: K.c('chalk'), 'stroke-width': 3 }, ticks); events.push(i); }
    U.fade(ctx, ticks, { at: tO });
    U.label(ctx, { text: 'crossings of zero · no clock', x: MB.x0, y: 220, size: 32, ...win('often', 'shoebox') });
    ctx.u = { p1, p2, tC, tO, n };
    // ---- shoebox of snapshots (reference at Γ = 0.93) and the generated cloud with its mirror
    const sbg = grp('shoebox', 'cloud'), box = K.shoebox(sbg, { x: 960, y: 640, w: 520, h: 200 });
    const X = S.f32(SM.variants.ref.x), rng = S.rng('sb' + P.shoebox.seed), nP = P.shoebox.photos, photos = [];
    for (let k = 0; k < nP; k++) { const j = Math.floor(rng() * (X.length / 3)); const ph = K.photo(sbg, { x: 0, y: 0, w: 130, h: 96, q: X[3 * j], d: X[3 * j + 1], v: X[3 * j + 2] }); photos.push({ ph, k }); }
    U.label(ctx, { text: 'snapshots, read with the equations', x: 960, y: 150, anchor: 'c', size: 32, ...win('shoebox', 'cloud') });
    const tS = T('shoebox-0.15');
    ctx.u.photos = photos; ctx.u.tS = tS; ctx.u.box = box;
    const CL = { x: 760, y: 220, s: 400 }, Lc = K.canvasLayer(ctx, 9, { x: CL.x, y: CL.y, w: CL.s, h: CL.s }, null, { reset: true });
    const G = S.f32(SM.variants.C_equivariant.x), nG = G.length / 3; let rm = 0; for (let k = 0; k < nG; k++) rm = Math.max(rm, Math.abs(G[3 * k]), Math.abs(G[3 * k + 1]));
    const cpx = (q) => CL.s / 2 + q * CL.s / (2.1 * rm), cpy = (d) => CL.s / 2 - d * CL.s / (2.1 * rm);
    ctx.u.cloud = { Lc, G, nG, cpx, cpy, t0: T('cloud-0.15'), tM: T('mirror-0.15'), t1: T('rate-0.15') };
    U.label(ctx, { text: 'between the simulated settings', x: 960, y: 650, anchor: 'c', size: 32, ...win('cloud', 'partly') });
    K.chip(ctx, { text: 'GENERATED · model C', kind: 'generated', x: CL.x + CL.s + 20, y: CL.y + 10, ...win('cloud', 'rate') });
    ['E1', 'E2', 'E3'].forEach((e, i) => U.label(ctx, { text: e, x: 760 + 200 * i, y: 690, anchor: 'c', size: 40, cls: 'display', ...win('partly', 'mirror') }));
    U.label(ctx, { text: 'Q', x: CL.x + CL.s + 10, y: CL.y + CL.s / 2 - 18, size: 28, cls: 'dim', ...win('cloud', 'rate') });
    U.label(ctx, { text: 'D', x: CL.x + CL.s / 2 - 8, y: CL.y - 40, size: 28, cls: 'dim', ...win('mirror', 'rate') });
    U.label(ctx, { text: 'mirror: (Q, D) → (−Q, −D)', x: 960, y: 650, anchor: 'c', size: 32, ...win('mirror', 'rate') });
    // ---- the rate chart, counted vs generated, and the rounded threshold
    const PL = K.plot(ctx, { box: { x0: 460, x1: 1460, y0: 240, y1: 600 }, x: { label: 'Γ', min: 0.8, max: 1.0, ticks: [0.8, 0.9, 1.0], param: true }, y: { label: '', min: 0, max: 0.014, ticks: [] }, at: 'rate-0.15', out: 'bets-0.35' });
    const xs = E1.x.values, sc = E1.series.find((s) => s.name === P.rate_chart.series[0]), sgn = E1.series.find((s) => s.name === P.rate_chart.series[1]);
    PL.curve({ x: xs, y: sc.y, field: 'b', width: 4, at: 'rate', dur: 1.2 }); PL.curve({ x: xs, y: sgn.y, field: 'metric', kind: 'generated', width: 3, at: 'rate+0.4', dur: 1.2 });
    PL.legend([{ label: 'counted', field: 'b' }, { label: 'generated', field: 'metric', kind: 'generated' }], { at: 'rate', x: 500, y: 260 });
    K.chip(ctx, { text: `${ME.e1.rice.far.percent} % far · ${ME.e1.rice.near.percent} % near · model C, seed ${ME.e1.rice.seed}`, kind: 'plain', x: 960, y: 724, anchor: 'tl', ...win('rate', 'bets') }).root.style.transform = 'translate(-50%,0)';
    U.label(ctx, { text: 'too early', x: PL.sx(0.84), y: PL.sy(0.004), anchor: 'c', size: 30, color: 'chalk', cls: 'halo', ...win('steep', 'bets') });
    U.label(ctx, { text: 'too low', x: PL.sx(0.875) + 70, y: PL.sy(0.0015), size: 30, color: 'chalk', cls: 'halo', ...win('steep', 'bets') });
    // ---- the staircase of bets
    const sg = grp('bets', 'lesson'); K.staircase(ctx, { x: 360, y: 260, w: 1200, h: 380, lit: 1, pending: [2, 3, 4], labels: false, svg: sg });
    U.label(ctx, { text: 'BET · rule written first', x: 1260, y: 220, anchor: 'c', cls: 'mono', ...win('bets', 'lesson') });
    // ---- lesson: three lines under the compass
    U.label(ctx, { text: 'Enforce each law where it is true.', x: 960, y: 640, anchor: 'c', size: 44, cls: 'display', at: 'where-0.15' });
    U.label(ctx, { text: 'Exactly, where it is exact.', x: 960, y: 706, anchor: 'c', size: 36, at: 'exact-0.15' });
    U.label(ctx, { html: '<span class="k-metric">On average</span>, where it only holds on average.', x: 960, y: 758, anchor: 'c', size: 36, at: 'average-0.15' });
    K.badge(ctx, { kind: 'MEASURED', at: 'earth-0.15' });
    Object.assign(ctx.u, { cg, needle, ghost, tW: T('when-0.15'), tE: T('earth-0.15'), tCh: T('chaos') - 0.4, tL: T('lesson-0.15') });
    window.__EVENTS__ = events.filter((i) => tC + (tO + 3 - tC) * i / n < T('shoebox')).slice(0, 12).map((i) => ({ t: +(tC + (tO + 3 - tC) * i / n).toFixed(3), id: 'tick', gain_db: -24 }));
  },
  render(t, ctx) {
    const u = ctx.u, S = Scene;
    // compass: settles on north, wobble; ghost swing on 'when'; shrinks top-left at 'earth'; hidden from chaos to lesson, returns small
    const sp = S.spring(S.seg(t, -0.3, 1.0, S.ease.linear), 0.03), ang = 90 * (1 - sp) + 2 * Math.sin(t * 1.7);
    u.needle.setAttribute('transform', `rotate(${ang.toFixed(2)})`);
    const gp = S.seg(t, u.tW, u.tW + 1.6, S.ease.inOutSine); u.ghost.setAttribute('transform', `rotate(${(110 * gp).toFixed(1)})`); u.ghost.setAttribute('opacity', (0.3 * Math.sin(Math.PI * gp)).toFixed(3));
    const sh = S.seg(t, u.tE, u.tE + 0.8, S.ease.inOutCubic), back = S.seg(t, u.tL, u.tL + 0.8, S.ease.inOutCubic);
    const on = t < u.tCh + 0.3 || t >= u.tL;
    let x = 960 + (210 - 960) * sh, y = 420 + (190 - 420) * sh, s = 1 - 0.6 * sh;
    if (t >= u.tL) { x = 960; y = 330; s = 0.4 + 0.5 * back; y = 330 - 0 * back; s = Math.min(s, 0.9); }
    u.cg.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(4)})`);
    u.cg.style.opacity = on ? (t < u.tCh + 0.3 ? 1 - S.seg(t, u.tCh, u.tCh + 0.3, S.ease.linear) : S.seg(t, u.tL, u.tL + 0.4, S.ease.linear)) : 0;
    // chaos traces draw on
    const p = S.seg(t, u.tC, u.tO + 3, S.ease.linear);
    [u.p1, u.p2].forEach((q) => { if (q === u.p1) q.style.strokeDashoffset = (q.__L * (1 - p)).toFixed(1); else q.setAttribute('clip-path', ''); });
    u.p2.style.opacity = p < 1 ? 1 : 1; u.p2.setAttribute('stroke-dasharray', '7 5'); u.p2.style.strokeDasharray = ''; u.p2.setAttribute('d', u.p2.getAttribute('d'));
    u.p2.style.visibility = 'visible'; u.p2.style.clipPath = `inset(0 ${(100 - 100 * p).toFixed(2)}% 0 0)`;
    // shoebox: photos fall into the box one by one
    u.photos.forEach(({ ph, k }) => { const a = u.tS + 0.25 * k, q = S.seg(t, a, a + 0.6, S.ease.outCubic), tx = 420 + 92 * k, ty = 180 + 130 * q + 30 * (k % 2);
      ph.g.setAttribute('transform', `translate(${tx.toFixed(1)} ${ty.toFixed(1)}) scale(0.8)`); ph.g.style.opacity = t >= a ? 1 : 0; });
    // cloud and its mirror
    const c = u.cloud, g = c.Lc.g; g.clearRect(0, 0, 400, 400);
    if (t >= c.t0 && t < c.t1 + 0.2) { const a = S.seg(t, c.t0, c.t0 + 0.4, S.ease.linear) * (1 - S.seg(t, c.t1 - 0.2, c.t1, S.ease.linear)), nn = Math.floor(c.nG * S.seg(t, c.t0, c.t0 + 2.5, S.ease.linear));
      g.globalAlpha = a; g.fillStyle = Kit.c('model'); for (let k = 0; k < nn; k++) g.fillRect(c.cpx(c.G[3 * k]) - 1.2, c.cpy(c.G[3 * k + 1]) - 1.2, 2.4, 2.4);
      const m = S.seg(t, c.tM, c.tM + 1.0, S.ease.inOutCubic);
      if (m > 0) { g.globalAlpha = a * 0.6 * m; g.fillStyle = Kit.c('silver'); for (let k = 0; k < c.nG; k += 2) g.fillRect(c.cpx(-c.G[3 * k]) - 1, c.cpy(-c.G[3 * k + 1]) - 1, 2, 2); } }
  },
});
</script></body></html>
