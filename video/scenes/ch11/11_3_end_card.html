<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>11.3 End card</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch11.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/equation.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="../../runtime/components/seat.js"></script>
<script src="../../runtime/components/threemodes.js"></script>
<script src="ch11_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 11.3 End card (L0, NIGHT, no badge: no claim). Left column: title, subtitle, site, code, credits, version and the
   supervision line (names in text only, BRIEF D6); right column: DISCLAIMER. Behind, the faint dipole field lines of
   the title card drift slowly. Fade to black over params.fade_out_s at the end of the scene. */
Scene.define({
  duration: 17,
  register: 'night',
  cues: { site: 0.4, rest: 6.0 },
  params: { title: '', subtitle: '', site: '', code: '', credits: [], version: '', supervision: '', disclaimer: '', fade_out_s: 1.2 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage;
    // faint dipole field lines (r = L sin² θ), drifting
    const L = K.canvasLayer(ctx, 2, null, null, { reset: true }), lines = [], cx = 960, cy = 520;
    for (const Ls of [160, 240, 340, 460, 600, 780]) for (const side of [1, -1]) { const pts = []; for (let i = 1; i < 180; i++) { const th = Math.PI * i / 180, r = Ls * Math.sin(th) ** 2; pts.push([cx + side * r * Math.sin(th), cy - r * Math.cos(th)]); } lines.push(pts); }
    const left = K.el('div', {}, st); left.style.cssText = 'position:absolute;left:110px;top:64px;width:830px;z-index:30';
    const add = (cls, txt, css) => { const e = K.el('div', { class: 'uk-lab ' + cls }, left, txt); e.style.cssText += ';position:static;white-space:normal;' + (css || ''); return e; };
    add('display', P.title, 'font-size:58px;line-height:1.05;font-weight:800');
    add('', P.subtitle, 'font-size:30px;margin-top:8px;color:var(--fg-2)');
    add('mono', P.site, 'font-size:34px;color:var(--fg);margin-top:14px;letter-spacing:.02em');
    add('mono', 'code · ' + P.code, 'margin-top:6px;letter-spacing:.02em');
    P.credits.forEach((c, i) => add('dim', c, 'font-size:28px;margin-top:' + (i ? 2 : 12) + 'px;line-height:1.18'));
    add('mono', P.version, 'margin-top:10px;letter-spacing:.02em;line-height:1.18');
    add('', P.supervision, 'font-size:28px;margin-top:10px;line-height:1.18');
    const right = K.el('div', {}, st); right.style.cssText = 'position:absolute;left:1000px;top:64px;width:824px;z-index:30';
    K.el('div', { class: 'uk-lab mono' }, right, 'DISCLAIMER').style.position = 'static';
    const dt = K.el('div', { class: 'uk-lab' }, right, P.disclaimer); dt.style.cssText += ';position:static;white-space:normal;font-size:28px;line-height:1.35;margin-top:10px';
    K.fit(dt, 824, 740, 28, ctx);
    if (Kit.box(left, ctx).y + Kit.box(left, ctx).h > 880) Scene.warn('11.3: the left column runs past y = 880');
    const tS = ctx.at('site-0.2');
    ctx.u = { L, lines, left, right, tS };
    window.__EVENTS__ = [];
  },
  render(t, ctx) {
    const u = ctx.u, S = Scene, P = ctx.params, d = ctx.duration, g = u.L.g;
    const fo = 1 - S.seg(t, d - P.fade_out_s, d, S.ease.linear);
    g.clearRect(0, 0, 1920, 1080); g.save(); g.translate(20 * Math.sin(t / d * Math.PI), 0);
    Kit.drawLines(g, u.lines, { color: 'b', width: 2, alpha: 0.25 * fo, progress: 1 }); g.restore();
    u.left.style.opacity = (S.seg(t, u.tS, u.tS + 0.6, S.ease.linear) * fo).toFixed(3);
    u.right.style.opacity = (S.seg(t, u.tS + 0.4, u.tS + 1.0, S.ease.linear) * fo).toFixed(3);
  },
});
</script></body></html>
