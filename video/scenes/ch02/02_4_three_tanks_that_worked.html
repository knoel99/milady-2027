<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>02.4 Three tanks that worked</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch02.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch02_kit.js"></script>
<style>
  .c2-xcard { position: absolute; top: 190px; width: 410px; height: 580px; box-sizing: border-box; border: 3px solid var(--fg-2); border-radius: 14px; background: var(--panel); padding: 20px 22px; z-index: 20; }
  .c2-xcard.dash { border-style: dashed; border-color: var(--muted); }
  .c2-xcard .nm { font-family: "Inter Display"; font-weight: 700; font-size: 40px; color: var(--fg); white-space: nowrap; }
  .c2-xcard .pl { font-size: 28px; color: var(--fg-2); white-space: nowrap; }
  .c2-xcard .yr { display: inline-block; margin-top: 8px; padding: 2px 10px; border: 2px solid var(--muted); border-radius: 6px; font-size: 28px; color: var(--fg-2); }
  .c2-xcard .ln { position: absolute; left: 22px; right: 22px; top: 356px; font-size: 30px; line-height: 1.22; color: var(--fg); }
  .c2-xcard .ft { position: absolute; left: 22px; bottom: 16px; font-size: 28px; font-style: italic; color: var(--muted); white-space: nowrap; }
  .c2-xcard svg { position: absolute; left: 0; top: 140px; }
</style>
</head><body><div id="stage"></div>
<script>
/* 02.4 Three tanks that worked (L1, NIGHT, CONTEXT). Four cards on a thin timeline, every word and number from
   params.cards: Riga (a field that oscillates and turns), Karlsruhe (52 spiral cells, a steady dipole), VKS (the
   only one whose dipole flips, at 'vks' + params.vks_flip_offset_s), DRESDYN (dashed: under way). */
Scene.define({
  duration: 30,
  register: 'night',
  cues: { three: 0.4, riga: 6.0, karlsruhe: 10.6, vks: 16.2, dresdyn: 21.0 },
  params: { cards: [], vks_flip_offset_s: 1.4 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C2.labOf(ctx, s, s);
    const cards = P.cards.length ? P.cards : [{ name: 'RIGA', place: '', year: '', line: '', glyph: 'rotating-oscillating', ref: '', solid: true }, { name: 'KARLSRUHE', place: '', year: '', line: '', glyph: 'steady-dipole', cells: 52, ref: '', solid: true }, { name: 'VKS', place: '', year: '', line: '', glyph: 'flipping-dipole', ref: '', solid: true }, { name: 'DRESDYN', place: '', year: '', line: '', glyph: 'none', ref: '', solid: false }];
    const svgNS = K.NS, CW = 410, GAP = 29, X0 = 96;
    const lCap = C2.label(st, lab('the only three liquid-sodium dynamos'), X0, 120, 'mono');
    const tl = K.svgLayer(ctx, 8); K.s('line', { x1: 96, x2: 1824, y1: 800, y2: 800, stroke: K.c('matter-dark'), 'stroke-width': 3 }, tl);
    const els = cards.map((cd, i) => {
      const e = K.el('div', { class: 'c2-xcard' + (cd.solid ? '' : ' dash') }, st); e.style.left = (X0 + i * (CW + GAP)) + 'px';
      K.el('div', { class: 'nm' }, e, cd.name); K.el('div', { class: 'pl' }, e, cd.place);
      const det = K.el('div', {}, e); det.style.opacity = 0; K.el('div', { class: 'yr' }, det, cd.year);   // may wrap to two lines inside its outline (28 px floor)
      const svg = K.s('svg', { width: CW - 6, height: 220, viewBox: `0 0 ${CW - 6} 220` }, e); svg.style.opacity = 0;
      const ln = K.el('div', { class: 'ln' }, e, cd.line); ln.style.opacity = 0; K.fit(ln, CW - 50, 4 * 1.22 * 30 + 4, 28, ctx);
      const ft = K.el('div', { class: 'ft' }, e, cd.ref); ft.style.opacity = 0; K.fit(ft, CW - 50, 40, 28, ctx);
      if (!cd.solid) { e.querySelectorAll('.nm, .pl').forEach((n) => { n.style.color = 'var(--muted)'; }); }
      return { e, det, svg, ln, ft, cd };
    });
    // pictograms (box 404 x 220, centre 202, 110)
    const grey = K.c('fg-2'), lw = { fill: 'none', stroke: grey, 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' };
    const arrow = (g, col) => { const a = K.s('g', {}, g); K.s('path', { d: 'M-60,0 H44 M28,-16 L60,0 L28,16', fill: 'none', stroke: K.c(col), 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, a); return a; };
    const pic = {};
    els.forEach(({ svg, cd }, i) => {
      const g = K.s('g', { transform: 'translate(202 110)' }, svg);
      if (cd.glyph === 'rotating-oscillating') { K.s('rect', { x: -150, y: -34, width: 220, height: 68, rx: 10, ...lw }, g);
        let d = ''; for (let k = 0; k <= 60; k++) { const x = -140 + 200 * k / 60; d += `${k ? 'L' : 'M'}${x.toFixed(1)},${(20 * Math.sin(k / 60 * 6 * Math.PI)).toFixed(1)}`; } K.s('path', { d, fill: 'none', stroke: K.c('u'), 'stroke-width': 4 }, g);
        const ag = K.s('g', { transform: 'translate(130 0)' }, g); pic[i] = { arrow: arrow(ag, 'b') }; }
      if (cd.glyph === 'steady-dipole') { K.s('circle', { r: 100, ...lw }, g); const n = cd.cells || 52; let k = 0;
        for (let y = -84; y <= 84 && k < n; y += 21) for (let x = -84; x <= 84 && k < n; x += 21) { if (x * x + y * y > 90 * 90) continue; K.s('path', { d: `M${x + 6},${y} A6,6 0 1 1 ${x},${y - 6}`, fill: 'none', stroke: K.c('u'), 'stroke-width': 2.5 }, g); k++; }
        if (k < n) S.warn(`02.4: drew ${k} of ${n} Karlsruhe cells`);
        const ag = K.s('g', { transform: 'rotate(-90) scale(1.4)' }, g); arrow(ag, 'b'); pic[i] = { breathe: ag }; }
      if (cd.glyph === 'flipping-dipole') { K.s('rect', { x: -160, y: -70, width: 320, height: 140, rx: 20, ...lw }, g);
        [-140, 140].forEach((x) => K.s('line', { x1: x, x2: x, y1: -50, y2: 50, ...lw, 'stroke-width': 7 }, g));
        [[-100, 1], [100, -1]].forEach(([x, s]) => K.s('path', { d: `M${x - 20},${-58} A24,10 0 1 ${s > 0 ? 1 : 0} ${x + 20},${-58}`, fill: 'none', stroke: K.c('u'), 'stroke-width': 4, 'marker-end': '' }, g));
        const ag = K.s('g', {}, g); arrow(ag, 'b'); pic[i] = { flip: ag }; }
      if (cd.glyph === 'none') { const cyl = K.s('g', {}, g); K.s('rect', { x: -110, y: -50, width: 220, height: 100, rx: 18, ...lw, stroke: K.c('muted') }, cyl);
        K.s('line', { x1: -150, x2: 150, y1: 0, y2: 0, stroke: K.c('muted'), 'stroke-width': 2, 'stroke-dasharray': '6 8' }, cyl);
        K.s('circle', { cx: 150, cy: -70, r: 28, fill: 'none', stroke: K.c('muted'), 'stroke-width': 3, 'stroke-dasharray': '6 7' }, g); pic[i] = { prec: cyl }; }
    });
    // pen circle around the VKS arrow
    const vi = cards.findIndex((cd) => cd.glyph === 'flipping-dipole');
    if (vi >= 0) K.pen(ctx, { kind: 'circle', box: { x: X0 + vi * (CW + GAP) + 132, y: 190 + 140 + 80, w: 146, h: 60 }, at: `vks+${(P.vks_flip_offset_s + 1.2).toFixed(2)}`, dur: 0.6, seed: 'vks' });
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    const T = { three: ctx.at('three-0.15'), lit: ['riga', 'karlsruhe', 'vks', 'dresdyn'].map((k) => ctx.at(k + '-0.15')), flip: ctx.at(`vks+${P.vks_flip_offset_s}`) };
    ctx.c2 = { T, els, pic, lCap, vi };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c2, T = c.T;
    C2.fadeEl(c.lCap, t, T.three + 0.3);
    c.els.forEach((x, i) => {
      const a = i < 3 ? Math.min(T.three, -0.3) + 0.25 * i : T.lit[3];   // base layout: the three cards slide in from frame 0
      const p = S.seg(t, a, a + 0.5, S.ease.outCubic);
      // which card is lit: the latest card whose cue has passed
      let cur = -1; for (let k = 0; k < 4; k++) if (t >= T.lit[k]) cur = k;
      let o = 1; if (cur >= 0 && cur < 3) o = i === cur ? 1 : 0.4; if (cur === 3) o = i === 2 ? 1 : (i === 3 ? 1 : 0.7);
      if (t > T.lit[3] + 2.0 && i === 3) o = 0.7;
      x.e.style.opacity = (p * o).toFixed(3); x.e.style.transform = `translateX(${(80 * (1 - p)).toFixed(1)}px)`; K.show(x.e, p > 0);
      const d = S.seg(t, T.lit[i] + 0.1, T.lit[i] + 0.5, S.ease.linear);
      [x.det, x.svg, x.ln, x.ft].forEach((e) => { e.style.opacity = d.toFixed(3); });
    });
    const P0 = c.pic;
    for (const k in P0) { const q = P0[k];
      if (q.arrow) { const a = 0.9 * (t - T.lit[0]), L = 0.65 + 0.35 * Math.cos(2.1 * (t - T.lit[0])); q.arrow.setAttribute('transform', `rotate(-90) scale(${(L * Math.cos(a)).toFixed(3)} ${L.toFixed(3)})`); }
      if (q.breathe) q.breathe.setAttribute('transform', `rotate(-90) scale(${(1.4 + 0.03 * Math.sin(2 * Math.PI * t / 3)).toFixed(3)})`);
      if (q.flip) q.flip.setAttribute('transform', `rotate(${(180 * S.spring((t - T.flip) / 0.9, 0.03)).toFixed(2)}) scale(1.3)`);
      if (q.prec) q.prec.setAttribute('transform', `rotate(${(14 * Math.sin(0.8 * (t - T.lit[3]))).toFixed(2)}) scale(1 ${(0.9 + 0.1 * Math.cos(0.8 * (t - T.lit[3]))).toFixed(3)})`);
    }
  },
});
</script></body></html>
