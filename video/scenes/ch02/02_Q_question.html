<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>ch02.Q Question for the supervisors</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch02.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch02_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* ch02.Q (question card Q3, no claim, no badge). Everything on the card from the script's "question". Behind it at
   10 %: the two green dials of 02.3 (Rm, Re), slowly turning. */
Scene.define({
  duration: 9.4,
  register: 'night',
  cues: { q: 0.5 },
  params: { bg_opacity: 0.1 },
  setup(ctx) {
    const K = Kit, svg = K.svgLayer(ctx, 2), bg = K.s('g', { opacity: ctx.params.bg_opacity }, svg);
    ctx.ptrs = [[420, 540], [1500, 540]].map(([x, y]) => { const g = K.s('g', { transform: `translate(${x} ${y})` }, bg);
      K.s('circle', { r: 220, fill: 'none', stroke: K.c('param'), 'stroke-width': 10 }, g); return K.s('line', { x1: 0, y1: 0, x2: 0, y2: -190, stroke: K.c('param'), 'stroke-width': 16, 'stroke-linecap': 'round' }, g); });
    K.questionCard(ctx, { chapter: 'ch02', category: 'runs', at: -0.4, whyAt: 'q+2.4', unblocksAt: 'q+4.6' });
  },
  render(t, ctx) { ctx.ptrs.forEach((p, i) => p.setAttribute('transform', `rotate(${(-40 + 20 * i + 8 * Math.sin(2 * Math.PI * t / 9 + i)).toFixed(2)})`)); },
});
</script></body></html>
