<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>02.6 VKS flips too</title>
<link rel="stylesheet" href="../../vendor/katex/katex.min.css">
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch02.css">
<script src="../../vendor/katex/katex.min.js"></script>
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/plot.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="ch02_kit.js"></script>
<style>
  .c2-lab { position: absolute; left: 1100px; top: 256px; width: 724px; box-sizing: border-box; padding: 22px 26px 20px; border: 3px solid var(--fg-2); border-radius: 14px; background: var(--panel); z-index: 22; }
  .c2-lab .tx { margin-top: 16px; font-size: 32px; line-height: 1.3; color: var(--fg); }
  .c2-lab .ft { margin-top: 14px; font-size: 28px; font-style: italic; color: var(--muted); }
</style>
</head><body><div id="stage"></div>
<script>
/* 02.6 VKS flips too (L1, NIGHT, CONTEXT). A side-view icon of VKS and two green knobs (disc 1, disc 2); the
   qualitative series of data/fig_vks.json (normal form, SCHEMATIC chip) drawn on from params.draw_from to
   params.draw_to, with its sign strip (Kit.barcode, same easing) and the corner needle flipping as the drawing head
   passes each sign change (found from the data); a separate LAB MEASUREMENT card (params.lab_card); on 'stripes'
   the 00.3 seafloor strip (params.seafloor_normal_Ma) under the VKS strip. */
Scene.define({
  duration: 25,
  register: 'night',
  cues: { speeds: 0.4, flips: 3.0, needle: 7.4, quick: 11.0, stripes: 13.8 },
  data: { vks: 'data/fig_vks.json' },
  params: { draw_from: 'flips', draw_to: 'quick+1.0', lab_card: '', seafloor_window_Ma: [0, 5], seafloor_normal_Ma: [] },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C2.labOf(ctx, s, s);
    const ser = ctx.data.vks.data.series, ts = ser.t, Ds = ser.D;
    const T = {}; ['speeds', 'flips', 'needle', 'quick', 'stripes'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    const tA = ctx.at(P.draw_from) - 0.15, tB = ctx.at(P.draw_to), dur = tB - tA;
    // icon and knobs
    const svg = K.svgLayer(ctx, 12), grey = K.c('fg-2');
    const ic = K.s('g', { transform: 'translate(180 210)' }, svg);
    K.s('rect', { x: -80, y: -40, width: 160, height: 80, rx: 12, fill: 'none', stroke: grey, 'stroke-width': 4 }, ic); [-62, 62].forEach((x) => K.s('line', { x1: x, x2: x, y1: -30, y2: 30, stroke: grey, 'stroke-width': 6 }, ic));
    K.knob(ctx, { x: 128, y: 420, r: 34, min: 0, max: 1, label: lab('disc 1'), showValue: false, labelDy: 84, at: -0.3, ticks: 6, keys: [{ at: -0.3, v: 0.5 }] });
    K.knob(ctx, { x: 236, y: 420, r: 34, min: 0, max: 1, label: lab('disc 2'), showValue: false, labelDy: 84, at: -0.3, ticks: 6, keys: [{ at: -0.3, v: 0.5 }, { at: 'speeds+0.4', v: 0.75, dur: 1.2 }] });
    // plot
    let dmax = 0; for (const v of Ds) dmax = Math.max(dmax, Math.abs(v));
    const X0 = 330, X1 = 1040;
    const PL = K.plot(ctx, { box: { x0: X0, x1: X1, y0: 240, y1: 470 }, at: 'flips-0.15', grid: false,
      x: { label: lab('time'), min: ts[0], max: ts[ts.length - 1], ticks: [] }, y: { label: lab('D, dipole'), min: -1.15 * dmax, max: 1.15 * dmax, ticks: [] } });
    K.s('line', { x1: X0, x2: X1, y1: PL.sy(0), y2: PL.sy(0), stroke: K.c('fg-2'), 'stroke-width': 2 }, PL.root);
    PL.curve({ x: ts, y: Ds, field: 'b', at: tA, dur, width: 4 });
    K.barcode(ctx, { box: { x: X0, y: 640, w: X1 - X0, h: 36 }, series: { t: ts, D: Ds }, domain: [ts[0], ts[ts.length - 1]], at: tA, dur });
    // sign changes -> needle flips when the head passes them (inverse of the inOutSine head)
    const flipsU = []; for (let i = 1; i < Ds.length; i++) if (Math.sign(Ds[i]) !== Math.sign(Ds[i - 1]) && Ds[i] !== 0) flipsU.push((ts[i] - ts[0]) / (ts[ts.length - 1] - ts[0]));
    const flipT = flipsU.map((p) => tA + dur * Math.acos(1 - 2 * p) / Math.PI);
    const N = K.needle(ctx, { corner: true, at: 'flips-0.15', flips: flipT.map((x) => ({ at: x, dur: 0.6 })), start: Ds[0] >= 0 ? 'north' : 'south' });
    window.__EVENTS__ = flipT.map((x) => ({ t: +x.toFixed(3), id: 'needle', gain_db: -16 }));
    ctx.c2n = N;
    K.chip(ctx, { text: C2.chipOf(ctx, /qualitative/, 'qualitative (normal form): durations are not those of VKS'), kind: 'schematic', maxWidth: 680, x: X0, y: 76, at: 'flips' });
    const lV = C2.label(st, lab('VKS, qualitative · minutes'), X0, 596, 'mono');
    const lFl = C2.label(st, lab('flips every minute or two, irregularly'), X0, 800, 'big');
    // lab card
    const card = K.el('div', { class: 'c2-lab' }, st);
    const ch = K.el('div', { class: 'kit-chip measured' }, card, K.upper(lab('LAB MEASUREMENT'))); ch.style.position = 'relative';
    K.el('div', { class: 'tx' }, card, P.lab_card || C2.labOf(ctx, /^discs at/, ''));
    K.el('div', { class: 'ft' }, card, C2.refL2(C2.chipOf(ctx, /Berhanu/, 'LAB MEASUREMENT · Berhanu et al. 2007')));
    // seafloor strip (as in 00.3)
    const [w0, w1] = P.seafloor_window_Ma, Nm = P.seafloor_normal_Ma.map(([a, b]) => [Math.max(w0, a), Math.min(w1, b)]).filter(([a, b]) => b > a).sort((p, q) => p[0] - q[0]);
    const runs = []; let x = w0; for (const [a, b] of Nm) { if (a > x) runs.push([x, a, -1]); runs.push([a, b, 1]); x = b; } if (x < w1) runs.push([x, w1, -1]);
    const sea = K.s('g', {}, svg), xOf = (m) => X1 - (X1 - X0) * (m - w0) / (w1 - w0);
    runs.forEach(([a, b, s]) => K.s('rect', { x: xOf(b), y: 740, width: Math.max(2, xOf(a) - xOf(b)), height: 36, fill: K.c(s > 0 ? 'b' : 'b-neg') }, sea));
    K.s('rect', { x: X0, y: 740, width: X1 - X0, height: 36, fill: 'none', stroke: K.c('matter-dark'), 'stroke-width': 2 }, sea);
    const lS = C2.label(st, lab('seafloor · millions of years'), X0, 696, 'mono');
    K.badge(ctx, { kind: 'CONTEXT', at: -0.3 });
    K.formulaLayer(ctx);
    ctx.c2 = { T, ic, card, sea, lS, lV, lFl, flipT };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, c = ctx.c2, T = c.T, fade = C2.fadeEl;
    c.ic.style.opacity = S.seg(t, -0.4, -0.1, S.ease.linear);
    fade(c.lV, t, T.flips + 0.4);
    fade(c.lFl, t, T.needle + 0.2, T.stripes);
    // corner needle pulse on 'needle'
    const pu = Math.sin(Math.PI * S.seg(t, T.needle, T.needle + 0.4, S.ease.inOutSine));
    const nr = ctx.c2n.root; nr.style.transformOrigin = '1772px 176px'; nr.style.transform = pu > 0 ? `scale(${(1 + 0.06 * pu).toFixed(4)})` : '';
    const pc = S.seg(t, T.quick, T.quick + 0.5, S.ease.outCubic); c.card.style.opacity = pc.toFixed(3); c.card.style.transform = `translateX(${(80 * (1 - pc)).toFixed(1)}px)`; K.show(c.card, pc > 0);
    const ps = S.seg(t, T.stripes, T.stripes + 0.6, S.ease.linear); c.sea.style.opacity = ps.toFixed(3); fade(c.lS, t, T.stripes + 0.2);
  },
});
</script></body></html>
