<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>02.1 Frozen threads</title>
<link rel="stylesheet" href="../../runtime/theme.css">
<link rel="stylesheet" href="ch02.css">
<script src="../../runtime/scene.js"></script>
<script src="../../runtime/components/kit.js"></script>
<script src="../../runtime/components/hud.js"></script>
<script src="../../runtime/components/field.js"></script>
<script src="../../runtime/components/motifs.js"></script>
<script src="../../runtime/components/cards.js"></script>
<script src="ch02_kit.js"></script>
</head><body><div id="stage"></div>
<script>
/* 02.1 Frozen threads (L1, NIGHT, CONTEXT, SCHEMATIC). Two inks (M3) in the page: a 4 x 2 cellular flow (blue
   segments + tracers) carries ONE vermillion material line (Scene.stepper, fixed step), brightness by local stretch
   (log, clipped at params.stretch_clip). From 'smudge' the line is a diffusing ribbon of width sqrt(2 kappa tau);
   on 'split' the same flow and line run in two panels that differ only by kappa (params.kappa_px2_s). */
Scene.define({
  duration: 35,
  register: 'night',
  cues: { motion: 3.4, threads: 6.6, stretch: 10.4, smudge: 14.4, diffusivity: 17.4, split: 21.0, sharp: 22.8, blur: 26.4 },
  params: { cells: [4, 2], amp_px_s: 240, line_y_frac: 0.4, tracers: 1500, trail: 12, seed: 7, stretch_clip: 8.0, kappa_px2_s: { small: 2.0, large: 180.0 }, time_scale: 0.4 },
  setup(ctx) {
    const K = Kit, S = Scene, P = ctx.params, st = ctx.stage, lab = (s) => C2.labOf(ctx, s, s);
    const title = (ctx.script.onscreen && ctx.script.onscreen.title) || 'Stretch, smudge, and three tanks of sodium';
    K.chapterCard(ctx, { num: '02', title, level: 'L1', levelFrom: 'L1', at: -0.3, out: 'motion-0.3', railHold: 3 });
    K.badge(ctx, { kind: 'CONTEXT', at: 'motion-0.15' });
    // flow domain (full view): W x H px, cells[0] x cells[1]
    const W = 1500, H = 750, [cx, cy] = P.cells, kx = Math.PI * cx / W, ky = Math.PI * cy / H, A = P.amp_px_s;
    const F = (x, y) => [A * Math.sin(kx * x) * Math.cos(ky * y), -A * Math.cos(kx * x) * Math.sin(ky * y)];
    const N0 = 240, ly = H * P.line_y_frac, seg0 = W / N0, dt = 1 / 120, maxPts = 14000;
    const init = () => { const p = []; for (let i = 0; i <= N0; i++) p.push(W * i / N0, ly); return { p, s: new Float32Array(N0 + 1).fill(1) }; };
    const step = (st0) => { const p = st0.p;
      for (let i = 0; i < p.length; i += 2) { const v1 = F(p[i], p[i + 1]), v2 = F(p[i] + 0.5 * dt * v1[0], p[i + 1] + 0.5 * dt * v1[1]); p[i] += dt * v2[0]; p[i + 1] += dt * v2[1]; }
      if (p.length / 2 < maxPts) { const q = [p[0], p[1]]; let changed = false;
        for (let i = 2; i < p.length; i += 2) { const dx = p[i] - p[i - 2], dy = p[i + 1] - p[i - 1]; if (dx * dx + dy * dy > 64 && q.length / 2 < maxPts) { q.push(p[i - 2] + dx / 2, p[i - 1] + dy / 2); changed = true; } q.push(p[i], p[i + 1]); }
        if (changed) st0.p = q; }
      return st0; };
    const line = S.stepper(init, step, dt);
    // tracers: closed-form? no: a second stepper (fixed step), seeded positions
    const rng = S.rng('tr' + P.seed), nT = Math.min(700, P.tracers);
    const tinit = () => { const a = new Float32Array(2 * nT); const r2 = S.rng('tr' + P.seed); for (let i = 0; i < nT; i++) { a[2 * i] = W * r2(); a[2 * i + 1] = H * r2(); } return a; };
    const tstep = (a) => { const h = 1 / 30; for (let i = 0; i < a.length; i += 2) { const v = F(a[i], a[i + 1]); a[i] += h * v[0]; a[i + 1] += h * v[1]; } return a; };
    const trc = S.stepper(tinit, tstep, 1 / 30); void rng;
    // blue flow segments (static grid of aligned dashes)
    const dashes = []; for (let i = 0; i < 40; i++) for (let j = 0; j < 20; j++) { const x = (i + 0.5) * W / 40, y = (j + 0.5) * H / 20, v = F(x, y), m = Math.hypot(v[0], v[1]); if (m > 0.15 * A) dashes.push([x, y, v[0] / m, v[1] / m]); }
    const L = K.canvasLayer(ctx, 6, { x: 0, y: 0, w: 1920, h: 880 }, null, { reset: true });
    // panel geometry: full view box, and the two panels (same aspect 2:1)
    const full = { x: 210, y: 110, s: 1 }, pw = 860, ph = 430, panels = [{ x: 80, y: 250, s: pw / W }, { x: 980, y: 250, s: pw / W }];
    const lab2 = (s, x, y, cls) => C2.label(st, lab(s), x, y, cls);
    const lStr = lab2('stretching', 0, 0, 'big'), lDif = lab2('diffusion', 0, 0, 'big'), lEta = lab2('magnetic diffusivity', 0, 0, 'big');
    lDif.style.color = 'var(--muted)'; lEta.style.color = 'var(--param)';
    const pl = [['small diffusivity', 'good conductor', 'stretching wins'], ['large diffusivity', 'poor conductor', 'diffusion wins']].map((a, i) => a.map((s, k) => {
      const e = lab2(s, panels[i].x + pw / 2, k === 0 ? 150 : k === 1 ? 196 : 700, 'center' + (k === 0 || k === 2 ? ' big' : '')); if (k === 0) e.style.color = 'var(--param)'; return e; }));
    K.lowerThird(ctx, { kind: 'reference', l1: 'Reference', l2: C2.refL2(C2.chipOf(ctx, /Alfv/, 'REFERENCE · Alfvén 1942 · frozen flux')), at: 'threads-0.15', hold: 4 });
    K.chip(ctx, { text: 'SCHEMATIC', kind: 'schematic', x: 1824, y: 124, anchor: 'tr', at: 'motion' });
    const T = {}; ['motion', 'threads', 'stretch', 'smudge', 'diffusivity', 'split', 'sharp', 'blur'].forEach((k) => { T[k] = ctx.at(k + '-0.15'); });
    // pen arrow along the brightest fold at 'stretch+0.6' (found from the same stepper)
    const s0 = line(P.time_scale * Math.max(0, T.stretch + 0.6 - T.threads)), p = s0.p; let best = 0, bi = 2;
    for (let i = 2; i < p.length - 40; i += 2) { const d = Math.hypot(p[i] - p[i - 2], p[i + 1] - p[i - 1]); if (d > best) { best = d; bi = i; } }
    const ax = full.x + p[bi], ay = full.y + p[bi + 1];
    const tx = Math.min(1500, Math.max(300, ax - 160)), ty = Math.min(700, ay + 170);   // the arrow comes up from below the fold
    K.pen(ctx, { kind: 'arrow', from: [tx, ty], to: [ax + 10, ay - 10], bend: 0.2, at: 'stretch+0.6', dur: 0.5, out: 'smudge-0.2', seed: 'fold' });
    lStr.style.left = (tx - 60) + 'px'; lStr.style.top = (ty + 8) + 'px';
    line(0);   // reset the stepper (setup must not leave it advanced)
    ctx.c2 = { T, line, trc, nT, dashes, L, full, panels, W, H, P, lStr, lDif, lEta, pl, seg0 };
  },
  render(t, ctx) {
    const S = Scene, K = Kit, P = ctx.params, c = ctx.c2, T = c.T, g = c.L.g, fade = C2.fadeEl;
    g.clearRect(0, 0, 1920, 880);
    const on = S.seg(t, T.motion, T.motion + 0.6, S.ease.linear); if (on <= 0) { [c.lStr, c.lDif, c.lEta].forEach((e) => K.show(e, false)); c.pl.flat().forEach((e) => K.show(e, false)); return; }
    const sp = S.seg(t, T.split, T.split + 1.2, S.ease.inOutCubic);
    const st0 = c.line(P.time_scale * Math.max(0, t - T.threads)), p = st0.p, tr = c.trc(P.time_scale * Math.max(0, t - T.motion));   // flow time = scene time x time_scale (schematic pace)
    const kS = P.kappa_px2_s.small, kL = P.kappa_px2_s.large, tau = Math.max(0, t - T.smudge), tauS = Math.max(0, Math.min(t, T.split) - T.smudge), tauL = Math.max(0, t - T.split);
    const sig = [Math.sqrt(2 * kS * tau), Math.sqrt(2 * (kS * tauS + kL * tauL))];
    const views = sp <= 0 ? [{ ...c.full, k: 0 }] : [0, 1].map((i) => { const pn = c.panels[i]; return { x: c.full.x + (pn.x - c.full.x) * sp, y: c.full.y + (pn.y - c.full.y) * sp, s: 1 + (pn.s - 1) * sp, k: i }; });
    const clip = Math.log(P.stretch_clip);
    views.forEach((v) => {
      g.save(); g.beginPath(); g.rect(v.x - 2, v.y - 2, c.W * v.s + 4, c.H * v.s + 4); g.clip();
      g.translate(v.x, v.y); g.scale(v.s, v.s);
      // frame of a panel
      if (sp > 0) { g.strokeStyle = K.c('matter-dark'); g.lineWidth = 3 / v.s; g.strokeRect(0, 0, c.W, c.H); }
      // blue flow dashes and tracers
      g.strokeStyle = K.rgba(K.c('u'), 0.35 * on); g.lineWidth = 2.5 / Math.max(0.7, v.s); g.beginPath();
      for (const [x, y, ux, uy] of c.dashes) { g.moveTo(x - 12 * ux, y - 12 * uy); g.lineTo(x + 12 * ux, y + 12 * uy); } g.stroke();
      g.fillStyle = K.rgba(K.c('u'), 0.8 * on); for (let i = 0; i < c.nT; i++) g.fillRect(tr[2 * i] - 2.5, tr[2 * i + 1] - 2.5, 5, 5);
      // the material line: grey halo + vermillion core; brightness by local stretch (4 buckets)
      const sg = sig[v.k] * (sp > 0 || v.k === 0 ? 1 : 1);
      if (t >= T.threads - 0.3 || true) {
        const peak = Math.min(1, 3.5 / (3.5 + sg));
        if (sg > 0.5) { g.strokeStyle = K.rgba(K.c('matter'), Math.min(0.5, 0.12 + 0.4 * (1 - peak))); g.lineWidth = 3 + 2.4 * sg; g.lineJoin = g.lineCap = 'round';
          g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.stroke(); }
        const buckets = [[], [], [], []];
        for (let i = 2; i < p.length; i += 2) { const d = Math.hypot(p[i] - p[i - 2], p[i + 1] - p[i - 1]); void d; }
        // stretch of each point: arc length per original parameter step, estimated from local density of points
        let acc = 0, start = 0;
        for (let i = 2; i < p.length; i += 2) { acc += Math.hypot(p[i] - p[i - 2], p[i + 1] - p[i - 1]);
          if ((i / 2) % 8 === 0 || i === p.length - 2) { const nseg = (i - start) / 2, str = acc / (nseg * 6.0) * (1 + nseg * 6.0 > 0 ? 1 : 1);
            const lv = Math.max(0, Math.min(3, Math.floor(4 * Math.log(Math.max(1, (acc / Math.max(1, nseg)) / c.seg0 * (p.length / 2) / 241)) / clip)));
            buckets[lv].push(start, i); start = i; acc = 0; void str; } }
        const alpha = [0.55, 0.7, 0.85, 1], width = [2.5, 3.2, 4, 5];
        for (let b = 0; b < 4; b++) { if (!buckets[b].length) continue; g.strokeStyle = K.c('b'); g.globalAlpha = alpha[b] * peak * on; g.lineWidth = width[b] + 0.8 * Math.min(sg, 6); g.lineCap = g.lineJoin = 'round';
          g.beginPath(); const B = buckets[b]; for (let j = 0; j < B.length; j += 2) { g.moveTo(p[B[j]], p[B[j] + 1]); for (let i = B[j] + 2; i <= B[j + 1]; i += 2) g.lineTo(p[i], p[i + 1]); } g.stroke(); }
        g.globalAlpha = 1;
      }
      g.restore();
    });
    // labels
    fade(c.lStr, t, T.stretch + 0.6, T.smudge - 0.2);
    const lx = 1300, lyy = 760;
    c.lDif.style.left = lx + 'px'; c.lDif.style.top = '760px'; c.lEta.style.left = lx + 'px'; c.lEta.style.top = '806px';
    fade(c.lDif, t, T.smudge + 0.2, T.split); fade(c.lEta, t, T.diffusivity, T.split); void lyy;
    c.pl.forEach((a, i) => { fade(a[0], t, T.split + 0.9); fade(a[1], t, T.split + 1.1); fade(a[2], t, i ? T.blur + 1.0 : T.sharp + 1.0); });
  },
});
</script></body></html>
