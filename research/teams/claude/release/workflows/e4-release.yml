# E4 release: data in the MFF format, model files, catalogue, checksums, published as a GitHub release.
#
# The files cannot leave the session that ran the experiments, so this workflow rebuilds them from the committed code, on the
# CPU of the runners (experiments/e4_release_build.sh): the data once, then W9 (with G0 and G1) trained and evaluated and the
# map of W16 for each of the five seeds, then the folder of the release and its assets. Nothing here uses a GPU.
# It runs when research/teams/claude/release/REQUEST changes on the branch of team claude, or by hand.
name: e4-release

on:
  push:
    branches: ["claude/modest-newton-zx8fqs"]
    paths: ["research/teams/claude/release/REQUEST"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e4-release
  cancel-in-progress: false

env:
  E4_RELEASE_BUILD: "1"
  E4_N_RECOLOUR: "32768"
  RELEASE_TAG: e4-data-v1.0
  MILADY_GIT_COMMIT: ${{ github.sha }}

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/env/requirements.txt
      - name: Install the pinned dependencies
        run: |
          python -m pip install -r infra/env/requirements.txt
          python -m pip install --no-deps -e .
      - name: Data, MFF files, reference statistics
        run: bash experiments/e4_release_build.sh data
      - uses: actions/upload-artifact@v4
        with:
          name: e4-npz
          retention-days: 3
          compression-level: 0
          path: |
            experiments/data_e4/
            experiments/results/e4_data.json
            experiments/results/e4_reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: e4-mff
          retention-days: 3
          compression-level: 0
          path: experiments/data_e4_mff/

  model:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/env/requirements.txt
      - name: Install the pinned dependencies
        run: |
          python -m pip install -r infra/env/requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: e4-npz
          path: experiments/
      - name: Train and evaluate W9, G0 and G1; map of W16
        run: bash experiments/e4_release_build.sh model ${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        with:
          name: e4-model-${{ matrix.seed }}
          retention-days: 3
          compression-level: 0
          path: |
            experiments/results/e4_mhd3d_s${{ matrix.seed }}.json
            experiments/results/e4_model_W9_skip_sym_s${{ matrix.seed }}.pt
            experiments/results/logs/release_s${{ matrix.seed }}.log
            experiments/release_models/

  release:
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/env/requirements.txt
      - name: Install the pinned dependencies
        run: |
          python -m pip install -r infra/env/requirements.txt
          python -m pip install --no-deps -e .
      - uses: actions/download-artifact@v4
        with:
          name: e4-npz
          path: experiments/
      - uses: actions/download-artifact@v4
        with:
          name: e4-mff
          path: experiments/data_e4_mff/
      - uses: actions/download-artifact@v4
        with:
          pattern: e4-model-*
          merge-multiple: true
          path: experiments/
      - name: Release folder
        run: |
          bash experiments/e4_release_build.sh assemble "$RUNNER_TEMP/e4_release" \
            "https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          ls -la "$RUNNER_TEMP/e4_release"
      - name: Reload each law from the release folder and draw samples
        run: |
          for law in G0 G1 W9 W16; do
            python experiments/e4_release_example.py --dir "$RUNNER_TEMP/e4_release" --law "$law" --seed 0 --eta 0.04899 --n 64
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/e4_release"
          sha256sum -c SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --repo "${{ github.repository }}" --clobber ./*
            gh release edit "$RELEASE_TAG" --repo "${{ github.repository }}" --notes-file README.md
          else
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
              --title "E4 data set 1.0 (MFF), model files and catalogue" --notes-file README.md ./*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: e4-release-small-files
          retention-days: 30
          path: |
            ${{ runner.temp }}/e4_release/README.md
            ${{ runner.temp }}/e4_release/manifest.json
            ${{ runner.temp }}/e4_release/SHA256SUMS
            ${{ runner.temp }}/e4_release/catalog.json
            ${{ runner.temp }}/e4_release/e4_release_w16.json
