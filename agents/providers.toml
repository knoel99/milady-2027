# Maps the provider-neutral fields of agents/roles/*.md to each tool's agent format.
# tools/sync_agents.py reads this file. Add a section per provider when it is used;
# fill model names from that provider's current documentation, never from memory.
#
# Sections with format = "none" are a catalogue: no generator exists yet for that tool.
# Their model names are display names from the Artificial Analysis Intelligence Index v5.0.1
# chart (supplied by the user on 2026-11-12), not API identifiers: check each provider's
# documentation for the exact id before using it. [index] holds the chart's score and the
# reasoning setting it was measured at. Tiers: frontier = the provider's best model on the
# chart, standard = the next one, light = the smallest; a missing tier means the chart
# lists no such model.

[claude]
output_dir = ".claude/agents"
format = "claude-code"

[claude.tier]
frontier = "fable"
standard = "sonnet"
light = "haiku"

[claude.reasoning]
low = "low"
medium = "medium"
high = "high"
max = "max"

[claude.index]
"Claude Fable 5.2 (max)" = 65
"Claude Opus 5.5 (max)" = 59
"Claude Sonnet 5.5 (max)" = 55
"Claude Fable 5.1 (max)" = 49
"Claude Haiku 5.5 (max)" = 36

[claude.tools]
base = ["Read", "Grep", "Glob"]
shell = ["Bash"]
web = ["WebSearch", "WebFetch"]
write = ["Write", "Edit", "NotebookEdit"]

