[deepseek.api]
# Read by tools/call_model.py. base_url and the effort field: to confirm with `check_calls.py preflight`.
style = "openai-chat"
base_url = "https://api.deepseek.com"
key_env = "DEEPSEEK_API_KEY"
effort_field = "reasoning_effort"
extra = { thinking = { type = "enabled" } }

[deepseek.harness]
# DeepSeek's own harness, developer preview ("THERE WILL BE COMPATIBILITY-BREAKING CHANGES"), MIT.
# https://github.com/deepseek-ai/deepseek-harness, apps/cli/reference/README.md. Pin the version on the pilot.
name = "DeepSeek Harness (dsh, developer preview)"
install = "npm install -g @deepseek-ai/dsh"
setup = "npm install -g @deepseek-ai/dsh@0.2.2-rc.1 && dsh --profile headless --dump-config >/dev/null 2>&1; mkdir -p ~/.dsh/profiles/headless && printf '%s\\n' \"- id: agent-default-model\" \"  config:\" \"    provider: deepseek-official\" \"    model: !!js process.env.DSH_MODEL || 'deepseek-flash'\" \"- id: llm-deepseek\" \"  config:\" \"    reasoningEffort: !!js process.env.DSH_REASONING_EFFORT || 'high'\" > ~/.dsh/profiles/headless/cordis.patch.yml"  # tested 2026-11-13: both variables reach the API
effort_source = "provider"
command = ["dsh", "--profile", "headless", "--json", "--approval-policy", "never", "{prompt}"]
env = { DSH_MODEL = "{model}", DSH_REASONING_EFFORT = "{effort}" }
effort_support = "yes, per run through DSH_MODEL and DSH_REASONING_EFFORT read by the profile patch of setup (values off, low, high, max; tested 2026-11-13)"

[deepseek.harness_fallback]
# Claude Code through the Anthropic-compatible endpoint: used if dsh fails on the pilot.
# Read by tools/run_role.py. From the official docs on 2026-11-12; confirm with a dry run.
name = "Claude Code (DeepSeek Anthropic endpoint)"
install = "npm install -g @anthropic-ai/claude-code"
setup = "npm install -g @anthropic-ai/claude-code"  # run once on the team VM; unverified until the first launch
effort_source = "level"  # level: role level as is; provider: [reasoning] value; none: not settable per call
command = ["claude", "-p", "{prompt}", "--model", "{model}", "--effort", "{effort}", "--max-turns", "{max_turns}", "--permission-mode", "bypassPermissions", "--output-format", "json"]
env = { ANTHROPIC_BASE_URL = "https://api.deepseek.com/anthropic", ANTHROPIC_AUTH_TOKEN = "$DEEPSEEK_API_KEY", ANTHROPIC_DEFAULT_OPUS_MODEL = "deepseek-flash", ANTHROPIC_DEFAULT_SONNET_MODEL = "deepseek-flash", ANTHROPIC_DEFAULT_HAIKU_MODEL = "deepseek-flash" }
