# Maps the provider-neutral fields of agents/roles/*.md to each tool's agent format.
# tools/sync_agents.py reads this file. Add a section per provider when it is used;
# fill model names from that provider's current documentation, never from memory.
#
# Sections with format = "none" are a catalogue: no generator exists yet for that tool.
# Models: the Artificial Analysis Intelligence Index v5.0.1 chart supplied by the user on
# 2026-11-12 ([index]: chart score, with the reasoning setting it was measured at).
# API ids, reasoning parameters and CLI facts: read in each provider's official documentation
# on 2026-11-12 by research sub-agents (quotes relayed through page summaries, not re-read
# verbatim); `docs` lists the pages, `unconfirmed` what the documentation did not settle.
# Recheck before use: ids and values change.
#
# Tiers: frontier = the provider's best model on the chart, standard = the next one,
# light = the smallest; a missing tier means the chart lists no such model.
# [<provider>.reasoning] maps the role levels (low, medium, high, max) to the value of the
# provider's `reasoning_param`; a missing level has no documented equivalent.
# [<provider>.cli]: the provider's own coding-agent CLI, whether it reads AGENTS.md, and where
# file-defined sub-agents live (the target of a future generator).

[claude]
output_dir = ".claude/agents"
format = "claude-code"

[claude.tier]
frontier = "fable"
standard = "sonnet"
light = "haiku"

[claude.reasoning]
low = "low"
medium = "medium"
high = "high"
max = "max"

[claude.index]
"Claude Fable 5.2 (max)" = 65
"Claude Opus 5.5 (max)" = 59
"Claude Sonnet 5.5 (max)" = 55
"Claude Fable 5.1 (max)" = 49
"Claude Haiku 5.5 (max)" = 36

[claude.tools]
base = ["Read", "Grep", "Glob"]
shell = ["Bash"]
web = ["WebSearch", "WebFetch"]
write = ["Write", "Edit", "NotebookEdit"]

