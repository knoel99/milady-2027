[google.tier]
frontier = "gemini-4-carbon"
standard = "gemini-3.8-flash"

[google.reasoning]
low = "low"
medium = "medium"
high = "high"
max = "high"

[google.index]
"Gemini 4 Carbon (high)" = 60
"Gemini 3.8 Flash (high)" = 31

[google.cli]
name = "Gemini CLI"
agents_md = "only if configured: context.fileName in settings.json (default GEMINI.md)"
subagents = ".gemini/agents/*.md, YAML header: name, description, kind, tools, mcpServers, model, temperature, max_turns, timeout_mins"

