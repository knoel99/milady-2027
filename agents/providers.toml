# ==========================================================================================
# Fast options, read in the official documentation on 2026-11-12 (same caveats as above).
# parameter: a request field that serves the same model faster; models: base id -> faster
# model id; gain and price as stated by the provider. A provider without [x.fast] has no
# documented fast option for the models above.
# ==========================================================================================

[claude.fast]
parameter = 'speed = "fast" (Messages API)'
applies_to = ["claude-fable-5-2", "claude-opus-5-5"]
gain = "up to 2.5x output tokens per second"
price = "Fable 5.2: $16 / $80 per MTok; Opus 5.5: $8 / $40 per MTok (input / output)"
cli = '/fast in Claude Code, or "fastMode": true in settings; falls back to Opus when the model has no fast mode'
unconfirmed = ["-fast model ids exist only on Microsoft Foundry", "no fast mode for Sonnet 5.5 or Haiku 5.5"]

[openai.fast]
parameter = 'service_tier = "fast" (formerly "priority"), or "ultrafast" for gpt-6-astra and gpt-6.1-sol'
applies_to = ["gpt-6-astra", "gpt-6.1-sol", "gpt-6.1-terra", "gpt-6-luna"]
gain = "fast: up to 2.5x (figure given for an earlier model); ultrafast: up to 8x Astra standard, in Codex"
price = "fast: per-token premium (2x for the documented example); ultrafast: 6x credits in Codex"
cli = '/fast in Codex, or service_tier = "fast" in config.toml; ultrafast has no documented toggle'
unconfirmed = ["speed and price multipliers for the GPT-6.x models"]

[google.fast]
parameter = 'service_tier = "priority" (preview); Flex and Batch are slower and 50% cheaper'
applies_to = ["gemini-4-carbon", "gemini-3.8-flash"]
gain = "second-level response times; overflow is downgraded to standard (x-gemini-service-tier header)"
price = "75-100% above standard"
cli = "none documented (Gemini CLI replaced by Antigravity CLI, not checked)"
unconfirmed = ["service_tier value for Flex", "fast toggle in Antigravity CLI"]

[xai.fast]
parameter = 'service_tier = "priority" (billed 2x)'
applies_to = []
gain = "not quantified"
price = "priority: 2x standard; Grok 4.7 Fast (Cursor and Grok Build only, no public API id): 2x, 1.5x above 200k context"
cli = "Grok Build serves Grok 4.7 Fast; no documented toggle"
unconfirmed = ["whether grok-4.7 accepts service_tier priority"]

[moonshot.fast]
models = { "kimi-k3.1-pro" = "kimi-k3.1-pro-highspeed" }
gain = "about 2-3x"
price = "not shown on the pricing page"
cli = "Kimi Code CLI: /model, then k3.1-pro-highspeed (about 2x quota, Pro plan and above)"
unconfirmed = ["API price of the highspeed variant"]

[alibaba.fast]
models = { "qwen3.8-max-0902" = "qwen3.8-flash" }
gain = "a separate cheaper and faster tier, not a speed-up of the same model"
price = "not shown"
cli = "none documented"
unconfirmed = ["whether service_tier priority is honoured for Qwen models"]

[deepseek.fast]
models = {}
gain = "deepseek-flash is already the light tier next to deepseek-v4-pro; no faster tier or priority parameter"
price = "off-peak / peak per 1M tokens: input miss $0.15 / $0.30, output $0.60 / $1.20"

[zhipu.fast]
models = { "glm-5.3" = "glm-5.3-flashx" }
gain = "glm-5.3-flashx: 200 tokens/s; glm-5.3-flash: a lighter variant (3x Coding Plan quota)"
price = "not shown officially"
unconfirmed = ["fast toggle in ZCode", "glm-5.3-flashx is not yet in the Coding Plan"]

[xiaomi.fast]
models = { "mimo-v2.6-pro" = "mimo-v2.6-pro-ultraspeed" }
gain = "up to 20x (third-party sources)"
price = "about 10x standard Pro (third-party sources)"
unconfirmed = ["everything: the official pages are JS-rendered and could not be read", "mimo-v2.6-flash"]

[mistral.fast]
